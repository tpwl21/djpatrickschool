[fr]
title      = "Closing — Easy"
short_desc = "La track dont ils se souviendront. Comment la choisir et la faire atterrir."
description = "Le closing est une compétence à part — distincte du peaking. Cette leçon te donne les règles concrètes pour choisir et jouer une closer."
recap = [
  "Le closing n'est **pas un ralentissement** — c'est un arc final qui se termine par un moment mémorable.",
  "Ta closer n'est **pas ta plus grosse track** — c'est la bonne track pour l'émotion que tu as construite.",
  "Énergie de la closer : **3–4**, pas 5. L'impact corporel c'est pour le peak. La closer c'est pour la mémoire.",
  "**Ne jamais annoncer 'dernière track'** — la réalisation est la récompense.",
  "**Try this :** enregistre les 10 dernières minutes de ton prochain set et réécoute dans les 48h.",
]

[[fr.pages]]
title   = "Closing ≠ ralentissement"
content = """
Beaucoup de nouveaux DJs pensent au closing comme à *jouer des tracks plus lentes à la fin*. C'est du warmdown, pas du closing.

Le closing est son propre arc :
- Il commence en **énergie afterpeak** (4), pas en descente depuis le peak (5)
- Il a une **direction** — il construit vers un dernier moment final
- Il se termine par **une track** dont la foule se souviendra

Ton boulot c'est de délivrer un seul moment que la foule racontera le lendemain. Tout ce qui est dans la section closing est un setup pour ce drop — **la closer**.

**Try this à ta prochaine session chez toi :** pratique une section de closing de 15 minutes. Choisis la track closer en premier, puis construis en arrière — quelles 2–3 tracks la mettraient parfaitement en place ?
"""

[[fr.pages]]
title   = "Comment choisir une closer"
content = """
Voici les règles pour choisir une closer :

1. **Pas ta plus grosse track.** La plus grosse c'est pour le peak. La closer c'est pour la mémoire, pas l'impact corporel.

2. **Légèrement inattendue.** Les meilleures closers sonnent *évident* avec du recul — la foule ne les voyait pas venir, mais elles ont du sens parfait. C'est le move signature.

3. **Énergie 3–4, pas 5.** Une closer à l'énergie 5 n'est qu'une autre track de peak. Une closer à 3–4 donne à la foule une respiration, une résolution, un sentiment d'*arrivée*.

4. **Elle doit sonner toi.** Les tracks de peak sont du vocabulaire partagé. Ta closer est ton dialecte. Quand les gens décriront ton set plus tard, ils devront dire *ce dernier morceau c'était tellement [ton nom]*.

5. **Ne l'annonce jamais.** Si tu dis "dernière track de la soirée", tu spoil l'atterrissage. La foule doit réaliser que c'est la closer quand les lumières remontent — et cette réalisation EST la récompense émotionnelle.

**Try this :** regarde ta librairie DJ maintenant et trouve 3 tracks qui pourraient être une closer. Écris-les. Amène-les à ton prochain gig.
"""

[[fr.pages]]
title   = "Le principe Villalobos"
content = """
Ricardo Villalobos joue des sets de 7–8h où *il ne se passe presque rien*. De longues étendues minimales. Aucun banger évident.

Et ses closings sont légendaires.

Pourquoi ? Parce qu'il passe 7h à attirer la foule dans une transe profonde — et la closer est le moment qui la casse. Une seule track. Un drop.

Le closing atterrit avec le poids de tout ce qui a précédé.

**La leçon qui s'adapte à toutes les longueurs de set :** même dans un set de 2h, si tu as construit une frame de groove cohérente pendant 1h50, tes 10 dernières minutes sonneront disproportionnellement puissantes. La piste d'envol fait l'atterrissage.

**Try this :** la prochaine fois que tu écoutes un set DJ (YouTube, RA, Mixcloud), saute aux 20 dernières minutes. Remarque comment le closing sonne. Est-ce qu'il atterrit ? Est-ce que ça sonne comme une fin naturelle ? Apprends à reconnaître les bons closings en les écoutant.
"""

[[fr.pages]]
title   = "La sortie technique"
content = """
Comment tu quittes la salle compte presque autant que ce que tu joues.

**Fais ça :**
- Laisse la track closer jouer complètement — ne la coupe pas tôt
- Fade le bas progressivement sur 20–30 secondes (sub → bass → mediums → aigus)
- Ne joue pas *une de plus* après la closer — la mémoire de la foule se fige dans les 5 secondes après ce qu'elle perçoit comme la fin

**Ne fais pas ça :**
- Couper abruptement (ça sonne comme une erreur technique)
- Jouer une track bonus qui dilue le poids émotionnel de la closer
- Annoncer "dernière track" — ça retire la surprise

Les applaudissements arrivent à la fin de la closer. C'est là que tu sais que ça a marché.

**Try this maintenant :** pratique la technique de fade EQ. Prends n'importe quelle track et sur 25 secondes, coupe progressivement le sub, puis le bas, puis le mid, puis les aigus. Sens comment ça crée un sentiment de fin intentionnelle.
"""

