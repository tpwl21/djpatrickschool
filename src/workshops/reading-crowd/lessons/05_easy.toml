[en]
title      = "Closing — Easy"
short_desc = "The track they'll remember. How to choose it and land it."
description = "The closing is its own skill — separate from peaking. This lesson gives you the concrete rules for picking and playing a closer."
recap = [
  "Closing is **not a slowdown** — it's a final arc that ends with one memorable moment.",
  "Your closer is **not your biggest track** — it's the right track for the emotion you've built.",
  "Closer energy: **3–4**, not 5. Body-impact is for peak. Closer is for memory.",
  "**Never announce 'last track'** — the realization is the payoff.",
  "**Try this:** record your next set's last 10 minutes and listen back within 48 hours.",
]

[[en.pages]]
title   = "Closing ≠ slowdown"
content = """
Many new DJs think of closing as just *playing slower tracks at the end*. That's warmdown, not closing.

The closing is its own arc:
- It starts at **afterpeak energy** (4), not descending from peak (5)
- It has a **direction** — building toward one final moment
- It ends with **one track** the crowd will remember

Your job is to deliver a single moment the crowd will tell people about the next day. Everything in the closing section is setup for that one drop — **the closer**.

**Try this at your next home session:** practice a 15-minute closing section. Pick the closer track first, then build backward — what 2–3 tracks would set it up perfectly?
"""

[[en.pages]]
title   = "How to choose a closer"
content = """
Here are the rules for picking a closer:

1. **Not your biggest track.** The biggest is for the peak. The closer is for memory, not body-impact.

2. **Slightly unexpected.** The best closers feel *of course* in hindsight — the crowd didn't see them coming, but they make perfect sense. That's the signature move.

3. **Energy 3–4, not 5.** A closer at energy 5 is just another peak track. A closer at 3–4 gives the crowd a breath, a resolution, a feeling of *arrival*.

4. **It should feel like you.** Peak tracks are shared vocabulary. Your closer is your dialect. When people describe your set later, they should say *that last track was so [your name]*.

5. **Never announce it.** If you say "last track of the night", you spoil the landing. The crowd should realize it's the closer when the lights come up — and that realization IS the emotional payoff.

**Try this:** look at your DJ library right now and find 3 tracks that could be a closer. Write them down. Bring them to your next gig.
"""

[[en.pages]]
title   = "The Villalobos principle"
content = """
Ricardo Villalobos plays 7–8 hour sets where *almost nothing happens*. Long minimal stretches. No obvious bangers.

And his closings are legendary.

Why? Because he spends 7 hours drawing the crowd into a deep trance — and the closer is the moment that breaks it. Just one track. One drop.

The closing lands with the weight of everything that came before it.

**The lesson that scales to any set length:** even in a 2-hour set, if you've built a consistent groove frame for 1h50, your last 10 minutes will feel disproportionately powerful. The runway makes the landing.

**Try this:** the next time you listen to a DJ set (YouTube, RA, Mixcloud), skip to the last 20 minutes. Notice how the closing feels. Does it land? Does it feel like a natural end? Learn to recognize good closings by listening to them.
"""

[[en.pages]]
title   = "The technical exit"
content = """
How you leave the room matters almost as much as what you play.

**Do this:**
- Let the closer track play fully — don't cut it early
- Fade the low-end out progressively over 20–30 seconds (sub → bass → mids → highs)
- Don't play *one more* after the closer — the crowd's memory locks in within 5 seconds of what they perceive as the end

**Don't do this:**
- Cut abruptly (sounds like a technical error)
- Play a bonus track that dilutes the closer's emotional weight
- Announce "last track" — it removes the surprise

The applause happens at the end of the closer. That's when you know it worked.

**Try this right now:** practice the EQ fade technique. Take any track and over 25 seconds, progressively cut sub, then low, then mid, then high. Feel how it creates a sense of intentional ending.
"""

