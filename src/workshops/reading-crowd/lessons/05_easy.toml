[en]
title      = "Closing"
short_desc = "The track they'll remember. How to choose it and how to land it."
description = "The closing is a skill of its own — different from playing the peak. This lesson gives you simple rules for choosing and playing a closing track."
recap = [
  "The closing is **not a slow-down** — it's a final arc that ends on a memorable moment.",
  "Your closing track is **not your biggest track** — it's the right track for the feeling you've built.",
  "A closing track's energy is usually **3–4**, not 5: the peak is for the body, the closing is for memory.",
  "Avoid announcing 'last track' — letting people realise is part of the effect.",
  "**Try this:** record the last 10 minutes of a practice set and listen back the next day.",
]

[[en.pages]]
title   = "Closing is not a slow-down"
content = """
Many new DJs think of the closing as *playing slower tracks at the end*. That's a cool-down, not a closing.

The closing is its own arc:
- It starts at **afterpeak energy** (about 4), not by falling off a cliff after the peak (5)
- It has a **direction** — it builds toward a final moment
- It ends on **one track** the crowd will remember

Your job is to deliver one moment people will talk about the next day. Everything in the closing section is a setup for that moment — **the closer**.

**Try this at home:** practise a 15-minute closing section. Pick the closer first, then work backwards — which 2–3 tracks would set it up perfectly?
"""

[[en.pages]]
title   = "How to choose a closer"
content = """
Simple rules for choosing a closer:

1. **Not your biggest track.** The biggest is for the peak. The closer is for memory, not for body impact.

2. **A little unexpected.** The best closers feel *obvious* in hindsight — the crowd didn't see them coming, but they make perfect sense.

3. **Energy 3–4, not 5.** A closer at energy 5 is just another peak track. At 3–4 it gives the crowd a breath, a resolution, a feeling of *arriving*.

4. **It should sound like you.** Peak tracks are shared vocabulary. Your closer is your own dialect. Later, people should be able to say *that last track was so you*.

5. **Avoid announcing it.** If you say "last track of the night", you spoil the landing. The crowd should realise it's the closer as the lights come up.

**Try this:** look through your library and find 3 tracks that could be a closer. Write them down. Try them in your next practice set.
"""

[[en.pages]]
title   = "Why a long build makes the ending land"
content = """
Imagine a set where you've built one coherent mood for a long time. Your last ten minutes then carry the weight of everything before them. The longer the build-up, the more a simple, well-chosen closing track can mean.

This works at any length. Even in a two-hour set, if you've kept a consistent groove for an hour and fifty minutes, your last ten minutes will hit harder than if you'd changed direction every few tracks.

**Try this:** next time you listen to a DJ set (YouTube or a DJ platform), skip to the last 20 minutes. Does the ending land? Does it feel like a natural end? Learn to recognise good closings by listening to them.
"""

[[en.pages]]
title   = "The technical exit"
content = """
How you leave the room matters almost as much as what you play.

**Do this:**
- Let the closing track play out — don't cut it early
- If you fade the sound, do it gradually over 20–30 seconds with the three EQ bands: lower the **low** (bass) first, then the **mid**, then the **high**
- Don't play *one more* after the closer — people's memory settles in the seconds after what they take to be the ending

**Don't do this:**
- Cut abruptly (it sounds like a technical error)
- Play a bonus track that dilutes the closer
- Announce "last track"

Applause usually comes at the end of the closer. That's how you know it worked.

**Try this now:** practise the EQ fade. Take any track and, over 25 seconds, gradually cut the low, then the mid, then the high. Feel how it creates an intentional ending.
"""

