[fr]
title      = "Le closing"
short_desc = "La track dont ils se souviendront. Comment la choisir et la faire atterrir."
description = "Le closing est une compétence à part, différente de jouer le peak. Cette leçon te donne des règles simples pour choisir et jouer un morceau de fin."
recap = [
  "Le closing n'est **pas un ralentissement** : c'est un dernier arc qui se termine sur un moment dont on se souvient.",
  "Ton morceau de fin n'est **pas ton plus gros morceau** : c'est le bon morceau pour l'émotion que tu as construite.",
  "L'énergie d'un morceau de fin est généralement de **3–4**, pas 5 : le peak parle au corps, le closing parle à la mémoire.",
  "Évite d'annoncer « dernière track » : laisser les gens s'en rendre compte fait partie de l'effet.",
  "**À toi de jouer :** enregistre les 10 dernières minutes d'un set d'entraînement et réécoute-les le lendemain.",
]

[[fr.pages]]
title   = "Le closing n'est pas un ralentissement"
content = """
Beaucoup de DJs débutants voient le closing comme *jouer des tracks plus lentes à la fin*. C'est une redescente, pas un closing.

Le closing est son propre arc :
- Il commence à une **énergie d'afterpeak** (environ 4), sans chute brutale après le peak (5)
- Il a une **direction** : il construit vers un dernier moment
- Il se termine sur **un seul morceau** dont la foule se souviendra

Ton travail est de livrer un moment dont on parlera le lendemain. Tout ce qui précède dans la section de closing prépare ce moment : **le morceau de fin**.

**À toi de jouer, chez toi :** entraîne-toi sur une section de closing de 15 minutes. Choisis d'abord le morceau de fin, puis remonte en arrière : quels 2 ou 3 morceaux le mettraient parfaitement en place ?
"""

[[fr.pages]]
title   = "Comment choisir un morceau de fin"
content = """
Des règles simples pour choisir ton morceau de fin :

1. **Pas ton plus gros morceau.** Le plus gros est pour le peak. Le morceau de fin est pour la mémoire, pas pour l'impact sur le corps.

2. **Un peu inattendu.** Les meilleurs morceaux de fin semblent *évidents* avec le recul : la foule ne les voyait pas venir, mais ils ont tout leur sens.

3. **Énergie 3–4, pas 5.** Un morceau de fin à l'énergie 5 n'est qu'un morceau de peak de plus. À 3–4, il offre à la foule une respiration, une résolution, un sentiment d'*arriver*.

4. **Il doit sonner comme toi.** Les morceaux de peak sont un vocabulaire partagé. Ton morceau de fin est ton propre dialecte. Plus tard, les gens doivent pouvoir dire *ce dernier morceau, c'était tellement toi*.

5. **Évite de l'annoncer.** Si tu dis « dernière track de la soirée », tu gâches l'atterrissage. La foule doit s'en rendre compte quand les lumières se rallument.

**À toi de jouer :** parcours ta bibliothèque et trouve 3 morceaux qui pourraient servir de fin. Note-les. Essaie-les à ton prochain set d'entraînement.
"""

[[fr.pages]]
title   = "Pourquoi une longue montée fait atterrir la fin"
content = """
Imagine un set où tu as construit une ambiance cohérente pendant longtemps. Tes dix dernières minutes portent alors le poids de tout ce qui précède. Plus la montée est longue, plus un morceau de fin simple et bien choisi peut compter.

Ça marche quelle que soit la durée. Même dans un set de deux heures, si tu as gardé un groove cohérent pendant une heure cinquante, tes dix dernières minutes taperont plus fort que si tu avais changé de direction tous les trois morceaux.

**À toi de jouer :** la prochaine fois que tu écoutes un set de DJ (YouTube ou plateforme de DJ), va directement aux 20 dernières minutes. La fin atterrit-elle ? A-t-on l'impression d'une fin naturelle ? Apprends à reconnaître les bons closings en les écoutant.
"""

[[fr.pages]]
title   = "La sortie technique"
content = """
La façon dont tu quittes la salle compte presque autant que ce que tu joues.

**Fais ceci :**
- Laisse le morceau de fin jouer jusqu'au bout, ne le coupe pas tôt
- Si tu fais un fondu, fais-le progressivement sur 20 à 30 secondes avec les trois bandes d'EQ : baisse d'abord le **grave**, puis le **médium**, puis l'**aigu**
- Ne joue pas *un de plus* après le morceau de fin : le souvenir des gens se fixe dans les secondes qui suivent ce qu'ils prennent pour la fin

**Ne fais pas ceci :**
- Couper brusquement (ça sonne comme une erreur technique)
- Jouer un morceau bonus qui dilue le morceau de fin
- Annoncer « dernière track »

Les applaudissements viennent généralement à la fin du morceau de fin. C'est là que tu sais que ça a marché.

**À toi de jouer maintenant :** entraîne-toi au fondu à l'EQ. Prends n'importe quel morceau et, sur 25 secondes, coupe progressivement le grave, puis le médium, puis l'aigu. Sens comme ça donne une fin voulue.
"""

