[en]
title      = "Closing — Pro: The Handover"
short_desc = "Passing the booth cleanly: ending on a long outro, switching USB sticks and decks, leaving the mixer ready."
description = "A good ending is also a good handover. How to finish on a track the next DJ can work with, change over USB sticks and decks without a gap, and leave the booth ready."
recap = [
  "A handover is part of your set: the last track must give the next DJ **time** to load and match.",
  "**Finish on a long outro** (about 2–3 minutes of a clear, beat-driven ending) — never on a track that ends sharply.",
  "**Change USB sticks and decks only on the deck that isn't playing**; never eject the deck that is.",
  "Leave the mixer **neutral**: trims, EQ, filters, FX and the master as you found them.",
  "One short message helps: tell the next DJ the tempo you're leaving and which deck is live.",
]

[[en.pages]]
title   = "The handover is part of your set"
content = """
When another DJ follows you (a headliner, a closer, or a friend taking over), the handover is the last thing the room hears from you — and the first thing it hears from them.

A clean one has three parts:

1. **Preparation** — you know when it will happen and what the next DJ needs.
2. **The overlap** — a short window where both of you are in control.
3. **The exit** — you leave, and the sound doesn't change.

Where most handovers fail is in the overlap: either the incoming DJ hasn't had time to load, or the outgoing one stops before the sound is ready. Plan the end of your set backwards from the moment the next DJ will be ready.
"""

[[en.pages]]
title   = "Finish on a long outro"
content = """
The best closing track for a handover is one with a **long, clear outro** — usually **2–3 minutes** of repeated beat and few other elements.

Why it works:

- The next DJ has time to load a track, check the tempo and cue it in headphones.
- A steady beat is easy to match: the incoming track can slide in under the outro rather than bolt on at the end.
- You can play it out without improvising.

Avoid ending on a track that stops sharply, loses its beat early, or has a very different tempo from the next DJ's first track. If you know their opening tempo, aim to land within a few BPM of it. If you don't, ask.

Tip: when you pick tracks for the last 15 minutes of a set, note where each outro begins (a memory cue in Rekordbox) and how long it lasts.
"""

[[en.pages]]
title   = "USB sticks and decks: the technical handover"
content = """
On CDJs (media players), the usual rule is simple: **the deck that is playing is never touched.**

1. The next DJ inserts their stick in a **deck that isn't playing**, loads their first track and cues it in headphones.
2. You keep playing on your live deck. If you had a second track ready on the other deck, **leave it or clear it** before they load.
3. When they take over, the stick in the deck that was playing for you stays put until that deck is free. **Never eject a stick from a playing deck.** (Use the eject button on a deck that isn't live.)
4. Remove your own stick only after your last track has finished and the sound has moved to their deck.

If you play on a laptop or controller, agree on the switching plan in advance: usually the incoming DJ plugs in on a free channel while you're still playing, and the changeover happens at the mixer.

If you can, **keep your set on two sticks or a backup**. Whatever the handover, a failure on your side during someone else's start is a bad look.
"""

[[en.pages]]
title   = "Leave the mixer neutral"
content = """
A good outgoing DJ leaves the booth as they'd want to find it:

- **Channel trims** around where you found them (or at a sensible default).
- **EQ at neutral** (centre). **Filters** centred. **FX off.**
- **Channel faders and crossfader** set sensibly for the next DJ; the master level unchanged.
- **Headphone cue** off and the monitors where they were.
- **Cables, sticks, bottles and personal items** cleared from the booth.

And one short message to the next DJ is worth more than any gesture: tell them the tempo you're leaving and which deck is live. It takes five seconds and prevents the most common handover surprise.

If you want a quick checklist, ask yourself: *if I walked in right now, could I start playing without touching anything but my own stick?*
"""

