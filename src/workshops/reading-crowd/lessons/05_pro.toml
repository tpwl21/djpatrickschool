[fr]
title      = "Closing — Pro : la passation"
short_desc = "Passer la cabine proprement : finir sur une longue outro, changer de clé USB et de platine, laisser la table prête."
description = "Une bonne fin est aussi une bonne passation. Comment finir sur un morceau avec lequel le DJ suivant peut travailler, changer de clé USB et de platine sans trou, et laisser la cabine prête."
recap = [
  "La passation fait partie de ton set : ton dernier morceau doit laisser au DJ suivant le **temps** de charger et de caler.",
  "**Termine sur une longue outro** (environ 2 à 3 minutes de fin claire, portée par le rythme), jamais sur un morceau qui s'arrête net.",
  "**Change de clé USB et de platine uniquement sur la platine qui ne joue pas** ; n'éjecte jamais celle qui joue.",
  "Laisse la table **neutre** : trims, EQ, filtres, effets et master comme tu les as trouvés.",
  "Un court message aide : dis au DJ suivant le tempo que tu laisses et quelle platine est en jeu.",
]

[[fr.pages]]
title   = "La passation fait partie de ton set"
content = """
Quand un autre DJ prend la suite (une tête d'affiche, un DJ de closing ou un ami qui te remplace), la passation est la dernière chose que la salle entend de toi, et la première qu'elle entend de lui ou d'elle.

Une passation propre a trois temps :

1. **La préparation** : tu sais quand ça aura lieu et ce dont le DJ suivant a besoin.
2. **Le chevauchement** : une courte fenêtre où vous contrôlez tous les deux.
3. **La sortie** : tu pars, et le son ne change pas.

C'est dans le chevauchement que la plupart des passations échouent : soit le DJ qui arrive n'a pas eu le temps de charger, soit celui qui part s'arrête avant que le son ne soit prêt. Planifie la fin de ton set à rebours, à partir du moment où le DJ suivant sera prêt.
"""

[[fr.pages]]
title   = "Termine sur une longue outro"
content = """
Le meilleur morceau de fin pour une passation est un morceau avec une **longue outro claire**, en général **2 à 3 minutes** de rythme répété avec peu d'autres éléments.

Pourquoi ça marche :

- Le DJ suivant a le temps de charger un morceau, de vérifier le tempo et de le caler au casque.
- Un rythme régulier est facile à caler : le morceau entrant peut glisser sous l'outro plutôt que d'être collé à la fin.
- Tu peux le laisser jouer sans improviser.

Évite de finir sur un morceau qui s'arrête net, qui perd son rythme tôt, ou dont le tempo est très différent de celui du premier morceau du DJ suivant. Si tu connais son tempo d'ouverture, vise à atterrir à quelques BPM près. Sinon, demande.

Astuce : quand tu choisis les morceaux de tes 15 dernières minutes, note où commence chaque outro (un repère mémoire dans Rekordbox) et combien de temps elle dure.
"""

[[fr.pages]]
title   = "Clés USB et platines : la passation technique"
content = """
Sur des CDJ (lecteurs multimédia), la règle de base est simple : **la platine qui joue ne se touche pas.**

1. Le DJ suivant insère sa clé dans une **platine qui ne joue pas**, charge son premier morceau et le cale au casque.
2. Tu continues sur ta platine en jeu. Si tu avais un second morceau prêt sur l'autre platine, **laisse-le ou efface-le** avant qu'il charge.
3. Quand il prend le relais, la clé de la platine qui jouait pour toi reste en place jusqu'à ce que cette platine soit libre. **N'éjecte jamais une clé d'une platine qui joue.** (Utilise le bouton d'éjection sur une platine qui n'est pas en jeu.)
4. Retire ta propre clé seulement une fois ton dernier morceau terminé et le son passé sur sa platine.

Si tu joues sur ordinateur ou contrôleur, convenez du plan de changement à l'avance : en général, le DJ entrant se branche sur une voie libre pendant que tu joues encore, et le changement se fait à la table.

Si tu le peux, **garde ton set sur deux clés ou avec une sauvegarde**. Quelle que soit la passation, une panne de ton côté pendant le début de quelqu'un d'autre fait mauvais effet.
"""

[[fr.pages]]
title   = "Laisse la table neutre"
content = """
Un bon DJ sortant laisse la cabine comme il voudrait la trouver :

- **Trims des voies** à peu près où tu les as trouvés (ou à une valeur par défaut raisonnable).
- **EQ au neutre** (au centre). **Filtres** centrés. **Effets coupés.**
- **Faders de voies et crossfader** placés de façon raisonnable pour le DJ suivant ; niveau master inchangé.
- **Pré-écoute casque** coupée et retours à leur place.
- **Câbles, clés, bouteilles et affaires personnelles** retirés de la cabine.

Et un court message au DJ suivant vaut mieux que n'importe quel geste : dis-lui le tempo que tu laisses et quelle platine est en jeu. Ça prend cinq secondes et ça évite la surprise de passation la plus courante.

Pour une checklist rapide, demande-toi : *si j'arrivais maintenant, pourrais-je commencer à jouer sans toucher à autre chose que ma propre clé ?*
"""

