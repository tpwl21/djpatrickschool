[[en.pages]]
title   = "Warm-up, peak-time, closing: three different jobs"
content = """
The five zones of a set map onto three distinct **professional roles**. Understanding which role you're in changes every decision you make.

**Warm-up (warmup + early build)**
Your mandate: build social weight from an empty or thinly populated room. Tracks are chosen for groove and patience, not impact. Metric of success: room density delta. Nobody will remember your tracks — and that's correct.

**Peak-time (late build + peak + early afterpeak)**
Your mandate: deliver the emotional payload the warm-up earned. Tracks chosen for maximum energy and dancefloor momentum. You are spending the social capital the opener built.

**Closing (afterpeak + closing)**
Your mandate: produce a single memorable ending moment. Tracks chosen for emotional resolution, not escalation. The closer is the track people talk about next day — not the loudest, the most *right*.

Most DJs default to peak-time logic regardless of slot. The skill is reading which role your slot requires and executing that role's specific mandate — not your personal preference.
"""

[[en.pages]]
title   = "The BPM curve: asymmetric by design"
content = """
A common misconception: if your set goes from 120 to 132 BPM over 2 hours, you rise 1 BPM every 10 minutes. That's linear — and it's wrong.

A well-built BPM curve is usually **asymmetric**. Rough landmarks:
- First 40% of the slot: BPM rises slowly (1–2 BPM per 15 minutes). The energy of the groove does the lifting, not the tempo.
- Middle 30%: BPM accelerates (2–3 BPM per 10 minutes). The crowd is already engaged — tempo becomes the amplifier.
- Last 30% (peak + early afterpeak): BPM reaches its ceiling, then descends deliberately for the closing.

Why asymmetric? Because BPM perception is **relative to what came before**. A jump from 118 to 122 after 40 minutes of 116–120 feels enormous. The same jump from 128 to 132 in an already-loud room barely registers.

Practical application: plan your BPM targets at the 25%, 50%, 75%, and 100% mark of your slot. Don't leave the BPM trajectory to intuition.
"""

[[en.pages]]
title   = "Genre-specific arc shapes"
content = """
The five-zone arc is universal — but its **proportions** change with the genre. Rough landmarks, not laws:

- **Techno and minimal:** a long, patient warm-up and build; the slow escalation *is* the experience.
- **House:** a shorter warm-up, and more time spent at the peak.
- **Drum & Bass:** fast escalation, a long peak, a quick exit.
- **Ambient / leftfield:** a very long, gentle start; the peak (if any) is soft.

Before you draw your curve, listen to a few sets from the genre you'll play and note how long each zone lasts.

If you warm up for a techno headliner and escalate at house proportions, you hand them an over-excited room they can't work with. Knowing the genre's shape is part of the job.
"""

[[en.pages]]
title   = "The energy arc as a feedback loop"
content = """
Planning your arc in advance is necessary — but executing it requires real-time adjustment. The arc is a **feedback loop**, not a fixed script.

The loop:
1. **Observe** — crowd density, hand position, movement synchrony, back-row activity.
2. **Diagnose** — are you ahead of or behind your planned arc position?
3. **Adjust** — accelerate the build if crowd is warmer than expected; hold the slope if they're ahead.
4. **Re-observe** — after one phrase (8 bars, 32 beats), then confirm.

Two common failure modes:
- **Ignoring the feedback**: you stick to your planned arc while the crowd is clearly ready for peak 15 minutes early. You lose them to boredom.
- **Over-responding to the feedback**: every bad signal triggers a track change. The arc never develops; the set feels chaotic.

The professional balance: your arc is a **baseline**, not a rule. Small deviations are expected. Large deviations are decisions. Know which is which.
"""

