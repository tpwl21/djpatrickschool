[[fr.pages]]
title   = "Warm-up, peak-time, closing : trois boulots différents"
content = """
Les cinq zones d'un set correspondent à trois **rôles professionnels** distincts. Comprendre dans quel rôle tu es change chaque décision que tu prends.

**Warm-up (warmup + début de build)**
Ton mandat : construire du poids social depuis une salle vide ou à moitié vide. Les tracks sont choisies pour le groove et la patience, pas l'impact. Métrique de succès : delta de densité de salle. Personne ne se souviendra de tes tracks — et c'est correct.

**Peak-time (fin de build + peak + début d'afterpeak)**
Ton mandat : délivrer la charge émotionnelle que le warmup a gagnée. Tracks choisies pour l'énergie maximale et le momentum de dancefloor. Tu dépenses le capital social que l'opener a construit.

**Closing (afterpeak + closing)**
Ton mandat : produire un seul moment de fin mémorable. Tracks choisies pour la résolution émotionnelle, pas l'escalade. La closer est la track dont les gens parlent le lendemain — pas la plus forte, la plus *juste*.

La plupart des DJs fonctionnent avec la logique peak-time quel que soit le slot. La compétence, c'est de lire quel rôle ton slot demande et d'exécuter le mandat spécifique de ce rôle — pas ta préférence personnelle.
"""

[[fr.pages]]
title   = "La courbe de BPM : asymétrique par design"
content = """
Un malentendu courant : si ton set passe de 120 à 132 BPM sur 2h, tu montes de 1 BPM toutes les 10 minutes. C'est linéaire — et c'est faux.

Une courbe de BPM bien construite est souvent **asymétrique**. Quelques repères :
- Premiers 40% du slot : le BPM monte lentement (1–2 BPM par 15 minutes). L'énergie du groove fait le travail, pas le tempo.
- 30% du milieu : le BPM s'accélère (2–3 BPM par 10 minutes). La foule est déjà engagée — le tempo devient l'amplificateur.
- 30% finaux (peak + début d'afterpeak) : le BPM atteint son plafond, puis descend délibérément pour le closing.

Pourquoi asymétrique ? Parce que la perception du BPM est **relative à ce qui précède**. Un saut de 118 à 122 après 40 minutes de 116–120 est énorme. Le même saut de 128 à 132 dans une salle déjà saturée passe à peine.

Application pratique : planifie tes cibles BPM aux marks de 25%, 50%, 75% et 100% de ton slot. Ne laisse pas la trajectoire BPM à l'intuition.
"""

[[fr.pages]]
title   = "Les formes d'arc selon le genre"
content = """
L'arc en cinq zones est universel, mais ses **proportions** changent selon le genre. Des repères, pas des lois :

- **Techno et minimal :** un warm-up et une montée longs et patients ; l'escalade lente *est* l'expérience.
- **House :** un warm-up plus court, et plus de temps passé au peak.
- **Drum & Bass :** escalade rapide, long peak, sortie rapide.
- **Ambient / leftfield :** un début très long et doux ; le peak (s'il y en a un) reste léger.

Avant de dessiner ta courbe, écoute quelques sets du genre que tu vas jouer et note la durée de chaque zone.

Si tu chauffes la salle pour une tête d'affiche techno et que tu escalades aux proportions house, tu lui laisses une salle surexcitée qu'elle ne peut plus travailler. Connaître la forme du genre fait partie du métier.
"""

[[fr.pages]]
title   = "L'arc d'énergie comme boucle de rétroaction"
content = """
Planifier ton arc à l'avance est nécessaire — mais l'exécuter demande de l'ajustement en temps réel. L'arc est une **boucle de rétroaction**, pas un script figé.

La boucle :
1. **Observe** — densité de foule, position des mains, synchronie du mouvement, activité du fond.
2. **Diagnostique** — es-tu en avance ou en retard sur ta position d'arc planifiée ?
3. **Ajuste** — accélère le build si la foule est plus chaude que prévu ; tiens la pente si elle est déjà en avance.
4. **Ré-observe** — après une phrase (8 mesures, 32 temps), puis confirme.

Deux modes d'échec courants :
- **Ignorer le retour** : tu tiens ton arc planifié pendant que la foule est clairement prête pour le peak 15 minutes en avance. Tu les perds à l'ennui.
- **Sur-réagir au retour** : chaque mauvais signal déclenche un changement de track. L'arc ne se développe jamais ; le set semble chaotique.

L'équilibre professionnel : ton arc est une **baseline**, pas une règle. Les petits écarts sont attendus. Les grands écarts sont des décisions. Sache faire la différence.
"""

