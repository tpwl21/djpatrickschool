title      = "La courbe d'énergie — Pro"
short_desc = "U inversé de Berlyne, pyramide de Freytag, habituation de Sokolov, arcs emboîtés."
description = "La psychophysiologie et la dramaturgie derrière pourquoi une courbe de set fonctionne — et ce qui se passe neurologiquement quand tu l'ignores."
recap = [
  "U inversé de Berlyne : potentiel d'arousal et valeur hédonique tracent un arche — trop peu = ennui, trop = aversion.",
