[en]
title      = "The Energy Curve — Pro"
short_desc = "Berlyne's inverted U, habituation, the peak-end rule, and nested arcs — as working models, not laws."
description = "Four psychology models that help explain why a set curve works, and how far you can trust them behind the decks."
recap = [
  "Berlyne's inverted U (1971): pleasure tends to peak at a moderate level of stimulation — too little bores, too much tires.",
  "Freytag's five-act pyramid (1863) is a useful analogy for warmup / build / peak / afterpeak / closing — an analogy, not proof.",
  "Habituation: a constant stimulus fades from attention. Variation inside the peak (breaks, stripped-back sections) keeps it alive.",
  "Peak-end rule (Kahneman, Redelmeier): an experience is remembered mostly through its most intense moment and its ending.",
  "A night with several DJs is a nested arc: your last minutes are the next DJ's starting point.",
]

[[en.pages]]
title   = "Berlyne's inverted U: why the curve exists"
content = """
Daniel Berlyne (1971) proposed that how much we like a stimulus follows an **inverted U** against its "arousal potential" (novelty, complexity, intensity). Too little stimulation = boredom. A moderate amount = maximum pleasure. Too much = discomfort.

Chmiel & Schubert (2017) reviewed the evidence for music in particular: the inverted U shows up for several musical properties, but it is **not universal** — familiarity, mood, context and individual taste all move the curve.

What to take from it behind the decks:

- A flat, maximum-intensity stretch is not "sustained ecstasy": past a certain point returns diminish.
- The warmup and build keep the room below saturation so the peak has somewhere to go.
- The inverted U is a **model**. It gives you a direction to look in, not a number. No source gives a reliable "peak lasts X minutes" figure: your crowd's reaction decides.
"""

[[en.pages]]
title   = "Freytag's pyramid: a useful analogy"
content = """
Gustav Freytag (1863) described drama in five parts: exposition, rising action, climax, falling action, resolution. The mapping to a set is tempting:

| Freytag | Set zone | Job |
|---|---|---|
| Exposition | Warmup | Set the mood without demanding attention |
| Rising action | Build | Tension accumulates, the floor commits |
| Climax | Peak | Maximum tension and release |
| Falling action | Afterpeak | Breath, without losing the room |
| Resolution | Closing | A final moment that makes sense of the night |

Be honest about what this is: **an analogy** from theatre, not a proven law of attention. Its value is practical — it reminds you that intensity has no meaning without a frame. Starting with your peak is like opening a film with its climax: the audience has no context to feel anything.
"""

[[en.pages]]
title   = "Habituation: why a flat peak fades"
content = """
**Habituation** is a well-documented phenomenon: when a stimulus stays constant, the response to it weakens. The orienting response described by Sokolov is the classic example — a new stimulus grabs attention, a repeated one stops doing so.

Applied to a peak: if energy, tempo and texture stay exactly the same for a long time, the same intensity stops feeling like a peak and becomes the new baseline. There is no trustworthy figure for how long this takes in a club, since it depends on the crowd, the sound system and the music.

What it changes in practice:

- **Vary inside the peak.** A short break, a stripped-back section, a change of texture or a small tempo shift gives the floor something new without lowering the overall energy.
- A pause is not hesitation. Used on purpose, it makes the next hit land harder.
- If you see the back of the room drifting during your "best" stretch, suspect sameness before suspecting your track choice.
"""

[[en.pages]]
title   = "The peak-end rule and the weight of the closing"
content = """
Redelmeier and Kahneman (1996, medical-procedure study; replicated in other settings) found that people judge an experience mostly from **its most intense moment and its end**, rather than from the total duration. This is the **peak-end rule**. It is a tendency, not an exact formula.

Two implications for a set:

1. **The ending counts a lot.** A strong peak followed by a rushed or careless ending can leave a weaker memory than the set deserved. Spend as much care on your last 15 minutes as on your peak.
2. **Duration matters less than you'd think** for memory. A shorter set with a clear high point and a well-judged finish can be remembered better than a longer, even one.

Caveat: studies of the rule mostly come from other domains. Treat it as a strong working hypothesis for dancefloors, not a measured result.
"""

[[en.pages]]
title   = "Nested arcs: the night is bigger than your set"
content = """
When several DJs share a night, each set is a **sub-arc** inside the arc of the whole evening.

- **Where you finish is where the next DJ starts.** Handing over a room at a sensible energy level is part of your set, not a favour.
- **Your slot position defines your job.** An opening slot and a late slot call for different shapes, even with identical tracks.
- **A swap or a delay changes the whole arc.** If your slot moves, redraw your curve before you play.

Practical habit: before the night, ask (or work out) who plays before and after you, what energy you're likely to inherit, and what energy you want to leave behind. Then plan your first and last ten minutes around those two numbers.
"""

