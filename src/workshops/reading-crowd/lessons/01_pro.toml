[fr]
title      = "La courbe d'énergie — Pro"
short_desc = "U inversé de Berlyne, habituation, règle pic-fin, arcs emboîtés : des modèles de travail, pas des lois."
description = "Quatre modèles de psychologie qui aident à comprendre pourquoi une courbe de set fonctionne, et jusqu'où leur faire confiance derrière les platines."
recap = [
  "U inversé de Berlyne (1971) : le plaisir tend à culminer à un niveau de stimulation modéré — trop peu ennuie, trop fatigue.",
  "La pyramide de Freytag (1863) est une analogie utile pour warmup / montée / peak / afterpeak / closing — une analogie, pas une preuve.",
  "Habituation : un stimulus constant s'efface de l'attention. Varier à l'intérieur du peak (cassures, passages dépouillés) le garde vivant.",
  "Règle pic-fin (Kahneman, Redelmeier) : une expérience se retient surtout par son moment le plus intense et par sa fin.",
  "Une soirée à plusieurs DJs est un arc emboîté : tes dernières minutes sont le point de départ du DJ suivant.",
]

[[fr.pages]]
title   = "L'U inversé de Berlyne : pourquoi la courbe existe"
content = """
Daniel Berlyne (1971) a proposé que l'attrait d'un stimulus suit un **U inversé** par rapport à son « potentiel d'activation » (nouveauté, complexité, intensité). Trop peu de stimulation = ennui. Une quantité modérée = plaisir maximal. Trop = inconfort.

Chmiel et Schubert (2017) ont passé en revue les preuves pour la musique en particulier : le U inversé apparaît pour plusieurs propriétés musicales, mais il n'est **pas universel** : la familiarité, l'humeur, le contexte et le goût de chacun déplacent la courbe.

Ce qu'il faut en retenir derrière les platines :

- Un passage plat à intensité maximale n'est pas de « l'extase soutenue » : passé un certain point, le rendement baisse.
- Le warmup et la montée gardent la salle sous la saturation pour que le peak ait de la marge.
- Le U inversé est un **modèle**. Il t'indique une direction, pas un chiffre. Aucune source ne donne de durée fiable du type « le peak dure X minutes » : c'est la réaction de ta foule qui décide.
"""

[[fr.pages]]
title   = "La pyramide de Freytag : une analogie utile"
content = """
Gustav Freytag (1863) décrit le drame en cinq parties : exposition, action montante, climax, action descendante, dénouement. La correspondance avec un set est tentante :

| Freytag | Zone du set | Rôle |
|---|---|---|
| Exposition | Warmup | Poser l'ambiance sans exiger d'attention |
| Action montante | Montée | La tension s'accumule, la piste s'engage |
| Climax | Peak | Tension et libération maximales |
| Action descendante | Afterpeak | Reprendre son souffle sans perdre la salle |
| Dénouement | Closing | Un dernier moment qui donne sens à la nuit |

Sois honnête sur ce que c'est : **une analogie** venue du théâtre, pas une loi prouvée de l'attention. Sa valeur est pratique : elle rappelle que l'intensité n'a pas de sens sans cadre. Commencer par ton peak, c'est ouvrir un film par son climax : le public n'a aucun contexte pour ressentir quoi que ce soit.
"""

[[fr.pages]]
title   = "L'habituation : pourquoi un peak plat s'éteint"
content = """
L'**habituation** est un phénomène bien documenté : quand un stimulus reste constant, la réponse qu'il provoque s'affaiblit. La réponse d'orientation décrite par Sokolov en est l'exemple classique : un stimulus nouveau attire l'attention, un stimulus répété n'y arrive plus.

Appliqué à un peak : si l'énergie, le tempo et la texture restent exactement les mêmes longtemps, la même intensité ne fait plus l'effet d'un peak et devient la nouvelle base. Il n'existe pas de chiffre fiable pour la durée de ce phénomène en club, car elle dépend de la foule, du système son et de la musique.

Ce que ça change en pratique :

- **Varie à l'intérieur du peak.** Une courte cassure, un passage dépouillé, un changement de texture ou un léger décalage de tempo donnent du neuf à la piste sans baisser l'énergie globale.
- Une pause n'est pas de l'hésitation. Utilisée exprès, elle fait mieux tomber le coup suivant.
- Si le fond de la salle décroche pendant ton « meilleur » passage, soupçonne la monotonie avant de remettre en cause ton choix de tracks.
"""

[[fr.pages]]
title   = "La règle pic-fin et le poids du closing"
content = """
Redelmeier et Kahneman (1996, étude sur des actes médicaux, reproduite dans d'autres contextes) ont observé que les gens jugent une expérience surtout d'après **son moment le plus intense et sa fin**, plus que d'après sa durée totale. C'est la **règle pic-fin**. C'est une tendance, pas une formule exacte.

Deux conséquences pour un set :

1. **La fin compte beaucoup.** Un beau peak suivi d'une fin bâclée peut laisser un souvenir plus faible que le set ne le méritait. Mets autant de soin dans tes 15 dernières minutes que dans ton peak.
2. **La durée pèse moins qu'on le croit** dans le souvenir. Un set plus court, avec un vrai point culminant et une fin bien jugée, peut être mieux retenu qu'un set plus long et uniforme.

Réserve : les études sur cette règle viennent surtout d'autres domaines. Prends-la comme une bonne hypothèse de travail pour les pistes de danse, pas comme un résultat mesuré.
"""

[[fr.pages]]
title   = "Arcs emboîtés : la soirée dépasse ton set"
content = """
Quand plusieurs DJs se partagent une soirée, chaque set est un **sous-arc** dans l'arc de toute la soirée.

- **Là où tu finis, le DJ suivant commence.** Rendre une salle à un niveau d'énergie raisonnable fait partie de ton set, ce n'est pas une faveur.
- **La position de ton créneau définit ton rôle.** Un créneau d'ouverture et un créneau tardif demandent des formes différentes, même avec les mêmes tracks.
- **Un échange de créneaux ou un retard change tout l'arc.** Si ton créneau bouge, redessine ta courbe avant de jouer.

Habitude pratique : avant la soirée, demande (ou déduis) qui joue avant et après toi, quelle énergie tu vas probablement hériter, et laquelle tu veux laisser. Puis construis tes dix premières et tes dix dernières minutes autour de ces deux niveaux.
"""

