[en]
title      = "Peak Timing — Pro: Volume Over the Night"
short_desc = "Loudness is part of the curve. Leave headroom, don't push the master, and protect the room's ears."
description = "How to manage level across a whole night: where the headroom comes from, why the master isn't a lever, and the hearing limits behind a sensible ceiling."
recap = [
  "Perceived loudness is part of the energy curve: starting a little lower leaves you somewhere to go.",
  "Set levels with each channel's **trim/gain**, and keep the master at its normal position — the master is for the end of the chain, not for emphasis.",
  "**Headroom** is your reserve. A master pushed into the red at 23:00 leaves nothing for 01:00 and adds distortion.",
  "At low volume the ear hears less bass (equal-loudness contours), so don't compensate by simply pushing everything up.",
  "Reference point for hearing: 85 dB(A) for 8 hours (NIOSH). Every +3 dB roughly halves the safe duration.",
]

[[en.pages]]
title   = "Loudness is part of the curve"
content = """
We usually talk about the curve in terms of tracks and BPM, but **volume** is part of it too. A room feels different at the same tempo when it's a little louder or quieter.

Two reasons to respect that:

- **Contrast needs room.** If the room is already loud at 22:30, you've used up one of your best tools for the peak.
- **The ear isn't flat.** Equal-loudness contours (Fletcher and Munson, 1933, revised later in ISO 226) show that we hear low frequencies less well at low levels. The bass seems to fade when you turn down — and people are tempted to compensate by pushing everything up.

Practical consequence: during the warm-up, work **a little under** the level you expect at the peak. If the room asks for more, give it gradually — not in one jump.
"""

[[en.pages]]
title   = "The master isn't a lever"
content = """
The cleanest way to keep **headroom** is to set levels at the source:

1. Use each channel's **trim/gain** so the channel meter reaches its normal working zone on the loudest part of the track — and never into the red.
2. Keep the **master** at its normal position and leave it there. The master isn't a tool for emphasis.
3. If a track sounds weak, change the **track** or fix its channel gain — not the master.

Why? Because the master is the last stage. Pushing it:

- uses up your reserve: with no headroom left, the next loud moment can only clip;
- adds distortion that people hear as fatigue, long before they could name the cause;
- may hit the **venue's limiter** (many rooms have one): your push then does nothing but squash the sound.

Ask the sound engineer before you play where the master should sit and whether the system has a limit. In a club with a resident engineer, their answer wins over any rule of thumb in this lesson.
"""

[[en.pages]]
title   = "Spending the volume across the night"
content = """
A simple way to plan:

| Moment | Level approach |
|---|---|
| Warm-up | Comfortable for conversation, a little under the level you expect later |
| Build | Raise in small steps as the room fills; check the back of the room |
| Peak | Your ceiling — reached by tracks and arrangement, not by raising the master |
| Afterpeak / closing | Come down slightly; keep clarity rather than force |

Peak impact doesn't only come from decibels. **Dynamic contrast** — a break, a stripped-back phrase, then the return of the full groove — often impresses more than a constant high level. Compare it with the habituation idea from lesson 1: a constant level quickly becomes the new baseline.
"""

[[en.pages]]
title   = "Hearing limits and the handover"
content = """
Hearing safety gives you an objective ceiling. NIOSH recommends a limit of **85 dB(A) averaged over 8 hours**, with a **3 dB exchange rate**: every +3 dB halves the recommended duration (88 dB for 4 hours, 91 dB for 2 hours, and so on). Club levels often exceed this, which is why many venues have limiters, and why ear protection for you and for people near the speakers is reasonable.

Handover point: when you finish, **leave the mixer in a state the next DJ can use** — trims where you found them, master unchanged, EQs and filters neutral. A DJ who inherits a master pushed to the limit has lost their headroom before they start.
"""

