[fr]
title      = "Timing du peak — Pro : le volume sur la soirée"
short_desc = "Le volume fait partie de la courbe. Garde de la marge, ne pousse pas le master, protège les oreilles de la salle."
description = "Comment gérer le niveau sur toute une soirée : d'où vient la marge, pourquoi le master n'est pas un levier, et les limites d'écoute derrière un plafond raisonnable."
recap = [
  "Le volume perçu fait partie de la courbe d'énergie : commencer un peu plus bas te laisse de la marge.",
  "Règle les niveaux avec le **trim/gain** de chaque voie et garde le master à sa position normale : le master sert en bout de chaîne, pas à l'emphase.",
  "La **marge** (headroom) est ta réserve. Un master poussé dans le rouge à 23 h ne laisse rien pour 1 h du matin et ajoute de la distorsion.",
  "À faible volume, l'oreille entend moins de grave (courbes d'isosonie) : ne compense pas en poussant tout.",
  "Repère pour l'audition : 85 dB(A) pendant 8 h (NIOSH). Chaque +3 dB divise à peu près par deux la durée sûre.",
]

[[fr.pages]]
title   = "Le volume fait partie de la courbe"
content = """
On parle souvent de la courbe en termes de tracks et de BPM, mais le **volume** en fait partie aussi. À tempo égal, une salle ne se ressent pas pareil un peu plus fort ou un peu moins fort.

Deux raisons de le respecter :

- **Le contraste demande de la place.** Si la salle est déjà forte à 22 h 30, tu as épuisé un de tes meilleurs outils pour le peak.
- **L'oreille n'est pas linéaire.** Les courbes d'isosonie (Fletcher et Munson, 1933, révisées ensuite dans la norme ISO 226) montrent qu'on entend moins bien les graves à faible niveau. Le grave semble disparaître quand on baisse, et on est tenté de compenser en poussant tout.

Conséquence pratique : pendant le warmup, travaille **un peu en dessous** du niveau que tu prévois au peak. Si la salle en demande plus, donne-le progressivement, pas d'un coup.
"""

[[fr.pages]]
title   = "Le master n'est pas un levier"
content = """
La façon la plus propre de garder de la **marge** (headroom) est de régler les niveaux à la source :

1. Utilise le **trim/gain** de chaque voie pour que le vumètre de la voie atteigne sa zone de travail normale sur la partie la plus forte du morceau, sans jamais aller dans le rouge.
2. Garde le **master** à sa position normale et laisse-le là. Le master n'est pas un outil d'emphase.
3. Si un morceau semble faible, change de **morceau** ou corrige le gain de sa voie, pas le master.

Pourquoi ? Parce que le master est le dernier étage. Le pousser :

- consomme ta réserve : sans marge, le prochain moment fort ne peut que saturer ;
- ajoute de la distorsion que les gens ressentent comme de la fatigue, bien avant de pouvoir en nommer la cause ;
- peut atteindre le **limiteur de la salle** (beaucoup en ont un) : ton coup de pouce ne fait alors qu'écraser le son.

Avant de jouer, demande à l'ingénieur du son où placer le master et si le système a une limite. Dans un club avec un ingénieur résident, sa réponse prime sur toute règle de cette leçon.
"""

[[fr.pages]]
title   = "Dépenser le volume sur la soirée"
content = """
Une façon simple de planifier :

| Moment | Approche du niveau |
|---|---|
| Warmup | Confortable pour discuter, un peu sous le niveau prévu plus tard |
| Montée | Monte par petits pas à mesure que la salle se remplit ; regarde le fond de la salle |
| Peak | Ton plafond : atteint par les tracks et l'arrangement, pas en poussant le master |
| Afterpeak / closing | Redescends un peu ; privilégie la clarté à la force |

L'impact du peak ne vient pas que des décibels. Le **contraste dynamique** (une cassure, une phrase dépouillée, puis le retour du groove complet) impressionne souvent plus qu'un niveau élevé constant. Rapproche-le de l'idée d'habituation de la leçon 1 : un niveau constant devient vite la nouvelle base.
"""

[[fr.pages]]
title   = "Limites d'écoute et passation"
content = """
La sécurité auditive te donne un plafond objectif. Le NIOSH recommande une limite de **85 dB(A) en moyenne sur 8 heures**, avec un **taux d'échange de 3 dB** : chaque +3 dB divise la durée recommandée par deux (88 dB pendant 4 h, 91 dB pendant 2 h, etc.). Les niveaux de club dépassent souvent ces valeurs, ce qui explique que beaucoup de salles aient des limiteurs et qu'une protection auditive, pour toi comme pour les personnes près des enceintes, soit raisonnable.

Pour la passation : quand tu finis, **laisse la table dans un état utilisable par le DJ suivant** : trims comme tu les as trouvés, master inchangé, EQ et filtres neutres. Un DJ qui hérite d'un master poussé à la limite a perdu sa marge avant de commencer.
"""

