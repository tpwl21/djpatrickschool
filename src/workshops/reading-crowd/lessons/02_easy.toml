[en]
title      = "Reading a Dancefloor"
short_desc = "What to look at when you look up from the decks."
description = "Reading a crowd isn't a gift — it's a skill made of specific things to observe. This lesson gives you a checklist to use from your very first set."
recap = [
  "Look at **hands, not faces** — hands tell you the energy level faster than expressions.",
  "The **back of the room** is your honest signal — the front usually dances anyway.",
  "**Locked in:** hands up, eyes closed, people moving together, bodies facing the booth.",
  "**Losing them:** screens lit, people leaning in to talk, bodies drifting toward the bar or the exit.",
  "**Try this:** when you practise, look up from the decks every 8 bars and check the far end of the room.",
]

[[en.pages]]
title   = "The first thing to watch: hands"
content = """
When you look up from your decks, don't scan faces — **scan hands**.

Hands tell you where the energy is:

- **Hands in the air** — high energy. Keep going.
- **Hands resting on the bar** — people aren't dancing, they're resting.
- **Hands holding phones (screen lit)** — they may be checking the time or texting "should we leave?". A warning sign.
- **Hands loose, swinging at the sides** — the groove is working, no need to escalate.

**Try this:** the day you play for people, ignore the front row for the first half hour and watch only the hands in the back half of the room. Where are they? That's your real read. (Until then, practise on a video of a live set.)
"""

[[en.pages]]
title   = "Locked in vs losing them — the two lists"
content = """
**Signs the crowd is locked in:**
- Hands in the air (empty hands, not phones)
- Eyes closed, heads down — people have gone inside the music
- Water bottles left on the side — nobody wants to stop dancing
- People moving together — the groove has the whole room
- Bodies facing the booth — they're curious what you'll play next

**Signs you're losing them:**
- Phones out, screens lit — checking the time, a ride home, "should we leave?"
- Groups gathering at the bar between tracks — the floor is emptying from the back
- Friends leaning in to talk — the music isn't holding them
- Bodies turned toward the exits
- People leaving the room at every track change

One bad signal = keep an eye on it. Two or three at once = **act now**.

**Try this:** play a 30-minute practice set, and after each track say out loud which signals you would be watching for. Build the habit before the real thing.
"""

[[en.pages]]
title   = "The back-of-the-room rule"
content = """
Here's a habit that experienced DJs share:

After a big moment in a track, they **don't stare at the mixer**. They lift their head and look at the far back of the room.

Why?
- The **front row** often dances anyway — those people came for you.
- The **middle** dances when the track is good.
- The **back** only dances when the track is really working.

The back is your honest signal. If people there are moving, the whole room is with you.

**Try this at home:** put a chair or a mark at the far end of the room to stand for "the back". After each big moment, force your eyes to it. Count one phrase (8 bars). Then decide your next move.
"""
image = "lesson-images/rtc-dancefloor-zones.png"
image_caption = "Dancefloor zones: front (usually engaged), middle (engaged when the track is good), back (the honest signal)."

[[en.pages]]
title   = "What to do when you see bad signals"
content = """
You see two bad signals: phones out and people gathering at the bar. What do you do?

**Not this:** escalate. Play a bigger track. Crank the volume.

**This:** go back to something you *know* works — a reliable groove track. Maybe drop the tempo by 1–2 BPM. Give the floor something to hold on to.

The instinct when you're losing the crowd is to throw your best track at them. That's panic, and it often backfires. A drifting crowd doesn't need bigger; it needs **something to hold on to**.

**Try this:** when you prepare a set, choose one "rescue track" in advance — a groove tune you know works almost anywhere. When you see two bad signals, go to it without overthinking.
"""

