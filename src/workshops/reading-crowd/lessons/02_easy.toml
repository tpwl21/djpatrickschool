[fr]
title      = "Lire un dancefloor — Easy"
short_desc = "Quoi regarder quand tu lèves les yeux des platines."
description = "Lire une foule n'est pas un talent — c'est une compétence faite de choses précises à observer. Cette leçon te donne une checklist utilisable dès ton premier gig."
recap = [
  "Regarde les **mains, pas les visages** — les mains indiquent le niveau d'énergie plus vite que les expressions.",
  "Les **rangs du fond** sont ton signal de vérité — le devant danse toujours.",
  "**Accrochés :** mains en l'air, yeux fermés, verres abandonnés, mouvement synchronisé.",
  "**Tu les perds :** téléphones sortis pour les apps de taxi, gens penchés pour parler, corps qui dérivent vers le bar.",
  "**Try this :** à ton prochain set, lève les yeux des platines toutes les 4 mesures et regarde les rangs du fond.",
]

[[fr.pages]]
title   = "La première chose à regarder : les mains"
content = """
Quand tu lèves les yeux de tes platines, ne scanne pas les visages — **scanne les mains**.

Les mains te disent où est l'énergie :

- **Mains en l'air** — peak energy. Continue.
- **Mains sur le bar** — les gens ne dansent pas, ils se reposent.
- **Mains tenant des téléphones (écran allumé)** — ils vérifient l'heure ou écrivent "on s'en va ?". Mauvais signal.
- **Mains lâches, qui se balancent** — le groove marche, pas besoin d'escalader.

**Try this à ton prochain gig :** pendant les 30 premières minutes, ignore consciemment le premier rang et observe uniquement les mains dans la moitié arrière de la salle. Où sont ces mains ? C'est ta vraie lecture.
"""

[[fr.pages]]
title   = "Accrochés vs tu les perds — les deux listes"
content = """
**Signaux que la foule est accrochée :**
- Mains en l'air (pas des téléphones — des mains nues)
- Yeux fermés, têtes baissées — les gens sont entrés dans la musique
- Verres abandonnés sur tables — ils n'ont pas voulu s'arrêter de danser pour aller au bar
- Les gens bougent ensemble, synchronisés — le groove a toute la salle
- Corps tournés vers le booth — ils sont curieux de ce que tu fais ensuite

**Signaux que tu les perds :**
- Téléphones sortis, écran allumé — ils vérifient l'heure, le taxi, "on s'en va ?"
- Groupes qui se forment au bar entre les tracks — la piste se vide par l'arrière
- Amis qui se penchent pour parler — la musique ne les retient plus
- Corps tournés vers les sorties — pré-départ mental
- Exodus au fumoir à chaque changement de track — la piste demande réparation

Un mauvais signal = surveille. Deux ou trois en même temps = **agis maintenant**.

**Try this la prochaine fois que tu DJs chez toi :** joue un set de 30 minutes et après chaque track, dis à voix haute quel signal tu serais en train de surveiller. Construis l'habitude avant le vrai gig.
"""

[[fr.pages]]
title   = "La règle des rangs du fond"
content = """
Voici l'habitude la plus utile que les DJs expérimentés ont :

Après chaque drop, ils **ne regardent pas le mixer**. Ils lèvent la tête et regardent le fond de la salle.

Pourquoi ?
- Le **premier rang** danse toujours — ils sont venus exprès pour toi.
- La **section du milieu** danse quand la track est bonne.
- Les **rangs du fond** ne bougent que quand la track tape VRAIMENT.

Les rangs du fond sont ton signal honnête. S'ils bougent, toute la salle est à toi.

**Try this maintenant :** à ta prochaine session chez toi, pose une chaise ou une marque au fond de la pièce représentant les "rangs du fond". Après chaque drop, force tes yeux vers cette marque. Compte 4 mesures. Puis décide ta prochaine track.
"""
image = "lesson-images/rtc-dancefloor-zones.png"
image_caption = "Zones du dancefloor : devant (toujours engagé), milieu (engagé quand la track est bonne), fond (le signal honnête)."

[[fr.pages]]
title   = "Que faire quand tu vois des mauvais signaux"
content = """
Tu vois deux mauvais signaux : téléphones sortis + gens qui se regroupent au bar. Que fais-tu ?

**Pas ça :** escalader. Jouer une track plus grosse. Monter le volume.

**Ça :** revenir à quelque chose que tu *sais* fonctionner. Une track de groove fiable. Baisser le BPM de 1–2. Donne à la piste quelque chose à quoi s'accrocher.

L'instinct quand tu perds la foule c'est de lui balancer ta meilleure track. C'est de la panique — et ça se retourne presque toujours contre toi. Une foule qui décroche n'a pas besoin de plus gros ; elle a besoin de **quelque chose sur quoi s'ancrer**.

**Try this :** avant ton prochain set, choisis une "rescue track" à l'avance — une tune groove que tu sais marcher dans n'importe quelle salle. Quand tu vois deux mauvais signaux, va dessus sans réfléchir.
"""

