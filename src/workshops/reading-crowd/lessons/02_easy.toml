[en]
title      = "Reading a Dancefloor — Easy"
short_desc = "What to look at when you look up from the decks."
description = "Reading a crowd isn't a talent — it's a skill made of specific things to observe. This lesson gives you a checklist you can use from your first gig."
recap = [
  "Look at **hands, not faces** — hands tell you energy level faster than expressions.",
  "The **back rows** are your truth signal — the front always dances.",
  "**Locked in:** hands up, eyes closed, drinks abandoned, synchronized movement.",
  "**Losing them:** phones out for taxi apps, people leaning to chat, bodies drifting to the bar.",
  "**Try this:** at your next set, look up from the decks every 4 bars and check the back rows.",
]

[[en.pages]]
title   = "The first thing to watch: hands"
content = """
When you look up from your decks, don't scan faces — **scan hands**.

Hands tell you where the energy is:

- **Hands in the air** — peak energy. Keep going.
- **Hands on the bar** — people aren't dancing, they're resting.
- **Hands holding phones (screen lit)** — they're checking time or texting "should we leave?". Bad signal.
- **Hands loose, swinging at sides** — the groove is working, no need to escalate.

**Try this at your next gig:** for the first 30 minutes, consciously ignore the front row and only watch hands in the back half of the room. Where are those hands? That's your real read.
"""

[[en.pages]]
title   = "Locked in vs losing them — the two lists"
content = """
**Signs the crowd is locked in:**
- Hands in the air (not phones — empty hands)
- Eyes closed, heads down — people have gone internal with the music
- Drinks abandoned on tables — they didn't want to stop dancing to go to the bar
- People moving together in sync — the groove has the whole room
- Bodies facing the booth — they're curious what you do next

**Signs you're losing them:**
- Phones out, screen lit — checking time, taxi, "should we leave"
- Groups forming at the bar between tracks — the floor is emptying from the back
- Friends leaning in to talk — the music isn't holding them
- Bodies turned toward exits — mental pre-departure
- Exodus to the smoking area every track change — the floor needs repair

One bad signal = watch it. Two or three at once = **act now**.

**Try this next time you DJ at home:** play a 30-minute set and after each track, say out loud which signals you'd be watching for. Build the habit before the real gig.
"""

[[en.pages]]
title   = "The back-row rule"
content = """
Here's the single most useful habit experienced DJs have:

After every drop, they **don't look at the mixer**. They lift their head and look at the far back of the room.

Why?
- The **front row** always dances — they came specifically for you.
- The **middle section** dances when the track is good.
- The **back rows** only dance when the track is REALLY hitting.

The back rows are your honest signal. If they're moving, the whole room is yours.

**Try this right now:** next home session, put a chair or a mark at the far end of the room representing the "back rows". After each track drop, force your eyes to that mark. Count 4 bars. Then decide your next move.
"""
image = "lesson-images/rtc-dancefloor-zones.png"
image_caption = "Dancefloor zones: front (always engaged), middle (engaged when track is good), back (the honest signal)."

[[en.pages]]
title   = "What to do when you see bad signals"
content = """
You see two bad signals: phones out + people gathering at the bar. What do you do?

**Not this:** escalate. Play a bigger track. Turn up the volume.

**This:** pull back to something you *know* works. A reliable groove track. Drop the BPM by 1–2. Give the floor something to anchor on.

The instinct when you're losing the crowd is to throw your best track at them. That's panic — and it almost always backfires. A drifting crowd doesn't need bigger; it needs **something to hold onto**.

**Try this:** before your next set, choose one "rescue track" in advance — a groove tune you know works in any room. When you see two bad signals, go to it without overthinking.
"""

