[fr]
title      = "Lire un dancefloor"
short_desc = "Quoi regarder quand tu lèves les yeux des platines."
description = "Lire une foule n'est pas un don : c'est une compétence faite de choses précises à observer. Cette leçon te donne une checklist utilisable dès ton tout premier set."
recap = [
  "Regarde les **mains, pas les visages** : les mains indiquent l'énergie plus vite que les expressions.",
  "Le **fond de la salle** est ton signal honnête : le devant danse souvent de toute façon.",
  "**Accrochés :** mains en l'air, yeux fermés, gens qui bougent ensemble, corps tournés vers toi.",
  "**Tu les perds :** écrans allumés, gens penchés pour se parler, corps qui dérivent vers le bar ou la sortie.",
  "**À toi de jouer :** quand tu t'entraînes, lève les yeux des platines toutes les 8 mesures et regarde le fond de la pièce.",
]

[[fr.pages]]
title   = "La première chose à regarder : les mains"
content = """
Quand tu lèves les yeux de tes platines, ne scanne pas les visages : **scanne les mains**.

Les mains te disent où est l'énergie :

- **Mains en l'air** : énergie haute. Continue.
- **Mains posées sur le bar** : les gens ne dansent pas, ils se reposent.
- **Mains qui tiennent un téléphone (écran allumé)** : ils vérifient peut-être l'heure ou écrivent « on s'en va ? ». Un signal d'alerte.
- **Mains détendues, qui se balancent** : le groove marche, inutile d'escalader.

**À toi de jouer :** le jour où tu joueras pour du monde, ignore le premier rang pendant la première demi-heure et observe seulement les mains dans la moitié arrière de la salle. Où sont-elles ? C'est ta vraie lecture. (D'ici là, entraîne-toi sur la vidéo d'un set filmé en club.)
"""

[[fr.pages]]
title   = "Accrochés ou tu les perds : les deux listes"
content = """
**Signes que la foule est accrochée :**
- Mains en l'air (des mains vides, pas des téléphones)
- Yeux fermés, têtes baissées : les gens sont entrés dans la musique
- Bouteilles d'eau laissées de côté : personne ne veut arrêter de danser
- Les gens bougent ensemble : le groove tient toute la salle
- Corps tournés vers le booth : ils sont curieux de ce que tu vas jouer

**Signes que tu les perds :**
- Téléphones sortis, écrans allumés : l'heure, le trajet du retour, « on s'en va ? »
- Groupes qui se forment au bar entre les tracks : la piste se vide par l'arrière
- Amis qui se penchent pour parler : la musique ne les retient plus
- Corps tournés vers les sorties
- Des gens qui quittent la salle à chaque changement de track

Un seul mauvais signal = surveille-le. Deux ou trois en même temps = **agis maintenant**.

**À toi de jouer :** fais un set d'entraînement de 30 minutes et, après chaque track, dis à voix haute quels signaux tu surveillerais. Prends l'habitude avant d'être devant du vrai monde.
"""

[[fr.pages]]
title   = "La règle du fond de salle"
content = """
Voici une habitude que partagent les DJs expérimentés :

Après un gros moment dans un morceau, ils **ne fixent pas le mixer**. Ils relèvent la tête et regardent le fond de la salle.

Pourquoi ?
- Le **premier rang** danse souvent de toute façon : ces gens sont venus pour toi.
- Le **milieu** danse quand la track est bonne.
- Le **fond** ne danse que quand la track fonctionne vraiment.

Le fond est ton signal honnête. S'il bouge, toute la salle est avec toi.

**À toi de jouer, chez toi :** pose une chaise ou une marque au fond de la pièce pour représenter « le fond de salle ». Après chaque gros moment, force tes yeux vers elle. Compte une phrase (8 mesures). Puis décide de ton prochain geste.
"""
image = "lesson-images/rtc-dancefloor-zones.png"
image_caption = "Zones du dancefloor : devant (souvent engagé), milieu (engagé quand la track est bonne), fond (le signal honnête)."

[[fr.pages]]
title   = "Que faire quand tu vois de mauvais signaux"
content = """
Tu vois deux mauvais signaux : des téléphones sortis et des gens qui se regroupent au bar. Que fais-tu ?

**Pas ça :** escalader. Jouer une track plus grosse. Monter le volume à fond.

**Ça :** revenir à quelque chose que tu *sais* efficace : une track de groove fiable. Éventuellement baisser le tempo de 1 ou 2 BPM. Donne à la piste quelque chose à quoi s'accrocher.

Quand tu perds la foule, l'instinct est de lui jeter ta meilleure track. C'est de la panique, et ça se retourne souvent contre toi. Une foule qui décroche n'a pas besoin de plus gros : elle a besoin de **quelque chose à quoi s'accrocher**.

**À toi de jouer :** quand tu prépares un set, choisis à l'avance un « morceau de secours » : un morceau groove que tu sais efficace presque partout. Quand tu vois deux mauvais signaux, va dessus sans trop réfléchir.
"""

