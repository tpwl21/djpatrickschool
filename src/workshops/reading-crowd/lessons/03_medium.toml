[[fr.pages]]
title   = "L'économie du slot : early birds vs la core crowd"
content = """
Un set de 2h contient au moins deux populations de foule distinctes — et ton économie de tracks doit en tenir compte.

**Early birds (30–40 premières minutes) :** arrivés tôt, souvent des habitués, là pour toute la soirée. Ils ne sont pas encore dans l'état émotionnel qui fait qu'une track de peak tape fort — la salle est à moitié vide, le bass n'est pas encore à plein volume club, il y a du bruit de conversation ambiant. Tes meilleures tracks sont *gaspillées* sur eux — pas parce qu'ils ne sont pas de bons auditeurs, mais parce que les conditions physiques et sociales qui font atterrir une track de peak n'existent pas encore.

**La core crowd (à partir de ~50% de ton slot) :** arrivés pendant le build, la salle est maintenant à densité, le système est fort, la pression sociale de danser est au maximum. C'est l'environnement pour lequel tes tracks de peak ont été conçues. La même track qui était *sympa* à la 20ème minute est *énorme* à la 70ème.

La leçon économique : chaque hype moment (gros drop, breakdown, intro d'anthem) est une dépense de currency. Tu en as environ 3 par set de 90 min. Les dépenser sur la early-bird crowd n'achète rien — ils ne sont pas dans l'état d'achat. Les dépenser sur la core crowd et ils se capitalisent : chaque hype moment dépensé élève la barre pour le suivant.

**En pratique : compte tes hype moments** pour chaque set que tu prépares. Assigne-leur un temps d'horloge minimum. Écris-le.
"""

[[fr.pages]]
title   = "Ce que les promoteurs mesurent vraiment"
content = """
Les promoteurs ne se souviennent pas de ton mix. Ils se souviennent d'un chiffre : le **delta de densité** de leur salle pendant ton set.

Comment ils scorent (qu'ils l'écrivent ou non) :
- **Rempli** : plus de gens sur la piste quand tu as fini qu'au départ. Signal fort de rebook.
- **Tenu** : densité à peu près identique. Neutre — généralement rebook si le cachet était bon.
- **Vidé** : la piste a perdu de la densité pendant ton set. Une fois pardonnable ; deux fois c'est un pattern.
- **Tué** : la piste s'est vidée pendant ton set. Une fois et tu as fini dans cette salle.

Le delta de densité est *directement contrôlé* par le timing de ton peak. Si ta meilleure track drop à la 20ème minute, les 70 minutes restantes trendent vers le bas — la densité baisse, le promoteur le regarde, le score c'est *vidé*. Si elle drop à la 70ème minute, la piste a chargé pendant 70 minutes et est à sa densité maximale quand le peak atterrit — le score c'est *rempli*.

Le timing de ta meilleure track est **le plus gros levier unique** sur le fait d'être rebooké ou non. Tout le reste — qualité du mix, profondeur de sélection, vibe — est secondaire à cette variable.
"""

[[fr.pages]]
title   = "Le design d'environnement : construire le système de dossiers"
content = """
La volonté ne gagne pas contre l'excitation dans le booth. Quand tu es nerveux, la salle est fine, et ta meilleure track est juste là dans ta librairie — la volonté perd à chaque fois.

La solution c'est le **design d'environnement** : structure ton setup pour que la tentation ne soit pas disponible.

**Le système de dossiers :**
1. Prends tes 5 meilleures tracks pour la soirée.
2. Crée un dossier séparé *PEAK ONLY — après [heure d'horloge]*.
3. Écris l'heure réelle — pas "60% du set" mais "22h45" si ton slot est 22h–00h.
4. Dans Rekordbox : verrouille ces tracks dans une playlist taguée. Tague-les ROUGE ou PEAK. Ta vue par défaut ne les montre pas.
5. Dans le booth : garde le dossier PEAK fermé jusqu'à ce que l'horloge montre ton heure cible.

Quand ta main va chercher une track de peak avant l'heure, le dossier fermé crée une pause physique. Cette pause suffit pour interrompre l'impulsion.

**La configuration à trois dossiers (version complète) :**
- *WARMUP* — tracks pour les premiers 35–40% (groove, patience, zéro anthem)
- *BUILD* — tracks pour les 30–40% du milieu (resserrement, transitionnel, montée en densité)
- *PEAK* — tracks pour les derniers 25–30% (tes meilleures, tes plus grosses, les plus impactantes)

C'est du design d'environnement, pas de la volonté. Le dossier fait le travail de discipline.
"""

[[fr.pages]]
title   = "Le délai du système nerveux : apprendre à reconnaître le faux signal"
content = """
L'envie de jouer ta meilleure track tôt n'est **pas** un jugement sur la bonne track pour le moment. C'est une réponse du système nerveux à l'inconfort : salle fine, pas de réaction, promoteur qui ne regarde pas.

Le feeling dit : *joue quelque chose de gros et règle ça.* La réalité : jouer quelque chose de gros dans une salle fine ne règle rien — ça consume juste ta munition et confirme la peur du promoteur que tu ne sais pas gérer le slow build.

Comment reconnaître le faux signal :
- Il arrive dans les 40% initiaux de ton set.
- Il est déclenché par l'*inconfort*, pas par la réponse de la foule (qui est en fait bonne — elle demande juste de la patience).
- Il s'accompagne de la pensée "ça va sauver le set."

Cette dernière pensée est le disqualifiant. Si une track donne l'impression qu'elle **sauverait** le set, c'est qu'il ne faut pas la jouer. Une track qui sauve un set est une track déployée dans le désespoir — et la foule ressent le désespoir dans la sélection. Les bonnes tracks de peak sonnent **méritées**, pas secourues.

Pratique : prochaine session chez toi, commence délibérément avec un son fin et tiens ton meilleur matériel pendant 60 minutes. Remarque l'envie arriver. Remarque-la passer. C'est la répétition.
"""

