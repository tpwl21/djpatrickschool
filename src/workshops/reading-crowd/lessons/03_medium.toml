[en]
title      = "Peak Timing — Medium"
short_desc = "Slot economics, a budget of big moments, and how organisers read your set."
description = "The 60% landmark, budgeting your big moments, early arrivals vs the core crowd, and concrete tools to hold your best material until the set has earned it."
recap = [
  "Keep your **3 best tracks** for the later part of your slot (a landmark: after about 60%), and move that line only on purpose, because the room is clearly ready.",
  "For a 90-minute set, think in terms of **a few big moments** (about 3 as a working figure) and spend them in the second half.",
  "**Early arrivals** and the **core crowd** are different audiences. Don't burn your best material on a room that isn't ready for it.",
  "Organisers often judge the **density change**: did the floor fill up, hold, or empty during your set?",
  "Environment beats willpower: **label a crate or playlist** with the earliest clock time you may open it.",
]

[[en.pages]]
title   = "Slot economics: early arrivals vs the core crowd"
content = """
A two-hour set usually has two audiences, and your track economy should account for both.

**Early arrivals (first 30–40 minutes):** often regulars, there for the whole night. The conditions that make a peak track hit aren't there yet: the room is half empty, the system hasn't been pushed, people are talking. Your best tracks are *wasted* here — not because the listeners are bad, but because the physical and social conditions aren't ready.

**The core crowd (from about half of your slot):** they arrived during the build, the floor is fuller, the sound is working, and the social pull to dance is strong. This is the setting your peak tracks were made for. The same track that was *nice* at minute 20 can be *huge* at minute 70.

Treat each big moment (a huge drop, a breakdown, an anthem intro) as something you **spend**. About 3 per 90-minute set is a working figure, not a rule. Spend them on the early room and they buy little; spend them on the core crowd and each one raises the bar for the next.

**In practice:** count your big moments for each set you prepare, give each a *minimum* clock time, and write it down.
"""

[[en.pages]]
title   = "What organisers tend to look at"
content = """
Organisers rarely remember your mix in detail. They see something simpler: **how the floor changed** during your slot.

A rough way to think about it:
- **Filled up:** more people dancing at the end than at the start. A strong sign.
- **Held:** about the same. Neutral, often fine.
- **Emptied:** density dropped during your set. Once can be forgiven; a pattern gets noticed.

Peak timing has a direct effect on that change. If your biggest track drops at minute 20, the remaining 70 minutes tend to trend down. If it drops late, the floor has been filling for a long time and reaches maximum density as the peak lands.

It isn't the only factor — selection, mixing and reading the room matter too — but peak timing is one of the biggest levers you control.
"""

[[en.pages]]
title   = "Environment design: build the crate system"
content = """
Willpower loses to adrenaline in the booth. When you're nervous, the room is thin and your best track is right there in the library, you will be tempted.

The fix is **environment design**: arrange your setup so the temptation isn't one click away.

**The crate system:**
1. Take your 5 best tracks for the night.
2. Put them in a separate crate or playlist named *PEAK — after [clock time]*.
3. Write the actual time — not "60% of the set" but "22:45" if your slot runs 22:00 to 00:00.
4. In Rekordbox (or your software), give them a colour label such as red, so they stand out as a different category.
5. Keep that crate closed until the clock reaches your target time.

When your hand goes for a peak track early, the label gives you a pause. That pause is often enough.

**The three-crate version:**
- *WARMUP* — the first third or so (groove, patience, no anthems)
- *BUILD* — the middle (tightening, transitional, density rising)
- *PEAK* — the last quarter or third (your biggest tracks)

It's a design trick, not a lock: you can still open the crate if the room clearly asks for it. The point is that it becomes a decision, not an impulse.
"""

[[en.pages]]
title   = "The nervous-system delay: spotting the false signal"
content = """
The urge to play your best track early isn't a judgment about what the room needs. It's a nervous reaction to discomfort: thin room, little reaction, the organiser not looking your way.

The feeling says: *play something huge and fix this.* The reality: a huge track in a thin room fixes nothing — it just uses up your ammunition.

How to spot the false signal:
- It arrives in the first part of your set.
- It's triggered by *discomfort*, not by what the crowd is doing (the crowd is often fine — it just needs patience).
- It comes with the thought *"this will save the set."*

That last thought is a red flag. A track chosen to **rescue** a set is a track chosen out of panic, and the room can feel it. Good peak tracks feel **earned**, not rescued.

Practice: in your next home session, start with a thin sound on purpose and hold your best material for 60 minutes. Notice the urge arrive. Notice it pass. That's the repetition.
"""

