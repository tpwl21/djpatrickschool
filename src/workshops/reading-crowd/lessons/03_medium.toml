[[en.pages]]
title   = "Slot economics: early birds vs the core crowd"
content = """
A 2-hour set has at least two distinct crowd populations — and your track economy has to account for both.

**Early birds (first 30–40 min):** arrived early, often regulars, there for the whole night. They're not yet in the emotional state that makes a peak track hit hard — the room is half-full, the bass isn't turned up to full club volume, there's ambient conversation noise. Your best tracks are *wasted* on them — not because they're not good listeners, but because the physical and social conditions that make a peak track land don't exist yet.

**The core crowd (from ~50% of your slot):** they've arrived during the build, the room is now at density, the system is loud, the social pressure to dance is at maximum. This is the environment your peak tracks were designed for. The same track that was *okay* at minute 20 is *enormous* at minute 70.

The economic lesson: each hype moment (big drop, breakdown, anthem intro) is a currency spend. You get roughly 3 per 90-minute set. Spending them on the early-bird crowd buys nothing — they're not in the buying state. Spend them on the core crowd and they compound: each spent hype moment raises the bar for the next one.

**Practical: count your hype moments** for each set you plan. Assign them a minimum clock time. Write it down.
"""

[[en.pages]]
title   = "What promoters actually measure"
content = """
Promoters don't remember your DJ mix. They remember a number: the **density delta** of their room during your set.

How they score it (whether they write it down or not):
- **Filled**: more people on the floor when you finished than when you started. Strong rebook signal.
- **Held**: roughly the same density. Neutral — usually means rebook if the fee was right.
- **Emptied**: floor lost density during your set. One pass is forgivable; two is a pattern.
- **Killed**: floor cleared during your set. One time and you're done at that venue.

The density delta is *directly controlled* by your peak timing. If your best track drops at minute 20, the remaining 70 minutes trend downward — density falls, the promoter watches it happen, the score is *emptied*. If it drops at minute 70, the floor has been loading for 70 minutes and is at its highest density when the peak lands — the score is *filled*.

Your best track timing is the **single biggest lever** on whether you get rebooked. Everything else — mixing quality, track selection depth, vibe — is secondary to this one variable.
"""

[[en.pages]]
title   = "Environment design: building the folder system"
content = """
Willpower doesn't win against excitement in the booth. When you're nervous and the room is thin and your best track is right there in your library — willpower loses every time.

The solution is **environment design**: structure your setup so the temptation isn't available.

**The folder system:**
1. Take your 5 best tracks for the night.
2. Create a separate folder called *PEAK ONLY — after [clock time]*.
3. Write the actual clock time — not "60% of the set" but "22:45" if your slot is 22:00–00:00.
4. In Rekordbox: lock those tracks in a tagged playlist. Tag them RED or PEAK. Your default view doesn't show them.
5. In the booth: keep the PEAK folder closed until the clock shows your target time.

When your hand reaches for a peak track before the time, the closed folder creates a physical pause. That pause is enough to interrupt the impulse.

**The three-folder setup (full version):**
- *WARMUP* — tracks for the first 35–40% (groove, patience, no anthems)
- *BUILD* — tracks for the middle 30–40% (tightening, transitional, building density)
- *PEAK* — tracks for the last 25–30% (your best, your biggest, your most impactful)

This is environment design, not willpower. The folder is doing the discipline work.
"""

[[en.pages]]
title   = "The nervous-system delay: learning to recognize the false signal"
content = """
The urge to play your best track early is **not** a judgment about the right track for the moment. It's a nervous-system response to discomfort: thin room, no reaction, promoter not looking.

The feeling says: *play something big and fix this.* The reality: playing something big in a thin room doesn't fix anything — it just uses up your ammo and confirms the promoter's fear that you can't handle the slow build.

How to recognize the false signal:
- It arrives in the first 40% of your set.
- It's triggered by *discomfort*, not by crowd response (which is actually good — just patience-requiring).
- It's accompanied by the thought "this will save the set."

That last thought is the disqualifier. If a track feels like it would **save** the set, it's not time to play it. A track that saves a set is a track deployed in desperation — and the crowd can feel the desperation in the selection. The right peak tracks feel **earned**, not rescued.

Practice: next home session, deliberately start with a thin sound and hold your best material for 60 minutes. Notice the urge arrive. Notice it pass. That's the rep.
"""

