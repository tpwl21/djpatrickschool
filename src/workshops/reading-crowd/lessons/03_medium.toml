[[fr.pages]]
title   = "L'économie du créneau : premiers arrivés et foule principale"
content = """
Un set de deux heures a généralement deux publics, et ton économie de tracks doit tenir compte des deux.

**Les premiers arrivés (30 à 40 premières minutes) :** souvent des habitués, là pour toute la soirée. Les conditions qui font taper une track de peak ne sont pas encore réunies : la salle est à moitié vide, le système n'est pas encore poussé, on discute. Tes meilleures tracks sont *gaspillées* ici, non pas parce que les auditeurs sont mauvais, mais parce que les conditions physiques et sociales ne sont pas prêtes.

**La foule principale (à partir de la moitié de ton créneau environ) :** elle est arrivée pendant la montée, la piste est plus pleine, le son est en place, l'envie de danser est forte. C'est le cadre pour lequel tes tracks de peak ont été faites. La même track qui était *sympa* à la minute 20 peut être *énorme* à la minute 70.

Considère chaque grand moment (un gros drop, une cassure, l'intro d'un hymne) comme quelque chose que tu **dépenses**. Environ 3 pour un set de 90 minutes est un ordre de grandeur, pas une règle. Dépensés sur la salle du début, ils rapportent peu ; dépensés sur la foule principale, chacun relève la barre pour le suivant.

**En pratique :** compte tes grands moments pour chaque set que tu prépares, donne à chacun une heure *minimum*, et écris-la.
"""

[[fr.pages]]
title   = "Ce que regardent souvent les organisateurs"
content = """
Les organisateurs retiennent rarement ton mix en détail. Ils voient quelque chose de plus simple : **comment la piste a évolué** pendant ton créneau.

Une façon approximative d'y penser :
- **Remplie :** plus de monde qui danse à la fin qu'au début. Un très bon signe.
- **Tenue :** à peu près pareil. Neutre, souvent correct.
- **Vidée :** la densité a baissé pendant ton set. Une fois, ça se pardonne ; si ça se répète, ça se remarque.

Le timing du peak influence directement cette évolution. Si ta plus grosse track tombe à la minute 20, les 70 minutes restantes tendent à descendre. Si elle tombe tard, la piste se remplit depuis longtemps et atteint sa densité maximale quand le peak arrive.

Ce n'est pas le seul facteur (la sélection, le mix et la lecture de la salle comptent aussi), mais le timing du peak est l'un des plus gros leviers que tu contrôles.
"""

[[fr.pages]]
title   = "Le design d'environnement : construire le système de bacs"
content = """
La volonté perd contre l'adrénaline en cabine. Quand tu es stressé, que la salle est clairsemée et que ta meilleure track est là, dans ta bibliothèque, la tentation est forte.

La solution, c'est le **design d'environnement** : organise ton setup pour que la tentation ne soit pas à un clic.

**Le système de bacs :**
1. Prends tes 5 meilleures tracks de la soirée.
2. Mets-les dans un bac ou une playlist à part, nommé *PEAK : après [heure]*.
3. Écris l'heure réelle : pas « 60 % du set » mais « 22 h 45 » si ton créneau va de 22 h à minuit.
4. Dans Rekordbox (ou ton logiciel), donne-leur une couleur, par exemple rouge, pour qu'elles forment une catégorie à part.
5. Garde ce bac fermé jusqu'à ce que l'horloge atteigne ton heure cible.

Quand ta main va vers une track de peak trop tôt, l'étiquette t'oblige à une pause. Elle suffit souvent.

**La version à trois bacs :**
- *WARMUP* : le premier tiers environ (groove, patience, pas d'hymnes)
- *MONTÉE* : le milieu (resserrement, transition, densité qui monte)
- *PEAK* : le dernier quart ou tiers (tes plus grosses tracks)

C'est une astuce de conception, pas un verrou : tu peux toujours ouvrir le bac si la salle le demande clairement. L'important, c'est que ça devienne une décision, pas une impulsion.
"""

[[fr.pages]]
title   = "Le décalage du système nerveux : repérer le faux signal"
content = """
L'envie de jouer ta meilleure track tôt n'est pas un jugement sur ce dont la salle a besoin. C'est une réaction nerveuse à l'inconfort : salle clairsemée, peu de réaction, l'organisateur qui ne regarde pas de ton côté.

Le sentiment dit : *joue quelque chose d'énorme et règle ça.* La réalité : un énorme morceau dans une salle clairsemée ne règle rien, il consomme juste ta munition.

Comment repérer le faux signal :
- Il arrive dans la première partie de ton set.
- Il est déclenché par l'*inconfort*, pas par ce que fait la foule (qui va souvent bien, elle demande juste de la patience).
- Il s'accompagne de la pensée *« ça va sauver le set »*.

Cette dernière pensée est un drapeau rouge. Une track choisie pour **sauver** un set est choisie par panique, et la salle le sent. Les bonnes tracks de peak sonnent **méritées**, pas secourues.

Entraînement : à ta prochaine session chez toi, commence volontairement avec un son léger et garde ton meilleur matériel pendant 60 minutes. Remarque l'envie arriver. Remarque-la passer. C'est ça, la répétition.
"""

