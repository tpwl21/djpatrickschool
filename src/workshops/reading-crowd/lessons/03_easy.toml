[en]
title      = "Don't Play Your Best Track Too Early"
short_desc = "A classic beginner mistake — and a simple way to avoid it."
description = "Many new DJs do it once: they play their strongest track in the first 20 minutes, then spend the rest of the set coming down. Here's how to avoid it."
recap = [
  "Playing your best track early **feels** like proving yourself — it often flattens the rest of your set.",
  "Organisers often judge one simple thing: did the floor **fill up or empty out** during your set?",
  "Rule of thumb: keep your 3 best tracks for the second half of your slot (roughly after 60% of the time).",
  "The urge to 'play it now' is mostly nerves — learn to recognise it and wait.",
  "**Try this:** write the clock time when you may unlock your best tracks on a sticky note before each practice set.",
]

[[en.pages]]
title   = "The trap every new DJ falls into"
content = """
You've been waiting to play this track for weeks. You get in the booth, the room is half-empty, you're nervous and you want to prove yourself.

So you play it. **Right now.**

The room reacts. People cheer. It feels amazing.

But then what? You just gave the crowd their big moment at minute 20. The next 90 minutes have to top that — and they can't. Every track after it can sound like a letdown. People drift away from the floor.

You didn't wreck their night. **You wrecked your own build-up inside it.**

**Try this at home:** deliberately hold back your 3 favourite tracks until the last 30 minutes of a 60-minute practice mix. Notice how differently they hit when the build was real.
"""

[[en.pages]]
title   = "The 60% landmark"
content = """
Here's a simple landmark that can change your sets:

**Keep your top 3 tracks for after roughly 60% of your slot.**

Do the math:
- 1-hour slot → unlock around minute **36**
- 90-minute slot → around minute **54**
- 2-hour slot → around minute **72**

Why? Because a peak needs a runway. The crowd needs time to warm up, lock in, and start wanting the big moment. If you hand it over unearned, it lands flat. If you make them wait, it hits hard.

It's a landmark, not a law: if the room is clearly ready earlier, you can move it earlier. What you want to avoid is doing it out of nerves.

**Try this:** before a practice set, write your start time and your "unlock time" on a sticky note. Look at it when you feel the urge to play something big early.
"""

[[en.pages]]
title   = "What the organiser tends to look at"
content = """
Organisers usually aren't analysing your transitions. Often they watch one simple thing:

**Did the floor fill up or empty out during your set?**

From the back of the room, that's easy to see — and it's a big part of whether they ask you back.

If your best track came at minute 20 and the floor was emptying for the next half hour, the story they see is "it peaked early and declined". If the floor slowly filled, peaked near the end of your slot and you handed over with energy still up, that's a much better story.

**Try this:** next time you go out as a listener (or watch a live set video), watch the floor density for 30 minutes. Notice when it fills and when it empties.
"""

[[en.pages]]
title   = "One practical trick: the labelled folder"
content = """
Willpower alone often isn't enough. Use your environment.

**Create a folder or playlist in your DJ software called "ONLY AFTER [TIME]"** — write an actual clock time, not a rule. If your slot starts at 22:00 and lasts 2 hours, write *ONLY AFTER 23:12* (that's 60% of 120 minutes).

Put your top 3 tracks in it.

When your hand reaches for it too early, the label makes you pause. That small friction at the moment of decision is often enough to stop the impulse.

**Try this now:** create that folder in your software, before the urge is real. Habits form best when there's no pressure.
"""

