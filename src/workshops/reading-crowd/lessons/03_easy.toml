[en]
title      = "Don't Play Your Best Track Too Early — Easy"
short_desc = "The #1 mistake that kills a DJ's rebooking chances."
description = "Every new DJ does it once: plays their strongest track in the first 20 minutes, then spends the next 90 minutes descending. Here's how to stop."
recap = [
  "Playing your best track early **feels** like proving yourself — it actually kills your arc.",
  "Promoters judge whether the floor **filled or emptied** during your set. That's it.",
  "Rule: your top 3 tracks stay in a separate folder labelled *not before minute 60*.",
  "The urge to 'play it now' is nervous energy — learn to recognize it and wait.",
  "**Try this:** write your 'peak unlock time' on a post-it before every set.",
]

[[en.pages]]
title   = "The trap every new DJ falls into"
content = """
You've been waiting to play this track for weeks. You get in the booth, the room is half-empty, you're nervous and want to prove yourself.

So you play it. **Right now.**

The room reacts. People cheer. It feels amazing.

But then what? You just gave the crowd their peak moment at minute 20. The next 90 minutes need to top that — and they can't. Every track after sounds like a letdown. People drift to the bar.

You didn't wreck their night. **You wrecked your own trajectory inside it.**

**Try this at your next home session:** deliberately hold back your 3 favorite tracks until the last 30 minutes of a 60-minute practice mix. Notice how they hit differently when the build was real.
"""

[[en.pages]]
title   = "The 60% rule"
content = """
Here's the simplest rule that will change your sets:

**None of your top 3 tracks in the first 60% of your slot.**

Do the math:
- 1-hour slot → your big tracks unlock at minute **36**
- 90-minute slot → unlock at minute **54**
- 2-hour slot → unlock at minute **72**

Why 60%? Because a peak needs a runway. The crowd needs time to warm up, lock in, and start wanting the big moment. If you give it to them unearned, it lands flat. If you make them wait, it lands like a wall.

**Try this before your next gig:** write your slot start time and your "unlock time" on a post-it and stick it on your laptop. Reference it if you feel the urge to play something early.
"""

[[en.pages]]
title   = "What the promoter actually sees"
content = """
Promoters aren't listening for your best mix. They're watching one thing:

**Did the floor fill or empty during your set?**

They stand at the back of the room and track the crowd density. Their internal notes basically come down to: *filled / held / emptied*. That's their rebooking decision.

If you played your best track at minute 20 and the floor peaked at 25 but emptied by 60, they saw a set that peaked at 25 and declined for 35 minutes. **They won't call back.**

If the floor slowly filled, peaked near the end of your slot, and handed off high to the next DJ? **Rebook.** That's it.

**Try this:** next time you go to a club as a listener, stand at the back and watch the floor density for 30 minutes. Watch it like a promoter would. Notice when it fills and empties.
"""

[[en.pages]]
title   = "One practical trick: the locked folder"
content = """
Willpower alone won't stop you. You need an environment trick.

**Create a folder on your USB drive called "ONLY AFTER [TIME]"** — write the actual clock time, not a rule. If your slot starts at 22:00 and lasts 2 hours, write *ONLY AFTER 23:12* (that's 60% of 120 minutes).

Put your top 3 tracks in that folder.

When your hand reaches for it before the target time, the label itself will make you pause. This works because it creates a tiny friction at the decision point — and that friction is enough to interrupt the nervous-system impulse.

**Try this tonight:** create that folder on your DJ software right now, before the urge is real. The habit forms when there's no pressure.
"""

