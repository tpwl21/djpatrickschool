[fr]
title      = "Ne joue pas ta meilleure track trop tôt — Easy"
short_desc = "L'erreur n°1 qui tue les chances de rebook d'un DJ."
description = "Tout nouveau DJ le fait une fois : joue sa track la plus forte dans les 20 premières minutes, puis passe les 90 minutes suivantes à descendre. Voilà comment arrêter."
recap = [
  "Jouer ta meilleure track tôt **ressemble** à une preuve de soi — ça tue en fait ton arc.",
  "Les promoteurs jugent si la piste s'est **remplie ou vidée** pendant ton set. C'est tout.",
  "Règle : tes 3 meilleures tracks restent dans un dossier séparé *pas avant la 60ème minute*.",
  "L'envie de 'la jouer maintenant' est de l'énergie nerveuse — apprends à la reconnaître et attends.",
  "**Try this :** écris ton 'heure de déverrouillage peak' sur un post-it avant chaque set.",
]

[[fr.pages]]
title   = "Le piège où tombe tout nouveau DJ"
content = """
Tu attends de jouer cette track depuis des semaines. Tu arrives au booth, la salle est à moitié vide, tu es nerveux et tu veux prouver.

Alors tu la joues. **Maintenant.**

La salle réagit. Les gens crient. C'est extraordinaire.

Mais ensuite ? Tu viens de donner à la foule son moment peak à la 20ème minute. Les 90 minutes suivantes doivent dépasser ça — et elles ne peuvent pas. Chaque track d'après sonne comme une déception. Les gens dérivent vers le bar.

Tu n'as pas raté leur soirée. **Tu as raté ta trajectoire dedans.**

**Try this à ta prochaine session chez toi :** retiens délibérément tes 3 tracks favorites jusqu'aux 30 dernières minutes d'un mix de pratique de 60 minutes. Remarque à quel point elles tapent différemment quand le build était réel.
"""

[[fr.pages]]
title   = "La règle des 60%"
content = """
Voici la règle la plus simple qui va changer tes sets :

**Aucune de tes 3 meilleures tracks dans les premiers 60% de ton slot.**

Fais le calcul :
- Slot d'1h → tes grosses tracks se déverrouillent à la minute **36**
- Slot de 90 min → déverrouillage à la minute **54**
- Slot de 2h → déverrouillage à la minute **72**

Pourquoi 60% ? Parce qu'un peak a besoin d'une piste d'envol. La foule a besoin de temps pour se chauffer, s'accrocher, et commencer à vouloir le grand moment. Si tu le donnes sans l'avoir mérité, ça atterrit à plat. Si tu les fais attendre, ça tape comme un mur.

**Try this avant ton prochain gig :** écris l'heure de début de ton slot et ton "heure de déverrouillage" sur un post-it et colle-le sur ton laptop. Consulte-le si tu sens l'envie de jouer quelque chose tôt.
"""

[[fr.pages]]
title   = "Ce que le promoteur voit vraiment"
content = """
Les promoteurs n'écoutent pas tes meilleurs mix. Ils regardent une chose :

**La piste s'est-elle remplie ou vidée pendant ton set ?**

Ils se tiennent au fond de la salle et suivent la densité de la foule. Leurs notes internes se résument essentiellement à : *rempli / tenu / vidé*. C'est leur décision de rebook.

Si tu as joué ta meilleure track à la 20ème minute et que la piste a peaké à 25 mais s'est vidée à 60, ils ont vu un set qui a peaké à 25 et décliné pendant 35 minutes. **Ils ne rappelleront pas.**

Si la piste s'est progressivement remplie, a peaké vers la fin de ton slot, et a passé la main haut au DJ suivant ? **Rebook.** C'est tout.

**Try this :** la prochaine fois que tu vas en club comme auditeur, tiens-toi au fond et regarde la densité de la piste pendant 30 minutes. Regarde-la comme un promoteur. Remarque quand elle se remplit et se vide.
"""

[[fr.pages]]
title   = "Une astuce pratique : le dossier verrouillé"
content = """
La volonté seule ne t'arrêtera pas. Tu as besoin d'une astuce d'environnement.

**Crée un dossier sur ta clé USB appelé "SEULEMENT APRES [HEURE]"** — écris l'heure d'horloge réelle, pas une règle. Si ton slot commence à 22h et dure 2h, écris *SEULEMENT APRES 23h12* (c'est 60% de 120 minutes).

Mets tes 3 meilleures tracks dans ce dossier.

Quand ta main va chercher le dossier avant l'heure cible, le label lui-même te fera marquer une pause. Ça marche parce que ça crée une légère friction au moment de la décision — et cette friction suffit à interrompre l'impulsion du système nerveux.

**Try this ce soir :** crée ce dossier dans ton logiciel DJ maintenant, avant que l'envie soit réelle. L'habitude se forme quand il n'y a pas de pression.
"""

