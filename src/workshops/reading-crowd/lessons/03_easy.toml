[fr]
title      = "Ne joue pas ta meilleure track trop tôt"
short_desc = "Une erreur classique de débutant, et une façon simple de l'éviter."
description = "Beaucoup de DJs débutants le font une fois : ils jouent leur track la plus forte dans les 20 premières minutes, puis passent le reste du set à redescendre. Voici comment l'éviter."
recap = [
  "Jouer ta meilleure track tôt **donne l'impression** de faire ses preuves : ça aplatit souvent la suite du set.",
  "Les organisateurs jugent souvent une chose simple : la piste s'est-elle **remplie ou vidée** pendant ton set ?",
  "Repère : garde tes 3 meilleures tracks pour la seconde moitié de ton créneau (à peu près après 60 % du temps).",
  "L'envie de « la jouer maintenant » vient surtout du stress : apprends à la reconnaître et attends.",
  "**À toi de jouer :** avant chaque set d'entraînement, note sur un post-it l'heure à partir de laquelle tu as le droit de sortir tes meilleures tracks.",
]

[[fr.pages]]
title   = "Le piège où tombe tout nouveau DJ"
content = """
Tu attends de jouer cette track depuis des semaines. Tu arrives en cabine, la salle est à moitié vide, tu es stressé et tu veux faire tes preuves.

Alors tu la joues. **Maintenant.**

La salle réagit. Les gens crient. C'est génial.

Et après ? Tu viens de donner à la foule son grand moment à la 20ᵉ minute. Les 90 minutes suivantes doivent faire mieux, et elles ne peuvent pas. Chaque track d'après peut sonner comme une déception. Les gens quittent la piste.

Tu n'as pas gâché leur soirée. **Tu as gâché ta propre montée dedans.**

**À toi de jouer, chez toi :** retiens volontairement tes 3 tracks préférées jusqu'aux 30 dernières minutes d'un mix d'entraînement de 60 minutes. Remarque comme elles tapent différemment quand la montée est réelle.
"""

[[fr.pages]]
title   = "Le repère des 60 %"
content = """
Voici un repère simple qui peut changer tes sets :

**Garde tes 3 meilleures tracks pour après environ 60 % de ton créneau.**

Fais le calcul :
- Créneau d'1 h : débloque vers la minute **36**
- Créneau de 90 min : vers la minute **54**
- Créneau de 2 h : vers la minute **72**

Pourquoi ? Parce qu'un peak a besoin d'une piste d'élan. La foule doit avoir le temps de se chauffer, de s'accrocher et d'avoir envie du grand moment. Si tu le donnes sans l'avoir mérité, il retombe à plat. Si tu les fais attendre, il tape fort.

C'est un repère, pas une loi : si la salle est clairement prête plus tôt, tu peux avancer l'heure. Ce qu'il faut éviter, c'est de le faire par stress.

**À toi de jouer :** avant un set d'entraînement, note ton heure de début et ton « heure de déblocage » sur un post-it. Regarde-le quand tu as envie de sortir un gros morceau trop tôt.
"""

[[fr.pages]]
title   = "Ce que regarde souvent l'organisateur"
content = """
En général, les organisateurs n'analysent pas tes transitions. Souvent, ils regardent une chose simple :

**La piste s'est-elle remplie ou vidée pendant ton set ?**

Depuis le fond de la salle, c'est facile à voir, et ça compte beaucoup pour savoir s'ils te rappelleront.

Si ta meilleure track est tombée à la minute 20 et que la piste s'est vidée pendant la demi-heure suivante, l'histoire qu'ils voient est « ça a culminé tôt, puis ça a décliné ». Si la piste s'est remplie peu à peu, a culminé vers la fin de ton créneau et que tu as passé la main avec l'énergie encore haute, c'est une bien meilleure histoire.

**À toi de jouer :** la prochaine fois que tu sors en tant qu'auditeur (ou que tu regardes la vidéo d'un set live), observe la densité de la piste pendant 30 minutes. Note quand elle se remplit et quand elle se vide.
"""

[[fr.pages]]
title   = "Une astuce pratique : le dossier étiqueté"
content = """
La volonté seule ne suffit souvent pas. Utilise ton environnement.

**Crée un dossier ou une playlist dans ton logiciel de DJ appelé « SEULEMENT APRÈS [HEURE] »** : écris une vraie heure, pas une règle. Si ton créneau commence à 22 h et dure 2 h, écris *SEULEMENT APRÈS 23 h 12* (soit 60 % de 120 minutes).

Mets-y tes 3 meilleures tracks.

Quand ta main va vers ce dossier trop tôt, l'étiquette te fait marquer une pause. Cette petite friction au moment de décider suffit souvent à couper l'élan.

**À toi de jouer maintenant :** crée ce dossier dans ton logiciel, avant que l'envie ne soit réelle. Les habitudes se forment mieux sans pression.
"""

