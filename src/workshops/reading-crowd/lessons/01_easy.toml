id = "LESSON_RTC_1_EASY"
order = 1

[en]
title      = "The Energy Curve — Easy"
short_desc = "Your set has a shape. Here's how to see it."
description = "Every DJ set has a natural curve — warmup, build, peak, afterpeak, closing. This lesson makes it visible and gives you your first actionable exercises."
recap = [
  "A set has five zones: warmup → build → peak → afterpeak → closing.",
  "The **order** of those zones matters more than how good any single track is.",
  "Your biggest track should live in the **last 40%** of your set, not the first.",
  "**Try this:** next time you DJ at home, name each track you play by zone — warmup, build, or peak.",
]

[[en.pages]]
title   = "Five zones, one curve"
content = """
Think of your set like a **movie**. It has a beginning, a middle, and an end.

The five zones of any DJ set:

- **Warmup** — low energy. People are arriving, getting drinks. Your tracks fill the room without demanding attention.
- **Build** — energy rises. The groove tightens. People start moving.
- **Peak** — full energy. Your strongest tracks. Everyone is on the floor.
- **Afterpeak** — coming down, but still dancing. Crowd catches its breath.
- **Closing** — the signature moment. Fewer people, but yours.

**Try this at your next home session:** put a piece of tape on your mixer labelled W / B / P / AP / C. Each time you play a track, tap the zone you think you're in. After 30 tracks, look at the sequence — did you stay too long in peak? Did you skip build entirely?
"""

[[en.pages]]
title   = "Why going peak too early breaks everything"
content = """
Imagine eating dessert before your starter. It ruins your appetite for the rest.

If you play your **biggest track at minute 20** of a 2-hour set, the next 100 minutes will feel like a descent. The crowd has nowhere to go but down.

The curve only works when you **earn the peak**. The warmup and build are what make the peak feel massive.

**Try this next time you DJ at home:** pick your 3 strongest tracks and put them in a separate folder called *"not before minute 60"*. Force yourself to wait. When you finally play one, notice how much harder it hits after a 60-minute build.
"""
image = "lesson-images/rtc-energy-curve.png"
image_caption = "A healthy set curve: slow rise, short sharp peak, controlled descent."

[[en.pages]]
title   = "Reading your own curve in real time"
content = """
You don't need charts or spreadsheets. You need **one simple check every 15 minutes**:

1. Look at the dancefloor — is it fuller or emptier than 15 minutes ago?
2. Think: *what zone am I in right now?*
3. Ask: *does this track move me toward or away from the peak I want to build?*

That's the whole system at this level.

**Try this at your next gig (or home session):** set a timer every 15 minutes. When it rings, stop and do the three-step check above before choosing your next track. Do it 5 gigs in a row, and it becomes automatic.
"""

[[en.pages]]
title   = "One-hour set vs four-hour set"
content = """
The zones stay the same, but the **time budget** changes radically.

- **1-hour set:** warmup = 20 min, build = 20 min, peak = 15 min, afterpeak = 5 min. (Almost no real closing — hand off high.)
- **4-hour set:** warmup = 60 min, build = 60 min, peak = 90 min, afterpeak = 30 min, closing = 20 min.

The most common beginner mistake: **trying to do a 4-hour arc in 1 hour**. If your slot is 60 minutes, your peak should be modest and late — not massive and early.

**Try this:** before your next set, write the clock time when you want to hit peak. If your slot starts at 21:00 and ends at 22:00, write *peak at 21:45*. Then stick to it.
"""

