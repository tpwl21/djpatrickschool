[fr]
title      = "La courbe d'énergie — Easy"
short_desc = "Ton set a une forme. Voici comment la voir."
description = "Tout set DJ a une courbe naturelle — warmup, build, peak, afterpeak, closing. Cette leçon la rend visible et te donne tes premiers exercices concrets."
recap = [
  "Un set a cinq zones : warmup → build → peak → afterpeak → closing.",
  "L'**ordre** de ces zones compte plus que la qualité de chaque track individuelle.",
  "Ta track la plus grosse doit vivre dans les **40% finaux** de ton set, pas au début.",
  "**Try this :** la prochaine fois que tu DJs chez toi, nomme chaque track par zone — warmup, build ou peak.",
]

[[fr.pages]]
title   = "Cinq zones, une courbe"
content = """
Pense à ton set comme à un **film**. Il a un début, un milieu, et une fin.

Les cinq zones de tout set DJ :

- **Warmup** — énergie basse. Les gens arrivent, prennent un verre. Tes tracks remplissent la salle sans exiger d'attention.
- **Build** — l'énergie monte. Le groove se resserre. Les gens commencent à bouger.
- **Peak** — pleine énergie. Tes tracks les plus fortes. Tout le monde est sur la piste.
- **Afterpeak** — on redescend, mais on danse encore. La foule reprend son souffle.
- **Closing** — le moment signature. Moins de monde, mais ils sont à toi.

**Try this à ta prochaine session chez toi :** colle un bout de scotch sur ton mixer avec W / B / P / AP / C. À chaque track, tape la zone où tu penses être. Après 30 tracks, regarde la séquence — t'es-tu éternisé en peak ? As-tu sauté le build entièrement ?
"""

[[fr.pages]]
title   = "Pourquoi peaker trop tôt casse tout"
content = """
Imagine manger le dessert avant l'entrée. Ça coupe l'appétit pour le reste.

Si tu joues ta **track la plus grosse à la 20ème minute** d'un set de 2h, les 100 minutes suivantes sonneront comme une descente. La foule n'a nulle part où aller qu'en bas.

La courbe ne fonctionne que si tu **mérites le peak**. Le warmup et le build sont ce qui rend le peak massif.

**Try this la prochaine fois que tu DJs chez toi :** choisis tes 3 tracks les plus fortes et mets-les dans un dossier *"pas avant la 60ème minute"*. Force-toi à attendre. Quand tu en joues enfin une, remarque à quel point elle tape plus fort après 60 minutes de build.
"""
image = "lesson-images/rtc-energy-curve.png"
image_caption = "Une courbe de set saine : montée lente, peak court et marqué, descente contrôlée."

[[fr.pages]]
title   = "Lire ta propre courbe en temps réel"
content = """
Tu n'as pas besoin de graphiques ou de tableurs. Tu as besoin d'**une vérification simple toutes les 15 minutes** :

1. Regarde le dancefloor — est-il plus plein ou plus vide qu'il y a 15 minutes ?
2. Pense : *dans quelle zone suis-je maintenant ?*
3. Demande-toi : *cette track me rapproche-t-elle ou m'éloigne-t-elle du peak que je veux construire ?*

C'est tout le système à ce niveau.

**Try this à ton prochain gig (ou session chez toi) :** mets un timer toutes les 15 minutes. Quand il sonne, arrête-toi et fais les trois vérifications ci-dessus avant de choisir ta prochaine track. Fais ça sur 5 gigs et ça devient automatique.
"""

[[fr.pages]]
title   = "Set d'une heure vs set de quatre heures"
content = """
Les zones restent les mêmes, mais le **budget temps** change radicalement.

- **Set de 1h :** warmup = 20 min, build = 20 min, peak = 15 min, afterpeak = 5 min. (Presque pas de closing — tu passes la main haut.)
- **Set de 4h :** warmup = 60 min, build = 60 min, peak = 90 min, afterpeak = 30 min, closing = 20 min.

L'erreur la plus courante des débutants : **essayer de faire un arc de 4h en 1h**. Si ton slot dure 60 minutes, ton peak doit être modeste et tardif — pas massif et précoce.

**Try this :** avant ton prochain set, écris l'heure d'horloge à laquelle tu veux atteindre le peak. Si ton slot commence à 21h et finit à 22h, écris *peak à 21h45*. Tiens-t'y.
"""

