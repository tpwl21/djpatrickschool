[fr]
title      = "La courbe d'énergie"
short_desc = "Ton set a une forme. Voici comment la voir."
description = "Tout set de DJ a une courbe naturelle : warmup, montée, moment fort, afterpeak, closing. Cette leçon la rend visible et te donne tes premiers exercices."
recap = [
  "Un set a cinq zones : warmup → montée → moment fort (peak) → afterpeak → closing.",
  "L'**ordre** de ces zones compte plus que la qualité de chaque track prise seule.",
  "**Densité** = à quel point la piste est remplie. **Énergie** = l'intensité que la musique dégage. Tu surveilles les deux.",
  "Repère : garde tes plus grosses tracks pour la seconde moitié de ton set, pas pour le début.",
  "**À toi de jouer :** quand tu t'entraînes chez toi, nomme chaque track par zone : warmup, montée ou peak.",
]

[[fr.pages]]
title   = "Cinq zones, une courbe"
content = """
Pense à ton set comme à un **film**. Il a un début, un milieu et une fin.

Les cinq zones d'un set :

- **Warmup** (la mise en route) : énergie basse. Les gens arrivent et discutent. Tes tracks remplissent la salle sans exiger d'attention.
- **Montée** (build) : l'énergie monte. Le groove se resserre. Les gens commencent à bouger.
- **Peak** (le moment fort) : pleine énergie. Tes tracks les plus fortes. La piste est pleine.
- **Afterpeak** : on redescend un peu, mais on danse encore. La foule reprend son souffle.
- **Closing** : la fin dont on se souvient. Moins de monde, mais ceux qui restent sont à toi.

Deux mots que tu vas rencontrer dans cet atelier :

- **Énergie** : l'intensité que la musique dégage, de calme (1) à explosive (5).
- **Densité** : à quel point la piste est remplie. Densité basse = quelques personnes éparpillées. Densité haute = on est coude à coude.

**À toi de jouer, chez toi :** note W / B / P / AP / C sur une feuille (warmup, build, peak, afterpeak, closing). À chaque track, coche la zone où tu penses être. Après 30 tracks, regarde la suite : es-tu resté trop longtemps en peak ? As-tu sauté la montée ?
"""

[[fr.pages]]
title   = "Pourquoi jouer le moment fort trop tôt casse tout"
content = """
Imagine manger le dessert avant l'entrée. Ça coupe l'appétit pour la suite.

Si tu joues ta **track la plus forte à la 20ᵉ minute** d'un set de 2 h, les 100 minutes suivantes peuvent ressembler à une descente. La foule n'a nulle part où aller, sauf vers le bas.

La courbe marche mieux quand tu **mérites le peak**. Le warmup et la montée sont ce qui rend le peak énorme.

**À toi de jouer, chez toi :** choisis tes 3 tracks les plus fortes et range-les dans un dossier *« pas avant la seconde moitié »*. Force-toi à attendre. Quand tu en joues enfin une, remarque comme elle tape plus fort après une longue montée.
"""
image = "lesson-images/rtc-energy-curve.png"
image_caption = "Une courbe de set saine : montée lente, peak court et marqué, descente contrôlée."

[[fr.pages]]
title   = "Lire ta propre courbe en temps réel"
content = """
Pas besoin de graphiques ni de tableurs. Il te faut **une vérification simple toutes les 15 minutes environ** :

1. Regarde la piste : est-elle plus pleine ou plus vide qu'il y a 15 minutes ?
2. Demande-toi : *dans quelle zone suis-je en ce moment ?*
3. Demande-toi : *cette track me rapproche-t-elle ou m'éloigne-t-elle du peak que je veux construire ?*

C'est tout le système à ce niveau.

**À toi de jouer :** pendant une session d'entraînement, mets un minuteur sur 15 minutes. Quand il sonne, arrête-toi et fais les trois vérifications avant de choisir ta prochaine track. Répète-le sur quelques sessions et ça devient automatique. Le jour où tu joueras devant un vrai public, tu auras déjà le réflexe.
"""

[[fr.pages]]
title   = "Set d'une heure ou set de quatre heures"
content = """
Les zones restent les mêmes, mais le **budget temps** change. Ces chiffres sont des repères approximatifs, pas des règles :

- **Set d'1 h :** environ 20 min de warmup, 20 min de montée, 15 min de peak, quelques minutes d'afterpeak. (Presque pas de vrai closing : tu passes la main avec l'énergie encore haute.)
- **Set de 4 h :** environ une heure de warmup, une heure de montée, un long peak, puis l'afterpeak et le closing.

Erreur classique de débutant : **vouloir faire un arc de 4 h en 1 h**. Si ton créneau est court, garde un peak modeste et tardif, pas énorme et précoce.

**À toi de jouer :** avant un set d'entraînement, écris l'heure à laquelle tu veux atteindre ton peak. Si ton créneau va de 21 h à 22 h, écris *peak vers 21 h 45*. Puis tiens-toi à ton plan.
"""

