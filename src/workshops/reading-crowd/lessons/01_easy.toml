[en]
title      = "The Energy Curve"
short_desc = "Your set has a shape. Here's how to see it."
description = "Every DJ set has a natural curve — warmup, build, peak, afterpeak, closing. This lesson makes it visible and gives you your first exercises."
recap = [
  "A set has five zones: warmup → build → peak → afterpeak → closing.",
  "The **order** of those zones matters more than how good any single track is.",
  "**Density** = how full the dancefloor is. **Energy** = how intense the music feels. You watch both.",
  "As a rule of thumb, keep your biggest tracks for the second half of your set, not the start.",
  "**Try this:** when you practise at home, name each track you play by zone — warmup, build or peak.",
]

[[en.pages]]
title   = "Five zones, one curve"
content = """
Think of your set like a **movie**. It has a beginning, a middle, and an end.

The five zones of a DJ set:

- **Warmup** — low energy. People are arriving and chatting. Your tracks fill the room without demanding attention.
- **Build** — energy rises. The groove tightens. People start moving.
- **Peak** — full energy. Your strongest tracks. The floor is packed.
- **Afterpeak** — coming down a little, but still dancing. The crowd catches its breath.
- **Closing** — the memorable ending. Fewer people, but they're yours.

Two words you'll hear in this workshop:

- **Energy** — how intense the music feels, from calm (1) to explosive (5).
- **Density** — how full the dancefloor is. Low density = a few people dotted around. High density = shoulder to shoulder.

**Try this when you practise at home:** write W / B / P / AP / C on a sheet of paper. Each time you play a track, tick the zone you think you're in. After 30 tracks, look at the sequence — did you stay too long in peak? Did you skip the build entirely?
"""

[[en.pages]]
title   = "Why peaking too early breaks everything"
content = """
Imagine eating dessert before your starter. It ruins your appetite for the rest.

If you play your **biggest track at minute 20** of a 2-hour set, the next 100 minutes can feel like a descent. The crowd has nowhere to go but down.

The curve works best when you **earn the peak**. The warmup and build are what make the peak feel massive.

**Try this at home:** pick your 3 strongest tracks and put them in a separate folder called *"not before the second half"*. Force yourself to wait. When you finally play one, notice how much harder it hits after a long build.
"""
image = "lesson-images/rtc-energy-curve.png"
image_caption = "A healthy set curve: slow rise, short sharp peak, controlled descent."

[[en.pages]]
title   = "Reading your own curve in real time"
content = """
You don't need charts or spreadsheets. You need **one simple check every 15 minutes or so**:

1. Look at the dancefloor — is it fuller or emptier than 15 minutes ago?
2. Think: *what zone am I in right now?*
3. Ask: *does this track move me toward or away from the peak I want to build?*

That's the whole system at this level.

**Try this:** set a timer for 15 minutes during a practice session. When it rings, stop and do the three-step check before choosing your next track. Repeat for a few sessions and it becomes automatic. The day you play for a real crowd, you'll already have the habit.
"""

[[en.pages]]
title   = "One-hour set vs four-hour set"
content = """
The zones stay the same, but the **time budget** changes. These numbers are rough landmarks, not rules:

- **1-hour set:** about 20 min warmup, 20 min build, 15 min peak, a few minutes of afterpeak. (Almost no real closing — you hand over with energy still up.)
- **4-hour set:** about an hour of warmup, an hour of build, a long peak, then afterpeak and a closing.

A common beginner mistake: **trying to do a 4-hour arc in 1 hour**. If your slot is short, keep your peak modest and late — not massive and early.

**Try this:** before a practice set, write the clock time when you want to reach your peak. If your slot runs 21:00 to 22:00, write *peak around 21:45*. Then stick to it.
"""

