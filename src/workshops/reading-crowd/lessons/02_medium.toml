[en]
title      = "Reading a Dancefloor — Medium"
short_desc = "Nuanced crowd signals, sensorimotor entrainment, and the back-row verdict."
description = "Beyond the obvious signals: how crowd physics, density migration, and the dance-leader effect give you a real-time diagnostic of the room's state."
recap = [
  "**Hands up vs phones up**: empty raised hands = body-music mode; phones = capture mode, then disengage.",
  "**Central density** is the key spatial signal — floor spread toward walls = energy dropping.",
  "The floor empties from the **back first**, then middle, then front. The back is your diagnostic zone.",
  "**Density migration** gives you ~15 minutes to repair once the back has gone.",
  "Watch your **dance leaders** — 3–5 high-energy dancers near the front who set the pace for the whole room.",
]

[[en.pages]]
title   = "Hands up vs phones up: reading the difference"
content = """
Both look similar from the booth — arms in the air. But they carry opposite information.

**Phones up**: someone is *capturing* a moment. Camera on, arm extended, brain partially out of the experience. They often stop moving to frame the shot. After posting, the attention dips. Phones-up clusters are a snapshot of engagement, not engagement itself — and they frequently mark the ceiling of a track's impact, not the continuation.

**Hands up (empty)**: pure body-music mode. No cognitive load from filming. The arms go up because the body has nowhere else to take the energy. This is the highest-fidelity positive signal you'll read.

In practice: if you see both — half the crowd filming, half dancing with empty hands — the filming half is your early-departure risk. The dancing half is your anchor. Don't play *for* the filming crowd; they'll leave regardless. Play *for* the dancers.

**Central density** is the spatial corollary: when a track lands, dancers compress toward the central axis (between booth and back wall). When energy drops, they spread outward toward side walls and the bar. Watch the shape of the crowd, not just the volume.
"""

[[en.pages]]
title   = "Density migration: the back-to-front diagnosis"
content = """
The floor doesn't empty randomly — it empties in a predictable sequence: **back → middle → front**.

Why? The back-row crowd is the most *optional* — they're there to see what happens, not committed. The front-row crowd came for you specifically. So the back is the canary.

**What this means in practice:**
- If your back rows are still moving: you have full floor engagement. Push.
- If the back is thinning but the middle is still solid: you have ~15 minutes to repair before the middle follows.
- If the middle is gone: the front will hold for another 2–3 tracks maximum, then the floor is effectively empty.

The 4-bar post-drop check is the critical moment: immediately after the drop lands, lift your head and scan the far wall. The verdict is in within those 4 bars — dancers commit or disengage within one phrase.

**Practical drill:** during your next set (even a home session), force your eyes to the back of the room at every drop. Count 4 bars. Then decide your next move. Do this 20 times and it becomes automatic.
"""

[[en.pages]]
title   = "Dance leaders and the social cascade"
content = """
Every room has **dance leaders**: 3–5 high-energy dancers, usually near the front or central zone, who move before everyone else and set the tempo and style of the room's movement.

They're not always visible as a distinct group — but you can identify them by watching who *initiates* when a new track drops. Someone who immediately picks up the rhythm and starts dancing before anyone else commits: that's a dance leader.

**Why they matter:**
- When dance leaders move, the floor follows within 4–8 bars (social proof in action).
- When dance leaders leave the floor, the room drops within 2–3 tracks.
- When dance leaders are hesitating (moving but not committing), you're at a tipping point — the next track decides.

**What to do:** before your set, identify the dance leaders during the previous DJ's last 20 minutes. Where are they? What makes them move? When you take over, your first 3 tracks are calibrated to them — not to the room average. Get the dance leaders moving and the cascade follows.

The inverse is also true: a track that makes the dance leaders stop moving (too weird, wrong BPM register, jarring key shift) will empty the floor 2–3 tracks later, not immediately. Recognize the lag.
"""

