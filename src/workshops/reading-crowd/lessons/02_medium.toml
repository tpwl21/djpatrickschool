[fr]
title      = "Lire un dancefloor — Medium"
short_desc = "Signaux de foule nuancés, entraînement sensorimoteur, et le verdict du rang du fond."
description = "Au-delà des signaux évidents : comment la physique de la foule, la migration de densité et l'effet dance-leader te donnent un diagnostic temps réel de l'état de la salle."
recap = [
  "**Mains en l'air vs téléphones en l'air** : mains nues = mode corps-musique ; téléphones = mode capture, puis désengage.",
  "La **densité centrale** est le signal spatial clé — piste qui s'étale vers les murs = énergie qui baisse.",
  "La piste se vide **du fond d'abord**, puis du milieu, puis du front. Le fond est ta zone de diagnostic.",
  "La **migration de densité** te donne ~15 minutes pour réparer une fois que le fond est parti.",
  "Surveille tes **dance leaders** — 3–5 danseurs haute énergie près du front qui donnent le rythme à toute la salle.",
]

[[fr.pages]]
title   = "Mains en l'air vs téléphones en l'air : lire la différence"
content = """
Les deux se ressemblent depuis le booth — des bras en l'air. Mais ils portent des informations opposées.

**Téléphones en l'air** : quelqu'un *capture* un moment. Caméra activée, bras tendu, cerveau partiellement sorti de l'expérience. Il arrête souvent de bouger pour cadrer. Après le post, l'attention chute. Les clusters de téléphones sont un snapshot d'engagement, pas l'engagement lui-même — et ils marquent fréquemment le plafond de l'impact d'une track, pas sa continuation.

**Mains en l'air (nues)** : mode pur corps-musique. Aucune charge cognitive liée au filmage. Les bras montent parce que le corps n'a nulle part où mettre l'énergie. C'est le signal positif le plus haute fidélité que tu liras.

En pratique : si tu vois les deux — la moitié de la foule filme, l'autre danse les mains nues — la moitié qui filme est ton risque de départ anticipé. La moitié qui danse est ton ancre. Ne joue pas *pour* la foule qui filme ; elle partira de toute façon. Joue *pour* les danseurs.

La **densité centrale** est le corollaire spatial : quand une track atterrit, les danseurs se compactent vers l'axe central (entre booth et fond de salle). Quand l'énergie baisse, ils s'étalent vers les murs latéraux et le bar. Surveille la forme de la foule, pas juste son volume.
"""

[[fr.pages]]
title   = "Migration de densité : le diagnostic fond-vers-front"
content = """
La piste ne se vide pas aléatoirement — elle se vide dans une séquence prévisible : **fond → milieu → front**.

Pourquoi ? La foule du fond est la plus *optionnelle* — elle est là pour voir ce qui se passe, pas engagée. La foule du front est venue exprès pour toi. Donc le fond est le canari dans la mine.

**Ce que ça signifie en pratique :**
- Si tes rangs du fond bougent encore : tu as un engagement de toute la piste. Pousse.
- Si le fond se raréfie mais le milieu tient : tu as ~15 minutes pour réparer avant que le milieu suive.
- Si le milieu est parti : le front tiendra encore 2–3 tracks maximum, puis la piste est effectivement vide.

Le check à 4 mesures post-drop est le moment critique : immédiatement après le drop, lève la tête et scanne le fond de la salle. Le verdict est rendu dans ces 4 mesures — les danseurs s'engagent ou se désengagent dans une première phrase.

**Drill pratique :** lors de ton prochain set (même chez toi), force tes yeux vers le fond à chaque drop. Compte 4 mesures. Puis décide du move suivant. Fais ça 20 fois et ça devient automatique.
"""

[[fr.pages]]
title   = "Les dance leaders et la cascade sociale"
content = """
Chaque salle a des **dance leaders** : 3–5 danseurs haute énergie, généralement près du front ou de la zone centrale, qui bougent avant tout le monde et donnent le tempo et le style du mouvement de la salle.

Ils ne forment pas toujours un groupe distinct — mais tu peux les identifier en regardant qui *initie* quand une nouvelle track drop. Quelqu'un qui part immédiatement sur le rythme avant que quiconque s'engage : c'est un dance leader.

**Pourquoi ils comptent :**
- Quand les dance leaders bougent, la piste suit dans les 4–8 mesures (preuve sociale en action).
- Quand les dance leaders quittent la piste, la salle tombe en 2–3 tracks.
- Quand les dance leaders hésitent (bougent sans s'engager), tu es à un point de bascule — la prochaine track tranche.

**Quoi faire :** avant ton set, identifie les dance leaders pendant les 20 dernières minutes du DJ précédent. Où sont-ils ? Qu'est-ce qui les fait bouger ? Quand tu prends le relais, tes 3 premières tracks sont calibrées pour eux — pas pour la moyenne de la salle. Fais bouger les dance leaders et la cascade suit.

L'inverse est aussi vrai : une track qui stoppe les dance leaders (trop bizarre, mauvais registre BPM, shift de tonalité jarring) videra la piste 2–3 tracks plus tard, pas immédiatement. Reconnais le décalage.
"""

