[[fr.pages]]
title   = "Le closing n'est PAS une redescente"
content = """
Erreur classique du débutant : le closing, c'est juste *une redescente lente*. **Faux.**

Le closing est son propre arc dans l'arc. L'énergie au début du closing est encore d'environ 4. Tu pars DU niveau afterpeak, tu n'en descends pas.

La mission est de livrer **un dernier moment** dont la foule parlera encore des jours plus tard. Ce moment est généralement un seul morceau : **le morceau de fin**. Tout ce qui le précède dans le créneau de closing le prépare.

**Choisir un morceau de fin selon la taille de la salle** (repères approximatifs) :

- **Grande salle ou grande scène** (environ 1 000 personnes ou plus) : territoire des hymnes. Le morceau de fin peut être connu de presque tout le monde : la reconnaissance partagée *est* la charge émotionnelle. Une salle aussi grande demande un vocabulaire commun.
- **Club moyen** (environ 200 à 600) : tes favoris personnels, connus dans la scène mais pas à l'échelle d'une arène. Le morceau de fin dit ton goût, pas un poids de culture pop.
- **Petite salle intime** (moins d'environ 200) : l'intimité est le mode. Le morceau de fin peut être un edit que tu es seul à jouer, une vieille face B disco, un morceau balearic qui brûle lentement. La foule est assez petite pour apprécier la spécificité.
"""

[[fr.pages]]
title   = "Une longue piste d'élan, à toute échelle"
content = """
Imagine un set où rien de spectaculaire ne se passe pendant longtemps : de longs passages patients, peu de pics, pas de gros morceaux évidents. Si la salle a été entraînée dans une seule ambiance cohérente, un morceau de fin bien choisi peut ressembler à une libération.

L'idée marche à toute échelle. Pour un set de deux heures, ton *élan* dure environ 1 h 50 et ton morceau de fin, ce sont les dix dernières minutes. Plus le cadre est long et cohérent, plus le poids émotionnel du morceau de fin augmente, même à volume modéré.

Ça marche aussi dans l'autre sens : si tu as construit un cadre fragile et de niche (un warmup ambient expérimental, par exemple), ton morceau de fin peut être une simple chanson pop et sembler révélateur, parce que le cadre est ce qui le rend lisible comme une fin.

Un bon morceau de fin n'est jamais le plus fort : c'est **le bon morceau pour cette ambiance-là**. La surprise est dans le *choix*, pas dans le *volume*.
"""

[[fr.pages]]
title   = "Choisir ton morceau de fin : les règles"
content = """
1. **Ne prends pas ton plus gros morceau.** Le plus gros est pour le peak. Le morceau de fin est pour la mémoire, pas pour l'impact sur le corps.
2. **Choisis quelque chose de légèrement inattendu.** Un morceau qui paraît *évident* après coup mais que la foule ne voyait pas venir.
3. **Énergie 3–4, pas 5.** Plus haut, tu prolonges le peak. Plus bas, tu redescends. Le morceau de fin vit dans le registre afterpeak.
4. **Il doit sonner comme TOI.** Les morceaux de peak sont un vocabulaire partagé. Les morceaux de fin sont un dialecte.
5. **Évite de l'annoncer.** Si tu laisses entendre « dernière track de la soirée », tu gâches l'atterrissage.

**Quatre types de morceau de fin**, pour t'aider à choisir :

1. **Le morceau signature** : celui pour lequel on te connaît. Risque : trop joué, il ne surprend plus. Récompense : une identité durable.
2. **Le morceau inattendu** : personne ne l'a vu venir. Risque et récompense élevés ; ça ne marche que si le choix a du sens après coup.
3. **Le morceau émotionnel** : lent, harmonique, souvent chanté ; choisi pour que les gens s'enlacent, chantent ou restent immobiles.
4. **Le morceau qui vide la salle** : volontairement plus calme, pour terminer proprement quand le lieu doit fermer. Respectueux du personnel et clair pour la foule.
"""

[[fr.pages]]
title   = "Le dernier applaudissement : la sortie"
content = """
La compétence la plus sous-estimée :

- **Utilise une longue outro.** Choisis un morceau de fin avec une outro instrumentale de 2 à 3 minutes pour le laisser respirer, retirer le grave progressivement et quitter la salle sans arrêt brusque. Les 30 dernières secondes doivent sembler *inévitables*, pas coupées.
- **Laisse le morceau finir.** Les applaudissements arrivent à la fin du dernier morceau.
- **Retire le grave avant l'aigu.** Un fondu d'EQ progressif (grave → médium → aigu sur 20 à 30 secondes) sonne voulu. Une coupure sèche sonne comme une erreur.
- **Ne joue pas *un de plus* après le morceau de fin.** Un morceau bonus dilue le souvenir. Si l'organisateur demande du rab, commence un *nouveau mini-arc de closing* plutôt que d'étirer l'ancien.
- **Sache quand couper le son.** Quand l'applaudissement final atteint son pic et commence à retomber, c'est le moment. Écoute la salle.
"""

