[[en.pages]]
title   = "Closing is NOT a cool-down"
content = """
A common junior mistake: the closing is just *a slow cool-down*. **Wrong.**

The closing is its own arc inside the arc. Energy at the top of the closing is still about 4. You start FROM the afterpeak level, you don't descend from it.

The mission is to deliver **one final moment** the crowd will still talk about days later. That moment is usually a single track — **the closer**. Everything before it in the closing slot is a setup for it.

**Choosing a closer by room size** (rough landmarks):

- **Big room or main stage** (around 1,000 people or more): anthem territory. The closer can be a track almost everyone knows — the shared recognition *is* the emotional payload. A room that big needs shared vocabulary.
- **Medium club** (roughly 200–600): personal favourites, known within the scene but not arena-sized. The closer signals your taste, not pop-cultural weight.
- **Small or intimate room** (under about 200): intimacy is the mode. The closer can be an edit only you play, an old disco B-side, a slow-burning Balearic track. The crowd is small enough to appreciate specificity.
"""

[[en.pages]]
title   = "A long runway, at any length"
content = """
Picture a set where nothing flashy happens for a long time: long, patient stretches, few peaks, no obvious big tracks. If the room has been drawn into one coherent mood, a single well-chosen closer can feel like a release.

The idea scales to any slot. For a two-hour set, your *runway* is about 1h50 and your closer is the last ten minutes. The longer and more consistent the frame, the heavier the closer's emotional weight — even at moderate volume.

It also works the other way round: if you've built a fragile, niche frame (an experimental ambient warm-up, say), your closer can be a simple pop song and it may feel revelatory — because the frame is what makes it readable as an ending.

A good closer is rarely the loudest track: it's **the right track for that particular mood**. The surprise lies in the *choice*, not in the *volume*.
"""

[[en.pages]]
title   = "Picking your closer — the rules"
content = """
1. **Don't pick your biggest track.** The biggest is for the peak. The closer is for memory, not body impact.
2. **Pick something slightly unexpected.** A closer that feels *of course* in hindsight but that the crowd didn't see coming.
3. **Energy 3–4, not 5.** Higher and you're extending the peak. Lower and you're cooling down. The closer sits in the afterpeak register.
4. **It should feel like YOU.** Peak tracks are shared vocabulary. Closers are dialect.
5. **Avoid announcing it.** If you hint "last track of the night", you spoil the landing.

**Four kinds of closer**, to help you choose:

1. **Signature closer** — the track you're known for. Risk: overplayed, it stops surprising. Reward: a long-term identity.
2. **Unexpected closer** — a track nobody saw coming. High risk, high reward; it works only if the choice makes sense in hindsight.
3. **Emotional closer** — slow, harmonic, often vocal; chosen to make people hug, sing or stand still.
4. **Room-clearing closer** — deliberately calmer, to close the night cleanly when the venue has to shut. Respectful to staff and clear for the crowd.
"""

[[en.pages]]
title   = "The final applause: the exit"
content = """
The most under-discussed skill:

- **Use a long outro.** Pick a closer with a 2–3 minute instrumental outro so you can let it breathe, bring the low end out progressively, and leave the room without an abrupt stop. The last 30 seconds should feel *inevitable*, not cut.
- **Let the track finish.** The applause happens at the end of the last track.
- **Remove the low end before the high end.** A progressive EQ fade (low → mid → high over 20–30 seconds) feels intentional. A sudden cut feels like a mistake.
- **Don't play *one more* after the closer.** A bonus track dilutes the memory. If the organiser asks for extra time, start a *new mini closing arc* rather than stretching the old one.
- **Know when to cut the sound.** When the final applause peaks and starts to fade, that's the moment. Listen to the room.
"""

