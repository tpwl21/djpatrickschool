]

[[fr.pages]]
title   = "Planifier la rampe de BPM d'un warmup de deux heures"
content = """
Un warmup de deux heures (disons 22 h à minuit) peut suivre un plan comme celui-ci. Les chiffres sont un exemple, pas une règle : adapte-les au genre et à ce que jouera la tête d'affiche :

| Partie du créneau | Tempo d'exemple | À quoi ça ressemble |
|---|---|---|
| Premier quart | 100–108 BPM | Ambient, dub, downtempo avec du groove. Longues intros, drops minimaux. Tu cohabites avec le bruit de la salle. |
| Deuxième quart | 108–115 BPM | Deep house, minimal. Le groove se resserre, plus de monde sur la piste. Personne ne danse encore à fond. |
| Troisième quart | 115–122 BPM | Plus de corps dans le groove. La densité monte ; les gens ont décidé de rester. |
| Dernier quart | 120–125 BPM | Zone de passation. Ta dernière track atterrit près de l'endroit où la tête d'affiche va démarrer, pas par-dessus. |

Deux choses à noter. Les pas sont **petits au début et un peu plus grands ensuite**, parce qu'un changement de tempo paraît plus ou moins grand selon ce qui précède. Et la rampe n'est **jamais linéaire** : tu tiens un tempo un moment, puis tu montes d'un cran.

Planifie ton BPM cible à 25 %, 50 %, 75 % et 100 % de ton créneau. Puis laisse la réaction de la foule l'ajuster.
"""

[[fr.pages]]
title   = "La marge harmonique pour la tête d'affiche"
content = """
Une tête d'affiche qui arrive dans une salle qui se mélange bien avec le dernier morceau a une difficulté de moins. Celle qui arrive dans un choc passe ses premières minutes à nettoyer.

Des habitudes simples :

- **Demande ou renseigne-toi** sur le tempo et le style avec lesquels la tête d'affiche ouvre d'habitude.
- **Termine ton set sur quelque chose de neutre** : évite de finir sur une couleur tonale très marquée à laquelle le DJ suivant devrait répondre.
- Si tu ne connais pas son style, garde le warmup tonalement ouvert et **simple** (un ressenti lumineux, plutôt majeur au début, plus ambigu vers la fin) et laisse-le aller vers plus sombre ou plus lumineux.

Si tu utilises les codes de tonalité (Camelot ou Open Key dans Rekordbox), prends-les comme un guide pour des enchaînements **compatibles**, pas comme une règle pour toute la nuit. En warmup, un groove qui ne gêne pas compte plus que l'accord de tonalité parfait.
"""

[[fr.pages]]
title   = "La mesure de densité : absorbé ou ignoré"
content = """
La plus grosse erreur en warmup est de confondre **être absorbé** et **être ignoré**.

Un bon warmup est un *fond sonore par conception*. La foule est censée discuter, circuler, arriver. Si tout le monde te fixe à 22 h 15, tu as peut-être poussé trop tôt. La bonne mesure pour la première demi-heure n'est pas la réaction mais le **changement de densité** : y a-t-il plus de monde sur la piste qu'il y a 15 minutes ?

- Personne ne te regarde pendant que les gens arrivent et discutent : *correct*.
- Tout le monde te fixe à 22 h 15 : tu as probablement joué quelque chose de trop gros et coupé le flux social.

C'est contre-intuitif, car la logique habituelle de la scène dit que l'attention égale le succès. Le warmup inverse ça : une musique qui s'intègre à la soirée des gens sans exiger d'attention égale le succès.

**Routine de vérification :** toutes les 20 minutes, compte à peu près combien de personnes sont sur la piste et combien au bar. Suis l'évolution. C'est ton tableau de score.
"""

[[fr.pages]]
title   = "Le volume : l'outil discret du warmup"
content = """
Le volume fait partie de l'arc, et en warmup il protège ta **marge** (headroom).

- **Pars un peu sous ton plafond.** Une salle déjà forte à 22 h 15 n'a plus où aller ; une salle qui commence confortable laisse quelque chose à donner à la tête d'affiche.
- **Monte par petits pas**, pendant que la salle se remplit, plutôt qu'en un seul geste. Les gens s'adaptent sans le remarquer.
- **N'utilise pas le fader master pour souligner.** Règle le niveau de chaque track avec le gain de sa voie et laisse le master là où tu l'as trouvé.
- **Laisse les faders comme tu voudrais les trouver.** La personne suivante hérite de tes réglages.
- Demande à l'ingénieur du son ou à l'organisateur s'il existe un niveau convenu pour le créneau d'ouverture, et suis-le.

Le principe est le même que pour la rampe de tempo : ne dépense pas tes réserves trop tôt. On approfondit les niveaux et les limites d'écoute dans la leçon Pro sur le timing du peak.
"""

