description = "La boîte à outils d'un warmup : une rampe de tempo planifiée, laisser de la place harmonique à la tête d'affiche, mesurer la densité plutôt que les applaudissements, et utiliser le volume pour garder de la marge pour la suite."
recap = [
  "Là où la leçon Easy dit *pars bas*, ici tu **planifies la rampe** : petits pas au début, pas plus nets en seconde moitié, jamais une ligne droite.",
