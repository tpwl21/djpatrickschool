[[fr.pages]]
title   = "La rampe BPM du warmup : anatomie d'une ouverture de 2 heures"
content = """
Un warmup de 2h (22h–00h) a une forme BPM spécifique sur laquelle les openers expérimentés ont convergé :

**22h–22h30 (premiers 25%) :** 100–108 BPM. Ambient-house, dub-techno, downtempo avec groove. La salle se remplit, les conversations ont lieu, le bar est occupé. Tu ne concurrences pas le bruit — tu coexistes avec lui. Tracks avec de longues intros, des drops minimaux.

**22h30–23h (25–50%) :** 108–115 BPM. Deep house, minimal. Le groove se resserre. Plus de gens sur la piste. Encore conversationnel en énergie — personne ne danse vraiment encore, mais le corps en a envie.

**23h–23h30 (50–75%) :** 115–122 BPM. House avec un peu plus de corps. La densité monte, les gens se sont engagés à rester. C'est là que tu commences à encaisser l'énergie que tu construis.

**23h30–00h (derniers 25%) :** 120–125 BPM. Territoire de passation. Ta dernière track sort à +3 BPM dans le registre d'ouverture de la tête — pas directement à son tempo de plancher. L'asymétrie est intentionnelle : la majorité de la montée BPM se passe ici, pas au début. La salle charge depuis 90 minutes et répond plus dramatiquement au tempo à cette densité.

**Ne** jamais accélérer linéairement. La courbe front-charge la patience, back-charge le momentum.
"""

[[fr.pages]]
title   = "L'espace harmonique et la discipline de tonalité"
content = """
Une tête d'affiche qui arrive dans une salle harmoniquement compatible a une chose de moins à combattre. Une tête qui arrive dans une salle harmoniquement conflictuelle passe ses 2–3 premières tracks à nettoyer les résidus. Ça lui coûte de l'énergie — et elle saura de quel set d'ouverture c'est la faute.

**Stratégie harmonique de warmup :**
- Sache dans quelles tonalités la tête travaille en général. La plupart des résidents techno ont des préférences de tonalité — certains favorisent le drame sombre du Ré mineur, d'autres la tension du Fa# mineur.
- Ouvre en **tonalités adjacentes ou modales** (majeur/mineur parallèle, ou une quinte au-dessus/dessous). Ça laisse de la marge harmonique — tes choix de tonalité créent une tension que la première track de la tête *résout*.
- Évite des warmups qui finissent dans la même tonalité que l'opener connu de la tête. Ça fait sonner son arrivée comme une continuation, pas une arrivée.

**Pratique :** si tu ne sais pas les préférences de tonalité de la tête, ouvre en **tonalités majeures** (qui sonnent *jour*) et laisse la tête aller en mineur (qui sonne *nuit*). Cette transition est intuitive pour la foule et ne demande aucune coordination.

**Sur la modulation harmonique pendant le warmup :** chaque bloc de 30 minutes peut avoir un shift harmonique subtil. Commence lumineux (La majeur, Ré majeur), passe en modal (La dorien, Ré dorien), finis ambigu. Le voyage harmonique construit de l'anticipation sans s'engager vers une destination que la tête possède.
"""

[[fr.pages]]
title   = "La métrique de densité : être absorbé vs être ignoré"
content = """
La plus grosse erreur des DJs de warmup c'est de confondre **être absorbé** avec **être ignoré**.

Un warmup bien fait est du *background-by-design*. La foule est censée parler, prendre des verres, arriver. Si tout le monde te fixe à 22h15, tu as escaladé trop tôt. La bonne métrique pour les 30 premières minutes n'est pas la réaction de la foule — c'est le **delta de densité** : est-ce qu'il y a plus de gens dans la salle qu'il y a 15 minutes ?

**Recadrage tactique :**
- Ne pas te regarder à 22h15 = les gens arrivent et socialisent. *Correct.*
- Te fixer dans le booth à 22h15 = tu as joué quelque chose de trop gros et tu as interrompu le tissu social. *Incorrect.*

C'est contre-intuitif parce que la logique normale de performance dit : attention du public = succès. Le warmup inverse ça. Absorption du public (la musique s'intègre dans leur expérience sociale sans exiger d'attention) = succès.

Quand tu as correctement construit 90 minutes d'absorption, le moment où tu commences à escalader à 23h30 tranche comme un couteau — parce que le contraste est énorme. Ce contraste est ce que le warmup construit. Il ne peut pas être construit si tu exiges de l'attention à 22h15.

**La routine de vérification de densité :** toutes les 20 minutes, compte approximativement combien de gens sont sur la piste vs au bar. Suis le delta. C'est ta métrique de performance.
"""

