[en]
title      = "Warmup — Medium"
short_desc = "A BPM ramp you can plan, harmonic headroom, density as your metric, and volume as a warm-up tool."
description = "The working toolkit of a warmup: a planned tempo ramp, leaving harmonic room for the headliner, measuring density rather than applause, and using volume to keep room for later."
recap = [
  "Where the Easy lesson says *start low*, here you **plan the ramp**: slow steps early, firmer ones in the second half, never a straight line.",
  "**Harmonic headroom:** don't leave the headliner a room full of your own tonal baggage — end somewhere that lets their first track breathe.",
  "Your metric is the **density change** (is the floor fuller than 15 minutes ago?), not the crowd's reaction. Being absorbed is not being ignored.",
  "**Volume is a warm-up tool:** start a little under your expected ceiling and raise it in small steps, so the headliner has room to go higher.",
]

[[en.pages]]
title   = "Planning the BPM ramp of a two-hour warmup"
content = """
A two-hour warmup (say 22:00–00:00) can follow a plan like this. The figures are an example, not a rule — adapt them to the genre and to what the headliner will play:

| Part of the slot | Example tempo | What it sounds like |
|---|---|---|
| First quarter | 100–108 BPM | Ambient, dub, downtempo with groove. Long intros, minimal drops. You coexist with the room's noise. |
| Second quarter | 108–115 BPM | Deep house, minimal. Groove tightens, more people on the floor. Nobody dances hard yet. |
| Third quarter | 115–122 BPM | More body in the groove. Density rises; people have committed to staying. |
| Last quarter | 120–125 BPM | Handover territory. Your last track lands close to where the headliner will start, not on top of it. |

Two things to notice. The steps are **small early and a bit larger later**, because a tempo change feels bigger or smaller depending on what came before it. And the ramp is **never linear** — you hold a tempo for a while, then step.

Plan your target BPM at 25%, 50%, 75% and 100% of your slot. Then let the crowd's reaction adjust it.
"""

[[en.pages]]
title   = "Harmonic headroom for the headliner"
content = """
A headliner who arrives in a room that blends with the last track has one thing less to fight. One who arrives in a clash spends their first minutes cleaning up.

Simple habits:

- **Ask or find out** what tempo and style the headliner usually opens with.
- **End your set somewhere neutral**: avoid finishing on a very distinctive tonal colour that the next DJ would have to answer.
- If you don't know their style, keep the warm-up tonally open and **simple** (a bright, major-leaning feel at the start, more ambiguous towards the end) and let them take it darker or brighter.

If you use key labels (Camelot or Open Key in Rekordbox), treat them as a guide for **compatible** blends, not as a rule for the whole night. In a warm-up, a groove that stays out of the way matters more than the perfect key match.
"""

[[en.pages]]
title   = "The density metric: absorbed vs ignored"
content = """
The biggest warm-up mistake is to confuse **being absorbed** with **being ignored**.

A good warm-up is *background by design*. The crowd is meant to talk, move around, arrive. If everyone is staring at you at 22:15, you may have pushed too early. The right metric for the first half hour isn't reaction — it's the **change in density**: are there more people on the floor than 15 minutes ago?

- Nobody looking at you while people arrive and chat: *correct*.
- Everyone staring at you at 22:15: you probably played something too big and interrupted the social flow.

This is counter-intuitive, because normal performance logic says attention equals success. A warm-up flips that: the music fitting into people's evening without demanding attention equals success.

**Check routine:** every 20 minutes, roughly count how many people are on the floor and how many at the bar. Track the change. That's your scoreboard.
"""

[[en.pages]]
title   = "Volume: the quiet warm-up tool"
content = """
Volume is part of the arc, and in a warm-up it protects your **headroom**.

- **Start a little under your ceiling.** A room that's already loud at 22:15 has nowhere to go; one that starts comfortable leaves the headliner something to give.
- **Raise in small steps**, while the room fills, rather than in one move. People adapt without noticing.
- **Don't use the master fader for emphasis.** Set each track's level with its channel gain and keep the master where you found it.
- **Leave the faders as you'd want to find them.** The next person inherits your settings.
- Ask the sound engineer or the organiser if there's a level agreed for the opening slot, and follow it.

The principle is the same as for the tempo ramp: don't spend your reserves early. We go deeper on levels and hearing limits in the Pro lesson on peak timing.
"""

