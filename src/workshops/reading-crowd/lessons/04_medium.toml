title      = "Warmup — Medium"
short_desc = "BPM ramp anatomy, harmonic space, and the frame-building mindset that turns a warmup into a career move."
description = "The concrete warmup toolkit: BPM ramp timing, harmonic headroom, genre-specific opening registers, and why the warmup slot is the most undervalued career asset in DJ culture."
