[[en.pages]]
title   = "The warmup BPM ramp: anatomy of a 2-hour opening"
content = """
A 2-hour warmup (22:00–00:00) has a specific BPM shape that experienced openers have converged on:

**22:00–22:30 (first 25%):** 100–108 BPM. Ambient-house, dub-techno, downtempo with groove. The room is filling, conversations are happening, the bar is busy. You're not competing with the noise — you're coexisting with it. Tracks with long intros, minimal drops.

**22:30–23:00 (25–50%):** 108–115 BPM. Deep house, minimal. The groove tightens. More people are on the floor. Still conversational in energy — nobody is fully dancing yet, but the body wants to.

**23:00–23:30 (50–75%):** 115–122 BPM. House with a bit more body. Density is building, people have committed to staying. This is where you start to earn the energy you've been building.

**23:30–00:00 (last 25%):** 120–125 BPM. Hand-off territory. Your last track leaves at +3 BPM into the headliner's opening register — not right at their floor tempo. The asymmetry is intentional: most of the BPM rise happens here, not at the start. The room has been loading for 90 minutes and responds more dramatically to tempo at this density.

**Never** accelerate linearly. The curve front-loads patience, back-loads momentum.
"""

[[en.pages]]
title   = "Harmonic space and key discipline"
content = """
A headliner who arrives to a harmonically compatible room has one less thing to fight. A headliner who arrives to a harmonically conflicting room spends their first 2–3 tracks clearing the residue. That costs them energy — and they'll know whose opening set caused it.

**Harmonic warmup strategy:**
- Know what keys the headliner tends to work in. Most techno residents have key preferences — some favor the dark drama of D minor, others the tension of F# minor.
- Warm up in **adjacent or modal keys** (parallel major/minor, or a fifth above/below). This leaves harmonic headroom — your key choices create a tension that the headliner's first track *resolves*.
- Avoid warmups that end in the same key as the headliner's known opener. It makes their arrival sound like a continuation, not an arrival.

**Practical:** if you don't know the headliner's key preferences, open in **major keys** (which read as *daylight*) and let the headliner move into minor territory (which reads as *night*). That transition is intuitive to the crowd and requires no coordination.

**On key modulation during the warmup:** each 30-minute block can have a subtle harmonic shift. Start bright (A major, D major), shift modal (A dorian, D dorian), end ambiguous. The harmonic journey builds anticipation without committing to a destination the headliner owns.
"""

[[en.pages]]
title   = "The density metric: being absorbed vs being ignored"
content = """
The biggest mistake warmup DJs make is confusing **being absorbed** with **being ignored**.

A warmup done right is *background-by-design*. The crowd is supposed to be chatting, getting drinks, arriving. If they're all staring at you at 22:15, you've escalated too soon. The right metric for the first 30 minutes is not crowd reaction — it's **room density delta**: is more people in the room now than 15 minutes ago?

**Tactical reframe:**
- Not watching you at 22:15 = people are arriving and socializing. *Correct.*
- Staring at the booth at 22:15 = you played something too big and interrupted the social fabric. *Incorrect.*

This is counterintuitive because normal performance logic says: audience attention = success. Warmup inverts this. Audience *absorption* (the music integrates into their social experience without demanding attention) = success.

When you've built 90 minutes of absorption correctly, the moment you start escalating at 23:30 cuts through like a knife — because the contrast is enormous. That contrast is what the warmup is building. It cannot be built if you demand attention at 22:15.

**The density check routine:** every 20 minutes, count approximately how many people are on the floor vs the bar. Track the delta. That's your performance metric.
"""

