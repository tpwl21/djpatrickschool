[fr]
title      = "Lire un dancefloor — Pro"
short_desc = "Groove et syncope, qui bouge en premier, la cabine comme point focal, preuve sociale, et le verdict d'une phrase."
description = "Ce que la science dit (et ne dit pas) de ce que tu lis quand tu lis une foule, traduit en habitudes que tu peux tester toi-même."
recap = [
  "Recherche sur le groove (Witek et al., 2014) : une syncope modérée est liée à la plus forte envie de bouger ; trop simple ou trop complexe, ça baisse.",
  "Le mouvement se propage : certains lancent, d'autres suivent. Le fond de la salle teste si une track fonctionne pour tout le monde, pas seulement pour les plus motivés.",
  "La cabine est un point focal : une foule qui te regarde peut t'admirer ou attendre un signal. Lis les visages, pas seulement la direction.",
  "La preuve sociale joue dans les deux sens : un groupe visible au bar rend le départ normal. Réponds par un groove solide, pas par la surenchère.",
  "Le verdict sur une nouvelle track tombe vite : lis la salle dans la première phrase (8 mesures = 32 temps), puis confirme sur la suivante.",
]

[[fr.pages]]
title   = "Le groove : ce qui donne envie de bouger"
content = """
Witek et al. (PLOS ONE, 2014) ont fait écouter à des auditeurs des motifs de batterie plus ou moins syncopés (des accents placés hors du temps principal). Résultat : l'envie de bouger et le plaisir étaient **les plus élevés à syncope modérée**, et plus faibles pour les motifs trop droits ou trop complexes. Un U inversé, encore.

Ce que ça veut dire en cabine :

- Le groove est **en partie structurel**, pas seulement une question de goût : le rythme lui-même peut inviter ou non au mouvement.
- Si les gens bougent ensemble, ta track est probablement dans la bonne zone pour cette salle.
- S'ils bougent en désordre les uns par rapport aux autres, la track est peut-être trop simple (rien à saisir) ou trop irrégulière (difficile à anticiper).
- Ce sont **deux diagnostics différents**. « Joue quelque chose de connu » n'est pas toujours la solution : parfois il faut un rythme avec un peu plus, ou un peu moins, d'éléments hors temps.

Limite : l'étude utilisait de courts motifs de batterie en laboratoire. Elle appuie l'idée, elle ne prouve pas une règle de piste de danse.
"""

[[fr.pages]]
title   = "Qui bouge en premier, et le test du fond de salle"
content = """
Dans un groupe, le mouvement apparaît rarement partout en même temps. Quelques personnes lancent, d'autres suivent quand elles voient que c'est accepté, certaines ne s'y mettent que quand c'est évident. C'est un schéma général d'influence sociale : ne considère aucune répartition chiffrée précise comme établie pour les pistes de danse.

Ce que tu peux en tirer :

- Le **devant** est en général ton public le plus acquis. Si seul le devant bouge, tu as des fans, pas encore une salle entière.
- Le **fond** est le plus difficile à faire bouger. Quand il bouge, la track fonctionne pour le grand public.
- Donc après un moment clé, **lis le fond d'abord**, puis vérifie que le devant est toujours avec toi.

Astuce de salle : si tu joues dans un lieu inconnu, demande à quelqu'un qui le connaît où se placent d'habitude les plus motivés, puis base ta lecture sur les autres zones.
"""

[[fr.pages]]
title   = "La cabine comme point focal"
content = """
Thomas Schelling (1960) a décrit les **points focaux** : des endroits où l'attention de chacun converge sans que personne ne l'ait décidé. En club, la cabine joue souvent ce rôle.

Une foule tournée vers toi est donc ambiguë :

- Visages ouverts et mobiles : ils sont dedans, curieux de la suite.
- Visages neutres ou interrogatifs : ils attendent peut-être un signal pour savoir comment réagir.

L'orientation du corps ne suffit pas à les distinguer : il faut regarder l'expression et ce que fait le corps. Quand la salle attend, de petits signes de ta part (un hochement de tête, un geste, un vrai changement dans la musique) peuvent aider. C'est une **hypothèse** tirée de la psychologie sociale, pas un résultat mesuré pour les cabines de DJ : teste-la sur ta propre piste.
"""

[[fr.pages]]
title   = "Preuve sociale et groupe au bar"
content = """
La **preuve sociale** est la tendance à regarder ce que font les autres pour décider quoi faire. Sur une piste, elle joue dans les deux sens : une piste pleine attire, et un groupe qui grossit au bar rend le départ normal.

Le réflexe habituel, jouer plus gros, échoue souvent. Une piste qui décroche n'a pas besoin de plus d'intensité mais d'une raison de rester. Des pistes à essayer, dans l'ordre :

1. Reviens à un **groove solide et familier**, avec un grave bien présent.
2. Garde le tempo stable, ou ne le bouge que de peu.
3. Laisse-lui une phrase ou deux (8 à 16 mesures) avant de juger.

Il n'existe pas de chiffre fiable pour la durée de la fenêtre de réparation. Repère : agis tant que seul le fond de la salle se vide ; une fois que le milieu se vide, c'est beaucoup plus difficile.
"""

[[fr.pages]]
title   = "Le verdict d'une phrase"
content = """
Quand une nouvelle track démarre, la réaction de la salle est **rapide**. Dans ce jeu, une phrase = **32 temps = 8 mesures** ; aux tempos de club (environ 120 à 130 BPM), cela fait environ **15 secondes** (de 15 à 16).

Une routine pratique :

- **Phrase 1 (mesures 1 à 8) : lis.** Dès que la track est installée, lève la tête et regarde le fond de la salle. Ne touche pas d'abord à l'EQ ni aux repères (cue points).
- **Phrase 2 (mesures 9 à 16) : confirme.** Ce que tu as vu tient-il ou grandit-il ?
- **Décide.** Continue, ajuste, ou prépare un changement.

Pourquoi si vite ? Le rythme donne tôt aux gens de quoi se joindre (ou non), et on copie les autres en quelques instants. Prends ces chiffres comme une **discipline**, pas comme une loi mesurée : l'habitude de lever la tête tôt vaut plus que la seconde exacte.
"""

