[en]
title      = "Reading a Dancefloor — Pro"
short_desc = "Groove and syncopation, who moves first, the booth as a focal point, social proof, and the one-phrase verdict."
description = "What the science does and doesn't say about what you're reading when you read a crowd, turned into habits you can test yourself."
recap = [
  "Groove research (Witek et al., 2014): moderate syncopation is linked to the strongest urge to move — too simple or too complex lowers it.",
  "Movement spreads: some people start, others follow. The back of the room is a good test of whether a track works for everyone, not just the keen ones.",
  "The booth is a focal point: a crowd staring at you may be admiring, or waiting for a cue. Read faces, not just direction.",
  "Social proof works both ways: a visible group at the bar makes leaving feel normal. Counter with a solid groove, not with escalation.",
  "The verdict on a new track comes fast: read the room within the first phrase (8 bars = 32 beats), then confirm over the next one.",
]

[[en.pages]]
title   = "Groove: what makes people want to move"
content = """
Witek et al. (PLOS ONE, 2014) played listeners drum patterns with different amounts of syncopation (accents falling off the main beat). The result: the desire to move and the feeling of pleasure were **highest at moderate syncopation**, and lower for patterns that were too straightforward or too complex. An inverted U again.

What it means in the booth:

- Groove is **partly structural**, not only taste: the rhythm itself can invite movement or not.
- If people move together, your track is probably in the sweet spot for this room.
- If they move out of sync with each other, the track may be too simple (nothing to grab) or too irregular (hard to predict).
- These are **two different diagnoses**. "Play something familiar" is not always the fix: sometimes the fix is a rhythm with a bit more, or a bit less, going on off the beat.

Limit: the study used short drum patterns in a lab. It supports the idea, it doesn't prove a dancefloor rule.
"""

[[en.pages]]
title   = "Who moves first, and the back-of-the-room test"
content = """
Movement in a group rarely appears everywhere at once. A few people start, more follow when they see it's accepted, and some join only once it's obvious. This is a general social-influence pattern — don't treat any exact split between groups as established for dancefloors.

What you can use:

- The **front** is usually your most committed audience. If only the front moves, you know you have fans, not yet a whole room.
- The **back** is the hardest to move. When it moves, the track is working for the general crowd.
- So after a key moment, **read the back first**, then check whether the front is still with you.

Venue tip: if you play in an unfamiliar room, ask someone who knows it where the most committed people usually stand, then base your read on the other areas.
"""

[[en.pages]]
title   = "The booth as a focal point"
content = """
Thomas Schelling (1960) described **focal points**: places where people's attention converges without anyone deciding it. In a club the booth often plays that role.

That makes a crowd facing you ambiguous:

- Faces open and moving: they are in it, curious about the next track.
- Faces neutral or questioning: they may be waiting for a cue about how to react.

You can't tell them apart from the body's orientation alone; you need the expression and what the body is doing. When the room is waiting, small signals from you (a nod, a gesture, a clear change in the music) can help. This is a **hypothesis** drawn from social psychology, not a measured result for DJ booths — test it on your own floor.
"""

[[en.pages]]
title   = "Social proof and the bar cluster"
content = """
**Social proof** is the tendency to look at what others do to decide what to do. On a dancefloor it works in both directions: a full floor invites people in, and a growing group at the bar makes leaving feel normal.

The usual reflex — playing something bigger — often fails. A floor that's drifting doesn't need more intensity, it needs a reason to stay. Options to try, in order:

1. Go back to a **solid, familiar groove** with a clear low end.
2. Keep the tempo steady, or move it by a small amount.
3. Give it a phrase or two (8–16 bars) before judging.

There's no reliable figure for how long the window to repair stays open. As a rule of thumb, act while only the back of the room is thinning: once the middle empties, it gets much harder.
"""

[[en.pages]]
title   = "The one-phrase verdict"
content = """
When a new track starts, the room's reaction comes **fast**. In this game a phrase is **32 beats = 8 bars**; at club tempos (roughly 120–130 BPM), that is about **15 seconds** (roughly 15 to 16).

A practical routine:

- **Phrase 1 (bars 1–8): read.** As soon as the track is established, lift your head and look at the back of the room. Don't fiddle with EQ or cue points first.
- **Phrase 2 (bars 9–16): confirm.** Is what you saw holding or growing?
- **Decide.** Keep going, adjust, or prepare a change.

Why that quickly? Rhythm gives people what they need to join (or not) early, and people copy others within moments. Treat the numbers above as a **discipline**, not a measured law: the habit of looking up early is worth more than the exact second.
"""

