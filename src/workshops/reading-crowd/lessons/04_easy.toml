[en]
title      = "Warmup — Easy"
short_desc = "The hardest slot. Here's what it actually asks of you."
description = "Warmup is the slot nobody brags about — and the one that separates good DJs from great ones. This lesson gives you the concrete rules for your first warmup."
recap = [
  "Warmup = **no crowd momentum**. You create energy from nothing.",
  "Start **~20 BPM below the headliner** — if they play 130, you open at 108–112.",
  "**Deep and groovy** always beats melodic and euphoric in a half-empty room.",
  "The right metric for warmup: *is the room filling?* — not *is the room cheering?*",
  "**Try this:** record your next warmup set. Listen back and count how many times you escalated too soon.",
]

[[en.pages]]
title   = "Why warmup is the hardest slot"
content = """
The headliner walks into a full room, a crowd buzzing with anticipation, and peak energy already in the air.

The warmup DJ walks into: coats still on, people queuing for the bar, half the room chatting.

**You have no momentum to ride.** You have to create it from zero.

That's why warmup is considered the most technically difficult slot. Most gigs get easier with experience. Warmup stays hard, because every warmup is a different version of the same challenge: building something from nothing.

**Try this next time you DJ at home:** practice a 20-minute set that starts at 105 BPM and slowly climbs to 118 BPM without ever sounding rushed. That controlled ramp is the core skill.
"""

[[en.pages]]
title   = "The concrete warmup rules"
content = """
These aren't preferences — they're tested rules from the warmup canon:

1. **Start ~20 BPM below the headliner.** If the headliner plays 130, you open at 108–112. You're setting the floor, not the ceiling.

2. **Deep and groovy beats melodic and euphoric.** A half-empty room feels awkward under euphoric tracks. Groove forgives emptiness — it gives people something to lock into quietly, without demanding they react.

3. **Don't play your own signature tracks.** Or the headliner's. Warmup is not the moment to show your best cards.

4. **The right metric is density, not applause.** If everyone is staring at you, you may have escalated too soon. A proper warmup is background-by-design: people should be arriving, chatting, and slowly moving toward the floor.

**Try this at your next gig:** at the 30-minute mark, look at the room density. Is it more full than when you started? If yes, you're doing your job.
"""

[[en.pages]]
title   = "The Daniele Baldelli lesson"
content = """
Daniele Baldelli played at **Cosmic** (Verona, late 70s / early 80s). His warmup sets started around **60 BPM** and climbed to 140 BPM — over 4 hours.

He said the crowd's *body* learned to trust him before their *ears* did. The first 30–40 minutes were so slow and atmospheric that people barely knew they were dancing. By the time the first proper dance track dropped, the room was already his.

**The lesson:** warmup is earning the right to ask the crowd for energy later. If you earn it, one small gesture lands massively. If you skip it, no drop works.

**Try this:** find a Daniele Baldelli Cosmic mix on YouTube. Listen to the first 20 minutes. Notice how he builds without rushing.
"""

[[en.pages]]
title   = "Not escalating when you want to"
content = """
The hardest part of warmup is **emotional**, not technical.

The room is thin. Nobody's reacting. The promoter is across the bar, not looking at you. You feel invisible. Every instinct says: *play something bigger, get their attention*.

**Don't.**

Your job is to hold the slope. Keep the BPM gradual. Play tracks that fill space without demanding reaction. The payoff comes 60–90 minutes later when the headliner drops their first track and the room *explodes* — because you spent an hour building the drag coefficient.

Jeff Mills once said: *the warmup DJ actually determines the shape of the night. The headliner just drives the last section.*

**Try this:** next home practice, set a rule — for 20 minutes, play nothing above 118 BPM, no matter how much you want to. That restraint muscle is what warmup asks for.
"""

