[fr]
title      = "Warmup — Easy"
short_desc = "Le slot le plus dur. Voici ce qu'il te demande vraiment."
description = "Le warmup est le slot dont personne ne se vante — et celui qui sépare les bons DJs des grands. Cette leçon te donne les règles concrètes pour ton premier warmup."
recap = [
  "Warmup = **aucun momentum de foule**. Tu crées l'énergie depuis zéro.",
  "Commence **~20 BPM sous la tête d'affiche** — s'ils jouent 130, tu ouvres à 108–112.",
  "**Deep et groovy** bat toujours mélodique et euphorique dans une salle à moitié vide.",
  "La bonne métrique pour un warmup : *la salle se remplit ?* — pas *la salle applaudit ?*",
  "**Try this :** enregistre ton prochain set de warmup. Réécoute et compte combien de fois tu as escaladé trop tôt.",
]

[[fr.pages]]
title   = "Pourquoi le warmup est le slot le plus dur"
content = """
La tête d'affiche entre dans une salle pleine, un public qui buzz d'anticipation, et de l'énergie peak déjà dans l'air.

Le DJ de warmup entre dans : manteaux sur le dos, gens qui font la queue au bar, moitié de la salle qui discute.

**Tu n'as aucun momentum à surfer.** Tu dois le créer depuis zéro.

C'est pour ça que le warmup est considéré comme le slot techniquement le plus difficile. La plupart des gigs deviennent plus faciles avec l'expérience. Le warmup reste dur, parce que chaque warmup est une version différente du même défi : construire quelque chose depuis rien.

**Try this la prochaine fois que tu DJs chez toi :** pratique un set de 20 minutes qui commence à 105 BPM et monte lentement jusqu'à 118 BPM sans jamais sonner précipité. Cette rampe contrôlée est la compétence centrale.
"""

[[fr.pages]]
title   = "Les règles concrètes du warmup"
content = """
Ce ne sont pas des préférences — ce sont des règles testées du canon du warmup :

1. **Commence ~20 BPM sous la tête d'affiche.** Si la tête joue 130, tu ouvres à 108–112. Tu poses le plancher, pas le plafond.

2. **Deep et groovy bat mélodique et euphorique.** Une salle à moitié vide se sent mal à l'aise sous des tracks euphoriques. Le groove pardonne la vacuité — il donne aux gens quelque chose sur quoi s'accrocher tranquillement, sans leur demander de réagir.

3. **Ne joue pas tes tracks signature.** Ni celles de la tête d'affiche. Le warmup n'est pas le moment de montrer tes meilleures cartes.

4. **La bonne métrique est la densité, pas les applaudissements.** Si tout le monde te fixe, tu as peut-être escaladé trop tôt. Un bon warmup est du background by design : les gens arrivent, discutent, se déplacent lentement vers la piste.

**Try this à ton prochain gig :** à la 30ème minute, regarde la densité de la salle. Est-elle plus pleine qu'au début ? Si oui, tu fais ton boulot.
"""

[[fr.pages]]
title   = "La leçon Daniele Baldelli"
content = """
Daniele Baldelli jouait au **Cosmic** (Vérone, fin 70s / début 80s). Ses sets de warmup commençaient autour de **60 BPM** et montaient à 140 BPM — sur 4 heures.

Il disait que le *corps* du public apprenait à lui faire confiance avant que les *oreilles* ne le fassent. Les 30–40 premières minutes étaient si lentes et atmosphériques que les gens savaient à peine qu'ils dansaient. Au moment où la première vraie track de danse tombait, la salle était déjà sienne.

**La leçon :** le warmup, c'est gagner le droit de demander de l'énergie à la foule plus tard. Si tu le gagnes, le moindre geste atterrit massivement. Si tu le sautes, aucun drop ne fonctionne.

**Try this :** trouve un mix live de Daniele Baldelli au Cosmic sur YouTube. Écoute les 20 premières minutes. Remarque comment il construit sans se précipiter.
"""

[[fr.pages]]
title   = "Ne pas escalader quand tu en as envie"
content = """
La partie la plus difficile du warmup est **émotionnelle**, pas technique.

La salle est fine. Personne ne réagit. Le promoteur est au bar, il ne te regarde pas. Tu te sens invisible. Chaque instinct dit : *joue quelque chose de plus gros, attire leur attention*.

**Ne le fais pas.**

Ton boulot c'est de tenir la pente. Garde le BPM progressif. Joue des tracks qui remplissent l'espace sans exiger de réaction. La récompense arrive 60–90 minutes plus tard quand la tête d'affiche drop sa première track et que la salle *explose* — parce que tu as passé une heure à construire le coefficient de traînée.

Jeff Mills a dit un jour : *le DJ de warmup détermine réellement la forme de la soirée. La tête d'affiche ne fait que conduire la dernière section.*

**Try this :** à ta prochaine pratique chez toi, fixe une règle — pendant 20 minutes, ne joue rien au-dessus de 118 BPM, quoi qu'il arrive. Ce muscle de la retenue, c'est ce que le warmup demande.
"""

