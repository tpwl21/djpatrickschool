[en]
title      = "Warmup"
short_desc = "The hardest slot. Here's what it really asks of you."
description = "The warmup is the slot nobody brags about — and the one that separates good DJs from great ones. This lesson gives you simple landmarks for your first warmup."
recap = [
  "A warmup starts with **no crowd momentum**: you create the energy from zero.",
  "Open **well below** the headliner's tempo — for example around 110 BPM if they'll play 130.",
  "**Deep and groovy** usually works better than melodic and euphoric in a half-empty room.",
  "The right question: *is the room filling up?* — not *is the room cheering?*",
  "**Try this:** record a practice warmup, listen back, and count how often you pushed too early.",
]

[[en.pages]]
title   = "Why the warmup is the hardest slot"
content = """
The headliner walks into a full room, a crowd buzzing with anticipation, and energy already in the air.

The warmup DJ walks into: coats still on, people queuing, half the room chatting.

**You have no momentum to ride.** You have to create it from zero.

That's why many DJs consider the warmup the hardest slot. Every warmup is a new version of the same challenge: building something out of nothing.

**Try this at home:** practise a 20-minute set that starts around 105 BPM and slowly rises to about 118 BPM without ever sounding rushed. That controlled ramp is the core skill.

(BPM = beats per minute, the tempo of a track.)
"""

[[en.pages]]
title   = "Concrete landmarks for a warmup"
content = """
These are landmarks, not laws — but they work in most rooms:

1. **Start well below the headliner's tempo.** If they'll play 130 BPM, opening around 108–112 is a good example. You set the floor, not the ceiling.

2. **Deep and groovy beats melodic and euphoric.** A half-empty room feels awkward under euphoric tracks. Groove gives people something to hold on to quietly, without asking them to react.

3. **Don't play your own big tracks — or the headliner's.** The warmup isn't the time to show your best cards.

4. **The right measure is density, not applause.** *Density* means how full the dancefloor is. If everyone stares at you, you may have pushed too early. A good warmup is background by design: people arrive, chat, and drift towards the floor.

**Try this:** in a practice set, check the 'room' at minute 30 (imagine it, or use a recording of a real club set). Is it fuller than at the start? If so, you're doing the job.
"""

[[en.pages]]
title   = "Earning the right to ask for energy later"
content = """
The point of a warmup is to **earn the right to ask the crowd for energy later**.

Start slowly and atmospherically, so people settle in without realising they've started moving. By the time the first really energetic track arrives, the room is already with you. If you skip that step, no drop will work as well.

You can hear this in recorded club sets: listen to the first 20 minutes of a long set and notice how little is "happening" — and how naturally the energy builds afterwards.

**Try this:** find a long live-set recording on YouTube or a DJ platform. Listen to the first 20 minutes. Notice how it builds without hurrying.
"""

[[en.pages]]
title   = "Don't escalate just because you feel like it"
content = """
The hardest part of a warmup is **emotional**, not technical.

The room is thin. Nobody reacts. The organiser is at the bar, not looking. You feel invisible. Every instinct says: *play something bigger, get their attention.*

**Don't.**

Your job is to hold the slope. Keep the tempo rising gradually. Play tracks that fill the space without demanding a reaction. The reward comes later, when the headliner starts and the room *explodes* — partly because you spent an hour building momentum.

**Try this:** in your next practice, set a rule — for 20 minutes, nothing above 118 BPM, no matter what. That muscle of restraint is what a warmup asks for.
"""

