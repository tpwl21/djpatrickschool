[fr]
title      = "Le warmup"
short_desc = "Le créneau le plus difficile. Voici ce qu'il te demande vraiment."
description = "Le warmup est le créneau dont personne ne se vante, et celui qui sépare les bons DJs des grands. Cette leçon te donne des repères simples pour ton premier warmup."
recap = [
  "Un warmup démarre avec **aucun élan de foule** : tu crées l'énergie à partir de zéro.",
  "Ouvre **bien en dessous** du tempo de la tête d'affiche, par exemple vers 110 BPM si elle jouera à 130.",
  "**Deep et groovy** marche généralement mieux que mélodique et euphorique dans une salle à moitié vide.",
  "La bonne question : *la salle se remplit-elle ?* et non *la salle applaudit-elle ?*",
  "**À toi de jouer :** enregistre un warmup d'entraînement, réécoute-le et compte combien de fois tu as poussé trop tôt.",
]

[[fr.pages]]
title   = "Pourquoi le warmup est le créneau le plus difficile"
content = """
La tête d'affiche entre dans une salle pleine, un public qui bouillonne d'attente, et de l'énergie déjà dans l'air.

Le DJ de warmup entre dans : manteaux encore sur le dos, gens qui font la queue, moitié de la salle qui discute.

**Tu n'as aucun élan à exploiter.** Tu dois le créer à partir de zéro.

C'est pourquoi beaucoup de DJs considèrent le warmup comme le créneau le plus difficile. Chaque warmup est une nouvelle version du même défi : construire quelque chose à partir de rien.

**À toi de jouer, chez toi :** entraîne-toi sur un set de 20 minutes qui démarre vers 105 BPM et monte doucement jusqu'à environ 118 BPM sans jamais sonner précipité. Cette rampe contrôlée est la compétence centrale.

(BPM = battements par minute, le tempo d'une track.)
"""

[[fr.pages]]
title   = "Des repères concrets pour un warmup"
content = """
Ce sont des repères, pas des lois, mais ils fonctionnent dans la plupart des salles :

1. **Commence bien en dessous du tempo de la tête d'affiche.** Si elle jouera à 130 BPM, ouvrir vers 108–112 est un bon exemple. Tu poses le plancher, pas le plafond.

2. **Deep et groovy bat mélodique et euphorique.** Une salle à moitié vide se sent mal à l'aise sous des tracks euphoriques. Le groove donne aux gens quelque chose à quoi s'accrocher discrètement, sans leur demander de réagir.

3. **Ne joue ni tes plus gros morceaux, ni ceux de la tête d'affiche.** Le warmup n'est pas le moment de montrer tes meilleures cartes.

4. **La bonne mesure est la densité, pas les applaudissements.** La *densité*, c'est à quel point la piste est remplie. Si tout le monde te fixe, tu as peut-être poussé trop tôt. Un bon warmup est un fond sonore par conception : les gens arrivent, discutent et dérivent vers la piste.

**À toi de jouer :** pendant un set d'entraînement, vérifie la « salle » à la minute 30 (imagine-la, ou prends l'enregistrement d'un vrai set de club). Est-elle plus pleine qu'au début ? Si oui, tu fais le travail.
"""

[[fr.pages]]
title   = "Gagner le droit de demander de l'énergie plus tard"
content = """
Le but d'un warmup est de **gagner le droit de demander de l'énergie à la foule plus tard**.

Commence lentement et en ambiance, pour que les gens s'installent sans s'apercevoir qu'ils ont commencé à bouger. Quand arrive le premier morceau vraiment énergique, la salle est déjà avec toi. Si tu sautes cette étape, aucun drop ne fonctionnera aussi bien.

On l'entend dans les sets de club enregistrés : écoute les 20 premières minutes d'un long set et remarque à quel point il « se passe » peu de choses, et à quel point l'énergie monte naturellement ensuite.

**À toi de jouer :** trouve l'enregistrement d'un long set live sur YouTube ou une plateforme de DJ. Écoute les 20 premières minutes. Remarque comme il monte sans se presser.
"""

[[fr.pages]]
title   = "Ne pas escalader juste parce que tu en as envie"
content = """
La partie la plus difficile du warmup est **émotionnelle**, pas technique.

La salle est clairsemée. Personne ne réagit. L'organisateur est au bar et ne regarde pas. Tu te sens invisible. Tous tes instincts disent : *joue plus gros, attire leur attention.*

**Ne le fais pas.**

Ton travail est de tenir la pente. Fais monter le tempo progressivement. Joue des tracks qui remplissent l'espace sans exiger de réaction. La récompense vient plus tard, quand la tête d'affiche démarre et que la salle *explose*, en partie parce que tu as passé une heure à construire l'élan.

**À toi de jouer :** à ton prochain entraînement, fixe-toi une règle : pendant 20 minutes, rien au-dessus de 118 BPM, quoi qu'il arrive. Ce muscle de la retenue, c'est ce que demande un warmup.
"""

