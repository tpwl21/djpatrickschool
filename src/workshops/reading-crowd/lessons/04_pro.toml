[fr]
title      = "Warmup — Pro : l'étiquette"
short_desc = "Ce qu'un bon DJ d'ouverture ne fait pas : les morceaux de la tête d'affiche, le plafond, l'horloge et la cabine."
description = "Les règles non écrites du créneau d'ouverture : respecter le répertoire de la tête d'affiche, garder un plafond, rester dans son temps et laisser la cabine en meilleur état qu'à l'arrivée."
recap = [
  "Un warmup sert la soirée : ton succès, c'est une salle prête, pas un set dont les gens se souviennent pour toi.",
  "**Ne joue pas les morceaux de la tête d'affiche** (ni rien qui lui soit fortement associé) ; vérifie avant si tu hésites.",
  "**Garde un plafond :** termine à une énergie et un tempo d'où la tête d'affiche peut monter. Ne lui prends jamais son peak.",
  "**Respecte l'horloge et le volume** : commence à l'heure, finis à l'heure, laisse le master où tu l'as trouvé.",
  "Reste discret : pas d'annonces, pas de manœuvres pour te faire remarquer, pas de plaintes sur ton créneau.",
]

[[fr.pages]]
title   = "Ton travail, c'est la salle de la tête d'affiche"
content = """
Au niveau pro, le warmup est un **rôle de service**. Tu ne répètes pas ton propre peak ; tu prépares une salle pour celui de quelqu'un d'autre.

Conséquences pratiques :

- Demande à l'organisateur (ou à l'équipe de la tête d'affiche) son **style et son tempo de départ** habituels. Un court message à l'avance évite un choc.
- Vise à rendre une salle **chaude, assez pleine et encore curieuse**, pas déjà épuisée.
- On te remerciera rarement pour l'énergie que tu *n'as pas* utilisée. Ça fait partie du métier.

Tes récompenses sont indirectes : les organisateurs qui voient la piste se remplir pendant ton créneau penseront à toi, et les têtes d'affiche se souviennent des DJs d'ouverture qui leur ont facilité la tâche.
"""

[[fr.pages]]
title   = "L'étiquette du répertoire : ne joue pas leurs morceaux"
content = """
Évite, dans cet ordre :

1. **Les morceaux que la tête d'affiche a produits, remixés, ou pour lesquels elle est connue.** Les jouer en premier lui vole son moment et fait de son set une redite.
2. **Les morceaux qu'elle joue habituellement en ouverture ou en clôture**, si tu les connais.
3. **Tes propres plus gros morceaux.** Ils appartiennent à un créneau plus tardif ; les garder fait partie de la leçon 3.
4. **Les hymnes évidents du genre.** Ils créent un peak que tu ne peux pas suivre.

Si tu n'es pas sûr qu'un morceau appartient à l'univers de la tête d'affiche, saute-le ou demande. Il y a plein d'autres morceaux, et personne ne s'est jamais plaint qu'un DJ d'ouverture ait trop de goût.

Outil : garde dans ton logiciel une courte liste de morceaux « interdits » par soirée (une playlist ou une couleur), pour ne pas décider sous pression.
"""

[[fr.pages]]
title   = "Le plafond, l'horloge et le volume"
content = """
Trois limites à fixer avec toi-même avant le set :

- **Plafond d'énergie.** Décide où tu t'arrêtes. Une bonne image : ton dernier morceau doit être à un niveau d'énergie sur lequel la tête d'affiche peut construire, pas qu'elle doit égaler. Si la salle est clairement prête pour plus, tu peux en ajouter un peu, mais ne prends pas le peak.
- **Temps.** Commence quand c'est ton heure et arrête-toi quand c'est ton heure. Un DJ d'ouverture qui déborde empiète sur le set suivant ou fait attendre la tête d'affiche ; celui qui finit tôt laisse un trou. Convenez de l'heure de passation à l'avance.
- **Volume.** Respecte le niveau d'ouverture convenu avec l'ingénieur du son et laisse le master où tu l'as trouvé. Pousser le master à 22 h 30 retire de la marge à la tête d'affiche (voir leçon 3).

Si le créneau change (retard, set plus long), replanifie ton plafond plutôt que de simplement prolonger.
"""

[[fr.pages]]
title   = "En cabine : comporte-toi en invité"
content = """
- **Arrive tôt** et vérifie ta clé USB, tes câbles et l'agencement de la cabine avant l'ouverture des portes.
- **Reste discret et ordonné** : pas de matériel inutile, pas de désordre sur la table.
- **Garde la place de la tête d'affiche libre** : sa clé USB, son ordinateur ou son contrôleur devra peut-être se brancher vite.
- **Ne t'annonce pas, et n'annonce pas le DJ suivant** par-dessus la musique, et ne demande pas de réaction à la foule.
- **Ne te plains pas de ton créneau** devant la salle. Un bon warmup est sa propre réponse.

Le warmup est l'endroit où l'on apprend qui est agréable à côtoyer. Cette réputation vaut autant qu'un bon set.
"""

