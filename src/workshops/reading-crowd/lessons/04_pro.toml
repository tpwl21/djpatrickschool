[en]
title      = "Warmup — Pro: Etiquette"
short_desc = "What a good opener doesn't do: the headliner's tracks, the ceiling, the clock, and the booth."
description = "The unwritten rules of the opening slot: respect the headliner's material, keep a ceiling, stay inside your time, and leave the booth better than you found it."
recap = [
  "A warm-up serves the night: your success is a room that's ready, not a set people remember for you.",
  "**Don't play the headliner's tracks** (or anything strongly identified with them) — check beforehand if unsure.",
  "**Keep a ceiling:** end at an energy and tempo from which the headliner can climb. Never take their peak.",
  "**Respect the clock and the volume**: start on time, finish on time, keep the master where you found it.",
  "Be quiet about it: no announcements, no tricks to get noticed, no complaints about the slot.",
]

[[en.pages]]
title   = "Your job is the headliner's room"
content = """
At the pro level the warm-up is a **service role**. You are not rehearsing your own peak; you are preparing a room for someone else's.

Practical consequences:

- Ask the organiser (or the headliner's team) about their usual **style and starting tempo**. A short message beforehand saves a clash.
- Aim to hand over a room that is **warm, fairly full, and still curious** — not already exhausted.
- You'll rarely be thanked for the energy you *didn't* use. That's part of the craft.

Your rewards are indirect: organisers who see a floor filling during your slot will think of you again, and headliners remember the openers who made their job easier.
"""

[[en.pages]]
title   = "Repertoire etiquette: don't play their tracks"
content = """
Avoid, in this order:

1. **Tracks the headliner made, remixed, or is famous for.** Playing them first steals their moment and makes their set feel like a repeat.
2. **Tracks the headliner is known to open with or close with** — if you know them.
3. **Your own biggest tracks.** They belong to a later slot; saving them is part of Lesson 3.
4. **Obvious anthems for the genre.** They create a peak you can't follow.

If you're not sure whether a track belongs to the headliner's world, either skip it or ask. There are plenty of other tracks, and nobody has ever complained that an opener was too tasteful.

Tools: keep a short list of "no-go" tracks per night in your software (a playlist or a colour tag), so you aren't deciding under pressure.
"""

[[en.pages]]
title   = "The ceiling, the clock and the volume"
content = """
Three limits you agree with yourself before the set:

- **Energy ceiling.** Decide where you'll stop. A useful picture: your last track should be an energy level the headliner can build on, not match. If the room is clearly ready for more, you can add a little — but don't take the peak.
- **Time.** Start when you're due and stop when you're due. An opener who runs long cuts into the next set or leaves a headliner waiting; one who ends early leaves a gap. Agree handover time in advance.
- **Volume.** Keep to the opening level agreed with the sound engineer, and leave the master where you found it. Pushing the master at 22:30 takes away the headliner's headroom (see Lesson 3).

If the slot changes (a delay, a longer set), re-plan your ceiling rather than just extending.
"""

[[en.pages]]
title   = "In the booth: behave like a guest"
content = """
- **Arrive early** and check your USB, your cables and the booth layout before the doors open.
- **Be quiet and tidy**: no equipment that isn't needed, no mess on the mixer.
- **Keep the headliner's space free**: their USB, laptop or controller may need to go in quickly.
- **Don't announce yourself or the next DJ** over the music, and don't ask the crowd for a reaction.
- **Don't complain about the slot** in front of the room. A good warm-up is its own answer.

The warm-up is where people learn who is easy to work with. A reputation for that is worth as much as a good set.
"""

