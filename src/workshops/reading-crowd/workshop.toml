[en]
title      = "READING THE CROWD"
short_desc = "Read the dancefloor. Pick the right next move — not just the right next track."
long_desc  = "Pure psychology. No BPM, no Camelot fiches. Look at the crowd state (energy, density — how full the floor is — and moment), then choose the track that serves the floor. Each exercise teaches a different moment of the night: warmup, recovering an afterpeak dip, and closing signature."
objectives = [
  "Read a dancefloor by its energy and density, not its numbers",
  "Recognize when the crowd is asking for a build-up, a hold, or a release",
  "Pick closing tracks people remember"
]

[fr]
title      = "LECTURE DE FOULE"
short_desc = "Lis le dancefloor. Choisis le bon geste suivant — pas seulement la bonne track suivante."
long_desc  = "De la psychologie pure. Pas de BPM, pas de fiches Camelot. Regarde l'état de la foule (énergie, densité — à quel point la piste est remplie — et moment de la soirée), puis choisis la track qui sert le dancefloor. Chaque exercice enseigne un moment de la nuit : le warmup (la mise en route), relancer la salle après le moment fort (l'afterpeak), et la signature de fin de soirée (le closing)."
objectives = [
  "Lire un dancefloor par son énergie et sa densité, pas par ses chiffres",
  "Reconnaître si la foule demande une montée, un maintien, ou une résolution",
  "Choisir des tracks de fin de soirée dont on se souvient"
]
