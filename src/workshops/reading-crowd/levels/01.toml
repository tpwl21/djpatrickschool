id = "RTC_LEVEL_1"
order = 1

[en]
title       = "Don't Kill the Warmup"
short_desc  = "22:15. Thirty people. A banger now would be the end."
description = "Classic trap for the young DJ: the room is half-empty and slow, you panic, and you drop your best track. Result: the people already there leave, and the people arriving feel like they missed the peak."
coach_tips  = [
  "Energy 2 + density 2 = warmup territory. The room is still filling.",
  "The right pick holds space for later. It grooves without crying out.",
  "A banger here is a crime. Save it for 01:00."
]
recap = [
  "Warmup isn't boring — it's future peak built patiently.",
  "Energy +1 at a time: don't jump from 2 to 5.",
  "Dropping an energy-1 track on an energy-2 crowd is regression.",
  "The mistake that empties rooms: peaking too early."
]

[fr]
title       = "Ne tue pas le warmup"
short_desc  = "22h15. Trente personnes. Un banger maintenant, ce serait la fin."
description = "Piège classique du jeune DJ : la salle est à moitié vide et lente, tu paniques, et tu drop ta meilleure track. Résultat : les early birds partent, et ceux qui arrivent ont l'impression d'avoir raté le peak."
coach_tips  = [
  "Énergie 2 + densité 2 = territoire warmup. La salle se remplit encore.",
  "Le bon pick tient l'espace pour plus tard. Il groove sans crier.",
  "Un banger ici est un crime. Garde-le pour 01h00."
]
recap = [
  "Le warmup n'est pas ennuyeux — c'est le peak futur construit patiemment.",
  "Énergie +1 à la fois : ne saute pas de 2 à 5.",
  "Envoyer une énergie 1 sur une foule énergie 2, c'est régresser.",
  "L'erreur qui vide les salles : peaker trop tôt."
]

