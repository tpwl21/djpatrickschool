vibe_tags = ["early", "space_for_build", "patient"]
description_en = "22:15. Thirty people in a room that fits 300. A few heads nodding, others still by the bar. Tonight's going to be long."
description_fr = "22h15. Trente personnes dans une salle qui en tient 300. Quelques têtes qui dodelinent, d'autres encore au bar. La soirée va être longue."

[ui]
show_fiches = true

[[candidates]]
