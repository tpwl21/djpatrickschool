reason_en = "Energy 3 builds on top of a warmup state without crying. Groovy + patient — early arrivals nod, late arrivals don't feel like they missed anything. Textbook warmup pick."
reason_fr = "Énergie 3 qui construit sur un warmup sans crier. Groovy + patient — ceux qui sont arrivés tôt dodelinent, ceux qui arrivent en retard n'ont pas l'impression d'avoir raté quoi que ce soit. Choix de manuel pour un warmup."

