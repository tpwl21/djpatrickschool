id = "RTC_LEVEL_3"
order = 3

[en]
title       = "Closing Signature"
short_desc  = "05:50. The last 10 minutes. Pick the track they'll remember."
description = "The moment every DJ fights for: the closing. Energy is down from peak but still present. The crowd is tired, in love with you, and ready to remember one track forever. Not the biggest — the most YOU."
coach_tips  = [
  "Closing ≠ warmdown. Energy is still 4. People are still dancing. They'll go home on this.",
  "Surprise beats familiarity. The track they didn't know was the perfect close IS the perfect close.",
  "Too new, too obscure, or too fresh can backfire — the closer should feel inevitable in hindsight."
]
recap = [
  "The closing is not a second peak — it's memory-making.",
  "Hold energy, don't spike it. The lights are up; the bodies are tired.",
  "Safe picks are forgotten in 24 hours; surprises are remembered forever.",
  "The right closer feels inevitable only in hindsight."
]

[fr]
title       = "Signature de closing"
short_desc  = "05h50. Les dix dernières minutes. Choisis la track dont ils se souviendront."
description = "Le moment que tout DJ veut : le closing. L'énergie est redescendue du peak mais tient. La foule est fatiguée, amoureuse de toi, et prête à retenir une track pour toujours. Pas la plus grosse — la plus TOI."
coach_tips  = [
  "Closing ≠ warmdown. L'énergie est encore à 4. Les gens dansent encore. Ils rentrent chez eux là-dessus.",
  "La surprise bat la familiarité. La track qu'ils ne connaissaient pas comme parfait closing EST le parfait closing.",
  "Trop neuf, trop obscur, trop frais peut se retourner — la closer doit sembler évidente avec du recul."
]
recap = [
  "Le closing n'est pas un second peak — c'est de la fabrication de souvenir.",
  "Tiens l'énergie, ne la pique pas. Les lumières sont remontées ; les corps sont fatigués.",
  "Les picks safe sont oubliés en 24h ; les surprises restent gravées.",
  "La bonne closer paraît évidente seulement après coup."
]

[track.A]
url = "AUDIO/Wake.mp3"
bpm = 126
title = "Closing A"
key = "9B"
