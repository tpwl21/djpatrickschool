[crowd]
energy = 4
density = 3
moment = "closing"
vibe_tags = ["tired_but_loyal", "memory_making", "almost_dawn"]
description_en = "05:50. The lights are slightly up. Half the room has thinned but the 40% left are the ones that stayed through everything. They're yours. Ten minutes left. They'll go home on whatever you play next."
description_fr = "05h50. Les lumières sont légèrement remontées. La moitié de la salle a filé mais les 40% restants sont ceux qui ont tenu. Ils sont à toi. Il reste 10 min. Ils rentreront chez eux sur ce que tu joues après."

[ui]
show_fiches = true

[[candidates]]
url = "AUDIO/Sourire.mp3"
title = "Sourire"
genre = "emotional house"
energy = 4
vibe = "unexpected, melodic, personal"
correct = true
reason_en = "Energy holds at 4. Melodic, warm, a track nobody expected you to close with. This is the signature move: the unlikely choice that suddenly feels inevitable. Six months later, someone tags you asking 'what was that closer?'"
reason_fr = "Énergie maintenue à 4. Mélodique, chaude, une track que personne n'attendait de toi en closing. C'est le move signature : le choix improbable qui devient évident. Six mois plus tard, quelqu'un te tague 'c'était quoi le closer ?'"

