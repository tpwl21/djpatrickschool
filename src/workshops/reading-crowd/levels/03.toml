id = "RTC_LEVEL_3"
order = 3

[en]
title       = "Closing Signature"
short_desc  = "05:50. The last 10 minutes. Pick the track they'll remember."
description = "The moment every DJ fights for: the closing. Energy is down from peak but still present. The crowd is tired, in love with you, and ready to remember one track forever. Not the biggest — the most YOU. Density = how full the floor is (the higher the number, the fuller the room)."
coach_tips  = [
  "Closing ≠ cool-down. Energy is still 4. People are still dancing. They'll go home on this.",
  "A well-chosen surprise often beats a familiar pick.",
  "Too new or too obscure can backfire — the closer should feel inevitable in hindsight."
]
recap = [
  "The closing is not a second peak — it's memory-making.",
  "Hold energy, don't spike it. The lights are up; the bodies are tired.",
  "Safe picks are quickly forgotten; a well-chosen surprise sticks.",
  "The right closer feels inevitable only in hindsight."
]

[fr]
title       = "Signature de closing"
short_desc  = "05h50. Les dix dernières minutes. Choisis la track dont ils se souviendront."
description = "Le moment que tout DJ veut : le closing. L'énergie est redescendue du peak mais tient. La foule est fatiguée, amoureuse de toi, et prête à retenir une track pour toujours. Pas la plus grosse — la plus TOI. Densité = à quel point la piste est remplie (plus le chiffre est haut, plus la salle est pleine)."
coach_tips  = [
  "Closing ≠ descente. L'énergie est encore à 4. Les gens dansent encore. Ils rentrent chez eux là-dessus.",
  "Une surprise bien choisie bat souvent un choix familier.",
  "Trop neuf ou trop obscur peut se retourner — la closer doit sembler évidente avec du recul."
]
recap = [
  "Le closing n'est pas un second moment fort — c'est la fabrication d'un souvenir.",
  "Tiens l'énergie, ne la pique pas. Les lumières sont remontées ; les corps sont fatigués.",
  "Les choix trop sûrs s'oublient vite ; une surprise bien choisie reste.",
  "La bonne closer paraît évidente seulement après coup."
]

[track.A]
url = "AUDIO/Wake.mp3"
bpm = 126
title = "Closing A"
key = "9B"
complexity = 3

[crowd]
energy = 4
density = 3
moment = "closing"
vibe_tags = ["tired_but_loyal", "memory_making", "almost_dawn"]
description_en = "05:50. The lights are slightly up. Half the room has thinned but the people left are the ones that stayed through everything. They're yours. Ten minutes left. They'll go home on whatever you play next."
description_fr = "05h50. Les lumières sont légèrement remontées. La moitié de la salle a filé mais ceux qui restent sont ceux qui ont tenu. Ils sont à toi. Il reste 10 min. Ils rentreront chez eux sur ce que tu joues après."

[ui]
show_fiches = true

[[candidates]]
url = "AUDIO/Sourire.mp3"
title = "Sourire"
genre = "emotional house"
energy = 4
vibe = "unexpected, melodic, personal"
correct = true
reason_en = "Energy holds at 4. Melodic, warm, a track nobody expected you to close with. This is the signature move: the unlikely choice that suddenly feels inevitable. Weeks later, someone still asks you 'what was that closer?'"
reason_fr = "Énergie maintenue à 4. Mélodique, chaude, une track que personne n'attendait de toi en closing. C'est le move signature : le choix improbable qui devient évident. Des semaines plus tard, quelqu'un te demande encore « c'était quoi, ce dernier morceau ? »"

[[candidates]]
url = "AUDIO/SCIFI.mp3"
title = "SciFi (Peak Reprise)"
