[en]
title       = "Relance the Afterpeak"
short_desc  = "02:30. The peak passed. Energy dropped 5→3. Don't panic. Don't overkill."
description = "The peak has happened. People are drinking water, going outside to smoke, coming back. The crowd is bleeding energy. Two wrong moves: drop another peak banger (overkill, crowd reads it as desperate), or chill too hard (surrender)."
coach_tips  = [
  "Afterpeak ≠ closing. The floor hasn't given up; it's catching its breath.",
  "Pick a track that re-engages bodies WITHOUT demanding peak-energy return.",
  "Tribal/groovy recoveries land the best. Forget the biggest drops for now."
]
recap = [
  "Afterpeak is recovery, not closing — the crowd is breathing, not leaving.",
  "Re-attempting a peak right after one feels desperate to the room.",
  "Nudge energy up one notch (3 → 4), don't snap back to 5.",
  "Tribal and groovy recoveries re-engage bodies without demanding full peak return."
]

[fr]
title       = "Relance l'afterpeak"
short_desc  = "02h30. Le peak est passé. Énergie tombée de 5 à 3. Pas de panique. Pas d'overkill."
description = "Le peak a eu lieu. Les gens boivent de l'eau, sortent fumer, reviennent. La foule saigne de l'énergie. Deux mauvais moves : claquer un autre banger peak (overkill, la foule lit ça comme du désespoir), ou partir trop chill (capitulation)."
coach_tips  = [
  "Afterpeak ≠ closing. La piste n'a pas abandonné ; elle reprend son souffle.",
  "Choisis une track qui rembarque les corps SANS exiger un retour energy-5.",
  "Les relances tribales/groovy tombent le mieux. Oublie les gros drops pour l'instant."
]
recap = [
  "L'afterpeak est une récupération, pas une fermeture — la foule respire, elle ne part pas.",
  "Retenter un peak direct après un peak fait désespéré aux yeux de la salle.",
  "Monte d'un cran (3 → 4), ne reclaque pas sur 5.",
  "Les relances tribales et groovy rembarquent les corps sans exiger le retour au peak."
]

