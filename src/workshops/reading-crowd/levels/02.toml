id = "RTC_LEVEL_2"
order = 2

[en]
title       = "Relance the Afterpeak"
short_desc  = "02:30. The peak passed. Energy dropped 5→3. Don't panic. Don't overdo it."
description = "The peak has happened. People are drinking water, stepping outside for air, coming back. The crowd is losing energy. Two wrong moves: drop another peak-energy track (overkill, the crowd can read it as desperate), or go too mellow (surrender). Density = how full the floor is (the higher the number, the fuller the room)."
coach_tips  = [
  "Afterpeak ≠ closing. The floor hasn't given up; it's catching its breath.",
  "Pick a track that re-engages bodies WITHOUT demanding peak-energy return.",
  "Tribal/groovy recoveries tend to land well. Leave the biggest drops for later."
]
recap = [
  "Afterpeak is recovery, not closing — the crowd is breathing, not leaving.",
  "Re-attempting a peak right after one can feel desperate to the room.",
  "Nudge energy up one notch (3 → 4), don't snap back to 5.",
  "Tribal and groovy recoveries re-engage bodies without demanding full peak return."
]

[fr]
title       = "Relance l'afterpeak"
short_desc  = "02h30. Le peak est passé. Énergie tombée de 5 à 3. Pas de panique. Pas de surenchère."
description = "Le peak a eu lieu. Les gens boivent de l'eau, sortent prendre l'air, reviennent. La foule perd de l'énergie. Deux mauvaises réactions : relancer une track d'énergie maximale (surenchère, la foule peut y lire du désespoir), ou partir trop calme (capitulation). Densité = à quel point la piste est remplie (plus le chiffre est haut, plus la salle est pleine)."
coach_tips  = [
  "Afterpeak ≠ closing. La piste n'a pas abandonné ; elle reprend son souffle.",
  "Choisis une track qui rembarque les corps SANS exiger un retour energy-5.",
  "Les relances tribales/groovy passent souvent bien. Laisse les plus gros drops pour plus tard."
]
recap = [
  "L'afterpeak est une récupération, pas une fermeture — la foule respire, elle ne part pas.",
  "Retenter un moment fort juste après un autre peut faire désespéré aux yeux de la salle.",
  "Monte d'un cran (3 → 4), ne reclaque pas sur 5.",
  "Les relances tribales et groovy rembarquent les corps sans exiger le retour au peak."
]

