[en]
title       = "Gain Staging: Volume Before You Start Mixing"
short_desc  = "Why tracks sound louder or quieter than each other, and the one thing to fix before anything else."
description = "Some tracks sound twice as loud as others even with the same settings. The fix is simple: the TRIM knob. This lesson explains why tracks live at different volumes and gives you a three-step routine to fix it every time."
recap = [
  "Tracks from different eras are mastered at different loudness levels. Old records are quieter; new tracks hit harder.",
  "The TRIM (or GAIN) knob is your first fix. Use it before touching anything else.",
  "Target: the loudest parts of your track should hit around -6 dB on the meter — not 0, not -12.",
  "Mixing without adjusting trim = constantly fighting your faders to compensate.",
  "The headphone CUE reflects the trim — if your trim is wrong, your headphone reference is wrong too."
]

[[en.pages]]
title   = "Why does this track sound so much louder?"
content = """
## You've heard this problem

You load a track and it sounds twice as loud as the one before it.
Or the opposite: you bring up the fader and the crowd barely notices.

This isn't your imagination. Tracks are genuinely mastered at different volume levels.

## A simple way to think about it

Imagine turning up your radio in the car.
Older songs from the 80s or 90s were recorded to have some quiet moments and some loud moments — they breathe.
Pop tracks from 2010–2020 are often compressed as loud as possible — there's almost no quiet anymore.
Both tracks might be on the same playlist, but one feels twice as intense as the other.

DJs face this constantly. A 1996 jungle record sitting next to a 2023 hyperpop track can be 2–3× quieter in perceived volume. Without adjustment, one will blow the room out and the other will disappear.

## The fix: TRIM (or GAIN)

Every channel on a DJ mixer has a **TRIM** knob — sometimes labeled GAIN.
This is your **volume before the mix begins**. You use it to make each incoming track the same loudness as what's already playing.

Think of it as the **starting volume** — not for the performance, but before the performance.
"""

[[en.pages]]
title   = "How to set the trim: a three-step routine"
content = """
## Before every track, do this

**Step 1:** Load your next track and put it in CUE (headphones only — not playing to the room yet).

**Step 2:** Look at the channel meter while the track plays. The loudest parts (usually the drop or chorus) should hit around **-6 dB** on the meter. Not 0, not -12.

**Step 3:** Turn the TRIM knob until the peaks hit that -6 dB mark. Done.

## What the meter is telling you

- **0 dBFS** = the absolute maximum. Above this = clipping = distortion.
- **-6 dB** = 6 dB below the maximum. This is the target. You have room for the loud moments without distorting.
- **-12 dB or below** = too quiet. You'll have to push your fader too high to be heard.

## The "dotted line" shortcut

Many professional DJ mixers have a small **dotted line or marker** on the meter at around -6 dB. This is your target. Train yourself to always aim there.
"""

[[en.pages]]
title   = "Why mixing without trim adjustment is a trap"
content = """
## The fader compensation trap

If you skip the trim and just push the fader higher to compensate for a quiet track, you'll constantly be "chasing" levels.

Here's the problem:
- **Fader at 60%** for a normal track → sounds right.
- **Fader at 100%** for a quiet (untrimmed) track → sounds the same, but you have no room left to adjust.
- When the quiet track has a loud drop, it suddenly jumps — you can't pull it back fast enough.

Good trim discipline means: **every track plays with the fader in the same position** (roughly 70–80% of travel). Your fader becomes meaningful again.

## What "unity gain" means in practice

Most DJ mixer faders have a small **tick mark** at around 70–80% of travel. That's the "unity gain" position — the fader is not adding or subtracting volume, just passing it through.

If every track is trimmed to -6 dB, you can run all your faders at unity, and your mix will be consistent.
"""

[[en.pages]]
title   = "Berghain and the venue that solved it for you"
content = """
## The club that pre-solves gain staging

**Berghain** in Berlin is famous for having one of the best sound systems in the world.
One big reason: the entire setup is calibrated before any DJ touches it.

Every DJ who plays there gets a booth where the gain is already set correctly from the system end.
The DJ just mixes. The sound stays consistent all night, across different DJs with different libraries.

## Why most clubs don't do this

Most clubs don't pre-calibrate to this level. The job falls to you.
When you show up for a gig, assume nothing is set correctly. Spend the first 5 minutes checking your trim while playing a low-key opener.

Your rule: **trim first, mix second.** Every time.

## A simple ear test

While CUE-ing your next track, ask: "Does this sound about as loud in my headphones as the current track sounds in the room?"
If yes, trim is probably fine.
If it's significantly louder or quieter, adjust.

It takes 10 seconds. It will save you 60 minutes of fighting faders.
"""

