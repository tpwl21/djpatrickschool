[[fr.pages]]
title   = "Pourquoi ce morceau sonne-t-il aussi fort ?"
content = """
## Tu as déjà vécu ce problème

Tu charges un morceau et il sonne deux fois plus fort que celui d'avant.
Ou le contraire : tu montes le fader et la salle ne l'entend presque pas.

Ce n'est pas ton imagination. Les morceaux sont vraiment masterisés à des niveaux de volume différents.

## Une façon simple d'y penser

Imagine que tu montes la radio dans la voiture.
Les vieilles chansons des années 80 ou 90 avaient été enregistrées avec des moments calmes et des moments forts — elles respirent.
Les tracks pop de 2010–2020 sont souvent compressées aussi fort que possible — il n'y a presque plus de calme.
Les deux tracks peuvent être sur la même playlist, mais l'une paraît deux fois plus intense que l'autre.

Les DJs vivent ça constamment. Un disque jungle de 1996 à côté d'une track hyperpop de 2023 peut paraître bien plus calme. Sans ajustement, l'une fera sauter la salle et l'autre disparaîtra.

## La solution : TRIM (ou GAIN)

Chaque canal d'une table DJ a un bouton **TRIM** — parfois écrit GAIN.
C'est ton **volume avant que le mix commence**. Tu l'utilises pour amener chaque morceau entrant au même niveau que ce qui joue déjà.

Pense-y comme au **volume de départ** — pas pour la performance, mais avant la performance.
"""

[[fr.pages]]
title   = "Comment régler le trim : une routine en trois étapes"
content = """
## Avant chaque morceau, fais ça

**Étape 1 :** Charge ton prochain morceau et mets-le en CUE (casque uniquement — pas encore dans la salle).

**Étape 2 :** Regarde le mètre de canal pendant que le morceau joue. Les parties les plus fortes (généralement le drop ou le refrain) devraient atteindre la **ligne pointillée**.

**Étape 3 :** Tourne le TRIM jusqu'à ce que les pics touchent la ligne pointillée. C'est tout.

## Ce que le mètre te dit

- **La ligne pointillée** est le « 0 » de la table : la frontière entre le vert et le jaune. C'est ta cible. Vise le haut du vert, avec quelques flashs jaunes sur les coups les plus forts au maximum.
- **Rouge** = **clipping**. Le clipping, c'est quand le signal est trop fort pour le matériel : le haut de chaque onde est coupé net. Tu l'entends comme une distorsion dure qui crépite. Ne va jamais là.
- **Bas du vert** = trop calme. Tu devrais pousser ton fader trop haut pour être entendu.

## Pourquoi le « 0 » de la table n'est pas le vrai plafond

Le vrai plafond d'un système numérique s'appelle **0 dBFS** (décibels « pleine échelle ») : le niveau le plus fort qu'il puisse transporter. Tout ce qui est en dessous s'écrit en nombre négatif. Le « 0 » d'une table DJ est placé *sous* ce plafond exprès, pour te laisser une marge de sécurité avant que quoi que ce soit soit coupé. C'est pour ça que la ligne pointillée est ta cible et que le rouge est ton mur.
"""

[[fr.pages]]
title   = "Pourquoi mixer sans ajuster le trim est un piège"
content = """
## Le piège de la compensation par fader

Si tu sautes le trim et que tu pousses juste le fader plus haut pour compenser une track calme, tu seras constamment à « chasser » les niveaux.

Voici le problème :
- Une track normale joue avec son fader à une position confortable → ça sonne bien.
- Une track calme (sans trim) demande son fader tout en haut → ça sonne pareil, mais tu n'as plus de marge pour ajuster.
- Quand la track calme a un drop fort, elle saute soudainement — tu ne peux pas la rattraper assez vite.

Une bonne discipline de trim, c'est : **chaque morceau joue avec son fader à peu près à la même position**. Ton fader retrouve du sens : il sert à mixer, pas à compenser.

## Ce que « unity gain » veut dire

Le **unity gain** (gain unitaire), c'est un réglage où un contrôle n'ajoute ni ne retire de niveau : le signal passe tel quel, comme une vitre sans teinte. Beaucoup de contrôles de table ont une petite marque ou un cran pour ça.

Si chaque morceau est trimé sur la ligne pointillée, tu peux laisser tes faders au même endroit pour chaque morceau, et ton mix reste cohérent.
"""

[[fr.pages]]
title   = "Fie-toi à tes oreilles, puis vérifie le mètre"
content = """
## Ne pars jamais du principe que le booth est réglé pour toi

Quand tu arrives pour un gig, pars du principe que rien n'est correctement réglé. Prends les premières minutes pour vérifier ton trim en jouant un morceau tranquille pour commencer. Le niveau du système et celui du DJ précédent te sont inconnus.

Ta règle : **trim d'abord, mix ensuite.** À chaque fois.

## Un test d'oreille simple

Pendant que tu mets en CUE ton prochain morceau, demande-toi : « Est-ce que ça sonne à peu près aussi fort dans mon casque que le morceau actuel dans la salle ? »
Si oui, le trim est probablement correct.
S'il est nettement plus fort ou plus calme, ajuste.

Puis jette un œil au mètre : les parties les plus fortes sur la ligne pointillée, jamais dans le rouge.

Ça prend 10 secondes. Ça t'évitera une heure à te battre avec tes faders.
"""

