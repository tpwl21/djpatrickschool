[[fr.pages]]
title   = "Pourquoi ce morceau sonne-t-il aussi fort ?"
content = """
## Tu as déjà vécu ce problème

Tu charges un morceau et il sonne deux fois plus fort que celui d'avant.
Ou le contraire : tu montes le fader et la salle ne l'entend presque pas.

Ce n'est pas ton imagination. Les morceaux sont vraiment masterisés à des niveaux de volume différents.

## Une façon simple d'y penser

Imagine que tu montes la radio dans la voiture.
Les vieilles chansons des années 80 ou 90 avaient été enregistrées avec des moments calmes et des moments forts — elles respirent.
Les tracks pop de 2010–2020 sont souvent compressées aussi fort que possible — il n'y a presque plus de calme.
Les deux tracks peuvent être sur la même playlist, mais l'une paraît deux fois plus intense que l'autre.

Les DJs vivent ça constamment. Un disque jungle de 1996 à côté d'une track hyperpop de 2023 peut être 2–3× plus calme en volume perçu. Sans ajustement, l'une fera sauter la salle et l'autre disparaîtra.

## La solution : TRIM (ou GAIN)

Chaque canal d'une table DJ a un bouton **TRIM** — parfois écrit GAIN.
C'est ton **volume avant que le mix commence**. Tu l'utilises pour amener chaque morceau entrant au même niveau que ce qui joue déjà.

Pense-y comme au **volume de départ** — pas pour la performance, mais avant la performance.
"""

[[fr.pages]]
title   = "Comment régler le trim : une routine en trois étapes"
content = """
## Avant chaque morceau, fais ça

**Étape 1 :** Charge ton prochain morceau et mets-le en CUE (casque uniquement — pas encore dans la salle).

**Étape 2 :** Regarde le mètre de canal pendant que le morceau joue. Les parties les plus fortes (généralement le drop ou le refrain) devraient taper vers **-6 dB** sur le mètre. Pas 0, pas -12.

**Étape 3 :** Tourne le TRIM jusqu'à ce que les pics touchent ce -6 dB. C'est tout.

## Ce que le mètre te dit

- **0 dBFS** = le maximum absolu. Au-dessus = clipping = distorsion.
- **-6 dB** = 6 dB sous le maximum. C'est la cible. Tu as de la marge pour les moments forts sans distordre.
- **-12 dB ou moins** = trop calme. Tu devras pousser ton fader trop haut pour être entendu.

## Le raccourci de la "ligne pointillée"

Beaucoup de tables DJ pro ont une petite **ligne pointillée ou marque** sur le mètre vers -6 dB. C'est ta cible. Entraîne-toi à toujours viser là.
"""

[[fr.pages]]
title   = "Pourquoi mixer sans ajuster le trim est un piège"
content = """
## Le piège de la compensation par fader

Si tu sautes le trim et que tu pousses juste le fader plus haut pour compenser une track calme, tu seras constamment à "chasser" les niveaux.

Voici le problème :
- **Fader à 60%** pour une track normale → ça sonne bien.
- **Fader à 100%** pour une track calme (sans trim) → ça sonne pareil, mais tu n'as plus de marge pour ajuster.
- Quand la track calme a un drop fort, elle saute soudainement — tu ne peux pas la rattraper assez vite.

Une bonne discipline de trim signifie : **chaque morceau joue avec le fader à la même position** (environ 70–80% de la course). Ton fader retrouve du sens.

## Ce que "unity gain" signifie en pratique

La plupart des faders de tables DJ ont une petite **marque** vers 70–80% de la course. C'est la position "unity gain" — le fader n'ajoute ni ne soustrait du volume, il laisse juste passer.

Si chaque morceau est trimé à -6 dB, tu peux faire tourner tous tes faders à unity, et ton mix sera cohérent.
"""

[[fr.pages]]
title   = "Berghain et la salle qui résout ça pour toi"
content = """
## Le club qui pré-résout le gain staging

**Berghain** à Berlin est célèbre pour avoir l'un des meilleurs systèmes sonores au monde.
Une grande raison : tout le setup est calibré avant qu'un DJ y touche.

Chaque DJ qui y joue reçoit un booth où le gain est déjà correctement réglé côté système.
Le DJ mixe juste. Le son reste cohérent toute la nuit, d'un DJ à l'autre avec des bibliothèques différentes.

## Pourquoi la plupart des clubs ne font pas ça

La plupart des clubs ne pré-calibrent pas à ce niveau. Le travail te revient.
Quand tu arrives pour un gig, pars du principe que rien n'est correctement réglé. Prends les 5 premières minutes pour vérifier ton trim en jouant un morceau tranquille pour commencer.

Ta règle : **trim d'abord, mix ensuite.** À chaque fois.

## Un test d'oreille simple

Pendant que tu mets en CUE ton prochain morceau, demande-toi : "Est-ce que ça sonne à peu près aussi fort dans mon casque que le morceau actuel dans la salle ?"
Si oui, le trim est probablement correct.
S'il est nettement plus fort ou plus calme, ajuste.

Ça prend 10 secondes. Ça t'évitera 60 minutes à te battre avec tes faders.
"""

