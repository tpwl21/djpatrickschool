description = "Certains morceaux sonnent deux fois plus fort que d'autres même avec les mêmes réglages. La solution est simple : le bouton TRIM. Cette leçon explique pourquoi les morceaux ont des volumes différents et te donne une routine en trois étapes pour corriger ça à chaque fois."
recap = [
