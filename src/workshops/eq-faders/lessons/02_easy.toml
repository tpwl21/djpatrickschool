[en]
title       = "Gain Staging: Volume Before You Start Mixing"
short_desc  = "Why tracks sound louder or quieter than each other, and the one thing to fix before anything else."
description = "Some tracks sound twice as loud as others even with the same settings. The fix is simple: the TRIM knob. This lesson explains why tracks live at different volumes and gives you a three-step routine to fix it every time."
recap = [
  "Tracks from different eras are mastered at different loudness levels. Old records are quieter; new tracks hit harder.",
  "The TRIM (or GAIN) knob is your first fix. Use it before touching anything else.",
  "Target: on the game's meter, the loudest parts reach the dotted line (the mixer's \"0\", top of the green), a few yellow flashes at most, never red.",
  "Mixing without adjusting trim = constantly fighting your faders to compensate.",
  "The headphone CUE reflects the trim — if your trim is wrong, your headphone reference is wrong too."
]

[[en.pages]]
title   = "Why does this track sound so much louder?"
content = """
## You've heard this problem

You load a track and it sounds twice as loud as the one before it.
Or the opposite: you bring up the fader and the crowd barely notices.

This isn't your imagination. Tracks are genuinely mastered at different volume levels.

## A simple way to think about it

Imagine turning up your radio in the car.
Older songs from the 80s or 90s were recorded to have some quiet moments and some loud moments — they breathe.
Pop tracks from 2010–2020 are often compressed as loud as possible — there's almost no quiet anymore.
Both tracks might be on the same playlist, but one feels twice as intense as the other.

DJs face this constantly. A 1996 jungle record sitting next to a 2023 hyperpop track can feel much quieter. Without adjustment, one will blow the room out and the other will disappear.

## The fix: TRIM (or GAIN)

Every channel on a DJ mixer has a **TRIM** knob — sometimes labeled GAIN.
This is your **volume before the mix begins**. You use it to make each incoming track the same loudness as what's already playing.

Think of it as the **starting volume** — not for the performance, but before the performance.
"""

[[en.pages]]
title   = "How to set the trim: a three-step routine"
content = """
## Before every track, do this

**Step 1:** Load your next track and put it in CUE (headphones only — not playing to the room yet).

**Step 2:** Look at the channel meter while the track plays. The loudest parts (usually the drop or chorus) should reach the **dotted line**.

**Step 3:** Turn the TRIM knob until the peaks touch the dotted line. Done.

## What the meter is telling you

- **The dotted line** is the "0" of the mixer: the border between green and yellow. That is your target. Aim for the top of the green, with a few yellow flashes on the loudest hits at most.
- **Red** = **clipping**. Clipping means the signal is too strong for the equipment, so the top of each wave gets chopped flat. You hear it as harsh crackling distortion. Never go there.
- **Low in the green** = too quiet. You would have to push your fader too high to be heard.

## Why the mixer's "0" is not the real ceiling

The real ceiling of a digital system is called **0 dBFS** (decibels "full scale"): the loudest level it can carry at all. Everything below it is written as a negative number. The "0" on a DJ mixer is placed *below* that ceiling on purpose, so you keep a safety margin before anything gets chopped. That is why the dotted line is your target and red is your wall.
"""

[[en.pages]]
title   = "Why mixing without trim adjustment is a trap"
content = """
## The fader compensation trap

If you skip the trim and just push the fader higher to compensate for a quiet track, you will constantly be "chasing" levels.

Here is the problem:
- A normal track plays with its fader at a comfortable spot → sounds right.
- A quiet (untrimmed) track needs its fader all the way up → it sounds the same, but you have no room left to adjust.
- When the quiet track has a loud drop, it suddenly jumps — you can't pull it back fast enough.

Good trim discipline means: **every track plays with its fader around the same position**. Your fader becomes meaningful again: it is for mixing, not for compensating.

## What "unity gain" means

**Unity gain** is a setting where a control neither adds nor removes level: the signal goes through unchanged, like a window with no tint. Many mixer controls have a small mark or notch for it.

If every track is trimmed to the dotted line, you can leave your faders in the same spot for every track, and your mix stays consistent.
"""

[[en.pages]]
title   = "Trust your ears, then check the meter"
content = """
## Never assume the booth is set up for you

When you show up for a gig, assume nothing is set correctly. Spend the first minutes checking your trim while playing a low-key opener. The level of the system and the level of the previous DJ are unknown to you.

Your rule: **trim first, mix second.** Every time.

## A simple ear test

While CUE-ing your next track, ask: "Does this sound about as loud in my headphones as the current track sounds in the room?"
If yes, trim is probably fine.
If it is significantly louder or quieter, adjust.

Then glance at the meter: loudest parts on the dotted line, never in red.

It takes 10 seconds. It will save you an hour of fighting faders.
"""

