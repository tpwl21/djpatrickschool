[en]
title       = "What is EQ? Ears First"
short_desc  = "Turn the knobs, listen to what changes. No Hz, no theory — just your ears."
description = "Three knobs on the mixer change the bass, the middle, and the treble of a track. You already know what they do with your ears. This lesson puts names to what you already hear."
recap = [
  "Low = kick drum and bass. Mid = voices and instruments. High = hi-hats and cymbals.",
  "The volume fader sets how loud one deck is; the crossfader sets which deck the crowd hears (A, B, or both).",
  "The bass swap: kill the bass of the incoming deck, wait for the right moment, then swap.",
  "Full kill (knob all the way left) = the band disappears completely. Quick and clean.",
  "Cutting the mids of a track creates space for the voice of the other track.",
  "CUE has two meanings: on the mixer it sends a deck to your headphones only; on the player it is the start point of a track."
]

[[en.pages]]
title   = "The three knobs: what you already know"
content = """
## You already hear EQ every day

When you turn the **bass** up on your phone speaker, you feel the music more in your chest.
When you turn the **treble** down, the hi-hats get quieter and the sound gets warmer.
When you turn the **mids** down, voices seem to step back.

A DJ mixer just has these three, stacked on each channel:

- **LOW** — the kick drum, the bass, everything that makes the floor shake
- **MID** — instruments, voices, synth leads
- **HIGH** — hi-hats, cymbals, the bright "air" above the music

## Exercise: turn and listen

Play any track. Turn the LOW knob all the way left — the kick disappears.
Bring it back. Now turn MID all the way left — the voice or lead synth drops out.
Bring it back. Turn HIGH left — hi-hats and brightness fade.

That's EQ. You now know what each knob does.
"""

[[en.pages]]
title   = "The two faders: volume and crossfader"
content = """
## Two faders, two different jobs

Before the knobs go to work, you need to know the two sliders you will touch all the time.

- **Volume fader** (one per deck, slides up and down): how loud **that one deck** is in the room. Down = silence, up = full volume. Think of it as the volume knob of one instrument.
- **Crossfader** (one wide slider, slides left and right): **which deck the crowd hears**. All the way left = only Deck A. All the way right = only Deck B. In the middle = both together. Think of a door between two rooms: you slide it from one side to the other.

## Two ways to bring a track in

1. Raise the volume fader of the new deck.
2. Slide the crossfader from A toward B.

Level 1 of this workshop is exactly this: bring Deck B in with the crossfader, slowly, while Deck A finishes. Ride it, don't slam it: a sudden move makes a hole or a bump in the energy.

The three knobs of the previous page then let you shape *what* you let through while you do this.
"""

[[en.pages]]
title   = "The bass swap: one kick at a time"
content = """
## Why you need this

When two tracks play at the same time, you get **two kick drums at once**. The result is muddy, heavy, and messy. The floor sounds confused.

The fix is simple: **only one bass at a time**.

## How to do it

1. Load the next track on Deck B and press its **CUE** button (the headphones button on the mixer channel). CUE sends that deck to **your headphones only** — the crowd hears nothing. Use it to check that B is ready.
2. **Turn Deck B's LOW all the way left** — kill the bass. Now B has no kick.
3. Start the blend: bring Deck B's volume up.
4. Wait for a musical moment — usually the start of a phrase (every 8 or 16 bars).
5. **Swap**: turn A's LOW left, and B's LOW back to noon. In one move.

Two kicks before the swap? None. One kick after the swap? One. Clean.

## What "noon" means

The knob at the 12 o'clock position = no change. That's your default. Left = cut. Right = boost.
"""

[[en.pages]]
title   = "Full kill vs slow fade: which sounds better?"
content = """
## Two ways to remove a frequency

**Slow fade**: you gradually turn the LOW down over 2–4 bars.

**Full kill**: you snap it all the way left in one quick move, right on the beat.

## In practice

Most DJs prefer the **quick kill** on the beat.
Why? Because it lands on a musical boundary. The ear barely notices it.

A slow fade often sounds like "something is wrong" — the music seems to be fading out accidentally.

## Try it yourself

Pick a transition. Try it slow, then try it quick on the beat drop.
Most people hear that the quick kill sounds cleaner, even if it feels more "aggressive" to do.
"""

[[en.pages]]
title   = "Cut the mids: making space for a voice"
content = """
## When two voices talk at the same time

Voices sit in the **MID** range. When two tracks both have singing or rapping, they get in each other's way.

## The trick

While Deck B's vocal is coming in, **turn Deck A's MID down a little** — maybe halfway.
You're not killing the track. You're just stepping back to let B's voice come forward.

Once Deck A is done, bring its mids back or fade it out.

## What it sounds like

Before: two voices competing, muddy, hard to understand either one.
After: B's voice is clear, A is still present but in the background.

This is the most musical EQ move you can make during a mix.
"""

[[en.pages]]
title   = "The CUE button: your private headphone mix"
content = """
## What is CUE?

CUE has **two meanings**, and DJs use the same word for both:
- **On the mixer**: the button that sends a channel to your headphones only (also called PFL). That is what this page is about.
- **On the player**: the CUE point, the spot where a track starts when you press CUE. You met it in Beatmatching.

Every channel on a DJ mixer has a **CUE button** (sometimes labeled PFL).
When you press it, that track goes into **your headphones only**.
The crowd hears nothing from it yet.

## Why this matters

You use CUE to:
- Listen to Deck B **before** bringing it in
- Check your EQ moves before committing them to the main sound
- Beatmatch — hear both decks in your headphones at once

## The split-cue trick

Some mixers have a **split-cue mode**: Deck A in your left ear, Deck B in your right ear, at the same time.
If the beats line up, they hit both ears together. If they drift, you hear them bounce left-right.
Once you try it, you never go back.
"""

