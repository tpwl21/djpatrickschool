[fr]
title       = "C'est quoi l'EQ ? Les oreilles d'abord"
short_desc  = "Tourne les boutons, écoute ce qui change. Pas de Hz, pas de théorie — juste tes oreilles."
description = "Trois boutons sur la table changent les graves, le milieu et les aigus d'un morceau. Tu sais déjà ce qu'ils font avec tes oreilles. Cette leçon met des noms sur ce que tu entends déjà."
recap = [
  "Low = grosse caisse et basse. Mid = voix et instruments. High = hi-hats et cymbales.",
  "Le fader de volume règle le volume d'un seul deck ; le crossfader choisit quel deck le public entend (A, B ou les deux).",
  "Le bass swap : coupe les basses du deck entrant, attends le bon moment, puis swap.",
  "Full kill (bouton complètement à gauche) = la bande disparaît complètement. Rapide et propre.",
  "Couper les mids d'un morceau crée de la place pour la voix de l'autre morceau.",
  "CUE a deux sens : sur la table, il envoie un deck dans ton casque uniquement ; sur la platine, c'est le point de départ d'un morceau."
]

[[fr.pages]]
title   = "Les trois boutons : ce que tu sais déjà"
content = """
## Tu entends de l'EQ tous les jours

Quand tu montes les **basses** sur l'enceinte de ton téléphone, tu sens la musique dans la poitrine.
Quand tu baisses les **aigus**, les hi-hats s'effacent et le son devient plus chaud.
Quand tu baisses les **médiums**, les voix semblent reculer.

Une table DJ a exactement ces trois réglages, empilés sur chaque canal :

- **LOW** — la grosse caisse, la basse, tout ce qui fait vibrer le sol
- **MID** — les instruments, les voix, les leads de synthés
- **HIGH** — les hi-hats, les cymbales, l'air brillant au-dessus de la musique

## Exercice : tourne et écoute

Lance un morceau. Tourne le LOW complètement à gauche — la grosse caisse disparaît.
Remets-le. Maintenant tourne le MID complètement à gauche — la voix ou le lead synth s'efface.
Remets-le. Tourne le HIGH à gauche — les hi-hats et la brillance s'éteignent.

Voilà l'EQ. Tu sais maintenant ce que fait chaque bouton.
"""

[[fr.pages]]
title   = "Les deux faders : volume et crossfader"
content = """
## Deux faders, deux boulots différents

Avant que les boutons se mettent au travail, tu dois connaître les deux curseurs que tu vas toucher tout le temps.

- **Fader de volume** (un par deck, il monte et descend) : le volume de **ce deck-là seul** dans la salle. En bas = silence, en haut = plein volume. Pense au bouton de volume d'un seul instrument.
- **Crossfader** (un grand curseur horizontal, il va à gauche et à droite) : **quel deck le public entend**. Tout à gauche = Deck A seul. Tout à droite = Deck B seul. Au milieu = les deux ensemble. Pense à une porte entre deux pièces : tu la fais glisser d'un côté à l'autre.

## Deux façons de faire entrer un morceau

1. Monter le fader de volume du nouveau deck.
2. Glisser le crossfader de A vers B.

Le niveau 1 de cet atelier, c'est exactement ça : faire entrer le Deck B au crossfader, doucement, pendant que le Deck A se termine. Accompagne le mouvement, ne le claque pas : un geste brusque crée un trou ou une bosse dans l'énergie.

Les trois boutons de la page précédente te permettent ensuite de choisir *ce que* tu laisses passer pendant ce temps.
"""

[[fr.pages]]
title   = "Le bass swap : une grosse caisse à la fois"
content = """
## Pourquoi tu en as besoin

Quand deux morceaux jouent en même temps, tu as **deux grosses caisses en même temps**. Le résultat est boueux, lourd et confus. Le sol sonne brouillon.

La solution est simple : **une seule basse à la fois**.

## Comment faire

1. Charge le morceau suivant sur le Deck B et appuie sur son bouton **CUE** (le bouton casque du canal sur la table). Le CUE envoie ce deck **dans ton casque uniquement** — le public n'entend rien. Sers-t'en pour vérifier que B est prêt.
2. **Tourne le LOW de Deck B complètement à gauche** — tue les basses. B n'a plus de grosse caisse.
3. Commence le blend : monte le volume de Deck B.
4. Attends un moment musical — généralement le départ d'une phrase (toutes les 8 ou 16 mesures).
5. **Swap** : tourne le LOW de A à gauche, et le LOW de B revient à midi. En un seul geste.

Deux grosses caisses avant le swap ? Aucune. Une grosse caisse après le swap ? Une. Propre.

## Ce que "midi" signifie

Le bouton à la position 12h = pas de changement. C'est ton point de départ. Gauche = coupe. Droite = boost.
"""

[[fr.pages]]
title   = "Full kill vs fondu lent : lequel sonne mieux ?"
content = """
## Deux façons de retirer une fréquence

**Fondu lent** : tu baisses progressivement le LOW sur 2 à 4 mesures.

**Full kill** : tu le claques complètement à gauche en un geste rapide, pile sur le temps.

## En pratique

La plupart des DJs préfèrent le **kill rapide sur le temps**.
Pourquoi ? Parce que ça tombe sur une frontière musicale. L'oreille ne le remarque presque pas.

Un fondu lent donne souvent l'impression que "quelque chose ne va pas" — la musique semble s'éteindre par accident.

## Essaie toi-même

Prends une transition. Essaie-la lentement, puis essaie-la avec un kill rapide sur le drop.
La plupart des gens entendent que le kill rapide est plus propre, même si ça paraît plus "agressif" à faire.
"""

[[fr.pages]]
title   = "Couper les mids : faire de la place pour une voix"
content = """
## Quand deux voix parlent en même temps

Les voix se trouvent dans la plage **MID**. Quand deux morceaux ont tous les deux du chant ou du rap, ils se gênent mutuellement.

## L'astuce

Pendant que la voix de Deck B entre, **baisse un peu le MID de Deck A** — peut-être jusqu'à mi-chemin.
Tu ne coupes pas le morceau. Tu lui demandes juste de reculer pour laisser la voix de B avancer.

Une fois que Deck A est terminée, remets ses mids ou fais-la sortir.

## Ce que ça donne à l'oreille

Avant : deux voix qui se battent, brouillon, difficile de comprendre l'une ou l'autre.
Après : la voix de B est claire, A est toujours présente mais en fond.

C'est le geste EQ le plus musical que tu puisses faire pendant un mix.
"""

[[fr.pages]]
title   = "Le bouton CUE : ton mix casque privé"
content = """
## C'est quoi le CUE ?

CUE a **deux sens**, et les DJs utilisent le même mot pour les deux :
- **Sur la table** : le bouton qui envoie un canal dans ton casque uniquement (aussi appelé PFL). C'est le sujet de cette page.
- **Sur la platine** : le point CUE, l'endroit où un morceau démarre quand tu appuies sur CUE. Tu l'as croisé en Beatmatching.

Chaque canal d'une table DJ a un **bouton CUE** (parfois écrit PFL).
Quand tu l'appuies, ce morceau arrive **dans ton casque uniquement**.
Le public n'entend rien de lui pour l'instant.

## Pourquoi c'est important

Tu utilises le CUE pour :
- Écouter le Deck B **avant** de le faire rentrer
- Vérifier tes gestes EQ avant de les envoyer sur le son principal
- Beatmatcher — entendre les deux decks dans le casque en même temps

## L'astuce du split-cue

Certaines tables ont un mode **split-cue** : Deck A dans ton oreille gauche, Deck B dans ta droite, en même temps.
Si les beats sont alignés, ils arrivent ensemble dans les deux oreilles. S'ils dérivent, tu les entends rebondir gauche-droite.
Une fois que tu l'as essayé, tu ne reviens pas en arrière.
"""

