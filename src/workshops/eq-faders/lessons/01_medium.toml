[en]
title       = "EQ in Practice: Bands, Masking, and Headphone Listening"
short_desc  = "Frequency ranges in Hz, frequency masking, sweep vs kill, PFL and split-cue."
description = "You know the three bands. Now you understand exactly which frequencies they target, why masking kills vocal clarity, why DJs kill rather than sweep on a club PA, and how to use your headphone cue properly."
recap = [
  "Pioneer DJM: Low–Mid crossover ~300 Hz, Mid–High ~4 kHz. Allen & Heath Xone: Mid centered ~1.2 kHz with narrower Q.",
  "Frequency masking: a loud signal at 250 Hz can mask a softer one at 2 kHz (upward masking spread).",
  "Kill (snap to -∞ dB on the downbeat) sounds cleaner than a slow sweep on a club PA because the PA's multiband compressor can't react in time.",
  "PFL routes the channel signal to headphones — after EQ on most DJ mixers, so your EQ decisions are reflected in the cue.",
  "Split-cue: A in left ear, B in right ear — beat drift is immediately audible as left-right bounce."
