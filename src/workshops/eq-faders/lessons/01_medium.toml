[[fr.pages]]
title   = "Où se placent les bandes : des repères"
content = """
## Tous les EQ ne se valent pas

Les trois bandes ne sont pas standardisées : chaque fabricant choisit ses propres points de crossover et la forme de ses bandes. Les chiffres ci-dessous sont des **repères**, pas des specs. Pour ta table précise, lis le manuel.

- **Low** (shelving) : en gros tout ce qui est sous 250–300 Hz. Le fondamental d'une grosse caisse se situe vers 50–100 Hz ; la ligne de basse vit là aussi.
- **Mid** (cloche) : de là jusqu'à quelques kHz. Le corps, les voix, la plupart des leads de synthé.
- **High** (shelving) : au-dessus de quelques kHz. Hi-hats, cymbales, air.

## Ce que ça change en pratique

Le même mid-cut ne se ressent pas pareil d'une table à l'autre. Une bande mid large retire le corps ET la présence ET la clarté des voix d'un coup ; une bande plus étroite coupe plus chirurgicalement autour de la voix.

Certaines tables te laissent aussi choisir le comportement de l'EQ : un EQ classique qui laisse un peu de signal en bout de course, ou un **isolator** qui coupe la bande complètement. Tu verras ça dans la leçon Pro.

Quand tu changes de matériel, passe deux minutes à repérer où se trouve chaque crossover : coupe une bande et écoute ce qui disparaît.
"""

[[fr.pages]]
title   = "Masquage fréquentiel : pourquoi deux voix se battent toujours"
content = """
## Le problème 800 Hz – 3 kHz

Les voix humaines — chant, rap, DJ au micro — tirent leur présence et leur intelligibilité surtout de la zone **800 Hz – 3 kHz**.
Quand deux morceaux avec voix se chevauchent, les deux signaux se disputent le même espace fréquentiel.

L'oreille ne peut pas les séparer proprement quand l'énergie se recouvre. C'est le **masquage fréquentiel** : le signal le plus fort cache en partie le plus faible.

## L'asymétrie du masquage

Le masquage n'est pas symétrique. Un signal grave fort peut masquer un signal plus doux situé plus haut — c'est l'**upward spread of masking**.
Une grosse caisse (fondamental vers 50–100 Hz) peut masquer du contenu plus doux au-dessus d'elle si l'écart de niveau est assez grand.

C'est une partie de la raison acoustique pour laquelle un grave chargé rend le mix boueux dans le haut : l'énergie grave masque vers le haut la zone de présence.

## Réponse EQ pratique

- Deux voix : baisse le Mid du morceau sortant de quelques dB.
- Grave encombré : prends le Low du morceau dont tu n'as pas besoin de la basse en ce moment.
- Tu ne détruis rien — tu fais de la place pour ce sur quoi tu veux que l'oreille se concentre.
"""

[[fr.pages]]
title   = "Kill et swap : une seule basse à la fois"
content = """
## Deux options pour retirer une bande

**Sweep** : tourner progressivement le bouton de midi à la coupe complète sur 2 à 4 mesures.
**Kill** : claquer à la coupe complète en un seul geste, sur le temps fort.

## Pourquoi la basse a droit à un kill et un swap

La vraie raison n'est pas la PA, c'est le grave lui-même. Quand deux basses jouent ensemble :

- Les notes qui ne sont pas à la même hauteur battent l'une contre l'autre et transforment le grave en **boue**.
- Des grosses caisses décalées de quelques millisecondes seulement s'**annulent** en partie dans le grave (annulation de phase) : la basse devient fine et creuse au lieu d'être plus forte.

La règle est donc simple : **une seule basse à la fois**. Kill la basse du morceau entrant pendant qu'il se fond, puis fais le swap d'un seul geste sur le **premier temps d'une phrase** (32 temps, 8 mesures) : le Low de A descend, le Low de B monte. L'oreille lit un changement de phrase comme une frontière naturelle, donc le swap disparaît dans la musique.

Un sweep lent du Low laisse un moment où les deux basses sont à moitié présentes, exactement la zone que tu voulais éviter. C'est pour ça que kill + swap gagne pour les transitions de routine.

## Quand le sweep est voulu

Un long filter sweep est un choix de composition, un outil de tension. Ça marche quand la structure du morceau le soutient, pas comme une façon de nettoyer une transition.

Transitions de routine : kill et swap. Tension voulue : sweep.
"""

[[fr.pages]]
title   = "PFL et split-cue : entendre avant de s'engager"
content = """
## La chaîne de signal pour le PFL

Sur une table DJ, le bus CUE se trouve généralement **après l'EQ mais avant le fader de volume**.

Ça veut dire :
- Ton travail EQ se reflète dans ce que tu entends dans le casque.
- Tes mouvements de fader ne touchent pas le cue — tu peux écouter Track B à n'importe quel volume sans changer ce que la salle entend.

## Pourquoi ça compte pour les décisions EQ

Si ton gain staging (trim) est faux, ton PFL est une référence trompeuse.
Un morceau trimé 6 dB trop fort dans le PFL sonnera plus fort qu'il ne l'est réellement dans la salle — tu feras des boosts EQ inutiles pour "concurrencer" quelque chose qui va déjà bien.

Vérifie le trim d'abord. Puis utilise le PFL pour prendre des décisions EQ.

## Split-cue : le drift de beat rendu audible à tes oreilles

Le split-cue envoie le signal cue dans une oreille et le master dans l'autre.
Le drift de beat devient un rebond gauche-droite : les beats en sync arrivent simultanément dans les deux oreilles ; un beat en retard dans Track B arrive nettement après celui de Track A.

Beaucoup de DJs trouvent ça plus intuitif qu'écouter les deux morceaux mélangés, surtout dans les booths bruyants.
"""

[[fr.pages]]
title   = "Courbe de crossfader : blend vs battle"
content = """
## Ce que la courbe contrôle

La courbe du crossfader détermine comment le volume change quand le fader se déplace d'A vers B.

**Courbe linéaire (lente) :**
- Les deux morceaux à ~50% du volume quand le fader est au centre.
- Fondu doux sur toute la course.
- Utilisée pour les longs mixes house/techno, toute transition qui prend 8+ mesures.

**Courbe cut-in (rapide/sharp) :**
- Les deux morceaux à plein volume sur presque toute la course.
- Le volume claque seulement dans les derniers millimètres à chaque extrémité.
- Utilisée pour le scratch, les cuts hip-hop, et toute technique nécessitant un basculement instantané.

## Réglage pratique

Sur Pioneer DJM : petit bouton **Curve** en façade.
Sur Rane et tables de scratch : souvent un switch multi-positions dédié.
Sur le DJM-S9/S11 : courbe réglable par côté plus un *hamster switch* (inverse la direction du fader pour le style scratch).

Pour mixer des genres : courbe lente. Pour DJ hip-hop ou turntablism : courbe rapide.
La plupart des DJs ne la changent jamais en plein set — choisis avant de jouer.
"""

