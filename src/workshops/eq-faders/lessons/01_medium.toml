[[en.pages]]
title   = "The exact frequencies: what each band covers"
content = """
## Not all EQs are equal

The three bands aren't standardized across manufacturers. Knowing your gear matters.

**Pioneer DJM series (DJM-900NXS2, DJM-A9):**
- Low: 20 Hz – ~300 Hz (shelving)
- Mid: ~300 Hz – ~4 kHz (peaking bell)
- High: ~4 kHz – 20 kHz (shelving)

**Allen & Heath Xone:96 / Xone:43:**
- Low: similar floor, crossover ~200 Hz
- Mid: centered ~1.2 kHz with a narrower bandwidth (higher Q)
- High: crossover ~3.5 kHz

## What this changes in practice

The same mid-cut feels different on a Pioneer vs a Xone.
On a Pioneer, cutting the Mid takes out a wide chunk from 300 Hz to 4 kHz — you're removing body AND presence AND vocal clarity at once.
On a Xone, the narrower mid band cuts more surgically around the vocal fundamental.

When you move between gear, spend two minutes identifying where each crossover sits by cutting one band and listening to what disappears.
"""

[[en.pages]]
title   = "Frequency masking: why two vocals always fight"
content = """
## The 800 Hz – 3 kHz problem

Human voices — singing, rapping, DJing — sit primarily in the **800 Hz – 3 kHz** range.
When two tracks with vocals overlap, both signals compete for the same frequency space.

The ear can't cleanly separate them when the energy overlaps. This is **frequency masking**: the louder signal partially obscures the quieter one, even at the same pitch range.

## The masking asymmetry

Masking is not symmetric. A loud low-frequency signal can mask a softer high-frequency signal — this is called **upward spread of masking**.
A 250 Hz kick can mask a 2 kHz snare hit if the level difference is large enough.

This is the acoustic reason why a heavy kick makes the mix feel muddy at the top:
the sub energy upward-masks the presence region.

## Practical EQ response

- Two vocal tracks: cut the Mid on the outgoing track 4–6 dB.
- Heavy kick masking the snare: cut 2–3 dB around 250 Hz on the kick-heavy track.
- You're not destroying — you're making room for what you want the ear to focus on.
"""

[[en.pages]]
title   = "Sweep vs kill: why the PA has opinions"
content = """
## Two options for removing a band

**Sweep**: gradually turn the knob from noon to full cut over 2–4 bars.
**Kill**: snap to full cut (-∞ dB) in a single move, on the downbeat.

## Why kills win on club PAs

A large club PA includes a **multiband compressor** downstream of the mixer, protecting drivers across frequency ranges.

When you sweep the low band over 4 bars, the compressor's sidechain in the mid band detects that the masking from the lows is decreasing. It releases gain — the mids get louder. Then as you continue, the mids feel "too loud," the compressor pulls them back. You hear this as **pumping** — a breathing artifact that sounds like the PA is tired.

A hard kill lands in ~1ms. The compressor has no time to react. No pumping, no artifact.

## When sweeping is intentional

A long filter sweep is a compositional choice — Loco Dice, Ricardo Villalobos, Objekt all use it deliberately as a tension tool. But it requires the mix to support it structurally, not just a tool to clean up a transition.

Routine transitions: kill. Intentional tension: sweep.
"""

[[en.pages]]
title   = "PFL and split-cue: hearing before committing"
content = """
## The signal path for PFL

On a DJ mixer, the CUE bus typically sits **after the EQ but before the volume fader**.

This means:
- Your EQ work is reflected in what you hear in the headphones.
- Your volume fader movements don't affect the cue — you can listen to Track B at any volume without changing what the room hears.

## Why this matters for EQ decisions

If your gain staging (trim) is wrong, your PFL is a misleading reference.
A track trimmed 6 dB too hot in the PFL will sound louder than it actually is in the room — you'll make unnecessary EQ boosts to "compete" with something that's already fine.

Check the trim first. Then use PFL to make EQ decisions.

## Split-cue: beat drift made visible to your ears

Split-cue sends the cue signal to one ear and the master to the other.
Beat drift becomes a left-right bounce: beats in sync land simultaneously in both ears; a late beat in Track B arrives noticeably after the one in Track A.

Many DJs find this more intuitive than listening to both tracks blended, especially in noisy booths.
"""

[[en.pages]]
title   = "Crossfader curve: blend vs battle"
content = """
## What the curve controls

The crossfader curve determines how volume changes as the fader moves from A to B.

**Linear (slow) curve:**
- Both tracks at ~50% volume when the fader is in the center.
- Smooth blend across the full travel.
- Used for long house/techno mixes, anything where the transition takes 8+ bars.

**Cut-in (fast / sharp) curve:**
- Both tracks at full volume across most of the travel.
- Volume snaps only in the last few millimeters at each end.
- Used for scratching, hip-hop cuts, and any technique requiring instantaneous switching.

## Practical setup

On Pioneer DJM series: small **Curve** knob on the front panel.
On Rane and scratch mixers: often a dedicated multi-position switch.
On the DJM-S9/S11: adjustable curve per side plus a *hamster switch* (reverses the fader direction for scratch style).

For mixing genres: slow curve. For DJing hip-hop or turntablism: fast curve.
Most DJs never change it mid-set — pick one before you play.
"""

