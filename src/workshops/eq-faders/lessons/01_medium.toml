[[en.pages]]
title   = "Where the bands sit: rough landmarks"
content = """
## Not all EQs are equal

The three bands are not standardized: each manufacturer picks its own crossover points and band shapes. The numbers below are **landmarks**, not specs. For your exact mixer, read the manual.

- **Low** (shelving): roughly everything below 250–300 Hz. A kick drum's fundamental sits around 50–100 Hz; the bass line lives here too.
- **Mid** (bell): from there up to a few kHz. Body, voices, most synth leads.
- **High** (shelving): above a few kHz. Hi-hats, cymbals, air.

## What this changes in practice

The same mid-cut feels different from one mixer to another. A wide mid band removes body AND presence AND vocal clarity at once; a narrower one cuts more surgically around the voice.

Some mixers also let you choose how the EQ behaves: a classic EQ that leaves a little signal at the end of the knob, or an **isolator** that cuts the band completely. You will see this in the Pro lesson.

When you move between gear, spend two minutes finding where each crossover sits: cut one band and listen to what disappears.
"""

[[en.pages]]
title   = "Frequency masking: why two vocals always fight"
content = """
## The 800 Hz – 3 kHz problem

Human voices — singing, rapping, DJing — get their presence and intelligibility mostly in the **800 Hz – 3 kHz** range.
When two tracks with vocals overlap, both signals compete for the same frequency space.

The ear can't cleanly separate them when the energy overlaps. This is **frequency masking**: the louder signal partially obscures the quieter one.

## The masking asymmetry

Masking is not symmetric. A loud low-frequency signal can mask a softer signal higher up — this is called **upward spread of masking**.
A kick (fundamental around 50–100 Hz) can mask softer content above it if the level difference is large enough.

This is part of the acoustic reason why a heavy low end makes the mix feel muddy at the top: the low energy upward-masks the presence region.

## Practical EQ response

- Two vocal tracks: cut the Mid on the outgoing track by a few dB.
- Low end crowded: take the Low of the track whose bass you don't need right now.
- You're not destroying — you're making room for what you want the ear to focus on.
"""

[[en.pages]]
title   = "Kill and swap: one bass at a time"
content = """
## Two options for removing a band

**Sweep**: gradually turn the knob from noon to full cut over 2–4 bars.
**Kill**: snap to full cut in a single move, on the downbeat.

## Why the bass gets a kill and a swap

The real reason is not the PA, it is the low end itself. When two basses play together:

- Notes that are not the same pitch beat against each other and turn the low end into **mud**.
- Kicks that are even a few milliseconds apart partly **cancel each other** in the lows (phase cancellation): the bass gets thin and hollow instead of louder.

So the rule is simple: **one bass at a time**. Kill the bass of the incoming track while it blends in, then do the swap in one move on the **first beat of a phrase** (32 beats, 8 bars): A's Low goes down, B's Low comes up. The ear reads a phrase change as a natural boundary, so the swap disappears into the music.

A slow sweep of the Low leaves a stretch where both basses are half-present, exactly the zone you were trying to avoid. That is why kill-and-swap wins for routine transitions.

## When sweeping is intentional

A long filter sweep is a compositional choice, a tension tool. It works when the track structure supports it, not as a way to clean up a transition.

Routine transitions: kill and swap. Intentional tension: sweep.
"""

[[en.pages]]
title   = "PFL and split-cue: hearing before committing"
content = """
## The signal path for PFL

On a DJ mixer, the CUE bus typically sits **after the EQ but before the volume fader**.

This means:
- Your EQ work is reflected in what you hear in the headphones.
- Your volume fader movements don't affect the cue — you can listen to Track B at any volume without changing what the room hears.

## Why this matters for EQ decisions

If your gain staging (trim) is wrong, your PFL is a misleading reference.
A track trimmed 6 dB too hot in the PFL will sound louder than it actually is in the room — you'll make unnecessary EQ boosts to "compete" with something that's already fine.

Check the trim first. Then use PFL to make EQ decisions.

## Split-cue: beat drift made visible to your ears

Split-cue sends the cue signal to one ear and the master to the other.
Beat drift becomes a left-right bounce: beats in sync land simultaneously in both ears; a late beat in Track B arrives noticeably after the one in Track A.

Many DJs find this more intuitive than listening to both tracks blended, especially in noisy booths.
"""

[[en.pages]]
title   = "Crossfader curve: blend vs battle"
content = """
## What the curve controls

The crossfader curve determines how volume changes as the fader moves from A to B.

**Linear (slow) curve:**
- Both tracks at ~50% volume when the fader is in the center.
- Smooth blend across the full travel.
- Used for long house/techno mixes, anything where the transition takes 8+ bars.

**Cut-in (fast / sharp) curve:**
- Both tracks at full volume across most of the travel.
- Volume snaps only in the last few millimeters at each end.
- Used for scratching, hip-hop cuts, and any technique requiring instantaneous switching.

## Practical setup

On Pioneer DJM series: small **Curve** knob on the front panel.
On Rane and scratch mixers: often a dedicated multi-position switch.
On the DJM-S9/S11: adjustable curve per side plus a *hamster switch* (reverses the fader direction for scratch style).

For mixing genres: slow curve. For DJing hip-hop or turntablism: fast curve.
Most DJs never change it mid-set — pick one before you play.
"""

