[[fr.pages]]
title   = "Les fréquences exactes : ce que couvre chaque bande"
content = """
## Toutes les EQs ne sont pas pareilles

Les trois bandes ne sont pas standardisées entre fabricants. Connaître ton matos compte.

**Pioneer DJM (DJM-900NXS2, DJM-A9) :**
- Low : 20 Hz – ~300 Hz (shelving)
- Mid : ~300 Hz – ~4 kHz (peaking bell)
- High : ~4 kHz – 20 kHz (shelving)

**Allen & Heath Xone:96 / Xone:43 :**
- Low : plancher similaire, crossover ~200 Hz
- Mid : centré ~1,2 kHz avec une bande plus étroite (Q plus élevé)
- High : crossover ~3,5 kHz

## Ce que ça change en pratique

Le même mid-cut donne un résultat différent sur une Pioneer vs une Xone.
Sur une Pioneer, couper le Mid retire une large tranche de 300 Hz à 4 kHz — tu enlèves corps ET présence ET clarté vocale en même temps.
Sur une Xone, la bande mid plus étroite coupe plus chirurgicalement autour du fondamental vocal.

Quand tu changes de matos, prends deux minutes pour identifier où se trouve chaque crossover en coupant une bande et en écoutant ce qui disparaît.
"""

[[fr.pages]]
title   = "Masquage fréquentiel : pourquoi deux voix se battent toujours"
content = """
## Le problème 800 Hz – 3 kHz

Les voix humaines — chant, rap, talk — se trouvent principalement dans la plage **800 Hz – 3 kHz**.
Quand deux morceaux avec des voix se superposent, les deux signaux se disputent le même espace fréquentiel.

L'oreille ne peut pas les séparer proprement quand l'énergie se chevauche. C'est le **masquage fréquentiel** : le signal le plus fort cache partiellement le plus faible, même dans la même plage de fréquences.

## L'asymétrie du masquage

Le masquage n'est pas symétrique. Un signal grave fort peut masquer un signal aigu plus doux — c'est l'**upward spread of masking**.
Un kick à 250 Hz peut masquer une caisse claire à 2 kHz si la différence de niveau est suffisante.

C'est la raison acoustique pour laquelle un kick très présent rend le mix boueux dans les hauts :
l'énergie sub masque vers le haut la région de présence.

## Réponse EQ pratique

- Deux morceaux vocaux : coupe le Mid du morceau sortant de 4–6 dB.
- Kick lourd qui masque la caisse claire : coupe 2–3 dB vers 250 Hz sur le morceau à kick chargé.
- Tu ne détruis pas — tu fais de la place pour ce que tu veux que l'oreille perçoive.
"""

[[fr.pages]]
title   = "Sweep vs kill : pourquoi la PA a son mot à dire"
content = """
## Deux options pour retirer une bande

**Sweep** : tourne progressivement le bouton de midi vers le full cut sur 2–4 mesures.
**Kill** : claque à fond (-∞ dB) en un seul geste, sur le downbeat.

## Pourquoi les kills gagnent sur les PAs de club

Une grosse PA de club inclut un **compresseur multibande** en aval de ta table, qui protège les drivers sur toutes les plages de fréquences.

Quand tu sweeps le Low sur 4 mesures, la sidechain du compresseur sur la bande Mid détecte que le masquage des basses diminue. Il relâche son gain — les mids deviennent plus forts. Puis au fur et à mesure que tu continues, les mids semblent "trop forts", le compresseur les tire vers le bas. Tu entends ça comme du **pompage** — un artefact de respiration qui donne l'impression que la PA fatigue.

Un hard kill prend ~1ms. Le compresseur n'a pas le temps de réagir. Pas de pompage, pas d'artefact.

## Quand sweeper est intentionnel

Un long sweep de filtre est un choix compositionnel — Loco Dice, Ricardo Villalobos, Objekt l'utilisent délibérément comme outil de tension. Mais ça demande que le mix le supporte structurellement, pas juste pour nettoyer une transition.

Transitions courantes : kill. Tension intentionnelle : sweep.
"""

[[fr.pages]]
title   = "PFL et split-cue : entendre avant de s'engager"
content = """
## La chaîne de signal pour le PFL

Sur une table DJ, le bus CUE se trouve généralement **après l'EQ mais avant le fader de volume**.

Ça veut dire :
- Ton travail EQ se reflète dans ce que tu entends dans le casque.
- Tes mouvements de fader ne touchent pas le cue — tu peux écouter Track B à n'importe quel volume sans changer ce que la salle entend.

## Pourquoi ça compte pour les décisions EQ

Si ton gain staging (trim) est faux, ton PFL est une référence trompeuse.
Un morceau trimé 6 dB trop fort dans le PFL sonnera plus fort qu'il ne l'est réellement dans la salle — tu feras des boosts EQ inutiles pour "concurrencer" quelque chose qui va déjà bien.

Vérifie le trim d'abord. Puis utilise le PFL pour prendre des décisions EQ.

## Split-cue : le drift de beat rendu audible à tes oreilles

Le split-cue envoie le signal cue dans une oreille et le master dans l'autre.
Le drift de beat devient un rebond gauche-droite : les beats en sync arrivent simultanément dans les deux oreilles ; un beat en retard dans Track B arrive nettement après celui de Track A.

Beaucoup de DJs trouvent ça plus intuitif qu'écouter les deux morceaux mélangés, surtout dans les booths bruyants.
"""

[[fr.pages]]
title   = "Courbe de crossfader : blend vs battle"
content = """
## Ce que la courbe contrôle

La courbe du crossfader détermine comment le volume change quand le fader se déplace d'A vers B.

**Courbe linéaire (lente) :**
- Les deux morceaux à ~50% du volume quand le fader est au centre.
- Fondu doux sur toute la course.
- Utilisée pour les longs mixes house/techno, toute transition qui prend 8+ mesures.

**Courbe cut-in (rapide/sharp) :**
- Les deux morceaux à plein volume sur presque toute la course.
- Le volume claque seulement dans les derniers millimètres à chaque extrémité.
- Utilisée pour le scratch, les cuts hip-hop, et toute technique nécessitant un basculement instantané.

## Réglage pratique

Sur Pioneer DJM : petit bouton **Curve** en façade.
Sur Rane et tables de scratch : souvent un switch multi-positions dédié.
Sur le DJM-S9/S11 : courbe réglable par côté plus un *hamster switch* (inverse la direction du fader pour le style scratch).

Pour mixer des genres : courbe lente. Pour DJ hip-hop ou turntablism : courbe rapide.
La plupart des DJs ne la changent jamais en plein set — choisis avant de jouer.
"""

