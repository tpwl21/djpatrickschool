[[en.pages]]
title   = "The signal chain in order"
content = """
## Why order matters

Every stage of the signal chain processes what the previous stage produced. Getting the order wrong propagates errors forward.

**DJ mixer signal chain:**

```
Source (USB/CDJ/vinyl)
  → TRIM (pre-amp gain — set first)
  → EQ (3-band sculpting)
  → Volume fader (dynamic mix riding)
  → Crossfader (A/B blend)
  → Master output (to PA amp)
```

## What each stage is responsible for

**TRIM**: calibrates the incoming track to a reference level. Before anything else.
**EQ**: shapes the frequency balance of that now-calibrated signal.
**Volume fader**: controls dynamic mix behavior — you ride this during the mix.
**Crossfader**: handles the A→B transition.
**Master**: final level sent to the PA. Should remain fixed once set.

## The common mistake

Setting the master output high to compensate for a quiet mix. This amplifies noise and causes distortion downstream. The master should be set once (correctly, for the PA's input sensitivity) and never touched during the set.

Any level management belongs at the TRIM, not the master.
"""

[[en.pages]]
title   = "LUFS vs dBFS: two different measurements"
content = """
## dBFS: raw peak level

**dBFS** (decibels relative to Full Scale) measures the amplitude of the peak sample in the digital signal. It doesn't care about content — a single full-scale transient and a sustained loud tone both read similarly.

0 dBFS = the maximum digital value (clip point). Everything is below 0.

## LUFS: perceived loudness

**LUFS** (Loudness Units relative to Full Scale) applies frequency weighting (K-weighting) and time-integration before calculating the level. It models how the ear perceives loudness over time — not just peak amplitude.

Two tracks can both peak at -0.1 dBFS and differ by 8 LUFS:
- Track A: heavily compressed, no dynamic range → **-7 LUFS** (very loud perceptually)
- Track B: dynamic, transient-heavy → **-15 LUFS** (same digital peak, quieter perceived)

## Streaming platform targets

Platforms normalize to integrated LUFS to create a consistent listening experience:
- **Spotify**: -14 LUFS integrated
- **Apple Music / Tidal**: -16 LUFS
- **YouTube**: -14 LUFS
- **EBU R128 broadcast**: -23 LUFS

A heavily compressed track submitted at -7 LUFS to Spotify gets turned *down* to -14 LUFS during playback. Its peak is lowered proportionally. A dynamic track at -14 LUFS plays at reference level.

## DJ relevance

When you're mixing tracks from different eras or genres, the LUFS difference is what you're compensating with trim. Matching peaks isn't enough — match the perceived loudness.
"""

[[en.pages]]
title   = "The -6 dB headroom rule"
content = """
## Why -6 dB and not 0 dBFS

If you aim for 0 dBFS at the mixer output, the signal hitting the PA amplifier will clip. Here's why:

**Three sources of overshoot stack:**
1. **Live transient overshoot**: digital peaks measured by a sample-rate meter don't capture inter-sample peaks. A -1 dBFS digital reading can produce +1 dBTP (true peak) on reconstruction.
2. **Room acoustics**: standing waves in the room cause frequency buildup — some bass notes add up instead of canceling, increasing the effective SPL by 3–6 dB at resonant nodes.
3. **Speaker driver dynamics**: bass drivers overshoot mechanically on fast transients — the cone takes slightly longer to stop than the signal commands.

These three additions can sum to **+5 to +8 dB** above what the meter shows.

## The industry rule

Leave **-6 dB** between your loudest peak and 0 dBFS. The corresponding VU meter marker is your calibration target.

Why -6 specifically: +6 dB = 2× voltage amplitude, which is the standard safety factor for analog reconstruction circuits, PA amplifier headroom, and linear driver operation.

## Practical implementation

- Trim each track so peaks hit **-6 dB on the channel meter** during the drop.
- Run your master output meter peaking at **-6 dBFS** during the loudest passages.
- If your channel peaks hit -6 but the master is higher, something in the mix summation is adding gain — check your crossfader overlap or EQ boosts.
"""

[[en.pages]]
title   = "Fletcher-Munson: why your home mix sounds different in the club"
content = """
## The equal-loudness phenomenon

The human ear isn't equally sensitive across the frequency spectrum. At different volume levels, the balance of what you hear shifts.

This was measured by Fletcher and Munson in 1933 (refined by ISO 226:2003 as the Robinson-Dadson curves):

- At **40 dB SPL** (quiet conversation): the ear strongly suppresses lows and highs. Mids are dominant.
- At **80 dB SPL** (loud conversation, monitor volume): moderate suppression of lows and highs.
- At **100+ dB SPL** (club PA at the dancefloor): the response curve flattens significantly. Lows and highs are heard at closer to their true level.

## The practical consequence for DJs

A mix calibrated at **70 dB** in your bedroom will sound:
- **Boomy / bass-heavy** at 103 dB in the club (bass is now perceived at full level, mids haven't changed).
- **Harsh on highs** if you cut highs in your bedroom thinking they were "too bright" — the club's SPL reveals them again.

## How to compensate

Use a **fixed reference level** for booth monitors — typically 80–85 dB SPL (measured at the DJ position).
Do NOT turn booth monitors up or down to chase the room sound. Keep them at a known reference level so your EQ decisions are made at a consistent point on the equal-loudness curve.

Many well-equipped clubs fix the booth monitor level at the system-design stage. If yours has a booth monitor volume knob, ask the sound engineer for the reference level before you play.
"""

[[en.pages]]
title   = "Trim discipline: a workflow that scales"
content = """
## The full workflow

1. Load track into the CDJ/controller.
2. CUE it (headphones only).
3. Let it play through the loudest section (drop, chorus).
4. Adjust TRIM until the **channel meter peaks at -6 dB**.
5. Check: does it sound approximately as loud in your headphones as the current track sounds in the room?
6. Start the mix.

## What changes on different systems

On **Serato/Traktor/rekordbox**: the software gain and channel gain work the same way — they're the digital equivalent of TRIM. Apply the same logic.

On **vinyl**: the cartridge output varies by stylus and preamp. On a Rane or A&H with a proper phono stage, adjust the trim the same way. Don't assume vinyl is always quieter — direct-cut lacquers and modern 45s can be very loud.

## A note on cumulative gain staging

Each track you play shifts the running mix level. If you consistently trim tracks 3 dB hot, after 10 tracks the master output has drifted 3 dB into the danger zone. Trim consistency prevents this drift.

If the room sound engineer is also riding the master output (common in live sound situations), communicate: agree on a reference level before the set, and don't override their system gain during your performance.
"""

