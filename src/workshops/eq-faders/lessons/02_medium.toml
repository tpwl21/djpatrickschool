[en]
title       = "Gain Staging: Signal Chain, LUFS, and Headroom"
short_desc  = "LUFS vs dBFS, the DJ signal chain in order, -6 dB headroom, and Fletcher-Munson basics."
description = "Understanding the signal chain from trim to master is the difference between sets that translate to any system and sets that fall apart. LUFS measures perceived loudness. dBFS measures peak. Both matter, for different reasons."
recap = [
  "Signal chain order: source → TRIM → EQ → volume fader → crossfader → master output.",
  "LUFS measures perceived loudness (weighted like the ear). dBFS measures raw digital peak. A -8 LUFS track and a -14 LUFS track can both peak at -0.1 dBFS.",
  "Streaming targets: Spotify -14 LUFS, Apple Music -16 LUFS, EBU R128 broadcast -23 LUFS.",
  "Leave -6 dB headroom from peak to 0 dBFS: live transients, room acoustics, and speaker dynamics all add overshoot.",
  "Fletcher-Munson: at low SPL your ears suppress lows and highs. At club SPL the response flattens — a mix calibrated at home will sound bass-heavy in the club."
