[[fr.pages]]
title   = "La chaîne de signal dans l'ordre"
content = """
## Pourquoi l'ordre compte

Chaque étage de la chaîne de signal traite ce que l'étage précédent a produit. Se tromper dans l'ordre propage les erreurs vers l'aval.

**Chaîne de signal d'une table DJ :**

```
Source (USB/CDJ/vinyl)
  → TRIM (gain pré-ampli — à régler en premier)
  → EQ (sculpture 3 bandes)
  → Fader de volume (gestion dynamique du mix)
  → Crossfader (blend A/B)
  → Sortie master (vers l'ampli PA)
```

## Ce dont chaque étage est responsable

**TRIM** : calibre le morceau entrant à un niveau de référence. Avant toute autre chose.
**EQ** : façonne l'équilibre fréquentiel de ce signal maintenant calibré.
**Fader de volume** : contrôle le comportement dynamique du mix — tu le gères pendant le mix.
**Crossfader** : gère la transition A→B.
**Master** : niveau final envoyé à la PA. Doit rester fixe une fois réglé.

## L'erreur courante

Monter la sortie master pour compenser un mix trop calme. Ça amplifie le bruit et cause de la distorsion en aval. Le master doit être réglé une fois (correctement, pour la sensibilité d'entrée de la PA) et jamais touché pendant le set.

Toute gestion de niveau appartient au TRIM, pas au master.
"""

[[fr.pages]]
title   = "LUFS vs dBFS : deux mesures différentes"
content = """
## dBFS : niveau de pic brut

Le **dBFS** (decibels relative to Full Scale) mesure l'amplitude du pic d'échantillon dans le signal numérique. Il ne tient pas compte du contenu — un seul transitoire plein échelle et une tonalité soutenue forte donnent des lectures similaires.

0 dBFS = la valeur numérique maximale (point de clipping). Tout est en dessous de 0.

## LUFS : loudness perçue

Le **LUFS** (Loudness Units relative to Full Scale) applique une pondération fréquentielle (K-weighting) et une intégration temporelle avant de calculer le niveau. Il modèle la façon dont l'oreille perçoit la loudness dans le temps — pas seulement l'amplitude de pic.

Deux tracks peuvent toutes les deux crêter à -0,1 dBFS et différer de 8 LUFS :
- Track A : très compressée, sans dynamique → **-7 LUFS** (très forte perceptuellement)
- Track B : dynamique, à transitoires → **-15 LUFS** (même pic numérique, plus calme perçue)

## Cibles des plateformes streaming

Les plateformes normalisent à un LUFS intégré pour créer une expérience d'écoute cohérente :
- **Spotify** : -14 LUFS intégrés
- **Apple Music / Tidal** : -16 LUFS
- **YouTube** : -14 LUFS
- **Broadcast EBU R128** : -23 LUFS

Une track très compressée soumise à -7 LUFS sur Spotify est *baissée* à -14 LUFS lors de la lecture. Son pic est abaissé proportionnellement. Une track dynamique à -14 LUFS joue au niveau de référence.

## Pertinence DJ

Quand tu mixe des tracks d'époque ou de genre différents, la différence de LUFS est ce que tu compenses avec le trim. Matcher les pics ne suffit pas — matche la loudness perçue.
"""

[[fr.pages]]
title   = "La règle des -6 dB de headroom"
content = """
## Pourquoi -6 dB et pas 0 dBFS

Si tu vises 0 dBFS à la sortie de la table, le signal qui tape dans l'ampli PA clippe. Voici pourquoi :

**Trois sources d'overshoot s'accumulent :**
1. **Overshoot de transitoire live** : les pics numériques mesurés par un mètre à fréquence d'échantillonnage ne capturent pas les pics inter-échantillons. Une lecture numérique à -1 dBFS peut produire +1 dBTP (true peak) lors de la reconstruction.
2. **Acoustique de la salle** : les ondes stationnaires dans la salle causent une accumulation de fréquences — certaines notes de basse s'additionnent au lieu de s'annuler, augmentant le SPL effectif de 3–6 dB aux noeuds de résonance.
3. **Dynamique des drivers** : les drivers graves dépassent mécaniquement sur les transitoires rapides — le cône met légèrement plus de temps à s'arrêter que ce que le signal commande.

Ces trois ajouts peuvent sommer à **+5 à +8 dB** au-dessus de ce que montre le mètre.

## La règle de l'industrie

Laisser **-6 dB** entre ton pic le plus fort et 0 dBFS. La marque correspondante sur le VU meter est ta cible de calibrage.

Pourquoi -6 spécifiquement : +6 dB = 2× l'amplitude de tension, qui est le facteur de sécurité standard pour les circuits de reconstruction analogique, le headroom d'ampli PA, et le fonctionnement linéaire des drivers.

## Implémentation pratique

- Trime chaque track pour que les pics tapent à **-6 dB sur le mètre de canal** pendant le drop.
- Fais tourner ton mètre de sortie master en crêtant à **-6 dBFS** pendant les passages les plus forts.
- Si tes canaux crêtent à -6 mais que le master est plus haut, quelque chose dans la sommation du mix ajoute du gain — vérifie ton chevauchement de crossfader ou tes boosts EQ.
"""

[[fr.pages]]
title   = "Fletcher-Munson : pourquoi ton mix maison sonne différemment en club"
content = """
## Le phénomène d'égale loudness

L'oreille humaine n'est pas également sensible sur tout le spectre fréquentiel. À différents niveaux de volume, l'équilibre de ce que tu entends se déplace.

Mesuré par Fletcher et Munson en 1933 (affiné par ISO 226:2003 comme courbes Robinson-Dadson) :

- À **40 dB SPL** (conversation calme) : l'oreille supprime fortement graves et aigus. Les mids dominent.
- À **80 dB SPL** (conversation forte, volume moniteur) : suppression modérée des graves et aigus.
- À **100+ dB SPL** (PA de club sur le dancefloor) : la courbe de réponse s'aplatit significativement. Graves et aigus sont entendus plus près de leur niveau réel.

## La conséquence pratique pour les DJs

Un mix calibré à **70 dB** dans ta chambre sonnera :
- **Boomy / chargé en basses** à 103 dB en club (les basses sont maintenant perçues à plein niveau, les mids n'ont pas changé).
- **Agressif dans les aigus** si tu as coupé les aigus chez toi en pensant qu'ils étaient "trop brillants" — le SPL du club les révèle à nouveau.

## Comment compenser

Utilise un **niveau de référence fixe** pour les moniteurs du booth — typiquement 80–85 dB SPL (mesuré à la position DJ).
Ne monte PAS et ne baisse PAS les moniteurs du booth pour chasser le son de la salle. Garde-les à un niveau de référence connu pour que tes décisions EQ se prennent à un point cohérent sur la courbe d'égale loudness.

Beaucoup de clubs bien équipés fixent le niveau des moniteurs du booth au stade de la conception du système. Si le tien a un bouton de volume pour les moniteurs du booth, demande le niveau de référence à l'ingénieur son avant de jouer.
"""

[[fr.pages]]
title   = "Discipline de trim : un workflow qui tient à l'échelle"
content = """
## Le workflow complet

1. Charge la track dans le CDJ/contrôleur.
2. Mets-la en CUE (casque uniquement).
3. Laisse-la jouer sur la section la plus forte (drop, refrain).
4. Ajuste le TRIM jusqu'à ce que le **mètre de canal crête à -6 dB**.
5. Vérifie : ça sonne à peu près aussi fort dans ton casque que le morceau actuel dans la salle ?
6. Lance le mix.

## Ce qui change selon les systèmes

Sur **Serato/Traktor/rekordbox** : le gain logiciel et le gain de canal fonctionnent de la même façon — ils sont l'équivalent numérique du TRIM. Applique la même logique.

Sur **vinyle** : la sortie de la cellule varie selon le stylet et le préampli. Sur une Rane ou A&H avec un étage phono correct, ajuste le trim de la même façon. Ne suppose pas que le vinyle est toujours plus calme — les lacquers à coupe directe et les 45 modernes peuvent être très forts.

## Note sur le gain staging cumulatif

Chaque morceau que tu joues déplace le niveau de mix courant. Si tu trimes constamment les morceaux 3 dB trop fort, après 10 morceaux la sortie master a dérivé de 3 dB dans la zone danger. La cohérence du trim prévient cette dérive.

Si l'ingénieur son de la salle gère aussi la sortie master (courant en son live), communique : mets-vous d'accord sur un niveau de référence avant le set, et ne touche pas à leur gain système pendant ta performance.
"""

