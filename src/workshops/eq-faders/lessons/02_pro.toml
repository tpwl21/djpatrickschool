[[fr.pages]]
title   = "EBU R128 : trois fenêtres temporelles pour la loudness"
content = """
## Pourquoi une seule mesure ne suffit pas

La perception de la loudness dépend de la durée. Un transitoire très fort de 100ms est traité différemment par l'oreille qu'un son fort soutenu pendant 3 secondes. EBU R128 (2011) définit trois mesures de loudness distinctes pour capturer ça :

**Loudness momentanée (M) :**
- Fenêtre d'intégration : **400 ms**
- Gate : aucun
- Usage : détecter les événements de loudness transitoire. L'impact perçu d'une grosse caisse apparaît ici.
- Pertinence DJ : une section soudainement forte d'une track cause-t-elle un overshoot momentané ?

**Loudness court-terme (S) :**
- Fenêtre d'intégration : **3 secondes**
- Gate : aucun
- Usage : loudness au niveau de la section. Utile pour comparer couplets vs refrains. En contexte DJ : évaluer la loudness d'un drop vs une intro.

**Loudness intégrée (I) :**
- Fenêtre d'intégration : **programme complet** (du début à la fin)
- Gate : gate relatif -10 LU, gate absolu -70 LUFS
- Usage : loudness globale de l'œuvre complète. C'est la valeur que les plateformes streaming comparent à leurs cibles (-14 LUFS pour Spotify).

## True Peak (dBTP)

EBU R128 spécifie aussi la mesure **True Peak** — contrairement au dBFS à fréquence d'échantillonnage, ceci utilise un suréchantillonnage (typiquement 4×) pour détecter les pics inter-échantillons qui se produisent lors de la reconstruction numérique-analogique. Spec : **≤ -1 dBTP** pour le broadcast. Les mètres de table DJ lisent en général les pics d'échantillons, pas le true peak : les pics inter-échantillons peuvent donc dépasser ce qu'ils montrent. C'est l'une des raisons pour lesquelles le « 0 » de la table (la ligne pointillée du mètre du jeu) est placé sous le plafond numérique : reste en haut du vert, quelques flashs jaunes au maximum, jamais de rouge, et la marge fait le reste.
"""

[[fr.pages]]
title   = "Le système de la salle : ce que tu contrôles et ce que tu ne contrôles pas"
content = """
## Une PA est une chaîne, pas une boîte

Entre la sortie de ta table et l'air, un système de club comporte en général :

- un **processeur système** (crossovers, EQ, délais, **limiteurs** qui protègent les enceintes),
- des **amplis**,
- des **enceintes**, parfois en plusieurs zones avec des délais différents.

Celui ou celle qui gère le système règle le gain de cette chaîne et l'accord de la salle. Toi, tu es le **signal d'entrée**.

## Ce que ça signifie pour toi

- **Ton boulot** : un niveau propre et régulier à la sortie de ta table. Trime chaque morceau pour que les mètres de canal soient sur la ligne pointillée, jamais dans le rouge, et laisse le master là où l'ingé le veut.
- **Leur boulot** : le volume de la salle, l'accord du système, et la protection des enceintes.

Des systèmes différents réagissent différemment au même signal : certains pardonnent plus, d'autres révèlent chaque défaut, et rien de ça ne se déduit d'un nom de marque. Le seul geste fiable, c'est de **demander à l'ingé et d'écouter**.

## À demander avant le premier morceau

1. Quel niveau nominal est attendu à la sortie du booth ?
2. Le master est-il verrouillé, ou puis-je y toucher ?
3. Y a-t-il un indicateur de clip sur le système que je dois surveiller ?
"""

[[fr.pages]]
title   = "Acoustique de salle : Sabine, RT60 et accumulation de basses"
content = """
## Pourquoi la salle fait partie de ton gain staging

Une grande salle ne reproduit pas le son instantanément — elle accumule de l'énergie. Le champ réverbérant (énergie se réfléchissant sur murs, plafond, sol) s'ajoute au son direct de la PA et continue après l'arrêt du signal PA.

## La formule de réverbération de Sabine

**T60** = temps de réverbération (temps pour que le champ réverbérant décroisse de 60 dB) :

```
T60 = 0,161 × V / A
```

Où :
- V = volume de la salle en m³
- A = absorption totale dans la salle (somme de la surface × coefficient d'absorption pour chaque matériau)

Un club de taille moyenne typique : volume 2000 m³, absorption A ≈ 300–500 m² (béton, verre, corps). T60 = 0,161 × 2000 / 500 à 0,161 × 2000 / 300, soit **0,64 à 1,07 seconde**.

## Ce que le RT60 signifie pour les basses

Les longueurs d'onde graves sont longues (20 Hz = 17 mètres). Une onde stationnaire à 20 Hz dans une salle de 50m réverbère longtemps après le transitoire qui l'a causée. La conséquence pratique :

- Dans les clubs avec RT60 > 1,2 s aux basses fréquences, l'énergie grave s'accumule entre les grosses caisses. La salle "charge" les basses.
- Les gens absorbent le son. Une salle vide (soundcheck, ouverture) est **plus réverbérante** que la même salle pleine plus tard : les basses peuvent donc sembler plus boomy au début et plus serrées une fois le dancefloor rempli.
- Le trim ne corrige pas l'acoustique de la salle. Si le grave est boomy, dis-le à l'ingé : l'EQ système et les filtres passe-haut sont ses outils.

## Les ingés son utilisent ça

Avant chaque show, l'ingénieur FOH fait un passage d'**égalisation de salle** via logiciel de mesure (Smaart, AudioTools) et un micro de référence à la position de mixage. L'EQ de la PA est ajusté pour compenser les résonances de salle. Ce que tu joues sonne différent après EQ que ce que la PA sort de la table — c'est attendu et voulu.
"""

[[fr.pages]]
title   = "Clipping analogique vs numérique : deux modes de défaillance différents"
content = """
## Pourquoi cette distinction compte

Tous les clippings ne sonnent pas pareil. La différence entre un ampli à lampes poussé doucement en saturation et un processeur numérique qui clippe, c'est la différence entre un disque classique et un mix raté.

## Clipping analogique : saturation douce

Quand un amplificateur analogique, un tube, ou une bande est poussé au-delà de sa plage linéaire :
- La forme d'onde de sortie **s'arrondit aux crêtes** — les bords vifs des transitoires sont adoucis.
- La distorsion est principalement **2e et 3e harmoniques** — octave et quinte.
- Ces harmoniques sont musicalement consonantes avec le fondamental.
- Résultat : **richesse harmonique**, "chaleur", le signal semble plus dense et parfois plus fort.

C'est le principe des amplis à lampes, de la saturation de bande, et de la compression par sommation analogique. Intentionnel, contrôlé, musical.

## Clipping numérique : troncature dure

Quand un signal numérique dépasse 0 dBFS (ou la valeur pleine échelle de n'importe quel étage fixed-point) :
- La forme d'onde est **tronquée à plat** — l'amplitude est bloquée à la valeur maximale.
- La distorsion est constituée **d'harmoniques d'ordre élevé** — une sinusoïde tronquée se décompose en Fourier comme un carré, avec des harmoniques impairs (3e, 5e, 7e...) d'amplitude égale décroissant en 1/n.
- Ces harmoniques **ne sont pas musicalement consonants** avec le matériel typique.
- Les composantes aliasées (fréquences au-dessus de Nyquist, repliées dans la plage audible) créent des produits d'intermodulation dissonants.
- Résultat : distorsion dure, agressive, "crispée" — audible immédiatement à n'importe quel niveau de clip.

## Clipping interne de table DJ

Les tables Pioneer et A&H modernes utilisent du **DSP en virgule flottante 32-bit** en interne — plus de 1500 dB de headroom, pratiquement inclippable. Le point de défaillance est le **convertisseur A/N fixed-point à l'entrée analogique** (24-bit : 144 dB théorique, ~118 dB pratique). Pousse l'entrée trop fort → le CAN clippe → tu ne peux pas corriger en aval.

De même, le **convertisseur N/A à la sortie analogique** est fixed-point. Si le signal de sortie master dépasse 0 dBFS avant la conversion N/A, la sortie clippe dur, peu importe la qualité de la gestion DSP interne.

## La règle pratique

- Clip CAN entrée : règle le trim pour que l'entrée ne clippe pas. Utilise le LED de clip comme limite absolue.
- Clip CNA sortie : garde le master hors du rouge. Le « 0 » de la table (la ligne pointillée) laisse déjà de la marge sous 0 dBFS : en restant en haut du vert, tu n'y touches jamais en pratique.
- Il n'y a pas de "mixer chaud et réparer plus tard" en performance DJ live. Le CNA est le dernier étage.
"""

[[fr.pages]]
title   = "Gain staging au niveau de la salle : une checklist"
content = """
## Le problème

La plupart des clubs n'ont pas de calibrage de gain cohérent d'un DJ et d'un événement à l'autre. Le master a peut-être été bougé par l'artiste précédent. Chaque DJ arrive dans un état de départ inconnu, souvent sans soundcheck.

## Ce que tu peux faire

1. **Normalise ton propre setup** : choisis une habitude de trim (chaque morceau sur la ligne pointillée) et tiens-t'y. Entraîne-toi chez toi comme tu joueras.
2. **Parle à l'ingé** avant le gig : niveau nominal au booth, master verrouillé ou non, quel indicateur surveiller.
3. **Préfère un master fixe** : ne gère pas le master pendant le set. Gère les canaux.
4. **Prévois environ 10 minutes après l'installation** pour vérifier ton trim par rapport au système avant l'arrivée du public.
5. **Garde la référence du booth fixe** : ne monte pas et ne baisse pas les moniteurs du booth pour courir après la salle.

Le DJ est le premier noeud d'un système. Une entrée propre protège chaque noeud en aval.
"""

