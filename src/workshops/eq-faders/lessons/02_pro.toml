[[en.pages]]
title   = "EBU R128: three time windows for loudness"
content = """
## Why one measurement isn't enough

Loudness perception depends on duration. A very loud 100ms transient is processed differently by the ear than a sustained loud tone for 3 seconds. EBU R128 (2011) defines three distinct loudness measures to capture this:

**Momentary loudness (M):**
- Integration window: **400 ms**
- Gate: no gating
- Use: detecting transient loudness events. A kick drum's perceived impact shows up here.
- Typical DJ relevance: does a sudden loud section of a track cause momentary overshoot?

**Short-term loudness (S):**
- Integration window: **3 seconds**
- Gate: no gating
- Use: section-level loudness. Useful for comparing verses vs choruses. In DJ context: evaluating the loudness of a drop vs an intro section.

**Integrated loudness (I):**
- Integration window: **full program** (from start to end)
- Gate: relative gate -10 LU, absolute gate -70 LUFS
- Use: overall loudness of the complete work. This is the value streaming platforms compare against their targets (-14 LUFS for Spotify).

## True Peak (dBTP)

EBU R128 also specifies **True Peak** measurement — unlike sample-rate dBFS, this uses oversampling (typically 4×) to detect inter-sample peaks that occur during digital-to-analog reconstruction. Spec: **≤ -1 dBTP** for broadcast. In DJ practice: trim so your channel output never exceeds **-1 dBTP** on the oversampled output.

Most modern DJ mixers with dBTP meters (Pioneer DJM-A9, Allen & Heath V10) display this correctly. Older mixers with sample-rate VU only: assume 1–2 dB of headroom beyond your meter for inter-sample peaks.
"""

[[en.pages]]
title   = "PA system design philosophies and their effect on DJ mixing"
content = """
## Funktion-One: transient forgiveness

Used at: Fabric (London), Printworks (London), Panorama Bar/Berghain.

**Design philosophy**: minimal crossover points, horn-loaded mid and high drivers, very low distortion at moderate SPL. The horn loading smooths fast transients — a sharp EQ kill or a slightly clipped transient gets "rounded" by the horn's impulse response.

**DJ implication**: forgiving. You can make small gain staging errors and the room absorbs them. Tight, punchy low end. Not the loudest by raw SPL, but consistent across the room.

## Void Acoustics: clinical accuracy

Used at: Space Ibiza (historic), Awakenings (Amsterdam), many EDM venues.

**Design philosophy**: high-SPL, wide dispersion, clinical accuracy. Engineered to reproduce the signal faithfully without coloration.

**DJ implication**: unforgiving. Every dB over the headroom target is audible as distortion in the first three rows. Gain staging errors propagate without softening. Rewards precise trim discipline.

## L-Acoustics K2 / K1: pattern-controlled line arrays

Used at: Festival main stages (Glastonbury, Tomorrowland), large arenas, outdoor events.

**Design philosophy**: controlled directivity, long-throw SPL, consistent coverage at large distances. DSP-controlled waveguides for precision pattern control.

**DJ implication**: primarily used for large-scale events, not intimate clubs. Gain staging here involves coordination with the FOH engineer, who manages the full PA chain. DJs contribute input signal quality; the engineer manages the rest.

## d&b audiotechnik: precision and predictability

Used at: opera houses, theaters, some high-end clubs.

**Design philosophy**: mathematically-predictable coverage, calibrated via manufacturer software (ArrayCalc/R1). Every box in the system is modeled before installation.

**DJ implication**: extremely consistent from seat to seat / area to area. Easier to calibrate, harder to damage accidentally. Common in European venues with high acoustic standards.
"""

[[en.pages]]
title   = "Room acoustics: Sabine, RT60, and bass buildup"
content = """
## Why the room is part of your gain staging

A large room doesn't reproduce sound instantaneously — it accumulates energy. The reverberant field (energy reflecting off walls, ceiling, floor) adds to the direct sound from the PA and continues after the PA signal stops.

## Sabine's reverberation time formula

**T60** = reverberation time (time for the reverberant field to decay by 60 dB):

```
T60 = 0.161 × V / A
```

Where:
- V = room volume in m³
- A = total absorption in the room (sum of surface area × absorption coefficient for each material)

A typical mid-size club: 2000 m³ volume, absorption A ≈ 300–500 m² (concrete, glass, bodies). T60 ≈ 0.9–1.1 seconds.

## What RT60 means for bass

Bass wavelengths are long (20 Hz = 17 meters). A 20 Hz standing wave in a 50m room reverberates long after the transient that caused it. The practical consequence:

- In clubs with RT60 > 1.2 s at low frequencies, bass energy accumulates between kick drums. The room "builds up" bass.
- A set that sounds perfectly gain-staged at the start of the night may feel bass-heavy 2 hours in, as the room warms up and acoustic absorption decreases slightly (the crowd absorbs less when densely packed and sweating).
- Solution: trim tracks slightly lower in a reverberant room, or ask the engineer to engage the venue's sub-bass high-pass filter at the system level.

## Sound engineers use this

Before every show, the FOH engineer runs a **room equalization** pass using measurement software (Smaart, AudioTools) and a reference microphone at the mixing position. The PA EQ is adjusted to compensate for room resonances. What you play sounds different after EQ than what the PA outputs from the mixer — this is expected and by design.
"""

[[en.pages]]
title   = "Analog clipping vs digital clipping: two different failure modes"
content = """
## Why this distinction matters

Not all clipping sounds the same. The difference between a tube amp gently pushed into saturation and a digital processor clipping is the difference between a classic record and a ruined mix.

## Analog clipping: soft saturation

When an analog amplifier, tube, or tape is driven past its linear range:
- The output waveform **rounds at the peaks** — the sharp transient edges are smoothed.
- The distortion is primarily **2nd and 3rd harmonic** — octave and fifth overtones.
- These harmonics are musically consonant with the fundamental.
- Result: **harmonic richness**, "warmth", the signal sounds denser and sometimes louder.

This is the principle behind tube amplifiers, tape saturation, and analog summing bus compression. Intentional, controlled, musical.

## Digital clipping: hard truncation

When a digital signal exceeds 0 dBFS (or the full-scale value of any fixed-point stage):
- The waveform is **flat-topped** — amplitude is clamped at the maximum value.
- The distortion is **high-order harmonics** — a truncated sine wave Fourier-decomposes into a square wave, with odd harmonics (3rd, 5th, 7th...) of equal amplitude that decay as 1/n.
- These harmonics are **not musically consonant** with typical material.
- The aliased components (frequencies above Nyquist, wrapped back into audible range) create dissonant intermodulation products.
- Result: harsh, grating, "crispy" distortion — audible immediately at any clip level.

## DJ mixer internal clipping

Modern Pioneer and A&H mixers use **32-bit floating-point DSP** internally — over 1500 dB of headroom, practically unclippable. The failure point is the **fixed-point A/D converter at the analog input** (24-bit: 144 dB theoretical, ~118 dB practical). Drive the input too hot → ADC clips → you cannot fix it downstream.

Likewise, the **D/A converter at the analog output** is fixed-point. If the master output signal exceeds 0 dBFS before D/A conversion, the output clips hard, regardless of how well the internal DSP is managed.

## The practical rule

- ADC input clip: set trim so the input doesn't clip. Use the clip LED as a hard limit.
- DAC output clip: keep master output below 0 dBFS. The -6 dB target ensures you never touch this in practice.
- There is no "mix hot and fix it later" in live DJ performance. The D/A is the last stage.
"""

[[en.pages]]
title   = "Berghain: a case study in venue-level gain staging"
content = """
## The problem venues solve (or don't)

Most clubs have a PA system with no consistent gain calibration across different DJs and events. The master output may drift. The system gain may vary depending on what the previous DJ set. Each artist arrives to an unknown starting state.

## Berghain's approach

Berghain (Berlin) calibrates the entire signal chain from the DJ mixer output to the final amplifier input to a **fixed, documented reference level**. The Funktion-One rig is optimized for that reference. The system operates at a known point on the equal-loudness curve.

Every DJ who plays the main floor receives:
- A verified trim-to-master chain at the correct level
- Booth monitors at a fixed calibrated reference SPL
- No control over the master gain (it's locked at the tech desk)

The result: a DJ focused on music selection and EQ makes no decisions that can accidentally destroy the PA chain. The sound remains consistent as DJ lineups change — sometimes every 4–6 hours, without soundcheck.

## What DJs should take from this

1. **Normalize your personal DJ setup** — choose a reference trim level and stick to it. Your at-home gain structure should match your club setup as closely as possible.
2. **Communicate with the venue engineer** before every gig. Ask: what is the nominal level at the booth output? Is there a clip LED I should watch?
3. **Prefer fixed master outputs** — don't ride the master during the set. Ride the channels.
4. **Budget 10 minutes after load-in** to calibrate trim against the system before the audience arrives.

The DJ is the first node in a system. Clean input to that system protects every node downstream.
"""

