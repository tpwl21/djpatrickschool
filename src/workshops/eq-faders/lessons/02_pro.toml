[[en.pages]]
title   = "EBU R128: three time windows for loudness"
content = """
## Why one measurement isn't enough

Loudness perception depends on duration. A very loud 100ms transient is processed differently by the ear than a sustained loud tone for 3 seconds. EBU R128 (2011) defines three distinct loudness measures to capture this:

**Momentary loudness (M):**
- Integration window: **400 ms**
- Gate: no gating
- Use: detecting transient loudness events. A kick drum's perceived impact shows up here.
- Typical DJ relevance: does a sudden loud section of a track cause momentary overshoot?

**Short-term loudness (S):**
- Integration window: **3 seconds**
- Gate: no gating
- Use: section-level loudness. Useful for comparing verses vs choruses. In DJ context: evaluating the loudness of a drop vs an intro section.

**Integrated loudness (I):**
- Integration window: **full program** (from start to end)
- Gate: relative gate -10 LU, absolute gate -70 LUFS
- Use: overall loudness of the complete work. This is the value streaming platforms compare against their targets (-14 LUFS for Spotify).

## True Peak (dBTP)

EBU R128 also specifies **True Peak** measurement — unlike sample-rate dBFS, this uses oversampling (typically 4×) to detect inter-sample peaks that occur during digital-to-analog reconstruction. Spec: **≤ -1 dBTP** for broadcast. DJ mixer meters generally read sample peaks, not true peak, so inter-sample peaks can go above what they show. That is one of the reasons the mixer's "0" (the dotted line on the game's meter) sits below the digital ceiling: stay at the top of the green, a few yellow flashes at most, never red, and the margin takes care of it.
"""

[[en.pages]]
title   = "The venue's system: what you control and what you don't"
content = """
## A PA is a chain, not a box

Between your mixer's output and the air, a club system usually has:

- a **system processor** (crossovers, EQ, delays, **limiters** that protect the speakers),
- **amplifiers**,
- **loudspeakers**, sometimes in several zones with different delays.

Whoever runs the system sets the gain of that chain and the room tuning. You are the **input signal**.

## What this means for you

- **Your job**: a clean, consistent level at your mixer output. Trim each track so the channel meters sit at the dotted line, never red, and leave the master where the engineer wants it.
- **Their job**: how loud the room is, how the system is tuned, and protecting the speakers.

Different systems react differently to the same signal: some are more forgiving, some reveal every flaw, and none of that is predictable from a brand name. The only reliable move is to **ask the engineer and listen**.

## What to ask before the first track

1. What is the nominal level expected at the booth output?
2. Is the master locked, or may I touch it?
3. Is there a clip indicator on the system that I should watch?
"""

[[en.pages]]
title   = "Room acoustics: Sabine, RT60, and bass buildup"
content = """
## Why the room is part of your gain staging

A large room doesn't reproduce sound instantaneously — it accumulates energy. The reverberant field (energy reflecting off walls, ceiling, floor) adds to the direct sound from the PA and continues after the PA signal stops.

## Sabine's reverberation time formula

**T60** = reverberation time (time for the reverberant field to decay by 60 dB):

```
T60 = 0.161 × V / A
```

Where:
- V = room volume in m³
- A = total absorption in the room (sum of surface area × absorption coefficient for each material)

A typical mid-size club: 2000 m³ volume, absorption A ≈ 300–500 m² (concrete, glass, bodies). T60 = 0.161 × 2000 / 500 to 0.161 × 2000 / 300, so **0.64 to 1.07 seconds**.

## What RT60 means for bass

Bass wavelengths are long (20 Hz = 17 meters). A 20 Hz standing wave in a 50m room reverberates long after the transient that caused it. The practical consequence:

- In clubs with RT60 > 1.2 s at low frequencies, bass energy accumulates between kick drums. The room "builds up" bass.
- People absorb sound. An empty room (soundcheck, opening) is **more reverberant** than the same room packed later, so the bass can feel boomier early on and tighter once the floor is full.
- Trim does not fix room acoustics. If the low end feels boomy, tell the engineer: system EQ and high-pass filters are their tools.

## Sound engineers use this

Before every show, the FOH engineer runs a **room equalization** pass using measurement software (Smaart, AudioTools) and a reference microphone at the mixing position. The PA EQ is adjusted to compensate for room resonances. What you play sounds different after EQ than what the PA outputs from the mixer — this is expected and by design.
"""

[[en.pages]]
title   = "Analog clipping vs digital clipping: two different failure modes"
content = """
## Why this distinction matters

Not all clipping sounds the same. The difference between a tube amp gently pushed into saturation and a digital processor clipping is the difference between a classic record and a ruined mix.

## Analog clipping: soft saturation

When an analog amplifier, tube, or tape is driven past its linear range:
- The output waveform **rounds at the peaks** — the sharp transient edges are smoothed.
- The distortion is primarily **2nd and 3rd harmonic** — octave and fifth overtones.
- These harmonics are musically consonant with the fundamental.
- Result: **harmonic richness**, "warmth", the signal sounds denser and sometimes louder.

This is the principle behind tube amplifiers, tape saturation, and analog summing bus compression. Intentional, controlled, musical.

## Digital clipping: hard truncation

When a digital signal exceeds 0 dBFS (or the full-scale value of any fixed-point stage):
- The waveform is **flat-topped** — amplitude is clamped at the maximum value.
- The distortion is **high-order harmonics** — a truncated sine wave Fourier-decomposes into a square wave, with odd harmonics (3rd, 5th, 7th...) of equal amplitude that decay as 1/n.
- These harmonics are **not musically consonant** with typical material.
- The aliased components (frequencies above Nyquist, wrapped back into audible range) create dissonant intermodulation products.
- Result: harsh, grating, "crispy" distortion — audible immediately at any clip level.

## DJ mixer internal clipping

Modern Pioneer and A&H mixers use **32-bit floating-point DSP** internally — over 1500 dB of headroom, practically unclippable. The failure point is the **fixed-point A/D converter at the analog input** (24-bit: 144 dB theoretical, ~118 dB practical). Drive the input too hot → ADC clips → you cannot fix it downstream.

Likewise, the **D/A converter at the analog output** is fixed-point. If the master output signal exceeds 0 dBFS before D/A conversion, the output clips hard, regardless of how well the internal DSP is managed.

## The practical rule

- ADC input clip: set trim so the input doesn't clip. Use the clip LED as a hard limit.
- DAC output clip: keep the master out of the red. The mixer's "0" (the dotted line) already leaves margin below 0 dBFS, so staying at the top of the green means you never touch this in practice.
- There is no "mix hot and fix it later" in live DJ performance. The D/A is the last stage.
"""

[[en.pages]]
title   = "Gain staging at venue level: a checklist"
content = """
## The problem

Most clubs have no consistent gain calibration across different DJs and events. The master may have been moved by the previous artist. Each DJ arrives to an unknown starting state, often without a soundcheck.

## What you can do about it

1. **Normalize your own setup**: choose a trim habit (every track to the dotted line) and stick to it. Practice at home the way you will play.
2. **Talk to the engineer** before the gig: nominal level at the booth, master locked or not, which indicator to watch.
3. **Prefer a fixed master**: do not ride the master during the set. Ride the channels.
4. **Budget about 10 minutes after load-in** to check your trim against the system before the audience arrives.
5. **Keep the booth reference fixed**: do not turn the booth monitors up and down to chase the room.

The DJ is the first node in a system. A clean input protects every node downstream.
"""

