answers  = ["Dans le DSP interne pendant le traitement EQ", "Dans l'électronique du crossfader", "Au CAN fixed-point à l'entrée analogique et au CNA à la sortie analogique"]

[[quiz]]
correct = 1
[quiz.fr]
question = "Que détecte la mesure dBTP (True Peak) que le dBFS standard ne détecte pas ?"
answers  = ["La réverbération de salle", "Les pics inter-échantillons qui se produisent lors de la reconstruction numérique-analogique, détectés par suréchantillonnage", "La loudness intégrée LUFS"]

