[[fr.pages]]
title   = "EBU R128 : trois fenêtres temporelles pour la loudness"
content = """
## Pourquoi une seule mesure ne suffit pas

La perception de la loudness dépend de la durée. Un transitoire très fort de 100ms est traité différemment par l'oreille qu'un son fort soutenu pendant 3 secondes. EBU R128 (2011) définit trois mesures de loudness distinctes pour capturer ça :

**Loudness momentanée (M) :**
- Fenêtre d'intégration : **400 ms**
- Gate : aucun
- Usage : détecter les événements de loudness transitoire. L'impact perçu d'une grosse caisse apparaît ici.
- Pertinence DJ : une section soudainement forte d'une track cause-t-elle un overshoot momentané ?

**Loudness court-terme (S) :**
- Fenêtre d'intégration : **3 secondes**
- Gate : aucun
- Usage : loudness au niveau de la section. Utile pour comparer couplets vs refrains. En contexte DJ : évaluer la loudness d'un drop vs une intro.

**Loudness intégrée (I) :**
- Fenêtre d'intégration : **programme complet** (du début à la fin)
- Gate : gate relatif -10 LU, gate absolu -70 LUFS
- Usage : loudness globale de l'œuvre complète. C'est la valeur que les plateformes streaming comparent à leurs cibles (-14 LUFS pour Spotify).

## True Peak (dBTP)

EBU R128 spécifie aussi la mesure **True Peak** — contrairement au dBFS à fréquence d'échantillonnage, ceci utilise un suréchantillonnage (typiquement 4×) pour détecter les pics inter-échantillons qui se produisent lors de la reconstruction numérique-analogique. Spec : **≤ -1 dBTP** pour le broadcast. En pratique DJ : trime pour que ta sortie canal ne dépasse jamais **-1 dBTP** sur la sortie suréchantillonnée.

La plupart des tables DJ modernes avec mètres dBTP (Pioneer DJM-A9, Allen & Heath V10) affichent ça correctement. Tables anciennes avec VU à fréquence d'échantillonnage seulement : suppose 1–2 dB de headroom au-delà de ton mètre pour les pics inter-échantillons.
"""

[[fr.pages]]
title   = "Philosophies de conception PA et leur effet sur le mix DJ"
content = """
## Funktion-One : tolérance aux transitoires

Utilisé à : Fabric (Londres), Printworks (Londres), Panorama Bar/Berghain.

**Philosophie de conception** : points de crossover minimaux, drivers mid et high à pavillon, très faible distorsion à SPL modéré. Le chargement à pavillon adoucit les transitoires rapides — un kill EQ brusque ou un transitoire légèrement clippé est "arrondi" par la réponse impulsionnelle du pavillon.

**Implication DJ** : pardonnant. Tu peux faire de petites erreurs de gain staging et la salle les absorbe. Basse tendue et percutante. Pas le plus fort en SPL brut, mais cohérent dans toute la salle.

## Void Acoustics : précision clinique

Utilisé à : Space Ibiza (historique), Awakenings (Amsterdam), beaucoup de salles EDM.

**Philosophie de conception** : haut SPL, dispersion large, précision clinique. Conçu pour reproduire fidèlement le signal sans coloration.

**Implication DJ** : impitoyable. Chaque dB au-dessus de la cible de headroom est audible comme distorsion dans les trois premiers rangs. Les erreurs de gain staging se propagent sans adoucissement. Récompense une discipline de trim précise.

## L-Acoustics K2 / K1 : line arrays à directivité contrôlée

Utilisé à : main stages de festivals (Glastonbury, Tomorrowland), grandes arènes, événements outdoor.

**Philosophie de conception** : directivité contrôlée, SPL longue portée, couverture cohérente sur de grandes distances. Guides d'ondes contrôlés par DSP pour un contrôle précis du rayonnement.

**Implication DJ** : principalement utilisé pour les grands événements, pas les clubs intimistes. Le gain staging ici implique la coordination avec l'ingénieur FOH, qui gère toute la chaîne PA. Les DJs contribuent la qualité du signal d'entrée ; l'ingénieur gère le reste.

## d&b audiotechnik : précision et prédictibilité

Utilisé à : opéras, théâtres, certains clubs haut de gamme.

**Philosophie de conception** : couverture mathématiquement prédictible, calibrée via logiciel fabricant (ArrayCalc/R1). Chaque enceinte du système est modélisée avant installation.

**Implication DJ** : extrêmement cohérent de siège en siège / de zone en zone. Plus facile à calibrer, plus difficile à endommager accidentellement. Courant dans les salles européennes avec des standards acoustiques élevés.
"""

[[fr.pages]]
title   = "Acoustique de salle : Sabine, RT60 et accumulation de basses"
content = """
## Pourquoi la salle fait partie de ton gain staging

Une grande salle ne reproduit pas le son instantanément — elle accumule de l'énergie. Le champ réverbérant (énergie se réfléchissant sur murs, plafond, sol) s'ajoute au son direct de la PA et continue après l'arrêt du signal PA.

## La formule de réverbération de Sabine

**T60** = temps de réverbération (temps pour que le champ réverbérant décroisse de 60 dB) :

```
T60 = 0,161 × V / A
```

Où :
- V = volume de la salle en m³
- A = absorption totale dans la salle (somme de la surface × coefficient d'absorption pour chaque matériau)

Un club de taille moyenne typique : volume 2000 m³, absorption A ≈ 300–500 m² (béton, verre, corps). T60 ≈ 0,9–1,1 secondes.

## Ce que le RT60 signifie pour les basses

Les longueurs d'onde graves sont longues (20 Hz = 17 mètres). Une onde stationnaire à 20 Hz dans une salle de 50m réverbère longtemps après le transitoire qui l'a causée. La conséquence pratique :

- Dans les clubs avec RT60 > 1,2 s aux basses fréquences, l'énergie grave s'accumule entre les grosses caisses. La salle "charge" les basses.
- Un set qui semble parfaitement stagé au début de la soirée peut paraître chargé en basses 2 heures plus tard, quand la salle se réchauffe et que l'absorption acoustique diminue légèrement (la foule absorbe moins quand elle est dense et transpirante).
- Solution : trime les morceaux légèrement plus bas dans une salle réverbérante, ou demande à l'ingénieur d'engager le filtre passe-haut sub-graves du système au niveau système.

## Les ingés son utilisent ça

Avant chaque show, l'ingénieur FOH fait un passage d'**égalisation de salle** via logiciel de mesure (Smaart, AudioTools) et un micro de référence à la position de mixage. L'EQ de la PA est ajusté pour compenser les résonances de salle. Ce que tu joues sonne différent après EQ que ce que la PA sort de la table — c'est attendu et voulu.
"""

[[fr.pages]]
title   = "Clipping analogique vs numérique : deux modes de défaillance différents"
content = """
## Pourquoi cette distinction compte

Tous les clippings ne sonnent pas pareil. La différence entre un ampli à lampes poussé doucement en saturation et un processeur numérique qui clippe, c'est la différence entre un disque classique et un mix raté.

## Clipping analogique : saturation douce

Quand un amplificateur analogique, un tube, ou une bande est poussé au-delà de sa plage linéaire :
- La forme d'onde de sortie **s'arrondit aux crêtes** — les bords vifs des transitoires sont adoucis.
- La distorsion est principalement **2e et 3e harmoniques** — octave et quinte.
- Ces harmoniques sont musicalement consonantes avec le fondamental.
- Résultat : **richesse harmonique**, "chaleur", le signal semble plus dense et parfois plus fort.

C'est le principe des amplis à lampes, de la saturation de bande, et de la compression par sommation analogique. Intentionnel, contrôlé, musical.

## Clipping numérique : troncature dure

Quand un signal numérique dépasse 0 dBFS (ou la valeur pleine échelle de n'importe quel étage fixed-point) :
- La forme d'onde est **tronquée à plat** — l'amplitude est bloquée à la valeur maximale.
- La distorsion est constituée **d'harmoniques d'ordre élevé** — une sinusoïde tronquée se décompose en Fourier comme un carré, avec des harmoniques impairs (3e, 5e, 7e...) d'amplitude égale décroissant en 1/n.
- Ces harmoniques **ne sont pas musicalement consonants** avec le matériel typique.
- Les composantes aliasées (fréquences au-dessus de Nyquist, repliées dans la plage audible) créent des produits d'intermodulation dissonants.
- Résultat : distorsion dure, agressive, "crispée" — audible immédiatement à n'importe quel niveau de clip.

## Clipping interne de table DJ

Les tables Pioneer et A&H modernes utilisent du **DSP en virgule flottante 32-bit** en interne — plus de 1500 dB de headroom, pratiquement inclippable. Le point de défaillance est le **convertisseur A/N fixed-point à l'entrée analogique** (24-bit : 144 dB théorique, ~118 dB pratique). Pousse l'entrée trop fort → le CAN clippe → tu ne peux pas corriger en aval.

De même, le **convertisseur N/A à la sortie analogique** est fixed-point. Si le signal de sortie master dépasse 0 dBFS avant la conversion N/A, la sortie clippe dur, peu importe la qualité de la gestion DSP interne.

## La règle pratique

- Clip CAN entrée : règle le trim pour que l'entrée ne clippe pas. Utilise le LED de clip comme limite absolue.
- Clip CNA sortie : garde la sortie master sous 0 dBFS. La cible -6 dB assure que tu n'y touches jamais en pratique.
- Il n'y a pas de "mixer chaud et réparer plus tard" en performance DJ live. Le CNA est le dernier étage.
"""

[[fr.pages]]
title   = "Berghain : étude de cas en gain staging de niveau salle"
content = """
## Le problème que les salles résolvent (ou pas)

La plupart des clubs ont un système PA sans calibrage de gain cohérent entre différents DJs et événements. La sortie master peut dériver. Le gain système peut varier selon ce que le DJ précédent a réglé. Chaque artiste arrive dans un état de départ inconnu.

## L'approche Berghain

Berghain (Berlin) calibre toute la chaîne de signal de la sortie table DJ jusqu'à l'entrée ampli final à un **niveau de référence fixe et documenté**. Le rig Funktion-One est optimisé pour cette référence. Le système fonctionne à un point connu sur la courbe d'égale loudness.

Chaque DJ qui joue sur le dancefloor principal reçoit :
- Une chaîne trim-to-master vérifiée au niveau correct
- Des moniteurs de booth à un SPL de référence calibré fixe
- Aucun contrôle sur le gain master (verrouillé à la régie technique)

Résultat : un DJ concentré sur la sélection musicale et l'EQ ne prend aucune décision pouvant accidentellement détruire la chaîne PA. Le son reste cohérent au fil des changements de lineup — parfois toutes les 4–6 heures, sans soundcheck.

## Ce que les DJs doivent en retenir

1. **Normalise ton setup DJ personnel** — choisis un niveau de trim de référence et tiens-t'y. Ta structure de gain à la maison doit correspondre le plus possible à ton setup en club.
2. **Communique avec l'ingénieur son de la salle** avant chaque gig. Demande : quel est le niveau nominal à la sortie du booth ? Y a-t-il un LED de clip à surveiller ?
3. **Préfère des sorties master fixes** — ne gère pas le master pendant le set. Gère les canaux.
4. **Prévois 10 minutes après l'installation** pour calibrer le trim par rapport au système avant l'arrivée du public.

Le DJ est le premier noeud d'un système. Un signal d'entrée propre protège chaque noeud en aval.
"""

