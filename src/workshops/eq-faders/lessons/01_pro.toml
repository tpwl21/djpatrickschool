[[fr.pages]]
title   = "Topologie de filtre biquad IIR : ce qu'il y a sous le bouton EQ"
content = """
## Le filtre derrière le contrôle

Chaque bande EQ sur une table DJ est implémentée comme un **filtre IIR (Infinite Impulse Response) du 2e ordre** — plus précisément, un **biquad** (nommé d'après sa fonction de transfert bi-quadratique). La référence canonique est l'*Audio EQ Cookbook* de Robert Bristow-Johnson, maintenant hébergé sur W3C.

La fonction de transfert biquad dans le domaine z :

```
H(z) = (b0 + b1*z^-1 + b2*z^-2) / (1 + a1*z^-1 + a2*z^-2)
```

Cinq coefficients (b0, b1, b2, a1, a2) définissent entièrement le filtre. Avec eux tu peux exprimer n'importe quel filtre du 2e ordre : low shelf, high shelf, peaking bell, passe-bande, coupe-bande, all-pass.

## Comment les bandes EQ DJ sont implémentées

- **Bande Low** : filtre **low shelving** du 2e ordre. Boost/cut sous la fréquence de shelf (choisie par le fabricant). Pente : 12 dB/octave au genou.
- **Bande High** : filtre **high shelving** du 2e ordre. Même principe, en miroir au-dessus de sa propre fréquence de shelf.
- **Bande Mid** : filtre **peaking (bell) du 2e ordre**. Boost/cut symétrique centré sur la fréquence mid. Le **facteur Q** contrôle la bande passante : Q élevé = notch étroit, Q faible = cloche large. Les valeurs changent d'une table à l'autre et les fabricants les publient rarement.

## Contexte Web Audio

Ce projet implémente exactement ça : trois instances de `BiquadFilterNode` par deck — `lowshelf`, `peaking`, `highshelf` — connectées en série. Cf. `src/audio/MagicAudioContext.js`. Les coefficients sont calculés par le moteur audio du navigateur à partir des paramètres `frequency`, `gain` et `Q` que tu règles.
"""

[[fr.pages]]
title   = "EQ vs isolator : ce que « full kill » veut vraiment dire"
content = """
## EQ classique : un kill pas forcément total

Sur un EQ classique, tourner une bande à fond ne donne pas forcément -∞ dB. Des modèles Pioneer plus anciens comme la **DJM-800** s'arrêtent vers **-26 dB** en bout de course : une grosse coupe (un facteur 20 en amplitude), mais une grosse caisse très forte laisse quand même une trace dans la salle.

Les tables Pioneer DJ récentes (**DJM-900NXS2, DJM-A9, DJM-V10**) coupent à **-∞** et ont un sélecteur **EQ / Isolator** : les mêmes boutons, deux comportements. Vérifie le manuel de la table que tu as devant toi plutôt que de supposer.

## Topologie isolator : une bande à zéro ne route rien

Un **isolateur** divise le signal en bandes avec des **filtres de crossover Linkwitz-Riley (L-R)** — des paires de Butterworth en cascade conçues pour se sommer à plat à la fréquence de crossover. Chaque bande a ensuite son propre contrôle de niveau et les bandes sont recombinées.

Comme les bandes sont séparées *avant* le contrôle de niveau, une bande à zéro = **rien n'est routé** : un vrai -∞ dB avec une zone de crossover propre.

L'effet secondaire : un isolator n'est pas un doux réglage de tonalité. C'est un outil de coupe. C'est pour ça qu'on l'aime pour les kills et les swaps, et qu'un boost est rarement le but.

## Variante SVF (State Variable Filter)

Le **filtre à variable d'état** sort des réponses passe-bas, passe-haut, passe-bande et coupe-bande depuis une seule structure. Il reste stable quand on change vite ses paramètres, ce qui en fait un choix courant pour les filtres que l'on balaie à la main. C'est un classique de la synthèse.
"""

[[fr.pages]]
title   = "Pourquoi une seule basse à la fois : boue et phase"
content = """
## Deux basses, ce n'est pas deux fois plus de basse

Quand deux basses jouent ensemble, trois choses se passent :

1. **Battements et boue** : des notes proches mais pas identiques en hauteur interfèrent et font gonfler et trembler le grave.
2. **Annulation de phase** : les basses fréquences ont de longues périodes. Une sinusoïde à **50 Hz** a une période de **20 ms**, donc deux grosses caisses décalées de seulement **10 ms** sont en opposition de phase et annulent cette composante à 50 Hz. À **100 Hz** (période 10 ms), un décalage de **5 ms** fait pareil. Un beatmatch décalé de quelques millisecondes est normal, et ça suffit à amincir le grave.
3. **Sommation** : deux signaux identiques en phase s'additionnent de **+6 dB**. Deux signaux différents s'additionnent de façon imprévisible, et le résultat arrive sur ton niveau master.

## Le bass swap protège-t-il le matériel ?

Non. Les PA de club ont des **processeurs avec limiteurs** qui protègent les haut-parleurs : un chevauchement de basses n'est pas ce qui sépare le système d'une enceinte cassée. Le bass swap existe pour **le son** : pas de boue, pas d'annulation, une seule grosse caisse nette à la fois.

## Le workflow

Kill le Low entrant, laisse le morceau se fondre, puis swap sur le **premier temps d'une phrase** (32 temps) : le Low de A descend, le Low de B monte, en un seul geste. C'est ce que valide le niveau 2 de cet atelier.
"""

[[fr.pages]]
title   = "Fletcher-Munson et le problème de calibrage du DJ"
content = """
## Courbes d'égale loudness

Les courbes d'égale loudness cartographient la sensibilité de l'oreille selon les fréquences pour une loudness perçue donnée. Fletcher et Munson les ont publiées en 1933, Robinson et Dadson ont refait la mesure en 1956, et **l'ISO 226:2003** est la norme qui a remplacé les courbes Robinson-Dadson.

Observations clés :
- À **bas niveau**, l'oreille est bien moins sensible aux graves et aux très aigus. Les mids dominent la perception.
- À **haut niveau**, les courbes s'aplatissent : le spectre est perçu plus uniformément.

## La conséquence pour le calibrage DJ

Un mix qui sonne équilibré à bas niveau dans la chambre paraîtra en général **plus lourd dans les basses** une fois joué fort sur un système de club, parce que le grave est maintenant perçu à une fraction plus grande de son niveau réel.

C'est pour ça que les DJs expérimentés gardent les moniteurs du booth à un **niveau fixe et connu** au lieu de bouger le volume du booth pour suivre la salle. Tes décisions EQ se prennent alors au même point de la courbe d'égale loudness à chaque fois.

## Que faire

Fixe ta référence. Vérifie ton EQ dans la salle au vrai niveau de jeu, et demande à l'ingé son comment le booth est réglé avant le premier morceau. Les courbes t'expliquent pourquoi le même mix ne se ressent pas pareil à 70 dB et à 100 dB ; elles ne te donnent pas un chiffre magique à régler.
"""

[[fr.pages]]
title   = "Routing du PFL : pré-fader, et en général post-EQ"
content = """
## Où le cue prélève le signal

**PFL** veut dire **Pre-Fader Listen** : le cue est pris **avant** le fader de canal, donc tu peux écouter un deck à n'importe quelle position de fader sans que la salle l'entende.

Qu'il soit pris avant ou après l'EQ dépend de la conception. Sur la plupart des tables DJ, le PFL est **post-EQ** : ton travail EQ se reflète dans le casque, donc tu entends ce que la salle va recevoir. Lis le manuel de ta table pour être sûr.

## Pourquoi ça compte dans le booth

Si le cue d'une table était pris avant l'EQ, un mid-cut que tu fais n'apparaîtrait pas dans le casque et tu pourrais sous-couper dans la salle, parce que ta référence ne reflèterait pas ton geste. Avec un cue post-EQ, tu entends exactement ce que tu vas envoyer.

## Gain staging de l'ampli casque

L'ampli casque est une chaîne de signal séparée avec son propre gain. S'il est surpiloté par un trim trop chaud ou un volume casque trop haut, le cue peut distordre alors que la sortie principale va bien. Demande-toi toujours : qu'est-ce qui sature, le canal, le mètre master ou la sortie casque ? Ce sont des étages différents.
"""

