[[fr.pages]]
title   = "Topologie de filtre biquad IIR : ce qu'il y a sous le bouton EQ"
content = """
## Le filtre derrière le contrôle

Chaque bande EQ sur une table DJ est implémentée comme un **filtre IIR (Infinite Impulse Response) du 2e ordre** — plus précisément, un **biquad** (nommé d'après sa fonction de transfert bi-quadratique). La référence canonique est l'*Audio EQ Cookbook* de Robert Bristow-Johnson, maintenant hébergé sur W3C.

La fonction de transfert biquad dans le domaine z :

```
H(z) = (b0 + b1*z^-1 + b2*z^-2) / (1 + a1*z^-1 + a2*z^-2)
```

Cinq coefficients (b0, b1, b2, a1, a2) définissent entièrement le filtre. Avec eux tu peux exprimer n'importe quel filtre du 2e ordre : low shelf, high shelf, peaking bell, passe-bande, coupe-bande, all-pass.

## Comment les bandes EQ DJ sont implémentées

- **Bande Low** : filtre **low shelving** du 2e ordre. Boost/cut sous la fréquence de shelf (~300 Hz sur une DJM). Pente : 12 dB/octave au genou.
- **Bande High** : filtre **high shelving** du 2e ordre. Même principe, miroir au-dessus de ~4 kHz.
- **Bande Mid** : filtre **peaking (bell) du 2e ordre**. Boost/cut symétrique centré sur la fréquence mid. Le **facteur Q** contrôle la bande passante : Q élevé = notch étroit, Q faible = cloche large. Sur une DJM le Q mid est ~1,5–2 ; sur une Xone le mid est plus étroit (Q ~2,5–3).

## Contexte Web Audio

Ce projet implémente exactement ça : trois instances de `BiquadFilterNode` par deck — `lowshelf`, `peaking`, `highshelf` — connectées en série. Cf. `src/audio/MagicAudioContext.js`. Les coefficients sont calculés par le moteur audio du navigateur à partir des paramètres `frequency`, `gain` et `Q` que tu règles.
"""

[[fr.pages]]
title   = "Topologie isolator : pourquoi un kill Rane sonne différent d'un kill Pioneer"
content = """
## EQ traditionnel : le problème d'atténuation

Sur un EQ DJ 3-bandes standard (Pioneer DJM), tourner une bande à fond ne produit pas vraiment -∞ dB. Ça produit environ **-26 dB** (le cran mécanique en bout de course). C'est une atténuation de 20:1 — substantielle, mais un beat avec un kick très fort laissera quand même une énergie sub résiduelle audible dans la salle.

Pour obtenir un *vrai kill* sur une Pioneer, il faut aussi baisser momentanément le fader de canal, ou le gain de la track est si bas que le résiduel est sous le seuil d'audibilité.

## Topologie isolator : vrais kills à -∞ dB

Un **isolateur** divise le signal en bandes de fréquences via des **filtres de crossover Linkwitz-Riley (L-R)** — une paire de filtres Butterworth cascadés conçus pour se sommer à plat à la fréquence de crossover sans discontinuité de phase. Chaque bande est ensuite amplifiée indépendamment et recombinée.

La propriété clé : les bandes étant vraiment séparées avant d'atteindre le contrôle d'amplitude, tourner une bande à zéro = **router zéro signal** — vrai -∞ dB avec une région de crossover propre. Pas de fuite des bandes adjacentes.

Rane (TTM57, MP2015), les anciens modèles A&H Xone, et les tables spécialisées (Vestax) utilisaient la topologie isolator. Les tables rotatives Urei/Bozak au Berghain utilisent une variation de ce principe.

## Variante SVF (State Variable Filter)

Les tables haut de gamme utilisent aussi la **topologie SVF** — le filtre à variable d'état sort simultanément des réponses passe-bas, passe-haut, passe-bande et coupe-bande depuis une seule structure de filtre. Il a une meilleure stabilité fréquentielle et peut être sweepé sans instabilité. Utilisé en synthèse modulaire et dans certains designs de tables boutique.
"""

[[fr.pages]]
title   = "Physique de la PA : pourquoi les kicks simultanés endommagent les systèmes"
content = """
## Le problème Xmax

Un driver de subwoofer a une limite d'excursion de cône physique appelée **Xmax** — la distance que la bobine peut parcourir linéairement avant que la force du gap magnétique devienne non-linéaire (la bobine commence à quitter le gap).

Les drivers de sub 18" typiques utilisés dans les PAs de club ont des valeurs Xmax de **10–25mm** selon la conception. Le SPL nominal assume que le cône reste dans cette plage.

## Ce que font deux kicks simultanés

Un transitoire de basse tire un pic de courant qui commande à la bobine de se déplacer rapidement vers sa limite d'excursion et de revenir. Quand deux transitoires de kick arrivent simultanément (deux tracks, les deux basses actives, dans le même temps) :

1. La demande de courant combinée peut être **2× le courant de pic nominal**.
2. La bobine est poussée au-delà de Xmax — dans la **région non-linéaire**.
3. Résultat : **distorsion mécanique** (harmonique et d'intermodulation) depuis la courbe force-déplacement non-linéaire du driver.
4. Sur les amplis équipés de protection : le circuit de protection se déclenche, le système clippe brièvement ou coupe — audible comme un "crunch" ou une perte momentanée.

## Pourquoi le bass swap est une contrainte physique

Le bass swap n'est pas une tradition stylistique. C'est une **contrainte physique du transducteur**. Aucun DSP bien réglé ne peut annuler l'excursion de bobine au-delà de Xmax. Le DJ est le dernier maillon de contrôle avant les limites mécaniques de la PA.
"""

[[fr.pages]]
title   = "Fletcher-Munson et le problème de calibrage du DJ"
content = """
## Courbes d'égale loudness

Les **courbes Fletcher-Munson** (1933, affinées par ISO 226:2003 comme courbes Robinson-Dadson) cartographient la sensibilité auditive humaine sur le spectre fréquentiel à loudness perçue égale.

Observations clés :
- À **bas SPL (~40 phons)**, l'oreille est nettement moins sensible aux graves (<200 Hz) et aux très aigus (>10 kHz). Les mids dominent la perception.
- À **haut SPL (~90–100 phons)**, la courbe s'aplatit — l'oreille entend tout le spectre plus uniformément.
- À **SPL de club extrême (>100 dB)**, il y a une légère amplification des graves et des très aigus par rapport aux mids.

## La conséquence pour le calibrage DJ

Un mix qui sonne "équilibré" à 75 dB sur les moniteurs du booth sonnera typiquement :
- **Chargé en basses** à 103 dB sur le dancefloor (amplification des graves depuis l'aplatissement de la courbe).
- **Agressif dans les aigus** si le mix a été calibré sous le seuil d'aplatissement de l'oreille.

C'est pour ça que les DJs expérimentés utilisent des **moniteurs de booth à un SPL calibré** — généralement maintenu à un niveau de référence fixe — et ne bougent pas constamment le volume du booth comme proxy de ce que la salle entend.

## Gain de pré-ampli vs calibrage système

Au Berghain et dans d'autres salles bien calibrées, toute la structure de gain de la sortie table DJ jusqu'à l'entrée ampli est pré-réglée. Les DJs reçoivent une interface normalisée. Ça résout le problème Fletcher-Munson pour l'opérateur table : toutes les décisions se prennent à un SPL connu, référencé au même point sur la courbe d'égale loudness.
"""

[[fr.pages]]
title   = "Routing split-cue : pré-EQ ou post-EQ ?"
content = """
## La position du bus CUE dépend de la table

Sur la plupart des tables DJ, le bus CUE tape le signal **après l'EQ**, donc ton PFL reflète ton travail EQ.
C'est utile : tu entends ce que la salle va recevoir.

Sur les consoles broadcast, le PFL est **toujours pré-fader et pré-EQ** — la définition architecturale.

Sur l'Allen & Heath Xone:96, le routing du cue est configurable : un jumper sur le PCB permet de taper le bus CUE soit pré-EQ soit post-EQ par canal. C'est une décision au moment de l'installation, pas un contrôle en temps réel.

## Pourquoi ça compte dans le booth

Si le CUE de ta table est pré-EQ, tout mid-cut que tu fais dans le cue n'apparaîtra PAS dans ton monitoring casque — tu entendras la version sans coupe. Ça peut mener à sous-couper dans la salle parce que ta référence ne reflète pas l'intervention.

Si le CUE de ta table est post-EQ (courant sur la plupart des DJM modernes), tu entends exactement ce que tu envoies.

## Gain staging de l'ampli casque

L'ampli casque à l'intérieur d'une table DJ est une chaîne de signal séparée. Sur les tables haut de gamme, il a sa propre structure de gain avec un trim casque séparé. Si l'ampli casque est surpiloté par un trim trop hot, le cue clippe avant que la sortie master ne clippe — une raison de plus de régler le trim d'abord.

Toujours vérifier : qu'est-ce qui clippe ? Le VU master ou la sortie casque ? Ce sont des étages différents.
"""

