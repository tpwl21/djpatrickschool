[[en.pages]]
title   = "Biquad IIR filter topology: what's inside the EQ knob"
content = """
## The filter under the control

Every EQ band on a DJ mixer is implemented as a **2nd-order IIR (Infinite Impulse Response) filter** — specifically, a **biquad** (named for the bi-quadratic transfer function). The canonical reference is the *Audio EQ Cookbook* by Robert Bristow-Johnson, now hosted at W3C.

The biquad transfer function in the z-domain:

```
H(z) = (b0 + b1*z^-1 + b2*z^-2) / (1 + a1*z^-1 + a2*z^-2)
```

Five coefficients (b0, b1, b2, a1, a2) define the filter entirely. From these you can express any second-order filter type: low shelf, high shelf, peaking bell, bandpass, notch, all-pass.

## How DJ EQ bands are implemented

- **Low band**: 2nd-order **low shelving** filter. Boost/cut below the shelf frequency (chosen by the manufacturer). Slope: 12 dB/octave at the knee.
- **High band**: 2nd-order **high shelving** filter. Same principle, mirrored above its own shelf frequency.
- **Mid band**: 2nd-order **peaking (bell) filter**. Symmetric boost/cut centered at the mid frequency. The **Q factor** (quality factor) controls bandwidth: high Q = narrow notch, low Q = wide bell. The values differ from one mixer to the next and manufacturers rarely publish them.

## Web Audio context

This project implements exactly this: three `BiquadFilterNode` instances per deck — `lowshelf`, `peaking`, `highshelf` — connected in series. See `src/audio/MagicAudioContext.js`. The coefficients are computed by the browser's audio engine from the `frequency`, `gain`, and `Q` parameters you set.
"""

[[en.pages]]
title   = "EQ vs isolator: what \"full kill\" really means"
content = """
## Classic EQ: a kill that may not be total

On a classic EQ, turning a band all the way down does not necessarily give -∞ dB. Older Pioneer models such as the **DJM-800** stop at about **-26 dB** at the end of the knob: a big cut (a factor of 20 in amplitude), but a loud kick still leaves a faint trace in the room.

Recent Pioneer DJ mixers (**DJM-900NXS2, DJM-A9, DJM-V10**) cut to **-∞** and have an **EQ / Isolator** selector: the same knobs, two behaviors. Check the manual of the mixer in front of you rather than assuming.

## Isolator topology: a band at zero routes nothing

An **isolator** splits the signal into bands with **Linkwitz-Riley (L-R) crossover filters** — cascaded Butterworth pairs designed to sum flat at the crossover frequency. Each band then gets its own level control and the bands are recombined.

Because the bands are separated *before* the level control, a band at zero means **nothing is routed**: a true -∞ dB with a clean crossover region.

The side effect: an isolator is not a gentle tone control. It is a cutting tool. That is why it is loved for kills and swaps, and why a boost is rarely the point.

## SVF (State Variable Filter) variant

The **state variable filter** outputs lowpass, highpass, bandpass and notch responses from one structure. It is stable under fast parameter changes, which makes it a common choice for filters that are swept by hand. It is a staple of synthesis.
"""

[[en.pages]]
title   = "Why one bass at a time: mud and phase"
content = """
## Two basses are not twice the bass

When two basses play together, three things happen:

1. **Beating and mud**: notes that are close but not identical in pitch interfere and make the low end swell and wobble.
2. **Phase cancellation**: low frequencies have long periods. A **50 Hz** tone has a period of **20 ms**, so two kicks offset by only **10 ms** are in opposite phase and cancel that 50 Hz component. At **100 Hz** (period 10 ms) a **5 ms** offset does the same. A beatmatch that is a few milliseconds off is normal, and it is enough to thin out the lows.
3. **Summing**: two identical signals in phase add **+6 dB**. Two different ones add unpredictably, and the result lands on your master level.

## So is the bass swap a hardware protection?

No. Club PAs have **processors with limiters** that protect the drivers, so a bass overlap is not what stands between the system and a broken speaker. The bass swap exists for **the sound**: no mud, no cancellation, one clear kick at a time.

## The workflow

Kill the incoming Low, let the track blend in, then swap on the **first beat of a phrase** (32 beats): A's Low down, B's Low up, in one gesture. This is what level 2 of this workshop validates.
"""

[[en.pages]]
title   = "Fletcher-Munson and the DJ's calibration problem"
content = """
## Equal-loudness contours

Equal-loudness contours map how sensitive the ear is across frequencies at a given perceived loudness. Fletcher and Munson published them in 1933, Robinson and Dadson redid the measurement in 1956, and **ISO 226:2003** is the standard that replaced the Robinson-Dadson curves.

Key observations:
- At **low levels**, the ear is much less sensitive to lows and very highs. Mids dominate perception.
- At **high levels**, the contours flatten: the spectrum is perceived more evenly.

## The DJ calibration consequence

A mix that sounds balanced at a low monitor level in the bedroom will usually feel **heavier in the bass** once it is played loud on a club system, because the low end is now perceived at a larger fraction of its true level.

This is why experienced DJs keep booth monitors at a **fixed, known level** instead of riding the booth volume to follow what the room does. The EQ decisions then happen at the same point on the equal-loudness curve every time.

## What to do about it

Fix your reference. Check your EQ against the room at the real playing level, and ask the sound engineer how the booth is set up before the first track. The contours tell you why the same mix feels different at 70 dB and at 100 dB; they do not give you a magic number to set.
"""

[[en.pages]]
title   = "PFL routing: pre-fader, and usually post-EQ"
content = """
## Where the cue taps the signal

**PFL** means **Pre-Fader Listen**: the cue is taken **before** the channel fader, so you can listen to a deck at any fader position without the room hearing it.

Whether it is taken before or after the EQ depends on the design. On most DJ mixers the PFL is **post-EQ**: your EQ work is reflected in the headphones, so you hear what the room will get. Read the manual of your mixer to be sure.

## Why this matters in the booth

If a mixer's cue were taken before the EQ, a mid-cut you make would not appear in the headphones and you could under-cut in the room, because your reference would not reflect your move. With a post-EQ cue you hear exactly what you are about to send.

## Headphone amplifier gain staging

The headphone amplifier is a separate signal path with its own gain. If it is overdriven by a too-hot trim or a too-high headphone level, the cue can distort while the main output is fine. Always ask yourself: what is clipping, the channel, the master meter, or the headphone output? They are different stages.
"""

