[[en.pages]]
title   = "Biquad IIR filter topology: what's inside the EQ knob"
content = """
## The filter under the control

Every EQ band on a DJ mixer is implemented as a **2nd-order IIR (Infinite Impulse Response) filter** — specifically, a **biquad** (named for the bi-quadratic transfer function). The canonical reference is the *Audio EQ Cookbook* by Robert Bristow-Johnson, now hosted at W3C.

The biquad transfer function in the z-domain:

```
H(z) = (b0 + b1*z^-1 + b2*z^-2) / (1 + a1*z^-1 + a2*z^-2)
```

Five coefficients (b0, b1, b2, a1, a2) define the filter entirely. From these you can express any second-order filter type: low shelf, high shelf, peaking bell, bandpass, notch, all-pass.

## How DJ EQ bands are implemented

- **Low band**: 2nd-order **low shelving** filter. Boost/cut below the shelf frequency (typically ~300 Hz on a DJM). Slope: 12 dB/octave at the knee.
- **High band**: 2nd-order **high shelving** filter. Same principle, mirrored above ~4 kHz.
- **Mid band**: 2nd-order **peaking (bell) filter**. Symmetric boost/cut centered at the mid frequency. The **Q factor** (quality factor) controls bandwidth: high Q = narrow notch, low Q = wide bell. On a DJM the mid Q is ~1.5–2; on a Xone the mid is narrower (Q ~2.5–3).

## Web Audio context

This project implements exactly this: three `BiquadFilterNode` instances per deck — `lowshelf`, `peaking`, `highshelf` — connected in series. See `src/audio/MagicAudioContext.js`. The coefficients are computed by the browser's audio engine from the `frequency`, `gain`, and `Q` parameters you set.
"""

[[en.pages]]
title   = "Isolator topology: why a Rane kill sounds different from a Pioneer kill"
content = """
## Traditional EQ: the attenuation problem

On a standard 3-band DJ EQ (Pioneer DJM), turning a band to full cut doesn't actually produce -∞ dB. It produces approximately **-26 dB** (the mechanical detent at the end of travel). That's a 20:1 attenuation — substantial, but a beat with a very loud kick will still leave residual sub energy audible in the room.

To get a *true kill* on a Pioneer, you need to also pull the channel fader momentarily, or the track's gain is so low that the residual is below audibility.

## Isolator topology: true -∞ dB kills

An **isolator** splits the signal into frequency bands using **Linkwitz-Riley (L-R) crossover filters** — a cascaded pair of Butterworth filters designed to sum to flat at the crossover frequency with no phase discontinuity. Each band is then independently amplified and recombined.

The key property: because the bands are truly separated before they reach the amplitude control, turning a band to zero means **routing nothing** — genuine -∞ dB with a clean crossover region. No bleed from adjacent bands.

Rane (TTM57, MP2015), early A&H Xone models, and specialist mixers (Vestax) used isolator topology. The Urei/Bozak rotary mixers at Berghain use a variation of this principle.

## SVF (State Variable Filter) variant

High-end mixers also use **SVF topology** — the state variable filter simultaneously outputs lowpass, highpass, bandpass, and notch responses from a single filter structure. It has superior frequency stability and can be swept smoothly without instability. Used in modular synthesis and some boutique mixer designs.
"""

[[en.pages]]
title   = "PA physics: why simultaneous kicks damage systems"
content = """
## The Xmax problem

A subwoofer driver has a physical cone excursion limit called **Xmax** — the distance the voice coil can travel linearly before the magnetic gap force becomes nonlinear (the coil starts to leave the gap).

Typical 18" sub drivers used in club PAs have Xmax values of **10–25mm** depending on design. The rated SPL assumes the cone stays within this range.

## What two simultaneous kicks do

A bass transient draws a sharp current spike that commands the voice coil to move rapidly to its excursion limit and return. When two kick transients arrive simultaneously (two tracks, both basses active, within the same beat):

1. The combined current demand can be **2× the rated peak current**.
2. The voice coil is driven past Xmax — into the **non-linear region**.
3. The result: **mechanical distortion** (harmonic and intermodulation) from the driver's non-linear force-displacement curve.
4. On protection-equipped amplifiers: the protection circuit triggers, the system briefly clips or cuts — audible as a "crunch" or momentary loss.

## Why the bass swap is a physical requirement

The bass swap is not a stylistic tradition. It's a **physical constraint of the transducer**. No amount of well-tuned DSP can un-do voice coil excursion beyond Xmax. The DJ is the last line of control before the mechanical limits of the PA.
"""

[[en.pages]]
title   = "Fletcher-Munson and the DJ's calibration problem"
content = """
## Equal-loudness contours

The **Fletcher-Munson curves** (1933, refined by ISO 226:2003 as the Robinson-Dadson curves) map human hearing sensitivity across the frequency spectrum at equal perceived loudness.

Key observations:
- At **low SPL (~40 phons)**, the ear is significantly less sensitive to lows (<200 Hz) and very highs (>10 kHz). Mids dominate perception.
- At **high SPL (~90–100 phons)**, the curve flattens — the ear hears the full spectrum more uniformly.
- At **extreme club SPL (>100 dB)**, there's slight enhancement of lows and very highs compared to mids.

## The DJ calibration consequence

A mix that sounds "balanced" at 75 dB monitor volume in the booth will typically sound:
- **Bass-heavy** at 103 dB on the main floor (bass amplification from the curve flattening).
- **Harsh on the highs** if the mix was calibrated below the ears-flattening threshold.

This is why experienced DJs use **booth monitors at a calibrated SPL** — typically kept at a fixed reference level — and don't constantly ride booth volume as a proxy for what the room hears.

## Pre-amp gain vs system gain calibration

At Berghain and other well-calibrated venues, the entire gain structure from DJ mixer output to amplifier input is pre-set. DJs receive a normalized interface. This solves the Fletcher-Munson problem for the mixer operator: all decisions are made at a known SPL, referenced to the same point on the equal-loudness curve.
"""

[[en.pages]]
title   = "Split-cue routing: pre-EQ or post-EQ?"
content = """
## The CUE bus location is mixer-specific

On most DJ mixers, the CUE bus taps the signal **after the EQ**, so your PFL reflects your EQ work.
This is useful: you hear what the room will get.

On broadcast desks, PFL is **always pre-fader and pre-EQ** — the architectural definition.

On the Allen & Heath Xone:96, the cue routing is configurable: a jumper setting on the PCB allows tapping the CUE bus either pre-EQ or post-EQ per channel. This is an installation-time decision, not a runtime control.

## Why this matters in the booth

If your mixer's CUE is pre-EQ, any mid-cut you make in the cue will NOT appear in your headphone monitoring — you'll hear the uncut version. This can lead to under-cutting in the room because your reference doesn't reflect the intervention.

If your mixer's CUE is post-EQ (common on most modern DJMs), you hear exactly what you're sending.

## Headphone amplifier gain staging

The headphone amplifier inside a DJ mixer is a separate signal path. On high-end mixers it has its own gain structure with a separate headphone trim. If the headphone amp is overdriven by a too-hot trim, the cue clips before the main out clips — another reason to trim first.

Always verify: what's clipping? The master VU or the headphone output? They're different stages.
"""

