[[fr.pages]]
title   = "Les traînes : où va la queue"
content = """
La **traîne** (tail) d'une reverb, c'est le signal de reverb qui continue de sonner après que l'entrée s'arrête. Quand tu baisses un fader ou coupes l'effet, ce qui arrive à la traîne dépend du routing :

- **Send / return, post-fader** : plus de musique n'entre dans la reverb une fois le fader baissé, mais la traîne déjà présente sonne toute seule jusqu'au bout.
- **Send / return, pre-fader** : la reverb continue d'écouter la track même fader à zéro, donc tu n'entends que le signal wet jusqu'à ce que tu coupes l'effet.
- **Effet directement sur le canal** : sur certaines tables, la traîne est coupée quand tu désactives l'effet.

Plutôt que de croire une notice, **teste** : boucle, reverb on, fader baissé, écoute. Le résultat change d'une table à l'autre.

**Chiffres à retenir :** à 128 BPM, un temps dure 0,469 s et une mesure 1,875 s. Un decay de 3 à 4 s fait environ deux mesures : assez pour noyer un break, trop long si le prochain kick tombe une mesure plus tard. Règle le decay pour que la traîne soit finie (ou inaudible sous la track suivante) au temps fort où tu veux atterrir.
"""

[[fr.pages]]
title   = "Beat FX vs Color FX, et le quantize"
content = """
Beaucoup de tables séparent les effets en deux familles :

| | Beat FX | Color FX |
|---|---|---|
| Contrôle | choix de l'effet, du temps (fraction de beat), du niveau | un potard qui fait l'effet |
| Tempo | synchro au BPM (auto ou tap) | pas de tempo, tu joues à l'oreille |
| Routing | assigné à un canal ou au master, souvent en send | sur le canal |
| Usage | delay, reverb, rolls, à longueur précise | filtre, bruit, crush, gestes rapides |

Sur la reverb, un potard Color FX « space » ou « dub » change la taille et le wet en même temps : rapide, sûr, moins précis. Une reverb en Beat FX te laisse régler la quantité et la fin.

Le **quantize** (quand ton matériel en a un) cale l'instant où tu appuies sur la grille. Un stab ou un roll tombe sur le temps même si ton doigt est en avance. Mais il fait confiance à ta grille : si la beatgrid est décalée de quelques millisecondes, l'effet quantizé l'est aussi. Vérifie la grille d'abord.
"""

[[fr.pages]]
title   = "Reverb externe, et quand s'en passer"
content = """
**Send / return vers une unité externe :** beaucoup de tables ont une sortie send et une entrée return. Tu sors une copie du signal de la table, tu l'envoies dans une unité de reverb, et tu la ramènes sur un canal libre ou un return.

1. Règle l'unité externe à **100% wet**. Si elle mixe aussi du dry, tu entends la track deux fois et tu as du phasing.
2. Contrôle la quantité avec le niveau du retour sur la table, pas sur l'unité.
3. **Passe-haut sur le retour** (environ 200 à 300 Hz) pour que la reverb n'ajoute pas de boue dans le grave.
4. Si l'unité a un tap tempo, cale-la sur le BPM : à 128 BPM un temps fait 60000 / 128 = 469 ms.

**Quand ne pas utiliser de reverb :**
- sur un grave dense (kick et basse) : la traîne bave sur le groove ;
- quand le public est calé dans un groove, ne le noie pas ;
- quand deux tracks sont déjà en train de se mélanger : de la reverb par-dessus fait de la boue ;
- quand tu ne peux pas dire en une phrase ce qu'elle apporte au public.

Moins, c'est mieux. Une reverb courte et prévue à un moment précis vaut mieux qu'une nappe constante.
"""

