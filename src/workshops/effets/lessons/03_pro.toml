description = "Une reverb est facile à activer et difficile à placer. Cette leçon parle de la pratique : où va la traîne quand tu baisses un fader, quelle section d'effets utiliser, comment envoyer vers une unité externe, et quand ne pas l'utiliser."
recap = [
  "Une traîne de reverb doit finir avant le prochain temps fort qui compte : à 128 BPM, une mesure dure 1,875 s.",
  "Les Beat FX sont synchro au tempo et routés en send ou sur le master ; les Color FX sont des effets à un potard sur le canal.",
  "Le quantize cale ton déclenchement sur la grille, mais seulement aussi bien que ta grille est juste.",
  "Reverb externe : send out, unité à 100% wet, retour sur un canal, passe-haut sur le retour.",
  "Pas de reverb sur un grave dense, ni quand le public danse sur un groove que tu ne veux pas baver.",
