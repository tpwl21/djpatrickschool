[en]
title      = "Reverb: Tail vs Send"
short_desc = "Trails, Beat FX vs Color FX, quantize, external reverb, and when to leave it off."
description = "A reverb is easy to turn on and hard to place. This lesson is about the practical side: where the tail goes when you pull a fader, which effect section to use, how to send to an external unit, and when not to use it."
recap = [
  "A reverb tail has to end before the next downbeat you care about: at 128 BPM one bar lasts 1.875 s.",
  "Beat FX are tempo-synced and routed on a send or the master; Color FX are one-knob effects on the channel.",
  "Quantize snaps your trigger to the beatgrid, but only as well as your grid is right.",
  "External reverb: send out, unit at 100% wet, return into a channel, high-pass the return.",
  "No reverb on a dense low end, and none when the crowd is dancing to a groove you don't want to smear.",
]

[[en.pages]]
title   = "Trails: where the tail goes"
content = """
A reverb **tail** is the reverb signal that keeps ringing after the input stops. When you pull a fader or cut the effect, what happens to the tail depends on the routing:

- **Send / return, post-fader**: no new music enters the reverb once the fader is down, but the tail already inside rings out on its own.
- **Send / return, pre-fader**: the reverb keeps listening to the track even with the fader at zero, so you hear only the wet signal until you turn the effect off.
- **Effect directly on the channel**: on some mixers the tail is cut when you turn the effect off.

Rather than trust a manual, **test it**: loop, reverb on, fader down, listen. The result differs from one mixer to the next.

**Numbers to keep:** at 128 BPM one beat is 0.469 s and one bar 1.875 s. A decay of 3 to 4 s is about two bars: enough to drown a break, too long if the next kick lands one bar later. Set the decay so the tail is gone (or inaudible under the next track) by the downbeat you want to land.
"""

[[en.pages]]
title   = "Beat FX vs Color FX, and quantize"
content = """
Many mixers split effects into two families:

| | Beat FX | Color FX |
|---|---|---|
| Control | choose effect, time (beat fraction), level | one knob that does the effect |
| Tempo | synced to the BPM (auto or tap) | no tempo, you play it by ear |
| Routing | assigned to a channel or the master, often as a send | on the channel |
| Use | delay, reverb, rolls, with a precise length | filter, noise, crush, fast gestures |

On reverb, a Color FX "space" or "dub" knob changes size and wet at once: quick, safe, less precise. A Beat FX reverb lets you set the amount and when it ends.

**Quantize** (when your gear has it) snaps the moment you press to the beatgrid. A stab or a roll lands on the beat even if your finger is early. But it trusts your grid: if the beatgrid is a few milliseconds off, the quantized effect is off too. Check the grid first.
"""

[[en.pages]]
title   = "External reverb, and when to leave it off"
content = """
**Send / return to an external unit:** many mixers have a send out and a return in. You take a copy of the signal out of the mixer, run it into a reverb unit, and bring it back on a free channel or return.

1. Set the external unit to **100% wet**. If it mixes dry too, you hear the track twice and get phasing.
2. Control the amount with the return level on the mixer, not on the unit.
3. **High-pass the return** (roughly 200 to 300 Hz) so the reverb doesn't add mud to the low end.
4. If the unit has tap tempo, set it to the BPM: at 128 BPM a beat is 60000 / 128 = 469 ms.

**When not to use reverb:**
- on a dense low end (kick and bass): the tail smears the groove;
- when the crowd is locked into a groove, don't wash it;
- when two tracks are already blending: reverb on top turns the mix to mud;
- when you can't say in one sentence what it does for the crowd.

Less is more. A short, planned reverb at one moment beats a constant wash.
"""

