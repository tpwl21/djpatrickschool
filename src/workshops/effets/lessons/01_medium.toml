[fr]
title      = "Le Filtre : Cutoff, Résonance & Gestes de Genre"
short_desc = "Pente, Q, self-oscillation, et la béquille du filtre."
description = "Tu sais ce que fait un filtre. Apprends maintenant les paramètres qui sculptent son son — et les signatures de genre qui font qu'un même sweep sonne techno, pas house."
recap = [
  "La pente (12 ou 24 dB/oct) contrôle la dureté du 'mur' de coupure : 12 dB = musical, 24 dB = techno agressif.",
  "La résonance (Q) booste une bande étroite au cutoff — un peu c'est beau, trop et le filtre se met à auto-oscilller.",
  "Self-oscillation : le filtre se met à sonner comme une sinusoïde sans source — à éviter en live sauf si intentionnel.",
  "Le passe-haut sur un break nettoie les bas-mids boueux avant de ramener le deck B.",
  "Le filtre devient une béquille quand chaque transition l'utilise — l'art, c'est la retenue.",
]

[[fr.pages]]
title   = "La pente : 12 vs 24 dB par octave"
content = """
Un filtre n'a pas une coupure parfaitement verticale — c'est une pente. Sa raideur se mesure en **dB par octave**.

- **12 dB/oct** : descente douce. Le son s'atténue graduellement au-delà de la coupure. C'est la valeur par défaut sur la plupart des DJM — ça sonne musical et convient à la house, la disco, la soul.
- **24 dB/oct** : mur abrupt. Les fréquences juste après la coupure sont pratiquement éteintes. Ça sonne agressif, chirurgical — la signature de la techno et de l'industriel.

Tu entends la différence clairement sur un hi-hat : 12 dB/oct laisse un scintillement fantôme au-delà du cutoff ; 24 dB/oct le tue net.

Le filtre du Pioneer DJM-900 est à 12 dB/oct. L'Allen & Heath Xone:92 aussi par défaut, avec un mode plus raide disponible.
"""

[[fr.pages]]
title   = "La résonance (Q) : beauté et danger"
content = """
Tout filtre DJ a un réglage de **résonance** (aussi appelé Q). C'est un boost étroit juste à la fréquence de coupure.

**Q faible (0,2–0,5) :** le filtre se fond en douceur, presque pas de coloration au point de coupure. Subtil.

**Q moyen (0,5–2) :** un pic léger au cutoff. Le sweep sonne 'wah', vocal, expressif. C'est le sweet spot pour le DJ.

**Q élevé (2–5+) :** le pic devient agressif et nasal. Très utile pour un effet dramatique sur un moment précis.

**Au-delà du seuil de self-oscillation :** le filtre commence à générer lui-même une onde sinusoïdale **à la fréquence de coupure**, sans signal d'entrée. La boucle de feedback à l'intérieur du filtre gagne de l'énergie au lieu d'en perdre. Sur du matériel analogique ça sonne sauvage et musical ; sur des émulations numériques ça peut clipper brutalement.

Règle pratique : sur un DJM, laisse la résonance en dessous de 14h. Si tu entends un son qui sonne comme un sifflet, recule.
"""
image = "lesson-images/filter_resonance_diagram.png"
image_caption = "Q faible vs Q élevé : le pic au cutoff grandit jusqu'à l'auto-oscillation."

[[fr.pages]]
title   = "Le sweep passe-haut sur un break"
content = """
Un des gestes de filtre les plus utiles se passe pendant un **break** (la section sans drops, juste la structure) :

1. La track A joue, tu vas mixer la track B.
2. Engage un **filtre passe-haut sur la track A** et monte lentement le cutoff — tu nettoies les bas-mids boueux (100–400 Hz) qui clasheraient avec les basses de B.
3. Amène B pendant que le passe-haut de A est haut. A n'a plus de basses, donc B a le grave pour lui tout seul.
4. Avant de rouvrir le filtre de A, coupe les **basses de A** à l'EQ (ou laisse le passe-haut où il est). Sinon les basses de A reviennent en même temps que celles de B : deux basses qui se battent. Ensuite relâche le filtre : A s'ouvre avec ses médiums et ses aigus pendant que B porte le grave.

C'est la version pro de la technique de coupe EQ : au lieu de rouler le knob de graves, tu utilises le sweep comme un geste narratif.

La clé : commence le passe-haut tôt (4–8 mesures avant le mélange), sweep lentement, ne pousse pas jusqu'à ce que A perde toute sa matière.
"""

[[fr.pages]]
title   = "Le problème de la béquille"
content = """
On entend souvent dire que le filtre est la béquille des DJs qui ne savent pas mixer. C'est injuste : le filtre est un outil légitime et puissant. Le problème n'est pas l'outil ; c'est la dépendance.

Les DJs intermédiaires tombent dans un schéma : chaque transition commence par un sweep de filtre. C'est safe, ça remplit le temps, ça sonne dramatique. Mais quand **chaque** transition est un filtre, le public s'habitue. Le geste arrête de fonctionner.

Signatures de genre à intérioriser :
- **House** : sweep passe-bas lent sur 8–16 mesures, s'ouvre sur le 1 du drop.
- **Techno** : coupe passe-haut soudaine qui retire le kick et la basse (un passe-bas, lui, les garde), puis ouverture violente. Un trou court et dramatique dans le grave.
- **Afro house / melodic tech** : passe-bas prononcé sur une acapella ou un lead, avec la résonance poussée pour un effet formantique vocal.

L'art c'est de choisir **quand** filtrer, pas juste **comment**.
"""

