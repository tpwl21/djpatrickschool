[en]
title      = "The Filter: Cutoff, Resonance & Genre Moves"
short_desc = "Slope, Q, self-oscillation, and the filter crutch."
description = "You know what a filter does. Now learn the parameters that shape how it sounds — and the genre signatures that make the same sweep feel like techno, not house."
recap = [
  "The slope (12 or 24 dB/oct) controls how hard the cutoff 'wall' is: 12 dB = musical, 24 dB = aggressive techno.",
  "Resonance (Q) boosts a narrow band at the cutoff — a little is beautiful, too much and the filter self-oscillates.",
  "Self-oscillation: the filter starts ringing as a sine wave with no input — avoid it live unless intentional.",
  "Highpass on a break cleans muddy low-mids before you bring in deck B.",
  "The filter becomes a crutch when every transition uses it — the art is in restraint.",
]

[[en.pages]]
title   = "The slope: 12 vs 24 dB per octave"
content = """
A filter doesn't have a perfectly hard cutoff — it's a slope. The steepness is measured in **dB per octave**.

- **12 dB/oct**: gentle roll-off. The sound fades gradually past the cutoff. This is the default on most DJM mixers — it sounds musical and works in house, disco, soul.
- **24 dB/oct**: steep wall. Frequencies just past the cutoff are nearly gone. This sounds aggressive, surgical, and is the signature sound of techno and industrial.

You can hear the difference clearly on a hi-hat: 12 dB/oct leaves a ghostly shimmer past the cutoff; 24 dB/oct kills it dead.

The Pioneer DJM-900 filter is 12 dB/oct. The Allen & Heath Xone:92 is 12 dB/oct by default, but with a steeper mode available. Most hardware filters sit in this range.
"""

[[en.pages]]
title   = "Resonance (Q): beauty and danger"
content = """
Every DJ filter has a **resonance** control (also called Q). This is a narrow frequency boost right at the cutoff frequency.

**Low Q (0.2–0.5):** the filter blends smoothly, almost no coloration at the cutoff point. Subtle.

**Medium Q (0.5–2):** a gentle peak at the cutoff. The sweep sounds 'wah-like', vocal, expressive. This is the sweet spot for DJ use.

**High Q (2–5+):** the peak becomes aggressive and nasal. Very useful for dramatic effect on a single moment.

**Beyond Q = self-oscillation threshold:** the filter starts generating a sine wave **on its own**, at the cutoff frequency, with no input signal. The feedback loop inside the filter gains energy instead of losing it. On analog hardware this sounds wild and musical; on digital emulations it can clip badly.

Practical rule: on a DJM, leave resonance below 2 o'clock. If you hear a ringing tone, back it off.
"""
image = "lesson-images/filter_resonance_diagram.png"
image_caption = "Low Q vs high Q: the peak at cutoff grows until the filter self-oscillates."

[[en.pages]]
title   = "The highpass sweep on a break"
content = """
One of the most useful filter moves happens during a **break** (the drums-only or stripped-down section between builds):

1. Track A is playing, you're about to mix in Track B.
2. Engage a **highpass filter on Track A** and slowly raise the cutoff — you're cleaning out the muddy low-mids (100–400 Hz) that would clash with Track B's bass.
3. Bring in Track B while the highpass on A is high. A has no bass left, so B's bass takes the floor alone.
4. Before you reopen the filter on A, cut A's **low EQ** (or keep the highpass where it is). Otherwise A's bass comes back at the same moment as B's and you get two basslines fighting. Then release the filter: A opens up with its mids and highs while B carries the low end.

This is the pro version of the EQ cut technique: instead of riding the low-EQ knob, you use the filter sweep as a narrative move.

The key: start the highpass early (4–8 bars before the blend), sweep slowly, and don't push to the point where A loses all body.
"""

[[en.pages]]
title   = "The crutch problem"
content = """
A common saying among DJs: the filter is a crutch for people who can't mix. It's unfair, because the filter is a legitimate, powerful tool. The issue isn't the tool; it's the dependency.

Intermediate DJs fall into a pattern: every transition starts with a filter sweep. It's safe, it fills time, it sounds dramatic. But when **every** transition is a filter, the crowd habituates. The move stops working.

Genre signatures to internalize:
- **House**: slow lowpass sweep over 8–16 bars, opens on the 1 of the drop.
- **Techno**: sudden highpass cut that strips out the kick and the bass (a lowpass would keep them), then a violent open. A short, dramatic gap in the low end.
- **Afro house / melodic tech**: heavy lowpass on acapella or lead, with resonance pumped up for a vocal formant effect.

The craft is picking **when** to filter, not just **how**.
"""

