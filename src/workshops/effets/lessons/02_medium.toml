[en]
title      = "Delay: Subdivisions, Genre DNA & the Echo-Out"
short_desc = "1/4 dub, 1/8 dotted tech house, 1/16 triplet trance — and the Larry Heard move."
description = "You know the three controls. Now learn which subdivision to reach for and why — because the rhythm of the echo carries genre memory before you've touched feedback."
recap = [
  "1/4 note straight = dub / reggae — wide, spacious, King Tubby territory.",
  "1/8 dotted = syncopated bounce — the signature of tech house and 90s post-rock production.",
  "1/16 triplet = blurring rapid fire — trance builds, big-room drops.",
  "Echo-out: delay + pull fader = the track vanishes in a tail, giving you room to start track B.",
  "Carl Cox on delays: reach for the subdivision first, feedback second — rhythm before length.",
]

[[en.pages]]
title   = "Subdivision as genre signature"
content = """
The **time** setting of a delay isn't just rhythm — it carries genre DNA. Before you touch feedback or mix, the subdivision you choose already tells the crowd which world you're in.

**1/4 note (straight quarter beat)**
Wide, spacious, unhurried. Each repeat lands one quarter note after the last. This is the classic **dub/reggae** echo — the sound of King Tubby's studio in Kingston, Jamaica, in the 1970s. Think: "I'm spacious and I have all the time in the world."

**1/8 note dotted (dotted eighth)**
The dotted eighth is 3/16 of a beat — it creates a syncopated bounce that feels like it's pulling forward. This is the subdivision that defines **tech house** and appears constantly in productions from Jamie Jones to Disclosure. The echo always seems to land slightly "early", creating urgency.

**1/16 note triplet**
Very fast, blurring into texture. Three echos per beat. This is the **trance and big-room build** subdivision — it stacks until the track feels like it's about to explode. Very difficult to use cleanly outside that context.
"""
image = "lesson-images/delay_subdivisions_grid.png"
image_caption = "1/4 straight, 1/8 dotted, and 1/16 triplet on a 4/4 grid — each creates a different feel."

[[en.pages]]
title   = "The echo-out: structural use of delay"
content = """
The **echo-out** is not a party trick — it's a structural technique. Here's the precise method:

**Setup** (do this during the last phrase of track A):
1. Time = 1/2 beat (one echo per half-beat — present but not fast).
2. Feedback = 0.60–0.70 (4–6 repeats before it disappears).
3. Mix = 40–50% (echo clearly audible but not louder than dry signal).

**Execution:**
4. On beat 1 of the last bar, smoothly pull track A's volume fader to zero over 4 beats.
5. The music disappears but 6–8 seconds of echo tail remains.

**Why this works:**
The echo is a fingerprint of what was there — the crowd hears the track "leaving" rather than cutting. It creates a sense of space and breath. You can start track B during the tail (it sits behind it), or let silence happen briefly, which is even more powerful.

**Larry Heard** (aka Mr. Fingers) used this technique in early deep house to create emotional pauses. When you hear "Can You Feel It" transitioning this way, you understand why it became a standard.
"""

[[en.pages]]
title   = "Feedback and mix: dialing the right tail"
content = """
Once you've chosen the subdivision, feedback and mix define the character of the tail.

**Feedback guidance:**
- **0.0–0.3**: one or two clean repeats, then silence. Good for a punctuation echo on a vocal stab or drum hit.
- **0.4–0.6**: 4–6 repeats, audible tail of ~3–5 seconds. The workhorse for transitions.
- **0.7–0.85**: long tail, 8+ repeats. Useful for the echo-out. Keep mix below 40% or it washes the dry signal.
- **0.9+**: danger zone on most digital gear — the tail may not fully decay. DJMs soft-clip at ~0.95, but the result can feel endless and muddy.

**Mix guidance:**
- The dry signal should almost always dominate (**mix below 50%**).
- Exception: echo-out where you're intentionally pulling the dry signal to zero.
- Exception: very sparse moments (a single piano note, an acapella) where a high-mix delay creates reverb-like space.

One pro habit: set feedback to 0 before turning delay on, then raise it gradually so you hear the first echo before committing to a tail length.
"""

[[en.pages]]
title   = "Pre-fader vs post-fader send"
content = """
On a Pioneer DJM, delay runs as a **post-fader send**: the delay receives signal *after* the channel volume fader. This means:

- Pull the fader to zero → the delay input goes to zero → the tail fades naturally as the existing echoes decay.
- The tail follows the fader, which is the default behavior for the echo-out.

On some mixers (and external FX units), you can switch to **pre-fader**: the delay gets signal *before* the fader. Then:
- Pull the fader → the dry track disappears but the delay keeps receiving new signal and generating echos.
- This creates a "ghost mix" effect where the echo and the dry are completely independent.

Knowing which mode you're in matters during the echo-out: post-fader gives you a clean natural decay; pre-fader can create runaway feedback if you forget to turn off delay after pulling the fader.
"""

