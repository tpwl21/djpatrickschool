[[fr.pages]]
title   = "La subdivision comme signature de genre"
content = """
Le réglage **time** d'un delay n'est pas que du rythme — il porte l'ADN du genre. Avant de toucher feedback ou mix, la subdivision que tu choisis dit déjà au public dans quel univers tu es.

**1/4 noire (noire droite)**
Large, aéré, sans précipitation. Chaque répétition tombe une noire après la précédente. C'est l'écho **dub/reggae** classique — le son du studio de King Tubby à Kingston, Jamaïque, dans les années 1970. Traduction : "Je suis spacieux et j'ai tout mon temps."

**1/8 pointée (croche pointée)**
La croche pointée vaut 3/16 d'un beat — elle crée un rebond syncopé qui tire vers l'avant. C'est la subdivision qui définit la **tech house** et apparaît constamment dans les productions de Jamie Jones à Disclosure. L'écho semble toujours tomber légèrement "en avance", créant de l'urgence.

**1/16 triolet**
Très rapide, se fond en texture. Trois échos par beat. C'est la subdivision des **builds de trance et big-room** — elle s'empile jusqu'à ce que la track soit sur le point d'exploser. Très difficile à utiliser proprement hors de ce contexte.
"""
image = "lesson-images/delay_subdivisions_grid.png"
image_caption = "1/4 droite, 1/8 pointée, 1/16 triolet sur une grille 4/4 — chacune crée un feel différent."

[[fr.pages]]
title   = "L'echo-out : usage structurel du delay"
content = """
L'**echo-out** n'est pas un tour de passe-passe — c'est une technique structurelle. Voici la méthode précise :

**Mise en place** (pendant la dernière phrase de la track A) :
1. Time = 1/2 beat (un écho par demi-beat — présent mais pas rapide).
2. Feedback = 0,60–0,70 (4 à 6 répétitions avant de disparaître).
3. Mix = 40–50% (écho clairement audible mais pas plus fort que le signal dry).

**Exécution :**
4. Sur le beat 1 de la dernière mesure, descends doucement le fader de volume de la track A à zéro sur 4 beats.
5. La musique disparaît mais 6 à 8 secondes de queue d'écho restent.

**Pourquoi ça marche :**
L'écho est une empreinte de ce qui était là — le public entend la track "partir" plutôt que couper. Ça crée un espace et une respiration. Tu peux lancer la track B pendant la queue (elle s'assoit derrière), ou laisser un bref silence, ce qui est encore plus puissant.

**Larry Heard** (aka Mr. Fingers) utilisait cette technique en deep house pour créer des pauses émotionnelles. En entendant "Can You Feel It" transitionner ainsi, tu comprends pourquoi c'est devenu un standard.
"""

[[fr.pages]]
title   = "Feedback et mix : régler la queue parfaite"
content = """
Une fois la subdivision choisie, le feedback et le mix définissent le caractère de la queue.

**Guide feedback :**
- **0,0–0,3** : une ou deux répétitions propres, puis silence. Bon pour une ponctuation d'écho sur un stab vocal ou un coup de caisse.
- **0,4–0,6** : 4 à 6 répétitions, queue audible de ~3–5 secondes. Le cheval de bataille pour les transitions.
- **0,7–0,85** : longue queue, 8+ répétitions. Utile pour l'echo-out. Garde le mix sous 40% sinon ça noie le signal dry.
- **0,9+** : zone dangereuse sur la plupart des matos numériques — la queue peut ne jamais vraiment s'éteindre. Les DJM soft-clip à ~0,95, mais le résultat peut être sans fin et boueux.

**Guide mix :**
- Le signal dry doit presque toujours dominer (**mix sous 50%**).
- Exception : l'echo-out où tu baisses intentionnellement le dry à zéro.
- Exception : moments très aérés (une seule note de piano, une acapella) où un mix élevé crée un espace de type reverb.

Une habitude pro : règle le feedback à 0 avant d'activer le delay, puis monte-le graduellement pour entendre le premier écho avant de t'engager sur une longueur de queue.
"""

[[fr.pages]]
title   = "Send pre-fader vs post-fader"
content = """
Sur un Pioneer DJM, le delay fonctionne en **send post-fader** : le delay reçoit le signal *après* le fader de volume du canal. Ce qui veut dire :

- Baisse le fader à zéro → l'entrée du delay va à zéro → la queue s'éteint naturellement au fur et à mesure que les échos existants s'éteignent.
- La queue suit le fader, c'est le comportement par défaut pour l'echo-out.

Sur certaines tables (et unités FX externes), on peut passer en **pre-fader** : le delay reçoit le signal *avant* le fader. Alors :
- Baisse le fader → la track dry disparaît mais le delay continue de recevoir du signal et de générer des échos.
- Ça crée un effet "ghost mix" où l'écho et le dry sont complètement indépendants.

Savoir dans quel mode tu es compte pendant l'echo-out : post-fader donne un decay naturel propre ; pre-fader peut créer un feedback incontrôlé si tu oublies de couper le delay après avoir baissé le fader.
"""

