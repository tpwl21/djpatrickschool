[en]
title      = "Delay: Subdivisions, Genre DNA & the Echo-Out"
short_desc = "1/4 dub, 1/8 dotted tech house, 1/16 triplet trance — and the echo-out."
description = "You know the three controls. Now learn which subdivision to reach for and why — because the rhythm of the echo carries genre memory before you've touched feedback."
recap = [
  "1/4 note straight = dub / reggae — wide, spacious, King Tubby territory.",
  "1/8 dotted (3/4 of a beat) = syncopated bounce — a staple of tech house.",
  "1/16 triplet = six echoes per beat, blurring into texture — trance builds, big-room drops.",
  "Echo-out: delay + pull fader = the track vanishes in a tail, giving you room to start track B.",
  "Pick the subdivision first, feedback second — rhythm before length.",
]

[[en.pages]]
title   = "Subdivision as genre signature"
content = """
The **time** setting of a delay isn't just rhythm — it carries genre DNA. Before you touch feedback or mix, the subdivision you choose already tells the crowd which world you're in.

**1/4 note (straight quarter note = one beat)**
Wide, spacious, unhurried. Each repeat lands one quarter note (one beat) after the last. This is the classic **dub/reggae** echo — the sound of King Tubby's studio in Kingston, Jamaica, in the 1970s. Think: "I'm spacious and I have all the time in the world."

**1/8 note dotted (dotted eighth)**
The dotted eighth lasts **3/4 of a beat** (an eighth note, half a beat, plus half of that again) — it creates a syncopated bounce that feels like it's pulling forward. This is the subdivision that defines **tech house** and is heard all over the genre. The echo always seems to land slightly "early", creating urgency.

**1/16 note triplet**
Very fast, blurring into texture. **Six** echoes per beat (three per eighth note). This is the **trance and big-room build** subdivision — it stacks until the track feels like it's about to explode. Very difficult to use cleanly outside that context.
"""
image = "lesson-images/delay_subdivisions_grid.png"
image_caption = "1/4 straight, 1/8 dotted, and 1/16 triplet on a 4/4 grid — each creates a different feel."

[[en.pages]]
title   = "The echo-out: structural use of delay"
content = """
The **echo-out** is not a party trick — it's a structural technique. Here's the precise method:

**Setup** (do this during the last phrase of track A):
1. Time = 1/2 beat (an eighth note: one echo per half-beat — present but not fast).
2. Feedback = 0.60–0.70 (a tail of several seconds).
3. Mix = 40–50% (echo clearly audible but not louder than dry signal).

**Execution:**
4. On beat 1 of the last bar, smoothly pull track A's volume fader to zero over 4 beats.
5. The music disappears but a few seconds of echo tail remain.

**Why this works:**
The echo is a fingerprint of what was there — the crowd hears the track "leaving" rather than cutting. It creates a sense of space and breath. You can start track B during the tail (it sits behind it), or let silence happen briefly, which is even more powerful.

Use it on the **1**: the tail starts at the top of a bar, so the echoes stay on the grid and your next drop or entry can land on the following 1.
"""

[[en.pages]]
title   = "Feedback and mix: dialing the right tail"
content = """
Once you've chosen the subdivision, feedback and mix define the character of the tail.

**Feedback guidance:**
- **0.0–0.3**: one or two clean repeats, then silence. Good for a punctuation echo on a vocal stab or drum hit.
- **0.3–0.55**: a handful of repeats, a short tail. The workhorse for quick accents.
- **0.60–0.70**: long tail, the range for the echo-out (same as the setup above). Keep mix at or below 50%, or it washes the dry signal.
- **0.8 and up**: danger zone — the tail can feel endless and muddy, and on some gear it may not fully decay.

**Mix guidance:**
- The dry signal should almost always dominate (**mix below 50%**).
- Exception: echo-out where you're intentionally pulling the dry signal to zero.
- Exception: very sparse moments (a single piano note, an acapella) where a high-mix delay creates reverb-like space.

One pro habit: set feedback to 0 before turning delay on, then raise it gradually so you hear the first echo before committing to a tail length.
"""

[[en.pages]]
title   = "Pre-fader vs post-fader: where the tail goes"
content = """
When you pull the channel fader during an echo-out, two things can happen, depending on where the effect takes its signal.

- **Post-fader** (the effect listens *after* the fader): as the fader drops, less and less music enters the delay. The echoes already inside keep repeating and fade out by themselves (that is your feedback setting at work). You hear a tail of what was playing just before.
- **Pre-fader** (the effect listens *before* the fader): the delay keeps receiving the music even with the fader at zero. You hear only the echoes of the live track, dry gone. The tail can keep going as long as you leave the effect on.

Either way, the tail only exists while the effect is on and its return is up. Whether pulling the fader also cuts the tail depends on the mixer, the effect mode and the routing. **Test it on your own gear**: play a loop, turn the delay on, pull the fader, and listen. Then you know before the gig, not during.

Habit: after the fader is down and the tail has done its job, turn the effect off (or lower the feedback) so it doesn't spill over track B.
"""

