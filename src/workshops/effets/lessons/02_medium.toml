[[fr.pages]]
title   = "La subdivision comme signature de genre"
content = """
Le réglage **time** d'un delay n'est pas que du rythme — il porte l'ADN du genre. Avant de toucher feedback ou mix, la subdivision que tu choisis dit déjà au public dans quel univers tu es.

**1/4 (noire droite = un temps)**
Large, aéré, sans précipitation. Chaque répétition tombe une noire (un temps) après la précédente. C'est l'écho **dub/reggae** classique — le son du studio de King Tubby à Kingston, Jamaïque, dans les années 1970. Traduction : "Je suis spacieux et j'ai tout mon temps."

**1/8 pointée (croche pointée)**
La croche pointée dure **3/4 de temps** (une croche, un demi-temps, plus la moitié de ça) — elle crée un rebond syncopé qui tire vers l'avant. C'est la subdivision qui définit la **tech house** et s'entend partout dans le genre. L'écho semble toujours tomber légèrement "en avance", créant de l'urgence.

**1/16 triolet**
Très rapide, se fond en texture. **Six** échos par temps (trois par croche). C'est la subdivision des **builds de trance et big-room** — elle s'empile jusqu'à ce que la track soit sur le point d'exploser. Très difficile à utiliser proprement hors de ce contexte.
"""
image = "lesson-images/delay_subdivisions_grid.png"
image_caption = "1/4 droite, 1/8 pointée, 1/16 triolet sur une grille 4/4 — chacune crée un feel différent."

[[fr.pages]]
title   = "L'echo-out : usage structurel du delay"
content = """
L'**echo-out** n'est pas un tour de passe-passe — c'est une technique structurelle. Voici la méthode précise :

**Mise en place** (pendant la dernière phrase de la track A) :
1. Time = 1/2 beat (une croche : un écho par demi-temps — présent mais pas rapide).
2. Feedback = 0,60–0,70 (une queue de plusieurs secondes).
3. Mix = 40–50% (écho clairement audible mais pas plus fort que le signal dry).

**Exécution :**
4. Sur le beat 1 de la dernière mesure, descends doucement le fader de volume de la track A à zéro sur 4 beats.
5. La musique disparaît mais quelques secondes de queue d'écho restent.

**Pourquoi ça marche :**
L'écho est une empreinte de ce qui était là — le public entend la track "partir" plutôt que couper. Ça crée un espace et une respiration. Tu peux lancer la track B pendant la queue (elle s'assoit derrière), ou laisser un bref silence, ce qui est encore plus puissant.

Pars sur le **1** : la queue démarre en haut de la mesure, les échos restent sur la grille et ta prochaine entrée peut tomber sur le 1 suivant.
"""

[[fr.pages]]
title   = "Feedback et mix : régler la queue parfaite"
content = """
Une fois la subdivision choisie, le feedback et le mix définissent le caractère de la queue.

**Guide feedback :**
- **0,0–0,3** : une ou deux répétitions propres, puis silence. Bon pour une ponctuation d'écho sur un stab vocal ou un coup de caisse.
- **0,3–0,55** : une poignée de répétitions, queue courte. Le cheval de bataille pour les accents rapides.
- **0,60–0,70** : longue queue, la plage de l'echo-out (la même que dans la mise en place ci-dessus). Garde le mix à 50% maximum, sinon ça noie le signal dry.
- **0,8 et plus** : zone dangereuse — la queue peut devenir sans fin et boueuse, et sur certains appareils elle ne s'éteint jamais vraiment.

**Guide mix :**
- Le signal dry doit presque toujours dominer (**mix sous 50%**).
- Exception : l'echo-out où tu baisses intentionnellement le dry à zéro.
- Exception : moments très aérés (une seule note de piano, une acapella) où un mix élevé crée un espace de type reverb.

Une habitude pro : règle le feedback à 0 avant d'activer le delay, puis monte-le graduellement pour entendre le premier écho avant de t'engager sur une longueur de queue.
"""

[[fr.pages]]
title   = "Pre-fader vs post-fader : où va la queue"
content = """
Quand tu baisses le fader de canal pendant un echo-out, deux choses peuvent arriver, selon l'endroit où l'effet prend son signal.

- **Post-fader** (l'effet écoute *après* le fader) : à mesure que le fader descend, de moins en moins de musique entre dans le delay. Les échos déjà présents continuent de se répéter et s'éteignent d'eux-mêmes (c'est ton réglage de feedback qui travaille). Tu entends une queue de ce qui jouait juste avant.
- **Pre-fader** (l'effet écoute *avant* le fader) : le delay continue de recevoir la musique même fader à zéro. Tu n'entends que les échos de la track en cours, le dry a disparu. La queue peut durer tant que tu laisses l'effet actif.

Dans les deux cas, la queue n'existe que tant que l'effet est actif et que son retour est monté. Savoir si baisser le fader coupe aussi la queue dépend de la table, du mode de l'effet et du routing. **Teste sur ton matériel** : lance une boucle, active le delay, baisse le fader, écoute. Comme ça tu le sais avant le gig, pas pendant.

Réflexe : une fois le fader baissé et la queue terminée, coupe l'effet (ou baisse le feedback) pour qu'il ne déborde pas sur la track B.
"""

