description = "Tu connais les trois réglages. Apprends maintenant quelle subdivision choisir et pourquoi — parce que le rythme de l'écho porte la mémoire de genre avant même que tu touches le feedback."
recap = [
  "1/4 droite (une noire = un temps) = dub / reggae — large, aéré, le territoire King Tubby.",
  "1/8 pointée (3/4 de temps) = rebond syncopé — un classique de la tech house.",
  "1/16 triolet = six échos par temps, qui se fondent en texture — builds de trance, drops big-room.",
