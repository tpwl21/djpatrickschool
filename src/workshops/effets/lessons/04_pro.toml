[en]
title      = "Loop Rolls: The Beat Repeat"
short_desc = "Slip behavior, roll sizes in milliseconds, quantize, and when to keep your hands off."
description = "A roll is simple to press and easy to overuse. Here are the numbers behind the sizes, how slip and quantize decide where you land, how a deck roll differs from an FX stutter, and when silence is better."
recap = [
  "At 128 BPM a beat is 469 ms: a 1/4 roll repeats every 117 ms, 1/8 every 59 ms, 1/16 every 29 ms.",
  "Under about 30 ms the repeat is heard as a pitch, not a rhythm.",
  "A roll is a slip loop: the track keeps running underneath, so release lands on the live position.",
  "Quantize starts the roll on the grid, but trusts your beatgrid.",
  "A roll can cover tension, never a bad blend; and no roll at all is often the best choice.",
]

[[en.pages]]
title   = "Sizes in milliseconds, and the 30 ms line"
content = """
Roll sizes are fractions of a beat. At 128 BPM, one beat lasts 60 / 128 = 0.469 s.

| Roll size | Repeat length | Feel |
|---|---|---|
| 1/2 | 234 ms | bouncy, clearly rhythmic |
| 1/4 | 117 ms | stutter, machine gun |
| 1/8 | 59 ms | fast, nervous |
| 1/16 | 29 ms | about 34 repeats per second: starts to sound like a note |

When a repeat gets shorter than roughly 30 ms, your ear no longer follows a rhythm: it hears a **pitch**. That's why 1/16 and 1/32 rolls sound tonal, and why the same size sounds different at 124 and 174 BPM.

Practical consequence: at a fast tempo (drum and bass, around 174 BPM) a beat is 345 ms, so even 1/8 is only 43 ms. You hit the tonal zone with bigger sizes than in house.
"""

[[en.pages]]
title   = "Slip, quantize and the release"
content = """
**Slip behavior.** On a roll, the deck keeps counting the track position in the background. When you release, the playhead jumps to the position the track would have reached. That's why a roll never throws you out of phase with the other deck. If your deck has slip mode off, a roll becomes a normal loop and you come out at the wrong place.

**Quantize.** With quantize on, the roll starts on the nearest grid division, even if your press is a little early or late. With quantize off, it starts exactly when you press. Quantize only works as well as the **beatgrid**: a grid a few ms off gives a roll a few ms off. Check the grid on both decks.

**Deck roll vs FX stutter.** Two sources for the same gesture:
- a **deck roll / slip loop** works on the track on that deck;
- a **mixer FX roll or stutter** repeats the last slice of the signal going through the effect, which is useful when you want to roll a mix of two decks or add a roll without touching the deck.

Whichever you use, **release on the 1** (1.875 s per bar at 128 BPM). A release in the middle of a bar sounds like a mistake.
"""

[[en.pages]]
title   = "Placement: when not to roll"
content = """
**Where it works:**
- the last bar before a drop (a roll that gets faster, 1/4 then 1/8, tightens the tension);
- the end of an outro, as a way out.

**Where to keep your hands off:**
- to hide a bad blend or an off-beat transition: the stutter draws attention to what you wanted to hide;
- on every phrase: once the crowd expects it, it has no effect;
- when the track already has a stutter, a fill or a snare roll: you stack two rolls and get noise;
- at low energy, in a warm-up or a deep moment: a roll is a high-energy gesture.

**Silence option:** after a roll, a 1/2 beat cut-out before the downbeat can hit harder than any further effect. Try it, then compare with a plain release on the 1.
"""

