[fr]
title      = "Loop Rolls : Le Beat Repeat"
short_desc = "Comportement slip, tailles de roll en millisecondes, quantize, et quand ne pas y toucher."
description = "Un roll est simple à déclencher et facile à abuser. Voici les chiffres derrière les tailles, comment le slip et le quantize décident de où tu atterris, la différence entre un roll de platine et un stutter FX, et quand le silence vaut mieux."
recap = [
  "À 128 BPM un temps fait 469 ms : un roll 1/4 répète toutes les 117 ms, 1/8 toutes les 59 ms, 1/16 toutes les 29 ms.",
  "Sous environ 30 ms, la répétition s'entend comme une hauteur, pas comme un rythme.",
  "Un roll est une boucle slip : la track continue dessous, donc le relâchement tombe sur la position réelle.",
  "Le quantize démarre le roll sur la grille, mais fait confiance à ta beatgrid.",
  "Un roll peut couvrir de la tension, jamais un mauvais mix ; et pas de roll du tout est souvent le meilleur choix.",
]

[[fr.pages]]
title   = "Les tailles en millisecondes, et la ligne des 30 ms"
content = """
Les tailles de roll sont des fractions d'un temps. À 128 BPM, un temps dure 60 / 128 = 0,469 s.

| Taille du roll | Durée de répétition | Sensation |
|---|---|---|
| 1/2 | 234 ms | rebondissant, clairement rythmique |
| 1/4 | 117 ms | stutter, mitraillette |
| 1/8 | 59 ms | rapide, nerveux |
| 1/16 | 29 ms | environ 34 répétitions par seconde : ça commence à sonner comme une note |

Quand une répétition devient plus courte qu'environ 30 ms, l'oreille ne suit plus un rythme : elle entend une **hauteur**. C'est pour ça que les rolls 1/16 et 1/32 sonnent tonals, et que la même taille sonne différemment à 124 et à 174 BPM.

Conséquence pratique : à tempo rapide (drum and bass, vers 174 BPM) un temps fait 345 ms, donc même un 1/8 ne dure que 43 ms. Tu atteins la zone tonale avec des tailles plus grandes qu'en house.
"""

[[fr.pages]]
title   = "Slip, quantize et relâchement"
content = """
**Comportement slip.** Sur un roll, la platine continue de compter la position de la track en arrière-plan. Au relâchement, la tête de lecture saute à la position que la track aurait atteinte. C'est pour ça qu'un roll ne te sort jamais de la phase avec l'autre platine. Si le mode slip de ta platine est désactivé, un roll devient une boucle normale et tu ressors au mauvais endroit.

**Quantize.** Avec le quantize actif, le roll démarre sur la division de grille la plus proche, même si ton appui est un peu en avance ou en retard. Sans quantize, il démarre exactement quand tu appuies. Le quantize n'est aussi bon que la **beatgrid** : une grille décalée de quelques ms donne un roll décalé de quelques ms. Vérifie la grille sur les deux platines.

**Roll de platine vs stutter FX.** Deux sources pour le même geste :
- un **roll / loop slip de platine** travaille sur la track de cette platine ;
- un **roll ou stutter FX de la table** répète la dernière tranche du signal qui traverse l'effet, utile quand tu veux rouler un mélange de deux platines ou ajouter un roll sans toucher la platine.

Quel que soit ton choix, **relâche sur le 1** (1,875 s par mesure à 128 BPM). Un relâchement au milieu de la mesure sonne comme une erreur.
"""

[[fr.pages]]
title   = "Placement : quand ne pas rouler"
content = """
**Là où ça marche :**
- la dernière mesure avant un drop (un roll qui accélère, 1/4 puis 1/8, resserre la tension) ;
- la fin d'un outro, comme sortie.

**Là où il faut s'abstenir :**
- pour cacher un mix raté ou une transition décalée : le stutter attire l'attention sur ce que tu voulais cacher ;
- à chaque phrase : quand le public l'attend, ça ne fait plus d'effet ;
- quand la track a déjà un stutter, un fill ou un roulement de caisse claire : tu empiles deux rolls et tu obtiens du bruit ;
- à basse énergie, en warm-up ou dans un moment deep : un roll est un geste de haute énergie.

**Option silence :** après un roll, une coupure d'un demi-temps avant le temps fort peut frapper plus fort que n'importe quel effet de plus. Essaie, puis compare avec un simple relâchement sur le 1.
"""

