[fr]
title      = "Reverb : Chanter dans la Salle de Bain"
short_desc = "Pourquoi tu sonnes mieux sous la douche ? C'est la reverb."
description = "La reverb ajoute un sens de l'espace autour du son. Petite pièce, reverb courte. Grande cathédrale, reverb immense. Comprendre ça suffit pour commencer."
recap = [
  "La reverb ajoute un sens de l'espace : petite pièce = court, cathédrale = long.",
  "Marche magnifiquement sur les breaks et voix — détruit les tracks denses avec beaucoup de kick.",
  "Trois réglages : pre-delay (silence avant que ça commence), decay (durée de la queue), wet/dry (combien d'espace tu entends).",
  "Utilise-la comme ponctuation, pas comme nappe — une queue de deux mesures puis le silence tape plus fort que deux minutes de reverb.",
  "Le son Keinemusik / Afro house = reverb heavy sur moments aérés, puis impact dry.",
]

[[fr.pages]]
title   = "L'analogie de la salle de bain"
content = """
Chante en plein air. Ta voix sonne sèche et proche.

Maintenant chante dans une salle de bain. Ta voix rebondit sur les carreaux, le sol, le plafond. Tu entends ces rebonds une fraction de seconde après ta voix — ils se superposent et créent une **queue** sonore. Cette queue, c'est la **reverb**.

La reverb simule un espace :
- **Petite pièce** (une salle de bain) : beaucoup de rebonds rapides, queue courte (~0,3–0,5 seconde).
- **Grande salle** : rebonds plus lents, plus aérés, queue moyenne (~1–2 secondes).
- **Cathédrale** : espace immense, queue très longue (3–8 secondes).

Sur du matos DJ, tu ajoutes de la reverb à une track et elle sonne soudain comme si elle jouait dans une plus grande pièce.
"""

[[fr.pages]]
title   = "Où ça marche — et où ça détruit"
content = """
La reverb sonne magnifiquement sur :
- **Une voix aérée** — une voix seule semble soudain chanter dans Notre-Dame.
- **Un break** — la section épurée entre les builds. La reverb ajoute de la taille sans ajouter de bruit.
- **Un pad de synthé** ou une note de piano.

La reverb ne fonctionne PAS sur :
- **Une track dense avec beaucoup de kick et de basses**. Les graves s'agglutinent, tout se floute, le punch rythmique disparaît. Ça sonne comme de la boue.

La règle : **plus le son est vide, plus tu peux ajouter d'espace**. Une note seule peut tenir une reverb de 4 secondes. Un track de club peut tenir peut-être 0,5 seconde, et même ça demande du soin.

C'est pour ça qu'on entend si peu de reverb dans les vrais mixes de club — la plupart des tracks sont déjà denses.
"""

[[fr.pages]]
title   = "Le move Keinemusik : la reverb comme ponctuation"
content = """
Depuis environ 2015, le collectif berlinois **Keinemusik** (Adam Port, &ME, Rampa) a popularisé une technique de reverb spécifique dans l'Afro house et la melodic techno :

- Trouve un moment aéré — un coup de percussion seul, une phrase vocale, un stab d'accord.
- Balance une **reverb lourde** : decay long, mix wet élevé.
- Laisse la queue s'épanouir sur 2 à 4 mesures.
- Puis ramène un kick sec et puissant.

Le contraste entre la queue noyée et l'impact dry, c'est le geste. Le public passe de "flottant" à "ancré" en un beat.

**La leçon :** la reverb est un outil de contraste, pas de maintien d'atmosphère. Utilise-la pour ponctuer, puis retire-la. Une queue de deux mesures suivie d'un downbeat sec tape plus fort que deux minutes de nappe constante.
"""

