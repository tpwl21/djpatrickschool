[en]
title      = "Reverb: Singing in the Bathroom"
short_desc = "Why do you sound better singing in the shower? That's reverb."
description = "Reverb adds the sense of a space around the sound. Small space, small reverb. Big cathedral, huge reverb. Understanding this one idea is all you need to start."
recap = [
  "Reverb adds a sense of space: small room = short, cathedral = long.",
  "Works beautifully on breaks and vocals — destroys dense kick-heavy tracks.",
  "Three controls: pre-delay (gap before reverb starts), decay (how long the tail lasts), wet/dry (how much space you hear).",
  "Use it as a punctuation, not a wash — a two-bar tail then silence hits harder than two minutes of reverb.",
  "The Keinemusik / Afro house sound = heavy reverb on sparse moments, then dry impact.",
]

[[en.pages]]
title   = "The bathroom analogy"
content = """
Sing in an open field. Your voice sounds dry and close.

Now sing in a bathroom. Your voice bounces off the tiles, the floor, the ceiling. You hear these bounces a fraction of a second after your voice — they pile on top of each other and create a **tail** of sound. That tail is **reverb**.

Reverb simulates a space:
- **Small room** (a bathroom): many quick bounces, short tail (~0.3–0.5 seconds).
- **Large hall**: slower, more spacious bounces, medium tail (~1–2 seconds).
- **Cathedral**: massive space, very long tail (3–8 seconds).

In DJ gear, you add reverb to a track and it suddenly sounds like it's playing in a bigger room.
"""

[[en.pages]]
title   = "Where it works — and where it destroys"
content = """
Reverb sounds wonderful on:
- **A sparse vocal** — a single voice suddenly feels like it's singing in Notre-Dame.
- **A break** — the stripped-down section between builds. Reverb adds size without adding noise.
- **A synth pad** or a piano note.

Reverb does NOT work on:
- **A full dense track with lots of kick and bass**. The low end smears together, everything blurs, the rhythmic punch disappears. It sounds like mud.

The rule: **the emptier the sound, the more space you can add**. A single note can handle a 4-second reverb. A full club track can handle maybe 0.5 seconds, and even that needs care.

This is why you hear reverb so rarely in actual club mixes — most tracks are already dense.
"""

[[en.pages]]
title   = "The Keinemusik move: reverb as punctuation"
content = """
Since around 2015, the Berlin collective **Keinemusik** (Adam Port, &ME, Rampa) popularized a specific reverb technique in Afro house and melodic techno:

- Find a sparse moment — a single percussive hit, a vocal phrase, a chord stab.
- Hit it with **heavy reverb**: long decay, high wet mix.
- Let the tail bloom for 2–4 bars.
- Then bring back a dry, punchy kick.

The contrast between the drenched tail and the dry impact is the move. The crowd goes from "floating" to "grounded" in one beat.

**The lesson:** reverb is a tool for contrast, not for atmosphere maintenance. Use it to punctuate, then get out. A two-bar reverb tail followed by a dry downbeat hits harder than two minutes of constant reverb wash.
"""

[[en.quiz]]
question = "Why does a bathroom make your voice sound better?"
answers  = [
  "It changes the pitch",
  "The bounces off walls create a reverb tail that makes the voice sound fuller",
  "It amplifies the volume"
]
correct  = 1

[[en.quiz]]
