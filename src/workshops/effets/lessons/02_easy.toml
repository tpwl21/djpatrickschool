[fr]
title      = "Le Delay : L'Écho dans la Montagne"
short_desc = "Crie dans une vallée, tu t'entends en écho. C'est le delay."
description = "Le delay est l'effet le plus simple du monde : il rejoue ton son avec un léger retard. Comprendre ses trois réglages suffit pour commencer."
recap = [
  "Le delay répète ton son après un court délai — comme un écho dans la montagne.",
  "Trois réglages : time (combien de temps avant l'écho), feedback (combien d'échos), mix (le volume de l'écho).",
  "Le sync BPM garde l'écho sur le beat — sans lui, la répétition se bat avec le kick.",
  "Le move echo-out : delay la dernière mesure, puis baisse le fader — la track disparaît en queue.",
  "Le delay synced au BPM est plus musical que régler un temps en millisecondes.",
]

[[fr.pages]]
title   = "L'écho dans la montagne"
content = """
Mets-toi dans une vallée et crie. Une seconde plus tard, tu t'entends revenir de la falaise. C'est un **delay** : ton son, rejoué après un délai.

Un delay DJ fait exactement ça — avec trois réglages :

- **Time** : combien de temps s'écoule avant d'entendre l'écho. Sur du matos DJ, ça se règle en temps musical, pas en secondes. La référence, c'est le **beat** (le temps, la pulsation que tu tapes du pied). Une **noire** (1/4) dure exactement un beat. Une **croche** (1/8) dure un demi-beat. Une **double-croche** (1/16) dure un quart de beat. Certains appareils affichent la même chose en fractions de beat : « 1/2 » veut dire un demi-beat.
- **Feedback** : combien de fois l'écho se répète. 0 = un seul écho et c'est parti. 0,8 = l'écho continue de se répéter, de plus en plus doux.
- **Mix** : le volume de l'écho par rapport à l'original. 0% = tu n'entends pas l'écho. 100% = tu n'entends que l'écho.

La plupart des DJs laissent le mix à 30–50% et ajustent time et feedback selon le moment.
"""

[[fr.pages]]
title   = "Pourquoi le sync BPM est essentiel"
content = """
Le problème avec un delay libre : si l'écho ne tombe pas sur le beat, il se bat avec le kick.

Imagine battre des mains en rythme sur une chanson. Maintenant imagine quelqu'un d'autre qui bat des mains — mais un demi-beat en retard. Même s'ils sont discrets, c'est immédiatement distrayant.

**Le delay syncé au BPM** verrouille l'écho sur la grille de la musique. Si tu choisis "1/4 de note", chaque écho tombe exactement un beat après le précédent — toujours en rythme, toujours musical.

C'est pour ça que le matos DJ moderne n'a pas de knob en millisecondes pour le delay : il te donne des **subdivisions de beat** à la place. Tu choisis 1/4, 1/8, un beat, et la machine fait le calcul pour le BPM du moment.

Écoute une track avec un delay syncé à 1/4 de note (un beat). Chaque écho tombe exactement où tu l'attends. Désactive le sync, et le même réglage devient du chaos.
"""

[[fr.pages]]
title   = "L'echo-out : un grand classique DJ"
content = """
C'est un des moves les plus cinématographiques du DJing, et il utilise le delay :

1. Tu es à la fin d'une track. Elle n'a pas de bon outro.
2. Active le delay : time = un demi-beat (1/8 de note), feedback = 0,65, mix = 50%.
3. Descends lentement le fader de volume de la track.
4. La musique disparaît — mais le dernier beat continue de résonner pendant plusieurs secondes, de plus en plus doux.

Cette queue, c'est la track qui dit au revoir. Tu peux utiliser ce silence pour amener la prochaine track, ou juste laisser respirer.

C'est un geste structurel : l'écho, c'est l'outro que la track n'avait pas. Fais attention que la queue ne soit pas plus forte que la track qui arrive.
"""

