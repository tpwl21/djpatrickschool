[en]
title      = "Delay: The Echo in the Mountain"
short_desc = "Shout across a valley, hear yourself come back. That's delay."
description = "Delay is the simplest effect in the world: it plays your sound back, delayed. Understanding its three controls is all you need to start using it."
recap = [
  "Delay repeats your sound after a short wait — like an echo in a mountain valley.",
  "Three controls: time (how long before the echo), feedback (how many echoes), mix (how loud the echo is).",
  "BPM-sync keeps the echo on the beat — without it, the repeat fights the kick.",
  "The echo-out move: delay the last bar, then pull the fader — the track vanishes in a tail.",
  "BPM-synced delay is more musical than setting a time in milliseconds.",
]

[[en.pages]]
title   = "The mountain echo"
content = """
Stand in a valley and shout. A second later, you hear yourself come back from the cliff. That's a **delay**: your sound, played back after a gap.

A DJ delay does exactly this — but with three controls:

- **Time**: how long is the gap before you hear the echo. On DJ gear, you set this in beats: 1/4 note, 1/2 note, 1 full beat, 2 beats.
- **Feedback**: how many times the echo repeats. 0 = one echo and it's gone. 0.8 = the echo keeps repeating, getting quieter each time.
- **Mix**: how loud the echo is compared to the original. 0% = you don't hear the echo at all. 100% = you hear only the echo.

Most DJs leave mix at 30–50% and adjust time and feedback depending on the moment.
"""

[[en.pages]]
title   = "Why BPM-sync matters"
content = """
Here's the problem with free-running delay: if the echo doesn't land on the beat, it fights with the kick.

Imagine clapping along to a song. Now imagine someone else clapping — but half a beat late. Even if they're quiet, it's immediately distracting.

**BPM-synced delay** locks the echo to the grid of the music. If you choose "1/4 note", every echo lands on a quarter note — always in rhythm, always musical.

This is why modern DJ gear doesn't have a millisecond knob for delay: they give you **beat subdivisions** instead. You choose 1/4, 1/2, 1 beat, and the gear does the math.

Try listening to a track with a synced delay at 1/4 note. Every echo hits exactly where you expect it. Remove sync, and the same setting becomes a mess.
"""
youtube = "https://www.youtube.com/watch?v=9dVMIdpNPAE"
youtube_start = 0
youtube_caption = "BPM-synced delay on a DJ mixer — hear the echo lock to the beat."

[[en.pages]]
title   = "The echo-out: a classic DJ move"
content = """
This is one of the most cinematic tricks in DJing, and it uses delay:

1. You're at the end of a track. It has no good outro.
2. Turn on delay: time = 1/2 beat, feedback = 0.65, mix = 50%.
3. Slowly pull the volume fader of the track down.
4. The music disappears — but the last beat keeps echoing for 5–10 seconds, getting quieter and quieter.

That tail is the track saying goodbye. You can use that silence to bring in the next track, or just let it breathe.

**Larry Heard**, creator of the deep house sound, was one of the first DJs to use this as a structural move in the late 1980s. It became a signature of thoughtful mixing.
"""

