[en]
title      = "Delay: Circular Buffer, Interpolation & Tape Emulation"
short_desc = "Ring buffer architecture, Hermite interpolation, and the physics of RE-201 wow/flutter."
description = "A digital delay is trivially a ring buffer until you try to make it musical. Every design decision — interpolation order, feedback limiting, modulation depth — audibly changes the result."
recap = [
  "Ring buffer: write pointer advances 1/sample; read pointer lags by D samples (D = fs × delayTime).",
  "Non-integer delay needs interpolation: linear is cheap but attenuates HF in feedback; Hermite/cubic preserves transients.",
  "Feedback stability: |gain| < 1 for exponential decay. a soft-clip (tanh) in the feedback path allows near-infinite decays without runaway.",
  "Tape delay (RE-201): LP in feedback path (HF loss per pass), tanh saturation, pitch modulation (wow/flutter) from motor speed variation.",
  "All-pass interpolation gives flat magnitude response at the cost of phase distortion — audible on sustained feedback.",
]

[[en.pages]]
title   = "The ring buffer: architecture of a digital delay"
content = """
A digital delay line is a **ring buffer** (circular buffer) of audio samples. The core loop:

```
buffer[N]        — fixed-length float array
writePtr         — advances by 1 each sample
readPtr          — trails writePtr by D: readPtr = (writePtr - D + N) % N
output[n]        = buffer[readPtr]
buffer[writePtr] = input[n] + feedback * buffer[readPtr]
writePtr         = (writePtr + 1) % N
```

This is the complete inner loop of most digital delays. N must be large enough for the max delay time: for 2 s at 44100 Hz, N = 88200 samples.

**Why modular arithmetic:** the buffer wraps — when writePtr reaches N it returns to 0. This avoids per-sample allocation and keeps accesses cache-friendly.

**Memory cost:** at 32-bit float, 2-second stereo delay at 44100 Hz = 2 × 88200 × 4 bytes = 705 KB. Trivial today, real hardware in 1972.
"""

[[en.pages]]
title   = "Interpolation: the sound of the math"
content = """
The read position D = fs × delayTime is almost never an integer. A quarter-note delay (one beat) at 130 BPM lasts 60/130 s, so D = 44100 × (60/130) ≈ 20354 samples. You must read between two buffer positions.

**Linear interpolation:**
```
frac   = D - floor(D)
output = (1 - frac) * buffer[i] + frac * buffer[i+1]
```
Acts as a **first-order lowpass** on the delayed signal. In a feedback loop this HF attenuation compounds each repeat — after 8+ echoes, the tail sounds increasingly dull. Useful for tape emulation.

**Hermite (4-point cubic) interpolation:**
Fits a cubic polynomial to four adjacent buffer samples. Better HF preservation, more computation. Standard choice for pristine echo tails with high feedback.

**All-pass interpolation:**
Flat magnitude response (no HF rolloff) but introduces frequency-dependent phase shift. Excellent for read-pointer modulation (flutter, chorus) but can sound phasey on long feedback tails. Used in Lexicon 224 reverb algorithms.

**Rule:** for clean studio delay → Hermite. For tape warmth → linear interpolation plus an explicit LP per feedback pass.
"""

[[en.pages]]
title   = "Feedback stability and soft-clipping"
content = """
The feedback coefficient g must satisfy **|g| < 1** for an exponentially decaying tail:

```
Amplitude after n repeats = g^n × original
g = 0.70:  n=10 → 0.028× original  (nearly gone)
g = 0.95:  n=10 → 0.60×  original  (still loud)
g = 1.00:  n=10 → 1.0×   original  (infinite sustain)
g = 1.01:  n=10 → 1.11×  original  (growing — unstable)
```

Many delay designs keep g below 1 and add a tanh waveshaper in the feedback path. Result:
1. Near-infinite decay without true infinite sustain.
2. Loud transients cannot trigger exponential growth — the waveshaper limits the feedback amplitude.

Without protection, g > 1.0 on a loud signal → exponential growth → digital clipping in seconds. The delay becomes a screeching oscillator.

**Edge case:** g = 1.0 exactly with silent input after initial sound → perfect infinite sustain (frozen loop). Some modern delay pedals expose it deliberately as a "hold" / freeze function.
"""
image = "lesson-images/delay_feedback_stability.png"
image_caption = "Feedback coefficient vs tail length: g=0.7, 0.85, 0.95, and the instability boundary at 1.0."

[[en.pages]]
title   = "Tape delay: RE-201 and the physics of imperfection"
content = """
The **Roland RE-201 Space Echo** (1974) records on a tape loop and plays back through heads at fixed positions (~50, 100, 300 ms and combinations). Four mechanisms separate it from digital delay:

**1. HF loss per pass (LP in feedback path)**
Tape has limited bandwidth. Each record/playback pass attenuates highs. Modeled as a one-pole LP (fc ≈ 6–8 kHz) in the feedback path. More repeats = progressively warmer echo.

**2. Wow and flutter**
The tape motor runs at slightly variable speed. Wow = slow modulation (0.1–1 Hz), flutter = faster (5–15 Hz). DSP model: D(t) = D₀ × (1 + depth × sin(2π·rate·t)). Each echo has a slightly different pitch — the characteristic "shimmer."

**3. Tape saturation**
Soft-knee (≈ tanh) magnetic saturation. Hot input → gentle compression + (for a symmetric curve) odd-order harmonics. Same mechanism as the Moog ladder warmth.

**4. Head bump**
Record head resonance at ~60–80 Hz adds a subtle bass boost to recordings — the "fatness" in RE-201 echoes.

**DSP recipe for faithful RE-201 emulation:** ring buffer + linear interpolation (HF rolloff intended) + one-pole LP in feedback path + tanh waveshaper + LFO modulating read pointer + static head-bump EQ. This is what the Boss RE-20 and Strymon Volante implement internally.
"""

