[[fr.pages]]
title   = "Le ring buffer : architecture d'un delay numérique"
content = """
Une ligne à delay numérique est un **ring buffer** (buffer circulaire) d'échantillons audio. La boucle centrale :

```
buffer[N]        — tableau de floats de longueur fixe
writePtr         — avance de 1 par échantillon
readPtr          — suit writePtr avec décalage D : readPtr = (writePtr - D + N) % N
output[n]        = buffer[readPtr]
buffer[writePtr] = input[n] + feedback * buffer[readPtr]
writePtr         = (writePtr + 1) % N
```

C'est la boucle complète de la plupart des delays. N doit être assez grand pour le délai maximal : pour 2 s à 44100 Hz, N = 88200 échantillons.

**Pourquoi l'arithmétique modulaire :** le buffer boucle — quand writePtr atteint N, il retourne à 0. Pas d'allocation par échantillon, accès cache-friendly.

**Coût mémoire :** float 32 bits, delay stéréo 2 s à 44100 Hz = 2 × 88200 × 4 octets = 705 Ko. Trivial aujourd'hui, hardware réel en 1972.
"""

[[fr.pages]]
title   = "L'interpolation : le son des maths"
content = """
La position de lecture D = fs × delayTime n'est presque jamais un entier. Un delay d'une noire (un temps) à 130 BPM dure 60/130 s, donc D = 44100 × (60/130) ≈ 20354 échantillons. Il faut lire entre deux positions.

**Interpolation linéaire :**
```
frac   = D - floor(D)
output = (1 - frac) * buffer[i] + frac * buffer[i+1]
```
Agit comme un **passe-bas du premier ordre** sur le signal retardé. Dans une boucle de feedback, cette atténuation HF s'accumule à chaque répétition — après 8+ échos, la queue sonne de plus en plus mat. Utile pour l'émulation bande.

**Interpolation Hermite (cubique 4 points) :**
Ajuste un polynôme cubique sur quatre échantillons adjacents. Meilleure préservation HF. Standard pour des queues propres à feedback élevé.

**Interpolation all-pass :**
Réponse en amplitude plate (pas d'atténuation HF) mais déphasage variable selon la fréquence. Excellente pour la modulation du pointeur (flutter, chorus) mais peut sonner phasé sur les longues queues. Utilisée dans les algorithmes Lexicon 224.

**Règle :** delay studio propre → Hermite. Chaleur bande → interpolation linéaire + LP explicite par passage.
"""

[[fr.pages]]
title   = "Stabilité du feedback et soft-clipping"
content = """
Le coefficient de feedback g doit satisfaire **|g| < 1** pour une queue décroissante :

```
Amplitude après n répétitions = g^n × original
g = 0,70 :  n=10 → 0,028× original  (presque parti)
g = 0,95 :  n=10 → 0,60×  original  (encore fort)
g = 1,00 :  n=10 → 1,0×   original  (sustain infini)
g = 1,01 :  n=10 → 1,11×  original  (croissance — instable)
```

Beaucoup de delays gardent g sous 1 et ajoutent un waveshaper tanh dans la boucle. Résultat :
1. Decay quasi-infini sans sustain réellement infini.
2. Les transitoires forts ne déclenchent pas de croissance exponentielle.

Sans protection, g > 1,0 sur un signal fort → croissance exponentielle → clipping numérique en quelques secondes.

**Cas limite :** g = 1,0 exactement avec entrée silencieuse → sustain parfaitement infini (boucle gelée). Certaines pédales de delay modernes l'exposent volontairement sous forme de fonction "hold" / freeze.
"""
image = "lesson-images/delay_feedback_stability.png"
image_caption = "Coefficient de feedback vs longueur de queue : g=0,7, 0,85, 0,95, seuil d'instabilité à 1,0."

[[fr.pages]]
title   = "Tape delay : RE-201 et la physique de l'imperfection"
content = """
Le **Roland RE-201 Space Echo** (1974) enregistre sur une boucle de bande et relit par des têtes à positions fixes (~50, 100, 300 ms et combinaisons). Quatre mécanismes le séparent d'un delay numérique :

**1. Perte HF par passage (LP dans la boucle de feedback)**
La bande a une bande passante finie. Chaque passage atténue les aigus. Modélisé comme un LP un-pôle (fc ≈ 6–8 kHz) dans la boucle. Plus de répétitions = queue progressivement plus chaude.

**2. Wow et flutter**
Le moteur bande tourne à vitesse légèrement variable. Wow = modulation lente (0,1–1 Hz), flutter = plus rapide (5–15 Hz). DSP : D(t) = D₀ × (1 + depth × sin(2π·rate·t)). Chaque écho a un pitch légèrement différent — le "shimmer" des delays vintage.

**3. Saturation de bande**
Saturation magnétique soft-knee (≈ tanh). Signal fort → légère compression + (pour une courbe symétrique) harmoniques d'ordre impair. Même mécanisme que la chaleur du ladder Moog.

**4. Head bump**
Résonance de la tête d'enregistrement à ~60–80 Hz → léger boost de graves → "graisse" des échos RE-201.

**Recette DSP pour une émulation RE-201 fidèle :** ring buffer + interpolation linéaire (rolloff HF voulu) + LP un-pôle dans la boucle + waveshaper tanh + LFO modulant le pointeur + EQ statique head-bump. C'est exactement ce que le Boss RE-20 et le Strymon Volante implémentent.
"""

