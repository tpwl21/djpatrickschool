[fr]
title      = "FX Chain : L'Ordre Change Tout"
short_desc = "L'echo-out sur le 1, le send/return, Beat FX vs Color FX, et quand ne pas mettre d'effet."
description = "Connaître la théorie de l'ordre des effets ne suffit pas en cabine. Cette leçon en fait une routine : un echo-out chronométré, un send/return propre, un effet à la fois, et la discipline de laisser les effets éteints."
recap = [
  "Echo-out : active sur le 1 de la dernière mesure, baisse le fader sur la mesure suivante, coupe l'effet sur le 1 d'après.",
  "À 128 BPM, feedback 0,65 et delay d'un demi-temps, la traîne met environ 2,5 s à baisser de 40 dB.",
  "Send/return : unité externe à 100% wet, niveau sur le return de la table, passe-haut sur le retour.",
  "Les Beat FX sont synchro et précis ; les Color FX sont rapides et approximatifs. Un seul à la fois sur une transition.",
  "Quand tu n'as rien à dire avec un effet, ne dis rien.",
]

[[fr.pages]]
title   = "L'echo-out sur le 1"
content = """
Chronométrage à **128 BPM** : un temps dure 469 ms, une mesure 1,875 s.

**Avant :** règle le delay à 1/2 temps (234 ms), feedback autour de 0,65, mix à 40–50%. L'effet est prêt mais **éteint**.

**Exécution :**
1. Sur le **1** de la dernière mesure de la track A, active l'effet.
2. Pendant la mesure suivante (1,875 s), baisse le fader de A.
3. Laisse sonner la traîne. Avec 0,65 de feedback, chaque répétition est environ 3,7 dB plus basse ; pour baisser de 40 dB il faut environ 11 répétitions, soit à 234 ms environ **2,5 s** (environ une mesure et un tiers).
4. Sur le **1** suivant, coupe l'effet, et laisse la track B atterrir sur ce 1.

**Pourquoi sur le 1 :** la traîne démarre sur la grille, donc les échos restent sur le temps. B entre sur un temps fort, donc le public entend une phrase neuve et propre, pas un écho qui dérive dedans.

**À vérifier sur ton matériel :** baisser le fader coupe-t-il la traîne ou pas ? Ça dépend du routing. Si la traîne est coupée, passe l'effet en send ou dans un mode qui la laisse sonner.
"""

[[fr.pages]]
title   = "Send/return et un effet à la fois"
content = """
**Effet externe via send/return.** Send out de la table vers l'unité, return in sur un canal libre ou un return :
- unité à **100% wet**, pour ne pas doubler le signal dry ;
- la quantité se règle avec le **niveau du return** sur la table ;
- un **passe-haut** sur le retour (environ 200 à 300 Hz) garde le grave serré ;
- cale le tap tempo de l'unité sur le BPM (128 BPM = 469 ms par temps). Retape après chaque changement de tempo.

**Beat FX et Color FX ensemble.** Les Beat FX sont synchro au tempo et routés en send ou sur le master ; les Color FX sont sur le canal. Sur le même canal, vérifie leur ordre (voir la leçon medium) : un filtre après un écho fait suivre la traîne au potard, un filtre avant donne des échos qui ne changent plus.

**Un à la fois.** Pendant une transition, utilise un seul effet à la fois : un filtre *ou* un écho *ou* une reverb. Deux sweeps et un delay ensemble transforment une transition en bruit, et tu ne sais plus ce qui fait quoi. Prépare ce que tu veux, bouge un potard à la fois, et remets tout à neutre à la fin.
"""

[[fr.pages]]
title   = "Quand ne pas mettre d'effet"
content = """
La meilleure transition est souvent un fondu propre avec seulement l'EQ et le fader. Laisse les effets éteints quand :

- les deux tracks vont déjà ensemble (même tonalité, énergie proche) : l'effet n'ajoute rien ;
- le dancefloor est calé : ne casse pas le groove pour ton propre plaisir ;
- tu n'es pas sûr de là où l'effet va atterrir : entraîne-toi d'abord, ne teste pas sur le public ;
- tu en as déjà utilisé un sur la transition précédente : un truc répété perd son pouvoir ;
- le grave est déjà dense : pas de reverb, pas de long delay.

Une question utile avant chaque effet : **qu'est-ce que ça apporte aux gens qui dansent ?** Si la réponse est « rien », laisse-le éteint. Le skill n'est pas de connaître plus d'effets, mais de savoir quand le silence dans la section FX est le bon geste.
"""

