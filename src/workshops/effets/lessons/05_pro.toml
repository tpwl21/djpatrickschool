[en]
title      = "FX Chain: Order Matters"
short_desc = "The echo-out on the 1, send/return routing, Beat FX vs Color FX, and when to use no effect."
description = "Knowing the theory of effect order is not enough in the booth. This lesson turns it into a routine: a timed echo-out, a clean send/return, one effect at a time, and the discipline to leave effects off."
recap = [
  "Echo-out: engage on the 1 of the last bar, drop the fader over the next bar, cut the effect on the following 1.",
  "At 128 BPM and feedback 0.65 with a half-beat delay, the tail takes about 2.5 s to fall by 40 dB.",
  "Send/return: external unit at 100% wet, level on the mixer return, high-pass the return.",
  "Beat FX are synced and precise; Color FX are fast and approximate. Use one at a time on a transition.",
  "When there is nothing to say with an effect, say nothing.",
]

[[en.pages]]
title   = "The echo-out on the 1"
content = """
Timing at **128 BPM**: one beat is 469 ms, one bar is 1.875 s.

**Before:** set the delay to 1/2 beat (234 ms), feedback around 0.65, mix at 40 to 50%. The effect is ready but **off**.

**Execution:**
1. On the **1** of the last bar of track A, engage the effect.
2. Over the next bar (1.875 s), bring the fader of A down.
3. Let the tail ring. With 0.65 feedback, each repeat is about 3.7 dB lower; to fall by 40 dB takes about 11 repeats, which at 234 ms is about **2.5 s** (about a bar and a third).
4. On the **1** after, cut the effect, and let track B land on that 1.

**Why on the 1:** the tail starts on the grid, so the echoes stay on the beat. B enters on a downbeat, so the crowd hears a clean new phrase, not an echo drifting into it.

**Check on your gear:** does pulling the fader cut the tail or not? It depends on the routing. If the tail is cut, set the effect to a send or a mode that lets it ring.
"""

[[en.pages]]
title   = "Send/return and one effect at a time"
content = """
**External effect through send/return.** Send out from the mixer to the unit, return in on a free channel or return:
- unit at **100% wet**, so you don't double the dry signal;
- the amount is set with the **return level** on the mixer;
- a **high-pass** on the return (about 200 to 300 Hz) keeps the low end tight;
- set the unit's tap tempo to the BPM (128 BPM = 469 ms per beat). Retap after each tempo change.

**Beat FX and Color FX together.** Beat FX are synced to the tempo and routed on a send or master; Color FX are on the channel. On the same channel, check their order (see the medium lesson): a filter after an echo makes the tail follow the knob, a filter before makes echoes that don't change.

**One at a time.** During a transition use one effect at a time: a filter *or* an echo *or* a reverb. Two sweeps and a delay together turn a transition into noise, and you can no longer tell what is doing what. Set up what you want, move one knob at a time, and put everything back to neutral at the end.
"""

[[en.pages]]
title   = "When to use no effect"
content = """
The best transition is often a clean blend with EQ and fader only. Leave effects off when:

- the two tracks already fit (same key, similar energy): the effect adds nothing;
- the dancefloor is locked in: don't break the groove for your own entertainment;
- you are not sure where the effect will land: practise first, don't test on the crowd;
- you used one on the previous transition: a repeated trick loses its power;
- the low end is already dense: no reverb, no long delay.

A useful question before each effect: **what does it do for the people dancing?** If the answer is "nothing", leave it off. The skill is not in knowing more effects but in knowing when silence in the FX section is the right move.
"""

