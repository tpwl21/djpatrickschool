[fr]
title      = "Loop Rolls : Le Beat Repeat"
short_desc = "Répète un tout petit bout de la track tant que tu tiens le bouton."
description = "Un loop roll répète un petit morceau de musique tant que tu tiens un pad, puis la track repart comme si de rien n'était. Trois tailles et une habitude de relâchement suffisent pour commencer."
recap = [
  "Un loop roll répète un tout petit bout de la track tant que tu tiens le pad.",
  "Sur un roll, les tailles sont des fractions de temps : 1/4 = stutter rapide, 1/8 = plus rapide, 1/16 = un bourdonnement.",
  "La track continue de tourner dessous : au relâchement, tu retombes là où la musique serait.",
  "À utiliser sur la dernière mesure avant un drop ou en fin de track, jamais pour cacher un mix raté.",
  "Relâche sur le 1 de la mesure suivante, en comptant dans ta tête.",
]

[[fr.pages]]
title   = "Un disque qui saute exprès"
content = """
Tu connais le son d'un CD rayé qui reste coincé et répète le même petit bout ? Un **loop roll** fait ça exprès. Tu tiens un bouton, la platine répète un petit morceau de musique, et quand tu lâches, la musique repart.

Sur un roll, les tailles se comptent en **fractions d'un temps** (le temps, la pulsation que tu tapes du pied) :

- **1/2** : un demi-temps. Une répétition claire, qui rebondit.
- **1/4** : un quart de temps. Un stutter rapide, comme une mitraillette.
- **1/8** : un huitième de temps. Nerveux.
- **1/16** et plus petit : si rapide que ton oreille n'entend plus un rythme mais une note qui bourdonne.

Attention : ce n'est pas la même convention que dans la leçon sur le delay, où « 1/4 » voulait dire une **noire** (un temps entier). Sur un loop roll, **1/4 veut dire un quart de temps**. Dans le doute, fais confiance à tes oreilles.
"""

[[fr.pages]]
title   = "La track continue de tourner dessous"
content = """
Voilà le côté malin. Pendant que tu tiens le roll, la track ne s'arrête pas : elle continue d'avancer en arrière-plan, comme un train qui passe derrière un mur.

Quand tu lâches, tu ne reviens pas là où le roll a commencé. Tu sautes **là où la musique serait** maintenant. C'est pour ça qu'un roll ne te fait pas sortir du beat.

C'est aussi une super façon de monter la tension : le public entend la musique coincée, puis relâchée dans la partie suivante, le tout en rythme.
"""

[[fr.pages]]
title   = "Quand l'utiliser, quand éviter"
content = """
**À utiliser :**
- sur la dernière mesure avant un drop, pour faire attendre le public,
- en fin de track, comme sortie.

**À éviter :**
- pour cacher un mix raté. Le public entend le stutter et ton erreur,
- une phrase sur deux. Un truc qu'on fait tout le temps n'est plus un truc.

Le vrai skill, c'est le **relâchement**. Tiens le pad, compte les temps dans ta tête, et lâche sur le **1** de la mesure suivante. Si tu relâches au milieu d'une répétition, ça sonne comme une erreur.
"""

