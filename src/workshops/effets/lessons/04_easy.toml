[en]
title      = "Loop Rolls: The Beat Repeat"
short_desc = "Repeat a tiny slice of the track for as long as you hold the button."
description = "A loop roll repeats a tiny piece of the music while you hold a pad, then the track carries on as if nothing happened. Three sizes and one release habit are enough to start."
recap = [
  "A loop roll repeats a tiny slice of the track for as long as you hold the pad.",
  "On a roll, sizes are fractions of a beat: 1/4 is a fast stutter, 1/8 is faster, 1/16 turns into a buzz.",
  "The track keeps running underneath: when you release, you land where the music would be.",
  "Use it on the last bar before a drop or at the end of a track, never to hide a bad mix.",
  "Release on the 1 of the next bar, counting in your head.",
]

[[en.pages]]
title   = "A record that skips on purpose"
content = """
You know the sound of a scratched CD that gets stuck and repeats the same tiny bit? A **loop roll** does that on purpose. You hold a button, the deck repeats a small piece of the music, and when you let go, the music goes on.

Sizes on a roll are counted as **fractions of one beat** (the pulse you tap your foot to):

- **1/2**: half a beat. A clear, bouncy repeat.
- **1/4**: a quarter of a beat. A fast stutter, like a machine gun.
- **1/8**: an eighth of a beat. Edgy and nervous.
- **1/16** and smaller: so fast that your ear stops hearing a rhythm and starts hearing a buzzing note.

Careful: this is not the same convention as the delay lesson, where "1/4" meant a quarter **note** (one whole beat). On a loop roll, **1/4 means a quarter of a beat**. When in doubt, test with your ears.
"""

[[en.pages]]
title   = "The track keeps running underneath"
content = """
Here is the clever part. While you hold the roll, the track does not stop: it keeps moving in the background, like a train passing behind a wall.

When you let go, you don't go back to where the roll started. You jump to **where the music would be** now. That's why a roll doesn't throw you off the beat.

It also means the roll is a great way to build tension: the crowd hears the music stuck, then released into the next part, all in time.
"""

[[en.pages]]
title   = "When to use it, and when not"
content = """
**Use it:**
- on the last bar before a drop, to make the crowd wait,
- at the end of a track, as a way out.

**Don't use it:**
- to hide a bad mix. The crowd hears the stutter and your mistake,
- every other phrase. A trick you use all the time stops being a trick.

The real skill is the **release**. Hold the pad, count the beats in your head, and let go on the **1** of the next bar. If you release in the middle of a repeat, it sounds like a mistake.
"""

