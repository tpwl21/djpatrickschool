[en]
title      = "The Filter: DSP Topology & Analog Nonlinearity"
short_desc = "SVF vs biquad, Moog ladder, self-oscillation math, and 12/24 dB slopes."
description = "The filter is a deceptively simple concept hiding rich DSP. Understanding the topology tells you why two filters with identical cutoff and Q settings can sound completely different."
recap = [
  "State-variable filter (SVF): simultaneous LP/BP/HP outputs, stable with high Q — most DJ mixer implementations.",
  "Biquad: standard DSP workhorse, transfer function H(z), can model any 2nd-order filter, basis of the Audio EQ Cookbook.",
  "Moog transistor ladder: 4 cascaded one-pole RC stages, 24 dB/oct, nonlinear coupling between resonance and cutoff.",
  "Self-oscillation is a Barkhausen condition: loop gain ≥ 1 and total phase = 360° at the oscillation frequency.",
  "Analog 'warmth' is soft-clip (tanh) saturation in the feedback path — absent in a pure biquad model.",
]

[[en.pages]]
title   = "State-variable filter (SVF) vs biquad"
content = """
The two dominant digital filter topologies in DJ gear are the **state-variable filter** and the **biquad**.

**Biquad (bi-quadratic filter):**
The canonical 2nd-order IIR filter. Its transfer function in the Z-domain is:

```
H(z) = (b₀ + b₁z⁻¹ + b₂z⁻²) / (1 + a₁z⁻¹ + a₂z⁻²)
```

Coefficients (b₀, b₁, b₂, a₁, a₂) are computed from cutoff ω₀ and Q via the **Audio EQ Cookbook** (Robert Bristow-Johnson). Stable, cheap, direct form II implementation. One weakness: **numerical instability at very low cutoff frequencies** (close to 0 Hz), where the coefficients become poorly conditioned.

**State-variable filter (SVF):**
A topology with three simultaneous outputs — lowpass (LP), bandpass (BP), highpass (HP) — computed from the same differential equations:

```
LP_out[n] = LP_out[n-1] + F × BP_out[n-1]
BP_out[n] = BP_out[n-1] + F × (in[n] - LP_out[n-1] - Q⁻¹ × BP_out[n-1])
HP_out[n] = in[n] - LP_out[n-1] - Q⁻¹ × BP_out[n-1]
```

where F = 2·sin(π·fc/fs). The SVF remains numerically stable across the full frequency range and handles **high-Q sweeps** gracefully — which is why it's preferred for DJ filters that must be swept in real time.
"""

[[en.pages]]
title   = "The Moog transistor ladder: nonlinearity as feature"
content = """
The **Moog transistor ladder** (Robert Moog, 1964) is not a biquad or SVF — it's a cascade of four one-pole RC lowpass stages with a **resonance feedback path**:

```
Stage gain: G = tanh(I_s · V_in / (2V_t))   ← soft-clip saturation
Total slope: 4 × 6 dB/oct = 24 dB/oct
Feedback: -k × output fed back to input (k = resonance coefficient)
```

What makes it special:
1. **Nonlinear coupling**: as cutoff frequency changes, the input impedance of each stage changes, which cross-modulates the resonance. There is no clean separation of cutoff and Q — they bleed into each other. This is perceived as "organic" or "alive."
2. **Soft saturation**: the tanh response of the transistors clips gently at high drive levels. The harmonics generated are predominantly even-order (2nd, 4th), which sound warm rather than harsh.
3. **Self-oscillation**: when k > 1 (feedback exceeds unity), the ladder self-oscillates at the cutoff frequency. Bob Moog initially considered this a malfunction. It became a defining feature.

No pure digital biquad chain reproduces this behavior without explicit nonlinear modeling — either waveshaping in the feedback path or numerical integration of the analog circuit (SPICE-level simulation or DASP).
"""
image = "lesson-images/moog_ladder_schematic.png"
image_caption = "Moog transistor ladder: 4 one-pole stages with tanh-saturating feedback."

[[en.pages]]
title   = "Self-oscillation: the Barkhausen criterion"
content = """
A filter self-oscillates when its internal feedback loop meets the **Barkhausen stability criterion**:

1. **Loop gain = 1** (or greater) at the oscillation frequency.
2. **Total loop phase = 360°** (or equivalently 0°) at that frequency.

For the Moog ladder, the four one-pole stages each contribute 90° of phase lag at cutoff, totaling 360°. When resonance feedback is strong enough to compensate the gain loss, the system oscillates.

In the Z-domain, self-oscillation corresponds to a pair of poles sitting **on** (or outside) the unit circle. A stable filter keeps its poles strictly inside.

For a 2nd-order SVF, the characteristic equation is:

```
z² - (2 - F²/2 - k·F)z + (1 - k·F/2 + F²/4) = 0
```

Self-oscillation begins when the poles reach the unit circle — at Q⁻¹ = 0 (no damping). In practice, filters clamp resonance to keep the poles just inside.

**Practical consequence for DJs:** on a DJM, if you hear a ringing tone that sustains on its own when no music is playing, you've hit the self-oscillation threshold. Pull the resonance knob back. On analog hardware (Xone:92), intentional self-oscillation at a specific cutoff frequency is a deliberate musical technique — you're playing a tone generator.
"""

[[en.pages]]
title   = "12 vs 24 dB/oct: poles, slope, and perception"
content = """
Filter order determines the slope:

- **1st-order filter**: one pole, 6 dB/oct asymptotic slope. Used for very gentle shelving.
- **2nd-order filter**: two poles, 12 dB/oct. The standard biquad, DJM default.
- **4th-order filter**: four poles, 24 dB/oct. Two cascaded biquads, or the Moog ladder.

The slope is an asymptotic approximation — it only applies well above the cutoff. In the transition band (within one octave of cutoff), both slopes are shaping the sound simultaneously with the resonance peak.

Perceptual implications:
- **12 dB/oct** at medium Q: the transition band is wide; the filter affects a whole octave of frequencies "on the way down." Smooth, musical.
- **24 dB/oct** at medium Q: the transition band is narrow; frequencies drop off sharply. Sounds controlled, precise, technical. The resonance peak is more prominent relative to the stop band.

For a DJ filter sweep, 12 dB/oct creates a slow gradual drain (cinematic); 24 dB/oct creates a sharp divide (surgical). The same BPM, the same track, the same movement — very different emotional result.
"""

