[[fr.pages]]
title   = "State-variable filter (SVF) vs biquad"
content = """
Les deux topologies numériques dominantes dans les tables DJ sont le **state-variable filter** et le **biquad**.

**Biquad (filtre bi-quadratique) :**
Le filtre IIR du 2e ordre canonique. Sa fonction de transfert dans le domaine Z :

```
H(z) = (b₀ + b₁z⁻¹ + b₂z⁻²) / (1 + a₁z⁻¹ + a₂z⁻²)
```

Les coefficients (b₀, b₁, b₂, a₁, a₂) se calculent depuis la fréquence de coupure ω₀ et Q via l'**Audio EQ Cookbook** (Robert Bristow-Johnson). Stable, peu coûteux, implémentation en forme directe II. Un défaut : **instabilité numérique à très basse fréquence de coupure** (proche de 0 Hz), où les coefficients deviennent mal conditionnés.

**State-variable filter (SVF) :**
Une topologie avec trois sorties simultanées — passe-bas (LP), passe-bande (BP), passe-haut (HP) — calculées depuis les mêmes équations différentielles :

```
LP_out[n] = LP_out[n-1] + F × BP_out[n-1]
BP_out[n] = BP_out[n-1] + F × (in[n] - LP_out[n-1] - Q⁻¹ × BP_out[n-1])
HP_out[n] = in[n] - LP_out[n-1] - Q⁻¹ × BP_out[n-1]
```

où F = 2·sin(π·fc/fs). Le SVF reste numériquement stable sur toute la plage de fréquences et gère les **sweeps à Q élevé** en douceur — c'est pourquoi il est préféré pour les filtres DJ qui doivent être balayés en temps réel.
"""

[[fr.pages]]
title   = "Le ladder à transistors Moog : la non-linéarité comme feature"
content = """
Le **ladder à transistors Moog** (Robert Moog, 1964) n'est ni un biquad ni un SVF — c'est une cascade de quatre cellules RC passe-bas un-pôle avec un **chemin de feedback de résonance** :

```
Gain de stage : G = tanh(I_s · V_in / (2V_t))   ← saturation soft-clip
Pente totale : 4 × 6 dB/oct = 24 dB/oct
Feedback : -k × sortie réinjectée à l'entrée (k = coefficient de résonance)
```

Ce qui le rend spécial :
1. **Couplage non-linéaire** : quand la fréquence de coupure change, l'impédance d'entrée de chaque stage change, ce qui module en croisé la résonance. Il n'y a pas de séparation nette entre cutoff et Q — ils se contaminent mutuellement. C'est perçu comme "organique" ou "vivant."
2. **Saturation douce** : la réponse tanh des transistors écrête doucement à fort signal. Les harmoniques générés sont surtout d'ordre pair (2e, 4e), qui sonnent chaud plutôt que dur.
3. **Self-oscillation** : quand k > 1 (le feedback dépasse l'unité), le ladder s'auto-oscille à la fréquence de coupure. Bob Moog l'a d'abord considéré comme une panne. C'est devenu une feature définissante.

Aucune chaîne biquad numérique pure ne reproduit ce comportement sans modélisation non-linéaire explicite — soit waveshaping dans la boucle de feedback, soit intégration numérique du circuit analogique (simulation SPICE ou DASP).
"""
image = "lesson-images/moog_ladder_schematic.png"
image_caption = "Ladder transistors Moog : 4 cellules un-pôle avec feedback saturant (tanh)."

[[fr.pages]]
title   = "Self-oscillation : le critère de Barkhausen"
content = """
Un filtre s'auto-oscille quand sa boucle de feedback interne satisfait le **critère de stabilité de Barkhausen** :

1. **Gain de boucle = 1** (ou plus) à la fréquence d'oscillation.
2. **Phase totale de boucle = 360°** (ou équivalemment 0°) à cette fréquence.

Pour le ladder Moog, les quatre cellules un-pôle contribuent chacune 90° de déphasage à la fréquence de coupure, soit 360° au total. Quand le feedback de résonance est assez fort pour compenser la perte de gain, le système oscille.

Dans le domaine Z, la self-oscillation correspond à une paire de pôles **sur** (ou en dehors) du cercle unité. Un filtre stable garde ses pôles strictement à l'intérieur.

Pour un SVF du 2e ordre, l'équation caractéristique est :

```
z² - (2 - F²/2 - k·F)z + (1 - k·F/2 + F²/4) = 0
```

La self-oscillation commence quand les pôles atteignent le cercle unité — à Q⁻¹ = 0 (pas d'amortissement). En pratique, les filtres clampent la résonance pour garder les pôles juste à l'intérieur.

**Conséquence pratique pour les DJs :** sur un DJM, si tu entends un son qui tient tout seul sans musique, tu as atteint le seuil d'auto-oscillation. Recule le knob de résonance. Sur du matériel analogique (Xone:92), la self-oscillation intentionnelle à une fréquence de coupure précise est une technique musicale délibérée — tu joues un générateur de tonalité.
"""

[[fr.pages]]
title   = "12 vs 24 dB/oct : pôles, pente et perception"
content = """
L'ordre du filtre détermine la pente :

- **Filtre du 1er ordre** : un pôle, pente asymptotique de 6 dB/oct. Pour les shelving très doux.
- **Filtre du 2e ordre** : deux pôles, 12 dB/oct. Le biquad standard, défaut DJM.
- **Filtre du 4e ordre** : quatre pôles, 24 dB/oct. Deux biquads en cascade, ou le ladder Moog.

La pente est une approximation asymptotique — elle ne s'applique vraiment qu'au-delà du cutoff. Dans la bande de transition (moins d'une octave du cutoff), les deux pentes sculptent le son simultanément avec le pic de résonance.

Implications perceptuelles :
- **12 dB/oct** à Q moyen : la bande de transition est large ; le filtre affecte une octave entière de fréquences "en descendant." Lisse, musical.
- **24 dB/oct** à Q moyen : la bande de transition est étroite ; les fréquences chutent abruptement. Contrôlé, précis, technique. Le pic de résonance est plus proéminent par rapport à la bande atténuée.

Pour un sweep de filtre DJ, 12 dB/oct crée une vidange lente et graduelle (cinématographique) ; 24 dB/oct crée une division nette (chirurgicale). Même BPM, même track, même mouvement — résultat émotionnel très différent.
"""

