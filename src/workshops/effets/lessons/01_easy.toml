[en]
title      = "The Filter: What Your Ears Hear"
short_desc = "One knob, two directions. Learn what changes when you turn it."
description = "Imagine a window blind on the sound. Pull it down: the bright sunshine (highs) disappears first, leaving only the warmth of the low light (bass). That's a lowpass filter."
recap = [
  "A filter is like a blind: lower it and the highs disappear, leaving only the bass.",
  "Turn the knob left = lowpass (bass stays), turn right = highpass (bass disappears).",
  "The kick anchors the crowd even when everything else is filtered out.",
  "Slowly opening the filter after a long sweep feels like a drop — without changing the BPM.",
  "Overuse is the enemy: reserve the filter for one big move per transition.",
]

[[en.pages]]
title   = "The window blind analogy"
content = """
Picture the full sound of a track as sunlight pouring through a window. A **lowpass filter** is a blind you slowly pull down:

- First the **treble** disappears (hi-hats, cymbals, the sparkle).
- Then the **mids** fade (snare, bass guitar, vocals).
- Eventually all that's left is the **bass and kick** — the heartbeat.

A **highpass filter** is the reverse: lift the blind from the bottom and you cut the bass and kick first.

The single knob on your DJ mixer does both: **left = lowpass, right = highpass, center = full sound**.
"""
image = "lesson-images/filter_blind_analogy.png"
image_caption = "Lowpass: pulling the blind down removes highs first."

[[en.pages]]
title   = "What you actually hear"
content = """
Try this in your head: you're on the dancefloor. The DJ slowly closes a lowpass filter on the track.

1. The hi-hats get quieter and softer.
2. The snare becomes a dull thud.
3. Only the kick and deep bass are left — the floor is vibrating, nothing else.

Then the DJ opens the filter quickly. The full track floods back in. The crowd feels it like a drop — even though the DJ didn't add any new music.

**That contrast is free. That's the power of the filter.**
"""

[[en.pages]]
title   = "One rule to start"
content = """
The filter is the most powerful single-knob move in DJing — which also means it's the easiest to overuse.

**Rule for beginners:** use the filter on **one transition per set**, maximum. Make it the moment you've been building toward.

When the DJ next to you uses it on every song, the crowd stops reacting. When you save it for the peak moment, it hits like a fist.

A good way to practice: listen to a track at home, pick the moment where you'd open the filter, and commit to it.
"""

[[en.quiz]]
question = "Lowpass filter: what disappears first when you close it?"
answers  = ["The bass and kick", "The hi-hats and cymbals", "The BPM"]
correct  = 1

[[en.quiz]]
question = "Why does opening a filter suddenly feel like a drop?"
answers  = ["The BPM changes", "New sounds are added", "The full spectrum floods back after being drained"]
correct  = 2

[[en.quiz]]
question = "What's the risk of using the filter on every transition?"
answers  = ["It damages the speakers", "The crowd stops reacting — the effect loses its power", "The BPM becomes unstable"]
correct  = 1

