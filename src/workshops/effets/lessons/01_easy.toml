[fr]
title      = "Le Filtre : Ce Que Tu Entends"
short_desc = "Un seul knob, deux directions. Écoute ce qui change quand tu tournes."
description = "Imagine un volet devant le son. Baisse-le : le soleil brillant (les aigus) disparaît en premier, ne laissant que la chaleur des basses lumières. C'est un filtre passe-bas."
recap = [
  "Le filtre c'est un volet : ferme-le et les aigus disparaissent, il reste les basses.",
  "Knob à gauche = passe-bas (les basses restent), à droite = passe-haut (les basses disparaissent).",
  "Le kick ancre la piste même quand tout le reste est filtré.",
  "Ouvrir doucement un filtre après un long sweep fait l'effet d'un drop — sans changer le BPM.",
  "La surutilisation tue l'effet : réserve le filtre pour un grand geste par transition.",
]

[[fr.pages]]
title   = "L'analogie du volet"
content = """
Imagine le son complet d'une track comme le soleil qui entre par une fenêtre. Un **filtre passe-bas**, c'est un volet que tu descends lentement :

- D'abord les **aigus** disparaissent (hi-hats, cymbales, le brillant).
- Puis les **mids** s'effacent (caisse claire, basse, voix).
- Il reste finalement que les **basses et le kick** — le battement de cœur.

Un **filtre passe-haut** est l'inverse : tu lèves le volet par le bas et tu coupes d'abord les graves et le kick.

Le seul knob sur ta table DJ fait les deux : **gauche = passe-bas, droite = passe-haut, centre = son complet**.
"""
image = "lesson-images/filter_blind_analogy.png"
image_caption = "Passe-bas : baisser le volet retire d'abord les aigus."

[[fr.pages]]
title   = "Ce que tu entends vraiment"
content = """
Essaie dans ta tête : tu es sur la dancefloor. Le DJ ferme lentement un filtre passe-bas sur la track.

1. Les hi-hats deviennent plus silencieux et plus doux.
2. La caisse claire devient un coup sourd.
3. Il reste seulement le kick et les basses profondes — le sol vibre, rien d'autre.

Puis le DJ ouvre le filtre d'un coup. Le son complet revient. Le public ressent un drop — même si le DJ n'a rien ajouté de nouveau.

**Ce contraste est gratuit. Voilà le pouvoir du filtre.**
"""

[[fr.pages]]
title   = "Une règle pour commencer"
content = """
Le filtre est le geste à un seul knob le plus puissant du DJing — ce qui veut dire que c'est aussi le plus facile à abuser.

**Règle pour les débutants :** utilise le filtre sur **une transition par set**, maximum. Fais-en le moment que tu construis depuis le début.

Quand le DJ à côté l'utilise sur chaque morceau, le public arrête de réagir. Quand tu le gardes pour le moment clé, ça frappe comme un poing.

Un bon exercice : écoute une track chez toi, choisis l'instant où tu ouvrirais le filtre, et engage-toi.
"""

[[fr.quiz]]
question = "Filtre passe-bas : qu'est-ce qui disparaît en premier quand tu le fermes ?"
answers  = ["Les basses et le kick", "Les hi-hats et les cymbales", "Le BPM"]
correct  = 1

[[fr.quiz]]
question = "Pourquoi ouvrir un filtre d'un coup donne l'effet d'un drop ?"
answers  = ["Le BPM change", "Des sons nouveaux s'ajoutent", "Le spectre complet revient après avoir été vidé"]
correct  = 2

[[fr.quiz]]
question = "Quel est le risque d'utiliser le filtre à chaque transition ?"
answers  = ["Ça abîme les enceintes", "Le public arrête de réagir — l'effet perd sa force", "Le BPM devient instable"]
