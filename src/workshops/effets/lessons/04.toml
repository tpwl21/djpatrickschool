[en]
title       = "Loop Rolls: The Beat Repeat"
short_desc  = "Controlled stutter. The signature glitch of modern DJing."
description = "A loop roll holds a tiny slice of the track and loops it. Used well, it tightens tension; used badly, it's pure panic."
recap = [
  "A loop roll captures N beats and replays them until you release.",
  "1/4 = machine-gun, 1/8 = edgy, 1/16–1/32 = glitch (loop perceived as pitch, not rhythm).",
  "The track's real position keeps advancing — release jumps you to where you WOULD be.",
  "Use on tension bars (pre-drop, outro), never to cover a bad beatmatch.",
  "The craft is in the release: land on the 1 of the next bar or it's mush."
]

[[en.pages]]
title   = "What a loop roll actually does"
content = "A loop roll grabs a window of N beats and replays it until you release. 1/4 beat feels like a machine-gun stutter. 1/8 is edgier. 1/16 and 1/32 are pure glitch — the loop is so short the brain perceives it as pitch, not rhythm. The key technical detail: when you engage the roll, the track's 'real' position keeps moving in the background. When you release, the playhead jumps to where the track WOULD be — so the loop roll acts like pause + fast-forward baked into one gesture."

[[en.pages]]
title   = "Quantize, pitch bend and key-lock"
content = """
Two interactions to know. **Loop roll + pitch bend**: while holding a 1/16 loop, push the jog wheel or nudge the pitch — you get a micro-sub-divide glitch that feels like a DnB edit. **Quantize setting**: if quantize is OFF, the loop starts wherever the playhead is — expect sloppy edges. If quantize is on 1 beat, the roll starts on the nearest beat even if you press between beats. Set quantize to 1/4 beat for fast glitch work, 1 beat for tension moments. **Master Tempo** matters too: with key-lock off, a pitched-up track changes the perceived tone of very short loops — some DJs exploit this deliberately.
"""

[[en.pages]]
title   = "When to use it, when not to"
content = "Use it: on the last bar before a drop (tighten the tension), on an outro last phrase (signature exit), and during buildups to mechanize them. Don't use it: to 'cover' a bad beatmatch (the crowd hears the stutter and your mistake), or as ear-candy on every other phrase. Bass-music sets use it often and fast; techno usually uses it sparingly — one or two well-placed rolls per hour land harder than ten."

[[en.pages]]
title   = "The 'release' is where the craft lives"
content = "Anyone can press a pad. The skill is in when you release. Release on the 1 of the next bar = tight. Release in the middle of a loop cycle = glitched mess. Practice: hold the loop, count the beats silently, release on the 1. Your brain must stay locked to the original grid even though your ears are hearing the stutter. That gap between what you see and what you hear is why this is a skill, not just a button."

[fr]
title       = "Loop Rolls : Le Beat Repeat"
short_desc  = "Stutter contrôlé. Le glitch signature du DJ moderne."
description = "Un loop roll tient un micro-bout de la track et le boucle. Bien utilisé, ça tend la tension ; mal utilisé, c'est de la panique."
recap = [
  "Un loop roll capture N beats et les rejoue jusqu'à ce que tu relâches.",
  "1/4 = mitrailleuse, 1/8 = nerveux, 1/16–1/32 = glitch (boucle perçue comme hauteur, pas rythme).",
  "La position réelle de la track continue d'avancer — le release saute où tu SERAIS.",
  "À utiliser sur les mesures de tension (pré-drop, outro), jamais pour cacher un beatmatch raté.",
  "Le craft est dans le release : tombe sur le 1 de la mesure suivante, sinon c'est de la bouillie."
]

[[fr.pages]]
title   = "Ce que fait vraiment un loop roll"
content = "Un loop roll prend une fenêtre de N beats et la rejoue jusqu'à ce que tu relâches. 1/4 beat ça fait mitrailleuse. 1/8 c'est plus nerveux. 1/16 et 1/32, pure glitch — la boucle est tellement courte que le cerveau la perçoit comme une hauteur, plus comme un rythme. Le détail technique clé : quand tu engages le roll, la position 'réelle' de la track continue d'avancer en arrière-plan. Quand tu relâches, la tête de lecture saute où la track SERAIT — donc un loop roll c'est pause + avance rapide dans un même geste."

[[fr.pages]]
title   = "Quantize, pitch bend et key-lock"
content = """
Deux interactions à connaître. **Loop roll + pitch bend** : pendant que tu tiens une boucle 1/16, pousse le jog ou nudge le pitch — tu obtiens un micro-sub-divide glitch qui sonne comme un edit DnB. **Réglage quantize** : si quantize est OFF, la boucle démarre là où est la tête de lecture — bords sales assurés. Quantize à 1 beat, le roll démarre sur le beat le plus proche même si tu appuies entre deux. Règle quantize sur 1/4 beat pour le glitch rapide, 1 beat pour les moments de tension. **Master Tempo** compte aussi : key-lock off, une track pitchée change le timbre perçu des très courtes boucles — certains DJs exploitent ça volontairement.
"""

[[fr.pages]]
title   = "Quand l'utiliser, quand ne pas"
content = "À utiliser : sur la dernière mesure avant un drop (tendre la tension), sur la dernière phrase d'un outro (sortie signature), pendant les builds pour les mécaniser. À ne pas faire : pour 'cacher' un beatmatch raté (le public entend le stutter ET ta faute), ou comme bonbon sonore sur une phrase sur deux. Les sets bass l'utilisent souvent et vite ; la techno l'utilise plutôt avec parcimonie — un ou deux rolls bien placés par heure frappent plus fort que dix."

[[fr.pages]]
title   = "Le 'release' est le cœur du geste"
content = "N'importe qui peut appuyer sur un pad. Le skill c'est quand tu relâches. Release sur le 1 de la mesure suivante = net. Release au milieu d'un cycle = bouillie glitchée. Pratique : tiens la boucle, compte les beats dans ta tête, relâche sur le 1. Ton cerveau doit rester calé sur la grille d'origine même si tes oreilles entendent le stutter. Cet écart entre ce que tu vois et ce que tu entends, c'est ce qui fait du geste un skill, pas juste un bouton."

