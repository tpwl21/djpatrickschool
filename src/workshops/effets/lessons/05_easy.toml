[fr]
title      = "FX Chain : L'Ordre Change Tout"
short_desc = "Mêmes effets, ordre différent, son différent."
description = "Les effets sont comme les étapes d'une recette : change l'ordre et tu obtiens autre chose. Connaître l'ordre habituel d'une table DJ t'évite les mauvaises surprises."
recap = [
  "L'ordre des effets change le son, comme l'ordre des ingrédients dans une recette.",
  "Un ordre courant sur une table DJ : EQ, puis filtre, puis delay ou reverb, puis fader de volume.",
  "Delay et reverb travaillent en général sur une copie du son (un send), remixée avec l'original.",
  "Baisser le fader de volume ne coupe pas toujours la queue d'écho de la même façon selon la table.",
  "Teste ta table avec une boucle avant le gig.",
]

[[fr.pages]]
title   = "Les chaussettes, puis les chaussures"
content = """
Chaussettes puis chaussures : ça va. Chaussures puis chaussettes : pas du tout le même résultat.

Les effets, c'est pareil. Le son les traverse l'un après l'autre, et chacun travaille sur ce que le précédent lui donne. Donc **l'ordre change le son**.

Exemple : un delay placé **après** un filtre répète le son filtré (sourd, sans aigus). Un delay placé **avant** le filtre répète le son d'origine, et ensuite le filtre assombrit aussi les échos.
"""

[[fr.pages]]
title   = "Le chemin habituel dans la table"
content = """
Sur beaucoup de tables DJ, le son suit ce chemin pour chaque canal :

1. **EQ** (graves, médiums, aigus) : tu façonnes la track.
2. **Filtre** : tu retires les aigus ou les graves avec un seul potard.
3. **Delay ou reverb** : tu ajoutes des échos ou de l'espace.
4. **Fader de volume** : tu décides ce qui part vers les enceintes.

Delay et reverb sont particuliers : ils travaillent sur une **copie** du son (qu'on appelle un **send**). L'original continue de jouer, et tu remixes la copie avec le potard « wet / dry » ou « level ». C'est pour ça que tu peux monter l'effet sans perdre ton kick.
"""

[[fr.pages]]
title   = "Teste avant le gig"
content = """
Chaque table est un peu différente. Un petit test de 2 minutes évite beaucoup de stress :

1. Lance une boucle sur une platine.
2. Active un écho (delay).
3. Tourne le potard de filtre et écoute : est-ce que les échos changent avec le filtre, ou restent pareils ?
4. Baisse le fader de volume : la queue d'écho reste-t-elle ou disparaît-elle ?

Si tu connais les réponses, tu peux utiliser l'écho comme un outil et pas comme une surprise. Retiens-le : « ma table fait ça ».
"""

