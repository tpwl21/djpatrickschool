[en]
title      = "FX Chain: Order Matters"
short_desc = "Same effects, different order, different sound."
description = "Effects are like steps in a recipe: change the order and you get something else. Knowing the usual order on a DJ mixer saves you from surprises."
recap = [
  "The order of effects changes the sound, just like the order of ingredients in a recipe.",
  "A common order on a DJ mixer: EQ, then filter, then delay or reverb, then the volume fader.",
  "Delay and reverb usually work on a copy of the sound (a send), mixed back with the original.",
  "Pulling the volume fader does not always cut the echo tail the same way on every mixer.",
  "Test your own mixer with a loop before the gig.",
]

[[en.pages]]
title   = "Socks, then shoes"
content = """
Put on socks, then shoes: fine. Shoes, then socks: not the same result at all.

Effects work the same way. The sound goes through them one after the other, and each one works on what the previous one gave it. So **the order changes the sound**.

Example: a delay that comes **after** a filter repeats the filtered sound (dull, with no highs). A delay that comes **before** the filter repeats the original sound, and then the filter dims the echoes too.
"""

[[en.pages]]
title   = "The usual road through the mixer"
content = """
On many DJ mixers, the sound follows this road for each channel:

1. **EQ** (low, mid, high): you shape the track.
2. **Filter**: you remove highs or lows with one knob.
3. **Delay or reverb**: you add echoes or space.
4. **Volume fader**: you decide how much goes to the speakers.

Delay and reverb are special: they work on a **copy** of the sound (called a **send**). The original keeps playing, and you mix the effect copy back in with the "wet / dry" or "level" knob. That's why you can turn the effect up without losing your kick.
"""

[[en.pages]]
title   = "Test it before the gig"
content = """
Every mixer is a little different. A quick test, 2 minutes, saves a lot of stress:

1. Start a loop on a deck.
2. Turn on an echo (delay).
3. Turn the filter knob and listen: do the echoes change with the filter, or stay the same?
4. Pull the volume fader down: does the echo tail stay or vanish?

If you know the answers, you can use the echo as a tool and not as a surprise. Write them down in your head: "my mixer does this".
"""

[[en.quiz]]
question = "Why does the order of effects matter?"
answers  = ["Each effect works on what the previous one gave it, so the sound changes", "Because the mixer breaks otherwise", "It doesn't matter"]
correct  = 0

[[en.quiz]]
question = "What is a send?"
