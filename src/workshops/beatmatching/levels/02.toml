[en]
title       = "Engine Control"
short_desc  = "Train B is rolling at a different tempo. Pitch it up or down to match Train A."
description = "Train B is playing at a different fixed tempo. Ride the pitch to match Train A perfectly!"
details     = "Focus: Riding the pitch fader. 120 vs 135 BPM."
success     = "Pitch master! Two different tempos and you locked them in. True pro vibes!"
coach_tips  = [
  "Same deal, drop Train B on the one.",
  "Not working? Yeah, Train B is at the wrong tempo, I won't always be here to hold your hand.",
  "Ride the Pitch fader to slow it down or speed it up. Hit CUE if you need to pull it back to the start.",
  "PRO TIP: Save yourself a headache—match your BPM before you drop Train B, so you don't end up trainwrecking."
]
recap = [
  "Different BPMs = drift. The pitch fader speeds up or slows down deck B.",
  "Match the BPM first, THEN drop Train B — don't fight two problems at once.",
  "CUE is your reset: adjust pitch, CUE, try again.",
  "A stable BPM match is the foundation of every other beatmatching technique."
]

[fr]
