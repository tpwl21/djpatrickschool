[[en.pages]]
title   = "Tempo in the machine: ticks, drift, and mechanical limits"
content = """
Inside a DAW, tempo is not stored as BPM but as **microseconds per beat** (MIDI standard: 480,000 μs = 120 BPM). Ableton works at **tick resolution**: 1/960th of a quarter note, roughly 0.52 ms at 120 BPM. This gives sub-millisecond alignment accuracy — far below human perception thresholds.

Vinyl turntables are the opposite: the platter is driven by an AC motor, and its speed drifts with motor load, stylus friction, and platter weight distribution. A standard 1200 has a quartz-locked motor, but even quartz-locked decks exhibit ~±0.1 BPM drift over the duration of a record. That's why vinyl DJs micro-nudge constantly — they're compensating for real mechanical variation, not just phase errors.

CDJs solve this with a digital motor simulator (the platter is a rotary encoder, not a true motor driving a spindle), but older firmware had similar timing jitter on the USB read buffer, especially with high-resolution waveform rendering enabled.

**Implication**: when you're told a track is "120 BPM", that is an *approximation*. On vinyl it's a statistical mean. In a well-produced DAW session it's accurate to microseconds. Know which world you're operating in.
"""

[[en.pages]]
title   = "Beat-tracking algorithms: how BPM detection actually works"
content = """
BPM auto-detection is a two-stage DSP pipeline:

## 1. Onset detection

The goal is to find moments of energy increase — kick attacks, snare hits, hi-hat transients. Methods include:
- **Spectral flux**: measure the difference between consecutive STFT frames; positive flux = onset candidate
- **HFC (High Frequency Content)**: weight higher spectral bins more heavily — good for percussive attacks
- **Phase deviation**: detect where spectral bin phases change unexpectedly (used by Brossier / aubio)

## 2. Tempo estimation

Given a list of onset times, estimate the underlying period. Common approaches:
- **Autocorrelation**: convolve the onset function with itself at varying lags; peaks in the autocorrelation indicate likely periods. Efficient, works well for steady tempos
- **Comb filter bank**: apply a bank of resonators tuned to different BPMs; whichever resonates strongest wins (used in early Scheirer 1998 work)
- **Dynamic programming beat-tracking** (Dixon 2001, Davies & Plumbley 2007): track beat positions forward in time using a cost function that penalizes large deviations from expected inter-beat interval

**Failure modes**:
- Swung grooves: the inter-onset interval is uneven — the mean period is the correct BPM but the autocorrelation shows two distinct shorter periods
- Half-time: the kick falls every 2 beats, not 4 — autocorrelation peak at 2× the true BPM is strong
- Polyrhythm: onset function has competing periods; the strongest wins, which may be wrong
- High-density textures (reverb tails, dense chords): onset function is noisy, many false positives
"""
youtube = "x3ZqFBMTkE8"
youtube_start = 0
youtube_caption = "Juan Pablo Bello — Music Information Retrieval lecture: beat tracking (New York University)"

[[en.pages]]
title   = "WSOLA and the phase vocoder: decoupling pitch from tempo"
content = """
**Key Lock / Master Tempo** requires changing the playback rate without changing perceived pitch. This is the time-scale modification (TSM) problem, and there are two dominant solutions.

## WSOLA (Waveform-Similarity Overlap-Add)

Algorithm (Verhelst & Roelands 1993, refined by Driedger & Müller 2016):
1. Slice the input audio into overlapping frames of length *N* (typically 1024–4096 samples)
2. For each output frame position, find the input frame whose waveform best matches the previous output frame's tail — measured by cross-correlation in a search window of ±*Δmax* samples
3. Overlap-add the selected frames into the output at the target rate

The search step is what makes WSOLA "waveform-similarity" — it minimizes phase discontinuities at splice points. This works well for **steady tonal content** up to about ±8–10% rate change.

**Artifacts above ±10%**: the cross-correlation can't find good matches, splice points become audible as transient smearing (the attack of a kick is spread over several frames).

## Phase Vocoder

Algorithm (Flanagan & Golden 1966, improved by Laroche & Dolson 1999):
1. Compute STFT of input (Short-Time Fourier Transform)
2. Scale the time axis of the STFT by the target rate ratio
3. Resynthesize via inverse STFT

Pitch is preserved because the frequency content of each bin is unchanged; only the time positions of frames change.

**Laroche-Dolson phase locking** (1999): in the standard phase vocoder, peaks in the spectrum "rotate" at different speeds, causing metallic/phasey artifacts on sustained notes. Phase locking groups bins around spectral peaks and rotates them as a unit — dramatically reducing the artifact at the cost of additional computation.

## Trade-offs

| | WSOLA | Phase Vocoder |
|---|---|---|
| Quality on percussives | Good | Metallic artifacts |
| Quality on sustained tones | OK | Good (with phase locking) |
| Computational cost | Low | Higher |
| Latency | Low | Higher (full STFT frame) |

This project's audio engine uses WSOLA for Key Lock (see `src/audio/` — an AudioWorklet implementation). Above ±8%, expect transient smearing.
"""

