[[fr.pages]]
title   = "Le tempo dans la machine : ticks, dérive et limites mécaniques"
content = """
Dans un DAW, le tempo n'est pas stocké en BPM mais en **microsecondes par beat** (standard MIDI : 480 000 μs = 120 BPM). Ableton travaille à la **résolution des ticks** : 1/960e de noire, soit environ 0,52 ms à 120 BPM. Cela permet un calage sub-millisecondes — bien en dessous des seuils de perception humaine.

Les platines vinyle sont l'opposé : le plateau est entraîné par un moteur AC, et sa vitesse dérive avec la charge moteur, la friction du saphir et la distribution du poids du plateau. Une 1200 standard a un moteur à quartz, mais même les decks à quartz présentent ~±0,1 BPM de dérive sur la durée d'un disque. C'est pour ça que les DJs vinyle micro-nudgent constamment — ils compensent une vraie variation mécanique, pas seulement des erreurs de phase.

Les CDJ résolvent ça avec un simulateur de moteur numérique (le plateau est un encodeur rotatif, pas un vrai moteur), mais les anciennes versions de firmware avaient une gigue temporelle similaire sur le buffer de lecture USB, surtout avec le rendu de forme d'onde haute résolution activé.

**Implication** : quand on te dit qu'un morceau est à "120 BPM", c'est une *approximation*. Sur vinyle c'est une moyenne statistique. Dans une session MAO bien produite c'est précis à la microseconde. Sache dans quel monde tu opères.
"""

[[fr.pages]]
title   = "Algorithmes de beat-tracking : comment la détection BPM fonctionne vraiment"
content = """
La détection BPM auto est un pipeline DSP en deux étapes :

## 1. Détection d'onset

Le but est de trouver les moments d'augmentation d'énergie — attaques de kick, hits de snare, transitoires de hi-hat. Méthodes :
- **Flux spectral** : mesurer la différence entre frames STFT consécutives ; flux positif = candidat onset
- **HFC (High Frequency Content)** : pondérer plus fortement les bins spectraux hauts — bon pour les attaques percussives
- **Déviation de phase** : détecter où les phases des bins spectraux changent inopinément (utilisé par Brossier / aubio)

## 2. Estimation du tempo

Étant donné une liste de temps d'onset, estimer la période sous-jacente. Approches courantes :
- **Autocorrélation** : convoluer la fonction d'onset avec elle-même à différents décalages ; les pics dans l'autocorrélation indiquent des périodes probables. Efficace, fonctionne bien pour des tempos stables
- **Banc de filtres en peigne** : appliquer une banque de résonateurs accordés à différents BPMs ; celui qui résonne le plus fort gagne (utilisé dans les travaux Scheirer 1998)
- **Beat-tracking par programmation dynamique** (Dixon 2001, Davies & Plumbley 2007) : tracker les positions de beat dans le temps avec une fonction de coût qui pénalise les grands écarts à l'intervalle inter-beat attendu

**Modes d'échec** :
- Grooves swingués : l'intervalle inter-onset est inégal — la période moyenne est le bon BPM mais l'autocorrélation montre deux périodes courtes distinctes
- Half-time : le kick tombe tous les 2 beats — le pic d'autocorrélation à 2× le BPM réel est fort
- Polyrythmie : la fonction d'onset a des périodes concurrentes ; la plus forte gagne, ce qui peut être faux
- Textures denses (queues de reverb, accords denses) : la fonction d'onset est bruitée, beaucoup de faux positifs
"""
youtube = "x3ZqFBMTkE8"
youtube_start = 0
youtube_caption = "Juan Pablo Bello — Cours MIR : beat tracking (New York University)"

[[fr.pages]]
title   = "WSOLA et le phase vocoder : découpler le pitch du tempo"
content = """
**Key Lock / Master Tempo** nécessite de changer le rate de lecture sans changer le pitch perçu. C'est le problème de modification temporelle (TSM), et il y a deux solutions dominantes.

## WSOLA (Waveform-Similarity Overlap-Add)

Algorithme (Verhelst & Roelands 1993, affiné par Driedger & Müller 2016) :
1. Découper l'audio d'entrée en frames recouvrantes de longueur *N* (typiquement 1024–4096 samples)
2. Pour chaque position de frame de sortie, trouver la frame d'entrée dont la forme d'onde correspond le mieux à la queue de la frame de sortie précédente — mesurée par cross-corrélation dans une fenêtre de recherche de ±*Δmax* samples
3. Overlap-add les frames sélectionnées dans la sortie au rate cible

L'étape de recherche est ce qui rend WSOLA "waveform-similarity" — elle minimise les discontinuités de phase aux jointures. Fonctionne bien pour **contenu tonal stable** jusqu'à environ ±8–10% de changement de rate.

**Artefacts au-delà de ±10%** : la cross-corrélation ne trouve plus de bonnes correspondances, les jointures deviennent audibles comme étalement des transitoires.

## Phase Vocoder

Algorithme (Flanagan & Golden 1966, amélioré par Laroche & Dolson 1999) :
1. Calculer la STFT de l'entrée
2. Mettre à l'échelle l'axe temporel de la STFT par le ratio de rate cible
3. Resynthétiser par STFT inverse

Le pitch est préservé car le contenu fréquentiel de chaque bin est inchangé ; seules les positions temporelles des frames changent.

**Phase locking Laroche-Dolson** (1999) : dans le phase vocoder standard, les pics spectraux "tournent" à des vitesses différentes, causant des artefacts métalliques/phasés sur les notes tenues. Le phase locking groupe les bins autour des pics spectraux et les fait tourner comme une unité — réduit dramatiquement l'artefact au prix d'un calcul supplémentaire.

## Comparaison

| | WSOLA | Phase Vocoder |
|---|---|---|
| Qualité sur percussions | Bonne | Artefacts métalliques |
| Qualité sur sons tenus | Correcte | Bonne (avec phase locking) |
| Coût calcul | Faible | Plus élevé |
| Latence | Faible | Plus élevée (frame STFT complète) |

Le moteur audio de ce projet utilise WSOLA pour le Key Lock (cf. `src/audio/` — une implémentation AudioWorklet). Au-delà de ±8%, attend-toi à un étalement des transitoires.
"""

