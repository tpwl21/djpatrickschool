[[en.pages]]
title   = "Perceptual entrainment: why 120 BPM locks the brain"
content = """
The dominance of 120 BPM in electronic dance music is not arbitrary taste — it has a neurophysiological basis.

**Sensorimotor synchronization** (tapping to a beat) is most accurate and automatic in the range of **1.5–3 Hz** (90–180 BPM), with a peak around 2 Hz (120 BPM). Outside this range, synchronization requires more cognitive effort and timing errors increase. This is documented extensively in Repp & Su (2013) and earlier in Fraisse (1982).

The reason: the cerebellum, basal ganglia, and supplementary motor area form a timing circuit that generates an internal period. When an external beat matches this period, error correction is minimal and the body "falls into" the pulse. This is dance floor entrainment — not metaphor, actual neuroscience.

**Implication for DJs**: transient breaks from the kick pattern (half-time drops, rhythmic breakdowns) work on the dance floor *because* the audience's motor system keeps the internal pulse running — they are still moving even when the kick disappears, because entrainment persists for several seconds after the external signal stops. This is why a well-placed breakdown feels like tension, not confusion.

## Isochrony and groove

Pure four-on-the-floor is *isochronous* — perfectly even spacing. Many grooves deviate slightly: the **swing ratio** (ratio of long to short subdivision in a triplet or dotted-note pattern) adds humanity. A 50/50 ratio is straight; 67/33 is a triplet feel (shuffle). DJ software typically stores swing as a percentage deviation from isochrony.

Mixing a swung groove with a straight groove at the same BPM will still produce a subtle rhythm clash even when perfectly phase-locked.
"""

[[en.pages]]
title   = "Haas effect, phase resolution, and the flam in detail"
content = """
The **Haas effect** (also: precedence effect, Wallach et al. 1949) describes how the auditory system fuses spatially coincident sounds arriving within ~35 ms as a single event. The DJ-relevant threshold is much smaller.

For **non-spatialised, monaural** transients (club speaker playback, mono sum):
- **< 1 ms**: complete fusion — heard as one attack
- **1–5 ms**: **fusion with coloration** — the combined transient has a comb-filtered quality; this is the beginning of the audible flam
- **5–40 ms**: **two distinct events** — a clear flam or echo
- **> 40 ms**: clearly a separate event (delay/reverb territory)

At 120 BPM, 1 beat = 500 ms. The 5 ms threshold = **1% of a beat**. In beats-per-minute terms: a phase error that produces a 5 ms flam corresponds to a BPM error of 0.01 BPM at 120 — far below any digital display resolution.

**What this means in practice**: a digitally perfect BPM match does not guarantee a clean mix. Phase drift of even 2–3 ms produces audible coloration. This is why experienced DJs nudge after locking BPM — they're correcting a phase error that the BPM display cannot show.

## Interaural vs. monaural thresholds

Human interaural time discrimination (detecting which ear a sound arrives at first) resolves to ~10–20 μs. Monaural flutter detection (what you hear in a DJ booth) is coarser: ~1–2 ms for trained listeners. DJ software with real-time phase meters can show this, but the final judge is always the ear.
"""

[[en.pages]]
title   = "Hypermeter, anacrusis, AABA, and structural edge cases"
content = """
## Hypermeter

A **hypermeasure** is a group of bars that function as a single macro-unit. In most house/techno, four 4/4 bars form a **4-bar hypermeasure**, and eight 4/4 bars form an **8-bar hypermeasure** (= one DJ phrase). The "big beat" you feel every 4 bars is hypermeter in action.

This framing is useful for understanding why **fills and risebars** feel obligatory at bar 4 and bar 8 of a phrase: they are the hypermetric accents — the downbeats at the hypermeasure level. Miss them and the listener feels structural displacement.

## Anacrusis

An **anacrusis** (upbeat, pickup) is a note or motif that begins *before* the first downbeat of a phrase. In rock and jazz, a vocal pickup ("in the jungle, the mighty jungle...") lands before beat 1 of the verse. In DJ music, anacrusis is rare but present:
- **Open hi-hat on beat 4** of the last bar, leading into the phrase: functions as an anacrusis to the incoming phrase
- **Pitch riser** starting 2 beats before the phrase boundary: classic producer technique, creates the anacrusis effect digitally
- **Cue point** set on the anacrusis rather than beat 1: advanced DJs use this for tighter phrase-aligned drops

## AABA form

The **AABA** structure (Tin Pan Alley, jazz standards: 32-bar form with 8+8+8+8) maps surprisingly well onto the DJ track layout:

| AABA | DJ structure |
|---|---|
| A (bars 1–8) | Intro / first build phrase |
| A (bars 9–16) | Drop |
| B (bars 17–24) | Break (the "bridge" — different energy) |
| A (bars 25–32) | Return / outro |

Understanding AABA helps when cueing unfamiliar tracks: the B section (break) is structurally obligated to resolve back to A. It cannot extend indefinitely. This is why a DJ can predict, without having heard a track before, that the break will end in approximately 8–16 bars.

## Half-time feel

In **half-time** grooves (common in D&B, trap, and some nu-metal influenced tracks), the snare is displaced from beats 2 and 4 to beat **3 only** — effectively halving the perceived tempo without changing the BPM. At 170 BPM (D&B), the half-time feel makes the perceived pulse feel like 85 BPM. Beat-tracking algorithms routinely misread this as 85 BPM. The fix: tap-tempo or manually inspect the kick pattern.

## Polyrhythm edge cases

- **Hemiola (3:2)**: three notes in the time of two — creates a cross-rhythm against the 4/4 kick. Common in Afro-Cuban and some techno breakdowns
- **Metric modulation**: the tempo of one layer becomes the new pulse of the whole track (e.g., the triplet subdivision becomes the new quarter note). Rare in DJ music, present in some jazz-influenced broken beat
- **Polytempo**: two layers genuinely at different BPMs simultaneously — almost absent in mixable DJ music, but present in some experimental/industrial tracks
"""

