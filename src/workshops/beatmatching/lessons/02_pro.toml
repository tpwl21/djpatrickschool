[[fr.pages]]
title   = "Entraînement perceptuel : pourquoi 120 BPM verrouille le cerveau"
content = """
La domination du 120 BPM dans la musique électronique de danse n'est pas un goût arbitraire — elle a une base neurophysiologique.

La **synchronisation sensorimotrice** (taper sur un beat) est la plus précise et automatique dans la plage de **1,5–3 Hz** (90–180 BPM), avec un pic autour de 2 Hz (120 BPM). En dehors de cette plage, la synchronisation demande plus d'effort cognitif et les erreurs de timing augmentent. C'est documenté dans Repp & Su (2013) et plus tôt dans Fraisse (1982).

La raison : le cervelet, les ganglions de la base et l'aire motrice supplémentaire forment un circuit de temporisation qui génère une période interne. Quand un beat externe correspond à cette période, la correction d'erreur est minimale et le corps "tombe" dans la pulsation. C'est l'entraînement de dance floor — pas une métaphore, de la vraie neuroscience.

**Implication pour les DJs** : les pauses transitoires dans le pattern de kick (drops half-time, breakdowns rythmiques) fonctionnent sur le dance floor *parce que* le système moteur du public continue la pulsation interne — ils bougent encore même quand le kick disparaît, parce que l'entraînement persiste plusieurs secondes après l'arrêt du signal externe. C'est pour ça qu'un break bien placé se ressent comme tension, pas confusion.

## Isochroie et groove

Le four-on-the-floor pur est *isochrone* — espacement parfaitement régulier. De nombreux grooves dévient légèrement : le **ratio swing** (ratio long/court dans un pattern triolet ou pointé) ajoute de l'humanité. Un ratio 50/50 est straight ; 67/33 est un feel triolet (shuffle). Les logiciels DJ stockent généralement le swing comme un pourcentage de déviation par rapport à l'isochroie.

Mixer un groove swingué avec un groove straight au même BPM produira toujours un léger clash rythmique même en phase parfaite.
"""

[[fr.pages]]
title   = "Effet Haas, résolution de phase, et le flam en détail"
content = """
L'**effet Haas** (aussi : effet de précédence, Wallach et al. 1949) décrit comment le système auditif fusionne des sons spatialement coïncidents arrivant dans ~35 ms comme un seul événement. Le seuil pertinent pour les DJs est bien plus petit.

Pour des transitoires **non spatialisés, monauraux** (écoute enceinte club, somme mono) :
- **< 1 ms** : fusion complète — entendu comme une seule attaque
- **1–5 ms** : **fusion avec coloration** — le transitoire combiné a une qualité filtrée en peigne ; c'est le début du flam audible
- **5–40 ms** : **deux événements distincts** — un flam ou écho clair
- **> 40 ms** : clairement un événement séparé (territoire delay/reverb)

À 120 BPM, 1 beat = 500 ms. Le seuil de 5 ms = **1% d'un beat**. En termes de BPM : une erreur de phase produisant un flam de 5 ms correspond à une erreur de BPM de 0,01 BPM à 120 — bien en dessous de toute résolution d'affichage numérique.

**Ce que ça signifie en pratique** : un match BPM numériquement parfait ne garantit pas un mix propre. Une dérive de phase de 2–3 ms produit une coloration audible. C'est pour ça que les DJs expérimentés nudgent après avoir verrouillé le BPM — ils corrigent une erreur de phase que l'affichage BPM ne peut pas montrer.

## Seuils interaural vs. monaural

La discrimination temporelle interaurale humaine (détecter quelle oreille reçoit un son en premier) résout à ~10–20 μs. La détection de flottement monaural (ce qu'on entend dans une cabine DJ) est plus grossière : ~1–2 ms pour les auditeurs entraînés. Les logiciels DJ avec mètres de phase en temps réel peuvent montrer ça, mais le juge final reste toujours l'oreille.
"""

[[fr.pages]]
title   = "Hypermètre, anacrouse, AABA et cas limites structurels"
content = """
## Hypermètre

Une **hypermesure** est un groupe de mesures qui fonctionne comme une seule macro-unité. Dans la plupart de la house/techno, quatre mesures 4/4 forment une **hypermesure de 4 mesures**, et huit mesures 4/4 forment une **hypermesure de 8 mesures** (= une phrase DJ). Le "gros beat" qu'on ressent toutes les 4 mesures, c'est l'hypermètre en action.

Ce cadre est utile pour comprendre pourquoi les **fills et risebars** semblent obligatoires en mesure 4 et 8 d'une phrase : ce sont les accents hypermètriques — les downbeats au niveau de l'hypermesure. Les rater et l'auditeur ressent un déplacement structurel.

## Anacrouse

Une **anacrouse** (levée, upbeat) est une note ou un motif qui commence *avant* le premier downbeat d'une phrase. En rock et jazz, une levée vocale tombe avant le temps 1 du couplet. En musique DJ, l'anacrouse est rare mais présente :
- **Hi-hat ouvert sur le temps 4** de la dernière mesure, menant à la phrase : fonctionne comme anacrouse à la phrase entrante
- **Pitch riser** commençant 2 beats avant la limite de phrase : technique classique de producteur, crée l'effet d'anacrouse numériquement
- **Cue point** placé sur l'anacrouse plutôt que sur le temps 1 : les DJs avancés utilisent ça pour des drops plus précis alignés sur les phrases

## Forme AABA

La structure **AABA** (Tin Pan Alley, standards de jazz : forme 32 mesures avec 8+8+8+8) se décalque étonnamment bien sur la structure d'un track DJ :

| AABA | Structure DJ |
|---|---|
| A (mesures 1–8) | Intro / première phrase de build |
| A (mesures 9–16) | Drop |
| B (mesures 17–24) | Break (le "pont" — énergie différente) |
| A (mesures 25–32) | Retour / outro |

Comprendre l'AABA aide quand on cue des morceaux inconnus : la section B (break) est structurellement obligée de résoudre vers A. Elle ne peut pas s'étendre indéfiniment. C'est pour ça qu'un DJ peut prédire, sans avoir entendu un morceau auparavant, que le break se terminera en environ 8–16 mesures.

## Feel half-time

Dans les grooves **half-time** (courants en D&B, trap, et certains tracks influencés nu-metal), la snare est déplacée des temps 2 et 4 au temps **3 uniquement** — divisant effectivement par deux le tempo perçu sans changer le BPM. À 170 BPM (D&B), le feel half-time rend la pulsation perçue comme 85 BPM. Les algorithmes de beat-tracking lisent régulièrement ça comme 85 BPM. Le correctif : tap-tempo ou inspecter manuellement le pattern de kick.

## Cas limites polyrythmiques

- **Hémiole (3:2)** : trois notes dans le temps de deux — crée une cross-rhythm contre le kick 4/4. Courant en Afro-cubain et certains breakdowns techno
- **Modulation métrique** : le tempo d'une couche devient la nouvelle pulsation de tout le morceau (ex : la subdivision triolet devient la nouvelle noire). Rare en musique DJ, présent en broken beat jazz-influencé
- **Polytempo** : deux couches genuinement à des BPMs différents simultanément — quasi absent en musique DJ mixable, mais présent dans certains tracks expérimentaux/industriels
"""

