[en]
title       = "Beat Structure: What You're Actually Hearing"
short_desc  = "The kick, the snare, the phrase — learn to count before you mix."
description = "Before you can mix, you need to hear what a beat is actually made of. This lesson teaches you to count, identify anchors, and think in phrases — no theory required."
recap = [
  "The kick drum is the loudest 'boom' — it hits every beat in most club music.",
  "The snare is the sharp 'crack' on beats 2 and 4 — your easiest sync anchor.",
  "When two snares hit slightly apart, that small echo is a 'flam' — a nudge fixes it.",
  "A phrase is 8 bars (32 beats) — DJs mix at phrase endings, not randomly.",
  "Count to 32 out loud while music plays. When you reach 32 without getting lost, you understand phrase structure."
]

[[en.pages]]
title   = "The kick: your heartbeat"
content = """
In almost all electronic club music, a **kick drum** (grosse caisse) hits on every single beat — boom, boom, boom, boom. In one bar of 4 beats, that's 4 kicks.

This pattern is called **four-on-the-floor**: four kicks per bar, one on every beat.

## Exercise

Put on any house or techno track. Tap your hand on your knee every time you hear the big "boom". If you're tapping 4 times per bar, you found the kick. That steady pulse is your number-one anchor when beatmatching.

**When both decks are locked, both kicks hit at exactly the same instant.** If they flutter, the **phase** is off (the beats are offset, see lesson 1). If they drift apart over time, the **tempo** (BPM) is off.
"""

[[en.pages]]
title   = "The snare: your flam detector"
content = """
On beats **2 and 4** of every bar, there's a sharp crack — that's the **snare** (or clap). Count: 1-CRACK-3-CRACK-1-CRACK-3-CRACK. That alternating boom-crack is the heartbeat of house music.

Here's why this matters for beatmatching: **when two tracks are perfectly in phase, their snares land at exactly the same moment**. When they're slightly off, you hear a tiny echo — that's called a **flam**.

## How to use the flam

- Hear a flam? Phase is off. Nudge to close the gap: on real gear, gently touch the jog wheel forward or back; in the game, tap Slow down / Speed up.
- No flam, snares land together? Phase is locked. You're good.

The snare is often easier to use than the kick for phase-checking because it's sharper and higher-pitched — your ears can detect tiny timing errors in it more easily.
"""

[[en.pages]]
title   = "The phrase: thinking in 32s"
content = """
Music doesn't just flow randomly — it's built in blocks. The most common block in DJ music is **8 bars**, which is **32 beats**.

A track typically has:
- **Intro** (1–2 phrases): sparse, no drop, for mixing in
- **Build** (1 phrase): energy rising, often with a **riser** (a sound that sweeps upward to build tension)
- **Drop** (2+ phrases): full energy, kick, bass, everything
- **Break** (1 phrase): stripped back, no kick, just light percussion or soft sounds
- **Outro** (1–2 phrases): sparse, for mixing out

**The rule**: mix at phrase endings — when one 32-beat block ends and the next begins. Mix in the middle and it will sound wrong, even if the BPM is perfect.

## How to count phrases

Count beats out loud: 1-2-3-4 / 2-2-3-4 / 3-2-3-4 / ... / 8-2-3-4. When you hit 8-4, that's the end of a phrase. Something in the music usually happens there — a **fill** (a short drum roll), a **crash** (a big cymbal hit), a sound suddenly opening up.
"""

