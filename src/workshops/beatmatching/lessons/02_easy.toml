[[fr.pages]]
title   = "Le kick : ton coeur de métronome"
content = """
Dans presque toute la musique électronique de club, une **grosse caisse** tombe sur chaque beat — boom, boom, boom, boom. Dans une mesure de 4 temps, ça fait 4 kicks.

On appelle ce motif le **four-on-the-floor** (« quatre sur le plancher ») : quatre kicks par mesure, un sur chaque temps.

## Exercice

Mets un morceau house ou techno. Tape de la main sur ton genou chaque fois que tu entends le grand "boom". Si tu tapes 4 fois par mesure, tu as trouvé le kick. Cette pulsation stable est ton ancre numéro 1 pour le beatmatching.

**Quand les deux decks sont verrouillés, les deux kicks tombent exactement au même instant.** S'ils flottent, la **phase** est décalée (les temps sont décalés, cf. leçon 1). S'ils s'écartent avec le temps, le **tempo** (BPM) est décalé.
"""

[[fr.pages]]
title   = "La snare : ton détecteur de flam"
content = """
Sur les temps **2 et 4** de chaque mesure, il y a un claquement sec — c'est la **snare** (caisse claire) ou un clap. Compte : 1-CLAC-3-CLAC-1-CLAC-3-CLAC. Ce boom-clac alterné est le battement de coeur de la house.

Voilà pourquoi ça compte pour le beatmatching : **quand deux morceaux sont parfaitement en phase, leurs snares tombent exactement au même moment**. Quand ils sont légèrement décalés, tu entends un petit écho — ça s'appelle un **flam**.

## Comment utiliser le flam

- Tu entends un flam ? La phase est décalée. Nudge pour réduire l'écart : sur du vrai matos, touche doucement la roue jog vers l'avant ou l'arrière ; dans le jeu, appuie sur Ralentir / Accélérer.
- Pas de flam, les snares tombent ensemble ? La phase est verrouillée. C'est bon.

La snare est souvent plus facile à utiliser que le kick pour vérifier la phase parce qu'elle est plus sèche et plus aigüe — tes oreilles peuvent détecter de minuscules erreurs de timing dedans plus facilement.
"""

[[fr.pages]]
title   = "La phrase : penser en 32s"
content = """
La musique ne coule pas de façon aléatoire — elle est construite en blocs. Le bloc le plus courant en musique DJ est **8 mesures**, soit **32 beats**.

Un morceau a typiquement :
- **Intro** (1–2 phrases) : sparse, sans drop, pour mixer
- **Build** (1 phrase) : l'énergie monte, souvent avec un **riser** (un son qui monte pour faire grimper la tension)
- **Drop** (2+ phrases) : pleine énergie, kick, basse, tout
- **Break** (1 phrase) : tout est dépouillé, plus de kick, juste de la percussion légère ou des sons doux
- **Outro** (1–2 phrases) : sparse, pour mixer en sortie

**La règle** : mixer aux fins de phrases — quand un bloc de 32 beats se termine et que le suivant commence. Mixer au milieu et ça sonnera faux, même si le BPM est parfait.

## Comment compter les phrases

Compte les beats à voix haute : 1-2-3-4 / 2-2-3-4 / 3-2-3-4 / ... / 8-2-3-4. Quand tu arrives à 8-4, c'est la fin d'une phrase. Quelque chose dans la musique se passe généralement là — un **fill** (un petit roulement de batterie), un **crash** (un gros coup de cymbale), un son qui s'ouvre d'un coup.
"""

