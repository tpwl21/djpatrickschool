[[fr.pages]]
title   = "Le BPM comme unité — et ses limites"
content = """
**BPM** (Battements Par Minute) mesure le **tempo** d'un morceau. Les deux termes sont souvent utilisés de façon interchangeable, mais BPM est juste l'unité — comme °C l'est pour la température.

À 120 BPM :
- 2 beats par seconde
- 1 beat dure exactement 500 ms
- 1 mesure 4/4 dure 2 secondes
- 1 phrase de 32 beats dure 16 secondes

Beaucoup de morceaux modernes ont une grille tempo *humanisée* — le BPM dérive légèrement par choix, surtout en soul, funk et house "organique". La techno et house club rigide ont une grille parfaitement quantisée, et le BPM est un seul chiffre.

## Barème de tempo par genre

| Genre | Plage BPM typique |
|---|---|
| Hip-hop | 80–100 |
| Deep House | 118–122 |
| House | 120–130 |
| Techno | 130–145 |
| Hard Techno | 145–160 |
| Drum & Bass | 170–175 |
| Gabber | 160–200 |

Ce sont des *conventions*, pas des règles. Le contexte et le ressenti comptent autant que le chiffre.
"""

[[fr.pages]]
title   = "Le trainwreck — dérive, timing, et la math derrière"
content = """
Quand deux morceaux jouent simultanément à des BPM différents, leurs beats se décalent à un **rythme prévisible**.

Un écart de 0,5 BPM à 120 BPM signifie un morceau à 120,5 et l'autre à 120. Après :
- **10 secondes** : ~0,08 beats de dérive — à peine audible
- **30 secondes** : ~0,25 beats — flam clairement audible
- **60 secondes** : ~0,5 beats — les deux kicks sont exactement à mi-chemin — clash maximal

Le *trainwreck* n'est pas juste laid : les pulsations concurrentes créent un effet de filtre en peigne psychoacoustique qui désoriente un dance floor. Le cerveau cherche à accrocher une pulsation unique et n'y arrive pas.

## Ce que la détection BPM fait vraiment

Des logiciels comme Rekordbox, Serato et Traktor utilisent la **détection d'onset + autocorrélation** pour estimer le BPM. Ça marche sur du matériau 4/4 propre et quantisé — mais plante sur :
- **Grooves swingués** (shuffle 16ths) — la grille semble irrégulière
- **Feels half-time** (D&B, trap) — souvent détectés au double du BPM réel
- **Batterie live** avec dérive tempo naturelle
- **Boucles courtes** (< 4 mesures) — trop peu de données pour l'autocorrélation

Toujours vérifier le BPM détecté quand tu travailles sur du matériel atypique. Tap-tempo ou corriger la grille à la main si besoin.
"""

[[fr.pages]]
title   = "Rate, Tempo et Pitch — trois choses, un seul fader"
content = """
Sur une platine DJ traditionnelle (CDJ, platines vinyle, la plupart des contrôleurs), le **fader pitch** contrôle trois choses simultanément :

1. **Rate** — la vitesse à laquelle le fichier audio est lu
2. **Tempo** — le BPM perçu (monte ou descend avec le rate)
3. **Pitch musical** — la tonalité perçue (se décale aussi avec le rate)

Ils sont couplés à cause de la nature du son analogique : jouer une bande plus vite, toutes les fréquences enregistrées montent proportionnellement. La lecture numérique a hérité ce comportement.

**Le couplage est logarithmique** : changement de pitch en demi-tons = 12 × log₂(nouveau_rate / ancien_rate). Une augmentation de rate de ~6% équivaut à ~1 demi-ton. À +3%, un morceau à 120 BPM monte aussi d'environ un demi demi-ton — nettement plus brillant, et potentiellement hors-tonalité avec le morceau suivant.

## Key Lock / Master Tempo

La plupart du matos moderne inclut le **Master Tempo** (Pioneer / rekordbox) ou le **Key Lock** (Denon, Serato, Traktor). Il préserve le pitch d'origine tout en changeant le rate de lecture, via des algorithmes de modification temporelle (TSM).

Sans Key Lock : plus vite = plus haut. Avec Key Lock : plus vite = même pitch, tempo seul change.

L'utiliser ou non est une question de goût : les puristes vinyle le laissent off parce que le couplage pitch-vitesse fait partie de l'esthétique.
"""

