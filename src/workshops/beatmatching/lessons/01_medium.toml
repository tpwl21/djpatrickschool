[[en.pages]]
title   = "BPM as a unit — and its limits"
content = """
**BPM** (Beats Per Minute) measures the **tempo** of a track. The terms are often used interchangeably, but BPM is just the unit — like °C is to temperature.

At 120 BPM:
- 2 beats hit per second
- 1 beat lasts exactly 500 ms
- A 4/4 bar lasts 2 seconds
- A 32-beat phrase lasts 16 seconds

Many modern tracks have a *humanized* tempo grid — the BPM drifts slightly by design, especially in soul, funk, and "organic" house. Most club techno and house is rigid: the grid is perfectly quantized, and the BPM is a single number.

## Genre tempo cheatsheet

| Genre | Typical BPM range |
|---|---|
| Hip-hop | 80–100 |
| Deep House | 118–122 |
| House | 120–130 |
| Techno | 130–145 |
| Hard Techno | 145–160 |
| Drum & Bass | 170–175 |
| Gabber | 160–200 |

These are *conventions*, not rules. Context and feel matter as much as the number.
"""

[[en.pages]]
title   = "The trainwreck — drift, timing, and the math behind it"
content = """
When two tracks play simultaneously at different BPMs, their beats drift apart at a **predictable rate**.

A 0.5 BPM difference at 120 BPM means one track is at 120.5 BPM and the other at 120. After:
- **10 seconds**: ~0.08 beats of drift — barely audible
- **30 seconds**: ~0.25 beats — clearly audible flam
- **60 seconds**: ~0.5 beats — both kicks are exactly halfway apart — maximum clash

The *trainwreck* is not just aesthetically bad: the competing pulses create a psychoacoustic comb-filter effect that sounds disorienting on a dance floor. The brain tries to lock onto a single pulse and keeps failing.

## What BPM detection actually does

Software like Rekordbox, Serato, and Traktor uses **onset detection + autocorrelation** to estimate BPM. This works well on clean, quantized 4/4 material — but misfires on:
- **Swung grooves** (shuffle 16ths) — the grid looks irregular
- **Half-time feels** (D&B, some trap) — often detected at double the actual BPM
- **Live drumming** with natural tempo drift
- **Short loops** (< 4 bars) — too little data for reliable autocorrelation

Always sanity-check the detected BPM when working with unusual material. Tap-tempo or hand-correct the grid when needed.
"""

[[en.pages]]
title   = "Rate, Tempo, and Pitch — three things, one fader"
content = """
On a traditional DJ deck (CDJs, turntables, most controllers), the **pitch fader** controls three things simultaneously:

1. **Rate** — how fast the audio file is read back
2. **Tempo** — the perceived BPM (rises or falls with rate)
3. **Musical pitch** — the perceived key/tonality (also shifts with rate)

They are coupled because of how analog audio works: play back a tape faster, and all recorded frequencies shift up proportionally. Digital playback inherited this behavior.

**The coupling is logarithmic**: pitch change in semitones = 12 × log₂(new_rate / old_rate). A rate increase of ~6% equals roughly 1 semitone. At +3%, a 120 BPM track also rises about half a semitone — audibly brighter to a trained ear, and potentially out of key with the next track.

## Key Lock / Master Tempo

Most modern gear includes **Master Tempo** (Pioneer / rekordbox) or **Key Lock** (Denon, Serato, Traktor). This preserves the original pitch while changing the playback rate, using time-scale modification (TSM) algorithms.

Without Key Lock: faster = higher pitch. With Key Lock: faster = same pitch, different tempo only.

Whether to use it is a matter of taste: vinyl purists leave it off because the pitch-speed coupling is part of the aesthetic.
"""

