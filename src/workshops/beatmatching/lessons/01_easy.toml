[fr]
title       = "C'est quoi le BPM ?"
short_desc  = "Deux morceaux, deux vitesses — apprends à entendre la différence."
description = "Le BPM c'est juste un nombre qui indique la vitesse d'un morceau. Cette leçon mise tout sur tes oreilles, pas sur les formules."
recap = [
  "BPM = combien de beats arrivent en une minute. Morceau rapide = chiffre élevé.",
  "Deux morceaux à vitesses différentes : leurs kicks se décalent — ça sonne très mal.",
  "Le fader pitch sur ta platine c'est le bouton de vitesse. Tu le bouges, ça accélère ou ralentit.",
  "Ton but : faire matcher la vitesse (le tempo) du deck B sur celle du deck A, puis aligner les kicks (la phase) pour qu'ils tombent ensemble.",
  "Tu n'as pas besoin de lire des chiffres pour beatmatcher — tes oreilles te diront quand c'est bon."
]

[[fr.pages]]
title   = "La vitesse, comptée à voix haute"
content = """
Un morceau à **120 BPM** a 120 beats en une minute — soit 2 beats par seconde. Les morceaux rapides ont des chiffres élevés, les lents ont des chiffres bas.

C'est tout. Pas de formule nécessaire.

Les beats vont par groupes de quatre : 1-2-3-4, 1-2-3-4. Un groupe de quatre beats, c'est une **mesure**. Retiens-le, on va bientôt compter en mesures.

## Comment le ressentir

- **House music** (tracks de club, four-on-the-floor) : environ 120–130 BPM — une marche rapide
- **Drum & Bass** : 170–180 BPM — un petit trot
- **Hip-hop** : 80–100 BPM — flânerie détendue

Charge un morceau house. Tape du pied. Ce tap, c'est 1 beat. Compte combien de taps en 10 secondes et multiplie par 6 — tu viens de mesurer le BPM toi-même.
"""

[[fr.pages]]
title   = "Pourquoi la vitesse compte quand tu mixes"
content = """
Imagine deux morceaux qui jouent en même temps. L'un est plus rapide que l'autre. Toutes les quelques secondes, leurs beats s'écartent — comme deux personnes qui applaudissent ensemble au départ mais accélèrent à des rythmes différents. Ça s'appelle un **trainwreck** (un clash) et ça sonne exactement aussi mal que ça en a l'air.

**La correction** : ralentir l'un ou accélérer l'autre jusqu'à ce que les deux kicks tombent au même instant.

Deux choses différentes peuvent clocher, alors retiens ces deux mots dès maintenant :

- Le **tempo**, c'est la vitesse. Tempos différents = les kicks s'écartent doucement l'un de l'autre.
- La **phase**, c'est le calage des temps. Deux morceaux peuvent avoir exactement le même tempo et être quand même déphasés, comme deux coureurs au même rythme dont l'un a un pas de retard. Tu entends les kicks tomber un peu à côté, un flottement constant.

Le fader pitch règle le tempo. Une petite poussée règle la phase (on y vient plus bas).

## Essaie maintenant

1. Charge deux morceaux dans une appli DJ (ou utilise le niveau de pratique après cette leçon)
2. Lance les deux
3. Écoute — les kicks tombent-ils ensemble, ou flottent-ils ?
4. Bouge le fader pitch du deck B légèrement vers le haut ou le bas jusqu'à ce qu'ils se verrouillent
"""

[[fr.pages]]
title   = "Le bouton de vitesse (fader pitch)"
content = """
Sur chaque platine DJ il y a un **fader pitch** — un slider vertical généralement à droite. Malgré son nom, pour l'instant pense-y uniquement comme un **bouton de vitesse** :

- Glisse vers le **bas** (vers toi) → le morceau joue **plus vite**, c'est le côté "+"
- Glisse vers le **haut** (loin de toi) → le morceau joue **plus lentement**, c'est le côté "−"
- Laisse au **milieu** → vitesse originale

Oui, ça paraît à l'envers au début : sur les vraies platines (Technics, CDJ), le "+" est en bas. Le jeu fait pareil, donc tes mains connaîtront déjà le geste sur du vrai matos.

Le chiffre affiché (genre +2.0% ou -1.5%) indique de combien tu t'es écarté de la vitesse d'enregistrement d'origine.

## La petite poussée : le nudge

Une fois la vitesse bonne, les kicks peuvent encore être décalés (la phase). Pour corriger, tu donnes au morceau une toute petite poussée ponctuelle : un **nudge**. Sur du vrai matos, ça se fait avec la **jog** (la roue sur le dessus de la platine) : tu la touches à peine, un poil vers l'avant ou l'arrière. Dans le jeu, les boutons **Ralentir** et **Accélérer** font le même travail.

**N'overthink pas le chiffre.** Utilise tes oreilles. Quand les kicks se verrouillent, c'est terminé.
"""

