[en]
title       = "What is BPM?"
short_desc  = "Two tracks, two speeds — learn to hear the difference."
description = "BPM is just a number that tells you how fast a song goes. This lesson is all about your ears, not formulas."
recap = [
  "BPM = how many beats happen in one minute. Fast song = high number.",
  "If two tracks run at different speeds, their kicks drift apart — that sounds terrible.",
  "The pitch fader on your deck is the speed dial. Move it, the track speeds up or slows down.",
  "Your job: make deck B match deck A's speed (tempo), then line up the kicks (phase) so they land together.",
  "You don't need to read numbers to beatmatch — your ears will tell you when it's right."
]

[[en.pages]]
title   = "Speed, counted out loud"
content = """
A song at **120 BPM** has 120 beats in one minute — or 2 beats every second. Fast songs have high numbers, slow songs have low numbers.

That's it. No formula needed.

Beats come in groups of four: 1-2-3-4, 1-2-3-4. One group of four beats is a **bar** (*mesure* in French). Remember it, we'll count in bars soon.

## How to feel it

- **House music** (club tracks, four-on-the-floor): roughly 120–130 BPM — a brisk walk
- **Drum & Bass**: 170–180 BPM — a light jog
- **Hip-hop beats**: 80–100 BPM — lazy stroll

Load a house track. Tap your foot to it. That tap is 1 beat. Count how many taps happen in 10 seconds and multiply by 6 — you've just measured the BPM yourself.
"""

[[en.pages]]
title   = "Why speed matters when you mix"
content = """
Imagine two songs playing at the same time. One is faster than the other. Every few seconds, their beats drift further apart — like two people clapping who started together but sped up at different rates. That's called a **trainwreck** and it sounds exactly as bad as it sounds.

**The fix**: slow one down or speed up the other until both kicks land at the same instant.

Two different things can go wrong, so learn the two words now:

- **Tempo** is the speed. Different tempos = the kicks slowly drift apart.
- **Phase** is the alignment of the beats. Two tracks can have the exact same tempo and still be out of phase, like two runners at the same pace, one a step behind the other. You hear the kicks landing a bit apart, a constant flutter.

The pitch fader fixes the tempo. A small push fixes the phase (more on that below).

## Try it right now

1. Load any two tracks into a DJ app (or use the practice level after this lesson)
2. Start both playing
3. Listen — do the kicks hit together, or do they flutter?
4. Move the pitch fader on deck B slightly up or down until they lock
"""

[[en.pages]]
title   = "The speed dial (pitch fader)"
content = """
On every DJ deck there is a **pitch fader** — a vertical slider usually on the right side of the deck. Despite the name, right now think of it purely as a **speed dial**:

- Slide it **down** (toward you) → track plays **faster**, that's the "+" side
- Slide it **up** (away from you) → track plays **slower**, that's the "−" side
- Leave it in the **middle** → original speed

Yes, it feels backwards at first: on real turntables and CDJs, "+" is at the bottom. The game does the same, so your hands will already know the move when you touch real gear.

The number shown (like +2.0% or -1.5%) tells you how much faster or slower you've made it relative to the original recording.

## The little push: nudge

Once the speed is right, the kicks can still be offset (phase). To fix that you give the track a tiny, temporary push called a **nudge**. On real gear you do it with the **jog** (the wheel on top of the deck): touch it a hair forward or backward. In the game, the **Slow down** and **Speed up** buttons do the same job.

**Don't overthink the number.** Use your ears. When the kicks lock together you're done.
"""

