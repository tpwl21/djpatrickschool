[[fr.pages]]
title   = "Le kick four-on-the-floor : généalogie et physique perceptuelle"
content = """
Le pattern **four-on-the-floor** — un kick sur chaque temps — n'est pas une évidence. C'est un choix hérité du **disco**. Il a été codifié par des batteurs comme Earl Young (MFSB, Philadelphia International Records, début des années 1970), dont le kick stable libérait le reste de l'arrangement pour des ornements polyrythmiques.

Les producteurs électroniques de la fin des années 70 et 80 — Roland TR-808, TR-909 — l'ont intégré dans les presets d'usine parce qu'il correspondait à ce que les danseurs attendaient du disco. La house et la techno l'ont hérité intégralement.

**Pourquoi il domine psychoacoustiquement** : une pulsation isochrone stable à 2 Hz (120 BPM = 2 kicks par seconde) se situe dans la zone optimale du système sensorimoteur humain. La recherche en cognition musicale (Repp & Su 2013) montre que c'est la plage de fréquence où taper sur un beat est le plus automatique. C'est pour ça que 120 BPM apparaît dans la musique de sport, les jeux vidéo et les comptines.

## Au-delà de la convention house

- **Hip-hop / breakbeat** : kicks sur le 1 et le "et" du 3 (ou autres patterns brisés issus de breaks samplés)
- **Drum & Bass** : 170 BPM mais perçu en half-time — la pulsation principale est tous les 2 temps, pas 4
- **Afrobeat / Highlife** : le kick s'entremêle avec la basse dans des patterns polyrythmiques ; le four-on-the-floor est absent
"""

[[fr.pages]]
title   = "Backbeat, flam, et l'effet Haas"
content = """
Le **backbeat** — snare ou clap sur les temps 2 et 4 — est emprunté directement au drumming R&B, rock et funk. Il donne à l'auditeur une deuxième pulsation, plus aigüe, à laquelle s'accrocher.

Pour les DJs, le backbeat est un **détecteur de phase** : quand deux morceaux sont parfaitement synchronisés, leurs snares tombent simultanément et sonnent comme une seule. Quand la phase est décalée, tu entends un **flam** — deux transitoires très proches mais distincts.

## La physique du flam

L'effet Haas (aussi appelé effet de précédence) explique pourquoi le flam apparaît :

- Deux transitoires identiques séparés de **< 1 ms** : fusionnés, entendus comme un seul événement avec une source légèrement diffuse
- Séparés de **1–5 ms** : encore fusionnés, mais avec un biais directionnel vers le son le plus en avance
- Séparés de **> 5 ms** : entendus comme deux événements distincts — c'est le flam

À 120 BPM, un beat = 500 ms. Le seuil de flam de 5 ms = 1% d'un beat. La discrimination temporelle interaurale humaine est ~10–20 μs, mais pour une écoute non localisée (casque), le seuil de détection du flottement est d'environ 1 ms.

## Quand la snare ment

En **Afrobeat, percussion latine, broken beat** et de nombreux genres de danse non-occidentaux, la snare ou son équivalent tombe sur des subdivisions inattendues, créant des polyrythmies contre la pulsation sous-jacente. Dans ces genres, utiliser la snare comme ancre de phase est peu fiable — accroche-toi au kick ou à la grosse caisse.
"""

[[fr.pages]]
title   = "Structure des phrases : hiérarchie et conventions de genre"
content = """
La musique est organisée hiérarchiquement : **beat → mesure (4 beats) → sous-phrase (4 mesures / 16 beats) → phrase (8 mesures / 32 beats) → section**.

La **phrase de 32 beats** (8 mesures) est l'unité fondamentale de la pensée DJ. Ce n'est pas arbitraire : l'oreille attend des puissances de deux, et 8 mesures s'adapte parfaitement aux structures harmoniques et mélodiques de la plupart de la musique électronique.

## Architecture interne d'une phrase

Une phrase de 32 beats a typiquement une structure interne :
- **8+8+16** : deux cellules de 8 beats suivies d'une expansion de 16 beats (courante en progressive house)
- **16+16** : deux moitiés égales, chacune avec un fill ou pic de tension en mesure 7
- **4+4+4+4+16** : première moitié en micro-phrases de 4 mesures, deuxième moitié en build continu

Le **fill ou risebar** en mesure 7 (beats 29–32) est un signal quasi-universel : quelque chose change ensuite. Si tu mixes en entrée, c'est ton signal pour avoir le morceau entrant prêt.

## Longueurs de phrase par genre

| Genre | Longueur de phrase typique |
|---|---|
| House / Techno | 32 beats (8 mesures) |
| Trance | 64 beats (16 mesures) sur les sections peak |
| Hip-hop | 16 beats (4 mesures) ou 64 beats (16 mesures) |
| D&B | 32 beats mais perçus comme 16 (feel half-time) |

## Alignement de phrase et mix harmonique

L'alignement de phrase n'est pas seulement une question de timing — c'est le prérequis pour le **mix harmonique** (mixer dans des tonalités compatibles). Un changement de tonalité qui tombe au milieu d'une phrase jarre même si les tonalités sont théoriquement compatibles. La progression harmonique doit résoudre avant que celle du nouveau morceau commence. C'est pour ça que le workshop Harmonies (suivant) s'appuie directement sur la structure en phrases.
"""

