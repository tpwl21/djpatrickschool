[[en.pages]]
title   = "The four-on-the-floor kick: genealogy and perceptual physics"
content = """
The **four-on-the-floor** pattern — a kick on every beat — is not a given. It's a choice inherited from **disco**. The pattern was codified by drummers like Earl Young (MFSB, Philadelphia International Records, early 1970s), whose steady kick pulse freed the rest of the arrangement for polyrhythmic ornamentation.

Electronic producers of the late 70s and 80s — Roland TR-808, TR-909 — baked it into the factory presets because it matched what dancers expected from disco. House and techno inherited it wholesale.

**Why it dominates psychoacoustically**: a steady isochronous pulse at 2 Hz (120 BPM = 2 kicks per second) sits at the sweet spot of the human sensorimotor system's entrainment frequency. Research in music cognition (Repp & Su 2013) shows this is the frequency range where tapping to a beat is most automatic and least effortful. It's the same reason 120 BPM appears in exercise music, video games, and children's songs: the brain locks onto it without trying.

## Beyond the house convention

- **Hip-hop / breakbeat**: kicks fall on 1 and the "and" of 3 (or other broken patterns from sampled breaks)
- **Drum & Bass**: 170 BPM but perceived as half-time — the main pulse is every 2 beats, not 4
- **Afrobeat / Highlife**: kick interweaves with bass drum in polyrhythmic patterns; the four-on-the-floor is absent
"""

[[en.pages]]
title   = "Backbeat, flam, and the Haas effect"
content = """
The **backbeat** — snare or clap on beats 2 and 4 — is borrowed directly from R&B, rock, and funk drumming. It gives the listener a second, higher-pitched pulse to latch onto.

For DJs, the backbeat is a **phase detector**: when two tracks are perfectly synced, their snares land simultaneously and sound as one. When phase is off, you hear a **flam** — two very close but distinct transients.

## The physics of the flam

The Haas effect (also called the precedence effect) explains why the flam appears. Rules of thumb for two identical transients:

- **< 2–3 ms**: fused, heard as one hit
- **5–10 ms**: the kick goes soft, it loses its snap
- **10–20 ms**: a clear flam, you hear a double hit
- **> 30 ms**: two separate hits

At 120 BPM, one beat = 500 ms, so 5 ms = 1% of a beat. These are orders of magnitude, not hard limits: they vary with the sound and the listener.

## When the snare lies

In **Afrobeat, Latin percussion, broken beat**, and many non-Western dance genres, the snare or equivalent accent falls on unexpected subdivisions, creating polyrhythms against the underlying pulse. In these genres, using the snare as a phase anchor is unreliable — lock onto the kick or bass drum instead.
"""

[[en.pages]]
title   = "Phrase structure: hierarchy and genre conventions"
content = """
Music is organized hierarchically: **beat → bar (4 beats) → sub-phrase (4 bars / 16 beats) → phrase (8 bars / 32 beats) → section**.

The **32-beat phrase** (8 bars) is the fundamental unit of DJ thinking. It's not arbitrary: the ear expects powers of two, and 8 bars fits neatly into the harmonic and melodic structures of most electronic music.

## Internal phrase architecture

A 32-beat phrase typically has internal structure:
- **8+8+16**: two 8-beat cells followed by a 16-beat expansion (common in progressive house)
- **16+16**: two equal halves, each ending with a fill or tension peak (beats 13–16 and 29–32)
- **4+4+4+4+16**: first half in 4-beat cells, second half as one continuous 16-beat build

A **fill** (a short drum roll that announces a change) or a **risebar** (a riser that builds tension) in bar 8 (beats 29–32) is a nearly universal signal: something changes next. If you're mixing in, this is your cue to have the incoming track ready.

## Genre phrase lengths

| Genre | Typical phrase length (rule of thumb) |
|---|---|
| House / Techno | 32 beats (8 bars) |
| Trance | 64 beats (16 bars) at peak sections |
| Hip-hop | 16 beats (4 bars) or 64 beats (16 bars) |
| D&B | 32 beats but perceived as 16 (half-time feel) |

## Phrase alignment and harmonic mixing

Phrase alignment is not just about timing — it's the prerequisite for **harmonic mixing** (mixing in compatible keys). A key change that lands mid-phrase will jar even if the keys are theoretically compatible. The chord progression needs to resolve before the new track's progression begins. This is why the Harmonies workshop (next) builds directly on phrase structure.
"""

