[en]
title      = "DIGGING"
short_desc = "Find the gems. Crate-digging, curation, setlist-building."
long_desc  = "The art of choosing the right track at the right time — and hunting for the ones nobody else has. Each practice sharpens a different muscle: reading fiches, spotting subtle traps, picking blind by ear, and hunting rare releases on Discogs."
objectives = [
  "Read BPM and Camelot fiches to filter compatible tracks",
  "Spot the subtle trap when all candidates look close",
  "Trust your ear when the numbers aren't there",
  "Navigate Discogs advanced filters to retrieve rare releases"
]

