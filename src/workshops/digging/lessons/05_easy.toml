[fr]
title      = "Ton Crate de Set — Organisé pour te sauver"
short_desc = "200 tracks bien triées battent 10 000 en vrac à chaque fois. Voilà comment."

[[fr.pages]]
title   = "Le problème d'avoir trop de tracks"
content = """
Imagine que tu es en plein live. La track arrive à son outro. Tu as 60 secondes pour choisir la suivante. Tu scrolles 5 000 tracks. Rien ne te parle. Panique.

Maintenant imagine que tu as 200 tracks triées en dossiers clairs. Tu vas dans "Peak / 128 BPM" — tu vois 15 candidats. Tu en choisis une en 10 secondes. Transition propre.

**La leçon :** avoir plus de musique, ce n'est pas l'objectif. **Avoir la bonne musique trouvable rapidement**, c'est l'objectif.

La plupart des DJs qui galèrent en live ne galèrent pas par manque de musique. Ils galèrent parce qu'ils ne trouvent pas ce qu'ils cherchent au moment où ils en ont besoin.
"""

[[fr.pages]]
title   = "Trois dossiers simples pour commencer"
content = """
Tu n'as pas besoin d'un système complexe pour commencer. Essaie trois dossiers :

**Dossier 1 — Warmup**
Des tracks groovy mais pas trop intenses. Parfait pour les 30 premières minutes quand la salle est à moitié vide. Énergie 1–2 sur 5.

**Dossier 2 — Main**
Tes tracks dancefloor solides. C'est le cœur de ton set. Énergie 3–4 sur 5.

**Dossier 3 — Peak**
Tes tracks les plus grosses, les plus intenses. Réservées pour quand la salle est pleine et énergisée. Énergie 4–5 sur 5.

**Commence simple.** Trie 30–50 tracks que tu joues vraiment dans ces trois dossiers. C'est déjà 10 fois plus organisé que la plupart des débutants.

Plus tard tu peux ajouter des sous-dossiers par BPM, par clé, par genre. Mais trois dossiers battent zéro dossier à chaque fois.
"""

[[fr.pages]]
title   = "Ton arme secrète : la track oh-shit"
content = """
Tous les DJs — même les pros — gardent un petit dossier privé de leurs tracks les plus fiables.

Ce sont leurs **tracks "oh-shit"** : le dancefloor est en train de mourir, la vibe est à côté, le promoter te fixe. Tu en drop une et ça t'achète du temps pour te remettre.

**Ce qui fait une bonne track oh-shit :**
- Elle commence à marcher en 8 mesures (impact très rapide)
- Presque tout le monde dans la salle va y répondre
- Elle a un intro assez long pour que tu puisses la mixer depuis n'importe où

**Comment trouver les tiennes :**
Pense à 3 tracks que tu as déjà jouées qui *tombent toujours*. Celles où tu vois les mains se lever, où les gens se retournent pour se regarder. Ce sont tes tracks oh-shit.

Mets-les dans un dossier séparé et ne les utilise jamais sauf en urgence.

**Règle :** tes tracks oh-shit ne sont pas tes préférées. Elles sont tes plus *fiables*. Ce sont deux choses différentes.
"""

