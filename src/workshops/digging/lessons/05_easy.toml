[en]
title      = "Your Gig Crate — Organised to Save You"
short_desc = "200 well-sorted tracks beat 10,000 unsorted every time. Here's how."

[[en.pages]]
title   = "The problem with too many tracks"
content = """
Imagine you're in a live set. The track is coming to its outro. You have 60 seconds to pick the next one. You scroll through 5,000 tracks. Nothing looks right. Panic.

Now imagine you have 200 tracks sorted into clear folders. You go to "Peak / 128 BPM" — you see 15 candidates. You pick one in 10 seconds. Clean transition.

**The lesson:** having more music isn't the goal. **Having the right music findable fast** is the goal.

Most DJs who struggle in live sets aren't struggling because they don't have enough music. They're struggling because they can't find what they need when they need it.
"""

[[en.pages]]
title   = "Three simple folders to start"
content = """
You don't need a complex system to start. Try three folders:

**Folder 1 — Warmup**
Tracks that are groovy but not too intense. Works for the first 30 minutes when the room is half-empty. Energy 1–2 out of 5.

**Folder 2 — Main**
Your solid dance floor tracks. This is the bulk of your set. Energy 3–4 out of 5.

**Folder 3 — Peak**
Your biggest, most intense tracks. Saved for when the room is packed and energised. Energy 4–5 out of 5.

**Start simple.** Sort 30–50 tracks you actually play into these three folders. That's already 10x more organised than most beginners.

Later you can add sub-folders by BPM, by key, by genre. But three folders beats zero folders every time.
"""

[[en.pages]]
title   = "Your secret weapon: the oh-shit track"
content = """
Every DJ — even the pros — keeps a small private folder of their most reliable tracks.

These are their **"oh-shit" tracks**: the dancefloor is dying, the energy is off, the promoter is staring. You drop one of these and it buys you time to recover.

**What makes a good oh-shit track:**
- It starts working within 8 bars (very quick impact)
- Almost everyone in the room will respond to it
- It has a long enough intro that you can mix it in from anywhere

**How to find yours:**
Think of 3 tracks you've played before that *always* land. The ones where you see hands go up, where people turn to look at each other. Those are your oh-shit tracks.

Put them in a separate folder and never use them except in emergencies.

**Rule:** your oh-shit tracks are not your favourites. They're your most *reliable*. Those are different things.
"""

