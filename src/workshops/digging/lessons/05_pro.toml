[en]
title      = "Gig Crate Architecture — Schema Design, Graph Theory & Optimal Stopping"
short_desc = "Crate-as-database, track selection as graph traversal, and the secretary problem applied to live sets."

[[en.pages]]
title   = "Crate preparation as database schema design"
content = """
A gig crate is a **write-once, read-many database**. Every organisational decision made at prep-time is an investment in retrieval speed at set-time. Good index design is what separates a DJ who can recover from chaos from one who drowns in it.

**The three index axes:**

**1. Energy index (primary):** 1–5 scale rated at first listen, stored in the Comments field of Rekordbox/Serato. This is your highest-cardinality index — it narrows a 400-track crate to a 50–80 track subset in one filter.

**2. Moment index (secondary):** folder-level classification — Warmup, Peak, Afterpeak, Closing. These map to temporal position in a set, not energy level. An Afterpeak track may be energy 3, but it's specifically designed for the post-peak cooldown — its harmonic and textural properties are different from a generic energy-3 Main track.

**3. Rescue category (tertiary):** colour-coded in Rekordbox (Red = oh-shit, Yellow = safety banger, Green = secret weapon). This is a sparse index — 5–10 tracks per colour is correct. More than 20 tracks in the Red folder means you don't understand what a rescue actually is.

**The retrieval query you're optimising for:** "Given that track X is playing at phrase boundary in 64 beats, I need a track with energy ≥ 3, BPM within ±5 of X, and compatible Camelot key, findable in under 10 seconds." If your crate can't answer this query in under 10 seconds, your schema is under-indexed.

**Rekordbox implementation:**
- Use hierarchical playlist nesting: `Gig → 2024-06 → Peak → 128-132`
- Use Smart Playlists for BPM + energy combinations (e.g. BPM 126–132 AND Comments contains "E4")
- Export to USB: all metadata travels with the stick, identical on any Pioneer CDJ
"""

[[en.pages]]
title   = "Track selection as graph traversal"
content = """
Each track in your crate is a **node** in a directed graph. Edges between nodes are weighted by **transition cost** — a composite of BPM distance, key distance, energy delta, and texture compatibility.

**Transition cost function (informal):**

```
cost(A, B) = w₁ × |BPM_A - BPM_B| / BPM_A
           + w₂ × camelot_distance(key_A, key_B)
           + w₃ × |energy_A - energy_B|
           + w₄ × texture_mismatch(A, B)
```

Where w₁–w₄ are weights you tune based on your style (a techno DJ weights BPM mismatch highest; a house DJ weights key mismatch highest).

**A set is a path through this graph.** A good set = a path with consistently low edge weights (smooth transitions). A great set = a path that visits distant nodes (different energy levels, genre families) while keeping the micro-hops low-cost (each individual transition is clean).

**This is a constrained Traveling Salesman Problem.** You have N must-play tracks (commitments to the promoter, crowd-pleasers, personal anchors), a time budget of T minutes, and you need to minimise total transition cost while visiting all must-plays. No algorithm solves this optimally in real-time — which is why human DJs who know their crate AND the room outperform any automated playlist.

**Mixed In Key's Mashup** attempts to automate this graph traversal by BPM and key compatibility. It finds low-cost edges reliably. It fails at valence-matching and temporal set-arc design — the w₃ and w₄ terms are beyond current automated systems.
"""

[[en.pages]]
title   = "The oh-shit folder — reliability vs excellence"
content = """
The oh-shit folder is a distinct concept from "best tracks" — and confusing them is a common error.

**Excellence** = artistic peak. The track that took you 3 months to find, that perfectly expresses what you want to say at 4am. High personal value. Requires crowd preparation to land.

**Reliability** = guaranteed floor response regardless of context. The track that works at 11pm and at 3am, in a half-empty room and a packed one, for techno kids and casual dancers. Lower personal value. No preparation required.

**Criteria for a rescue track:**
- **Immediate recognisability:** identifiable within 8 bars, triggering dopamine before the listener consciously processes the track
- **Genre-adjacent:** close enough to the surrounding context that the rescue doesn't feel like a format reset (a Laurent Garnier track rescuing a techno set, not an ABBA track)
- **Wide BPM window:** mixable from a ±8 BPM range without key lock artifacts — so it can follow almost anything
- **Long intro:** minimum 32 beats of drums-only, ideally 64, so you can mix in from any current track regardless of where you are in the phrase

**Building the oh-shit folder:** it takes years. You build it by noting which tracks rescued you in actual sets. The theoretical pick and the empirical pick often diverge. A track that seems like an obvious oh-shit candidate frequently fails to land because it requires the right crowd context. Trust your set history over your intuition.

**Classic oh-shit anchors:** Laurent Garnier — "The Man With The Red Face" (for techno/house context); Kerri Chandler — "Bar A Thym" (for deeper house); Romanthony — "Let Me Show You Love" (for crossover moments). Yours will be different and will take time to discover.
"""

[[en.pages]]
title   = "The secretary problem and optimal stopping in live sets"
content = """
The "perfect next track paradox" from LESSON_DIGGING_5 has a mathematical analogue: the **secretary problem** (also known as optimal stopping theory).

**The formal setup:** you must select the best candidate from a sequence of N candidates presented one at a time. You cannot go back to a previously seen candidate. When do you stop and commit?

**The classical solution:** observe the first ⌊N/e⌋ ≈ 37% of the sequence without committing (observation window), then commit to the first candidate that is better than all candidates seen so far in the observation window. This maximises the probability of selecting the best candidate — at ~37%.

**Applied to a live set:** the first 30–40 minutes of a set are your **observation window**. You're reading the room, testing responses, calibrating. The tracks that land in the first 30 minutes tell you which direction to commit. After that, your commitment threshold should drop — if a track worked 15 minutes ago on a similar crowd moment, the track in your hand now has a reasonable prior.

**The failure mode:** DJs who never leave the observation window (constantly searching for the perfect next track, never committing) produce hesitant, directionless sets. Conversely, DJs who commit too early and can't adapt produce rigid sets that fail when the room shifts.

**Practical rule:**
- First 20 minutes: test freely. Try unexpected picks. Observe response.
- Minutes 20–40: identify the 3–4 qualities the room responds to. Commit to those axes.
- Past 40 minutes: pre-plan 2 tracks ahead. The cognitive load of real-time selection is now freed for reading the room.

**The complementary tool:** hot cues on your CDJs are a partial solution to the optimal stopping problem. By pre-marking cue points on 200 tracks before the gig, you reduce the cost of each "candidate inspection" from 30 seconds of scrubbing to 2 seconds of visual recognition. Lower inspection cost = you can assess more candidates in the same time window.
"""

