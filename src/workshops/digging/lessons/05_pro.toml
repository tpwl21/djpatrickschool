[fr]
title      = "Architecture du Crate de Set — Schéma de BDD, Théorie des Graphes & Arrêt Optimal"
short_desc = "Crate-comme-base-de-données, sélection de tracks comme traversée de graphe, et le problème de la secrétaire appliqué aux sets."

[[fr.pages]]
title   = "La préparation du crate comme design de schéma de base de données"
content = """
Un crate de set est une **base de données write-once, read-many**. Chaque décision d'organisation faite au moment de la préparation est un investissement en vitesse de récupération au moment du set. Un bon design d'index, c'est ce qui sépare le DJ capable de se remettre du chaos de celui qui se noie dedans.

**Les trois axes d'indexation :**

**1. Index d'énergie (primaire) :** échelle 1–5 notée à la première écoute, stockée dans le champ Comments de Rekordbox/Serato. C'est ton index à la plus haute cardinalité — il réduit un crate de 400 tracks à un sous-ensemble de 50–80 en un filtre.

**2. Index de moment (secondaire) :** classification au niveau dossier — Warmup, Peak, Afterpeak, Closing. Ça se mappe sur la position temporelle dans un set, pas le niveau d'énergie. Une track Afterpeak peut être énergie 3, mais elle est spécifiquement conçue pour le refroidissement post-peak — ses propriétés harmoniques et texturales diffèrent d'une track Main générique à énergie 3.

**3. Catégorie de sauvetage (tertiaire) :** code couleur dans Rekordbox (Rouge = oh-shit, Jaune = banger safe, Vert = arme secrète). C'est un index sparse — 5–10 tracks par couleur, c'est correct. Plus de 20 tracks dans le dossier Rouge signifie que tu n'as pas compris ce qu'est un sauvetage.

**La requête de récupération pour laquelle tu optimises :** "Étant donné que la track X joue à une frontière de phrase dans 64 beats, j'ai besoin d'une track avec énergie ≥ 3, BPM dans ±5 de X, et clé Camelot compatible, trouvable en moins de 10 secondes." Si ton crate ne peut pas répondre à cette requête en moins de 10 secondes, ton schéma est sous-indexé.

**Implémentation Rekordbox :**
- Utilise le nesting de playlists hiérarchiques : `Gig → 2024-06 → Peak → 128-132`
- Utilise les Smart Playlists pour les combos BPM + énergie (ex. BPM 126–132 ET Comments contient "E4")
- Export sur USB : toutes les métadonnées voyagent avec la clé, identiques sur n'importe quel Pioneer CDJ
"""

[[fr.pages]]
title   = "Sélection de tracks comme traversée de graphe"
content = """
Chaque track de ton crate est un **nœud** dans un graphe dirigé. Les arêtes entre nœuds sont pondérées par le **coût de transition** — un composite de distance BPM, distance de clé, delta d'énergie et compatibilité de texture.

**Fonction de coût de transition (informelle) :**

```
coût(A, B) = p₁ × |BPM_A - BPM_B| / BPM_A
           + p₂ × camelot_distance(clé_A, clé_B)
           + p₃ × |énergie_A - énergie_B|
           + p₄ × mismatch_texture(A, B)
```

Où p₁–p₄ sont des poids que tu calibres selon ton style (un DJ techno pondère le mismatch BPM au max ; un DJ house pondère le mismatch de clé au max).

**Un set est un chemin dans ce graphe.** Un bon set = un chemin aux arêtes constamment faibles (transitions fluides). Un grand set = un chemin qui visite des nœuds distants (niveaux d'énergie différents, familles de genres) tout en gardant les micro-sauts à faible coût (chaque transition individuelle est propre).

**C'est un Problème du Voyageur de Commerce sous contraintes.** Tu as N tracks must-play (engagements envers le promoteur, crowd-pleasers, ancres personnelles), un budget de T minutes, et tu dois minimiser le coût de transition total tout en visitant tous les must-plays. Aucun algorithme ne résout ça optimalement en temps réel — raison pour laquelle les DJs humains qui connaissent leur crate ET la salle surpassent n'importe quelle playlist automatisée.

**Mashup de Mixed In Key** tente d'automatiser cette traversée de graphe par BPM et compatibilité de clé. Il trouve les arêtes à faible coût de façon fiable. Il échoue sur le matching de valence et le design d'arc temporel du set — les termes p₃ et p₄ sont au-delà des systèmes automatisés actuels.
"""

[[fr.pages]]
title   = "Le dossier oh-shit — fiabilité vs excellence"
content = """
Le dossier oh-shit est un concept distinct de "meilleures tracks" — et les confondre est une erreur courante.

**Excellence** = pic artistique. La track qui t'a pris 3 mois à trouver, qui exprime parfaitement ce que tu veux dire à 4h du matin. Haute valeur personnelle. Nécessite une préparation du public pour tomber.

**Fiabilité** = réponse floor garantie quelle que soit le contexte. La track qui marche à 23h et à 3h, dans une salle à moitié vide comme dans une salle comble, pour des fanas de techno comme pour des danseurs occasionnels. Valeur personnelle moindre. Aucune préparation nécessaire.

**Critères d'une track de sauvetage :**
- **Reconnaissabilité immédiate :** identifiable en 8 mesures, déclenchant la dopamine avant que l'auditeur la traite consciemment
- **Adjacent au genre :** suffisamment proche du contexte ambiant pour que le sauvetage ne ressemble pas à un reset de format (une track de Laurent Garnier sauvant un set techno, pas une track d'ABBA)
- **Fenêtre BPM large :** mixable depuis un range de ±8 BPM sans artefacts key lock — pour qu'elle puisse suivre presque n'importe quoi
- **Long intro :** minimum 32 beats de drums-only, idéalement 64, pour que tu puisses mixer en entrée depuis n'importe quelle track peu importe où tu en es dans la phrase

**Construire le dossier oh-shit :** ça prend des années. Tu le construis en notant quelles tracks t'ont sauvé dans de vrais sets. Le pick théorique et le pick empirique divergent souvent. Une track qui semble un candidat évident oh-shit échoue fréquemment parce qu'elle nécessite le bon contexte de public. Fais confiance à ton historique de sets plutôt qu'à ton intuition.

**Ancres oh-shit classiques :** Laurent Garnier — "The Man With The Red Face" (contexte techno/house) ; Kerri Chandler — "Bar A Thym" (house plus profonde) ; Romanthony — "Let Me Show You Love" (moments de crossover). Les tiennes seront différentes et prendront du temps à découvrir.
"""

[[fr.pages]]
title   = "Le problème de la secrétaire et l'arrêt optimal en set"
content = """
Le "paradoxe de la track parfaite suivante" de LESSON_DIGGING_5 a un analogue mathématique : le **problème de la secrétaire** (aussi connu sous arrêt optimal).

**La mise en place formelle :** tu dois sélectionner le meilleur candidat parmi une séquence de N candidats présentés un par un. Tu ne peux pas revenir à un candidat vu précédemment. Quand t'arrêter et t'engager ?

**La solution classique :** observer les premiers ⌊N/e⌋ ≈ 37% de la séquence sans s'engager (fenêtre d'observation), puis s'engager sur le premier candidat meilleur que tous les candidats vus jusqu'alors dans cette fenêtre. Ça maximise la probabilité de sélectionner le meilleur candidat — à ~37%.

**Appliqué à un set live :** les 30–40 premières minutes d'un set sont ta **fenêtre d'observation**. Tu lis la salle, testes les réponses, te calibres. Les tracks qui tombent dans les 30 premières minutes te disent dans quelle direction t'engager. Après ça, ton seuil d'engagement doit baisser — si une track a marché il y a 15 minutes sur un moment de public similaire, la track en main maintenant a un prior raisonnable.

**Le mode d'échec :** les DJs qui ne quittent jamais la fenêtre d'observation (cherchant constamment la track parfaite suivante, ne s'engageant jamais) produisent des sets hésitants et sans direction. À l'inverse, les DJs qui s'engagent trop tôt et ne peuvent pas s'adapter produisent des sets rigides qui échouent quand la salle change.

**Règle pratique :**
- 20 premières minutes : teste librement. Essaie des picks inattendus. Observe la réponse.
- Minutes 20–40 : identifie les 3–4 qualités auxquelles la salle répond. Engage-toi sur ces axes.
- Après 40 minutes : planifie 2 tracks à l'avance. La charge cognitive de la sélection en temps réel est libérée pour lire la salle.

**L'outil complémentaire :** les hot cues sur tes CDJs sont une solution partielle au problème d'arrêt optimal. En pré-marquant les cue points sur 200 tracks avant le gig, tu réduis le coût de chaque "inspection de candidat" de 30 secondes de scrubbing à 2 secondes de reconnaissance visuelle. Coût d'inspection plus faible = tu peux évaluer plus de candidats dans la même fenêtre de temps.
"""

