[fr]
title      = "Discogs — Ton Outil de Recherche Musicale"
short_desc = "La plus grande base de données musicale au monde. Voilà comment l'utiliser en 10 minutes."

[[fr.pages]]
title   = "C'est quoi Discogs ?"
content = """
**Discogs** est une gigantesque base de données de releases musicales en ligne — chaque album, EP, single et 12" jamais pressé, catalogué par des amateurs de musique depuis 2000.

C'est gratuit. En ce moment, il y a plus de **16 millions de releases** avec :
- Infos artiste et label
- Année et pays de sortie
- Format (vinyle, CD, numérique...)
- Tags de genre et de style
- Tracklist avec les noms des versions
- Photos de la pochette et du disque

**Pour les DJs, c'est essentiel pour deux choses :**

1. **Identifier des tracks** que tu as entendues quelque part — tu sais vaguement à quoi ça ressemble, et tu utilises les filtres pour réduire ce que c'est.

2. **Trouver de nouvelles tracks** dans un genre, label ou époque que tu veux explorer.

Pense-y comme Google Images pour les disques — mais avec des métadonnées propres que tu peux filtrer.
"""

[[fr.pages]]
title   = "La recherche de base — 4 filtres qui font la plupart du boulot"
content = """
Va sur **discogs.com** → clique "Search" → clique "Advanced Search".

**Les 4 filtres que tu vas le plus utiliser :**

**Genre :** la grande catégorie. "Electronic", "Hip Hop", "Funk/Soul". Commence ici.

**Style :** le sous-genre. "Deep House", "Minimal Techno", "Funk". Réduit beaucoup plus vite que Genre seul.

**Year :** une année ou un range (ex. 1994–2001). Extrêmement utile pour filtrer par époque.

**Format :** "12"" pour le vinyle DJ-friendly. "LP" pour les albums. "CD" pour les CD.

**Exemple de recherche :** tu veux des tracks deep house des années 90 en vinyle.
- Genre : Electronic
- Style : Deep House
- Year : 1990–1999
- Format : 12"

Lance la recherche. Au lieu de 16 millions de releases tu en as 300–800 qui sont vraiment pertinentes. C'est tout le truc.
"""

[[fr.pages]]
title   = "Wantlist et navigation par label"
content = """
Deux choses à faire maintenant :

**1 — Ajoute des trucs à ta Wantlist.**
Chaque fois que tu vois une release qui t'intéresse, clique l'icône cœur pour l'ajouter à ta Wantlist. Discogs te notifie quand une copie est disponible sur la Marketplace. C'est ta liste de dig long terme.

**2 — Clique les noms de labels.**
C'est le move que la plupart des débutants ratent. Quand tu trouves une track que tu adores, **clique le nom du label** sur la fiche de release. Ça t'emmène vers une discographie complète de tout ce que ce label a jamais sorti.

Les labels ont un son. Si tu adores une track d'un label, il y en a probablement 10 autres que tu aimerais. Browse le catalogue du label 10 minutes — tu trouveras presque toujours quelque chose que tu ne savais pas qui existait.

**Deux labels solides pour commencer en musique électronique :**
- **Trax Records** (Chicago, 1983+) — le berceau de la house music
- **Tresor** (Berlin, 1991+) — la maison de la techno berlinoise

Clique l'un ou l'autre sur Discogs et tu passeras une heure dans le terrier du lapin.
"""

[[fr.quiz]]
question = "Que fait le filtre 'Style' de Discogs que 'Genre' ne fait pas ?"
answers  = ["Il trie automatiquement par date", "Il réduit le genre à un sous-genre précis (ex. Deep House dans Electronic)", "Il n'affiche que les sorties en vinyle"]
correct  = 1

[[fr.quiz]]
question = "Tu trouves une track que tu adores. Que fais-tu avec le nom du label sur la fiche de release ?"
answers  = ["Tu l'ignores — les labels n'ont pas d'importance", "Tu cliques dessus et tu browses toute la discographie du label pour trouver d'autres tracks", "Tu l'utilises pour filtrer par pays"]
correct  = 1

[[fr.quiz]]
question = "Qu'est-ce qu'ajouter une release à ta Wantlist Discogs fait ?"
answers  = ["L'achète instantanément", "Te notifie quand une copie devient disponible sur la Marketplace", "Télécharge le MP3"]
correct  = 1

