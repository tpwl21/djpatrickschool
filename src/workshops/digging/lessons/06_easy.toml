[en]
title      = "Discogs — Your Music Research Tool"
short_desc = "The world's biggest music database. Here's how to use it in 10 minutes."

[[en.pages]]
title   = "What is Discogs?"
content = """
**Discogs** is a giant online database of music releases — every album, EP, single, and 12" ever pressed, catalogued by music lovers since 2000.

It's free to use. Right now, it has over **16 million releases** with:
- Artist and label info
- Year and country of release
- Format (vinyl, CD, digital...)
- Genre and style tags
- Tracklist with version names
- Photos of the sleeve and record

**For DJs, it's essential for two things:**

1. **Identifying tracks** you heard somewhere — you know roughly what it sounds like, and you use the filters to narrow down what it is.

2. **Finding new tracks** in a genre, label, or era you want to explore.

Think of it as Google Images for records — but with proper metadata you can filter.
"""

[[en.pages]]
title   = "The basic search — 4 filters that do most of the work"
content = """
Go to **discogs.com** → click "Search" → click "Advanced Search".

**The 4 filters you'll use most:**

**Genre:** the broad category. "Electronic", "Hip Hop", "Funk/Soul". Start here.

**Style:** the sub-genre. "Deep House", "Minimal Techno", "Funk". Narrows it much faster than Genre alone.

**Year:** a single year or a range (e.g. 1994–2001). Extremely useful to filter by era.

**Format:** "12"" for DJ-friendly vinyl. "LP" for full albums. "CD" for CDs.

**Example search:** you want deep house tracks from the 90s on vinyl.
- Genre: Electronic
- Style: Deep House
- Year: 1990–1999
- Format: 12"

Hit search. Instead of 16 million releases you get maybe 300–800 that are genuinely relevant. That's the whole trick.
"""

[[en.pages]]
title   = "Wantlist and label browsing"
content = """
Two things to do right now:

**1 — Add things to your Wantlist.**
Every time you see a release that interests you, click the heart icon to add it to your Wantlist. Discogs will notify you when a copy comes available in the Marketplace. This is your long-term dig list.

**2 — Click label names.**
This is the move that most beginners miss. When you find a track you love, **click the label name** on the release page. This takes you to a full discography of everything that label ever released.

Labels have a sound. If you love one track on a label, there are probably 10 more you'd love. Browse the label's catalog for 10 minutes — you'll almost always find something you didn't know existed.

**Two solid starting labels for electronic music:**
- **Trax Records** (Chicago, 1983+) — the birthplace of house music
- **Tresor** (Berlin, 1991+) — the home of Berlin techno

Click either of those on Discogs and you'll spend an hour going down the rabbit hole.
"""

[[en.quiz]]
question = "What does the Discogs 'Style' filter do that 'Genre' doesn't?"
answers  = ["It sorts by date automatically", "It narrows the genre to a specific sub-genre (e.g. Deep House within Electronic)", "It shows only vinyl releases"]
correct  = 1

[[en.quiz]]
question = "You find a track you love. What should you do with the label name on the release page?"
answers  = ["Ignore it — labels don't matter", "Click it and browse the full label discography for more tracks", "Use it to filter by country"]
correct  = 1

[[en.quiz]]
question = "What does adding a release to your Discogs Wantlist do?"
answers  = ["Instantly buys it", "Notifies you when a copy becomes available in the Marketplace", "Downloads the MP3"]
correct  = 1

