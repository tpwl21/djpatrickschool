[fr]
title      = "Énergie vs Compatibilité Technique — Design de Set Pratique"
short_desc = "Le vecteur énergie, transitions de vibe et BPM indépendantes, et quand casser les règles."

[[fr.pages]]
title   = "La compatibilité technique est un plancher, pas un plafond"
content = """
Le BPM et la Camelot te disent qu'une track NE clashera PAS. Ils ne te disent pas qu'elle VA marcher.

Deux techno à 130 BPM en 1A peuvent sonner radicalement différent : l'une tendue et driving, l'autre flottante et ambient. Jouer l'ambient juste après un banger peak-time est techniquement propre — et un désastre sur le dancefloor.

**La courbe d'énergie de ton set est une dimension séparée des chiffres.**

Les grands DJs la sentent sans réfléchir. Les moins grands l'apprennent par leurs échecs.

**Distinction utile :**
- **Transition BPM :** changer le tempo. L'arithmétique du pitch-shift s'applique.
- **Transition de vibe :** changer l'énergie / la texture / l'émotion. Complètement indépendant du BPM.

Tu peux passer de 128 à 124 en gardant exactement la même vibe. Tu peux rester à 128 et retourner la vibe complètement (minimal → maximal, sec → reverbéré, driving → flottant). La plupart des débutants confondent les deux, d'où leurs sets à une seule dimension.
"""

[[fr.pages]]
title   = "Le vecteur énergie — noter tes tracks"
content = """
L'énergie est un **vecteur** : elle a une direction (montante / tenue / descendante) et une intensité (1–5).

L'énergie d'une track = produit de :
- BPM (plus haut = plus d'activation)
- Densité (nombre de couches)
- Brillance texturale (quantité d'aigus)
- Urgence rythmique (à quel point le pattern est insistant)

**Workflow pratique :** note chaque track de ton crate de gig sur l'échelle 1–5 à la première écoute. Écris-la dans le **champ Comments** (Rekordbox, Serato). En set tu vois les chiffres d'énergie à côté des noms de fichier.

**Lire les chiffres :**
- Passer de 3 → 5 : un saut. Cool si c'est peak-time, fatal à 10 minutes de warmup.
- Passer de 4 → 2 : une release. Marche après un sustain prolongé à 4, pas après 30 secondes à 4.
- Tenir à 4 trop longtemps : l'habituation s'installe — le public cesse de répondre. Prévois une vallée.

**Le système de couleur Rekordbox :**
Utilise le tag couleur comme deuxième dimension :
- Rouge : haute énergie / peak-time
- Jaune : énergie moyenne / transitionnel
- Vert : basse énergie / warmup-afterhours

Ces trois couleurs sont réservées à l'énergie — ne les réutilise pas pour autre chose (les catégories de sauvetage ont d'autres couleurs, voir la leçon suivante).

Tag couleur visible d'un coup d'œil en set. Combine avec le chiffre d'énergie dans Comments pour un tri à deux axes.
"""

[[fr.pages]]
title   = "Quand casser les règles"
content = """
Les règles techniques (BPM, clé, match d'énergie) couvrent la plupart de tes choix. Les exceptions, c'est là que l'identité artistique vit.

**Rule-breaking plus safe — mismatch partiel :**
Change UN axe à la fois, garde les autres intacts.
- Garde BPM et énergie → change la clé (tension harmonique)
- Garde BPM et clé → change la texture (sec → reverb, mono → wide)
- Garde clé et énergie → change le BPM (saut de ±6 BPM)

Le mismatch total sur tous les axes d'un coup, c'est pour les DJs avec 15+ ans de lecture de salles. Le mismatch partiel, c'est la voie vers la tension productive pour tous les autres.

**La règle de l'engagement :**
Un mismatch délibéré ne marche que si tu le tiens assez longtemps pour que le public l'accepte comme intentionnel. Repères :
- Une phrase entière (32 beats) de tension, puis release = se lit comme intentionnel
- Quelques beats, puis patch rapide = se lit comme une erreur

Même crash d'énergie, deux résultats : la différence, c'est combien de temps tu le tiens.

**Le lien avec le closing (LESSON_RTC_5) :** la surprise ne tombe que si elle est assumée.
"""

