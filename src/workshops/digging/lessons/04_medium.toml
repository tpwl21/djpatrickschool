[en]
title      = "Energy vs Technical Compatibility — Practical Set Design"
short_desc = "The energy vector, independent vibe and BPM transitions, and when to break the rules."

[[en.pages]]
title   = "Technical compatibility is a floor, not a ceiling"
content = """
BPM and Camelot tell you a track WON'T clash. They don't tell you it WILL work.

Two techno tracks at 130 BPM in 1A can feel radically different: one tense and driving, one floating and ambient. Playing the ambient one right after a peak-time banger is technically clean — and a dancefloor disaster.

**The energy curve of your set is a separate dimension from the numbers.**

Great DJs feel this without thinking. Less-great DJs learn it through failures.

**Useful distinction:**
- **BPM transition:** changing tempo. The arithmetic of pitch-shift applies.
- **Vibe transition:** changing energy / texture / emotion. Completely independent from BPM.

You can go from 128 to 124 and keep the vibe identical. You can stay at 128 and completely flip the vibe (minimal → maximal, dry → reverbed, driving → floating). Most beginners conflate the two, which is why their sets feel one-dimensional.
"""

[[en.pages]]
title   = "The energy vector — rating your tracks"
content = """
Energy is a **vector**: it has direction (rising / holding / falling) and intensity (1–5).

A track's energy = product of:
- BPM (higher = more activation)
- Density (how many layers)
- Textural brightness (how much high-end)
- Rhythmic urgency (how insistent the pattern is)

**Practical workflow:** rate every track in your gig crate on the 1–5 energy scale the first time you hear it. Write it in the **Comments field** (Rekordbox, Serato). During the set, you see energy numbers next to filenames.

**Reading the numbers:**
- Going from 3 → 5: a jump. Fine for peak-time, fatal 10 minutes into warmup.
- Going from 4 → 2: a release. Works after sustained 4, not after 30 seconds at 4.
- Holding at 4 for too long: habituation sets in — the crowd stops responding. Plan a valley.

**The Rekordbox colour system:**
Use the colour tag as a second dimension:
- Red: high-energy / peak-time
- Yellow: mid-energy / transitional
- Green: low-energy / warmup-afterhours

These three colours are reserved for energy — don't reuse them for anything else (rescue categories get other colours, see the next lesson).

Colour tag visible at a glance during a set. Combine with energy number in Comments for a two-axis sort.
"""

[[en.pages]]
title   = "When to break the rules"
content = """
Technical rules (BPM, key, energy matching) cover most of your choices. The exceptions are where artistic identity lives.

**Safer rule-breaking — partial mismatch:**
Change ONE axis at a time, keep the others intact.
- Keep BPM and energy → change key (harmonic tension)
- Keep BPM and key → change texture (dry → wet, mono → wide)
- Keep key and energy → change BPM (±6 BPM jump)

Full mismatch on all axes at once is for DJs with 15+ years of reading rooms. Partial mismatch is the path to productive tension for everyone else.

**The commitment rule:**
A deliberate mismatch only works if you hold it long enough for the crowd to accept it as intentional. Rules of thumb:
- A full phrase (32 beats) of tension, then release = reads as intentional
- A few beats, then a quick patch = reads as a mistake

Same energy crash, two outcomes: the difference is how long you hold it.

**The connection to closing (LESSON_RTC_5):** surprise only lands when it's committed to.
"""

