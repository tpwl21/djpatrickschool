[en]
title      = "Anatomy of a DJ-Friendly Track — Version Taxonomy & Waveform Craft"
short_desc = "The full mix vocabulary, waveform pattern-reading, and Rekordbox cue discipline."

[[en.pages]]
title   = "The complete mix taxonomy"
content = """
Electronic labels have a precise vocabulary for different versions of the same track. Knowing it makes you faster and smarter when digging.

| Version name | Length | Vocal? | DJ use |
|---|---|---|---|
| Club Mix | 6–8 min | Yes, mid-track | Primary DJ format |
| Extended Mix | 8–12 min | Yes, mid-track | Maximum structural room |
| 12" Mix | 6–10 min | Variable | Vinyl DJ format, often equals Extended |
| Radio Edit | 2.5–4 min | Immediately | Not for DJ use |
| Dub | 6–8 min | Effects/stems only | Excellent for blending |
| Instrumental | 6–8 min | None | Similar to Dub |
| Acapella | Variable | Only vocals | Creative layering |
| VIP | Variable | Variable | Artist's own re-edit, often darker/clubbier |
| Club Edit | 5–6 min | Mid-track | Compromise — less structural room than Extended |

**Caution**: some labels invert conventions, especially in Italian disco (where "Dub" sometimes means the long version). Always verify by checking length — under 4 min = Radio Edit regardless of label.

The **Extended Mix** is typically the DJ's best friend: it gives 8–12 minutes of structure with enough intro/outro to blend in either direction.
"""

[[en.pages]]
title   = "Phrase structure and waveform reading"
content = """
Understanding phrase structure (covered in depth in Beatmatching LESSON_BM_2) gives you a specific lens for reading waveforms.

**The 32-beat phrase skeleton:**
Most electronic music is organized in 32-beat phrases (8 bars of 4/4). In a waveform, each phrase is roughly the same visual width. You can count:
- **Intro**: 1–4 phrases of just drums/bass
- **Build**: density increasing, phrase by phrase
- **Drop**: sudden full energy arrival
- **Break**: density valley (often 1–2 phrases)
- **Outro**: symmetrical mirror of intro

**What this means when digging**: if a track has a 1-phrase intro (8 bars = ~15 sec at 128 BPM), you have very little mixing room. 2-phrase intro (64 beats = ~30 sec) is workable. 4+ phrases is comfortable. Look for the visual plateau at the start of the waveform — how wide is it?

**Practical in Rekordbox**: Phrase Analysis (available in Rekordbox 6+) auto-detects intro/outro and labels phrases. This is a starting point, not a ground truth — always verify by listening, especially on non-4/4 material.
"""

[[en.pages]]
title   = "Cue point discipline"
content = """
A cue point is a bookmark you place on a track's timeline. On CDJs/controllers, you can instantly jump to a cue point with one button press.

**Standard four-point setup:**
- **Cue A (Green)**: start of the clean intro (your mix-in point)
- **Cue B (Yellow)**: first drop / peak moment
- **Cue C (Blue)**: start of the break (know where to brace)
- **Cue D (Red)**: start of the outro (your mix-out point)

This setup means: at any point in a live set, you can read at a glance where you are in the track relative to your mix windows.

**Hot loop discipline**: before a break, set a 4-beat loop on the last phrase before the break. If you need more time (bad transition, crowd not ready), you can extend the track by looping indefinitely without the break landing.

**Why this beats winging it**: a track you've cued properly is a track you *understand*. You know every structural moment. You can have a conversation with someone at the booth and still nail the transition because the geography is memorized.
"""

[[en.pages]]
title   = "The drop as genre signature"
content = """
The "drop" is the moment of maximum energy arrival — when all elements return after a stripped-down section. Its specific shape is a genre fingerprint:

**House / Deep House**: gradual threshold crossing. Density rises phrase by phrase; the "drop" is less a moment than a sustained arrival. Jeff Mills described this as "one layer removed, one layer added every 32 beats."

**Big-room EDM**: dramatic silence (1–4 beats), then full-energy impact on the downbeat. Dynamic range can exceed 20 dB (silence → kick + everything). Designed for a crowd to anticipate and respond physically.

**Drum & Bass**: snare roll (16–32 beats building tension) → sub-bass drop precisely calibrated to room acoustics. The sub enters at a frequency that physically vibrates the crowd (typically 40–80 Hz in a properly tuned system).

**Techno (minimal/Berlin)**: the "drop" is often structural — a moment where the arrangement floor rises or falls. There's rarely a complete silence; the texture shifts rather than drops.

**Why this matters for digging**: if you're building a set that transitions between genres, knowing where each genre's drop lands (and what shape it takes) tells you which moments are safe transition windows and which are commitment points where you can't be mid-mix.
"""

