[fr]
title      = "Anatomie d'une track DJ-Friendly — Taxonomie des versions & lecture de waveform"
short_desc = "Le vocabulaire complet des mixes, lire les waveforms, et la discipline des cue points Rekordbox."

[[fr.pages]]
title   = "La taxonomie complète des mixes"
content = """
Les labels électroniques ont un vocabulaire précis pour les différentes versions d'une même track. Le connaître te rend plus rapide et plus intelligent quand tu digges.

| Nom de la version | Durée | Vocal ? | Usage DJ |
|---|---|---|---|
| Club Mix | 6–8 min | Oui, milieu de track | Format DJ principal |
| Extended Mix | 8–12 min | Oui, milieu de track | Maximum de structure |
| 12" Mix | 6–10 min | Variable | Format DJ vinyle, souvent = Extended |
| Radio Edit | 2.5–4 min | Immédiatement | Pas pour usage DJ |
| Dub | 6–8 min | Effets/stems seulement | Excellent pour le blend |
| Instrumental | 6–8 min | Aucun | Similaire au Dub |
| Acapella | Variable | Voix seulement | Layering créatif |
| VIP | Variable | Variable | Re-edit de l'artiste, souvent plus sombre/club |
| Club Edit | 5–6 min | Milieu de track | Compromis — moins de structure que l'Extended |

**Attention** : certains labels inversent les conventions, notamment en disco italien (où "Dub" signifie parfois la version longue). Vérifie toujours la durée — moins de 4 min = Radio Edit quelle que soit l'étiquette.

L'**Extended Mix** est en général le meilleur ami du DJ : 8–12 minutes de structure avec assez d'intro/outro pour blender dans les deux sens.
"""

[[fr.pages]]
title   = "Structure des phrases et lecture de waveform"
content = """
Comprendre la structure par phrases (traitée en profondeur dans Beatmatching LESSON_BM_2) te donne un prisme pour lire les waveforms.

**Le squelette de la phrase 32 beats :**
La plupart de la musique électronique est organisée en phrases de 32 beats (8 mesures de 4/4). Sur une waveform, chaque phrase a à peu près la même largeur visuelle. Tu peux compter :
- **Intro** : 1–4 phrases de juste drums/basse
- **Build** : densité croissante, phrase après phrase
- **Drop** : arrivée soudaine à pleine énergie
- **Break** : vallée de densité (souvent 1–2 phrases)
- **Outro** : miroir symétrique de l'intro

**Ce que ça signifie en diggant** : si une track a une intro d'1 phrase (8 mesures = ~15 sec à 128 BPM), tu as très peu de marge de mix. 2 phrases d'intro (64 beats = ~30 sec) c'est utilisable. 4+ phrases c'est confortable. Cherche le plateau visuel au début de la waveform — quelle est sa largeur ?

**Pratique dans Rekordbox** : la Phrase Analysis (disponible dans Rekordbox 6+) détecte automatiquement intro/outro et étiquette les phrases. C'est un point de départ, pas une vérité — vérifie toujours à l'écoute, notamment sur du matériel non 4/4.
"""

[[fr.pages]]
title   = "Discipline des cue points"
content = """
Un cue point est un signet que tu poses sur la timeline d'une track. Sur CDJs/contrôleurs, tu peux sauter instantanément à un cue point d'une pression de bouton.

**Configuration standard à quatre points :**
- **Cue A (Vert)** : début de l'intro propre (ton point de mix en entrée)
- **Cue B (Jaune)** : premier drop / moment de pic
- **Cue C (Bleu)** : début du break (savoir quand se préparer)
- **Cue D (Rouge)** : début de l'outro (ton point de mix en sortie)

Cette configuration te permet : à tout moment dans un live, tu vois d'un coup d'œil où tu en es dans la track par rapport à tes fenêtres de mix.

**Discipline hot loop** : avant un break, pose un loop de 4 beats sur la dernière phrase avant le break. Si tu as besoin de plus de temps (mauvaise transition, le public n'est pas prêt), tu peux étendre la track en bouclant indéfiniment sans que le break tombe.

**Pourquoi ça bat l'improvisation totale** : une track que tu as proprement cuée est une track que tu *comprends*. Tu connais chaque moment structurel. Tu peux avoir une conversation avec quelqu'un à la cabine et quand même clouer la transition parce que la géographie est mémorisée.
"""

[[fr.pages]]
title   = "Le drop comme signature de genre"
content = """
Le "drop" est le moment d'arrivée à énergie maximale — quand tous les éléments reviennent après une section épurée. Sa forme précise est une empreinte de genre :

**House / Deep House** : franchissement progressif d'un seuil. La densité monte phrase après phrase ; le "drop" est moins un moment qu'une arrivée soutenue. Jeff Mills a décrit ça comme "une couche enlevée, une couche ajoutée toutes les 32 beats."

**Big-room EDM** : silence dramatique (1–4 beats), puis impact pleine énergie sur le premier temps. La dynamique peut dépasser 20 dB (silence → kick + tout). Conçu pour que le public anticipe et réponde physiquement.

**Drum & Bass** : snare roll (16–32 beats qui construisent la tension) → drop de sub-bass précisément calibré à l'acoustique de la salle. Le sub entre à une fréquence qui vibre physiquement le public (typiquement 40–80 Hz dans un système bien réglé).

**Techno (minimal/Berlin)** : le "drop" est souvent structurel — un moment où le plancher d'arrangement monte ou descend. Il y a rarement un silence complet ; la texture bascule plutôt qu'elle ne tombe.

**Pourquoi ça compte pour le digging** : si tu construis un set qui transite entre genres, savoir où le drop de chaque genre tombe (et quelle forme il prend) te dit quels moments sont des fenêtres de transition sûres et lesquels sont des points de non-retour où tu ne peux pas être en plein mix.
"""

