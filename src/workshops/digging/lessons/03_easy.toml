[en]
title      = "BPM — The Speed of Your Music"
short_desc = "One number, one big rule: stay within 10% and you're safe."

[[en.pages]]
title   = "What BPM means in practice"
content = """
BPM stands for **Beats Per Minute** — it's literally how fast a track moves.

A few reference points to get your ears calibrated:

- **90 BPM** — hip-hop, slow funk. Walking pace.
- **120–128 BPM** — house, deep house. Brisk jog.
- **130–140 BPM** — techno, trance. Running.
- **170–175 BPM** — drum & bass. Full sprint.

**The one rule to remember:** when you mix two tracks together, they should be close in BPM. More than 10% apart and things start sounding wrong — kicks drift, rhythms fight each other.

- 128 + 135 BPM = 5.5% apart. Workable.
- 128 + 145 BPM = 13% apart. You'll hear it. Avoid.
"""

[[en.pages]]
title   = "The ±6% safe zone"
content = """
DJ software lets you **pitch** a track — speed it up or slow it down. But there's a limit before it starts sounding bad.

**Think of it like stretching an elastic band:**
- Stretch it a little (±3%) — looks the same. Sounds normal.
- Stretch it more (±6%) — you start to notice. Kicks sound thin, voices sound a bit weird.
- Stretch it too far (±10%) — it sounds broken.

**The practical rule:**
If a track is within ±6% of your target BPM, you can pitch it to match without anyone noticing.

For a 128 BPM set:
- **Safe range to dig in:** 120–136 BPM
- Outside that = you risk hearing the stretch

No maths needed. Just look for tracks near your genre's typical BPM and you're fine.
"""

[[en.pages]]
title   = "Half-time — the secret bridge"
content = """
Here's a trick the best DJs use: **half-time and double-time**.

A track at **140 BPM** and a track at **70 BPM** — that seems too far apart, right? Actually they share the same pulse. The 140 BPM track has a kick on every beat. The 70 BPM track has a kick on every other beat. To your ear, it's the same heartbeat, just one breathes twice as fast.

DJs use this to jump between genres that seem incompatible:
- DnB (174 BPM) ↔ broken-beat (87 BPM) — same pulse, different density
- Techno (130 BPM) ↔ dub (65 BPM) — same pulse, totally different vibe

**Practical tip:** if you love a track but it seems way off BPM from your set, check if it's exactly double or half your target. If yes — it might work as a genre-bridge transition.
"""

