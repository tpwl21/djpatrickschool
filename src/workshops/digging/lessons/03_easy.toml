[fr]
title      = "BPM — La vitesse de ta musique"
short_desc = "Un seul chiffre, une seule règle : reste dans ±10% et tu es safe."

[[fr.pages]]
title   = "Ce que veut dire le BPM en pratique"
content = """
BPM = **Beats Per Minute** — c'est littéralement la vitesse d'une track.

Quelques repères pour calibrer tes oreilles :

- **90 BPM** — hip-hop, funk lent. Vitesse de marche.
- **120–128 BPM** — house, deep house. Petit trot.
- **130–140 BPM** — techno, trance. Course.
- **170–175 BPM** — drum & bass. Sprint complet.

**La règle à retenir :** quand tu mixtes deux tracks, elles doivent être proches en BPM. Au-delà de 10% d'écart, ça sonne faux — les kicks dérivent, les rythmes se battent.

- 128 + 135 BPM = 5.5% d'écart. Gérable.
- 128 + 145 BPM = 13% d'écart. Ça s'entend. À éviter.
"""

[[fr.pages]]
title   = "La zone safe ±6%"
content = """
Le logiciel DJ te permet de **pitcher** une track — l'accélérer ou la ralentir. Mais il y a une limite avant que ça commence à sonner mal.

**Imagine un élastique qu'on étire :**
- On l'étire un peu (±3%) — pareil. Son normal.
- On l'étire plus (±6%) — tu commences à remarquer. Les kicks sonnent fins, les voix un peu bizarres.
- On l'étire trop (±10%) — ça sonne cassé.

**La règle pratique :**
Si une track est dans ±6% de ton BPM cible, tu peux la pitcher pour la faire matcher sans que personne entende la différence.

Pour un set à 128 BPM :
- **Range safe pour digger :** 120–136 BPM
- En dehors de ça = tu risques d'entendre l'étirement

Pas besoin de calcul. Cherche des tracks proches du BPM typique de ton genre et tu es tranquille.
"""

[[fr.pages]]
title   = "Le half-time — le pont secret"
content = """
Voilà une astuce que les meilleurs DJs utilisent : le **half-time et le double-time**.

Une track à **140 BPM** et une track à **70 BPM** — ça semble trop éloigné, non ? En fait elles partagent la même pulsation. La track à 140 BPM a un kick sur chaque beat. Celle à 70 BPM a un kick sur un beat sur deux. Pour ton oreille, c'est le même rythme cardiaque — l'une respire juste deux fois plus vite.

Les DJs utilisent ça pour sauter entre des genres qui semblent incompatibles :
- DnB (174 BPM) ↔ broken-beat (87 BPM) — même pulsation, densité différente
- Techno (130 BPM) ↔ dub (65 BPM) — même pulsation, vibe totalement différente

**Astuce pratique :** si tu adores une track mais qu'elle semble trop éloignée en BPM de ton set, vérifie si elle est exactement au double ou à la moitié de ta cible. Si oui — elle pourrait fonctionner comme pont entre genres.
"""

