[fr]
title      = "Évaluer une track comme un DJ en activité"
short_desc = "Vérifie la version, la grille et les fenêtres de mix avant qu'une track entre dans ton crate."

[[fr.pages]]
title   = "L'étiquette ment : vérifie la version"
content = """
Les noms de version sont une convention, pas une garantie. Un "Club Mix" peut avoir une voix dès la mesure 1, et un "Radio Edit" peut être un edit parfaitement jouable. Considère le titre comme un indice et vérifie le fichier.

**Trois vérifications, dans cet ordre :**

1. **Durée vs. nom.** Moins de 4 minutes est un signal d'alerte, pas un verdict : certains edits DJ et outils sont courts exprès. Plus de 6 minutes indique en général une structure pensée pour les DJs, mais pas toujours.
2. **Les 30 premières secondes.** Drums seuls, ou voix / lead tout de suite ? C'est ta vraie fenêtre de mix en entrée.
3. **Les 30 dernières secondes.** La track se vide progressivement, ou s'arrête net ? Un arrêt net veut dire que tu dois être sorti avant la fin.

**Dub, Instrumental, Club Edit :** les noms varient selon le label et l'époque. Juge sur le contenu : pas de voix dans la zone de mix en entrée, c'est ça que tu achètes.

**Règle :** une track dont tu n'as pas vérifié les deux bouts n'est pas encore à toi.
"""

[[fr.pages]]
title   = "Longueur d'intro en phrases, et grille"
content = """
Compte l'intro en phrases, pas en minutes. À 128 BPM un temps dure environ 0,47 s, donc :

| Intro | Temps | Durée à 128 BPM |
|---|---|---|
| 1 phrase (8 mesures) | 32 | environ 15 s |
| 2 phrases | 64 | environ 30 s |
| 4 phrases | 128 | environ 60 s |

Une phrase laisse peu de place : un blend court, ou une coupe. Deux, c'est jouable ; quatre, confortable. Autre BPM, autres secondes : recalcule toujours.

**Vérifie la beatgrid avant de lui faire confiance.** L'analyse automatique est un point de départ. Regarde :
- le premier temps fort posé sur le premier vrai kick, pas sur une levée ou un bruit
- une grille qui reste alignée jusqu'à la fin : si elle dérive, la track n'a sans doute pas été faite sur une grille fixe (batterie live, vieux enregistrements) et demandera une correction manuelle ou un mix très attentif à la main
- les lectures en demi ou double BPM : si l'écran affiche 64 sur ce qui se ressent comme du 128, corrige avant que ça trompe ton sync

Une grille fausse fausse chaque cue et chaque décision de sync : elle passe donc avant les cue points.
"""

[[fr.pages]]
title   = "Plan de cues et récap"
content = """
Une fois la version et la grille justes, pose les repères que tu utiliseras vraiment :

- **Mix-in** au début de l'intro propre.
- **Mix-out** au début de l'outro.
- Un repère de **break** juste avant chaque breakdown : il te dit où l'énergie va tomber, donc jamais de surprise en live.
- Un **loop** sur la dernière phrase avant un break te donne du temps si la track suivante n'est pas prête (détails dans la leçon 5).

Peu de repères fiables valent mieux que beaucoup de repères douteux. Une track entre dans le crate quand tu sais la mixer en entrée et en sortie les yeux fermés.

**Récap**
- Le titre est un indice ; la durée, les 30 premières et les 30 dernières secondes sont la preuve.
- Compte les intros en phrases et recalcule les secondes selon le BPM.
- Corrige la beatgrid d'abord ; chaque cue en dépend.
- Marque mix-in, mix-out et breaks, puis prévisualise la track en entier une fois.
"""

