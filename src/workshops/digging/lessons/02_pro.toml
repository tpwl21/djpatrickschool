[en]
title      = "Vetting a Track Like a Working DJ"
short_desc = "Check the version, the grid and the mix windows before a track earns a place in your crate."

[[en.pages]]
title   = "The label lies: verify the version"
content = """
Version names are a convention, not a guarantee. A "Club Mix" can have a vocal from bar 1, and a "Radio Edit" can be a perfectly usable edit. Treat the title as a hint and check the file.

**Three checks, in this order:**

1. **Length vs. name.** Under 4 minutes is a red flag, not a verdict: some DJ edits and short tools are that short on purpose. Over 6 minutes usually means a DJ-oriented structure, but not always.
2. **First 30 seconds.** Drums only, or a vocal / lead right away? That is your real mix-in window.
3. **Last 30 seconds.** Does the track peel away, or stop dead? A hard stop means you must be out before it ends.

**Dub, Instrumental, Club Edit:** names vary by label and era. Judge by content: no vocals in the mix-in zone is what you are buying.

**Rule:** a track you have not checked at both ends is a track you do not own yet.
"""

[[en.pages]]
title   = "Intro length in phrases, and the grid"
content = """
Count the intro in phrases, not minutes. At 128 BPM one beat lasts about 0.47 s, so:

| Intro | Beats | Time at 128 BPM |
|---|---|---|
| 1 phrase (8 bars) | 32 | about 15 s |
| 2 phrases | 64 | about 30 s |
| 4 phrases | 128 | about 60 s |

One phrase leaves little room: a short blend, or a cut. Two is workable, four is comfortable. Different BPM, different seconds: always recompute.

**Check the beatgrid before you trust it.** Automatic analysis is a starting point. Look for:
- the first downbeat marked on the first real kick, not on a pickup or a noise
- a grid that stays aligned to the end: if it drifts, the track was probably not made on a fixed grid (live drums, old recordings), and it will need manual fixing or careful riding by hand
- half or double BPM readings: if the display says 64 on what feels like 128, fix it before it fools your sync

A wrong grid makes every cue and every sync decision wrong, so it comes before the cue points.
"""

[[en.pages]]
title   = "Cue plan and recap"
content = """
Once the version and the grid are right, set the markers you will actually use:

- **Mix-in** at the start of the clean intro.
- **Mix-out** at the start of the outro.
- **Break** marker just before any breakdown: it tells you where the energy will fall, so you never get surprised by it live.
- A **loop** on the last phrase before a break gives you extra time if the next track is not ready (details in lesson 5).

Fewer markers you trust beat many you do not. A track gets into the crate when you can mix it in and out blind.

**Recap**
- Title is a hint; length, first 30 s and last 30 s are the evidence.
- Count intros in phrases and recompute seconds for the BPM.
- Fix the beatgrid first; every cue depends on it.
- Mark mix-in, mix-out and breaks, then preview the whole track once.
"""

