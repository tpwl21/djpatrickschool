[fr]
title      = "Construire un Crate de Set — Tri à Trois Axes & Discipline Rekordbox"
short_desc = "La structure de dossiers qui sauve un set : énergie, moment, catégorie de sauvetage — et discipline des hot cues."

[[fr.pages]]
title   = "Le tri à trois axes"
content = """
Organise ton crate de gig sur trois axes :

**1 — Par énergie (1–5) :** dossiers séparés par niveau. C'est ton filtre principal — réduit 400 tracks à 60–80 en quelques secondes.

**2 — Par moment :** Opening / Warmup / Peak / Afterpeak / Closing. Pas la même chose que le niveau d'énergie — une track Afterpeak peut être énergie 3 mais spécifiquement conçue pour la texture post-peak, différente d'une track Warmup générique au même niveau d'énergie.

**3 — Par catégorie de sauvetage (code couleur dans Rekordbox) :**
- **Violet** : tracks oh-shit (10–15 max — le dossier de sauvetage)
- **Turquoise** : bangers safe (crowd-pleasers solides, énergie moyenne-haute)
- **Rose** : armes secrètes (tracks que personne ne connaît, tes picks d'identité)

Rouge / jaune / vert restent réservés à l'énergie (leçon précédente), pour que les deux systèmes ne se télescopent jamais.

Un crate de gig de **200–400 tracks** sur cette grille bat 10 000 en vrac à chaque fois. Tu as besoin de la bonne track en 60 secondes, pas en 10 minutes de scroll.
"""

[[fr.pages]]
title   = "Workflow Rekordbox — playlists, hot cues, tags couleur"
content = """
**Hiérarchie de playlists :**
```
Gig
└── 2024-06-15
    ├── Warmup (120–125)
    ├── Cœur (126–130)
    └── Peak (131–136)
```

Utilise des playlists imbriquées — pas plates. Une playlist plate de 200 tracks = 10 secondes pour trouver quoi que ce soit. Une playlist imbriquée t'amène à un dossier de 15 tracks en 2 secondes.

**Hot cues :** utilise le standard ABCD à quatre points de la leçon 2 (A = mix en entrée, B = premier drop, C = break, D = outro / mix en sortie, le rouge). Chaque track de ton crate de gig doit avoir ces 4 cues posés avant le gig. Une track sans hot cues, c'est une track que tu navigues à l'aveugle.

**Portabilité USB :** toutes les métadonnées (playlists, cues, tags couleur) voyagent avec ta clé USB et apparaissent identiquement sur n'importe quel Pioneer CDJ. Analyse les tracks dans Rekordbox avant de les charger sur USB — l'analyse à la volée sur le CDJ est plus lente et moins précise.
"""

[[fr.pages]]
title   = "Le dossier oh-shit — critères et curation"
content = """
Tout DJ sérieux garde un dossier privé de 10–15 tracks qui vont tomber quel que soit le contexte. Ce sont les tracks de sauvetage. Le dancefloor s'effondre, la vibe est à côté — tu en drop une et tu t'achètes 5 minutes pour te remettre.

**Critères d'une track oh-shit :**
- **Reconnaissable en 8 mesures** — dopamine instantanée, aucun setup requis
- **Universellement accessible** — ne nécessite pas le 'bon' public pour tomber
- **Énergie moyenne à haute** — un sauvetage ne devrait pas faire baisser le floor
- **Mixable sur une fenêtre de ±8 BPM** — parce que la track à sauver n'est pas toujours au même tempo
- **Long intro propre** — 32–64 beats de drums seuls pour que tu puisses mixer en entrée depuis n'importe où

**Distinction critique :**
Ton dossier oh-shit n'est PAS tes tracks préférées. C'est tes tracks les plus *fiables*. Fiabilité et excellence sont deux axes différents. Une track qui te prend 3 mois à trouver et qui nécessite le contexte de public parfait pour tomber est excellente. Une track qui marche à 23h et à 3h, pour n'importe quel public, dans n'importe quel contexte, est fiable. Le dossier oh-shit contient les fiables.

**Construire la liste :** ça prend des années. Note quelles tracks t'ont sauvé dans de vrais sets — c'est la liste empirique, plus fiable que la théorique. L'exemple classique de techno française : Laurent Garnier — "The Man With The Red Face". La tienne sera différente.
"""

[[fr.pages]]
title   = "Le paradoxe de la track parfaite suivante — quand la laisser partir"
content = """
'La track parfaite suivante a existé pendant 10 minutes dans ton set et maintenant elle est partie.'

Parfois le pick idéal, c'est une track qui aurait marché il y a 5 minutes et ne marchera plus maintenant. L'énergie a bougé. Quand tu rates une fenêtre, ne force pas — laisse partir et trouve un nouveau pick pour le nouveau moment.

**Corollaire pratique : planifie les 20 premières minutes, improvise le reste.**

Les 20 premières minutes installent la tonalité du set : range de BPM, centre tonal, texture. Après ça, la réponse du public détermine ce que tu sors. Les DJs qui planifient des sets 3h minute-par-minute se font détruire au premier reality check (une salle pleine d'habitués quand ils prévoyaient des nouveaux venus). Un plan, c'est une porte d'embarquement, pas un horaire de train.

**Hot loops comme assurance :** un loop de 4 beats posé sur la dernière phrase avant un break (détails dans la leçon 2) te permet d'étendre la track indéfiniment sans que le break tombe. C'est le filet de sécurité mécanique pour le moment où tu as raté la fenêtre — tu gagnes du temps sans trou audible.

**Le crate sert le moment, pas l'inverse.** Un crate bien trié compte précisément parce qu'il te permet de pivoter vite quand le plan s'évapore.
"""

