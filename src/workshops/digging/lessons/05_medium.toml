[en]
title      = "Building a Gig Crate — Three-Axis Sort & Rekordbox Discipline"
short_desc = "The folder structure that saves a set: energy, moment, rescue category — and hot cue discipline."

[[en.pages]]
title   = "The three-axis sort"
content = """
Organise your gig crate along three axes:

**1 — By energy (1–5):** separate folders per level. This is your primary filter — narrows 400 tracks to 60–80 in seconds.

**2 — By moment:** Opening / Warmup / Peak / Afterpeak / Closing. Not the same as energy level — an Afterpeak track can be energy 3 but specifically designed for post-peak texture, different from a generic Warmup track at the same energy.

**3 — By rescue category (colour-coded in Rekordbox):**
- **Purple**: oh-shit tracks (10–15 max — the rescue folder)
- **Aqua**: safety bangers (solid crowd-pleasers, mid-high energy)
- **Pink**: secret weapons (tracks nobody knows, your identity picks)

Red / yellow / green stay reserved for energy (previous lesson), so the two systems never collide.

A gig crate of **200–400 tracks** across this grid beats 10,000 unsorted every time. You need the right track in 60 seconds, not in 10 minutes of scrolling.
"""

[[en.pages]]
title   = "Rekordbox workflow — playlists, hot cues, colour tags"
content = """
**Playlist hierarchy:**
```
Gig
└── 2024-06-15
    ├── Warmup (120–125)
    ├── Main (126–130)
    └── Peak (131–136)
```

Use nested playlists — not flat. A flat playlist of 200 tracks is 10 seconds to find anything. A nested playlist gets you to a 15-track folder in 2 seconds.

**Hot cues:** use the four-point ABCD standard from lesson 2 (A = mix-in, B = first drop, C = break, D = outro / mix-out, the red one). Every track in your gig crate should have these 4 cues set before the gig. A track without hot cues is a track you're navigating blind.

**USB portability:** all metadata (playlists, cues, colour tags) travels with your USB stick and appears identically on any Pioneer CDJ. Analyse tracks in Rekordbox before loading to USB — on-the-fly analysis on the CDJ is slower and less accurate.
"""

[[en.pages]]
title   = "The oh-shit folder — criteria and curation"
content = """
Every serious DJ keeps a private folder of 10–15 tracks that will land regardless of context. These are the rescue tracks. The dancefloor is crashing, the vibe is off — you drop one and buy 5 minutes to recover.

**Criteria for an oh-shit track:**
- **Recognisable within 8 bars** — instant dopamine, no setup required
- **Universally accessible** — doesn't require the 'right' crowd to land
- **Mid-to-high energy** — a rescue shouldn't lower the floor
- **Mixable across a ±8 BPM window** — because the track you're rescuing from isn't always the same tempo
- **Long clean intro** — 32–64 beats of drums only so you can mix in from anywhere

**Critical distinction:**
Your oh-shit folder is NOT your favourite tracks. It's your most *reliable* tracks. Reliability and excellence are different axes. A track that takes you 3 months to find and requires the perfect crowd context to land is excellent. A track that works at 11pm and at 3am, for any crowd, in any context, is reliable. The oh-shit folder contains the reliable ones.

**Building the list:** it takes years. Note which tracks rescued you in actual sets — that's the empirical list, more trustworthy than the theoretical one. The classic French techno example: Laurent Garnier — "The Man With The Red Face". Yours will be different.
"""

[[en.pages]]
title   = "The perfect next track paradox — when to let it go"
content = """
'The perfect next track existed for 10 minutes in your set and now it's gone.'

Sometimes the ideal pick is a track that would have worked 5 minutes ago and won't work now. The energy has moved on. When you miss a window, don't force it — let it go and find a new pick for the new moment.

**Practical corollary: plan the first 20 minutes, improvise the rest.**

The first 20 minutes establish the tonality of the set: BPM range, key centre, texture. Past that, the crowd's response determines what you pull next. DJs who plan 3-hour sets minute-by-minute get destroyed by the first reality check (a full house of regulars when they planned for newcomers). A plan is a departure gate, not a train schedule.

**Hot loops as insurance:** a 4-beat loop set on the last phrase before a break (details in lesson 2) lets you extend the track indefinitely without the break landing. It's the mechanical safety net for the moment you've missed the window — you buy time without audibly stalling.

**The crate serves the moment, not the other way around.** A well-sorted crate matters precisely because it lets you pivot fast when the plan evaporates.
"""

