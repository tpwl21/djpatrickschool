[en]
title      = "Energy — The Invisible Thread"
short_desc = "Matching BPM is the floor. Energy is what the crowd actually feels."

[[en.pages]]
title   = "Two tracks can match and still clash"
content = """
Here's something that surprises a lot of beginners: **two tracks can have the same BPM and the same key, and still sound wrong together.**

How? Because of **energy**.

Imagine two people at a party. One is dancing hard and sweating. The other just walked in, relaxed, barely moving. You can put them in the same room — but the vibe is off.

That's exactly what happens when you play a frantic, dense peak-time techno track after a slow, floaty ambient one. Technically correct. Socially wrong.

**BPM and key = no clash guaranteed.**
**Energy = whether it actually *works*.**
"""

[[en.pages]]
title   = "What energy actually means"
content = """
Energy is made of two things: **direction** and **intensity**.

**Direction:** is the energy going up, holding steady, or coming down?
- A build track: rising energy
- A banger at full force: holding energy high
- An outro: falling energy

**Intensity:** how much power does the track have? (think of a 1–5 scale)
- 1 = quiet, sparse, barely there
- 3 = groovy, solid, dancefloor-ready
- 5 = full-on, overwhelming, every element at max

**The rule:** when you pick your next track, match the energy direction and intensity to where you want the set to go. Going up? Pick something with rising intensity. Holding? Same level. Coming down? Drop one or two notches.

**Simple exercise:** rate your 10 favorite tracks on the 1–5 scale. Which ones are 1s? Which are 5s? You've just mapped your energy palette.
"""

[[en.pages]]
title   = "Changing vibe without changing BPM"
content = """
Here's a powerful trick: **you can completely flip the vibe without touching the BPM**.

Example: both tracks at 128 BPM.
- Track A: minimal techno — just a kick, a high-hat, and a dry bassline. Dark, hypnotic, 3 out of 5 energy.
- Track B: deep house — warm chords, a vocal sample, lush reverb. Euphoric, emotional, 3 out of 5 energy.

Same BPM. Same energy level. Totally different *feel*. Mixed well, this transition surprises the crowd in a good way — the tempo doesn't change, but the room suddenly feels warmer.

**Two separate dials you control:**
1. BPM dial — how fast
2. Vibe dial — the emotion, the texture, the density

Most beginners only turn the BPM dial. Great DJs turn both.
"""

[[en.quiz]]
question = "Two tracks have the same BPM and key. Does that guarantee a good mix?"
answers  = ["Yes — same BPM and key = perfect", "No — they also need compatible energy and vibe", "Yes, as long as the BPM matches, nothing else matters"]
correct  = 1

[[en.quiz]]
question = "You're at the peak of your set (energy 4/5). What energy level should your next track have?"
answers  = ["1/5 — sudden drop always works", "4–5/5 — sustain or push higher", "3/5 — always bring it down in the middle"]
correct  = 1

[[en.quiz]]
question = "You want to change the vibe (dark → warm) without changing the BPM. Is that possible?"
answers  = ["No — changing vibe always requires a BPM change", "Yes — vibe and BPM are independent dials", "Only if you use special effects"]
correct  = 1

