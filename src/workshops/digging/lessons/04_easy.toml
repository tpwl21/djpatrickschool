[fr]
title      = "L'énergie — Le fil invisible"
short_desc = "Matcher le BPM c'est le plancher. L'énergie, c'est ce que le public ressent vraiment."

[[fr.pages]]
title   = "Deux tracks peuvent matcher et quand même clasher"
content = """
Voilà quelque chose qui surprend beaucoup de débutants : **deux tracks peuvent avoir le même BPM et la même clé, et quand même sonner faux ensemble.**

Comment ? À cause de l'**énergie**.

Imagine deux personnes à une fête. L'une danse à fond, transpire. L'autre vient d'arriver, détendue, à peine en mouvement. Tu peux les mettre dans la même pièce — mais la vibe est décalée.

C'est exactement ce qui se passe quand tu joues une techno frénétique et dense juste après un morceau ambient lent et flottant. Techniquement correct. Socialement faux.

**BPM et clé = garantie de pas de clash.**
**Énergie = si ça *marche* vraiment.**
"""

[[fr.pages]]
title   = "Ce que l'énergie veut vraiment dire"
content = """
L'énergie se compose de deux choses : la **direction** et l'**intensité**.

**Direction :** l'énergie monte, tient, ou descend ?
- Une track de build : énergie montante
- Un banger à pleine puissance : énergie tenue haute
- Un outro : énergie descendante

**Intensité :** quelle puissance a la track ? (pense à une échelle de 1 à 5)
- 1 = calme, épuré, à peine présent
- 3 = groovy, solide, dancefloor-ready
- 5 = à fond, écrasant, chaque élément au max

**La règle :** quand tu choisis ta prochaine track, fais correspondre direction et intensité à l'endroit où tu veux emmener le set. Tu montes ? Choisis quelque chose avec une intensité croissante. Tu tiens ? Même niveau. Tu descends ? Baisse d'un ou deux crans.

**Exercice simple :** note tes 10 tracks préférées sur l'échelle 1–5. Lesquelles sont des 1 ? Des 5 ? Tu viens de cartographier ta palette d'énergie.
"""

[[fr.pages]]
title   = "Changer la vibe sans changer le BPM"
content = """
Voilà une astuce puissante : **tu peux complètement retourner la vibe sans toucher au BPM**.

Exemple : les deux tracks à 128 BPM.
- Track A : techno minimale — juste un kick, un hi-hat, une bassline sèche. Sombre, hypnotique, énergie 3/5.
- Track B : deep house — accords chauds, sample vocal, reverb lush. Euphorique, émotionnelle, énergie 3/5.

Même BPM. Même niveau d'énergie. Feel totalement différent. Bien mixé, cette transition surprend le public dans le bon sens — le tempo ne change pas, mais la salle devient soudainement plus chaude.

**Deux boutons séparés que tu contrôles :**
1. Le bouton BPM — la vitesse
2. Le bouton vibe — l'émotion, la texture, la densité

La plupart des débutants ne tournent que le bouton BPM. Les grands DJs tournent les deux.
"""

