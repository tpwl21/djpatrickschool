[en]
title      = "What Is Digging? — Hands-On"
short_desc = "Open Discogs right now. Your first 10 tracks start here."

[[en.pages]]
title   = "Your mission: find 10 tracks nobody plays"
content = """
Digging is simple: you hunt for tracks that nobody else in your scene has.

**Why does that matter?** Because if you play the same Beatport Top 100 (the store's best-seller chart) as every DJ at the party, nobody notices you. But when the room asks "what is THAT?" — that's your crate talking (your crate is your personal box of tracks, the ones you've picked to play).

Here's how it works in practice:

1. Open **discogs.com** (free account, 2 minutes to sign up).
2. Go to the Advanced Search.
3. Pick a genre you like — let's say **Electronic, Style: Deep House**.
4. Set Year range: **1995–2005**.
5. Filter Format: **12"** (the 12-inch vinyl record, the format made for DJs).
6. Hit search. You'll get hundreds of results.
7. Click a cover that looks interesting. Listen to the preview. If it makes you curious — **Wantlist it** (the Wantlist is Discogs' bookmark list for releases you want to own; when a copy is posted for sale on the Marketplace, the site's shop where members sell records, you get notified).

Do this for 20 minutes. You'll Wantlist 10 things. That's your first crate.
"""

[[en.pages]]
title   = "Exercise: your first Discogs search"
content = """
Let's make this concrete. Follow these exact steps **right now**:

**Step 1 — Create a free Discogs account** at discogs.com/register.

**Step 2 — Go to Advanced Search** (top bar → "Search" → "Advanced").

**Step 3 — Set these filters:**
- Genre: Electronic
- Style: (pick one: Deep House / Techno / Funk / Soul — your call)
- Year: 1993–2003
- Format: 12"
- Country: (try US or Germany for starters)

**Step 4 — Hit search. You should see 200–2000 results.** Scroll through covers for 10 minutes. Don't think too hard — if a sleeve catches your eye, click it.

**Step 5 — Listen to any preview clips available.** Look at the tracklist. If the release has a "Club Mix" or "Dub" version — that's a good sign for DJs.

**Step 6 — Add 5–10 items to your Wantlist.** This is your first crate.

Congratulations. You've just done what DJs spend hours doing.
"""

[[en.pages]]
title   = "What makes a track worth keeping?"
content = """
Not every track you find is worth keeping. Here's a quick filter:

**Keep it if:**
- The intro is 16+ beats of just drums/bass (easy to mix in)
- The outro is the same (easy to mix out)
- There's a clear "drop" or moment where the energy changes
- You'd stop whatever you're doing to listen to it

**Skip it if:**
- It starts with vocals immediately (hard to mix)
- It's under 5 minutes (not enough room to work with)
- You feel "meh" — your gut knows

**Practical tip:** When you find a track you love on Discogs, **click the label name**. Labels have aesthetics — if one track from a label is great, there are probably 10 more. Browse the full label catalog.

Try it: find one track you like, click its label, and browse 20 more releases from that same label.
"""

[[en.pages]]
title   = "BPM basics for digging"
content = """
When you're digging, you're building a collection for a specific kind of set. BPM matters — not to be exact, but to filter.

**Simple rule:** pick the BPM you play around (say 128) and dig within about **±6%** of it — here, **120 to 136 BPM**. That gives you room to pitch things together without sounding weird (we'll see why 6% in lesson 3).

Discogs doesn't always show BPM. Here's what to do:
- Check if the tracklist mentions BPM
- Look at the Style tag: Techno is usually 125–140, Deep House 120–128, Funk/Soul 90–115
- When in doubt, add it to your Wantlist and check the BPM in a DJ app later

**Your action:** on your Discogs Wantlist from the previous exercise, write down what genre each track is. This tells you roughly where it lives BPM-wise.
"""

[[en.quiz]]
question = "You find a track with an immediate vocal intro. What should you do?"
answers  = ["Keep it — vocals are always good", "Skip it — hard to mix in", "Buy it immediately"]
correct  = 1

[[en.quiz]]
question = "You love a track from label 'XYZ Records'. What's your next move?"
answers  = ["Search randomly for more music", "Browse the full XYZ Records catalog on Discogs", "Buy all tracks by that artist only"]
correct  = 1

[[en.quiz]]
question = "Your set is around 128 BPM. What's the safe range to dig in?"
answers  = ["Exactly 128 BPM only", "120–136 BPM", "Any BPM — pitch fixes everything"]
correct  = 1

[[en.quiz]]
question = "What does adding a release to your Discogs Wantlist do?"
answers  = ["Buys it automatically", "Notifies you when it's available in the Marketplace", "Sends it to your DJ software"]
correct  = 1

