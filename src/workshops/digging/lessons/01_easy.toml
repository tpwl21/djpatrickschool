[fr]
title      = "C'est quoi le digging ? — Pratique"
short_desc = "Ouvre Discogs maintenant. Tes 10 premières tracks commencent ici."

[[fr.pages]]
title   = "Ta mission : trouver 10 tracks que personne ne joue"
content = """
Le digging, c'est simple : tu chasses des tracks que personne d'autre dans ta scène ne possède.

**Pourquoi c'est important ?** Parce que si tu joues le même Top 100 Beatport (le classement des meilleures ventes du store) que tous les DJs de la soirée, personne ne te remarque. Mais quand la salle demande "c'est quoi ÇA ?" — c'est ton crate qui parle (ton crate, c'est ta caisse perso : les tracks que tu as choisies pour jouer).

Voilà comment ça marche en pratique :

1. Ouvre **discogs.com** (compte gratuit, 2 minutes pour s'inscrire).
2. Va dans la Recherche Avancée.
3. Choisis un genre que tu aimes — disons **Electronic, Style: Deep House**.
4. Plage d'années : **1995–2005**.
5. Format : **12"** (le disque vinyle 12 pouces, le format fait pour les DJs).
6. Lance la recherche. Tu vas avoir des centaines de résultats.
7. Clique sur une pochette qui t'attire. Écoute le preview. Si ça t'intrigue — **Wantlist** (la Wantlist, c'est la liste de favoris de Discogs pour les disques que tu veux posséder ; quand un exemplaire est mis en vente sur la Marketplace, la boutique où les membres vendent leurs disques, tu es prévenu).

Fais ça 20 minutes. Tu vas Wantlister 10 trucs. C'est ton premier crate.
"""

[[fr.pages]]
title   = "Exercice : ta première recherche Discogs"
content = """
Concrètement. Suis ces étapes exactes **maintenant** :

**Étape 1 — Crée un compte Discogs gratuit** sur discogs.com/register.

**Étape 2 — Va dans la Recherche Avancée** (barre du haut → "Search" → "Advanced").

**Étape 3 — Configure ces filtres :**
- Genre : Electronic
- Style : (choisis : Deep House / Techno / Funk / Soul — comme tu veux)
- Year : 1993–2003
- Format : 12"
- Country : (essaie US ou Germany pour commencer)

**Étape 4 — Lance la recherche. Tu devrais voir 200–2000 résultats.** Scrolle les pochettes pendant 10 minutes. Ne réfléchis pas trop — si une pochette t'accroche l'œil, clique dessus.

**Étape 5 — Écoute les previews disponibles.** Regarde la tracklist. Si la release a un "Club Mix" ou un "Dub" — c'est bon signe pour un DJ.

**Étape 6 — Ajoute 5–10 items à ta Wantlist.** C'est ton premier crate.

Félicitations. Tu viens de faire ce que les DJs passent des heures à faire.
"""

[[fr.pages]]
title   = "Ce qui mérite d'être gardé"
content = """
Toutes les tracks que tu trouves ne méritent pas de rester. Voici un filtre rapide :

**Garde si :**
- L'intro est 16+ beats de juste drums/basse (facile à mixer en entrée)
- L'outro pareil (facile à sortir)
- Il y a un "drop" clair ou un moment où l'énergie change
- Tu t'arrêterais de faire quoi que ce soit pour écouter

**Skip si :**
- Ça commence avec des vocaux immédiats (dur à mixer)
- Ça dure moins de 5 minutes (pas assez de place pour travailler)
- Tu ressens un "bof" — ton instinct sait

**Astuce pratique :** quand tu trouves une track que tu aimes sur Discogs, **clique le nom du label**. Les labels ont une esthétique — si une track d'un label est bien, il y en a probablement 10 de plus. Browse tout le catalogue du label.

Essaie : trouve une track que tu aimes, clique son label, et browse 20 autres releases du même label.
"""

[[fr.pages]]
title   = "BPM de base pour le digging"
content = """
Quand tu digges, tu construis une collection pour un certain type de set. Le BPM compte — pas pour être exact, mais pour filtrer.

**Règle simple :** choisis le BPM autour duquel tu joues (disons 128) et digge à environ **±6%** de lui — ici, de **120 à 136 BPM**. Ça te donne de la marge pour pitcher ensemble sans que ça sonne bizarre (on verra pourquoi 6% dans la leçon 3).

Discogs n'affiche pas toujours le BPM. Voilà quoi faire :
- Vérifie si la tracklist mentionne le BPM
- Regarde le tag Style : Techno c'est en général 125–140, Deep House 120–128, Funk/Soul 90–115
- Si tu as un doute, ajoute à ta Wantlist et vérifie le BPM dans une appli DJ plus tard

**Ton action :** sur ta Wantlist Discogs de l'exercice précédent, note le genre de chaque track. Ça te dit à peu près où elle se situe en BPM.
"""

[[fr.quiz]]
question = "Tu trouves une track avec des vocaux qui commencent immédiatement. Que fais-tu ?"
answers  = ["Tu la gardes — les vocaux c'est toujours bien", "Tu la skippes — dur à mixer en entrée", "Tu l'achètes immédiatement"]
correct  = 1

[[fr.quiz]]
question = "Tu adores une track du label 'XYZ Records'. C'est quoi ton prochain move ?"
answers  = ["Chercher aléatoirement d'autres musiques", "Parcourir tout le catalogue XYZ Records sur Discogs", "N'acheter que des tracks de cet artiste"]
correct  = 1

[[fr.quiz]]
question = "Ton set tourne autour de 128 BPM. Quel est le range safe pour digger ?"
answers  = ["Exactement 128 BPM seulement", "120–136 BPM", "N'importe quel BPM — le pitch arrange tout"]
correct  = 1

[[fr.quiz]]
question = "Qu'est-ce qu'ajouter une release à ta Wantlist Discogs fait ?"
answers  = ["L'achète automatiquement", "Te notifie quand elle est disponible sur la Marketplace", "L'envoie dans ton logiciel DJ"]
correct  = 1

