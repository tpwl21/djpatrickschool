[fr]
title      = "C'est quoi le digging ? — Théorie, éthique & archéologie culturelle"
short_desc = "Reissues japonaises, éthique Madlib, marchés spéculatifs, et le problème algorithmique."

[[fr.pages]]
title   = "L'archéologie culturelle du crate-digging"
content = """
Le crate-digging n'est pas neutre. C'est une forme d'archéologie culturelle — et comme toute archéologie, elle soulève des questions sur qui creuse, ce qu'on exhume, et qui en bénéficie.

**Trois lignées à comprendre :**

**La scène reissue japonaise** : Des labels comme Light In The Attic (série *Japan Archives*), Music From Memory, et Mule Musiq ont passé des décennies à exhumer le jazz-funk, la city-pop et l'ambient japonais des années 70–80 — musique largement inconnue en dehors du Japon. Leur travail a professionnalisé une forme de digging : identifier des catalogues perdus, licencier auprès des artistes ou des ayants-droit, remastériser, rééditer globalement. Le succès commercial de la "Japanese city-pop" sur le streaming (l'arc viral de "Plastic Love" de Mariya Takeuchi, 2018–2022) est en partie en aval de ce travail d'archivage. La tension : les labels de reissue profitent ; les artistes originaux reçoivent parfois de maigres royalties ; les plateformes de streaming profitent le plus.

**Awesome Tapes From Africa** (Brian Shimkovitz) : commencé comme blog en 2006, devenu un label qui sort de la musique sur cassette du Ghana, d'Éthiopie, du Sénégal. L'approche de Shimkovitz mêle ethnographie, journalisme et curation — chaque sortie est accompagnée d'une recherche de provenance. Les critiques interrogent : qui accorde le droit de rééditer ? Les réponses varient.

**L'éthique du sampling hip-hop** : La série *Beat Konducta* de Madlib et *Shades of Blue* traitent le sample comme un dialogue compositionnel. L'arrêt Bridgeport Music v. Dimension Films (US, 2005) a établi que tout sample reconnaissable d'un enregistrement sonore nécessite une clearance — même 3 secondes. Les producteurs de l'ère Madlib et J Dilla sortaient souvent des beat tapes sous alias précisément pour contourner les clearances sur des sorties non commerciales.
"""

[[fr.pages]]
title   = "Le problème algorithmique et pourquoi le digging y résiste"
content = """
Spotify, Apple Music, YouTube et Beatport font tous tourner des algorithmes de recommandation. Leur objectif : **la durée de session** — ils optimisent pour la track qui te fera rester, pas pour celle qui élargira ta palette.

**Le problème structurel** : les algorithmes de recommandation sont entraînés sur des données d'engagement. Ce qui génère le plus d'engagement, c'est ce qui est déjà populaire. Ça crée une boucle de rétroaction : populaire → recommandé → encore plus populaire. Les tracks obscures qui demandent plusieurs écoutes pour être comprises sont structurellement désavantagées. L'algo ne te servira presque jamais un disque de township jive sud-africain de 1977 à un DJ techno — pas parce que ce n'est pas pertinent, mais parce que son signal d'engagement est trop faible.

**Pourquoi le digging compte** : la curation humaine brise la boucle de rétroaction. Un DJ qui a entendu un disque de 1977 chez un disquaire spécialisé, ou lors d'un deep-dive label, ou par la recommandation d'un ami de confiance, a une track que l'algo ne servira jamais. C'est la raison structurelle pour laquelle les meilleurs sets sont inimitables par les algorithmes : le chemin du signal (digger → humain de confiance → digger) est hors-algo.

**Contre-mesure** : utilise les algos comme *lanceurs de découverte*, pas comme destinations. Shazame une track dans un set → trouve le label → deep-dive manuellement tout le catalogue. L'algo t'amène à la porte ; tu la franchis toi-même.
"""

[[fr.pages]]
title   = "Marchés spéculatifs et distorsion Discogs"
content = """
Le marché du vinyle post-2020 présente des caractéristiques classiques de bulle spéculative. Le comprendre te protège en tant qu'acheteur.

**La bulle vinyle 2020–2023** : documentée dans *Rolling Stone* (2021) et des enquêtes *Resident Advisor*. L'écoute à domicile en pandémie + les achats nostalgie ont propulsé les ventes de vinyles à leur niveau le plus haut depuis 35 ans. Les prix du marché secondaire (Discogs, eBay) ont gonflé de 200–400% dans certaines catégories. De nouvelles usines de pressage ont ouvert ; les usines établies avaient 6 à 12 mois de backlog.

**La distorsion spéculative sur Discogs Marketplace** :
- Des bots scrapent les releases taguées 'rare' ou 'forte demande' et les remettent en vente à prix gonflés dans les heures qui suivent
- Un seul DJ qui joue une track dans un Boiler Room peut faire flamber son prix Last Sold de 300% en 24 heures
- Les nouveaux pressages de disques autrefois rares (quand les labels licencient pour une réédition) font immédiatement s'effondrer le prix spéculatif du pressage original

**Comment se protéger** :
1. Cross-check *Popsike* pour l'historique des enchères sur 2 ans — les pics spéculatifs sont visibles comme des sauts verticaux soudains
2. Vérifie si une réédition existe ou est annoncée — ça effondre la valeur du pressage original
3. La **métrique de Popularité Discogs** (combien d'utilisateurs l'ont dans leur collection) est un meilleur signal de rareté que le prix
4. Achète direct sur Bandcamp quand c'est possible — tu paies l'artiste, pas un spéculateur
"""
youtube = "https://www.youtube.com/watch?v=G4E1ESfpFAc"
youtube_caption = "Madlib sur le sampling, le digging et la composition — l'approche Beat Konducta."

[[fr.pages]]
title   = "Le biais eurocentriste dans les bases de données musicales"
content = """
La couverture de Discogs suit sa base de contributeurs. Le biais de la communauté est occidental, masculin, et orienté vers la musique électronique, le rock et le hip-hop américain et européen. Cela crée des angles morts systématiques.

**Sous-représentés dans Discogs** :
- La musique populaire africaine pré-2000 (highlife, afrobeat, soukous, mbalax)
- La musique populaire sud-asiatique et moyen-orientale avant 1990
- Les sorties digitales auto-éditées Bandcamp-only post-2010
- Les sorties à distribution régionale uniquement (pas de code-barre international)

**Surreprésentés** :
- La musique électronique américaine et britannique (house, techno, drum & bass) de 1985–2005
- La techno allemande, la new beat belge, la house française — toutes bien documentées
- Le catalogue des majors dans tous les genres

**Ce que ça signifie pour les diggers** : si tu digges en dehors des compétences principales de Discogs, tu as besoin d'archives complémentaires. Awesome Tapes From Africa, Ostinato Records (Afrique de l'Est, Golfe), Analog Africa (Afrique de l'Ouest/Centrale), les reissues Syliphone (label d'État guinéen), Strut Records (africain, caribéen) couvrent chacun des territoires que Discogs gère mal. Ne confonds pas "absent de Discogs" avec "n'existe pas" — ça peut juste vouloir dire que les contributeurs ne sont pas encore là.
"""

