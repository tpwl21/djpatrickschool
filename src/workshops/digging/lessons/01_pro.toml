[en]
title      = "What Is Digging? — Theory, Ethics & Cultural Archaeology"
short_desc = "Japanese reissues, Madlib's ethics, speculative markets, and the algorithm problem."

[[en.pages]]
title   = "The cultural archaeology of crate-digging"
content = """
Crate-digging is not neutral. It is a form of cultural archaeology — and like all archaeology, it involves questions of who digs, what gets excavated, and who benefits.

**Three lineages to understand:**

**The Japanese reissue scene**: Labels like Light In The Attic (*Japan Archives* series), Music From Memory, and Mule Musiq spent decades excavating 1970s–80s Japanese jazz-funk, city-pop, and ambient — music largely unknown outside Japan. Their work professionalized a form of digging: identify lost catalogs, license from original artists or estates, remaster, reissue globally. The commercial success of "Japanese city-pop" on streaming (Mariya Takeuchi's "Plastic Love" viral arc, 2018–2022) is partly downstream of this archival labor. The tension: reissue labels profit; original artists may receive small royalties; streaming platforms profit most.

**Awesome Tapes From Africa** (Brian Shimkovitz): started as a blog in 2006, evolved into a label releasing cassette-tape music from Ghana, Ethiopia, Senegal. Shimkovitz's approach blurs ethnography, journalism, and curation — each release comes with provenance research. Critics ask: who grants the right to reissue? Answers vary by case.

**Hip-hop sampling ethics**: Madlib's *Beat Konducta* series and *Shades of Blue* treat the sample as compositional dialogue. The Bridgeport Music v. Dimension Films ruling (US, 2005) established that any recognizable sample of a sound recording requires clearance — even 3 seconds. Madlib and J Dilla-era producers often released beat tapes under aliases specifically to sidestep clearance requirements for non-commercial releases.
"""

[[en.pages]]
title   = "The algorithm problem and why digging resists it"
content = """
Spotify, Apple Music, YouTube, and Beatport all run recommendation algorithms. Their goal is **session duration** — they optimize for the track most likely to keep you listening, not the track that expands your palette.

**The structural problem**: recommendation algorithms are trained on engagement data. What gets engaged with most is what's already popular. This creates a feedback loop: popular → recommended → more popular. Obscure tracks that require multiple listens to understand are structurally disadvantaged. The algorithm will almost never surface a 1977 South African township jive record to a techno DJ — not because it wouldn't be relevant, but because its engagement signal is too weak.

**Why digging matters**: human curation breaks the feedback loop. A DJ who heard a 1977 record from a specialist shop employee, or from a label deep-dive, or from a trusted friend's recommendation has a track the algorithm will never serve. This is the structural reason the best sets are unfollowable by algorithms: the signal path (digger → trusted human → digger) is off-algorithm.

**Counter-move**: use algorithms as *discovery launchers*, not discovery destinations. Shazam a track in a set → find the label → deep-dive the label's full catalog manually. The algorithm gets you to the door; you walk through it yourself.
"""

[[en.pages]]
title   = "Speculative markets and Discogs distortion"
content = """
The vinyl record market post-2020 exhibits classic speculative bubble characteristics. Understanding this protects you as a buyer.

**The 2020–2023 vinyl bubble**: documented in *Rolling Stone* (2021) and *Resident Advisor* features. Pandemic-era homebound listening + nostalgia purchases drove vinyl sales to a 35-year high. Secondary market (Discogs, eBay) prices for 'collectible' records inflated 200–400% in some categories. New pressing plants were opened; established plants had 6–12 month backlogs.

**Speculative distortion on Discogs Marketplace**:
- Bots scrape releases flagged as 'rare' or 'in high demand' and relist at inflated prices within hours
- A single DJ playing a track in a Boiler Room set can spike its Discogs Last Sold price by 300% within 24 hours
- New pressings of previously rare records (when labels license for reissue) immediately crash the original pressing's speculative price

**How to protect yourself**:
1. Cross-check *Popsike* for the 2-year auction price history — speculative spikes are visible as sudden vertical jumps
2. Check if a reissue exists or is announced — it collapses original pressing value
3. The **Discogs Popularity metric** (how many users have it in their collection) is a better rarity signal than price
4. Buy direct from Bandcamp when possible — you pay the artist, not a speculator
"""
youtube = "https://www.youtube.com/watch?v=G4E1ESfpFAc"
youtube_caption = "Madlib on sampling, digging, and composition — the Beat Konducta approach."

[[en.pages]]
title   = "Eurocentric bias in music databases"
content = """
Discogs's coverage follows its contributor base. The community skew is Western, male, and oriented toward electronic, rock, and hip-hop from the US and Europe. This creates systematic blind spots:

**Underrepresented in Discogs**:
- Pre-2000 African popular music (highlife, afrobeat, soukous, mbalax)
- South Asian and Middle Eastern popular music pre-1990
- Self-released Bandcamp-only digital releases post-2010
- Regional distribution-only releases (no international barcode)

**Overrepresented**:
- US and UK electronic music (house, techno, drum & bass) from 1985–2005
- German techno, Belgian new beat, French house — all well-documented
- Major-label catalog across all genres

**What this means for diggers**: if you're digging outside Discogs's core competencies, you need complementary archives. Awesome Tapes From Africa, Ostinato Records (East African, Gulf), Analog Africa (West/Central African), Syliphone reissues (Guinean state label), Strut Records (African, Caribbean) each cover territory Discogs handles poorly. Don't mistake "absent from Discogs" for "doesn't exist" — it may just mean the contributors aren't there yet.
"""

