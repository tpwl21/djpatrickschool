[fr]
title      = "Tracks DJ-Friendly — Lire avant d'acheter"
short_desc = "3 signaux sur n'importe quelle fiche de release pour savoir si une track va mixer."

[[fr.pages]]
title   = "Trois signaux avant d'appuyer sur play"
content = """
Tu peux savoir si une track sera DJ-friendly **avant même d'écouter** — juste en lisant la fiche de release.

**Signal 1 — La durée**
- Moins de 4 minutes : souvent un Radio Edit (la version courte faite pour la radio) : voix dès les premières secondes, pas d'intro DJ. Vérifie le nom de la version avant de trancher — mais c'est un signal d'alerte.
- 5–8 minutes : Extended ou Club Mix. DJ-ready.
- 8–12 minutes : Extended Mix. Utilité DJ maximale.

**Signal 2 — Le nom de la version dans le titre**
- "Club Mix", "Extended Mix", "12\" Mix" = DJ-friendly
- "Radio Edit", "Single Version" = pas pour usage DJ
- "Dub", "Instrumental" = excellent pour le blend (pas de voix qui clash)
- "Acapella" = voix seule, pour le layering créatif

**Signal 3 — Le format**
- Vinyle 12" = conçu pour les DJs
- Vinyle 7" = généralement Radio Edit
- CD single = souvent Radio Edit aussi

**Exercice rapide** : ouvre Discogs, trouve une release que tu aimes, et lis la tracklist. Quelles versions y a-t-il ? Laquelle achèterais-tu pour un set DJ ?
"""

[[fr.pages]]
title   = "À quoi ressemble un bon intro"
content = """
Une track DJ-friendly a une **intro** qui te donne de la place pour mixer en entrée.

L'intro idéale :
- Commence avec **les drums seuls** — kick, hi-hat, peut-être une basse pulsée
- Pas de voix, pas de mélodie principale
- Dure **16 à 32+ beats** (environ 30–60 secondes à 128 BPM)

**Pourquoi ça compte ?** Quand tu mixtes deux tracks ensemble, les deux jouent en même temps. Tu as besoin que la track entrante commence doucement (drums seuls) pendant que la track sortante finit encore. Si la track entrante commence avec une voix complète ou un gros lead synth, le mix ressemble à deux tracks qui se battent.

**Comment vérifier** : avant d'acheter, trouve un clip preview. Est-ce que ça commence avec juste du rythme ? Bien. Est-ce que ça lance direct sur des voix ou une grosse mélodie ? Dur à mixer en entrée.

**Vérifie aussi l'outro** : est-ce que la track finit avec les drums qui s'effacent, ou est-ce qu'elle coupe net sur un gros accord ? Outro drums = facile à quitter.
"""

[[fr.pages]]
title   = "Lire une waveform dans Rekordbox"
content = """
Une fois que tu as une track dans Rekordbox (ou Serato, ou n'importe quel logiciel DJ), la waveform te dit tout d'un coup d'œil.

**Ce qu'il faut chercher :**

- **Waveform basse au début** = intro drums seuls silencieuse. Bien.
- **Waveform pleine immédiatement** = la track commence à pleine énergie. Dur à mixer en entrée.
- **Un trou (silence) au milieu** = un "break". C'est un moment où tout s'efface — peut être dramatique ou un piège si tu ne t'y attendais pas.
- **Waveform basse à la fin** = outro drums seuls. Bien.

**Ton exercice :**
1. Charge 5 tracks que tu as déjà dans Rekordbox (la version gratuite marche). Pas de tracks ou pas de logiciel ? Ouvre l'extrait de 5 sorties sur Beatport ou Bandcamp et écoute juste les 30 premières secondes : ça démarre avec des drums seuls, ou direct avec la voix ?
2. Regarde chaque waveform. Lesquelles ont des intros et outros silencieux ?
3. Marque celles-là comme tes premières tracks "mixables".
4. Compare avec un Radio Edit de la même chanson — tu vois la différence ?
"""

[[fr.pages]]
title   = "Le piège du break surprise"
content = """
Un **break** est un moment au milieu d'une track où la plupart des éléments disparaissent soudainement — souvent juste un clap ou une mélodie seule pendant 8–16 beats, puis tout revient en force.

Les breaks sont **géniaux pour les DJs qui le savent** — tu peux planifier une transition pendant un break parce que c'est un moment de reset.

Les breaks sont un **piège** si tu ne les connais pas — tu es au milieu d'un mix et soudain la track tombe à presque rien. Le public se regarde. Tu paniquest.

**Comment éviter le piège :**
- Dans Rekordbox, scrub la waveform avant de jouer en live (scrubber = déplacer la tête de lecture à la main, en avant et en arrière, comme on frotte un disque). Cherche des trous.
- Place un **Cue Point** juste avant un break (un cue point, c'est un repère posé sur la track où tu peux revenir d'un seul bouton, pour pouvoir anticiper le break)
- Écris une note dans le champ Comments : "break à 3:20"

**Règle de base** : toute track dont tu n'as pas scrubé la waveform complète est une track qui peut te surprendre. Ne joue jamais en live une track que tu n'as pas prévisualisée entièrement au moins une fois.
"""

