[en]
title      = "DJ-Friendly Tracks — Read Before You Buy"
short_desc = "3 signals on any release page that tell you if a track will mix."

[[en.pages]]
title   = "Three signals before you hit play"
content = """
You can tell if a track will be DJ-friendly **before even listening** — just by reading the release page.

**Signal 1 — Length**
- Under 4 minutes: often a Radio Edit (the short version made for radio): vocals from the first seconds, no DJ intro. Check the version name before deciding — but it's a red flag.
- 5–8 minutes: Extended or Club Mix. DJ-ready.
- 8–12 minutes: Extended Mix. Maximum DJ utility.

**Signal 2 — Version name in the title**
- "Club Mix", "Extended Mix", "12\" Mix" = DJ-friendly
- "Radio Edit", "Single Version" = not for DJ use
- "Dub", "Instrumental" = great for blending (no vocals to clash)
- "Acapella" = vocals only, for creative layering

**Signal 3 — Format**
- 12" vinyl = designed for DJs
- 7" vinyl = usually Radio Edit
- CD single = often Radio Edit too

**Quick exercise**: open Discogs, find any release you like, and read the tracklist. Which versions are there? Which would you buy for a DJ set?
"""

[[en.pages]]
title   = "What a good intro looks like"
content = """
A DJ-friendly track has an **intro** that gives you room to mix in.

The ideal intro:
- Starts with **drums only** — kick, hi-hat, maybe a bass pulse
- No vocals, no main melody
- Lasts **16 to 32+ beats** (roughly 30–60 seconds at 128 BPM)

**Why does this matter?** When you mix two tracks together, both are playing at the same time. You need the incoming track to start quietly (drums only) while the outgoing track is still finishing. If the incoming track starts with a full vocal or a big synth lead, the mix sounds like two tracks fighting.

**How to check**: before buying, find a preview clip. Does it start with just rhythm? Good. Does it launch straight into vocals or a big melody? Hard to mix in.

**Also check the outro**: does the track end with drums peeling away, or does it cut out cold on a big chord? Drums-out outro = easy to mix away from.
"""

[[en.pages]]
title   = "Reading a waveform in Rekordbox"
content = """
Once you have a track in Rekordbox (or Serato, or any DJ software), the waveform tells you everything at a glance.

**What to look for:**

- **Low waveform at the start** = quiet drums-only intro. Good.
- **Full waveform immediately** = track starts at full energy. Hard to mix in.
- **A gap (silence) in the middle** = a "break". This is a moment where everything drops out — can be dramatic or a trap if you didn't plan for it.
- **Low waveform at the end** = drums-only outro. Good.

**Your exercise:**
1. Load 5 tracks you already have into Rekordbox (free version works). No tracks or no software yet? Open the preview of 5 releases on Beatport or Bandcamp and just listen to the first 30 seconds: does the track start with drums only, or with vocals right away?
2. Look at each waveform. Which ones have quiet intros and outros?
3. Mark those as your first "mixable" tracks.
4. Compare to a Radio Edit of the same song — notice the difference?
"""

[[en.pages]]
title   = "The surprise break trap"
content = """
A **break** is a moment in the middle of a track where most of the elements suddenly drop out — often just a clap or a single melody line for 8–16 beats, then everything crashes back in.

Breaks are **great for DJs who know about them** — you can plan a transition during a break because it's a reset moment.

Breaks are a **trap** if you don't know about them — you're in the middle of a mix and suddenly the track drops to almost nothing. The crowd looks confused. You scramble.

**How to avoid the trap:**
- In Rekordbox, scrub through the waveform before playing live (scrub = move the playhead by hand, back and forth, like rubbing a record). Look for any gaps.
- Place a **Cue Point** right before a break (a cue point is a bookmark on the track that you can jump back to with one button, so you can anticipate the break)
- Write a note in the Comments field: "break at 3:20"

**Rule of thumb**: any track where you haven't scrubbed the full waveform is a track that can surprise you. Never play a track live that you haven't previewed fully at least once.
"""

