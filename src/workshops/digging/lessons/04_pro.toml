[fr]
title      = "Architecture Énergétique — Psychoacoustique, Théorie de l'Affect & Design de Set"
short_desc = "Le circumplex de Russell, mapping valence-arousal, design multi-arc et le paradoxe Villalobos."

[[fr.pages]]
title   = "Le circumplex de Russell : le modèle psychoacoustique de l'énergie"
content = """
L'énergie d'un dancefloor se mappe sur le **modèle circumplex de l'affect de Russell** (1980) — un modèle d'état émotionnel à deux axes :

- **Axe arousal (vertical) :** faible (détendu, passif) ↔ élevé (activé, énergisé). Correspond en gros au BPM, à la densité et à l'intensité des transitoires.
- **Axe valence (horizontal) :** négatif (tendu, sombre, dissonant) ↔ positif (euphorique, chaud, consonant).

La plupart de la musique club occupe le quadrant haut-arousal, mais la valence varie énormément :
- Haut-arousal / haute-valence : techno euphorique peak-time, trance upliftante, house peak
- Haut-arousal / basse-valence : industrielle, dark ambient, techno Berlin fin de nuit
- Bas-arousal / haute-valence : deep house chaude, house avec inflexion jazz-soul, afterhours
- Bas-arousal / basse-valence : minimal, ambient expérimental, "funeral techno" (3h du mat Berghain)

**L'insight clé pour les DJs :** le match BPM et clé évite le *clash*. Le match de valence évite la *mort du dancefloor*. Tu peux avoir deux tracks techniquement compatibles (même BPM, clés Camelot adjacentes) qui échouent catastrophiquement parce que l'une est haute-valence (euphorique) et la suivante basse-valence (industrielle sombre). Le public enregistre le basculement de valence en 4–8 beats — plus vite qu'il n'enregistre le match BPM.

**C'est pourquoi l'analyse technique seule est insuffisante.** Chaque track dans ta librairie a besoin d'un tag de valence en plus d'un tag de niveau d'énergie.
"""

[[fr.pages]]
title   = "Transitions vibe vs BPM — les axes indépendants"
content = """
Un DJ sophistiqué opère deux axes de transition indépendants simultanément :

**Axe 1 — Transition BPM :** le tempo change. L'arithmétique du pitch-shift s'applique. Peut être progressive (±0.5 BPM par phrase) ou soudaine (cut net sur un nouveau tempo à une frontière de phrase).

**Axe 2 — Transition de vibe :** la texture émotionnelle / valence change. C'est indépendant du tempo. Une transition de vibe peut se produire pendant que le BPM reste verrouillé.

**La matrice des possibilités :**

| BPM | Vibe | Effet |
|---|---|---|
| Pareil | Pareil | Sustain pur — tient le moment |
| Change | Pareil | Shift de tempo avec continuité émotionnelle |
| Pareil | Change | Flip de texture — re-contextualisation soudaine |
| Les deux changent | — | Reset complet — risque max, récompense max |

**Où les débutants confondent les deux axes :** ils assimilent changement de BPM à changement d'énergie. Ils ralentissent pour réduire l'énergie. En fait, tu peux réduire l'énergie (passer de dense → épuré) au même BPM en swappant simplement la texture. Et tu peux monter le BPM sans monter l'énergie si la track entrante est moins dense (tempo up, densité down = énergie nette neutre).

**Technique avancée — inversion de tempo :** jouer une track plus dense et plus énergétique à un BPM légèrement plus bas pour créer délibérément une dissonance cognitive. Le public s'attend à BPM up = énergie up. Quand ça n'arrive pas, l'effet est une sorte de moment figé — une technique utilisée dans l'école minimale de Cologne (esthétique Kompakt Records, ~2000–2008).
"""

[[fr.pages]]
title   = "Design de set multi-arc"
content = """
La théorie narrative appliquée aux sets DJ. La pyramide de Freytag classique (action montante → climax → action descendante) se mappe sur : warmup → peak → closing. Mais les sets club modernes de 2–4 heures sont rarement mono-arc.

**Le modèle multi-arc :**

```
Énergie
  5 |         ___          ___
  4 |       _/   \\_      _/   \\_
  3 |     _/       \\____/       \\___
  2 |   _/
  1 |__/
     0    30   60   90   120  150  180 min
```

Chaque vallée (afterpeak) n'est pas un échec — c'est une **release délibérée** qui fait tomber le peak suivant plus fort. Le mécanisme physiologique : le cerveau s'habitue aux états d'arousal élevé soutenu en environ 12–15 minutes (adaptation neurologique). Après adaptation, tu dois soit escalader (rendements décroissants, coûteux physiologiquement) soit relâcher et reconstruire (durable, reproductible).

**Critères de design des vallées :**
- Chute d'énergie : 1.5–2 niveaux sur l'échelle 1–5
- Durée : minimum 10–12 minutes (moins = le public ne se re-sensibilise pas)
- Valence : peut rester positive (chaude, groovy) ou passer négative (sombre, tendue) — chaque option amorce un type de peak différent
- BPM : baisse typiquement de 4–6 BPM pendant la vallée, pas seulement le niveau d'énergie

**Le set étendu Berghain :** les sets de 6–8h (Jeff Mills, Surgeon, Villalobos) contiennent 4–6 peaks, chacun séparé par des vallées de 30–60 minutes. Ces vallées ne sont pas des accidents — elles sont le génie d'ingénierie qui se trouve sous les peaks.
"""

[[fr.pages]]
title   = "La tension productive et le paradoxe Villalobos"
content = """
Les règles de compatibilité technique (BPM, clé, match d'énergie) marchent 90% du temps. Les 10% restants, c'est là que l'identité artistique vit.

**Le paradoxe Villalobos :** Ricardo Villalobos jouant au Berghain à 8h du matin après un set de 6h balance parfois une track qui casse délibérément l'arc énergétique — une déflation soudaine, un pas en arrière de genre, un ralentissement BPM qui ne devrait pas marcher. Ça marche, à cause de la façon dont c'est assumé.

**Pourquoi ça marche :**
Selon les études de réponse dancefloor (Garcia & Solberg, 2019), le public *récompense* la micro-dissonance quand elle est **pattern-cohérente** : une tension tenue 32 beats puis relâchée se lit comme intentionnelle. Une tension patchée en 4 beats se lit comme une erreur. L'artisanat du DJ, c'est rendre l'engagement visible — tenir la "mauvaise" décision assez longtemps (16+ beats) pour que l'abandonner casserait le cadre plus que la décision originale.

**L'échelle du mismatch partiel** (entrée safe dans la tension productive) :

| Niveau | Ce qu'on casse | Ce qu'on garde |
|---|---|---|
| 1 (débutant) | La texture (sec → reverb) | BPM, clé, énergie |
| 2 | La valence (sombre → chaud) | BPM, clé, énergie-tempo |
| 3 | Le BPM (saut de ±6 BPM) | Clé, niveau d'énergie |
| 4 | La clé (voisin → clash) | BPM, énergie |
| 5 (vétéran) | Plusieurs axes | Engagement et timing |

**Le lien avec le closing (LESSON_RTC_5) :** la surprise ne tombe que si elle est assumée. Le DJ qui installe une tension productive 20 minutes avant la track de closing crée un arc de résolution. Celui qui introduit la tension 2 minutes avant le closing crée de la panique.
"""

