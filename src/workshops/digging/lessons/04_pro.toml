[en]
title      = "Energy Architecture — Psychoacoustics, Affect Theory & Set Design"
short_desc = "Russell's circumplex, valence-arousal mapping, multi-arc set design, and productive tension."

[[en.pages]]
title   = "Russell's circumplex: the psychoacoustic model of energy"
content = """
The energy of a dancefloor maps onto **Russell's circumplex model of affect** (1980) — a two-axis model of emotional state:

- **Arousal axis (vertical):** low (relaxed, passive) ↔ high (activated, energized). Roughly corresponds to BPM, density, and transient intensity.
- **Valence axis (horizontal):** negative (tense, dark, dissonant) ↔ positive (euphoric, warm, consonant).

Most club music occupies the high-arousal quadrant, but valence varies dramatically:
- High-arousal / high-valence: peak-time euphoric techno, uplifting trance, peak house
- High-arousal / low-valence: industrial, dark ambient, Berlin-style late-night techno
- Low-arousal / high-valence: warm deep house, soulful jazz-inflected house, afterhours
- Low-arousal / low-valence: minimal, experimental ambient, funeral techno (3am Berghain floor)

**The critical insight for DJs:** BPM and key matching prevent *clash*. Valence matching prevents *dancefloor death*. You can have two technically compatible tracks (same BPM, adjacent Camelot keys) that fail catastrophically because one is high-valence (euphoric) and the next is low-valence (dark industrial). The crowd registers the valence flip within 4–8 beats — faster than they register the BPM match.

**This is why technical analysis alone is insufficient.** Every track in your library needs a valence tag as well as an energy-level tag.
"""

[[en.pages]]
title   = "Vibe vs BPM transitions — the independent axes"
content = """
A sophisticated DJ operates two independent transition axes simultaneously:

**Axis 1 — BPM transition:** the tempo changes. The arithmetic of pitch-shift applies. Can be gradual (±0.5 BPM per phrase) or sudden (hard cut into new tempo at a phrase boundary).

**Axis 2 — Vibe transition:** the emotional texture/valence changes. This is independent of tempo. A vibe transition can happen while the BPM stays locked.

**The matrix of possibilities:**

| BPM | Vibe | Effect |
|---|---|---|
| Same | Same | Pure sustain — holds the moment |
| Change | Same | Tempo shift with emotional continuity |
| Same | Change | Texture flip — sudden recontextualization |
| Both change | — | Full reset — highest risk, highest reward |

**Where beginners collapse the two axes:** they equate BPM change with energy change. They slow down to reduce energy. In fact, you can reduce energy (go from dense → sparse) at the same BPM by simply swapping texture. And you can increase BPM without increasing energy if the incoming track is less dense (tempo up, density down = net energy neutral).

**Advanced technique — tempo inversion:** play a denser, higher-energy track at a slightly lower BPM to deliberately create cognitive dissonance. The crowd expects BPM up = energy up. When it doesn't happen, the effect is a kind of frozen moment — a technique used in the Cologne minimal school (Kompakt Records aesthetic, ~2000–2008).
"""

[[en.pages]]
title   = "Multi-arc set design"
content = """
Narrative theory applied to DJ sets. The classic Freytag pyramid (rising action → climax → falling action) maps onto: warmup → peak → closing. But modern club sets that last 2–4 hours are rarely single-arc.

**The multi-arc model:**

```
Energy
  5 |         ___          ___
  4 |       _/   \\_      _/   \\_
  3 |     _/       \\____/       \\___
  2 |   _/
  1 |__/
     0    30   60   90   120  150  180 min
```

Each valley (afterpeak) is not a failure — it's a **deliberate release** that makes the next peak land harder. The working idea: a crowd habituates to sustained high intensity — the same stimulus keeps producing less response. How fast depends on the room, the hour and the people, so watch the floor rather than counting minutes. Once it happens, you either escalate (diminishing returns, physically costly) or release and rebuild (sustainable, repeatable).

**Valley design criteria:**
- Energy drop: 1.5–2 levels on the 1–5 scale
- Duration: long enough for the floor to settle — several tracks, not just one (shorter = the crowd doesn't re-sensitize)
- Valence: can stay positive (warm, groovy) or go negative (dark, tense) — each primes a different type of peak
- BPM: typically drops 4–6 BPM during the valley, not just energy level

**Extended sets:** in very long sets (6 hours and more), the arc repeats — several peaks, each separated by a valley. The valleys are not accidents — they're the engineering underneath the peaks.
"""

[[en.pages]]
title   = "Productive tension: committing to the 'wrong' choice"
content = """
The rules of technical compatibility (BPM, key, energy matching) cover most of your choices. The exceptions are where artistic identity lives.

**The paradox:** a DJ deep into a long set sometimes drops a track that deliberately breaks the energy arc — a sudden deflation, a genre step backwards, a BPM slowdown that shouldn't work. It can work, because of how it's committed to.

**Why it works:**
As a rule of thumb, crowds tend to accept micro-dissonance when it's **pattern-coherent**: a tension held for a full phrase (32 beats) and then released reads as intentional. A tension patched over after a few beats reads as a mistake. The DJ's craft is making the commitment visible — holding the "wrong" decision long enough (16+ beats) that abandoning it would *break the frame* more than the original decision.

**The partial mismatch ladder** (safe entry into productive tension):

| Level | What you break | Keep intact |
|---|---|---|
| 1 (beginner) | Texture (dry → wet) | BPM, key, energy |
| 2 | Valence (dark → warm) | BPM, key, tempo-energy |
| 3 | BPM (±6 BPM jump) | Key, energy level |
| 4 | Key (adjacent → clash) | BPM, energy |
| 5 (veteran) | Multiple axes | Commitment and timing |

**The connection to closing (LESSON_RTC_5):** surprise only lands when it's committed to. The DJ who sets up productive tension 20 minutes before the closing track creates a resolution arc. The DJ who introduces tension 2 minutes before closing creates panic.
"""

