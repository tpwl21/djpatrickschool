[fr]
title      = "Discogs & Filtres Avancés — La Boîte à Outils de Recherche"
short_desc = "Combinaisons de filtres avancées, le flow de rétro-ingénierie, et les plateformes complémentaires."

[[fr.pages]]
title   = "Discogs est un outil, pas une étape — utilise-le tout au long du cours"
content = """
Une note sur où cette leçon se place dans le cours : **Discogs est l'outil concret que tu saisit dès qu'une leçon précédente te laisse avec la question 'comment je TROUVE une track comme ça ?'**

Bloqué à choisir quel label techno allemand de 1998 viser (LESSON_DIGGING_3) ? Filtre Discogs. Tu veux vérifier qu'une track est un 'Club Mix' et pas un 'Radio Edit' (LESSON_DIGGING_2) ? Tracklist Discogs. Tu chasses un banger de sauvetage pour ton dossier oh-shit (LESSON_DIGGING_5) ? Pages label Discogs.

**N'attends pas la leçon 6 pour y toucher.** Dès qu'une autre leçon devient abstraite, reviens ici et mets l'outil au travail.

**Principe général :** les leçons 'outil' (Discogs, Rekordbox, Bandcamp) sont des *compétences* réutilisables. Les leçons 'théorie' (structure du rythme, énergie, Camelot) sont des *concepts* à appliquer. Ne les sépare pas dans ta tête — chaque théorie doit être testée contre un outil, chaque outil guidé par une théorie.
"""

[[fr.pages]]
title   = "Ce qu'est vraiment Discogs — et ce qu'il n'est pas"
content = """
Discogs est une base crowd-sourcée : plus de **16 millions de releases**, cataloguées par des collectionneurs depuis 2000. Chaque entrée a l'artiste, le label, l'année, le pays, le format (vinyle/CD/numérique), le genre, le style, le numéro de catalogue, et la tracklist. Les utilisateurs uploadent les scans de pochettes, vérifient les détails de pressage, signalent les erreurs.

**Pour un DJ, c'est LA référence pour identifier un disque à partir d'indices partiels** — 'cette track avec une pochette bleue sur Warp, 1997' peut devenir une vraie release en 30 secondes si tu connais les filtres.

**Cross-référence Discogs avec :**
- **Boomkat** — retail électronique expert, excellente curation éditoriale, bien pour trouver ce qui est pertinent maintenant
- **Bleep** — Warp-adjacent, sorties électroniques curatées
- **Bandcamp** — direct-depuis-l'artiste, pages label avec discographie complète, achète sans markup de revente
- **Juno** — focus dance, fort pour les sorties actuelles, bon filtrage BPM

Discogs c'est l'archive ; ces autres sont les storefronts actifs.

**Utilise la Wantlist comme système de notification :** quand un item Wantlisté arrive sur la Marketplace, tu reçois un mail. Construis ta Wantlist comme une file de dig long terme — pas juste pour tracker ce que tu veux acheter. Utilise-la pour tracker ce que tu recherches.
"""

[[fr.pages]]
title   = "La surface des filtres avancés"
content = """
Depuis la recherche principale, clique 'Advanced'. Tu as :

| Filtre | Options | Usage DJ |
|---|---|---|
| Format | 12\", LP, CD, FLAC, WAV | Toujours : 12\" pour le vinyle DJ |
| Country | Chaque code pays | Allemagne (DE), US, UK, France (FR) |
| Year | Année unique ou range | Dig par époque |
| Genre | Electronic, Hip Hop, Rock... | Encadrement niveau haut |
| Style | Deep House, Minimal Techno... | Vrai filtre de genre |
| Label | Recherche texte | Deep-dives label |
| Catalog Number | ex. PHK001 | Trouver des releases adjacentes |
| Release Type | Album, Single, EP, Compilation | EP et 12\" pour usage DJ |

**Deux filtres sous-utilisés :**

**Pages Label :** clique un nom de label, browse toute sa discographie. L'esthétique de la maison devient visible — si une track d'un label marche pour ton set, 10 autres probablement aussi. C'est le move de digging le plus efficace sur Discogs.

**Wantlists collaboratives :** partage une Wantlist avec un DJ ami de confiance. Vous êtes tous les deux notifiés quand des items sont disponibles, et tu vois ce qu'il chasse — crowdsorc ton propre research.

**Combine 3–4 filtres :** Genre + Style + Year range + Country. Une recherche qui renvoyait 2 000 résultats s'effondre à 12 vraiment pertinents.
"""

[[fr.pages]]
title   = "Le flow de rétro-ingénierie — de la mémoire sonore à la release"
content = """
Tu as entendu une track dans un mix. Tu sais : ça sonne minimal techno, probablement 1998–2002, le DJ jouait beaucoup de labels allemands.

**Filtres :** Genre=Electronic, Style=Minimal Techno, Year=1998–2002, Country=Germany.

Tu passes à 800 releases au lieu de 16 millions. Ajoute : Format=12" → 400. Tu scrolles les pochettes jusqu'à ce qu'une te parle. Wantlist. Continue.

**Quand Shazam échoue — Discogs gagne :**
Shazam n'identifie pas une track (white-label, bootleg, pré-numérique, trop obscure) ? Essaie :
1. **SoundHound** — fredonne ou chante pour une estimation grossière de clé/rythme
2. **WhoSampled** — si tu reconnais un sample dans la track, trace le sample pour trouver la track
3. Alimente les indices dans le filtre Discogs (Style + Year approx + Label suspecté)

Cette combinaison craque la plupart des tracks 'inidentifiables' d'un set DJ en 10 minutes.

**Bookmarker ta recherche la plus utilisée :** construis une URL de Recherche Avancée Discogs avec tes filtres habituels pré-réglés (ex. Electronic + Deep House + 1990–2000 + 12" + DE). Mets-la en favori. Plonge direct dans la recherche depuis ton téléphone en plein set si l'inspiration arrive — copie le titre dans tes notes et fais la recherche plus tard.

**Recherche adjacente par label :** tu as trouvé une release que tu adores ? Note son numéro de catalogue. Browse les 5 releases avant et après (même label, numéros adjacents = même époque, même son). C'est comme ça qu'on épuise l'âge d'or d'un label en 30 minutes.
"""

