[en]
title      = "Discogs & Advanced Filters — The Research Toolkit"
short_desc = "Advanced filter combinations, the reverse-engineering flow, and complementary platforms."

[[en.pages]]
title   = "Discogs is a tool, not a step — use it throughout the course"
content = """
A note on how this lesson sits in the course: **Discogs is the concrete tool you reach for whenever a previous lesson leaves you asking 'how do I FIND one of those?'**

Stuck deciding which techno label from Germany in 1998 to chase (LESSON_DIGGING_3)? Discogs filter. Want to verify a track is a 'Club Mix' and not a 'Radio Edit' (LESSON_DIGGING_2)? Discogs tracklist. Hunting a rescue banger for your oh-shit folder (LESSON_DIGGING_5)? Discogs label pages.

**Don't wait until lesson 6 to touch it.** The moment any other lesson feels abstract, come back here and put the tool to work.

**General principle:** toolchain lessons (Discogs, Rekordbox, Bandcamp) are *skills* you reuse. Theory lessons (beat structure, energy, Camelot) are *concepts* you apply. Don't separate them — every theory gets tested against a tool, and every tool gets guided by a theory.
"""

[[en.pages]]
title   = "What Discogs actually is — and what it isn't"
content = """
Discogs is a crowd-sourced database: over **16 million releases**, catalogued by collectors since 2000. Every entry has artist, label, year, country, format (vinyl/CD/digital), genre, style, catalog number, and tracklist. Users upload sleeve scans, verify pressing details, report discrepancies.

**For DJs, it's THE reference to identify a record from partial clues** — 'that track with a blue sleeve on Warp from 1997' can become a real release in 30 seconds if you know the filters.

**Cross-reference Discogs with:**
- **Boomkat** — expert electronic retail, excellent editorial curation, good for finding what's relevant now
- **Bleep** — Warp-adjacent, curated electronic releases
- **Bandcamp** — direct-from-artist, label pages with full discography, buy without re-sale markup
- **Juno** — dance-focused, strong for current releases, good BPM filtering

Discogs is the archive; these are the active storefronts.

**Use the Wantlist as a notification system:** when a Wantlisted item comes into the Marketplace, you get an email. Build your Wantlist as a long-term dig queue — don't just use it to track what you want to buy. Use it to track what you're researching.
"""

[[en.pages]]
title   = "The advanced filter surface"
content = """
From the main search, click 'Advanced'. You get:

| Filter | Options | DJ use |
|---|---|---|
| Format | 12\", LP, CD, FLAC, WAV | Always: 12\" for DJ vinyl |
| Country | Every country code | Germany (DE), US, UK, France (FR) |
| Year | Single or range | Era-specific digging |
| Genre | Electronic, Hip Hop, Rock... | Top-level bracket |
| Style | Deep House, Minimal Techno... | Actual genre filter |
| Label | Text search | Label deep-dives |
| Catalog Number | e.g. PHK001 | Finding adjacent releases |
| Release Type | Album, Single, EP, Compilation | EP and 12\" for DJ use |

**Two under-used filters:**

**Label pages:** click a label name, browse their entire discography. The aesthetic of the house becomes visible — if one track from a label works for your set, 10 more probably do too. This is the single most efficient digging move on Discogs.

**Wantlists collaboratively:** share a Wantlist with a trusted DJ friend. You both get notified when items come available, and you can see what they're hunting — crowd-sourcing your own research.

**Combine 3–4 filters:** Genre + Style + Year range + Country. A search that returns 2,000 results on the surface collapses to 12 genuinely relevant ones.
"""

[[en.pages]]
title   = "The reverse-engineering flow — from sonic memory to release"
content = """
You heard a track in a mix. You know: it sounds like minimal techno, probably 1998–2002, the DJ was playing lots of German labels.

**Filters:** Genre=Electronic, Style=Minimal Techno, Year=1998–2002, Country=Germany.

Now 800 releases instead of 16 million. Add: Format=12" → 400. Scroll covers until something rings a bell. Wantlist it. Keep going.

**When Shazam fails — Discogs wins:**
Shazam can't ID a track (white-label, bootleg, pre-digital, too obscure)? Try:
1. **SoundHound** — hum or sing to get a rough key/rhythm estimate
2. **WhoSampled** — if you recognise a sample in the track, trace the sample to find the track
3. Feed clues into Discogs filter (Style + approx Year + suspected Label)

This combination cracks most 'unidentifiable' DJ-set tracks within 10 minutes.

**Bookmarking your most-used search:** build a Discogs Advanced Search URL with your regular filters pre-set (e.g. Electronic + Deep House + 1990–2000 + 12" + DE). Bookmark it. Jump directly into the search from your phone mid-set if inspiration strikes — copy the title into notes and research later.

**Label adjacent search:** found a release you love? Note its catalog number. Browse 5 releases before and after it (same label, adjacent numbers = same era, same sound). This is how you exhaust a label's golden era in 30 minutes.
"""

