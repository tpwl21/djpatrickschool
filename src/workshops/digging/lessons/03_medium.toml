[fr]
title      = "Lire un BPM Range — Filtrage, Key Lock & Stratégie de Tempo"
short_desc = "La règle des ±6% en profondeur, les compromis du key lock, et comment structurer des quartiers de tempo pour un set."

[[fr.pages]]
title   = "Pourquoi ±6% est le chiffre magique"
content = """
La plupart des logiciels DJ pitchent les tracks via un **changement du taux de lecture** — accélère le buffer de 6% et le BPM monte de 6%, mais la hauteur (la clé musicale) monte aussi d'environ 1 demi-ton.

Vers ±6–7% l'oreille commence à l'entendre :
- Les kicks sonnent maigres ou brouillons
- Les voix deviennent hélium ou pâteuses

Une track seule, surtout rythmique, gêne rarement sous ±3 %. Entre 3 % et 6 %, ça commence à s'entendre, surtout sur du mélodique. Superposer change la donne : deux basses ou mélodies empilées frottent dès 10–15 cents d'écart, soit environ **1 %** de différence de pitch.

**Exemples concrets :**

| Track A | Track B | Différence | Verdict |
|---|---|---|---|
| 127 BPM | 130 BPM | 2.4% | Ok pour une track seule ; en blend long avec deux basses, ça frotte (plus de 1 %) |
| 124 BPM | 130 BPM | 4.8% | Audible sur matériel mélodique, ok sur drums |
| 125 BPM | 135 BPM | 8.0% | Au-delà du bord de ±6% — utilise le key lock ou évite |
| 120 BPM | 130 BPM | 8.3% | Trop loin sans key lock |

Le détail mathématique exact — pourquoi ±6% ≈ un demi-ton, et la relation log₂ entre rate et hauteur perçue — vit dans **LESSON_HARMONIES_2 (Pitch, Tonalité & Master Tempo)**. Pour cette leçon : ±3 % discret sur une track rythmique seule, ±6 % bord audible, ±10 % chirurgie.
"""

[[fr.pages]]
title   = "Le key lock et ses compromis"
content = """
Le **key lock** (aussi 'master tempo') est une fonction DSP qui découple la hauteur du taux de lecture — tu accélères sans changer la clé. Ça a l'air génial. Mais :

- Ça introduit des artefacts au-delà de quelques pourcents : 'phasing' métallique sur les notes tenues, smear sur les transitoires
- Pour la musique électronique jusqu'à ±3%, le key lock est transparent
- Au-delà, beaucoup de DJs le coupent et acceptent le shift de pitch — un son propre compte plus qu'un demi-ton de dérive

**Règle de base :**
- ±2% ou moins : key lock = victoire gratuite
- ±3–6% : écoute — peut rester propre sur des tracks percussives
- Au-delà de ±6% : key lock obligatoire si tu continues, mais attends-toi à des artefacts

**Double-time / half-time** est la parade pour les écarts de tempo que le key lock ne peut pas absorber.

Une track à 140 BPM et une track à 70 BPM partagent la même pulsation : chaque temps du 70 tombe pile sur un temps sur deux du 140. Mixé avec EQ et crossfader, tu traverses le gap. Ponts classiques :
- 140 dubstep / grime ↔ 70 half-time (le même dubstep ressenti à demi-vitesse, ou un hip-hop lent)
- 130 techno ↔ 65 dub
- 174 drum & bass ↔ 87 half-time (hip-hop lent, downtempo) : chaque temps du 87 tombe sur un temps sur deux de la DnB

Attention, la DnB n'est pas du four-on-the-floor : son pattern kick/snare est syncopé, et c'est la pulsation à 87 BPM que ton corps suit vraiment.
"""

[[fr.pages]]
title   = "Utiliser les ranges BPM en diggant — stratégie à trois quartiers"
content = """
Quand tu construis un set autour de 128 BPM, filtre grosso modo entre **120 et 136** (environ ±6 %). Dans ce range, tu peux tout pitcher à 128 — retiens juste que plus tu approches du bord, plus ça s'entend.

Mais plus une track est loin de ta cible, plus elle demande de shift — et certaines supportent mieux que d'autres :
- **Techno loop-heavy :** se pitche proprement jusqu'à ±6 % quand elle joue seule
- **Tracks mélodiques avec longues notes vocales :** révèle le shift dès ±3%

**Architecture à trois quartiers :**

| Quartier | Range BPM | Rôle |
|---|---|---|
| Warmup | 120–125 | Monter l'énergie doucement |
| Cœur | 126–130 | Cœur du set |
| Peak | 131–136 | Densité et intensité maximales |

Chacun est un dossier Rekordbox séparé. Tu passes entre quartiers uniquement sur des **frontières de phrase** (lignes de 32 ou 64 beats).

**Sur Beatport / Bandcamp :** utilise le slider BPM comme un range (ex. 120–136 pour une cible à 128). Sur Rekordbox, trie par BPM et encadre visuellement les trois zones.
"""

[[fr.pages]]
title   = "Les hubs BPM — là où les genres se croisent"
content = """
Certaines valeurs BPM sont des **points d'intersection de genres** — des tracks de plusieurs familles partagent le même tempo :

**140 BPM :** techno, grime, dubstep et trap (souvent ressentis en half-time, ~70) se croisent ici. Un digger traite 140 comme un hub : des tracks de n'importe lequel de ces genres vivent dans la même cellule BPM et se cross-programment. Le placement du kick et le timbre de la basse déterminent dans quel genre la track se *lit*, pas le BPM seul.

**130 BPM :** techno / tech house, avec 65 BPM comme compagnon half-time. Le UK garage / 2-step vit juste à côté, vers 130–135.

**174 BPM :** drum & bass / jungle (environ 170–175), avec ~87 BPM comme compagnon half-time.

**Quand tu filtres ta librairie, ne pense pas 'un chiffre, un genre'** — pense 'ce BPM, quelles familles half-time ou double-time y vivent ?'

Les transitions cross-genre aux hubs marchent mieux avec un long overlap (deux phrases environ) — le public a besoin de temps pour re-lire le tempo avant que le shift de genre soit pleinement enregistré.
"""

