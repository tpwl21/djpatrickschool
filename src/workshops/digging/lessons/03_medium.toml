[en]
title      = "Reading a BPM Range — Filtering, Key Lock & Tempo Strategy"
short_desc = "The ±6% rule in depth, key lock trade-offs, and how to structure tempo neighborhoods for a set."

[[en.pages]]
title   = "Why ±6% is the magic number"
content = """
Most DJ software pitches tracks via **playback rate change** — speed up the buffer 6% and BPM goes up 6%, but pitch (musical key) also goes up by approximately 1 semitone.

At around ±6–7% the ear starts hearing it:
- Kicks sound thinner or muddy
- Voices sound helium-y or sluggish

A single track pitched alone, mostly rhythmic, rarely bothers anyone below ±3%. Between 3% and 6% you start to hear it, especially on melodic material. Layering changes the rules: two basslines or melodies stacked rub from about 10–15 cents apart, roughly **1%** of pitch difference.

**Concrete examples:**

| Track A | Track B | Difference | Verdict |
|---|---|---|---|
| 127 BPM | 130 BPM | 2.4% | Fine for a track played alone; in a long blend with two basslines it rubs (over 1%) |
| 124 BPM | 130 BPM | 4.8% | Audible on melodic material, fine on drums |
| 125 BPM | 135 BPM | 8.0% | Past the ±6% edge — use key lock or avoid |
| 120 BPM | 130 BPM | 8.3% | Too far without key lock |

The exact math — why ±6% ≈ one semitone, and the log₂ relationship between playback rate and perceived pitch — lives in **LESSON_HARMONIES_2 (Pitch, Key & Master Tempo)**. For this lesson: ±3% discreet on a lone rhythmic track, ±6% audible edge, ±10% surgery.
"""

[[en.pages]]
title   = "Key lock and its trade-offs"
content = """
**Key lock** (also called 'master tempo') is a DSP feature that decouples pitch from playback rate — you speed up without changing the key. Sounds great. But:

- It introduces artifacts above a few percent: metallic 'phasing' on sustained notes, smearing on transients
- For electronic music up to ±3%, key lock is transparent
- Past that, many DJs turn it OFF and accept the pitch shift — a clean sound matters more than a half-semitone drift

**Rule of thumb:**
- ±2% or less: key lock is a free win
- ±3–6%: listen — it might still be clean on percussive tracks
- Past ±6%: key lock is mandatory if you proceed, but expect artifacts

**Double-time / half-time** is the workaround for tempo gaps that key lock can't fix.

A 140 BPM track and a 70 BPM track share the same pulse: each beat of the 70 lands exactly on every other beat of the 140. Mixed with EQ and crossfader, you can transition across the gap. Classic bridges:
- 140 dubstep / grime ↔ 70 half-time (the same dubstep felt at half speed, or a slow hip-hop track)
- 130 techno ↔ 65 dub
- 174 drum & bass ↔ 87 half-time (slow hip-hop, downtempo): each beat of the 87 lands on every other beat of the DnB

Note that DnB is not four-on-the-floor: its kick and snare pattern is syncopated, and the 87 BPM pulse is the one your body actually follows.
"""

[[en.pages]]
title   = "Using BPM ranges when digging — three-neighborhood strategy"
content = """
When building a set around 128 BPM, filter for roughly **120–136** (about ±6%). Inside that range you can pitch anything to 128 — just remember the closer to the edge, the more you hear it.

But the further a track is from your target, the more pitch-shift it needs — and some tracks tolerate it better than others:
- **Loop-heavy techno:** pitches cleanly up to ±6% when played alone
- **Melodic tracks with long vocal notes:** reveals shift at ±3%

**Three-neighborhood architecture:**

| Neighborhood | BPM Range | Role |
|---|---|---|
| Warmup | 120–125 | Build the energy slowly |
| Main | 126–130 | Core of the set |
| Peak | 131–136 | Maximum density and intensity |

Each is a separate Rekordbox folder. You jump between neighborhoods only at **phrase boundaries** (32- or 64-beat lines).

**On Beatport / Bandcamp:** use the BPM slider as a range (e.g. 120–136 for a 128 target). On Rekordbox, sort by BPM and visually bracket the three zones.
"""

[[en.pages]]
title   = "BPM hubs — where genres cross"
content = """
Certain BPM values are **genre intersection points** — tracks from multiple families share the same tempo:

**140 BPM:** techno, grime, dubstep and trap (often felt at half-time, ~70) all intersect here. A digger treats 140 as a hub: tracks from any of these genres live in the same BPM cell and can be cross-programmed. The kick placement and bass tone determine which genre the track *reads as*, not the BPM alone.

**130 BPM:** techno / tech house, with 65 BPM as the half-time companion. UK garage / 2-step lives just next door, around 130–135.

**174 BPM:** drum & bass / jungle (roughly 170–175), with ~87 BPM as the half-time companion.

**When you filter your library, don't think 'one number, one genre'** — think 'this BPM, which half-time or double-time families live here?'

Genre-crossing transitions at hubs work best with a long overlap (a couple of phrases) — the crowd needs time to re-read the tempo before the genre shift fully registers.
"""

