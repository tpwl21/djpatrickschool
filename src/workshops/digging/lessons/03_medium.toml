[fr]
title      = "Lire un BPM Range — Filtrage, Key Lock & Stratégie de Tempo"
short_desc = "La règle des ±6% en profondeur, les compromis du key lock, et comment structurer des quartiers de tempo pour un set."

[[fr.pages]]
title   = "Pourquoi ±6% est le chiffre magique"
content = """
La plupart des logiciels DJ pitchent les tracks via un **changement du taux de lecture** — accélère le buffer de 6% et le BPM monte de 6%, mais la hauteur (la clé musicale) monte aussi d'environ 1 demi-ton.

Vers ±6–7% l'oreille commence à l'entendre :
- Les kicks sonnent maigres ou brouillons
- Les voix deviennent hélium ou pâteuses

Sous ±3% presque personne n'entend. Entre 3% et 6% c'est la zone de confort du mix.

**Exemples concrets :**

| Track A | Track B | Différence | Verdict |
|---|---|---|---|
| 127 BPM | 130 BPM | 2.3% | Transparent — mixe sans problème |
| 124 BPM | 130 BPM | 4.6% | Audible sur matériel mélodique, ok sur drums |
| 125 BPM | 135 BPM | 7.4% | Audible — utilise le key lock ou évite |
| 120 BPM | 130 BPM | 8.0% | Trop loin sans key lock |

Le détail mathématique exact — pourquoi ±6% ≈ un demi-ton, et la relation log₂ entre rate et hauteur perçue — vit dans **LESSON_HARMONIES_2 (Pitch, Tonalité & Master Tempo)**. Pour cette leçon : ±3% invisible, ±6% bord audible, ±10% chirurgie.
"""

[[fr.pages]]
title   = "Le key lock et ses compromis"
content = """
Le **key lock** (aussi 'master tempo') est une fonction DSP qui découple la hauteur du taux de lecture — tu accélères sans changer la clé. Ça a l'air génial. Mais :

- Ça introduit des artefacts au-delà de quelques pourcents : 'phasing' métallique sur les notes tenues, smear sur les transitoires
- Pour la musique électronique jusqu'à ±3%, le key lock est transparent
- Au-delà, beaucoup de DJs le coupent et acceptent le shift de pitch — un son propre compte plus qu'un demi-ton de dérive

**Règle de base :**
- ±2% ou moins : key lock = victoire gratuite
- ±3–6% : écoute — peut rester propre sur des tracks percussives
- Au-delà de ±6% : key lock obligatoire si tu continues, mais attends-toi à des artefacts

**Double-time / half-time** est la parade pour les écarts de tempo que le key lock ne peut pas absorber.

Une DnB 140 BPM et un hip-hop 70 BPM partagent la même pulsation : le kick DnB tombe sur chaque beat, le kick hip-hop sur un beat sur deux. Mixé avec EQ et crossfader, tu traverses le gap. Ponts classiques :
- 140 DnB ↔ 70 trap
- 130 techno ↔ 65 dub
- 174 DnB ↔ 87 broken-beat / UKG
"""

[[fr.pages]]
title   = "Utiliser les ranges BPM en diggant — stratégie à trois quartiers"
content = """
Quand tu construis un set autour de 128 BPM, filtre entre **120 et 134** (±5% laisse de la marge). Dans ce range, tu peux tout pitcher à 128 sans problème audible.

Mais plus une track est loin de ta cible, plus elle demande de shift — et certaines supportent mieux que d'autres :
- **Techno loop-heavy :** se pitche proprement jusqu'à ±6%
- **Tracks mélodiques avec longues notes vocales :** révèle le shift dès ±3%

**Architecture à trois quartiers :**

| Quartier | Range BPM | Rôle |
|---|---|---|
| Warmup | 120–125 | Monter l'énergie doucement |
| Cœur | 126–130 | Cœur du set |
| Peak | 130–134 | Densité et intensité maximales |

Chacun est un dossier Rekordbox séparé. Tu passes entre quartiers uniquement sur des **frontières de phrase** (lignes de 32 ou 64 beats).

**Sur Beatport / Bandcamp :** utilise le slider BPM comme un range (ex. 120–134 pour une cible à 128). Sur Rekordbox, trie par BPM et encadre visuellement les trois zones.
"""

[[fr.pages]]
title   = "Les hubs BPM — là où les genres se croisent"
content = """
Certaines valeurs BPM sont des **points d'intersection de genres** — des tracks de plusieurs familles partagent le même tempo :

**140 BPM :** techno, grime, dubstep, trap, et le bord DnB se croisent ici. Un digger traite 140 comme un hub : des tracks de n'importe lequel de ces genres vivent dans la même cellule BPM et se cross-programment. Le placement du kick et le timbre de la basse déterminent dans quel genre la track se *lit*, pas le BPM seul.

**130 BPM :** techno / deep house / downtempo-doublé (65 BPM half-time).

**174 BPM :** DnB / jungle, avec 87 BPM broken-beat comme compagnon half-time.

**Quand tu filtres ta librairie, ne pense pas 'un chiffre, un genre'** — pense 'ce BPM, quelles familles half-time ou double-time y vivent ?'

Les transitions cross-genre aux hubs nécessitent un overlap minimum de 64 beats — le public a besoin de temps pour re-lire le tempo avant que le shift de genre soit pleinement enregistré.
"""

