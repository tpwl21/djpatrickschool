[en]
title      = "BPM Ranges — Psychoacoustics, TSM Algorithms & Genre Topology"
short_desc = "JND thresholds, WSOLA vs phase vocoder, and the BPM hubs where genres collide."

[[en.pages]]
title   = "The psychoacoustics of pitch shift tolerance"
content = """
The ±6% rule has a psychoacoustic foundation. Here's the precise chain:

**Playback rate → pitch relationship:**
A playback rate change of r% shifts perceived pitch by log₂(1+r/100) octaves, or equivalently (1200 × log₂(1+r/100)) cents. At 6%, that's ~1 semitone (≈100 cents). At 3%, it's ~0.5 semitone (≈50 cents).

**Just-Noticeable Difference (JND) for pitch:**
For trained ears on sustained tones, the JND for pitch is approximately 10 cents (0.5%) in controlled laboratory conditions. In practice, kick drums and transient-heavy material mask pitch shifts up to 3%: the percussive envelope dominates the spectral content, hiding sub-semitone deviations. Melodic material (sustained pads, vocals, piano) has a JND closer to 20–30 cents in club acoustic conditions — meaning ~1.7% becomes audible on melodic tracks.

**Practical consequence:** the safe pitch-shift ceiling is not universal — it's track-dependent. A percussive minimal techno loop: ±6% transparent. A choral vocal pad: ±2% before artifacts. Learn to classify tracks on this axis before buying.

**The ±10% territory:** at ±10%, playback rate shift causes formant distortion (helium/gravel effect) regardless of material. This is where key lock becomes mandatory if you still want to proceed — and even then, TSM artifacts become audible on most software.
"""

[[en.pages]]
title   = "Key lock: WSOLA vs phase vocoder"
content = """
Key lock (master tempo) is **time-scale modification (TSM)** — rescaling duration without rescaling spectrum. Two dominant algorithms:

**WSOLA (Waveform Similarity Overlap-Add):**
Works in the time domain. Slices the signal into overlapping frames (~20–40 ms), finds the splice offset that maximizes cross-correlation (waveform similarity), and reassembles at the new rate. Cheap CPU-wise, good on percussive material (drums, transient-heavy). Smears transients past ±8–10% due to averaging artifacts. Used in many budget DJ controllers and Serato's core engine.

**Phase vocoder:**
Works in the frequency domain. STFT → unwrap instantaneous phase → time-stretch by scaling phase increments → iSTFT. Cleaner on sustained tones and harmonic content. Introduces "phasiness" (metallic flanging) on transients unless phase-locking refinements are applied (Laroche-Dolson, 1999 — the standard reference for practical improvements). Used in Ableton's warping engine and Rekordbox's Elastic mode.

**Formant shift:** both algorithms shift formants along with pitch when key lock is off, causing the helium/gravel effect on vocals. Advanced TSM engines (Elastique by zplane, used in Traktor) add formant preservation as a separate DSP stage. This is why Traktor sounds cleaner on vocals at large pitch shifts than Serato.

**This project's implementation:** `src/audio/wsola-worklet.js` — an in-house WSOLA AudioWorklet developed after the soundtouchjs migration. Tunable frame size (default 40 ms) and overlap factor (0.5).

**Rule:** ±2% or under → key lock is a free win on any algorithm. ±3–6% → listen carefully, especially on melodic material. Past ±6% → consider whether the BPM match is worth the TSM cost.
"""

[[en.pages]]
title   = "Filtering by BPM range in practice"
content = """
When building a set around a target BPM, you're not hunting a single value — you're defining a **tempo neighborhood**.

**Three-neighborhood architecture for a 128 BPM set:**

| Neighborhood | Range | Role |
|---|---|---|
| Warmup | 120–124 | Establish the groove, introduce the crowd |
| Main | 125–131 | Core of the set, maximum density of plays |
| Peak | 132–136 | Acceleration phase, high-energy climax |

Each neighborhood is a separate folder in Rekordbox. Transitions between neighborhoods happen **at phrase boundaries** (32-beat or 64-beat) — never mid-phrase.

**Pitch shift economics:**
- From 120 to 128 = +6.7% pitch-up (near the ceiling — test for artifacts)
- From 136 to 128 = -5.9% pitch-down (safe)
- From 124 to 128 = +3.2% pitch-up (transparent on almost all material)

Tracks near the edges of your neighborhoods are the *riskiest* to pitch — calculate the actual percentage before committing.

**Beatport/Bandcamp filter discipline:** use the BPM range slider as a ±5% bracket around your target, not a ±10%. The extra margin exists in the pitch fader; it's not a recommendation.
"""

[[en.pages]]
title   = "BPM hubs: genre topology at the intersections"
content = """
At certain BPM values, multiple genre families converge. Knowing these hubs turns BPM-filtering from a constraint into a programming tool.

**The major DJ BPM hubs:**

**130 BPM:**
- Techno (Berlin / hypnotic)
- Progressive house (older, 2000s)
- Some deep house (warm end)
- Downtempo at 65 BPM (half-time bridge)

**140 BPM:**
- Peak techno / industrial
- Grime (140 = standard)
- Dubstep (140, half-time = 70 BPM feel)
- Trap (140, with snare on 3 or as half-time)
- DnB approach zone (174 → 87 bridge via half-time)

**174 BPM:**
- Drum & bass / jungle
- 87 BPM broken-beat / UKG (double-time feel)

**The practical use:** when a track sits at a hub BPM, it can be programmed into sets from multiple genre families — the kick placement and bass tone determine which family it *reads as*. A 140 BPM track with a rolling techno kick reads as techno. The same BPM with a wobble bass and half-time snare reads as dubstep. The BPM is shared; the genre identity is in the arrangement.

**Cross-programming rule:** when you cross a genre family (e.g. techno → grime at 140), use a 64-beat overlap minimum. The crowd needs time to re-contextualize the tempo before the genre shift fully registers.
"""

[[en.pages]]
title   = "Double-time and half-time as transition mechanics"
content = """
Half-time / double-time transitions are among the hardest technique in DJing — but they're the only way to cross certain genre gaps cleanly.

**Mechanics of a half-time transition (174 DnB → 87 broken-beat):**

1. DnB track plays at 174 BPM. Kick on every beat.
2. Load the 87 BPM broken-beat track. Cue it to its first beat.
3. Set playback rate to match pitch only — do NOT pitch to 174. The tracks play at different BPMs.
4. Bring in the 87 BPM track subtly under the DnB, in the break or outro of the DnB track.
5. Use EQ — cut the DnB low end, let the 87 BPM sub come in. The crowd re-hears the pulse at half speed.
6. Over 32–64 beats, completely replace the DnB. The room exhales.

**Why this works:** the shared pulse (the 174 BPM kick = every other beat of the 87 BPM pulse) creates continuity while the texture shifts dramatically. The crowd's perception snaps from fast → slow; done correctly, this reads as a deliberate decompression — one of the most effective set-management tools.

**Failure modes:**
- Rushing the EQ swap (under 16 beats) → sounds like a mistake
- Wrong cue point on the incoming track → the beats don't align on the shared pulse
- Misidentifying the half-time relationship → rhythms fight instead of sharing

This is a move to rehearse at home before deploying live. At home with headphones: align, crossfade slowly, check if the kick lands on every other beat of the DnB. If it does, you have the right cue point.
"""

