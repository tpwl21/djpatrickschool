[fr]
title      = "BPM Ranges — Psychoacoustique, Algos TSM & Topologie des Genres"
short_desc = "Seuils JND, WSOLA vs phase vocoder, et les hubs BPM où les genres se croisent."

[[fr.pages]]
title   = "La psychoacoustique de la tolérance au pitch shift"
content = """
La règle des ±6% a un fondement psychoacoustique. Voici la chaîne précise :

**Relation rate de lecture → hauteur perçue :**
Un changement de rate de r% décale la hauteur perçue de log₂(1+r/100) octaves, soit (1200 × log₂(1+r/100)) cents. À 6%, c'est ~1 demi-ton (≈100 cents). À 3%, c'est ~0.5 demi-ton (≈50 cents).

**Just-Noticeable Difference (JND) pour la hauteur :**
Pour des oreilles entraînées sur des notes tenues, le JND de hauteur est d'environ 10 cents (0.5%) en conditions de laboratoire. En pratique, les kicks et les transitoires masquent les shifts jusqu'à 3% : l'enveloppe percussive domine le contenu spectral, cachant les déviations sub-demi-ton. Le matériel mélodique (pads tenus, voix, piano) a un JND d'environ 20–30 cents en conditions acoustiques club — soit ~1.7% devient audible sur des tracks mélodiques.

**Conséquence pratique :** le plafond de pitch shift sûr n'est pas universel — il dépend de la track. Une loop de techno minimale percussive : ±6% transparent. Un pad vocal choral : ±2% avant artefacts. Apprends à classer tes tracks sur cet axe avant d'acheter.

**Le territoire ±10% :** au-delà, le pitch shift cause une distorsion de formants (effet hélium/gravier) quelle que soit la matière. C'est là que le key lock devient obligatoire — et même là, les artefacts TSM deviennent audibles sur la plupart des logiciels.
"""

[[fr.pages]]
title   = "Key lock : WSOLA vs phase vocoder"
content = """
Le key lock (master tempo) est du **time-scale modification (TSM)** — redimensionner la durée sans redimensionner le spectre. Deux algorithmes dominants :

**WSOLA (Waveform Similarity Overlap-Add) :**
Travaille en temporel. Tranche le signal en fenêtres recouvrantes (~20–40 ms), trouve le décalage de splice qui maximise la corrélation de forme d'onde (similarité), et recolle au nouveau rate. Peu coûteux en CPU, bon sur du percussif (drums, transitoires). Étale les transitoires au-delà de ±8–10% à cause des artefacts de moyennage. Utilisé dans beaucoup de contrôleurs d'entrée de gamme et dans le moteur principal de Serato.

**Phase vocoder :**
Travaille en fréquentiel. STFT → déroulement de la phase instantanée → étirement temporel par mise à l'échelle des incréments de phase → iSTFT. Plus propre sur les notes tenues et le contenu harmonique. Introduit une "phasiness" (flanging métallique) sur les transitoires sauf avec des raffinements de phase-locking (Laroche-Dolson, 1999 — la référence standard pour les améliorations pratiques). Utilisé dans le moteur de warping d'Ableton et le mode Elastic de Rekordbox.

**Shift de formants :** les deux algos shiftent les formants avec la hauteur quand le key lock est off, d'où l'effet hélium/gravier sur les voix. Les moteurs TSM avancés (Elastique de zplane, utilisé dans Traktor) ajoutent la préservation de formants comme étape DSP séparée. C'est pour ça que Traktor sonne plus propre que Serato sur les voix à grands shifts de pitch.

**L'implémentation de ce projet :** `src/audio/wsola-worklet.js` — un WSOLA AudioWorklet maison développé après la migration depuis soundtouchjs. Taille de fenêtre configurable (défaut 40 ms) et facteur de recouvrement (0.5).

**Règle :** ±2% ou moins → key lock = victoire gratuite sur n'importe quel algo. ±3–6% → écoute attentivement, surtout sur du matériel mélodique. Au-delà de ±6% → demande-toi si le match BPM vaut le coût TSM.
"""

[[fr.pages]]
title   = "Filtrer par range BPM en pratique"
content = """
Quand tu construis un set autour d'un BPM cible, tu ne chasses pas une valeur unique — tu définis un **quartier de tempo**.

**Architecture à trois quartiers pour un set à 128 BPM :**

| Quartier | Range | Rôle |
|---|---|---|
| Warmup | 120–124 | Installer le groove, introduire le public |
| Cœur | 125–131 | Cœur du set, densité maximale de jeux |
| Peak | 132–136 | Phase d'accélération, climax haute énergie |

Chaque quartier est un dossier séparé dans Rekordbox. Les transitions entre quartiers se font **sur des frontières de phrase** (32 ou 64 beats) — jamais en milieu de phrase.

**Économie du pitch shift :**
- De 120 à 128 = +6.7% (près du plafond — teste les artefacts)
- De 136 à 128 = -5.9% (safe)
- De 124 à 128 = +3.2% (transparent sur presque toute matière)

Les tracks en bordure de quartier sont les plus risquées à pitcher — calcule le pourcentage réel avant de t'engager.

**Discipline filtre Beatport/Bandcamp :** utilise le slider de range BPM comme un encadrement ±5% autour de ta cible, pas ±10%. La marge supplémentaire existe dans le fader de pitch ; ce n'est pas une recommandation.
"""

[[fr.pages]]
title   = "Les hubs BPM : topologie de genres aux intersections"
content = """
À certaines valeurs BPM, plusieurs familles de genres convergent. Connaître ces hubs transforme le filtrage par BPM d'une contrainte en outil de programmation.

**Les principaux hubs DJ :**

**130 BPM :**
- Techno (Berlin / hypnotique)
- Progressive house (ancien, années 2000)
- Certaine deep house (côté chaud)
- Downtempo à 65 BPM (pont half-time)

**140 BPM :**
- Techno peak / industrielle
- Grime (140 = standard)
- Dubstep (140, half-time = feel 70 BPM)
- Trap (140, avec snare sur le 3 ou en half-time)
- Zone d'approche DnB (174 → 87 via pont half-time)

**174 BPM :**
- Drum & bass / jungle
- 87 BPM broken-beat / UKG (feel double-time)

**L'usage pratique :** quand une track est à un hub BPM, elle peut être programmée dans des sets de plusieurs familles de genres — le placement du kick et le timbre de la basse déterminent dans quelle famille elle se *lit*. Une track 140 BPM avec un kick techno rolling se lit comme techno. Le même BPM avec une wobble bass et une snare half-time se lit comme dubstep. Le BPM est partagé ; l'identité de genre est dans l'arrangement.

**Règle de cross-programming :** quand tu croises une famille de genres (ex. techno → grime à 140), utilise un overlap d'au moins 64 beats. Le public a besoin de temps pour re-contextualiser le tempo avant que le shift de genre soit pleinement enregistré.
"""

[[fr.pages]]
title   = "Double-time et half-time comme mécanique de transition"
content = """
Les transitions half-time / double-time sont parmi les techniques les plus difficiles en DJing — mais ce sont les seules qui permettent de franchir certains gaps de genre proprement.

**Mécanique d'une transition half-time (174 DnB → 87 broken-beat) :**

1. La track DnB joue à 174 BPM. Kick sur chaque beat.
2. Charge la track broken-beat à 87 BPM. Cue sur son premier beat.
3. Règle le rate de lecture pour le pitch seulement — ne la pitche PAS à 174. Les deux tracks jouent à des BPM différents.
4. Amène la track 87 BPM subtilement sous la DnB, dans le break ou l'outro de la DnB.
5. EQ — coupe les bas de la DnB, laisse entrer le sub à 87 BPM. Le public réentend la pulsation à mi-vitesse.
6. Sur 32–64 beats, remplace complètement la DnB. La salle expire.

**Pourquoi ça marche :** la pulsation partagée (le kick DnB à 174 = un beat sur deux de la pulsation à 87) crée de la continuité pendant que la texture change radicalement. La perception du public bascule de rapide → lent ; bien exécuté, ça se lit comme une décompression délibérée — un des outils de gestion de set les plus efficaces.

**Modes d'échec :**
- Trop précipiter l'EQ swap (sous 16 beats) → ça sonne comme une erreur
- Mauvais cue point sur la track entrante → les beats ne s'alignent pas sur la pulsation partagée
- Mal identifier la relation half-time → les rythmes se battent au lieu de se partager

C'est un move à répéter chez toi avant de le déployer en live. Au casque : aligne, crossfade lentement, vérifie si le kick tombe sur un beat sur deux de la DnB. Si oui, tu as le bon cue point.
"""

