[en]
title      = "Discogs — Database Architecture, Market Distortion & Archival Blind Spots"
short_desc = "Community bias, speculative markets, Popsike cross-checking, and the archives Discogs doesn't cover."

[[en.pages]]
title   = "Discogs as a community-curated database — structural properties"
content = """
Discogs is not a neutral archive. It is a **community-curated database**, which means its coverage, accuracy, and depth are functions of its contributor demographics. Understanding the structural properties of that dataset is essential for using it effectively as a research tool.

**Coverage patterns:**

| Category | Coverage quality |
|---|---|
| US/UK electronic music 1985–2005 | Excellent — dense contributor base, multiple cross-verifications |
| German techno 1988–2005 | Excellent — dedicated label collectors, comprehensive |
| French house 1993–2003 | Very good |
| Japanese city-pop / jazz-funk 1975–1990 | Improving since 2018 reissue wave, but gaps remain |
| Pre-2000 African popular music (highlife, afrobeat, mbalax) | Sparse — major releases documented, regional/local pressing largely absent |
| South Asian / Middle Eastern popular music pre-1990 | Very sparse |
| Post-2010 Bandcamp-only digital | Often entirely absent |
| Regional distribution-only releases (no international barcode) | Largely absent |

**Implication for diggers:** "absent from Discogs" is not a data-backed signal. It's an artefact of who contributes to Discogs. A record can be historically significant, widely collected in its home market, and completely absent from the Discogs database.

**The verification problem:** Discogs entries are user-created and user-moderated. For major releases, multiple users verify each other's data. For obscure pressings, a single user's entry may contain errors (incorrect year, wrong matrix number, misattributed label) that persist unchallenged. Always cross-reference critical metadata against physical evidence (matrix scratching, label typography, catalogue number conventions) before treating a Discogs entry as authoritative.
"""

[[en.pages]]
title   = "The Marketplace as a price engine — speculative distortion"
content = """
The Discogs Marketplace is a secondary-market price aggregator, and like all such systems it exhibits **speculative distortion**. Understanding the distortion mechanisms protects you as a buyer and informs your research.

**Distortion mechanism 1 — DJ mention spike:**
A single DJ playing a track in a high-visibility Boiler Room or RA podcast set can cause a 200–400% price spike on Discogs Marketplace within 24–48 hours. The causal chain: DJ plays track → clip goes viral on social media → hundreds of people simultaneously search → bots and fast human sellers list at inflated prices → "Last Sold" chart shows the spike → late buyers pay the inflated price treating it as market rate.

**Distortion mechanism 2 — Reissue collapse:**
When a label licenses a rare record for reissue (common practice since 2015 with the vinyl revival), the original pressing's speculative price collapses within weeks of announcement. Buying an original pressing at peak speculative price, then having a reissue announced the following month, is a loss with no musical upside. Always check if a reissue exists or is in production before paying above €50 for anything.

**Cross-checking tools:**
- **Popsike** (popsike.com): aggregates auction results from eBay, Discogs Marketplace, and other platforms. Shows the 2-year price history as a chart — speculative spikes are visible as sudden vertical jumps. A record with a stable Popsike curve at €30 that now lists at €120 on Discogs = speculation. A record with a gradual upward curve = genuine appreciation.
- **eBay Sold Listings:** filter by "Sold items only". Shows what the market actually cleared, not asking prices.
- **Physical shop prices:** the price a specialist physical shop charges is usually the most reliable fair-market value — shops don't buy at inflated prices and typically have enough domain knowledge to resist speculation.

**The Popularity metric as rarity signal:**
The "Discogs Popularity" (how many users have a release in their collection) is a better rarity signal than price. A release with 12 copies in collections and a €200 price is genuinely rare. A release with 800 copies in collections and a €200 price is speculatively inflated — 800 collectors have it, meaning supply exists, meaning the price is a momentary distortion.
"""

[[en.pages]]
title   = "The reverse-engineering research flow"
content = """
The advanced Discogs research methodology starts from a sonic description and triangulates toward a specific release.

**The full reverse-engineering stack:**

**Step 1 — Sonic identification (before Discogs):**
- Shazam / SoundHound — catches ~60% of identifiable releases. Fails on: white labels, bootlegs, unreleased dubs, pre-digital recordings digitised without metadata.
- **WhoSampled** — if you recognise a sample, traces both the sample source and all tracks that sample it. Extremely useful for hip-hop and soul digging.
- **NoteMyMe / Moises** — hum or sing the melody; rough pitch/key estimate. Feeds into Discogs filter.

**Step 2 — Discogs filter construction:**
Combine all sonic clues into a filter stack:
- Genre + Style (from sonic character)
- Year range (from production aesthetics — e.g. "those 909 snare sounds and that specific reverb = 1989–1993")
- Country (from label conventions, language of any vocals)
- Format: 12" (DJ context) or LP (album track)
- BPM-adjacent year: certain BPM ranges are genre-historically concentrated in specific windows

**Step 3 — Visual confirmation:**
Scroll covers. Certain eras have visual signatures (Chicago house 1987 = DIY Xerox sleeves; Berlin techno 1992 = monochrome industrial; French house 1999 = chrome/metallic aesthetics). If a cover from your sonic era looks right → click → examine tracklist for version names that match your memory.

**Step 4 — Label deep-dive:**
Found a candidate release? Click the label. Browse 20 releases adjacent in catalog number (e.g. if the release is PHK-007, look at PHK-001 through PHK-015). Labels sequence releases chronologically — adjacent catalog numbers are same era, same sound.

**Step 5 — Matrix research (advanced):**
For vinyl: the **matrix number** (scratched into the dead wax by the cutting engineer) identifies the specific pressing plant, year, and pressing engineer. Discogs entries include this under "Identifiers". Matrix codes decode the manufacturing history and can confirm that a listing is a first pressing vs. a later repress.
"""

[[en.pages]]
title   = "Archives Discogs doesn't reach — complementary resources"
content = """
A research-grade digger uses Discogs as one node in a multi-archive research network, not as the sole source.

**African popular music (pre-2000):**
- **Awesome Tapes From Africa** (awesometapes.com): Ghana, Ethiopia, Senegal, Nigeria cassette-tape archives. Label catalog available for licensing inquiries.
- **Analog Africa** (analogafrica.com): West and Central African highlife, afrobeat, funk compilations. Rigorous liner notes with historical provenance.
- **Ostinato Records** (ostinatorecords.com): Horn of Africa (Somalia, Djibouti, Eritrea), Gulf (Bahrain, Yemen). Documents music largely absent from any Western database.
- **Syliphone / Bolibana:** Guinea's state labels (1960s–1980s). Minimal Discogs coverage; specialist shops in West Africa and Paris are the primary market.

**Japanese music:**
- **Music From Memory** (musicfrommemory.com): Dutch label specialising in Japanese ambient, new age, city-pop excavation. Their liner notes are primary research documents.
- **Light In The Attic** (lightintheattic.net): *Japan Archives* series — comprehensive, licensed, academically rigorous.

**Folk, traditional, and regional:**
- **Smithsonian Folkways** (folkways.si.edu): ethnomusicological recordings from every country. Full catalog with metadata.
- **Global Jukebox / Cantometrics:** Alan Lomax's archive, now digitised.

**Bandcamp for the contemporary gap:**
Post-2010 self-released digital rarely has a Discogs entry. Bandcamp search by genre + location + year works as a discovery surface. The advantage: you buy directly from the artist, removing the re-sale layer entirely.

**The research posture:** use each archive for its strength. Discogs for electronic/rock/hip-hop deep-dives. Analog Africa / Ostinato / Awesome Tapes for African music. Music From Memory / Light In The Attic for Japanese. Bandcamp for contemporary. Popsike/eBay for price validation. No single archive covers everything — the expert digger triangulates across all of them.
"""

