[[fr.pages]]
title   = "Discogs comme base de données curatée par la communauté — propriétés structurelles"
content = """
Discogs n'est pas une archive neutre. C'est une **base de données curatée par la communauté**, ce qui veut dire que sa couverture, sa précision et sa profondeur sont des fonctions de la démographie de ses contributeurs. Comprendre les propriétés structurelles de ce dataset est essentiel pour l'utiliser efficacement comme outil de recherche.

**Patterns de couverture :**

| Catégorie | Qualité de couverture |
|---|---|
| Musique électronique US/UK 1985–2005 | Excellente — base de contributeurs dense, multiples vérifications croisées |
| Techno allemande 1988–2005 | Excellente — collectionneurs de labels dédiés, exhaustive |
| House française 1993–2003 | Très bonne |
| City-pop / jazz-funk japonais 1975–1990 | S'améliore depuis la vague de rééditions 2018, mais lacunes persistantes |
| Musique populaire africaine pré-2000 (highlife, afrobeat, mbalax) | Fragmentaire — grandes sorties documentées, pressages régionaux/locaux largement absents |
| Musique populaire sud-asiatique / moyen-orientale avant 1990 | Très fragmentaire |
| Digital Bandcamp-only post-2010 | Souvent totalement absent |
| Sorties en distribution régionale uniquement (pas de code-barre international) | Largement absent |

**Implication pour les diggers :** "absent de Discogs" n'est pas un signal étayé par des données. C'est un artefact de qui contribue à Discogs. Un disque peut être historiquement significatif, largement collectionné dans son marché d'origine, et complètement absent de la base de données Discogs.

**Le problème de vérification :** les entrées Discogs sont créées et modérées par les utilisateurs. Pour les grandes sorties, plusieurs utilisateurs se vérifient mutuellement. Pour des pressages obscurs, l'entrée d'un seul utilisateur peut contenir des erreurs (mauvaise année, mauvais numéro de matrice, label mal attribué) qui persistent sans être contestées. Croise toujours les métadonnées critiques avec des preuves physiques (inscription de matrice, typographie du label, conventions de numéro de catalogue) avant de traiter une entrée Discogs comme faisant autorité.
"""

[[fr.pages]]
title   = "La Marketplace comme moteur de prix — distorsion spéculative"
content = """
La Marketplace Discogs est un agrégateur de prix de marché secondaire, et comme tous ces systèmes elle présente une **distorsion spéculative**. Comprendre les mécanismes de distorsion te protège en tant qu'acheteur et éclaire ta recherche.

**Mécanisme de distorsion 1 — le spike de mention DJ :**
Un seul DJ jouant une track dans un Boiler Room ou un podcast RA à haute visibilité peut causer un spike de prix de 200–400% sur la Marketplace Discogs dans les 24–48 heures. La chaîne causale : DJ joue la track → clip devient viral sur les réseaux → des centaines de personnes cherchent simultanément → bots et vendeurs humains rapides la remettent en vente à prix gonflés → la courbe "Last Sold" montre le spike → les acheteurs tardifs paient le prix gonflé en le traitant comme le cours du marché.

**Mécanisme de distorsion 2 — l'effondrement par réédition :**
Quand un label licence un disque rare pour une réédition (pratique courante depuis 2015 avec le renouveau du vinyle), le prix spéculatif du pressage original s'effondre dans les semaines qui suivent l'annonce. Acheter un pressage original au pic du prix spéculatif, puis voir une réédition annoncée le mois suivant, c'est une perte sans bénéfice musical. Vérifie toujours si une réédition existe ou est en production avant de payer plus de 50€ pour quoi que ce soit.

**Outils de cross-check :**
- **Popsike** (popsike.com) : agrège les résultats d'enchères d'eBay, Discogs Marketplace et d'autres plateformes. Montre l'historique de prix sur 2 ans sous forme de graphe — les spikes spéculatifs sont visibles comme des sauts verticaux soudains. Un disque avec une courbe Popsike stable à 30€ qui se liste maintenant à 120€ sur Discogs = spéculation. Une courbe graduellement croissante = appréciation réelle.
- **Ventes eBay closes :** filtre par "Objets vendus seulement". Montre ce que le marché a vraiment liquidé, pas les prix demandés.
- **Prix des disquaires physiques spécialisés :** le prix qu'un disquaire spécialisé facture est en général la valeur marchande équitable la plus fiable — ils n'achètent pas à des prix gonflés et ont assez de connaissance du domaine pour résister à la spéculation.

**La métrique Popularity comme signal de rareté :**
La "Popularité Discogs" (combien d'utilisateurs ont une release dans leur collection) est un meilleur signal de rareté que le prix. Une release avec 12 copies en collections et un prix de 200€ est vraiment rare. Une release avec 800 copies en collections et 200€ est gonflée spéculativement — 800 collectionneurs l'ont, ce qui signifie que l'offre existe et que le prix est une distorsion momentanée.
"""

[[fr.pages]]
title   = "Le flow de recherche par rétro-ingénierie"
content = """
La méthodologie de recherche Discogs avancée commence d'une description sonore et triangule vers une release spécifique.

**La pile complète de rétro-ingénierie :**

**Étape 1 — Identification sonore (avant Discogs) :**
- Shazam / SoundHound — identifie ~60% des releases identifiables. Échoue sur : white labels, bootlegs, dubs non sortis, enregistrements pré-numériques digitisés sans métadonnées.
- **WhoSampled** — si tu reconnais un sample, trace à la fois la source du sample et toutes les tracks qui le samplent. Extrêmement utile pour le digging hip-hop et soul.
- **NoteMyMe / Moises** — fredonne ou chante la mélodie ; estimation grossière de hauteur/clé. Alimente le filtre Discogs.

**Étape 2 — Construction du filtre Discogs :**
Combine tous les indices sonores en une pile de filtres :
- Genre + Style (du caractère sonore)
- Plage d'années (des esthétiques de production — ex. "ces sons de snare 909 et cette reverb spécifique = 1989–1993")
- Pays (des conventions de label, de la langue des éventuels vocaux)
- Format : 12" (contexte DJ) ou LP (track d'album)
- Année adjacent au BPM : certains ranges BPM sont historiquement concentrés dans des fenêtres spécifiques par genre

**Étape 3 — Confirmation visuelle :**
Scrolle les pochettes. Certaines époques ont des signatures visuelles (house Chicago 1987 = pochettes Xerox DIY ; techno Berlin 1992 = industriel monochrome ; house française 1999 = esthétiques chrome/métallique). Si une pochette de ton époque sonore a l'air juste → clique → examine la tracklist pour les noms de versions qui correspondent à ton souvenir.

**Étape 4 — Deep-dive label :**
Tu as trouvé une release candidate ? Clique le label. Browse 20 releases adjacentes en numéro de catalogue (ex. si la release est PHK-007, regarde PHK-001 à PHK-015). Les labels séquencent les releases chronologiquement — les numéros de catalogue adjacents = même époque, même son.

**Étape 5 — Recherche de matrice (avancée) :**
Pour le vinyle : le **numéro de matrice** (gravé dans le dead wax par l'ingénieur de gravure) identifie l'usine de pressage spécifique, l'année et l'ingénieur. Les entrées Discogs l'incluent sous "Identifiers". Les codes matriciels décodent l'historique de fabrication et peuvent confirmer qu'un listing est un premier pressage vs. un repressage ultérieur.
"""

[[fr.pages]]
title   = "Les archives que Discogs n'atteint pas — ressources complémentaires"
content = """
Un digger de niveau recherche utilise Discogs comme un nœud dans un réseau multi-archive, pas comme source unique.

**Musique populaire africaine (pré-2000) :**
- **Awesome Tapes From Africa** (awesometapes.com) : archives de cassettes du Ghana, Éthiopie, Sénégal, Nigeria. Catalogue du label disponible pour les demandes de licence.
- **Analog Africa** (analogafrica.com) : highlife, afrobeat, funk ouest et centre-africains. Notes de pochette rigoureuses avec provenance historique.
- **Ostinato Records** (ostinatorecords.com) : Corne de l'Afrique (Somalie, Djibouti, Érythrée), Golfe (Bahreïn, Yémen). Documente une musique largement absente de toute base de données occidentale.
- **Syliphone / Bolibana :** labels d'État guinéens (années 60–80). Couverture Discogs minimale ; les disquaires spécialisés en Afrique de l'Ouest et à Paris sont le marché principal.

**Musique japonaise :**
- **Music From Memory** (musicfrommemory.com) : label néerlandais spécialisé dans l'excavation ambient, new age, city-pop japonais. Leurs notes de pochette sont des documents de recherche primaires.
- **Light In The Attic** (lightintheattic.net) : série *Japan Archives* — exhaustive, sous licence, rigoureuse académiquement.

**Folk, traditions et régional :**
- **Smithsonian Folkways** (folkways.si.edu) : enregistrements ethnomusicologiques de chaque pays. Catalogue complet avec métadonnées.
- **Global Jukebox / Cantometrics :** archive d'Alan Lomax, maintenant digitisée.

**Bandcamp pour le gap contemporain :**
Le digital auto-édité post-2010 a rarement une entrée Discogs. La recherche Bandcamp par genre + lieu + année fonctionne comme surface de découverte. L'avantage : tu achètes directement à l'artiste, supprimant complètement la couche de revente.

**La posture de recherche :** utilise chaque archive pour sa force. Discogs pour les deep-dives électronique/rock/hip-hop. Analog Africa / Ostinato / Awesome Tapes pour la musique africaine. Music From Memory / Light In The Attic pour le japonais. Bandcamp pour le contemporain. Popsike/eBay pour la validation des prix. Aucune archive ne couvre tout — le digger expert triangule entre toutes.
"""

