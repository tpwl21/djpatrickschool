[fr]
title      = "C'est quoi le digging ? — La curation comme discipline"
short_desc = "Identité, logique de filtre, et pourquoi ton crate est ta marque."

[[fr.pages]]
title   = "La curation, c'est le boulot"
content = """
Tous les DJs ont accès aux mêmes plateformes. Beatport, Bandcamp, Spotify, YouTube — ouverts à tout le monde. La différence n'est pas l'**accès**, c'est le **filtre**.

Curer, c'est décider ce qu'on *rejette*. Le 1% que tu gardes après le filtrage, c'est ta voix. Des DJs comme Theo Parrish ou DJ Harvey ne se démarquent pas parce qu'ils ont un meilleur matos — mais parce que leur *logique de filtre* est radicalement différente de celle des autres.

**Quel est ton filtre ?** Voici un test honnête :

- Note tes 10 derniers achats ou ajouts à ta librairie.
- Ouvre le Top 100 Beatport actuel de ton genre.
- Compte combien de tes 10 tracks s'y trouvent.

Si plus de 4 sont dans ce Top 100, tu DJes le goût des autres. Ce n'est pas forcément mal, mais ça vaut la peine de le savoir.
"""

[[fr.pages]]
title   = "Construire un workflow de curation durable"
content = """
Un workflow de curation, c'est un système répétable pour la découverte. Sans ça, tu digges au hasard et tu oublies ce que tu as trouvé.

**Le workflow en quatre étapes :**

1. **Session d'écoute hebdomadaire** (30 min) : un nouveau label, un tag Bandcamp que tu n'as jamais exploré, un mix RA d'un DJ inconnu. Flague les candidats — n'achète pas encore.
2. **Discipline Wantlist/panier** : garde les candidats au moins 48 heures avant de décider. La moitié des tracks qui t'excitaient sur le moment ne survivent pas 48 heures de recul.
3. **Révision mensuelle en lot** : supprime 60% de ta Wantlist. Achète les 40% restants.
4. **Taguage immédiat** : à l'import, tague Genre, Énergie (1–5), et longueur intro/outro. Une track que tu ne sais pas taguer, c'est une track que tu ne comprends pas encore — réecoute.

**Vocabulaire de l'industrie à connaître :**
- **Mix** : la version complète pour les clubs (généralement 6–8+ minutes)
- **Extended** : pareil, variante de jargon label
- **Radio Edit** : courte, vocaux en avant — presque jamais utile pour les DJs
- **Dub** : version instrumentale et épurée — extrêmement utile pour le mix
- **Acapella** : vocaux seuls — utile pour le blending créatif
- **VIP** (Very Important Person) : remix par l'artiste original de sa propre track
"""

[[fr.pages]]
title   = "Theo Parrish, DJ Harvey — ce que leur logique de filtre enseigne"
content = """
Deux DJs, deux logiques de filtre radicalement différentes :

**Theo Parrish** digge pour la **spécificité émotionnelle**. Son filtre : "est-ce que cette track dit quelque chose qu'aucune autre ne dit ?" Il passera sur des productions techniquement parfaites pour une soul de Chicago de 1978 qui cloue un sentiment précis. Ses sets sont longs (6–8h), construits comme des récits émotionnels. Il achète 2000+ disques par an — son taux de rejet est d'environ 98%.

**DJ Harvey** construit ce qu'il appelle une **"belle grande machine"** — des sets qui connectent disco obscur, italo, crossover rock et yacht-rock sur 8+ heures. Son filtre : glamour sans évidence. Un disque de patinoire de 1981 à côté d'un producteur contemporain que personne ne connaît. Son crate n'est pas trié par genre — il est trié par *mood*.

**Le fil conducteur** : aucun des deux ne cure par genre. Tous les deux curent par *cohérence de feeling*. C'est ce qui donne à leurs sets une identité reconnaissable — tu sais que c'est Harvey ou Parrish en 30 secondes, avant même de connaître une seule track.

Ton filtre n'a pas besoin de ressembler au leur. Il doit être *le tien* — spécifique, cohérent, et construit dans le temps.
"""

[[fr.pages]]
title   = "Le crate se capitalise dans le temps"
content = """
Le digging n'est pas une session — c'est une pratique. La valeur du crate n'est pas dans une track mais dans la façon dont les tracks se relient entre elles sur des années.

**Comment la capitalisation fonctionne :**

- Mois 1 : 50 tracks. Tu les connais presque toutes. 5 sont vraiment uniques.
- An 1 : 400 tracks. Tu en as joué 200 en set. Tu sais exactement lesquelles fonctionnent dans quel contexte.
- An 3 : 1200 tracks. Tu peux construire un set de 4 heures sur presque n'importe quel style dans ton filtre. Le 1% que personne d'autre n'a ? C'est 12 tracks — assez pour rendre un set mémorable.
- An 10 : 4000 tracks. Tu joues 8 heures sans te répéter. Ton crate EST ton identité à ce stade.

**Le piège à éviter** : acheter vite pour sentir la quantité grossir. 10 tracks profondément comprises valent plus que 100 achats impulsifs. Quand tu achètes une track, demande-toi : "est-ce que je peux nommer deux autres tracks de ma librairie vers lesquelles celle-ci peut faire pont ?" Si non, c'est un orphelin — difficile à utiliser en set.
"""

