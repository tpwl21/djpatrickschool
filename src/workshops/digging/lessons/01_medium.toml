[en]
title      = "What Is Digging? — Curation as Discipline"
short_desc = "Identity, filter logic, and why your crate is your brand."

[[en.pages]]
title   = "Curation is the job"
content = """
Every DJ has access to the same platforms. Beatport, Bandcamp, Spotify, YouTube — open to anyone. The differentiator isn't **access**, it's **filter**.

Curation is the act of deciding what to *reject*. The 1% you keep after filtering is your voice. DJs like Theo Parrish or DJ Harvey don't stand out because they have better gear — they stand out because their *filter logic* is radically different from everyone else's.

**What is your filter?** Here's an honest test:

- Write down the last 10 tracks you bought or added to your library.
- Open Beatport's current Top 100 for your genre.
- Count how many of your 10 are in that Top 100.

If more than 4 overlap, you're DJing other people's taste. That's not necessarily wrong, but it's worth knowing.
"""

[[en.pages]]
title   = "Building a sustainable curation workflow"
content = """
A curation workflow is a repeatable system for discovery. Without one, you dig randomly and forget what you found.

**The four-step workflow:**

1. **Weekly listening session** (30 min): one new label, one Bandcamp tag you've never explored, one RA mix from an unfamiliar DJ. Flag candidates — don't buy yet.
2. **Wantlist/cart discipline**: hold candidates for at least 48 hours before deciding. Half the tracks that excited you in the moment don't survive 48 hours of reflection.
3. **Monthly batch review**: delete 60% of your Wantlist. Buy the remaining 40%.
4. **Immediate tagging**: at import, tag Genre, Energy (1–5), and intro/outro length. A track you can't tag is one you don't understand yet — listen again.

**Industry terms to know:**
- **Mix**: the full club-length version (typically 6–8+ minutes)
- **Extended**: same as Mix, label jargon variant
- **Radio Edit**: short, vocal-forward version — almost never useful for DJs
- **Dub**: instrumental, stripped-down version — extremely useful for mixing
- **Acapella**: vocals only — useful for creative blending
- **VIP** (Very Important Person): remix by the original artist of their own track
"""

[[en.pages]]
title   = "Theo Parrish, DJ Harvey — what their filter logic teaches us"
content = """
Two DJs, two radically different filter logics:

**Theo Parrish** digs for **emotional specificity**. His filter: "does this track say something that no other track says?" He'll pass on technically perfect productions in favor of a rough 1978 Chicago soul record that nails a specific feeling. His sets are long (6–8 hours), built as emotional narratives. He famously buys 2000+ records a year, which means his rejection rate is roughly 98%.

**DJ Harvey** builds what he calls a **"big beautiful machine"** — sets connecting obscure disco, italo, rock-crossover, and yacht-rock over 8+ hours. His filter: glamour without obviousness. A 1981 roller-skating rink record next to a contemporary producer nobody's heard of. His crate isn't genre-sorted; it's *mood-sorted*.

**The common thread**: neither curates by genre. Both curate by *coherence of feeling*. That's what gives their sets a recognizable identity — you know it's Harvey or Parrish 30 seconds in, before you know a single track.

Your filter doesn't need to match theirs. It needs to be *yours* — specific, consistent, and built over time.
"""

[[en.pages]]
title   = "The crate compounds over time"
content = """
Digging is not a session — it's a practice. The crate's value is not in any single track but in how tracks relate to each other over years.

**How the compound works:**

- Month 1: you have 50 tracks. You know most of them well. 5 are truly unique.
- Year 1: 400 tracks. You've played 200 in sets. You know exactly which 30 work in which context.
- Year 3: 1200 tracks. You have enough to build a 4-hour set on almost any style within your filter. The 1% that nobody else has? That's now 12 tracks — enough to make a set memorable.
- Year 10: 4000 tracks. You can DJ for 8 hours without repeating yourself. Your crate IS your identity at this point.

**The trap to avoid**: buying fast to feel the quantity grow. 10 deeply understood tracks are worth more than 100 impulse buys. When you buy a track, ask: "can I name two other tracks in my library that this bridges to?" If not, it's an orphan — hard to use in a set.
"""

