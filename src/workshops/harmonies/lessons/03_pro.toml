[[fr.pages]]
title   = "Le remappage du cercle des quintes : pourquoi chaque pas = +7 demi-tons"
content = "La numérotation Camelot suit exactement le **cercle des quintes**. Pourquoi se déplacer d'un pas dans le sens horaire équivaut-il à une quinte juste (+7 demi-tons) ?\n\n**Le Théorème du Générateur pour Z₁₂** : le groupe des 12 hauteurs chromatiques sous addition modulo 12 est cyclique. Un générateur est tout élément premier avec 12. Les valeurs premières avec 12 sont : 1, 5, 7, 11. En termes musicaux :\n- Générateur 1 = gamme chromatique (chaque demi-ton)\n- Générateur 5 = cercle des quartes (Do → Fa → Si♭ → ...)\n- **Générateur 7** = **cercle des quintes** (Do → Sol → Ré → La → Mi → Si → Fa♯ → Do♯ → Sol♯ → Ré♯ → La♯ → Fa → Do)\n- Générateur 11 = la gamme chromatique en descendant (comme le générateur 1, à l'envers)\n\nLe cercle des quintes est choisi plutôt que les quartes pour sa proximité harmonique intuitive : les tonalités à une quinte de distance partagent 6 des 7 notes. La roue capture ça : les numéros Camelot adjacents partagent toujours 6/7 notes.\n\n**Vérification du wrap** : commence à Do (8B en Camelot). Applique +7 demi-tons 12 fois. Tu visites : Do→Sol→Ré→La→Mi→Si→Fa♯→Do♯→Sol♯→Ré♯→La♯→Fa→Do. Les 12 tonalités visitées exactement une fois. C'est pourquoi 12 pas ferment la boucle."
image         = "lesson-images/camelot-wheel.png"
image_caption = "Chaque pas horaire sur la roue = +7 demi-tons (quinte juste). Après 12 pas, toutes les tonalités visitées."

[[fr.pages]]
title   = "Les angles morts modaux : ce que A/B ne capture pas"
content = "La distinction A/B de Camelot n'encode que deux des sept modes diatoniques :\n- **A** = Éolien (mineur naturel)\n- **B** = Ionien (majeur)\n\nLes cinq modes restants sont tous **forcés dans la case A ou B la plus proche**, perdant leur identité modale :\n\n| Mode | Case forcée | Ce qui est perdu |\n|------|------------|------------------|\n| **Dorien** (mineur + 6e haussée) | A | La 6e haussée crée une 'mauvaise' note en blendant avec un morceau éolien pur à la même case |\n| **Phrygien** (mineur + 2e bémol) | A | La 2e bémol est une bombe de dissonance contre tout voisin ionien/éolien |\n| **Lydien** (majeur + 4e haussée) | B | La 4e haussée clashe avec tout B adjacent qui utilise la 4e naturelle |\n| **Mixolydien** (majeur + 7e bémol) | B | La 7e bémol entre en conflit avec la sensible des voisins ioniens |\n| **Locrien** (tonique diminuée) | A | Rarement assez tonal pour compter, mais la ♭5 est une dissonance active |\n\nConséquence pratique : un **morceau de deep house dorien** et un **morceau de techno phrygien** peuvent partager la même case Camelot (8A), mais leur 6e haussée vs 2e bémol vont clasher sur tout moment harmonique soutenu. La vérification à l'oreille gagne toujours sur la roue."

[[fr.pages]]
title   = "La cadence ii-V-I mappée sur la roue"
content = "La **cadence ii-V-I** est la résolution harmonique la plus courante en musique occidentale. En Do majeur :\n- **ii** = Ré mineur (Rém)\n- **V** = Sol majeur (Sol)\n- **I** = Do majeur (Do)\n\nCela résout la tension (ii→V crée de la tension dominante, V→I la libère).\n\nSur la roue Camelot dans le monde du Do majeur (8B = Do, 8A = Lam) :\n- **ii** (Rém) = **7A** (un pas anti-horaire depuis 8A)\n- **V** (Sol) = **9B** (un pas horaire depuis 8B)\n- **I** (Do) = **8B**\n\nChemin : **7A → 9B → 8B**.\n\nRègle générale, par rapport à la tonalité de résolution I = NB : **ii = (N-1)A**, **V = (N+1)B**.\n\nPour les DJs : teaser un morceau en territoire 7A, puis dropper un morceau à énergie dominante en 9B, puis résoudre en 8B crée un **arc structurel** que les auditeurs ressentent comme une tension-libération. Ça fonctionne entre les morceaux, pas seulement à l'intérieur d'un. C'est avancé mais entièrement intentionnel, et il faut un set assez long pour le développer.\n\nNote : V → I (9B → 8B) est un simple pas de -1 sur le même anneau. L'idée courante que NX → (N+7)X serait un V→I est fausse : +7 sur la roue = **+1 demi-ton** (8A Lam → 3A Si♭m), seulement 2 notes en commun, aucune relation de dominante. Traite ça comme un effet de tension en coupe uniquement, jamais en blend long."

[[fr.pages]]
title   = "Crimes harmoniques : trois écoles"
content = "Trois écoles de transgression délibérée des règles harmoniques, décrites comme des techniques plutôt que comme des affirmations sur tel ou tel DJ :\n\n**Le layering polyrythmique comme couverture harmonique** (approche minimale). Superposer plusieurs morceaux aux rythmes denses et entrelacés sur une longue durée. La complexité rythmique accapare l'attention de l'auditeur, donc un clash d'harmonie reste en arrière-plan comme une 'texture' plutôt que comme une 'mauvaise note'. Ça ne marche que si les basses ne se battent jamais : une seule basse à la fois, toujours.\n\n**Le mismatch comme couleur de production** (approche façon DJ Koze). Traiter le désaccord de tonalité comme une couleur, pas une erreur : pitcher un loop de quelques demi-tons à côté exprès pour créer un malaise, puis le résoudre avec un **filter sweep** (un balayage passe-haut enlève le grave où un clash s'entend le plus) ou une **coupe des médiums** sur une platine. La libération fonctionne comme une résolution V→I : la tension était le but.\n\n**L'arc émotionnel avant la correction harmonique** (approche façon Theo Parrish). Mélanger disco, gospel, house de Chicago brute, jazz et R&B dans des tonalités qui ne matchent pas. Le pont : tenir un morceau jusqu'à un **break percussif** (une mesure sans contenu harmonique soutenu, juste kick et clap) qui offre une toile blanche, et couper le disque suivant sur le temps 1 de ce break. La mémoire harmonique de l'oreille se réinitialise pendant la mesure atonale. C'est la version DJ d'un cut de scène au cinéma.\n\nLes trois reposent sur le même principe : contrôler **quand** le clash s'entend et **combien de temps** il dure.\n\nCe sont des lectures de style : vérifie toi-même interviews et sets enregistrés avant de citer des détails ; les techniques tiennent debout toutes seules."

[[fr.pages]]
title   = "La boîte à outils du crime harmonique"
content = "Techniques pour franchir exprès les règles Camelot. Aucune ne transforme un mauvais clash en bon ; elles contrôlent seulement combien de temps et où il s'entend.\n\n**1. Coupe courte et nette** - L'oreille met quelques mesures à caler un centre tonal. Une fenêtre courte (4 mesures ou moins, une coupe plutôt qu'un blend) laisse passer un mismatch plus facilement qu'un long chevauchement, mais les limites restent serrées : au-delà de 10-15 cents environ entre deux basses, ça frotte déjà, et un clash d'un demi-ton ou plus est un choix de style, pas une zone sûre. Ne blende jamais 32 mesures sur un clash de 2 demi-tons. Le mouvement +7 (8A → 3A, +1 demi-ton) a sa place ici : en coupe uniquement.\n\n**2. Bass swap d'abord** - Un clash de tonalité est pire quand deux lignes de basse tonales jouent en même temps. Garde une seule basse à la fois : coupe le grave du morceau entrant, puis fais le swap sur la phrase. C'est le premier réflexe, avant tout le reste.\n\n**3. Coupe des médiums** - Accords, pads et leads vivent grosso modo entre 500 Hz et 2 kHz. Réduire cette plage sur une platine adoucit un clash d'accords ou de lead. N'attends pas qu'elle efface l'harmonie : la ligne de basse est tonale aussi et reste dans le grave, c'est pourquoi le bass swap passe en premier.\n\n**4. Filter sweep** - Passe-haut sur le morceau entrant, puis ouvre-le sur 8 mesures. Hi-hats et cymbales installent d'abord le groove ; le clash harmonique n'arrive que quand le filtre s'ouvre vers la mesure 6-8, une fois le nouveau groove accepté par la salle.\n\n**5. Atterrissage atonal** - Repère un break percussif dans le morceau sortant (marque-le dans Rekordbox). Coupe le nouveau disque sur ce break. Pas de contenu harmonique dans le break, donc pas de clash à entendre, et l'oreille se réancre sur la nouvelle tonalité dès le temps 1.\n\n**6. Connais ta salle** - Dans une salle forte et dense, le masquage cache un peu les petits désaccords. C'est une raison d'être prudent, pas d'être négligent, et jamais une raison de monter le volume : ton audition et celle du public ne se renouvellent pas."

