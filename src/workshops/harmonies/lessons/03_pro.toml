[en]
title      = "Camelot internals: circle of fifths remap, modal blind spots & harmonic crimes"
short_desc = "Why the wheel encodes fifths, where it lies about modes, and how Villalobos, Koze and Parrish break it deliberately."
description = "The Camelot wheel is a compressed circle of fifths. This lesson unpacks that compression: the group theory behind why fifths generate all 12 keys, what the A/B encoding loses (modes), how the ii-V-I cadence maps to wheel positions, and the technique-level analysis of how top DJs violate the rules on purpose."
recap = [
  "Each clockwise Camelot step = +7 semitones (perfect fifth). After 12 steps, you've visited all 12 keys — this is the Generator Theorem for Z₁₂.",
  "Camelot encodes only Aeolian (A) vs Ionian (B). Dorian, Phrygian, Mixolydian tracks are mapped to the nearest slot and can cause unexpected clashes.",
  "The ii-V-I cadence maps to Camelot as: ii = (N-2)A, V = (N+5)B, I = NB. Example in C: Dm (6A) → G (1A/1B boundary) → C (8B).",
  "Modal interchange creates windows in tracks where an 'incompatible' blend suddenly works — Villalobos exploits these seams.",
  "Harmonic crime toolkit: EQ-kill mid on clash, land on atonal break, short transitions (≤8 bars) tolerate more dissonance, filter sweep to re-anchor."
]

[[en.pages]]
title   = "The circle of fifths remap: why each step = +7 semitones"
content = "Camelot numbering follows the **circle of fifths** exactly. Why does moving one step clockwise equal a perfect fifth (+7 semitones)?\n\n**The Generator Theorem for Z₁₂**: the group of 12 chromatic pitches under addition modulo 12 is cyclic. A generator is any element coprime to 12. The coprime values of 12 are: 1, 5, 7, 11. In musical terms:\n- Generator 1 = chromatic scale (every semitone)\n- Generator 5 = circle of fourths (C → F → B♭ → ...)\n- **Generator 7** = **circle of fifths** (C → G → D → A → E → B → F♯ → C♯ → G♯ → D♯ → A♯ → F → C)\n- Generator 11 = circle of minor sevenths\n\nThe circle of fifths is chosen over fourths for intuitive harmonic closeness: keys a fifth apart share 6 of 7 notes. The wheel captures this: adjacent Camelot numbers always share 6/7 notes.\n\n**Wrap verification**: start at C (8B in Camelot). Apply +7 semitones 12 times. You visit: C→G→D→A→E→B→F♯→C♯→G♯→D♯→A♯→F→C. All 12 keys visited exactly once. This is why 12 steps closes the loop."
image         = "lesson-images/camelot-wheel.png"
image_caption = "Each clockwise step on the wheel = +7 semitones (perfect fifth). After 12 steps, all keys visited."

[[en.pages]]
title   = "Modal blind spots: what A/B doesn't capture"
content = "The Camelot A/B distinction encodes only two of the seven diatonic modes:\n- **A** = Aeolian (natural minor)\n- **B** = Ionian (major)\n\nThe five remaining modes all get **forced into the nearest A or B slot**, losing their modal identity:\n\n| Mode | Forced slot | What gets lost |\n|------|------------|----------------|\n| **Dorian** (minor + raised 6) | A | The raised 6th creates a 'wrong' note when blending with a pure Aeolian track at the same code |\n| **Phrygian** (minor + flat 2) | A | The flat 2nd is a dissonance bomb against any Ionian/Aeolian neighbor |\n| **Lydian** (major + raised 4) | B | The raised 4th clashes with any adjacent B that uses the natural 4th |\n| **Mixolydian** (major + flat 7) | B | The flat 7th conflicts with the leading tone of Ionian neighbors |\n| **Locrian** (diminished tonic) | A | Rarely tonal enough to matter, but the ♭5 is an active dissonance |\n\nPractical consequence: a **Dorian deep house track** (e.g., Kerri Chandler's 'Bar A Thym') and a **Phrygian techno track** may share the same Camelot slot (8A), but their raised-6 vs flat-2 will clash on any sustained harmonic moment. Ear-check always wins over the wheel."

[[en.pages]]
title   = "The ii-V-I cadence mapped to the wheel"
content = "The **ii-V-I cadence** is the most common harmonic resolution in Western music. In the key of C major:\n- **ii** = D minor (Dm)\n- **V** = G major (G)\n- **I** = C major (C)\n\nThis resolves tension (ii→V creates dominant tension, V→I releases it).\n\nOn the Camelot wheel in C-major world (8B = C, 8A = Am):\n- **ii** (Dm) = **6A** (two positions counter-clockwise from 8A, or think of Dm as the ii of C)\n- **V** (G) = **2B** (Camelot position of G major)\n- **I** (C) = **8B**\n\nPath: **6A → 2B → 8B**.\n\nFor DJs: teasing a track in 6A territory, then dropping a dominant-energy track at 2B, then resolving to 8B creates a **structural arc** listeners feel as satisfying tension-release. This works across tracks, not just inside one. A 20-minute set movement built on ii-V-I wheel navigation is advanced but fully intentional. Radioactive DJs (Magda, Ben Klock) do this over 30-40 minute arcs in their recorded mixes.\n\nNote: the cadence always maps relative to the resolution key. The +7 energy boost move is essentially the **dominant relationship** (V→I, N+5 → N)."

[[en.pages]]
title   = "Harmonic crimes: Villalobos, Koze, Parrish"
content = "The three most studied practitioners of deliberate harmonic rule-breaking:\n\n**Ricardo Villalobos** — Polyrhythmic layering as harmonic cover. He frequently overlays 3-4 tracks in unrelated keys for 30+ bars. The strategy: the polyrhythmic complexity (5-against-4 patterns, polymetric phrases) absorbs the ear's analytical bandwidth. By the time the listener's brain parses the rhythmic structure, it has stopped analyzing the harmonic one. The dissonance sits in the background as 'texture', not as 'wrong note'. Villalobos also hunts for **modal seams**: moments in a track where a borrowed chord creates a 2-4 bar window of ambiguity. He drops the incompatible next track exactly in that window.\n\n**DJ Koze** — Deliberate mismatch as production effect. Koze treats the key mismatch as a **color** in the mix, not a mistake. He'll pitch a loop 2-3 semitones outside Camelot to create harmonic unease, then resolve it via a **filter sweep** (high-pass sweep removes low harmonics where the clash is most audible) or an **EQ mid-kill** (gutting 500 Hz–2 kHz on one deck kills the harmonic content while preserving kick and hi-hat). The resolution releases the tension in the same way a V-to-I resolves in classical music.\n\n**Theo Parrish** — Emotional arc over harmonic correctness. Parrish's sets span disco, gospel, raw Chicago house, jazz, and R&B in clashing keys. His bridge technique: ride a track until a **percussive break** (a bar with no sustained harmonic content — just kick and clap) provides a 'white canvas'. Cut in the next record on beat 1 of that break. The ear's harmonic memory resets during the atonal bar. This is the DJ equivalent of a scene cut in film: the eye (ear) accepts the new context when the transition is at the right moment."

[[en.pages]]
title   = "Harmonic crime toolkit"
content = "Tested techniques for crossing the Camelot rules intentionally:\n\n**1. Short transition window** — The ear's harmonic JND resets roughly every 4-8 bars. A mismatch of up to ~1.5 semitones (150 cents) is survivable in a 4-bar cut. Plan incompatible transitions to land and exit within 4 bars. Don't blend for 32 bars on a 2-semitone clash.\n\n**2. EQ mid-kill** — Before the clash, kill the mid-range (500 Hz–2 kHz) on one deck. Harmonics of melodic instruments live in this range; with them killed, only kick (sub) and hi-hat (presence) remain — both are largely atonal. Blend in this mid-killed state, then restore mids after the new track is established.\n\n**3. Filter sweep** — High-pass filter the incoming track from 2 kHz down to full range over 8 bars. The high frequencies first (cymbal textures, hi-hats) establish groove without harmonic content. The harmonic clash only arrives as the filter opens at bar 6-8, by which time the crowd has accepted the new groove.\n\n**4. Atonal landing** — Identify a percussive break in the outgoing track (label it in Rekordbox). Cut the new record in at that break. No harmonic content in the break = no harmonic clash to hear. The ear re-anchors to the new key from beat 1 of the new track.\n\n**5. Trust the energy** — In a high-energy room at peak decibel, above-threshold SPL (110+ dB) causes temporary threshold shift and spectral masking. The crowd literally cannot distinguish harmonic clashes as well as they could at 90 dB. This is not an excuse to be sloppy — but it explains why a harmonic crime that would be painful in a quiet room can pass unnoticed in a loud one."

