[en]
title      = "Camelot internals: circle of fifths remap, modal blind spots & harmonic crimes"
short_desc = "Why the wheel encodes fifths, where it lies about modes, and how DJs break it deliberately."
description = "The Camelot wheel is a compressed circle of fifths. This lesson unpacks that compression: the group theory behind why fifths generate all 12 keys, what the A/B encoding loses (modes), how the ii-V-I cadence maps to wheel positions, why +7 is not a dominant, and a technique-level look at how DJs violate the rules on purpose."
recap = [
  "Each clockwise Camelot step = +7 semitones (perfect fifth). After 12 steps, you've visited all 12 keys — this is the Generator Theorem for Z₁₂.",
  "Camelot encodes only Aeolian (A) vs Ionian (B). Dorian, Phrygian, Mixolydian tracks are mapped to the nearest slot and can cause unexpected clashes.",
  "The ii-V-I cadence maps to Camelot as: ii = (N-1)A, V = (N+1)B, I = NB. Example in C: Dm (7A) → G (9B) → C (8B).",
  "Modal interchange creates windows in tracks where an 'incompatible' blend suddenly works — some DJs hunt for these seams.",
  "Harmonic crime toolkit: bass swap first (one bassline at a time), mid-cut on one deck, land on a percussive break, short hard cuts, filter sweep to re-anchor. +7 on the wheel is +1 semitone: cut-only."
]

[[en.pages]]
title   = "The circle of fifths remap: why each step = +7 semitones"
content = "Camelot numbering follows the **circle of fifths** exactly. Why does moving one step clockwise equal a perfect fifth (+7 semitones)?\n\n**The Generator Theorem for Z₁₂**: the group of 12 chromatic pitches under addition modulo 12 is cyclic. A generator is any element coprime to 12. The coprime values of 12 are: 1, 5, 7, 11. In musical terms:\n- Generator 1 = chromatic scale (every semitone)\n- Generator 5 = circle of fourths (C → F → B♭ → ...)\n- **Generator 7** = **circle of fifths** (C → G → D → A → E → B → F♯ → C♯ → G♯ → D♯ → A♯ → F → C)\n- Generator 11 = the chromatic scale going down (the same as generator 1, reversed)\n\nThe circle of fifths is chosen over fourths for intuitive harmonic closeness: keys a fifth apart share 6 of 7 notes. The wheel captures this: adjacent Camelot numbers always share 6/7 notes.\n\n**Wrap verification**: start at C (8B in Camelot). Apply +7 semitones 12 times. You visit: C→G→D→A→E→B→F♯→C♯→G♯→D♯→A♯→F→C. All 12 keys visited exactly once. This is why 12 steps closes the loop."
image         = "lesson-images/camelot-wheel.png"
image_caption = "Each clockwise step on the wheel = +7 semitones (perfect fifth). After 12 steps, all keys visited."

[[en.pages]]
title   = "Modal blind spots: what A/B doesn't capture"
content = "The Camelot A/B distinction encodes only two of the seven diatonic modes:\n- **A** = Aeolian (natural minor)\n- **B** = Ionian (major)\n\nThe five remaining modes all get **forced into the nearest A or B slot**, losing their modal identity:\n\n| Mode | Forced slot | What gets lost |\n|------|------------|----------------|\n| **Dorian** (minor + raised 6) | A | The raised 6th creates a 'wrong' note when blending with a pure Aeolian track at the same code |\n| **Phrygian** (minor + flat 2) | A | The flat 2nd is a dissonance bomb against any Ionian/Aeolian neighbor |\n| **Lydian** (major + raised 4) | B | The raised 4th clashes with any adjacent B that uses the natural 4th |\n| **Mixolydian** (major + flat 7) | B | The flat 7th conflicts with the leading tone of Ionian neighbors |\n| **Locrian** (diminished tonic) | A | Rarely tonal enough to matter, but the ♭5 is an active dissonance |\n\nPractical consequence: a **Dorian deep house track** and a **Phrygian techno track** may share the same Camelot slot (8A), but their raised-6 vs flat-2 will clash on any sustained harmonic moment. Ear-check always wins over the wheel."

[[en.pages]]
title   = "The ii-V-I cadence mapped to the wheel"
content = "The **ii-V-I cadence** is the most common harmonic resolution in Western music. In the key of C major:\n- **ii** = D minor (Dm)\n- **V** = G major (G)\n- **I** = C major (C)\n\nThis resolves tension (ii→V creates dominant tension, V→I releases it).\n\nOn the Camelot wheel in C-major world (8B = C, 8A = Am):\n- **ii** (Dm) = **7A** (one step counter-clockwise from 8A)\n- **V** (G) = **9B** (one step clockwise from 8B)\n- **I** (C) = **8B**\n\nPath: **7A → 9B → 8B**.\n\nGeneral rule, relative to the resolution key I = NB: **ii = (N-1)A**, **V = (N+1)B**.\n\nFor DJs: teasing a track in 7A territory, then dropping a dominant-energy track at 9B, then resolving to 8B creates a **structural arc** listeners feel as tension-release. This works across tracks, not just inside one. It is advanced but fully intentional, and it needs a long enough set to develop.\n\nNote: V → I (9B → 8B) is a plain -1 step on the same ring. The common claim that NX → (N+7)X is a V→I move is wrong: +7 on the wheel is **+1 semitone** (8A Am → 3A B♭m), only 2 notes in common, with no dominant relationship at all. Treat it as a cut-only tension effect, never as a long blend."

[[en.pages]]
title   = "Harmonic crimes: three schools"
content = "Three schools of deliberate harmonic rule-breaking, described as techniques rather than as claims about any one DJ:\n\n**Polyrhythmic layering as harmonic cover** (a minimal-style approach). Overlay several tracks with dense, interlocking rhythms for a long stretch. The rhythmic complexity grabs the listener's attention, so a clash in the harmony sits in the background as 'texture' rather than as a 'wrong note'. It only works if the basslines never fight: one bass at a time, always.\n\n**Mismatch as a production color** (a DJ Koze-style approach). Treat the key mismatch as a color, not a mistake: pitch a loop a few semitones away on purpose to create unease, then resolve it with a **filter sweep** (a high-pass sweep removes the low content where a clash is most audible) or a **mid-cut** on one deck. The release works like a V→I resolution: the tension was the point.\n\n**Emotional arc over harmonic correctness** (a Theo Parrish-style approach). Mix disco, gospel, raw Chicago house, jazz and R&B in keys that do not match. The bridge: ride a track until a **percussive break** (a bar with no sustained harmonic content, just kick and clap) offers a white canvas, and cut the next record in on beat 1 of that break. The ear's harmonic memory resets during the atonal bar. It is the DJ version of a film scene cut.\n\nAll three rest on the same principle: control **when** the clash is audible and **how long** it lasts.\n\nBecause these are stylistic readings, check interviews and recorded sets yourself before quoting specifics; the techniques stand on their own."

[[en.pages]]
title   = "Harmonic crime toolkit"
content = "Techniques for crossing the Camelot rules intentionally. None of them makes a bad clash good; they only control how long and where it is heard.\n\n**1. Short hard cut** - The ear takes a few bars to lock onto a tonal center. A short window (4 bars or less, a cut rather than a blend) lets a mismatch pass more easily than a long overlap, but the limits stay tight: past roughly 10-15 cents between two basses it already rubs, and a clash of a semitone or more is a stylistic choice, not a safe zone. Never blend 32 bars on a 2-semitone clash. The +7 move (8A → 3A, +1 semitone) belongs here: cut only.\n\n**2. Bass swap first** - A key clash is worst when two tonal basslines play at once. Keep one bass at a time: cut the low EQ on the incoming track, then swap on the phrase. This is the first fix, before anything else.\n\n**3. Mid-cut** - Chords, pads and leads live roughly between 500 Hz and 2 kHz. Trimming that range on one deck softens a chord or lead clash. Do not expect it to erase the harmony: the bassline is tonal too and stays in the low end, which is why the bass swap comes first.\n\n**4. Filter sweep** - High-pass the incoming track and open it over 8 bars. Hi-hats and cymbals establish the groove first; the harmonic clash only arrives as the filter opens at bar 6-8, once the room has accepted the new groove.\n\n**5. Atonal landing** - Identify a percussive break in the outgoing track (mark it in Rekordbox). Cut the new record in on that break. No harmonic content in the break means no clash to hear, and the ear re-anchors to the new key from beat 1.\n\n**6. Know your room** - In a loud, dense room, masking hides small mismatches a little. That is a reason to be careful, not a reason to be sloppy, and never a reason to push the volume: your hearing and the crowd's are not renewable."

