[[fr.pages]]
title   = "Le remappage du cercle des quintes : pourquoi chaque pas = +7 demi-tons"
content = "La numérotation Camelot suit exactement le **cercle des quintes**. Pourquoi se déplacer d'un pas dans le sens horaire équivaut-il à une quinte juste (+7 demi-tons) ?\n\n**Le Théorème du Générateur pour Z₁₂** : le groupe des 12 hauteurs chromatiques sous addition modulo 12 est cyclique. Un générateur est tout élément premier avec 12. Les valeurs premières avec 12 sont : 1, 5, 7, 11. En termes musicaux :\n- Générateur 1 = gamme chromatique (chaque demi-ton)\n- Générateur 5 = cercle des quartes (Do → Fa → Si♭ → ...)\n- **Générateur 7** = **cercle des quintes** (Do → Sol → Ré → La → Mi → Si → Fa♯ → Do♯ → Sol♯ → Ré♯ → La♯ → Fa → Do)\n- Générateur 11 = cercle des septièmes mineures\n\nLe cercle des quintes est choisi plutôt que les quartes pour sa proximité harmonique intuitive : les tonalités à une quinte de distance partagent 6 des 7 notes. La roue capture ça : les numéros Camelot adjacents partagent toujours 6/7 notes.\n\n**Vérification du wrap** : commence à Do (8B en Camelot). Applique +7 demi-tons 12 fois. Tu visites : Do→Sol→Ré→La→Mi→Si→Fa♯→Do♯→Sol♯→Ré♯→La♯→Fa→Do. Les 12 tonalités visitées exactement une fois. C'est pourquoi 12 pas ferment la boucle."
image         = "lesson-images/camelot-wheel.png"
image_caption = "Chaque pas horaire sur la roue = +7 demi-tons (quinte juste). Après 12 pas, toutes les tonalités visitées."

[[fr.pages]]
title   = "Les angles morts modaux : ce que A/B ne capture pas"
content = "La distinction A/B de Camelot n'encode que deux des sept modes diatoniques :\n- **A** = Éolien (mineur naturel)\n- **B** = Ionien (majeur)\n\nLes cinq modes restants sont tous **forcés dans la case A ou B la plus proche**, perdant leur identité modale :\n\n| Mode | Case forcée | Ce qui est perdu |\n|------|------------|------------------|\n| **Dorien** (mineur + 6e haussée) | A | La 6e haussée crée une 'mauvaise' note en blendant avec un morceau éolien pur à la même case |\n| **Phrygien** (mineur + 2e bémol) | A | La 2e bémol est une bombe de dissonance contre tout voisin ionien/éolien |\n| **Lydien** (majeur + 4e haussée) | B | La 4e haussée clashe avec tout B adjacent qui utilise la 4e naturelle |\n| **Mixolydien** (majeur + 7e bémol) | B | La 7e bémol entre en conflit avec la sensible des voisins ioniens |\n| **Locrien** (tonique diminuée) | A | Rarement assez tonal pour compter, mais la ♭5 est une dissonance active |\n\nConséquence pratique : un **morceau de deep house dorien** (ex. Kerri Chandler's 'Bar A Thym') et un **morceau de techno phrygien** peuvent partager la même case Camelot (8A), mais leur 6e haussée vs 2e bémol vont clasher sur tout moment harmonique soutenu. La vérification à l'oreille gagne toujours sur la roue."

[[fr.pages]]
title   = "La cadence ii-V-I mappée sur la roue"
content = "La **cadence ii-V-I** est la résolution harmonique la plus courante en musique occidentale. En Do majeur :\n- **ii** = Ré mineur (Dm)\n- **V** = Sol majeur (G)\n- **I** = Do majeur (C)\n\nCela résout la tension (ii→V crée de la tension dominante, V→I la libère).\n\nSur la roue Camelot dans le monde du Do majeur (8B = Do, 8A = Am) :\n- **ii** (Dm) = **6A** (deux positions anti-horaires depuis 8A, ou pense à Dm comme le ii de Do)\n- **V** (Sol) = **2B** (position Camelot de Sol majeur)\n- **I** (Do) = **8B**\n\nChemin : **6A → 2B → 8B**.\n\nPour les DJs : teaser un morceau en territoire 6A, puis dropper un morceau à énergie dominante en 2B, puis résoudre en 8B crée un **arc structurel** que les auditeurs ressentent comme une tension-libération satisfaisante. Ça fonctionne entre les morceaux, pas seulement à l'intérieur d'un. Un mouvement de set de 20 minutes construit sur la navigation ii-V-I de la roue est avancé mais entièrement intentionnel. Les DJs comme Magda et Ben Klock font ça sur des arcs de 30-40 minutes dans leurs mixes enregistrés.\n\nNote : la cadence se mappe toujours par rapport à la tonalité de résolution. Le mouvement +7 d'energy boost est essentiellement la **relation dominante** (V→I, N+5 → N)."

[[fr.pages]]
title   = "Crimes harmoniques : Villalobos, Koze, Parrish"
content = "Les trois praticiens les plus étudiés de la transgression délibérée des règles harmoniques :\n\n**Ricardo Villalobos** — Le layering polyrythmique comme couverture harmonique. Il superpose fréquemment 3-4 morceaux dans des tonalités sans rapport pendant 30 mesures et plus. La stratégie : la complexité polyrythmique (patterns 5-contre-4, phrases polymètriques) absorbe la bande passante analytique de l'oreille. Au moment où le cerveau de l'auditeur parse la structure rythmique, il a arrêté d'analyser la structure harmonique. La dissonance siège en arrière-plan comme 'texture', pas comme 'mauvaise note'. Villalobos chasse aussi les **coutures modales** : des moments dans un morceau où un accord emprunté crée une fenêtre d'ambiguïté de 2-4 mesures. Il pose le prochain morceau incompatible exactement dans cette fenêtre.\n\n**DJ Koze** — Le mismatch délibéré comme effet de production. Koze traite le mismatch de tonalité comme une **couleur** dans le mix, pas comme une erreur. Il va pitcher un loop 2-3 demi-tons hors Camelot pour créer un malaise harmonique, puis le résoudre via un **filter sweep** (high-pass sweep qui enlève les harmoniques basses où le clash est le plus audible) ou un **EQ mid-kill** (vider 500 Hz–2 kHz sur une platine tue le contenu harmonique tout en préservant kick et hi-hat). La résolution libère la tension de la même façon qu'un V-vers-I en musique classique.\n\n**Theo Parrish** — L'arc émotionnel au-dessus de la correction harmonique. Les sets de Parrish couvrent disco, gospel, house Chicago brute, jazz et R&B dans des tonalités qui clashent. Sa technique de pont : tenir un morceau jusqu'à ce qu'un **break percussif** (une mesure sans contenu harmonique soutenu — juste kick et clap) fournisse une 'toile blanche'. Couper le morceau suivant sur le temps 1 de ce break. La mémoire harmonique de l'oreille se réinitialise pendant la mesure atonale. C'est l'équivalent DJ d'un cut de scène au cinéma : l'œil (l'oreille) accepte le nouveau contexte quand la transition est au bon moment."

[[fr.pages]]
title   = "La boîte à outils du crime harmonique"
content = "Techniques testées pour franchir les règles Camelot intentionnellement :\n\n**1. Fenêtre de transition courte** — Le JND harmonique de l'oreille se réinitialise environ toutes les 4-8 mesures. Un mismatch allant jusqu'à ~1,5 demi-ton (150 cents) est survivable dans une coupe de 4 mesures. Planifie les transitions incompatibles pour atterrir et sortir en moins de 4 mesures. Ne blende pas 32 mesures sur un clash de 2 demi-tons.\n\n**2. EQ mid-kill** — Avant le clash, coupe les médiums (500 Hz–2 kHz) sur une platine. Les harmoniques des instruments mélodiques vivent dans cette plage ; avec eux supprimés, il ne reste que kick (sub) et hi-hat (présence) — les deux étant largement atonaux. Blende dans cet état mid-tué, puis restaure les médiums une fois que la nouvelle track est établie.\n\n**3. Filter sweep** — Filtre passe-haut la track entrante depuis 2 kHz vers la plage complète sur 8 mesures. Les hautes fréquences d'abord (textures de cymbales, hi-hats) établissent le groove sans contenu harmonique. Le clash harmonique n'arrive qu'à mesure que le filtre s'ouvre à la mesure 6-8, au moment où le public a déjà accepté le nouveau groove.\n\n**4. Atterrissage atonal** — Identifie un break percussif dans le morceau sortant (étiquette-le dans Rekordbox). Coupe le nouveau morceau sur ce break. Pas de contenu harmonique dans le break = pas de clash harmonique à entendre. L'oreille se réancre à la nouvelle tonalité depuis le temps 1 du nouveau morceau.\n\n**5. Fais confiance à l'énergie** — Dans une salle à haute énergie et fort décibels, au-dessus du SPL seuil (110+ dB), le temporary threshold shift et le masking spectral signifient que le public ne peut littéralement pas distinguer les clashes harmoniques aussi bien qu'il le pourrait à 90 dB. Ce n'est pas une excuse pour être négligent — mais ça explique pourquoi un crime harmonique qui serait douloureux dans une pièce silencieuse peut passer inaperçu dans une salle forte."

