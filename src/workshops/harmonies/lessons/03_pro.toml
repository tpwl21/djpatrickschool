description = "La roue Camelot est un cercle des quintes compressé. Cette leçon décortique cette compression : la théorie des groupes derrière pourquoi les quintes génèrent toutes les 12 tonalités, ce que l'encodage A/B perd (les modes), comment la cadence ii-V-I se mappe sur les positions de la roue, et l'analyse technique de comment les top DJs violent les règles exprès."
recap = [
