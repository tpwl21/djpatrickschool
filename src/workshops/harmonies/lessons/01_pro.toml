[fr]
title      = "12-TET, microtonalité & théorie modale"
short_desc = "Les maths du tempérament égal, les quarts de ton, les 7 modes, et pourquoi 90% de la techno est éolien."
description = "Tout ce que dit la leçon 1 MEDIUM suppose le 12-TET. Ici on casse cette hypothèse : le tempérament égal est un compromis, pas une loi de la physique. On couvre les maths qui le définissent, le JND qui explique pourquoi ça 'marche', les traditions qui le rejettent, et le paysage modal qui décrit vraiment la musique dance moderne."
recap = [
  "Le 12-TET divise l'octave en 12 pas mathématiquement égaux de 100 cents. Référence : La = 440 Hz (ISO 16), f = 440 × 2^(n/12).",
  "La juste intonation utilise des ratios entiers purs — une quinte juste vaut 3/2 = 701,96¢, pas 700¢. Ces 2 cents d'écart expliquent pourquoi une basse fretless sonne plus 'chaude' qu'un piano.",
  "Le JND d'une oreille entraînée sur une note isolée est ~3 cents à 2 kHz — le 12-TET est quasi-parfait perceptivement, mais physiquement impur.",
  "Le maqam arabe utilise des quarts de ton (pas de 50¢) ; les ragas indiens utilisent 22 shrutis. La roue Camelot suppose le 12-TET — mixer entre ces systèmes nécessite de vérifier à l'oreille.",
  "Les 7 modes diatoniques (Ionien→Locrien) découlent tous d'une gamme majeure. L'éolien domine la musique dance ; le dorien colore la deep house ; le phrygien/mixolydien apparaissent dans des sous-genres spécifiques."
]

[[fr.pages]]
title   = "12-TET : les maths du tempérament égal"
content = "La grille de 12 notes de la musique occidentale **n'est pas naturelle** — c'est un compromis mathématique délibéré. La norme s'appelle **12-TET** (12-Tone Equal Temperament) : l'octave est divisée en 12 intervalles **géométriquement égaux**.\n\nLa formule : si La4 = 440 Hz (norme internationale, ISO 16-1975), alors chaque autre note vaut :\n\n  **f(n) = 440 × 2^(n/12)**\n\noù n est le nombre de demi-tons par rapport à La4 (positif = aigu, négatif = grave). Exemples : Do4 (Do central) = 440 × 2^(−9/12) ≈ 261,63 Hz. Sol4 = 440 × 2^(2/12) ≈ 392,00 Hz.\n\nChaque demi-ton = la **12e racine de 2** ≈ 1,05946. C'est un nombre irrationnel — il ne peut pas s'exprimer comme une fraction. Cette irrationalité est la source de tout ce qui est intéressant, et de tout ce qui est douloureux, dans l'accordage occidental."
image         = "lesson-images/piano-keyboard-12notes.png"
image_caption = "12-TET : l'octave découpée en 12 pas géométriques égaux."

[[fr.pages]]
title   = "Juste intonation vs tempérament égal"
content = "Avant le 12-TET, les musiciens utilisaient la **juste intonation** : des intervalles définis par des ratios entiers purs qui ne produisent aucun battement acoustique.\n\nComparaisons clés (juste vs tempéré) :\n| Intervalle | Ratio juste | Cents justes | Cents tempérés | Erreur |\n|-----------|------------|-------------|----------------|--------|\n| Quinte juste | 3/2 | 701,96¢ | 700¢ | **−2¢** |\n| Tierce majeure | 5/4 | 386,31¢ | 400¢ | **+13,69¢** |\n| Tierce mineure | 6/5 | 315,64¢ | 300¢ | **−15,64¢** |\n| Quarte juste | 4/3 | 498,04¢ | 500¢ | **+2¢** |\n\nLa tierce majeure juste est 13,69¢ plus basse que le 12-TET — au-dessus du seuil de 10¢ que la plupart des auditeurs détectent sur une note isolée. Pourtant on l'accepte parce que transposer librement n'est possible qu'en 12-TET. **La juste intonation ne se transpose pas** — chaque tonalité nécessiterait de réaccorder tous les cordes.\n\nPour les DJs : une basse fretless ou un chœur gravite naturellement vers la juste intonation. Un piano ou un CDJ à ±0 joue du 12-TET. Ces deux instruments simultanément produisent un battement de +13,69¢ sur chaque tierce majeure — souvent décrit comme 'chaleur analogique' ou 'feeling organique'."

[[fr.pages]]
title   = "Au-delà du 12-TET : quarts de ton et shrutis"
content = "La grille 12-TET est une convention occidentale, pas une loi de la physique. Plusieurs traditions musicales majeures utilisent des subdivisions plus fines :\n\n**Maqam arabe** : utilise **24 tons par octave** — soit des **quarts de ton (50¢ chacun)**. Le maqam *rast* inclut une tierce neutre à ~350¢ (entre la mineure à 300¢ et la majeure à 400¢). Le maqam *bayati* est centré sur une seconde neutre (~150¢). Ces intervalles n'ont pas de case dans le 12-TET.\n\n**Musique classique indienne** : le système des śruti définit **22 intervalles microtonaux inégaux** par octave dérivés de la série harmonique. Le système des *raga* sélectionne des śrutis spécifiques pour définir un mode mélodique/émotionnel.\n\n**Makam turc** : entre 24 et 53 divisions égales selon l'école.\n\nPour les DJs : si tu mixes un morceau turc ou arabe (de plus en plus courant en club global — Acid Arab, Deena Abdelwahed, Dj Boo) dans un morceau électronique occidental, la roue Camelot te donne la meilleure approximation 12-TET, mais la **vérification à l'oreille est obligatoire**. La tierce neutre créera un battement avec toute harmonie occidentale — parfois intentionnel, parfois douloureux."

[[fr.pages]]
title   = "Les 7 modes : plus que majeur et mineur"
content = "Les 7 **modes diatoniques** dérivent tous du même ensemble de 7 notes que Do majeur, mais chacun part d'un degré différent :\n\n| Mode | Note de départ (en Do) | Caractère | Contexte DJ |\n|------|----------------------|-----------|-------------|\n| **Ionien** | Do | Majeur lumineux | Pop, progressive house |\n| **Dorien** | Ré | Mineur + 6e haussée | Deep house, Afrobeat, Stevie Wonder |\n| **Phrygien** | Mi | Mineur sombre, 2de espagnole | Flamenco, metal, certaine techno |\n| **Lydien** | Fa | Majeur + 4e haussée | Rêveur, Vangelis, bandes originales |\n| **Mixolydien** | Sol | Majeur + 7e abaissée | Funk, rock classique, certaine trance |\n| **Éolien** | La | Mineur naturel | **90% de la musique dance** |\n| **Locrien** | Si | Instable, rarement tonal | Metal extrême, avant-garde |\n\nLa roue Camelot distingue seulement A (mineur/Éolien) de B (majeur/Ionien). **Le dorien, phrygien, lydien, mixolydien sont invisibles à Camelot** — ils sont mappés à la case A ou B la plus proche. Si tu mixes un morceau de deep house dorien (case 8A) avec un morceau de techno phrygien (aussi en 8A), Camelot dit 'compatible', mais ton oreille peut entendre un clash sur la 6e haussée vs naturelle."

[[fr.pages]]
title   = "L'échange modal : emprunter entre relatifs"
content = "L'**échange modal** (ou 'mode mixture') est la technique qui consiste à emprunter brièvement des accords à un mode parallèle. En termes DJ : un morceau peut être 'surtout 8A' mais contenir un accord emprunté à 8B pour une phrase de 8 mesures, puis revenir en 8A.\n\nLes emprunts les plus courants dans la musique dance :\n- **Accord bVII** (emprunt mixolydien) : un morceau en Do majeur qui joue un accord de Si♭ majeur. Sonne immédiatement comme du funk ou de la pop moderne.\n- **Accord bVI** (emprunt éolien) : un morceau en Am qui joue un accord de Fa majeur qui résout différemment de l'attendu.\n- **Accord iv** (emprunt dorien) : remplacer un iv mineur dans un contexte majeur — le son 'James Bond'.\n\nPour le mix harmonique : un morceau avec beaucoup d'échange modal **trompera les analyseurs Camelot**. L'analyseur lit le centre tonal prédominant, mais les accords empruntés créent une fenêtre où un blend incompatible devient possible — et parfois magique. Villalobos exploite ça délibérément : il trouve la couture modale dans un morceau et pose le suivant exactement à cet endroit."

