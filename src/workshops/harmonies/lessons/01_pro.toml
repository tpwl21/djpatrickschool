[en]
title      = "12-TET, microtonality & modal theory"
short_desc = "Equal temperament math, quarter tones, the 7 modes, and why 90% of techno is Aeolian."
description = "Everything in lesson 1 MEDIUM assumed 12-TET. Here we break that assumption: equal temperament is a compromise, not a law of physics. We cover the math that defines it, the JND that governs why it 'works', the traditions that reject it, and the modal landscape that actually describes modern dance music."
recap = [
  "12-TET divides the octave into 12 mathematically equal steps of 100 cents. The reference: A = 440 Hz (ISO 16), f = 440 × 2^(n/12).",
  "Just intonation uses pure integer ratios — a perfect fifth is 3/2 = 701.96¢, not 700¢. That 2-cent gap is why a fretless bass sounds 'warmer' than a piano.",
  "The JND for a trained ear on an isolated tone is ~3 cents at 2 kHz — meaning 12-TET is perceptually near-perfect but physically impure.",
  "Arabic maqam uses quarter tones (50¢ steps); Indian ragas use 22 shrutis. The Camelot wheel assumes 12-TET — mixing across these systems requires ear-checking.",
  "The 7 diatonic modes (Ionian→Locrian) all derive from one major scale. Aeolian dominates dance music; Dorian colors deep house; Phrygian/Mixolydian appear in specific sub-genres."
]

[[en.pages]]
title   = "12-TET: the math behind equal temperament"
content = "Western music's 12-note grid is **not natural** — it's a deliberate mathematical compromise. The standard is called **12-TET** (12-Tone Equal Temperament): the octave is divided into 12 **geometrically equal** intervals.\n\nThe formula: if A4 = 440 Hz (the international standard, ISO 16-1975), then every other note is:\n\n  **f(n) = 440 × 2^(n/12)**\n\nwhere n is the number of semitones away from A4 (positive = up, negative = down). Examples: C4 (middle C) = 440 × 2^(−9/12) ≈ 261.63 Hz. G4 = 440 × 2^(2/12) ≈ 392.00 Hz.\n\nEach semitone = the **12th root of 2** ≈ 1.05946. This is irrational — it cannot be expressed as a fraction. That irrationality is the source of everything interesting and everything painful about Western tuning."
image         = "lesson-images/piano-keyboard-12notes.png"
image_caption = "12-TET: the octave split into 12 equal geometric steps."

[[en.pages]]
title   = "Just intonation vs equal temperament"
content = "Before 12-TET, musicians used **just intonation**: intervals defined by pure integer ratios that produce zero acoustic beating.\n\nKey comparisons (just vs tempered):\n| Interval | Just ratio | Just cents | Tempered cents | Error |\n|----------|-----------|------------|----------------|-------|\n| Perfect fifth | 3/2 | 701.96¢ | 700¢ | **−2¢** |\n| Major third | 5/4 | 386.31¢ | 400¢ | **+13.69¢** |\n| Minor third | 6/5 | 315.64¢ | 300¢ | **−15.64¢** |\n| Perfect fourth | 4/3 | 498.04¢ | 500¢ | **+2¢** |\n\nThe just major third is 13.69¢ flat compared to 12-TET — that's above the 10¢ threshold most listeners notice on an isolated tone. Yet we accept it because transposing a piece to another key with a fixed-fret/key instrument is only possible in 12-TET. **Just intonation cannot be transposed freely** — each key would require retuning every string.\n\nFor DJs: a fretless bass player or a choir naturally gravitates toward just intonation. A piano or CDJ at ±0 pitch plays 12-TET. These two playing simultaneously will produce a +13.69¢ 'warm beating' on every major third — this is often described as 'analog warmth' or 'organic feel'."

[[en.pages]]
title   = "Beyond 12-TET: quarter tones and shrutis"
content = "The 12-TET grid is a Western convention, not a law of physics. Several major musical traditions use finer subdivisions:\n\n**Arabic maqam**: uses **24 tones per octave** — i.e., **quarter tones (50¢ each)**. The *rast* maqam includes a neutral third at ~350¢ (between the 300¢ minor and 400¢ major). The *bayati* maqam centers on a neutral second (~150¢). These intervals have no equivalent slot in 12-TET.\n\n**Indian classical**: the śruti system defines **22 unequal microtonal intervals** per octave derived from the harmonic series. The *raga* system selects specific śrutis to define a melodic/emotional mode.\n\n**Turkish makam**: between 24 and 53 equal divisions depending on the school.\n\nFor DJs: if you're blending a Turkish or Arabic track (increasingly common in global club music — Acid Arab, Deena Abdelwahed, Dj Boo) into a Western electronic track, the Camelot wheel gives you the closest 12-TET approximation, but **ear-check is mandatory**. The neutral third will cause a beating with any Western harmony — sometimes intentional, sometimes painful."

[[en.pages]]
title   = "The 7 modes: more than just major and minor"
content = "The 7 **diatonic modes** all derive from the same set of 7 notes as C major, but each starts from a different degree:\n\n| Mode | Starting note (in C) | Character | DJ context |\n|------|---------------------|-----------|------------|\n| **Ionian** | C | Bright major | Pop, progressive house |\n| **Dorian** | D | Minor + raised 6th | Deep house, Afrobeat, Stevie Wonder |\n| **Phrygian** | E | Dark minor, Spanish 2nd | Flamenco, metal, some techno |\n| **Lydian** | F | Major + raised 4th | Dreamy, Vangelis, film scores |\n| **Mixolydian** | G | Major + flat 7th | Funk, classic rock, some trance |\n| **Aeolian** | A | Natural minor | **90% of dance music** |\n| **Locrian** | B | Unstable, rarely tonal | Extreme metal, avant-garde |\n\nThe Camelot wheel only distinguishes A (minor/Aeolian) from B (major/Ionian). **Dorian, Phrygian, Lydian, Mixolydian are invisible to Camelot** — they map to the nearest A or B slot. If you're mixing a Dorian deep house track (8A slot) with a Phrygian techno track (also landing near 8A), Camelot says 'compatible', but your ear may hear a clash on the raised-6th vs natural-6th."

[[en.pages]]
title   = "Modal interchange: borrowing between relatives"
content = "**Modal interchange** (or 'mode mixture') is the technique of briefly borrowing chords from a parallel mode. In DJ terms: a track can be 'mostly 8A' but contain a borrowed chord from 8B for one 8-bar phrase, then return to 8A.\n\nThe most common borrows in dance music:\n- **bVII chord** (Mixolydian borrow): a C major track playing a B♭ major chord. Immediately sounds like funk or modern pop.\n- **bVI chord** (Aeolian borrow): an Am track playing an F major chord that resolves differently than expected.\n- **iv chord** (Dorian borrow): replacing a minor iv with a minor iv in a major context — the 'James Bond' sound.\n\nFor harmonic mixing: a track with heavy modal interchange will **fool Camelot analyzers**. The analyzer reads the predominant tonal center, but the borrowed chords create a window where an incompatible blend becomes possible — and sometimes magical. Villalobos exploits this deliberately: he finds the modal seam in a track and drops the next record exactly there."

