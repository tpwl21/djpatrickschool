[fr]
title      = "Les notes sont des couleurs"
short_desc = "Pas de solfège. On utilise des couleurs, des sensations et ton oreille."
description = "Tu n'as pas besoin de lire la musique pour comprendre l'harmonie. Dans cette leçon, on utilise des analogies couleurs et ton oreille pour expliquer ce qu'est une note, un accord et une tonalité — avant même de regarder un clavier."
recap = [
  "Une note = une couleur. Un accord = 3 couleurs mélangées. Une tonalité = une famille de 7 couleurs qui s'harmonisent.",
  "Majeur sonne lumineux et ouvert. Mineur sonne plus sombre et intense. Une seule note de différence.",
  "Quand deux tracks partagent la même tonalité, leurs notes appartiennent à la même famille de couleurs — elles se mélangent naturellement.",
  "Ton oreille le sait déjà. Tu as déjà ressenti une 'mauvaise' note dans un mix sans savoir pourquoi.",
  "Camelot (leçon 3) n'est que des étiquettes sur ces familles de couleurs pour les trouver vite."
]

[[fr.pages]]
title   = "Les notes sont des couleurs"
content = "Imagine la musique comme une **palette de 12 couleurs** — seulement 12. Tous les morceaux que tu as jamais entendus sont peints avec certaines de ces 12. Une **note** = une couleur. Un **accord** = 3 couleurs mélangées. Une **tonalité** = une famille de 7 couleurs que le compositeur a choisie comme palette pour tout le morceau.\n\nQuand deux tracks sont **dans la même tonalité**, elles utilisent la même palette de 7 couleurs. Mélange-les et les couleurs matchent — la musique se blend. Joue deux tracks avec des **palettes qui clashent**, et tu le ressentiras : quelque chose sonne 'faux', tendu, comme deux couleurs qui se battent.\n\nTu connais déjà ce ressenti depuis que tu écoutes de la musique. Aujourd'hui on lui donne juste un nom."
image         = "lesson-images/piano-keyboard-12notes.png"
image_caption = "12 notes par octave — comme 12 couleurs sur une palette."

[[fr.pages]]
title   = "Majeur = lumineux. Mineur = sombre."
content = "Chaque tonalité a une **personnalité**. Deux grandes familles :\n\n**Tonalités majeures** = chaud, ouvert, énergique. Pense à une fête sur la plage au coucher du soleil, un drop Daft Punk, un gospel choir. Équivalent couleur : jaune, orange, or.\n\n**Tonalités mineures** = profond, intense, mystérieux. Pense à un sous-sol berlinois à 4h du mat, une salle de deep techno, un film noir. Équivalent couleur : bleu profond, violet, noir.\n\nEcoute n'importe quel morceau de ta bibliothèque maintenant. Est-ce qu'il sonne lumineux ou sombre ? C'est la tonalité qui te parle. **La plupart de la musique dance est en mineur** — house, techno, drum & bass, dubstep. Ta bibliothèque est probablement surtout 'palette sombre'."

[[fr.pages]]
title   = "La famille — 7 couleurs qui vont ensemble"
content = "Une **tonalité** = une famille choisie de **7 notes** sur les 12 disponibles. Les 5 autres sont 'hors palette' pour ce morceau — elles ne sont pas interdites, mais elles sonnent comme une visiteuse d'une autre famille.\n\nDes tracks dans la **même tonalité** partagent les 7 membres de la famille. Elles se mélangent magnifiquement.\n\nDes tracks en **tonalités relatives** partagent les 7 membres mais avec un 'chef de famille' différent — comme des frères et sœurs dans la même maison avec des personnalités différentes. Elles se mélangent aussi très bien.\n\nDes tracks à **un pas** partagent 6 des 7 membres. Elles se mélangent en douceur avec juste une petite touche de nouveauté.\n\nCette idée de famille est toute la fondation du mix harmonique. Camelot (leçon 3) est juste une carte qui montre quelles familles vivent côte à côte."

[[fr.pages]]
title   = "Essaie — fais confiance à ton oreille"
content = "Un petit exercice d'écoute que tu peux faire avec tes propres tracks :\n\n1. Prends un morceau que tu connais bien. Lance-le.\n2. Trouve un autre morceau qui a **la même ambiance** — même luminosité ou même obscurité.\n3. Essaie de les blender. S'ils se mélangent bien, ils sont probablement dans la même tonalité ou une tonalité voisine.\n4. Maintenant trouve un morceau à l'**ambiance opposée** — bascule du sombre au lumineux, ou inversement.\n5. Essaie de les blender. Tu entendras le 'clash de couleurs'.\n\nPas besoin d'appli pour l'instant. Ton oreille est le premier outil. Camelot et les applis de détection de tonalité viennent en deuxième — elles confirment ce que ton oreille a déjà ressenti."

[[fr.quiz]]
question = "Qu'est-ce qu'une 'tonalité' en musique ?"
answers  = ["Un bouton sur un clavier", "Une famille de 7 notes qui vont ensemble", "Le tempo d'un morceau"]
correct  = 1

[[fr.quiz]]
question = "Dans la musique dance, la plupart des morceaux sont en..."
answers  = ["Tonalités majeures (lumineux)", "Tonalités mineures (sombres)", "Exactement moitié-moitié"]
correct  = 1

[[fr.quiz]]
question = "Si deux tracks partagent la même tonalité, leurs notes..."
answers  = ["Sont complètement différentes", "Appartiennent à la même famille de 7 notes", "Ont le même BPM"]
correct  = 1

