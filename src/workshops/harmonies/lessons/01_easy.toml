[en]
title      = "Notes are colors"
short_desc = "No sheet music. We use colors, feelings, and your ear to get solfège."
description = "You don't need to read music to understand harmony. In this lesson we use color analogies and your ear to explain what a note, a chord, and a key actually are — before we even look at a keyboard."
recap = [
  "A note is a single color. A chord is 3 colors mixed. A key is a family of 7 colors that go well together.",
  "Major sounds bright and open. Minor sounds darker and more intense. One note's difference.",
  "When two tracks share the same key, their notes belong to the same color family — they blend naturally.",
  "Your ear already knows this. You've felt a 'wrong' note in a mix even without knowing why.",
  "Camelot (lesson 3) is just labels on those color families so you can find them fast."
]

[[en.pages]]
title   = "Notes are colors"
content = "Imagine music as a **palette of 12 colors** — only 12. Every song you've ever heard is painted using some of these 12. A **note** is a single color. A **chord** is 3 colors blended together. A **key** is a family of 7 colors that the composer picked as their palette for the whole track.\n\nWhen two tracks are **in the same key**, they use the same 7-color palette. Mix them together and the colors match — the music blends. Play two tracks with **different palettes** that clash, and you'll feel it: something sounds 'off', tense, like two colors fighting each other.\n\nYou already know this feeling from listening to music your whole life. Today we just give it a name."
image         = "lesson-images/piano-keyboard-12notes.png"
image_caption = "12 notes per octave — like 12 colors on a palette."

[[en.pages]]
title   = "Major = bright. Minor = dark."
content = "Every key has a **personality**. There are two main families:\n\n**Major keys** = warm, open, energetic. Think of a sunset beach party, a Daft Punk drop, a gospel choir. The color equivalent: yellow, orange, gold.\n\n**Minor keys** = deep, intense, mysterious. Think of a Berlin basement at 4am, a deep techno room, a film noir. The color equivalent: deep blue, purple, black.\n\nListen to any track in your library right now. Does it feel bright or dark? That's the key talking to you. **Most dance music is in minor** — house, techno, drum & bass, dubstep. Your library is probably mostly 'dark palette'."

[[en.pages]]
title   = "The family — 7 colors that go together"
content = "A **key** is a chosen family of **7 notes** out of the 12 available. The other 5 are 'outside the palette' for that song — they're not banned, but they feel like a visitor from another family.\n\nTracks in the **same key** share all 7 family members. They blend beautifully.\n\nTracks in **relative keys** share all 7 members but with a different 'head of family' — like siblings in the same house with different personalities. They also blend very well.\n\nTracks a **step away** share 6 of the 7 members. They blend smoothly with just a tiny bit of new flavor.\n\nThis family idea is the entire foundation of harmonic mixing. Camelot (lesson 3) is just a map that shows you which families live next to each other."

[[en.pages]]
title   = "Try it — trust your ear"
content = "Here's a quick listening exercise you can do with your own tracks:\n\n1. Pick a track you know well. Let it play.\n2. Find another track that feels **the same mood** — same brightness or darkness.\n3. Try blending them. If they blend well, they're probably in the same or neighboring key.\n4. Now find a track that feels **opposite** in mood — flip from dark to bright, or vice versa.\n5. Try blending those. You'll hear the 'color clash'.\n\nYou don't need an app yet. Your ear is the first tool. Camelot and key detection apps come second — they confirm what your ear already felt."

[[en.quiz]]
question = "What is a 'key' in music?"
answers  = ["A button on a keyboard", "A family of 7 notes that belong together", "The tempo of a track"]
correct  = 1

[[en.quiz]]
question = "In dance music, most tracks are in..."
answers  = ["Major keys (bright)", "Minor keys (dark)", "Exactly half and half"]
correct  = 1

[[en.quiz]]
question = "If two tracks share the same key, their notes..."
answers  = ["Are completely different", "Belong to the same 7-note family", "Have the same BPM"]
correct  = 1

