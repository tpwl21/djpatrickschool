[fr]
title      = "Maths du pitch, JND, WSOLA & phase vocoder"
short_desc = "La formule complète, les seuils de perception à 5 cents, et pourquoi les artefacts WSOLA sonnent différemment des artefacts vocoder."
description = "Cette leçon va sous le capot de la relation pitch-tempo. Tu vas dériver la formule à partir des premiers principes (perception logarithmique du pitch), comprendre où la perception humaine lâche (JND sous masking), et disséquer les deux algorithmes de time-stretch dominants — WSOLA et le phase vocoder — assez pour reconnaître leurs modes d'échec à l'oreille."
recap = [
  "La perception du pitch est logarithmique (base 2). Demi-tons = 12 × log₂(taux). Taux = 2^(demi-tons/12). Chaque demi-ton = la 12e racine de 2.",
  "JND sur notes isolées : 5-6 cents (auditeur moyen), 3 cents à 2 kHz, 2 cents (musicien entraîné). En mix dense, le masking spectral monte le seuil à 15-25 cents.",
  "Deux basses commencent à frotter dès 10-15 cents environ. À 50 cents (½ demi-ton) le clash est net ; 100 cents (1 demi-ton) est évident même pour un non-musicien.",
  "WSOLA (domaine temporel) : décale des frames recouvrantes de ±10 ms pour maximiser la corrélation croisée normalisée. Artefacts : fragments doublés ou sautés (bégaiement) et rugosité sur les notes tenues.",
  "Phase vocoder (domaine fréquentiel) : STFT → manipulation de phase → ISTFT. Artefacts : phasiness (sonnerie métallique due à l'incohérence de phase), étalement des transitoires, formant shift sur les voix."
]

[[fr.pages]]
title   = "Dériver la formule à partir des premiers principes"
content = "Pourquoi la formule de décalage de pitch est-elle logarithmique ?\n\n**La perception du pitch est logarithmique.** L'oreille encode la fréquence comme un ratio, pas une différence. Doubler la fréquence = une octave, quelle que soit la fréquence de départ : 110→220 Hz est la même 'distance' que 440→880 Hz. La cochlée de l'oreille est essentiellement un analyseur de fréquence à espacement logarithmique — les basses fréquences occupent plus d'espace sur la membrane basilaire que les hautes.\n\nCela nous donne : l'unité naturelle de changement de pitch est l'**octave** = facteur 2. On veut 12 pas égaux par octave. 'Égaux' signifie géométriquement égaux (même ratio), donc :\n\n  **un demi-ton = 2^(1/12) ≈ 1,05946**\n\nPour n demi-tons : **taux = 2^(n/12)**, donc **n = 12 × log₂(taux)**.\n\nOù `taux = BPM_nouveau / BPM_natif` pour le cas fader-pitch→demi-tons.\n\nPour le pitch en pourcentage (affiché sur les faders CDJ) : `n = 12 × log₂(1 + pitch_pourcent/100)`. L'approximation utile : `log₂(1,06) ≈ 0,0841`, donc +6 % ≈ **+1,009 demi-ton**. Assez proche d'un demi-ton — c'est le sens harmonique de la plage de travail du Technics SL-1200."

[[fr.pages]]
title   = "JND : là où l'oreille abandonne"
content = "Le **Just-Noticeable Difference (JND)** en hauteur varie selon le contexte :\n\n| Contexte | JND | Explication |\n|---------|-----|-------------|\n| Ton pur isolé, 2 kHz | **~3 cents** | Pic de sensibilité cochléaire. Les musiciens entraînés détectent l'écart juste-tempéré de la quinte (702 − 700 = 2¢). |\n| Ton isolé (auditeur moyen) | **5-6 cents** | Mesure psychoacoustique standard (Zwicker & Fastl, 1990). |\n| Ton complexe (instrument, voix) | **8-10 cents** | Les harmoniques et le timbre ajoutent de l'incertitude. |\n| Mix dense (beat + basse + deux tracks) | **15-25 cents** | **Masking spectral** : canaux fréquentiels cochléaires saturés ; signaux chevauchants se masquent mutuellement. |\n| Transition courte (≤ 8 mesures) | **10-15 cents frottent déjà entre deux basses** | L'oreille n'a pas eu le temps de calibrer un centre tonal, donc une coupe courte pardonne un peu plus qu'un blend long. Pas 50 cents, par contre : c'est un clash net même en 4 mesures. |\n| Blend long (2+ minutes) | **25-30 cents** | L'oreille calibre vers le pitch dominant dans le temps ; mismatches inaudibles à la mesure 1 deviennent évidents à la mesure 64. |\n\nL'implication : une dérive de 3 % (~50 cents) est déjà un clash net, même dans une courte transition. Seule une correction de moins d'environ 1 % (à peu près 15 cents) peut passer, et même celle-là se révèle sur un blend de 2 minutes — l'intégration temporelle de l'oreille la rattrape."

[[fr.pages]]
title   = "WSOLA : time-stretching dans le domaine temporel"
content = "**WSOLA** (Waveform-Similarity Overlap-Add) a été décrit par Verhelst & Roelands en 1993. Il opère entièrement dans le **domaine temporel** — pas de FFT requise.\n\n**Algorithme (simplifié) :**\n1. Découpe le signal en **frames d'analyse recouvrantes** (~30 ms, ~50 % de chevauchement).\n2. Pour chaque frame, cherche dans ±10 ms la frame qui **maximise la corrélation croisée normalisée** avec la frame de sortie précédente — trouve la jointure qui ressemble le plus à ce que tu viens de sortir.\n3. **Overlap-add** la frame matchée à la nouvelle position de lecture (étirée/compressée).\n\n**Artefacts :**\n- **Fragments doublés ou sautés (bégaiement)** : si la recherche du meilleur raccord choisit une jointure jusqu'à 10 ms de sa position nominale, un événement rythmique peut apparaître deux fois (original + écho, un 'flam') ou disparaître. Audible sur les transitoires serrés et sur un matériau très étiré.\n- **Rugosité sur les notes tenues** : accords et pads peuvent avoir un léger tremblement là où les jointures se répètent. L'étalement des transitoires, lui, est la signature typique du phase vocoder, pas de WSOLA.\n\nL'avantage de WSOLA : **CPU très faible**, latence quasi-nulle, fonctionne bien sur le **contenu percussif / peu harmonique**. Ce projet embarque son propre WSOLA AudioWorklet dans `public/audio-worklets/wsola-processor.js`."

[[fr.pages]]
title   = "Phase vocoder : time-stretching dans le domaine fréquentiel"
content = "Le **phase vocoder** (Flanagan 1966, modernisé par Laroche & Dolson 1999) opère dans le **domaine fréquentiel** via la Transformée de Fourier à Court Terme.\n\n**Algorithme (simplifié) :**\n1. **STFT d'analyse** : calcule la FFT de courtes frames (ex : 2048 éch. à 44,1 kHz ≈ 46 ms), ~75 % de chevauchement.\n2. **Manipulation de phase** : pour chaque bin, fréquence instantanée = fréquence nominale + différence de phase / hop. Scale le hop pour obtenir le ratio de time-stretch voulu.\n3. **Cohérence de phase** (Laroche-Dolson 1999) : identifier les pics spectraux, faire tourner leur phase de façon cohérente, entraîner les bins voisins — élimine la 'phasiness' des vocoders naïfs.\n4. **ISTFT de synthèse** : FFT inverse et overlap-add.\n\n**Artefacts :**\n- **Phasiness / sonnerie métallique** : quand les phases perdent leur cohérence, les partiels interfèrent aléatoirement — ton creux, 'sous l'eau' ou métallique. Classique sur les accords soutenus et les pads.\n- **Étalement des transitoires** : la fenêtre STFT étale les transitoires. Pire que WSOLA sur les percussives sans détection de transitoires.\n- **Formant shift** : si pitch et time-shift sont combinés, les formants vocaux décalent avec le pitch sauf s'ils sont préservés. Vers le haut = Chipmunk, vers le bas = Dark Vador. Atténué par les variantes préservant les formants (Rubber Band R3, Ableton Complex Pro)."

[[fr.pages]]
title   = "Décision pratique : WSOLA vs phase vocoder pour le DJ"
content = "Comparaison dans le contexte du DJ :\n\n| Critère | WSOLA | Phase Vocoder |\n|---------|-------|---------------|\n| Meilleur pour | Contenu percussif, rythmique | Contenu tonal, harmonique |\n| Pire pour | Accords soutenus, pads | Kicks/snares avec transitoires serrés |\n| CPU | Faible | Moyen-Élevé |\n| Latence | Quasi-nulle | ~1 fenêtre STFT (~46 ms) |\n| Type d'artefact | Fragments doublés/sautés (bégaiement), rugosité sur les notes tenues | Phasiness, étalement des transitoires, formant shift sur les voix |\n| Exemple | Mode 'ECO' de Traktor | CDJ Pioneer, Ableton Warp 'Complex' |\n\nEn pratique, beaucoup de moteurs modernes mélangent les approches (détection des transitoires, un traitement pour les frames percussives, un autre pour les frames tonales) ; la recette exacte d'un CDJ ou d'un logiciel donné n'est pas publique, donc juge à l'oreille.\n\n**La leçon** : au-delà de ±8-10 %, tu *entendras* des artefacts quel que soit l'algorithme. Dans ±6 %, Master Tempo est quasi-transparent sur la plupart des contenus. Fais confiance à tes oreilles — les mixes denses avec plusieurs tracks simultanés cumulent les artefacts."

