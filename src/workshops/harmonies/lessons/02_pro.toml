[en]
title      = "Pitch math, JND, WSOLA & phase vocoder"
short_desc = "The full formula, 5-cent perception thresholds, and why WSOLA artifacts sound different from vocoder artifacts."
description = "This lesson goes under the hood of the pitch-tempo relationship. You'll derive the formula from first principles (logarithmic pitch perception), understand where human perception breaks down (JND under masking), and dissect the two dominant time-stretch algorithms — WSOLA and the phase vocoder — enough to recognize their failure modes by ear."
recap = [
  "Pitch perception is logarithmic (base 2). Semitones = 12 × log₂(rate). Rate = 2^(semitones/12). Each semitone = the 12th root of 2.",
  "JND on isolated tones: 5-6 cents (average listener), 3 cents at 2 kHz, 2 cents (trained musician). In a dense mix, spectral masking raises the threshold to 15-25 cents.",
  "Two basses start to rub from about 10-15 cents. At 50 cents (½ semitone) the clash is clear; 100 cents (1 semitone) is obvious even to non-musicians.",
  "WSOLA (time domain): shifts overlapping frames by ±10 ms to maximize normalized cross-correlation. Artifacts: doubled or skipped fragments (stutter) and roughness on sustained notes.",
  "Phase vocoder (frequency domain): STFT → phase manipulation → ISTFT. Artifacts: phasiness (metallic ringing from phase incoherence), transient smearing, formant shift on vocals."
]

[[en.pages]]
title   = "Deriving the formula from first principles"
content = "Why is the pitch-shift formula logarithmic?\n\n**Pitch perception is logarithmic.** The ear encodes frequency as a ratio, not a difference. Doubling frequency = one octave, regardless of the starting point: 110→220 Hz is the same 'distance' as 440→880 Hz. The ear's cochlea is essentially a frequency analyzer with logarithmic spacing — low frequencies get more 'space' on the basilar membrane than high ones.\n\nThis gives us: the natural unit of pitch change is the **octave** = factor of 2. We want 12 equal steps per octave. 'Equal' here means geometrically equal (same ratio), so:\n\n  **one semitone = 2^(1/12) ≈ 1.05946**\n\nFor n semitones: **rate = 2^(n/12)**, so **n = 12 × log₂(rate)**.\n\nWhere `rate = new_BPM / native_BPM` for the pitch-fader-to-semitone case.\n\nFor percent pitch (as shown on CDJ faders): `n = 12 × log₂(1 + pitch_percent/100)`. The useful approximation: `log₂(1.06) ≈ 0.0841`, so +6 % ≈ **+1.009 semitones**. Close enough to call it 1 semitone — that's the harmonic meaning of the Technics SL-1200 working range."

[[en.pages]]
title   = "JND: where the ear gives up"
content = "The **Just-Noticeable Difference (JND)** for pitch varies by context:\n\n| Context | JND | Explanation |\n|---------|-----|-------------|\n| Isolated pure tone, 2 kHz | **~3 cents** | Peak cochlear sensitivity. Trained musicians detect the just-tempered fifth difference here (702 − 700 = 2¢). |\n| Isolated tone (average listener) | **5-6 cents** | Standard psychoacoustic measurement (Zwicker & Fastl, 1990). |\n| Complex tone (instrument, voice) | **8-10 cents** | Harmonics and timbre add uncertainty. |\n| Dense mix (beat + bass + two tracks) | **15-25 cents** | **Spectral masking**: cochlear frequency channels are saturated; overlapping signals mask each other. |\n| Short transition (≤ 8 bars) | **10-15 cents already rub between two basses** | The ear hasn't had time to calibrate a tonal center, so a short cut forgives slightly more than a long blend. Not 50 cents, though: that is a clear clash even in 4 bars. |\n| Long blend (2+ minutes) | **25-30 cents** | The ear calibrates to the dominant pitch over time; mismatches audible at bar 1 become obvious at bar 64. |\n\nThe implication: a 3 % pitch drift (~50 cents) is already a clear clash, even in a short transition. Only a correction under about 1 % (roughly 15 cents) can pass, and even that reveals itself over a 2-minute blend — the ear's temporal integration catches it."

[[en.pages]]
title   = "WSOLA: time-stretching in the time domain"
content = "**WSOLA** (Waveform-Similarity Overlap-Add) was described by Verhelst & Roelands in 1993. It operates entirely in the **time domain** — no FFT required.\n\n**Algorithm (simplified):**\n1. Chop the input into short **overlapping analysis frames** (~30 ms, ~50 % overlap).\n2. For each frame, search a window of ±10 ms for the frame that **maximizes normalized cross-correlation** with the previous output frame — find the splice that looks most similar to what you just output.\n3. **Overlap-add** the matched frame at the new (stretched/compressed) playback position.\n\n**Artifacts:**\n- **Doubled or skipped fragments (stutter)**: if the best-match search picks a splice that is up to 10 ms off its nominal position, a rhythmic event can appear twice (original + echo, a 'flam') or be dropped. Audible on tight transients and on strongly stretched material.\n- **Roughness on sustained notes**: chords and pads can get a slight warble where the splices repeat. Transient smearing, by contrast, is the typical signature of the phase vocoder, not of WSOLA.\n\nWSOLA's advantage: very **low CPU**, near-zero latency, works well on **percussive / low-harmonic content**. This project ships its own WSOLA AudioWorklet at `public/audio-worklets/wsola-processor.js`."

[[en.pages]]
title   = "Phase vocoder: time-stretching in the frequency domain"
content = "The **phase vocoder** (Flanagan 1966, modernized by Laroche & Dolson 1999) operates in the **frequency domain** via the Short-Time Fourier Transform.\n\n**Algorithm (simplified):**\n1. **Analysis STFT**: compute FFT of short frames (e.g., 2048 samples at 44.1 kHz ≈ 46 ms), ~75 % overlap.\n2. **Phase manipulation**: for each bin, compute instantaneous frequency = nominal bin frequency + phase difference / frame hop. Scale hop to achieve time-stretch ratio.\n3. **Phase coherence** (Laroche-Dolson 1999): identify spectral peaks, rotate their phase coherently, drag neighboring bins — eliminates naïve-vocoder 'phasiness'.\n4. **Synthesis ISTFT**: inverse FFT and overlap-add.\n\n**Artifacts:**\n- **Phasiness / metallic ringing**: when bin phases lose coherence, partials interfere randomly — hollow, 'underwater' or metallic tone. Classic on sustained chords and pads.\n- **Transient smearing**: the STFT window spreads transients. Worse than WSOLA on percussives without transient detection.\n- **Formant shift**: if pitch and time-shift are combined, vocal formants shift with pitch unless explicitly preserved. Upward = Chipmunk, downward = Darth Vader. Mitigated by formant-preserving variants (Rubber Band R3, Ableton Complex Pro)."

[[en.pages]]
title   = "Practical decision: WSOLA vs phase vocoder for DJs"
content = "A comparison for the working DJ context:\n\n| Criterion | WSOLA | Phase Vocoder |\n|-----------|-------|---------------|\n| Best for | Percussive, rhythmic content | Tonal, harmonic content |\n| Worst for | Sustained chords, pads | Kick/snare with tight transients |\n| CPU | Low | Medium-High |\n| Latency | Near-zero | ~1 STFT window (~46 ms) |\n| Artifact type | Doubled/skipped fragments (stutter), roughness on sustained notes | Phasiness, transient smearing, formant shift on vocals |\n| Example | Traktor 'ECO' mode | Pioneer CDJ hardware, Ableton Warp 'Complex' |\n\nIn practice, many modern engines mix approaches (transient detection, one treatment for percussive frames, another for tonal ones); the exact recipe inside a given CDJ or software is not public, so judge by ear.\n\n**Takeaway**: beyond ±8-10 %, you *will* hear artifacts regardless of algorithm. Within ±6 %, Master Tempo is near-transparent on most content. Trust your ears over the spec sheet — dense mixes with multiple simultaneous tracks compound artifacts."

