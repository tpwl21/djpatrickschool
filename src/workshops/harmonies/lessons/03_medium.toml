[[fr.pages]]
title   = "Le tableau complet Camelot ↔ notation classique"
content = """
Mémoriser le mapping complet te rend plus rapide. Commence par le voisinage de 8A (La mineur / Do majeur) — la zone la plus courante en musique dance :

| Camelot | Clé mineure | Clé majeure |
|---------|-------------|-------------|
| 1A / 1B | La♭m | Si |
| 2A / 2B | Mi♭m | Fa♯ |
| 3A / 3B | Si♭m | Ré♭ |
| 4A / 4B | Fam | La♭ |
| 5A / 5B | Dom | Mi♭ |
| 6A / 6B | Solm | Si♭ |
| 7A / 7B | Rém | Fa |
| **8A / 8B** | **Lam** | **Do** |
| 9A / 9B | Mim | Sol |
| 10A / 10B | Sim | Ré |
| 11A / 11B | Fa♯m | La |
| 12A / 12B | Do♯m | Mi |

**Pourquoi la roue fonctionne** : chaque pas horaire ajoute un dièse (ou enlève un bémol) — exactement le cercle des quintes. Les numéros Camelot adjacents partagent toujours 6 des 7 notes. Cette note différente, c'est le "changement de couleur" que tu entends dans une transition par pas.

**Rappel du wrap** : 12 revient à 1. 12A et 1A sont voisins.
"""
image         = "lesson-images/camelot-wheel.png"
image_caption = "La roue Camelot — chaque pas horaire = +7 demi-tons (une quinte juste). 8A = Am est la zone la plus courante en musique dance."

[[fr.pages]]
title   = "Les 5 mouvements — y compris l'energy boost"
content = """
Depuis n'importe quelle clé NX, **5 clés** sont harmoniquement sûres :

| Mouvement | Depuis 8A | Notes partagées | Usage |
|-----------|---------|----------------|-------|
| **Rester** | 8A → 8A | 7/7 | Ultra-sûr, même ambiance |
| **Flip de lettre** | 8A → 8B | 7/7 (tonique diff.) | Sombre vers lumineux, mêmes notes |
| **Pas horaire** | 8A → 9A | 6/7 | Mouvement doux, une nouvelle note |
| **Pas anti-horaire** | 8A → 7A | 6/7 | Même chose, autre direction |
| **Energy boost** | 8A → **3A** | 6/7 | Injecter de l'énergie en peak time |

**L'energy boost** (+7 positions dans le sens horaire, même lettre) : c'est l'arme secrète du DJ pour lifter la salle. Depuis 8A, ça fait 8+7=15, qui wrap à 15-12=**3A** (Si♭m). Le boost partage 6 des 7 notes — assez proche pour blender, assez différent pour sentir comme un lift.

**Wrap le compte** : toujours compter modulo 12. 6A + 7 = 13 → 13-12 = **1A**. 11A + 7 = 18 → 18-12 = **6A**.

Au-delà de ces 5, tu entres dans le territoire de la tension harmonique — pas interdit, mais intentionnel.
"""

[[fr.pages]]
title   = "Tension harmonique : l'arc ii-V-I entre morceaux"
content = """
La **cadence ii-V-I** est la résolution harmonique la plus satisfaisante de la musique occidentale : tension (ii → V) suivie de libération (V → I). Tu peux construire ça entre des morceaux, pas seulement à l'intérieur d'un.

En monde Do majeur (8B = Do majeur, 8A = La mineur) :
- **ii** = Ré mineur = **7A** (Dm est l'accord ii de Do majeur)
- **V** = Sol majeur = **9B** (Sol est le dominant de Do)
- **I** = Do majeur = **8B**

**Chemin sur la roue : 7A → 9B → 8B**

Comment l'utiliser dans un set :
1. Ouvre avec un morceau en **7A** (territoire Dm — feeling légèrement irresolu)
2. Droppe un morceau à haute énergie en **9B** (Sol majeur — le dominant, tension pleine)
3. Résous avec un anthem de peak en **8B** (Do majeur — libération, arrivée)

La foule ressent cet arc sans connaître la théorie. La résolution de 9B vers 8B atterrit avec un *clic* satisfaisant qu'un drop en même clé n'atteint jamais tout à fait.

**Le mouvement +7 est la relation dominante** : NX → (N+7)X est toujours V→I ou i→iv selon le contexte. C'est pour ça qu'il ressemble à une injection d'énergie — tu atterris sur le dominant du morceau suivant.
"""

[[fr.pages]]
title   = "Les angles morts modaux : là où la roue ment"
content = """
La distinction A/B de Camelot n'encode que deux des sept modes :
- **A** = Éolien (mineur naturel)
- **B** = Ionien (majeur)

Les cinq autres modes sont tous **compressés dans la case A ou B la plus proche** :

| Mode | Case Camelot | Ce qui est caché |
|------|-------------|-----------------|
| **Dorien** (mineur + 6e haussée) | Anneau A | La 6e haussée peut clasher avec la 6e naturelle éolienne |
| **Phrygien** (mineur + 2e bémol) | Anneau A | La 2e bémol est une bombe de dissonance contre les voisins ioniens |
| **Lydien** (majeur + 4e haussée) | Anneau B | La 4e haussée entre en conflit avec la 4e naturelle des cases B adjacentes |
| **Mixolydien** (majeur + 7e bémol) | Anneau B | La 7e bémol entre en conflit avec la sensible des voisins ioniens |
| **Locrien** (diminué) | Anneau A | Rarement assez tonal pour compter en pratique |

**Conséquence pratique** : un morceau de deep house dorien et un morceau de techno éolien peuvent partager 8A — mais leur 6e haussée vs naturelle clashera sur tout moment mélodique soutenu. La roue dit compatible ; ton oreille peut dire le contraire.

**Le fix** : l'oreille gagne toujours. Si deux tracks partagent une case Camelot et que quelque chose sonne faux dans le blend, suspecte un mismatch modal. Une brève coupe EQ des médiums (500 Hz–2 kHz) sur une platine pendant le blend peut masquer le clash harmonique le temps que tu évalues.
"""

