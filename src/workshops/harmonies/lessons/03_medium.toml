[fr]
title      = "La roue Camelot en profondeur : 4 mouvements sûrs, cercle des quintes et tension harmonique"
short_desc = "Le mapping complet, le +7 en coupe de tension (jamais en blend), l'arc ii-V-I sur la roue, et les angles morts modaux."
description = "EASY t'a donné les 3 mouvements de base. MEDIUM ajoute le tableau complet Camelot ↔ notation classique, le mouvement +7 (un effet de tension risqué, uniquement en coupe), une introduction à pourquoi la roue encode le cercle des quintes, comment utiliser la tension harmonique délibérément (l'arc ii-V-I), et où l'encodage A/B ment sur les modes. Prêt à mixer avec intention."
recap = [
  "4 mouvements sûrs depuis NX : même clé, flip de lettre (relatif), +1 pas, -1 pas. Un cinquième existe, le +7, mais c'est un effet de coupe risqué, pas un mouvement sûr.",
  "Chaque pas horaire Camelot = +7 demi-tons (une quinte juste). Les clés adjacentes partagent 6 des 7 notes. +7 sur la roue ne fait que +1 demi-ton (8A Lam → 3A Si♭m) : 2 notes en commun seulement, donc une coupe nette au mieux, jamais un blend long.",
  "Table complète : 8A = Am, 8B = Do, 9A = Em, 9B = Sol, 7A = Dm, 7B = Fa — connais ton voisinage.",
  "L'arc ii-V-I sur la roue (7A → 9B → 8B en monde Do majeur) crée une vraie tension et libération entre morceaux. Règle : depuis I = NB, ii = (N-1)A et V = (N+1)B.",
  "Camelot ne connaît que l'éolien (A) et l'ionien (B). Les morceaux doriens et phrygiens atterrissent en anneau A mais peuvent clasher entre eux. L'oreille gagne toujours."
]

[[fr.pages]]
title   = "Le tableau complet Camelot ↔ notation classique"
content = """
Mémoriser le mapping complet te rend plus rapide. Commence par le voisinage de 8A (La mineur / Do majeur) — la zone la plus courante en musique dance :

| Camelot | Clé mineure | Clé majeure |
|---------|-------------|-------------|
| 1A / 1B | La♭m | Si |
| 2A / 2B | Mi♭m | Fa♯ |
| 3A / 3B | Si♭m | Ré♭ |
| 4A / 4B | Fam | La♭ |
| 5A / 5B | Dom | Mi♭ |
| 6A / 6B | Solm | Si♭ |
| 7A / 7B | Rém | Fa |
| **8A / 8B** | **Lam** | **Do** |
| 9A / 9B | Mim | Sol |
| 10A / 10B | Sim | Ré |
| 11A / 11B | Fa♯m | La |
| 12A / 12B | Do♯m | Mi |

**Pourquoi la roue fonctionne** : chaque pas horaire ajoute un dièse (ou enlève un bémol) — exactement le cercle des quintes. Les numéros Camelot adjacents partagent toujours 6 des 7 notes. Cette note différente, c'est le "changement de couleur" que tu entends dans une transition par pas.

**Rappel du wrap** : 12 revient à 1. 12A et 1A sont voisins.
"""
image         = "lesson-images/camelot-wheel.png"
image_caption = "La roue Camelot — chaque pas horaire = +7 demi-tons (une quinte juste). 8A = Am est la zone la plus courante en musique dance."

[[fr.pages]]
title   = "Les 4 mouvements sûrs — et la coupe +7"
content = """
Depuis n'importe quelle clé NX, **4 clés** (plus la tienne) sont harmoniquement sûres :

| Mouvement | Depuis 8A | Notes partagées | Usage |
|-----------|---------|----------------|-------|
| **Rester** | 8A → 8A | 7/7 | Ultra-sûr, même ambiance |
| **Flip de lettre** | 8A → 8B | 7/7 (tonique diff.) | Sombre vers lumineux, mêmes notes |
| **Pas horaire** | 8A → 9A | 6/7 | Mouvement doux, une nouvelle note |
| **Pas anti-horaire** | 8A → 7A | 6/7 | Même chose, autre direction |

**Wrap le compte** : toujours compter modulo 12. 12A + 1 = **1A**. 1A - 1 = **12A**.

**Le mouvement +7 (avancé, risqué)** : certains DJs parlent d'un "energy boost +7" (même lettre, 7 positions dans le sens horaire). Voyons ce que c'est vraiment. 8A + 7 = 15, qui wrap à **3A** (Si♭m). De La mineur à Si♭ mineur, c'est juste **+1 demi-ton**. Elles ne partagent que **2 notes**, donc il n'y a pas d'harmonie à blender : les deux lignes de basse vont se battre. Ce n'est pas non plus la dominante. Ce que ça te donne, c'est un effet de montée, de "changement de ton" tendu, comme si tu pitchais le morceau d'un cran. À utiliser **uniquement en coupe nette** (nouveau morceau sur le premier temps d'une nouvelle phrase, l'ancien disparu), jamais en blend long.

Au-delà de ces mouvements, tu entres dans le territoire de la tension harmonique — pas interdit, mais intentionnel.
"""

[[fr.pages]]
title   = "Tension harmonique : l'arc ii-V-I entre morceaux"
content = """
La **cadence ii-V-I** est la résolution harmonique la plus satisfaisante de la musique occidentale : tension (ii → V) suivie de libération (V → I). Tu peux construire ça entre des morceaux, pas seulement à l'intérieur d'un.

En monde Do majeur (8B = Do majeur, 8A = La mineur) :
- **ii** = Ré mineur = **7A** (Rém est l'accord ii de Do majeur)
- **V** = Sol majeur = **9B** (Sol est la dominante de Do)
- **I** = Do majeur = **8B**

**Chemin sur la roue : 7A → 9B → 8B**

**Règle générale** : par rapport à une tonalité cible I = NB, **ii = (N-1)A** et **V = (N+1)B**. Pour I = 8B : ii = 7A, V = 9B.

Comment l'utiliser dans un set :
1. Ouvre avec un morceau en **7A** (territoire Rém — feeling légèrement irrésolu)
2. Droppe un morceau à haute énergie en **9B** (Sol majeur — la dominante, tension pleine)
3. Résous avec un anthem de peak en **8B** (Do majeur — libération, arrivée)

La foule ressent cet arc sans connaître la théorie. La résolution de 9B vers 8B atterrit avec un *clic* satisfaisant qu'un drop en même clé n'atteint jamais tout à fait.

Remarque : V → I (9B → 8B) n'est qu'un pas de ±1 sur la roue. L'arc fonctionne grâce à l'ordre dans lequel tu joues les tonalités, pas grâce à un saut spécial. Et le mouvement +7 vu plus haut n'a rien à voir avec la dominante.
"""

[[fr.pages]]
title   = "Les angles morts modaux : là où la roue ment"
content = """
La distinction A/B de Camelot n'encode que deux des sept modes :
- **A** = Éolien (mineur naturel)
- **B** = Ionien (majeur)

Les cinq autres modes sont tous **compressés dans la case A ou B la plus proche** :

| Mode | Case Camelot | Ce qui est caché |
|------|-------------|-----------------|
| **Dorien** (mineur + 6e haussée) | Anneau A | La 6e haussée peut clasher avec la 6e naturelle éolienne |
| **Phrygien** (mineur + 2e bémol) | Anneau A | La 2e bémol est une bombe de dissonance contre les voisins ioniens |
| **Lydien** (majeur + 4e haussée) | Anneau B | La 4e haussée entre en conflit avec la 4e naturelle des cases B adjacentes |
| **Mixolydien** (majeur + 7e bémol) | Anneau B | La 7e bémol entre en conflit avec la sensible des voisins ioniens |
| **Locrien** (diminué) | Anneau A | Rarement assez tonal pour compter en pratique |

**Conséquence pratique** : un morceau de deep house dorien et un morceau de techno éolien peuvent partager 8A — mais leur 6e haussée vs naturelle clashera sur tout moment mélodique soutenu. La roue dit compatible ; ton oreille peut dire le contraire.

**Le fix** : l'oreille gagne toujours. Si deux tracks partagent une case Camelot et que quelque chose sonne faux dans le blend, suspecte un mismatch modal. D'abord, assure-toi qu'une seule ligne de basse joue à la fois (bass swap). Ensuite, une brève coupe EQ des médiums (500 Hz–2 kHz) sur une platine peut adoucir un clash d'accords ou de lead le temps que tu évalues.
"""

