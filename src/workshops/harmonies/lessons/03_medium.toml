[en]
title      = "The Camelot wheel in depth: 4 safe moves, the circle of fifths, and harmonic tension"
short_desc = "The full mapping, the +7 tension cut (and why it is never a blend), ii-V-I on the wheel, and how modes create blind spots."
description = "EASY gave you the 3 basic moves. MEDIUM adds the complete Camelot ↔ classical notation table, the +7 move (a risky, cut-only tension effect), an introduction to why the wheel encodes the circle of fifths, how to use harmonic tension deliberately (the ii-V-I arc), and where the A/B encoding lies about modes. Ready to mix with intention."
recap = [
  "4 safe moves from any NX: same key, letter flip (relative), +1 step, -1 step. A fifth one exists, +7, but it is a risky cut-only effect, not a safe move.",
  "Each clockwise Camelot step = +7 semitones (a perfect fifth). Adjacent keys share 6 of 7 notes. +7 on the wheel is only +1 semitone (8A Am → 3A B♭m): just 2 notes in common, so a hard cut at best, never a long blend.",
  "Full table: 8A = Am, 8B = C, 9A = Em, 9B = G, 7A = Dm, 7B = F — know your neighborhood.",
  "The ii-V-I arc on the wheel (7A → 9B → 8B in C-major world) creates real tension and release across tracks. Rule: from I = NB, ii = (N-1)A and V = (N+1)B.",
  "Camelot only knows Aeolian (A) and Ionian (B). Dorian and Phrygian tracks land in A-ring but can clash with each other. Ear-check always wins."
]

[[en.pages]]
title   = "The complete Camelot ↔ classical table"
content = """
Memorizing the full mapping makes you faster. Start with the neighborhood around 8A (A minor / C major) — the most common zone in dance music:

| Camelot | Minor key | Major key |
|---------|-----------|-----------|
| 1A / 1B | A♭m | B |
| 2A / 2B | E♭m | F♯ |
| 3A / 3B | B♭m | D♭ |
| 4A / 4B | Fm | A♭ |
| 5A / 5B | Cm | E♭ |
| 6A / 6B | Gm | B♭ |
| 7A / 7B | Dm | F |
| **8A / 8B** | **Am** | **C** |
| 9A / 9B | Em | G |
| 10A / 10B | Bm | D |
| 11A / 11B | F♯m | A |
| 12A / 12B | C♯m | E |

**Why the wheel works**: each step clockwise adds one sharp (or removes one flat) — exactly the circle of fifths. Adjacent Camelot numbers always share 6 of 7 notes. That one different note is the "color change" you hear in a step transition.

**Wrap reminder**: 12 goes back to 1. 12A and 1A are neighbors.
"""
image         = "lesson-images/camelot-wheel.png"
image_caption = "The Camelot wheel — each clockwise step = +7 semitones (a perfect fifth). 8A = Am is the most common zone in dance music."

[[en.pages]]
title   = "The 4 safe moves — and the +7 cut"
content = """
From any key NX, **4 keys** (plus your own) are harmonically safe:

| Move | From 8A | Notes shared | Use case |
|------|---------|-------------|----------|
| **Stay** | 8A → 8A | 7/7 | Ultra-safe, same vibe |
| **Letter flip** | 8A → 8B | 7/7 (diff. tonic) | Dark to bright, same notes |
| **Step clockwise** | 8A → 9A | 6/7 | Gentle movement, one new note |
| **Step counter-clockwise** | 8A → 7A | 6/7 | Same, other direction |

**Wrap the count**: always count modulo 12. 12A + 1 = **1A**. 1A - 1 = **12A**.

**The +7 move (advanced, risky)**: some DJs talk about a "+7 energy boost" (same letter, 7 positions clockwise). Be clear about what it is. 8A + 7 = 15, which wraps to **3A** (B♭m). A minor to B♭ minor is just **+1 semitone**. They share only **2 notes**, so there is no harmony to blend: the two bass lines will fight. It is *not* the dominant either. What it gives you is a rising, tense "key change" effect, like pitching the song up a notch. Use it **only as a hard cut** (new track on the downbeat of a new phrase, old one gone), never as a long blend.

Beyond these moves, you enter harmonic tension territory — not forbidden, but intentional.
"""

[[en.pages]]
title   = "Harmonic tension: the ii-V-I arc across tracks"
content = """
The **ii-V-I cadence** is the most satisfying harmonic resolution in Western music: tension (ii → V) followed by release (V → I). You can build this across tracks, not just inside one.

In C-major world (8B = C major, 8A = A minor):
- **ii** = D minor = **7A** (Dm is the ii chord of C major)
- **V** = G major = **9B** (G is the dominant of C)
- **I** = C major = **8B**

**Wheel path: 7A → 9B → 8B**

**General rule**: relative to a target key I = NB, **ii = (N-1)A** and **V = (N+1)B**. For I = 8B: ii = 7A, V = 9B.

How to use it in a set:
1. Open with a track in **7A** (Dm territory — slightly unresolved feeling)
2. Drop a high-energy track in **9B** (G major — the dominant, full tension)
3. Resolve with a peak anthem in **8B** (C major — release, arrival)

The crowd feels this arc even without knowing theory. The resolution from 9B to 8B lands with a satisfying *click* that a same-key drop never quite achieves.

Notice that V → I (9B → 8B) is just a ±1 step on the wheel. The arc works because of the order you play the keys, not because of any special jump. And the +7 move above has nothing to do with the dominant.
"""

[[en.pages]]
title   = "Modal blind spots: where the wheel lies"
content = """
Camelot's A/B distinction only encodes two of the seven modes:
- **A** = Aeolian (natural minor)
- **B** = Ionian (major)

The other five modes all get **squeezed into the nearest A or B slot**:

| Mode | Camelot slot | What gets hidden |
|------|-------------|-----------------|
| **Dorian** (minor + raised 6) | A ring | Raised 6th can clash with Aeolian's natural 6th |
| **Phrygian** (minor + flat 2) | A ring | Flat 2nd is a dissonance bomb against Ionian neighbors |
| **Lydian** (major + raised 4) | B ring | Raised 4th conflicts with natural 4th in adjacent B slots |
| **Mixolydian** (major + flat 7) | B ring | Flat 7th conflicts with leading tone in Ionian neighbors |
| **Locrian** (diminished) | A ring | Rarely tonal enough to matter in practice |

**Practical consequence**: a Dorian deep house track and an Aeolian techno track can share 8A — but their raised-6 vs natural-6 will clash on any sustained melodic moment. The wheel says compatible; your ear may say otherwise.

**The fix**: ear-check always wins. If two tracks share a Camelot slot and something sounds off on the blend, suspect a modal mismatch. First, make sure only one bassline plays at a time (bass swap). Then a brief EQ mid-cut (500 Hz–2 kHz) on one deck can soften a chord or lead clash while you assess.
"""

