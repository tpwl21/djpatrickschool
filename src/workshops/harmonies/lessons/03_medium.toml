[fr]
title      = "La roue Camelot en profondeur : 5 mouvements, cercle des quintes et tension harmonique"
short_desc = "Le mapping complet, le +7 energy boost, l'arc ii-V-I sur la roue, et les angles morts modaux."
description = "EASY t'a donné les 3 mouvements de base. MEDIUM ajoute le tableau complet Camelot ↔ notation classique, le mouvement +7 energy boost, une introduction à pourquoi la roue encode le cercle des quintes, comment utiliser la tension harmonique délibérément (l'arc ii-V-I), et où l'encodage A/B ment sur les modes. Prêt à mixer avec intention."
recap = [
  "5 mouvements compatibles depuis NX : même clé, flip de lettre (relatif), ±1 pas, +7 energy boost.",
  "Chaque pas horaire Camelot = +7 demi-tons (une quinte juste). Les clés adjacentes partagent 6 des 7 notes. Le boost +7 partage 6 notes et injecte de l'énergie.",
  "Table complète : 8A = Am, 8B = Do, 9A = Em, 9B = Sol, 7A = Dm, 7B = Fa — connais ton voisinage.",
  "L'arc ii-V-I sur la roue (7A → 9B → 8B en monde Do majeur) crée une vraie tension et libération entre morceaux.",
  "Camelot ne connaît que l'éolien (A) et l'ionien (B). Les morceaux doriens et phrygiens atterrissent en anneau A mais peuvent clasher entre eux. L'oreille gagne toujours."
