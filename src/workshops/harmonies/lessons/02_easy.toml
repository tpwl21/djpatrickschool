[fr]
title      = "La vitesse change la voix"
short_desc = "Pas de maths. Quand tu pitches un morceau, qu'est-ce qui se passe vraiment ?"
description = "Avant Master Tempo, toutes les tables de mixage fonctionnaient comme un magnétophone : plus rapide = plus aigu. Cette leçon explique ce couplage avec ton oreille, pas une formule. Tu comprendras pourquoi le pitch-shift compte et quand activer Key Lock — sans chiffres."
recap = [
  "Lecture plus rapide = hauteur plus aiguë. Plus lente = plus grave. C'est la même physique qu'un magnétophone.",
  "Quand tu pitches un morceau vers le haut pour matcher un plus rapide, chaque instrument — kick, basse, voix — monte en hauteur aussi.",
  "Ton oreille détecte la dérive vocale plus vite que tout le reste : même 3-5 % est évident.",
  "Master Tempo (Key Lock) casse ce lien : le tempo change, la clé reste. Utilise-le pour les blends longs et les morceaux vocaux.",
  "Transition courte avec une toute petite correction de pitch (moins d'environ 1 %, soit à peu près 15 cents) : tu peux laisser Key Lock off si ça sonne mieux. Au-delà, la dérive s'entend."
]

[[fr.pages]]
title   = "L'effet magnétophone"
content = "Pense à un vieux magnétophone. Tu l'as probablement vu dans des films : quand la bande tourne vite, tout le monde ressemble à Alvin et les Chipmunks. Quand elle tourne lentement, ça ressemble à un monstre.\n\nLes tables de mixage DJ fonctionnent pareil. Quand tu montes le **fader de pitch** pour matcher un morceau plus rapide, tu accélères la bande. Tous les instruments montent en hauteur — le kick sonne plus léger, la basse remonte, et les voix (s'il y en a) commencent à dériver vers le haut.\n\nCe n'est pas un défaut. C'est de la physique. La question est : **combien de dérive le public peut-il tolérer avant que ça sonne faux ?**\n\nLa réponse dépend du morceau et de la durée du blend."

[[fr.pages]]
title   = "Ce qui dérive en premier : la voix"
content = "Tous les instruments ne révèlent pas la dérive de pitch à la même vitesse. Dans l'ordre 'à quelle vitesse le public s'en aperçoit' :\n\n1. **Les voix** — l'oreille est accordée sur la voix humaine par-dessus tout. Même un décalage de 3 % est évident sur une voix reconnaissable. C'est pour ça que mixer avec des morceaux vocaux est plus difficile : tu n'as presque pas de marge de pitch.\n\n2. **Les synths lead / boucles mélodiques** — si la mélodie est bien connue, la dérive est rapidement évidente. Des lignes de synth inconnues donnent plus de marge.\n\n3. **La ligne de basse** — une ligne de basse glissante ou montante est perceptible en quelques mesures si le blend est long.\n\n4. **Le kick et les percussions** — moins tonal, plus pardonné. Une dérive de 6 % sur un kick est à peine audible dans une salle forte.\n\nRègle : **plus le son est mélodique et reconnaissable, moins tu peux te permettre de dérive de pitch.**"

[[fr.pages]]
title   = "Key Lock (Master Tempo) : la solution"
content = "Quelque part à la fin des années 90, Pioneer a commencé à équiper ses CDJ d'une fonction appelée **Master Tempo** (Denon, Serato et Traktor l'appellent **Key Lock** ; même principe). L'idée : change le tempo, mais étire ou compresse numériquement l'audio pour que la hauteur reste la même.\n\nImagine que tu zoomes une photo sur ton écran : l'image s'agrandit mais les formes ne se déforment pas — le logiciel compense. Master Tempo est l'équivalent audio.\n\n**Active-le quand :**\n- Le blend durera plus de 30 secondes (le public remarquera la dérive)\n- Le morceau a des voix reconnaissables\n- Tu veux matcher des clés précisément pour un long ride\n- Tu pitches nettement (au-delà de quelques %) : la dérive serait évidente\n\n**Laisse-le off quand :**\n- Transition courte et serrée sous 16 mesures avec une toute petite correction (moins d'environ 1 %). Au-delà, même 8 mesures le montrent\n- Tu *veux* le lift d'énergie naturel de la montée en pitch — en peak time, pitcher un morceau de 1-2 % crée naturellement de la tension et de l'excitation"
image         = "lesson-images/pioneer-key-lock.png"
image_caption = "Bouton Master Tempo sur un CDJ-2000NXS2. Souvent étiqueté 'Key' ou 'Master Tempo'."

[[fr.pages]]
title   = "Exercice rapide — entends-le toi-même"
content = "Fais ça avec n'importe quel logiciel DJ (Serato, Rekordbox, Traktor, ou même VirtualDJ) :\n\n1. Charge le même morceau sur les deux platines.\n2. Met le pitch d'une platine à **+6 %** et laisse l'autre à **0 %**.\n3. Joue les deux simultanément — entends les deux hauteurs différentes clasher.\n4. Maintenant active **Key Lock / Master Tempo** sur la platine à +6 %.\n5. Les clés reviennent ensemble. Seuls les BPM diffèrent.\n\nCe snap, c'est l'algorithme au travail. La légère qualité 'métallique' que tu pourrais entendre est le coût de l'algorithme — il fait de l'étirement audio en temps réel, et ce n'est pas gratuit."

