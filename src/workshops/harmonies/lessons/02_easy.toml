[en]
title      = "Speed changes the voice"
short_desc = "No math. When you pitch a track up or down, what actually happens to the music?"
description = "Before Master Tempo, all DJ decks worked like a tape player: faster = higher-pitched. This lesson explains that coupling with your ear, not a formula. You'll understand why pitch-shift matters and when to flip Key Lock — no numbers required."
recap = [
  "Faster playback = higher pitch. Slower = lower. It's the same physics as a tape recorder.",
  "When you pitch a track up to match a faster one, every instrument — kick, bass, vocals — rises in pitch too.",
  "Your ear notices vocal pitch drift faster than anything else: even 3-5 % is obvious.",
  "Master Tempo (Key Lock) breaks that link: tempo changes, key stays. Use it for long blends and vocal tracks.",
  "Short transition with a tiny pitch correction (under about 1 %, roughly 15 cents): you can leave Key Lock off if it sounds better. Beyond that, the drift is audible."
]

[[en.pages]]
title   = "The tape recorder effect"
content = "Think of an old tape recorder. You've probably seen it in movies: when the tape runs fast, everyone sounds like Alvin and the Chipmunks. When it runs slow, they sound like a monster.\n\nDJ decks work the same way. When you drag the **pitch fader up** to match a faster track, you're speeding up the tape. Every instrument rises in pitch — the kick sounds lighter, the bass goes up, the vocals (if any) start to drift sharp.\n\nThis is not a flaw. It's physics. The question is: **how much drift can the crowd tolerate before it sounds wrong?**\n\nThe answer depends on the track and how long the blend lasts."

[[en.pages]]
title   = "What drifts first: the voice"
content = "Not all instruments reveal pitch drift at the same speed. In order of 'how quickly the audience notices':\n\n1. **Vocals** — the ear is tuned to the human voice above all else. Even a 3 % pitch shift is obvious on a recognizable vocal. This is why DJing with vocal tracks is harder: you have almost no pitch margin.\n\n2. **Lead synths / melodic loops** — if the tune is well-known, drift is obvious fast. Unknown synth lines give more room.\n\n3. **Bass line** — a sliding or rising bass line is noticeable within a few bars if the blend is long.\n\n4. **Kick and percussion** — least tonal, most forgiven. A 6 % drift on a kick drum is barely audible in a loud room.\n\nRule: **the more melodic and recognizable the sound, the less pitch drift you can afford.**"

[[en.pages]]
title   = "Key Lock (Master Tempo): the solution"
content = "Somewhere in the late 1990s, Pioneer started shipping CDJs with a feature called **Master Tempo** (Denon, Serato and Traktor call it **Key Lock**; same idea). The idea: change the tempo, but digitally stretch or compress the audio so the pitch stays the same.\n\nImagine you're zooming a photo on your screen: the picture gets bigger but the shapes don't distort — that's the software compensating. Master Tempo is the audio equivalent.\n\n**Turn it ON when:**\n- The blend will last more than 30 seconds (crowd will notice drift)\n- The track has recognizable vocals\n- You want to key-match two tracks precisely for a long ride\n- You are pitching clearly (beyond a few %): the drift would be obvious\n\n**Leave it OFF when:**\n- Short, tight transition under 16 bars with a tiny correction (under about 1 %). Past that, even 8 bars will show it\n- You *want* the natural energy lift of the pitch going up — at peak time, pitching a track up 1-2 % naturally creates tension and excitement"
image         = "lesson-images/pioneer-key-lock.png"
image_caption = "Master Tempo button on a CDJ-2000NXS2. Usually labeled 'Key' or 'Master Tempo'."

[[en.pages]]
title   = "Quick exercise — hear it yourself"
content = "Do this with any DJ software (Serato, Rekordbox, Traktor, or even VirtualDJ):\n\n1. Load the same track on both decks.\n2. Set one deck's pitch to **+6 %** and leave the other at **0 %**.\n3. Play both simultaneously — hear the two different pitches clash.\n4. Now flip on **Key Lock / Master Tempo** on the +6 % deck.\n5. The keys snap back together. Only the BPMs differ.\n\nThat snap is the algorithm working. The slight 'metallic' quality you might hear is the cost of the algorithm — it's doing real-time audio stretching, and it's not free."

[[en.quiz]]
question = "When you increase a track's playback speed without Key Lock, the pitch..."
answers  = ["Goes up", "Stays the same", "Goes down"]
correct  = 0

[[en.quiz]]
question = "Which sound reveals pitch drift to the audience fastest?"
answers  = ["The kick drum", "The hi-hat", "The vocals"]
correct  = 2

[[en.quiz]]
question = "When should you turn ON Master Tempo / Key Lock?"
answers  = ["Always, no exceptions", "For long blends with vocal tracks", "Only for short 4-bar transitions"]
correct  = 1

