[en]
title      = "Keys, modes & the harmonic family"
short_desc = "Major/minor, relative keys, the 7 modes in DJ context, and the pentatonic secret weapon."
description = "You know notes are colors (EASY). Now we get more precise: the difference between major and minor, how relative keys share the same 7 notes, what the diatonic modes actually are, and why 90% of dance music sits in natural minor. No sheet music — just practical ear knowledge."
recap = [
  "Major vs minor: one semitone in the third decides everything. C major (C-D-E-F-G-A-B) vs C minor (C-D-E♭-F-G-A♭-B♭).",
  "Relative keys share all 7 notes — Am and C major are siblings. On Camelot: 8A ↔ 8B. Same palette, different tonic.",
  "~90% of dance music is in natural minor (Aeolian mode). Dorian adds a brighter 6th — common in deep house. Phrygian adds a dark 2nd — common in techno.",
  "The pentatonic scale (5 notes) is found inside every major and minor key. It's why pitching an acapella up 2 semitones over a different track often still works.",
  "Neighboring keys (a fifth or fourth apart) share 6 of 7 notes. That one different note is the 'color change' you hear in a step transition."
]

[[en.pages]]
title   = "Major vs minor: the third decides"
content = """
You know a key is a family of 7 notes. What makes it feel **bright** (major) or **dark** (minor) is one note: the **third above the tonic**.

| Scale | Tonic | Third | Semitones | Feel |
|-------|-------|-------|-----------|------|
| C major | C | E | +4 | Bright, open, energetic |
| C minor | C | E♭ | +3 | Dark, intense, melancholic |
| A major | A | C♯ | +4 | Bright |
| A minor | A | C | +3 | Dark |

**One semitone.** That's the entire emotional gap between Daft Punk's "Get Lucky" (major) and most of techno (minor).

Practical stat: roughly **90% of dance music is in minor** — house, techno, drum & bass, dubstep, UK garage. Your Camelot library is mostly A-ring (minor). This is normal.
"""
image         = "lesson-images/piano-keyboard-12notes.png"
image_caption = "C major (white keys from C) vs C minor (same C, but E♭, A♭, B♭ instead)."

[[en.pages]]
title   = "Relative keys: same notes, different tonic"
content = """
Every minor key has a **relative major** that uses **exactly the same 7 notes**, just starting from a different tonic:

| Minor | Relative Major | Shared notes |
|-------|---------------|--------------|
| A minor (Am) | C major | C D E F G A B |
| E minor (Em) | G major | G A B C D E F♯ |
| D minor (Dm) | F major | F G A B♭ C D E |
| B minor (Bm) | D major | D E F♯ G A B C♯ |

On the **Camelot wheel**, relatives share the same number — just switch the letter: **8A ↔ 8B, 5A ↔ 5B, 3A ↔ 3B**...

This is the foundation of the **letter flip** move: zero new notes enter the palette, only the tonal center shifts. A minor (dark) flips to C major (bright) — same 7 notes, completely different mood. Use it to lift the energy mid-set without a hard transition.

**Producers' trick**: bassline moves from A to C over the same chord palette = immediate mood lift, no key change.
"""

[[en.pages]]
title   = "The 7 modes: minor is not just one thing"
content = """
Natural minor (Aeolian) is the most common mode in dance music — but it's not the only flavor of minor. The 7 **diatonic modes** all use the same 7-note pool as a major scale, starting from different degrees:

| Mode | Character | DJ context | Camelot slot |
|------|-----------|-----------|--------------|
| **Ionian** (major) | Bright, open | Progressive house, pop, uplifting trance | B ring |
| **Dorian** | Minor + raised 6th → slightly brighter | Deep house, Afrobeat, neo-soul | A ring |
| **Phrygian** | Minor + flat 2nd → very dark, Spanish feel | Techno, flamenco, metal | A ring |
| **Lydian** | Major + raised 4th → dreamy | Film scores, Vangelis, some ambient | B ring |
| **Mixolydian** | Major + flat 7th → funky | Funk, classic rock, some trance | B ring |
| **Aeolian** (natural minor) | Standard dark minor | **~90% of electronic dance music** | A ring |
| **Locrian** | Unstable, diminished tonic | Extreme metal, avant-garde | A ring |

**Camelot blind spot**: the wheel only distinguishes A (Aeolian) from B (Ionian). A Dorian track and an Aeolian track can share the same Camelot slot — but their raised-6 vs natural-6 may clash on sustained harmonic moments. Always ear-check.
"""

[[en.pages]]
title   = "The pentatonic secret weapon"
content = """
Inside every major and minor key lives a **pentatonic scale** — just 5 of the 7 notes, chosen to remove the two most dissonant intervals.

- **A minor pentatonic**: A · C · D · E · G (removes F and B from A natural minor)
- **C major pentatonic**: C · D · E · G · A (removes F and B from C major)

Notice: A minor pentatonic and C major pentatonic are the **same 5 notes**. They're relative pentatonics — just like their full-scale relatives.

**Why this matters for DJs**:

1. **Acapella pitching**: if a vocal is pentatonic (which most pop and soul hooks are), you can transpose it ±2–3 semitones and it'll still work over an unrelated instrumental — the dissonant notes don't exist in the vocal to clash with.

2. **Key detection uncertainty**: Camelot analyzers sometimes tag a Dorian track as its relative major instead. If you hear a suspicious tag, ask: "does this track sound brighter or darker than its ring should?" Your ear disambiguates what the algorithm can't.

3. **Safe territory**: if two tracks share the same 5-note pentatonic, they blend without any clashes, even if the Camelot codes differ. Trust your ear over the tag.
"""

[[en.quiz]]
question = "What determines whether a key sounds major (bright) or minor (dark)?"
answers  = ["The tempo of the track", "The third note above the tonic — 4 semitones = major, 3 semitones = minor", "The number of sharps or flats in the key signature"]
correct  = 1

[[en.quiz]]
question = "On the Camelot wheel, 8A (A minor) and 8B (C major) are relative keys. What do they share?"
answers  = ["The same BPM", "All 7 notes — same palette, different tonic", "Only 5 of 7 notes"]
correct  = 1

[[en.quiz]]
question = "Which mode dominates electronic dance music (house, techno, drum & bass)?"
answers  = ["Ionian (major)", "Dorian (minor + raised 6th)", "Aeolian (natural minor)"]
correct  = 2

[[en.quiz]]
question = "A Dorian track and an Aeolian track share the same Camelot slot. Can they clash?"
answers  = ["No — same slot always means perfectly safe", "Yes — the raised 6th in Dorian can clash with the natural 6th in Aeolian on sustained harmonic moments", "Only if their BPMs are different"]
correct  = 1

[[en.quiz]]
