[fr]
title      = "Tonalités, modes & famille harmonique"
short_desc = "Majeur/mineur, clés relatives, les 7 modes en contexte DJ, et l'arme secrète pentatonique."
description = "Tu sais que les notes sont des couleurs (EASY). Maintenant on devient plus précis : la différence entre majeur et mineur, comment les clés relatives partagent les mêmes 7 notes, ce que sont vraiment les modes diatoniques, et pourquoi 90% de la musique dance est en mineur naturel. Pas de solfège — juste de la connaissance d'oreille pratique."
recap = [
  "Majeur vs mineur : un seul demi-ton dans la tierce décide de tout. Do majeur (C-D-E-F-G-A-B) vs Do mineur (C-D-E♭-F-G-A♭-B♭).",
  "Les clés relatives partagent les 7 mêmes notes — Am et Do majeur sont des frères. En Camelot : 8A ↔ 8B. Même palette, tonique différente.",
  "~90% de la musique dance est en mineur naturel (mode éolien). Le dorien ajoute une 6e plus lumineuse — courant en deep house. Le phrygien ajoute une 2e sombre — courant en techno.",
  "La gamme pentatonique (5 notes) se trouve dans chaque clé majeure et mineure. C'est pourquoi pitcher un acapella de 2 demi-tons sur un instrumental différent fonctionne souvent.",
  "Les clés voisines (à une quinte ou quarte) partagent 6 des 7 notes. Cette note différente, c'est le 'changement de couleur' que tu entends dans une transition par pas."
]

[[fr.pages]]
title   = "Majeur vs mineur : la tierce décide"
content = """
Tu sais qu'une tonalité = une famille de 7 notes. Ce qui la rend **lumineuse** (majeur) ou **sombre** (mineur), c'est une seule note : la **tierce au-dessus de la tonique**.

| Gamme | Tonique | Tierce | Demi-tons | Feeling |
|-------|---------|--------|-----------|---------|
| Do majeur | Do | Mi | +4 | Lumineux, ouvert, énergique |
| Do mineur | Do | Mi♭ | +3 | Sombre, intense, mélancolique |
| La majeur | La | Do♯ | +4 | Lumineux |
| La mineur | La | Do | +3 | Sombre |

**Un seul demi-ton.** C'est tout l'écart émotionnel entre "Get Lucky" de Daft Punk (majeur) et la majorité de la techno (mineur).

Stat pratique : environ **90% de la musique dance est en mineur** — house, techno, drum & bass, dubstep, UK garage. Ta bibliothèque Camelot est surtout en anneau A (mineur). C'est normal.
"""
image         = "lesson-images/piano-keyboard-12notes.png"
image_caption = "Do majeur (touches blanches depuis Do) vs Do mineur (même Do, mais Mi♭, La♭, Si♭)."

[[fr.pages]]
title   = "Les clés relatives : mêmes notes, tonique différente"
content = """
Chaque clé mineure a une **clé majeure relative** qui utilise **exactement les 7 mêmes notes**, juste en partant d'une tonique différente :

| Mineur | Relatif majeur | Notes partagées |
|--------|---------------|-----------------|
| La mineur (Am) | Do majeur | Do Ré Mi Fa Sol La Si |
| Mi mineur (Em) | Sol majeur | Sol La Si Do Ré Mi Fa♯ |
| Ré mineur (Dm) | Fa majeur | Fa Sol La Si♭ Do Ré Mi |
| Si mineur (Bm) | Ré majeur | Ré Mi Fa♯ Sol La Si Do♯ |

Sur la **roue Camelot**, les relatifs partagent le même numéro — change juste la lettre : **8A ↔ 8B, 5A ↔ 5B, 3A ↔ 3B**...

C'est la base du mouvement **flip de lettre** : zéro nouvelle note dans la palette, seulement le centre tonal qui change. La mineur (sombre) flip vers Do majeur (lumineux) — mêmes 7 notes, ambiance complètement différente. Utilise-le pour lifter l'énergie en plein set sans transition dure.

**Astuce producer** : la ligne de basse passe de La à Do sur la même palette d'accords = lift immédiat, sans changement de clé.
"""

[[fr.pages]]
title   = "Les 7 modes : le mineur n'est pas qu'une seule chose"
content = """
Le mineur naturel (éolien) est le mode le plus courant en musique dance — mais ce n'est pas la seule saveur de mineur. Les 7 **modes diatoniques** utilisent tous le même pool de 7 notes qu'une gamme majeure, en partant de degrés différents :

| Mode | Caractère | Contexte DJ | Case Camelot |
|------|-----------|-------------|--------------|
| **Ionien** (majeur) | Lumineux, ouvert | Progressive house, pop, trance uplifting | Anneau B |
| **Dorien** | Mineur + 6e haussée → légèrement plus lumineux | Deep house, Afrobeat, neo-soul | Anneau A |
| **Phrygien** | Mineur + 2e bémol → très sombre, saveur espagnole | Techno, flamenco, metal | Anneau A |
| **Lydien** | Majeur + 4e haussée → rêveur | Bandes originales, Vangelis, ambient | Anneau B |
| **Mixolydien** | Majeur + 7e bémol → funky | Funk, rock classique, certaine trance | Anneau B |
| **Éolien** (mineur naturel) | Mineur sombre standard | **~90% de la musique dance électronique** | Anneau A |
| **Locrien** | Instable, tonique diminuée | Metal extrême, avant-garde | Anneau A |

**Angle mort Camelot** : la roue distingue seulement A (éolien) de B (ionien). Un morceau dorien et un morceau éolien peuvent partager la même case Camelot — mais leur 6e haussée vs naturelle peut clasher sur les moments harmoniques soutenus. Vérifie toujours à l'oreille.
"""

[[fr.pages]]
title   = "L'arme secrète pentatonique"
content = """
À l'intérieur de chaque clé majeure ou mineure vit une **gamme pentatonique** — juste 5 des 7 notes, choisies pour supprimer les deux intervalles les plus dissonants.

- **La mineur pentatonique** : La · Do · Ré · Mi · Sol (supprime Fa et Si du La mineur naturel)
- **Do majeur pentatonique** : Do · Ré · Mi · Sol · La (supprime Fa et Si du Do majeur)

Remarque : La mineur pentatonique et Do majeur pentatonique contiennent **les 5 mêmes notes**. Ce sont des pentatoniques relatives — comme leurs gammes complètes relatives.

**Pourquoi ça compte pour les DJs** :

1. **Pitcher un acapella** : si une voix est pentatonique (la plupart des hooks pop et soul le sont), tu peux la transposer de ±2-3 demi-tons et elle fonctionnera toujours sur un instrumental sans rapport — les notes dissonantes n'existent pas dans la voix pour clasher.

2. **Incertitude de détection de clé** : les analyseurs Camelot taguent parfois un morceau dorien comme son relatif majeur. Si tu vois un tag suspect, demande-toi : "ce morceau sonne-t-il plus lumineux ou sombre que son anneau devrait indiquer ?" Ton oreille désambiguïse ce que l'algo ne peut pas.

3. **Territoire sûr** : si deux tracks partagent les mêmes 5 notes pentatoniques, elles blendent sans clash, même si les codes Camelot diffèrent. Fais confiance à ton oreille plus qu'au tag.
"""

