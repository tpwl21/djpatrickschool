[fr]
title      = "Pitch shift, dérive de clé & Master Tempo — les chiffres qui comptent"
short_desc = "La formule, les seuils JND en pratique, et le choix workflow : Key Lock on ou off ?"
description = "EASY a expliqué l'effet magnétophone par le ressenti. Ici on ajoute les chiffres : la formule en demi-tons, les seuils de perception qui déterminent quand la dérive devient un problème, et un cadre de décision clair pour Master Tempo. Pas de théorie d'algorithmes en profondeur — c'est pour le PRO — mais assez de maths pour faire des choix éclairés en plein set."
recap = [
  "Pitch et tempo sont couplés sur vinyle : +6% BPM ≈ +1 demi-ton vers le haut. La formule : demi-tons = 12 × log₂(taux), où taux = BPM_nouveau / BPM_natif.",
  "JND (seuil perceptible) : ~5-6 cents isolé, ~15-25 cents en mix dense. Les clés commencent à clasher audiblement autour de 50 cents (½ demi-ton).",
  "Master Tempo (Key Lock) casse le couplage par time-stretching. Propre dans ±6-8%. Au-delà, des artefacts métalliques apparaissent.",
  "Règle : Master Tempo ON pour les blends de plus de 30 secondes ou avec des tracks vocales. OFF pour les transitions serrées sous 16 mesures ou les lifts de pitch en peak-time.",
  "Raccourci pratique : +6% de pitch ≈ 1 demi-ton = un pas sur la gamme chromatique. +12% ≈ 2 demi-tons. Connais ta plage de fader."
]

[[fr.pages]]
title   = "La formule : demi-tons depuis le pourcentage de pitch"
content = """
Quand tu déplaces le fader de pitch, tu changes le **taux de lecture** — et ça décale la clé. La relation est logarithmique (base 2), parce que la perception du pitch est logarithmique :

**demi-tons = 12 × log₂(taux)**
**taux = 2^(demi-tons / 12)**

Où `taux = BPM_nouveau / BPM_natif`.

| Fader de pitch | Décalage en demi-tons | Exemple de clé (départ en Am) |
|----------------|----------------------|-------------------------------|
| +1% | +0,17 demi-ton | Encore Am (à peine) |
| +3% | +0,51 demi-ton | ~Am (limite) |
| **+6%** | **+1,01 demi-ton** | **A♯m / Si♭m** |
| +8% | +1,38 demi-ton | Entre A♯m et Bm |
| +12% | +2,0 demi-tons | Bm |
| +50% | +7,02 demi-tons | Em (une quinte juste plus haut) |

**À retenir** : une plage de fader typique de ±8% signifie que tu peux dériver de presque **1,5 demi-ton** depuis ta clé native. C'est bien au-dessus du seuil d'écoute sur un blend long.
"""

[[fr.pages]]
title   = "JND : quand le public le remarque-t-il ?"
content = """
Le **JND (just-noticeable difference)** en pitch te dit quelle dérive est "safe" :

| Contexte | JND | Ce que ça signifie pour le DJ |
|---------|-----|-------------------------------|
| Ton pur isolé | ~5-6 cents | Référence académique — pas ton vrai scénario |
| Instrument / voix complexe | ~8-10 cents | Instrument solo dans une salle calme |
| Mix dense (beat + basse + 2 tracks) | **15-25 cents** | Ton vrai scénario — le masking spectral aide |
| Transition courte (≤ 8 mesures) | **~50 cents survivable** | L'oreille n'a pas encore calé son centre tonal |
| Blend long (2+ minutes) | **25-30 cents audible** | L'oreille calibre dans le temps et attrape la dérive |

**La règle des 50 cents** : une dérive d'un demi-demi-ton (50 cents) est survivable dans une coupe de 4-8 mesures. Étirée à 2 minutes, elle devient douloureuse — l'intégration temporelle de l'oreille expose ce qu'elle avait d'abord toléré.

**Tracks vocales** : la voix humaine est le son que l'oreille suit avec le plus de précision. Une dérive de 3-5% sur une voix reconnaissable est immédiatement évidente — même à 3 cents sur une voix claire. Si ton blend a des voix, traite le seuil comme 2-3× plus strict.
"""
youtube         = "https://www.youtube.com/watch?v=e-5IvBopM7Y"
youtube_caption = "Set vinyle classique — écoute comment la foule réagit quand des sauts de BPM causent une dérive de pitch audible sur les voix."

[[fr.pages]]
title   = "Master Tempo : l'arbre de décision"
content = """
**Master Tempo (Key Lock)** étire ou compresse numériquement l'audio pour que le tempo change mais le pitch reste fixe. Ça fonctionne proprement dans ±6-8% — au-delà, des artefacts apparaissent (qualité métallique, transitoires floues).

**Active-le quand :**
- Le blend durera plus de 30 secondes (assez longtemps pour que l'oreille capte la dérive)
- Le morceau a des voix reconnaissables ou un hook mélodique connu
- Tu as calé deux tracks en key-match et une correction de +5%+ casserait le match Camelot
- Tu droppes un acapella sur un instrumental à un BPM différent

**Laisse-le off quand :**
- Transition courte et serrée sous 16 mesures — la dérive est sous le JND pour cette durée
- Tu *veux* le lift d'énergie naturel : pitcher une track de 1-2% en peak time crée une excitation subtile ; Key Lock tue ça
- Esthétique vinyl-puriste — la dérive de pitch fait partie du son

**Habitude de workflow** : la plupart des pros laissent Master Tempo ON par défaut et le coupent uniquement pour des mouvements précis. Fais le point : tu sais dans quel état est ton Key Lock maintenant ?
"""
image         = "lesson-images/pioneer-key-lock.png"
image_caption = "Bouton Master Tempo sur un CDJ-2000NXS2. Souvent étiqueté 'Key' ou 'Master Tempo'."

[[fr.pages]]
title   = "Test pratique : entends les chiffres"
content = """
Fais ça dans n'importe quel logiciel DJ (Rekordbox, Serato, Traktor, VirtualDJ) :

1. Charge le même morceau sur les deux platines — fichier identique, clé identique.
2. Met le pitch de la platine B à **+6%**. Joue les deux simultanément.
3. Tu entends un intervalle d'environ 1 demi-ton — le 'battement' ou la tension entre les deux platines.
4. Maintenant active **Key Lock** sur la platine B. Les clés se recalent, seuls les BPM diffèrent.
5. Essaie +3% (un demi demi-ton). Puis +12% (2 demi-tons). Entends les étapes.

**Avancé** : charge deux tracks de la même case Camelot (ex : toutes les deux en 8A). Pitche l'une de +7% — tu viens de la dériver vers environ A♯m. Joue le blend. Ça sonne encore bien, ou y a-t-il un clash ? Ton oreille calibre le seuil de 50 cents en temps réel.
"""

