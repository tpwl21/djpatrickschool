[en]
title      = "Pitch shift, key drift & Master Tempo — the numbers that matter"
short_desc = "The formula, the JND thresholds in practice, and the workflow decision: Key Lock on or off?"
description = "EASY explained the tape-recorder effect by feel. Here we add the numbers: the semitone formula, the perception thresholds that determine when drift becomes a problem, and a clear decision framework for Master Tempo. No deep algorithm theory — that's PRO — but enough math to make informed choices mid-set."
recap = [
  "Pitch and tempo are coupled on vinyl: +6% BPM ≈ +1 semitone up. The formula: semitones = 12 × log₂(rate), where rate = new_BPM / native_BPM.",
  "JND (just-noticeable difference): ~5-6 cents isolated, ~15-25 cents in a dense mix. Keys start clashing audibly around 50 cents (½ semitone).",
  "Master Tempo (Key Lock) breaks the coupling via time-stretching. Clean within ±6-8%. Beyond that, metallic artifacts appear.",
  "Rule: Master Tempo ON for blends over 30 seconds or with vocal tracks. OFF for tight transitions under 16 bars or deliberate peak-time pitch lifts.",
  "Practical shortcut: +6% pitch ≈ 1 semitone = one step on a chromatic scale. +12% ≈ 2 semitones. Know your fader range."
]

[[en.pages]]
title   = "The formula: semitones from pitch percentage"
content = """
When you drag the pitch fader, you're changing the **playback rate** — and that shifts the key. The relationship is logarithmic (base 2), because pitch perception is logarithmic:

**semitones = 12 × log₂(rate)**
**rate = 2^(semitones / 12)**

Where `rate = new_BPM / native_BPM`.

| Pitch fader | Approximate semitone shift | Key example (starting in Am) |
|-------------|---------------------------|------------------------------|
| +1% | +0.17 semitones | Still Am (barely) |
| +3% | +0.51 semitones | ~Am (borderline) |
| **+6%** | **+1.01 semitones** | **A♯m / B♭m** |
| +8% | +1.38 semitones | Between A♯m and Bm |
| +12% | +2.0 semitones | Bm |
| +50% | +7.02 semitones | Em (a perfect fifth up) |

**Takeaway**: a typical pitch fader range of ±8% means you can drift nearly **1.5 semitones** off your native key. That's well above the listening threshold in a long blend.
"""

[[en.pages]]
title   = "JND: when does the audience notice?"
content = """
The **just-noticeable difference (JND)** for pitch tells you how much drift is "safe":

| Context | JND | What it means for DJs |
|---------|-----|----------------------|
| Isolated pure tone | ~5-6 cents | Academic benchmark — not your real scenario |
| Complex instrument/voice | ~8-10 cents | Solo instrument in a quiet room |
| Dense mix (beat + bass + 2 tracks) | **15-25 cents** | Your real scenario — spectral masking helps |
| Short transition (≤ 8 bars) | **~50 cents survivable** | The ear hasn't locked to a tonal center yet |
| Long blend (2+ minutes) | **25-30 cents audible** | The ear calibrates over time and catches drift |

**The 50-cent rule**: a half-semitone drift (50 cents) is survivable in a 4-8 bar cut. Stretched to 2 minutes, it becomes painful — the ear's temporal integration exposes what it initially tolerated.

**Vocal tracks**: the human voice is the most pitch-sensitive sound the ear tracks. A 3-5% pitch drift on a recognizable vocal is immediately obvious — even at 3 cents on a clear voice. If your blend has vocals, treat the threshold as 2-3× stricter.
"""
youtube         = "https://www.youtube.com/watch?v=e-5IvBopM7Y"
youtube_caption = "Classic vinyl set — listen for how the crowd reacts when BPM jumps cause audible pitch drift on vocals."

[[en.pages]]
title   = "Master Tempo: the decision tree"
content = """
**Master Tempo (Key Lock)** digitally stretches or compresses the audio so tempo changes but pitch stays fixed. It works cleanly within ±6-8% — beyond that, artifacts appear (metallic quality, smeared transients).

**Turn it ON when:**
- Blend will last more than 30 seconds (long enough for the ear to catch drift)
- Track has recognizable vocals or a well-known melodic hook
- You've key-matched two tracks and a +5%+ pitch correction would break the Camelot match
- Dropping an acapella over an instrumental at a different BPM

**Leave it OFF when:**
- Short, tight transition under 16 bars — the drift is below the JND for that duration
- You *want* the natural energy lift: pitching a track up 1-2% at peak time creates a subtle excitement; Key Lock kills that
- Vinyl-purist aesthetic — the pitch drift is part of the sound

**Workflow habit**: most pros leave Master Tempo ON by default and switch it OFF only for specific moves. Audit your setup: do you know what state your Key Lock is in right now?
"""
image         = "lesson-images/pioneer-key-lock.png"
image_caption = "Master Tempo button on a CDJ-2000NXS2. Usually labeled 'Key' or 'Master Tempo'."

[[en.pages]]
title   = "Practical test: hear the numbers"
content = """
Do this in any DJ software (Rekordbox, Serato, Traktor, VirtualDJ):

1. Load the same track on both decks — identical file, identical key.
2. Set deck B pitch to **+6%**. Play both simultaneously.
3. You're hearing a ~1 semitone interval — the 'beating' or tension between the two decks.
4. Now flip **Key Lock** on deck B. The keys snap back together, only BPMs differ.
5. Try +3% (half a semitone). Then +12% (2 semitones). Hear the steps.

**Advanced**: load two tracks from the same Camelot slot (e.g., both 8A). Pitch one by +7% — you've just drifted it to roughly A♯m. Play the blend. Does it still sound okay, or is there clash? That's your ear calibrating the 50-cent threshold in real time.
"""

[[en.quiz]]
question = "A track is at 120 BPM natively. You pitch it to 127.2 BPM (+6%). Approximately how many semitones has its key shifted?"
answers  = ["0.17 semitones (barely noticeable)", "1 semitone (one half-step)", "6 semitones (a tritone)"]
correct  = 1

