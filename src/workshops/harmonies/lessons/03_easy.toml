[fr]
title      = "Ton anti-sèche DJ : la roue Camelot"
short_desc = "Un cadran d'horloge avec des lettres. C'est tout. Voici comment le lire et l'utiliser ce soir."
description = "La roue Camelot semble compliquée au premier coup d'oeil. Ce n'est pas le cas. C'est une horloge avec 12 chiffres et 2 lettres. Cette leçon t'apprend les 3 mouvements qui couvrent l'essentiel du mix harmonique — pas besoin de théorie musicale."
recap = [
  "La roue est une horloge : 12 chiffres, A (mineur/sombre) à l'intérieur, B (majeur/lumineux) à l'extérieur.",
  "Mouvement 1 — Rester : joue la prochaine track au même chiffre et même lettre. Zéro risque.",
  "Mouvement 2 — Flip : change uniquement la lettre (8A → 8B). Mêmes notes, ambiance différente. Sombre vers lumineux.",
  "Mouvement 3 — Pas : va d'un chiffre en avant ou en arrière (8A → 9A ou 7A). Une petite couleur nouvelle entre.",
  "Vérifie toujours : est-ce que le code Camelot de la prochaine track correspond à l'un de tes 3 mouvements ? Si oui, blende librement."
]

[[fr.pages]]
title   = "Ce qu'est vraiment la roue"
content = "La roue Camelot a été créée vers 2005 par Mark Davis de Mixed In Key. Il a pris un concept de théorie musicale appelé le **cercle des quintes** et l'a rendu accessible aux DJs : au lieu des armures et des dièses/bémols, tu obtiens **un chiffre et une lettre**.\n\nC'est vraiment tout :\n- **Chiffre (1-12)** : pense-y comme une position sur un cadran d'horloge. Les chiffres adjacents sont musicalement proches.\n- **Lettre A** : le morceau est dans une tonalité mineure (son plus sombre, plus profond).\n- **Lettre B** : le morceau est dans une tonalité majeure (son plus lumineux, plus ouvert).\n\n**8A = La mineur** (une tonalité commune de techno/house sombre). **8B = Do majeur** (son relatif lumineux). Mêmes 7 notes, ambiance totalement différente.\n\n**Lire les lettres que tu verras dans le jeu** : les musiciens anglophones nomment les notes avec des lettres, **A = La, B = Si, C = Do, D = Ré, E = Mi, F = Fa, G = Sol**, et un petit **m** veut dire mineur. Donc **Am = La mineur**, **Fm = Fa mineur**, **F♯m = Fa dièse mineur** ; sans m, c'est majeur (**C = Do majeur**).\n\n**Attention, deux systèmes différents** : le **A ou B d'un code Camelot** (8A, 8B) dit seulement mineur (A) ou majeur (B). Ça n'a rien à voir avec la note La. 8A se trouve être La mineur, mais 5A est Do mineur et 8B est Do majeur. Test simple : une lettre Camelot suit toujours un chiffre (8A) ; un nom de note est seul ou avec un m (Am). (Rekordbox, Serato, Traktor) peut détecter le code Camelot automatiquement. Chaque morceau de ta bibliothèque peut avoir un code. Ensuite le mix devient : *est-ce que les codes matchent ?*"
image         = "lesson-images/camelot-wheel.png"
image_caption = "La roue Camelot. Chiffres 1-12, A (anneau intérieur, mineur) et B (anneau extérieur, majeur)."

[[fr.pages]]
title   = "Les 3 mouvements dont tu as besoin"
content = "Depuis n'importe quelle tonalité de départ, 3 mouvements te gardent harmoniquement en sécurité :\n\n**Mouvement 1 — RESTER (même NX → même NX)**\nJoue deux tracks dans la même tonalité. Zéro clash, sécurité totale. Si l'énergie est bonne, reste toute la nuit en 8A.\n\n**Mouvement 2 — FLIP (NX → N, autre lettre)**\nChange uniquement la lettre : 8A → 8B, ou 5B → 5A. Tu restes sur les **mêmes 7 notes** mais tu fais changer l'ambiance — mineur vers majeur = un 'lift', majeur vers mineur = une 'plongée dans un territoire plus sombre'. C'est l'un des mouvements les plus puissants en musique électronique.\n\n**Mouvement 3 — PAS (NX → (N+1)X ou (N-1)X)**\nVa d'un pas dans le sens horaire ou anti-horaire sur la roue, même lettre. 8A → 9A ou 8A → 7A. Une nouvelle note entre dans la palette, créant un mouvement harmonique doux. Ça ressemble à de la musique qui 'voyage' quelque part."

[[fr.pages]]
title   = "Le wrap : 12 revient à 1"
content = "La roue est un **cercle**, pas une ligne droite. Après 12, elle revient à 1.\n\nÇa piège les débutants : **12A et 1A sont voisins**, pas ennemis. Ils ne sont qu'à un pas l'un de l'autre.\n\nDonc si tu es sur 12A et veux faire un pas en avant, tu vas à 1A — pas hors de la roue.\n\n**Test rapide** : qu'est-ce que 12B un pas en avant ?\n→ 1B. C'est tout. Toujours wrapper à 12."

[[fr.pages]]
title   = "Pratique : lis le code avant de cuer"
content = "Voici une habitude simple qui va transformer tes mixes :\n\n**Avant chaque transition** : regarde le code Camelot du morceau qui joue, et le code du morceau que tu t'apprêtes à dropper.\n\nPose-toi une seule question : **est-ce que le prochain code est à 1 mouvement du code actuel ?**\n- Identique ? → Blende librement.\n- Lettre flippée, même chiffre ? → Blende librement (shift de mood).\n- ±1 sur le chiffre, même lettre ? → Blende librement (mouvement doux).\n- Autre chose ? → Soit choisis une autre track, soit planifie une coupe courte plutôt qu'un long blend.\n\nTu n'as pas besoin de savoir lire la musique. Tu as juste besoin de lire le code. (Si tu vois 'Am' ou 'Fm' dans le jeu, c'est juste un nom de note plus m pour mineur.) C'est tout le workflow."

