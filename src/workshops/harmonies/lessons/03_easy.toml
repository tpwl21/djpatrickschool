[en]
title      = "Your DJ cheat-sheet: the Camelot wheel"
short_desc = "A clock face with letters. That's it. Here's how to read it and use it tonight."
description = "The Camelot wheel looks complicated at first. It's not. It's a clock with 12 numbers and 2 letters. This lesson teaches you the 3 moves that cover most of harmonic DJ mixing — no music theory needed."
recap = [
  "The wheel is a clock: 12 numbers, A (minor/dark) on the inside, B (major/bright) on the outside.",
  "Move 1 — Stay: play the next track at the same number and letter. Zero risk.",
  "Move 2 — Flip: change only the letter (8A → 8B). Same notes, different mood. Dark to bright.",
  "Move 3 — Step: go one number forward or back (8A → 9A or 7A). One small new color enters.",
  "Always check: does the next track's Camelot code match one of your 3 moves? If yes, blend freely."
]

[[en.pages]]
title   = "What the wheel actually is"
content = "The Camelot wheel was created around 2005 by Mark Davis of Mixed In Key. He took a music theory concept called the **circle of fifths** and made it easy for DJs: instead of key signatures and flats/sharps, you get **a number and a letter**.\n\nThat's really it:\n- **Number (1-12)**: think of it as a position on a clock face. Adjacent numbers are musically close.\n- **Letter A**: the track is in a minor key (darker, deeper sound).\n- **Letter B**: the track is in a major key (brighter, more open sound).\n\n**8A = A minor** (a common dark techno/house key). **8B = C major** (its bright relative). Same 7 notes, totally different vibe.\n\n**Reading the letters you'll see in the game**: English-speaking musicians name notes with letters, **A = La, B = Si, C = Do, D = Ré, E = Mi, F = Fa, G = Sol**, and a small **m** means minor. So **Am = La mineur**, **Fm = Fa mineur**, **F♯m = Fa dièse mineur**; no m means major (**C = Do majeur**).\n\n**Careful, two different systems**: the **A or B in a Camelot code** (8A, 8B) only says minor (A) or major (B). It has nothing to do with the note A. 8A happens to be A minor, but 5A is C minor and 8B is C major. Easy check: a Camelot letter always follows a number (8A); a note name stands alone or with an m (Am).\n\nYour DJ software (Rekordbox, Serato, Traktor) can detect the Camelot code automatically. Every track in your library can have a code. Then mixing becomes: *do the codes match?*"
image         = "lesson-images/camelot-wheel.png"
image_caption = "The Camelot wheel. Numbers 1-12, A (inner ring, minor) and B (outer ring, major)."

[[en.pages]]
title   = "The 3 moves you need"
content = "From any starting key, 3 moves keep you harmonically safe:\n\n**Move 1 — STAY (same NX → same NX)**\nPlay two tracks in the same key. Zero clash, complete safety. If the energy is right, stay all night in 8A.\n\n**Move 2 — FLIP (NX → N, other letter)**\nChange only the letter: 8A → 8B, or 5B → 5A. You stay on the **same 7 notes** but shift the mood — minor to major is a 'lift', major to minor is a 'drop into darker territory'. This is one of the most powerful moves in electronic music.\n\n**Move 3 — STEP (NX → (N+1)X or (N-1)X)**\nGo one step clockwise or counter-clockwise on the wheel, same letter. 8A → 9A or 8A → 7A. One new note enters the palette, creating a gentle harmonic movement. Sounds like the music is 'traveling' somewhere."

[[en.pages]]
title   = "The wrap-around: 12 goes back to 1"
content = "The wheel is a **circle**, not a straight line. After 12, it wraps back to 1.\n\nThis trips beginners up: **12A and 1A are neighbors**, not enemies. They're only one step apart.\n\nSo if you're on 12A and want to step forward, you go to 1A — not off the wheel.\n\n**Quick test**: what's 12B stepped forward one position?\n→ 1B. That's it. Always wrap at 12."

[[en.pages]]
title   = "Practice: read the code before you cue"
content = "Here's a simple habit that will transform your mixes:\n\n**Before every transition**: look at the Camelot code of the track currently playing, and the code of the track you're about to drop.\n\nAsk yourself one question: **is the next code within 1 move of the current code?**\n- Same? → Blend freely.\n- Letter flipped, same number? → Blend freely (mood shift).\n- ±1 on the number, same letter? → Blend freely (gentle movement).\n- Anything else? → Either choose a different track, or plan a short cut instead of a long blend.\n\nYou don't need to read music. You just need to read the code. (If you see 'Am' or 'Fm' in the game, that's only a note name plus m for minor.) That's the whole workflow."

[[en.quiz]]
question = "On the Camelot wheel, what does the letter 'A' stand for?"
answers  = ["A major key (bright)", "A minor key (darker, deeper)", "The note A (La)"]
correct  = 1

[[en.quiz]]
question = "You're playing 6A. The next track is 6B. Are they compatible?"
answers  = ["No — different letters means different family", "Yes — same number, letter flip = relative keys, same 7 notes", "Only if the BPMs match exactly"]
correct  = 1

[[en.quiz]]
question = "You're on 12A and want to step one position forward. You go to..."
answers  = ["13A (doesn't exist)", "1A (wraps around)", "12B"]
correct  = 1

[[en.quiz]]
question = "Which of the following is NOT one of the 3 basic Camelot moves?"
answers  = ["Stay (same code)", "Step (±1 on the number)", "Jump (+6 positions)"]
correct  = 2

